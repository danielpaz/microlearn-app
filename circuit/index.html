<style>
/* Layout: fixed app shell, top nav (.Micro family), main is the only scroller; lesson = text column + circuit canvas */
:root{
  --bg:#eef3f0; --surface:#ffffff; --surface-2:#f6f9f7; --fg:#15201b; --muted:#5b6b63; --line:#d3ddd7;
  --accent:#2a9d65; --accent-ink:#ffffff; --accent-soft:#dcefe5;
  --head:#17221d; --head-fg:#e6efe9; --head-muted:#93a69c;
  --hi:#3fd06b; --lo:#1f5a35; --x:#d64545; --ok:#2a9d65; --bad:#c94242;
  --canvas:#ffffff; --grid:#d7e0db; --gate:#1b2620; --gate-fill:#ffffff; --sel:#2a7fd1;
  --display:'Chakra Petch',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1b2520; --fg:#e3ece7; --muted:#97a89f; --line:#2b3832;
  --accent:#43c27f; --accent-ink:#08130d; --accent-soft:#1d3a2b;
  --head:#0a0f0c; --head-fg:#e3ece7; --head-muted:#7f9187;
  --lo:#2b6a42; --canvas:#111915; --grid:#26332c; --gate:#d8e4dd; --gate-fill:#18221d; --sel:#5aa7f0; --bad:#e06464; --x:#e06464;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e1a; --surface-2:#1b2520; --fg:#e3ece7; --muted:#97a89f; --line:#2b3832;
  --accent:#43c27f; --accent-ink:#08130d; --accent-soft:#1d3a2b;
  --head:#0a0f0c; --head-fg:#e3ece7; --head-muted:#7f9187;
  --lo:#2b6a42; --canvas:#111915; --grid:#26332c; --gate:#d8e4dd; --gate-fill:#18221d; --sel:#5aa7f0; --bad:#e06464; --x:#e06464;
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column}
header.top{flex-shrink:0;background:var(--head);color:var(--head-fg);
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;gap:20px;min-height:56px;max-width:1240px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em;color:var(--head-fg);text-decoration:none;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
.brand b{color:var(--hi);font-weight:600}
.brand svg{width:26px;height:26px}
nav.menu{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu button{background:none;border:0;color:var(--head-muted);font:500 14px var(--body);padding:8px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
nav.menu button:hover{color:var(--head-fg);background:rgba(255,255,255,.06)}
nav.menu button[aria-current="page"]{color:var(--head-fg);box-shadow:inset 0 -2px 0 var(--hi);border-radius:0}
.ctrls{display:flex;gap:6px;align-items:center}
.ctrls select,.ctrls button{background:rgba(255,255,255,.07);color:var(--head-fg);border:1px solid rgba(255,255,255,.12);border-radius:6px;height:32px;font:500 13px var(--mono);padding:0 8px;cursor:pointer}
.ctrls button{width:34px;padding:0;display:grid;place-items:center}
.ctrls svg{width:16px;height:16px}
@media (max-width:760px){
  .bar{flex-wrap:wrap;gap:4px 12px;padding-block:8px 0}
  .brand{flex:1}
  nav.menu{order:3;flex-basis:100%;margin:0 -6px}
}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
section.page[hidden]{display:none}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(30px,5vw,48px);font-weight:600}
h2{font-size:26px;font-weight:600}
h3{font-size:18px;font-weight:600}
p{margin:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.lead{color:var(--muted);max-width:62ch;font-size:16px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--body);padding:9px 16px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}

<script>
/* ===== Circuit.Micro — simulation core (no DOM) ===== */
const DEFS = {
  IN:   {w:40, h:30, ins:[], outs:[[40,15]]},
  CLK:  {w:40, h:30, ins:[], outs:[[40,15]]},
  OUT:  {w:30, h:30, ins:[[0,15]], outs:[]},
  NOT:  {w:60, h:40, ins:[[0,20]], outs:[[60,20]]},
  AND:  {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  OR:   {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  NAND: {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  NOR:  {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  XOR:  {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  XNOR: {w:60, h:40, ins:[[0,10],[0,30]], outs:[[60,20]]},
  DFF:  {w:60, h:60, ins:[[0,15],[0,45]], outs:[[60,15],[60,45]]}
};
const GATEFN = {
  NOT:  a => a[0] ^ 1,
  AND:  a => a[0] & a[1],
  OR:   a => a[0] | a[1],
  NAND: a => (a[0] & a[1]) ^ 1,
  NOR:  a => (a[0] | a[1]) ^ 1,
  XOR:  a => a[0] ^ a[1],
  XNOR: a => (a[0] ^ a[1]) ^ 1
};

function wireMap(c){
  const m = {};
  for (const w of c.wires) m[w.to[0] + ':' + w.to[1]] = w.from[0] + ':' + w.from[1];
  return m;
}
function inVal(c, m, id, i){
  const k = m[id + ':' + i];
  if (!k) return null;
  const v = c.vals[k];
  return v === undefined ? null : v;
}
function settle(c, m){
  for (const p of c.comps){
    if (p.type === 'IN' || p.type === 'CLK') c.vals[p.id + ':0'] = p.v ? 1 : 0;
    else if (p.type === 'DFF'){ c.vals[p.id + ':0'] = p.q; c.vals[p.id + ':1'] = p.q ^ 1; }
    else if (GATEFN[p.type] && c.vals[p.id + ':0'] === undefined) c.vals[p.id + ':0'] = 0;
  }
  let stable = false, n = 0;
  while (!stable && n < 80){
    stable = true; n++;
    for (const p of c.comps){
      const f = GATEFN[p.type]; if (!f) continue;
      const ins = DEFS[p.type].ins.map((_, i) => inVal(c, m, p.id, i));
      const out = ins.some(x => x === null) ? null : f(ins);
      const k = p.id + ':0';
      if (c.vals[k] !== out){ c.vals[k] = out; stable = false; }
    }
  }
  c.osc = !stable;
}
function simulate(c){
  if (!c.vals) c.vals = {};
  const m = wireMap(c);
  for (const p of c.comps) if (p.type === 'DFF'){ if (p.q === undefined) p.q = 0; }
  for (let k = 0; k < 12; k++){
    settle(c, m);
    const upd = [];
    for (const p of c.comps){
      if (p.type !== 'DFF') continue;
      const clk = inVal(c, m, p.id, 1), d = inVal(c, m, p.id, 0);
      if (clk === 1 && p.lastClk === 0 && d !== null) upd.push([p, d]);
      p.lastClk = clk;
    }
    if (!upd.length) break;
    for (const [p, d] of upd) p.q = d;
  }
  for (const p of c.comps) if (p.type === 'OUT') p.v = inVal(c, m, p.id, 0);
}

/* combinational truth-table check: ins/outs are labels, f(vals)->{label:bit} */
function truthCheck(c, ins, outs, f){
  const byLabel = (t, l) => c.comps.find(p => p.type === t && p.label === l);
  const I = ins.map(l => byLabel('IN', l)), O = outs.map(l => byLabel('OUT', l));
  const saved = I.map(p => p.v);
  const rows = []; let ok = true, missing = false;
  for (let r = 0; r < (1 << ins.length); r++){
    const v = {};
    ins.forEach((l, i) => { v[l] = (r >> (ins.length - 1 - i)) & 1; I[i].v = v[l]; });
    simulate(c);
    const exp = f(v), got = {}; let rowOk = true;
    outs.forEach((l, j) => {
      got[l] = O[j].v;
      if (O[j].v === null) missing = true;
      if (O[j].v !== exp[l]) rowOk = false;
    });
    if (!rowOk) ok = false;
    rows.push({v, exp, got, ok: rowOk});
  }
  I.forEach((p, i) => p.v = saved[i]);
  simulate(c);
  return {ok, rows, missing, osc: !!c.osc};
}

/* sequential check: Q must flip on every rising clock edge */
function toggleCheck(c){
  const clk = c.comps.find(p => p.type === 'CLK');
  const out = c.comps.find(p => p.type === 'OUT');
  const dffs = c.comps.filter(p => p.type === 'DFF');
  dffs.forEach(p => { p.q = 0; p.lastClk = null; });
  clk.v = 0; simulate(c);
  const seq = [out.v]; let ok = out.v !== null;
  for (let i = 0; i < 4; i++){
    clk.v = 1; simulate(c); seq.push(out.v);
    if (out.v === null || out.v === seq[seq.length - 2]) ok = false;
    clk.v = 0; simulate(c);
  }
  return {ok, seq, missing: seq.includes(null)};
}

/* generic table for the lab: every IN vs every OUT */
function labTable(c){
  const I = c.comps.filter(p => p.type === 'IN'), O = c.comps.filter(p => p.type === 'OUT');
  const saved = I.map(p => p.v), rows = [];
  for (let r = 0; r < (1 << I.length); r++){
    I.forEach((p, i) => p.v = (r >> (I.length - 1 - i)) & 1);
    simulate(c);
    rows.push({ins: I.map(p => p.v), outs: O.map(p => p.v)});
  }
  I.forEach((p, i) => p.v = saved[i]); simulate(c);
  return {I, O, rows};
}

 task:{en:'Add a NOT gate, wire A → NOT → Y and press Check.',pt:'Adicione uma porta NOT, ligue A → NOT → Y e clique em Verificar.',es:'Agrega una compuerta NOT, conecta A → NOT → Y y pulsa Verificar.'}},

{id:'b3', trail:'basic', mins:3, mode:'build', palette:['AND','OR'], ins:['A','B'], outs:['Y'], f:v=>({Y:v.A&v.B}),
 title:{en:'The AND gate',pt:'A porta AND',es:'La compuerta AND'},
 body:{
  en:['AND outputs 1 only when all of its inputs are 1. Picture two switches in series: current flows only if both are closed.','Read its truth table row by row: 00 → 0, 01 → 0, 10 → 0, 11 → 1.'],
  pt:['AND dá 1 somente quando todas as entradas são 1. Pense em duas chaves em série: a corrente só passa se as duas estiverem fechadas.','Leia a tabela-verdade linha a linha: 00 → 0, 01 → 0, 10 → 0, 11 → 1.'],
  es:['AND da 1 solo cuando todas sus entradas son 1. Imagina dos interruptores en serie: la corriente pasa solo si ambos están cerrados.','Lee su tabla de verdad fila por fila: 00 → 0, 01 → 0, 10 → 0, 11 → 1.']},
 task:{en:'Build Y = A AND B. Careful: the toolbar also offers an OR gate.',pt:'Monte Y = A AND B. Atenção: a barra também oferece uma porta OR.',es:'Construye Y = A AND B. Cuidado: la barra también ofrece una compuerta OR.'}},

{id:'b4', trail:'basic', mins:3, mode:'build', palette:['AND','OR','NOT'], ins:['A','B'], outs:['Y'], f:v=>({Y:v.A|v.B}),
 title:{en:'The OR gate',pt:'A porta OR',es:'La compuerta OR'},
 body:{
  en:['OR outputs 1 when at least one input is 1. Picture two switches in parallel: either one is enough.','Only the row 00 gives 0.'],
  pt:['OR dá 1 quando pelo menos uma entrada é 1. Pense em duas chaves em paralelo: qualquer uma basta.','Só a linha 00 dá 0.'],
  es:['OR da 1 cuando al menos una entrada es 1. Imagina dos interruptores en paralelo: cualquiera basta.','Solo la fila 00 da 0.']},
 task:{en:'Build Y = A OR B.',pt:'Monte Y = A OR B.',es:'Construye Y = A OR B.'}},

{id:'b5', trail:'basic', mins:3, mode:'build', palette:['XOR','OR','AND'], ins:['A','B'], outs:['Y'], f:v=>({Y:v.A^v.B}),
 title:{en:'The XOR gate',pt:'A porta XOR',es:'La compuerta XOR'},
 body:{
  en:['XOR, exclusive OR, outputs 1 when its inputs are different. It answers the question "are A and B unequal?"','It is the heart of binary addition: 1 + 1 gives 0 in the sum bit, with a carry to the next column.'],
  pt:['XOR, o OU exclusivo, dá 1 quando as entradas são diferentes. Responde à pergunta "A e B são diferentes?"','É o coração da soma binária: 1 + 1 dá 0 no bit de soma, com vai-um para a próxima coluna.'],
  es:['XOR, el O exclusivo, da 1 cuando sus entradas son distintas. Responde a la pregunta "¿A y B son diferentes?"','Es el corazón de la suma binaria: 1 + 1 da 0 en el bit de suma, con acarreo a la siguiente columna.']},
 task:{en:'Build Y = A XOR B.',pt:'Monte Y = A XOR B.',es:'Construye Y = A XOR B.'}},

{id:'b6', trail:'basic', mins:4, mode:'build', palette:['NAND'], ins:['A','B'], outs:['Y'], f:v=>({Y:v.A&v.B}),
 title:{en:'NAND, the universal gate',pt:'NAND, a porta universal',es:'NAND, la compuerta universal'},
 body:{
  en:['NAND is AND followed by NOT. It is called universal because any circuit can be built from NAND gates alone. Real chips lean on this: NAND is cheap to make with transistors.','Trick: a NAND with both inputs tied to the same signal acts as a NOT. Two NANDs in a row give you AND.'],
  pt:['NAND é um AND seguido de NOT. É chamada universal porque qualquer circuito pode ser feito só com NANDs. Chips reais aproveitam isso: NAND é barata de fabricar com transistores.','Truque: uma NAND com as duas entradas ligadas ao mesmo sinal funciona como NOT. Duas NANDs em sequência formam um AND.'],
  es:['NAND es AND seguido de NOT. Se llama universal porque cualquier circuito puede construirse solo con NAND. Los chips reales lo aprovechan: NAND es barata de fabricar con transistores.','Truco: una NAND con ambas entradas unidas a la misma señal actúa como NOT. Dos NAND seguidas forman un AND.']},
 task:{en:'Using only NAND gates, build Y = A AND B.',pt:'Usando só portas NAND, monte Y = A AND B.',es:'Usando solo compuertas NAND, construye Y = A AND B.'}},

/* ---------- Combinational ---------- */
{id:'i1', trail:'comb', mins:4, mode:'build', palette:['AND','NOT'], ins:['A','B'], outs:['Y'], f:v=>({Y:(v.A|v.B)^1}),
 title:{en:"De Morgan's laws",pt:'Leis de De Morgan',es:'Leyes de De Morgan'},
 body:{
  en:["De Morgan's laws let you trade AND for OR by negating: NOT(A OR B) = (NOT A) AND (NOT B), and NOT(A AND B) = (NOT A) OR (NOT B).",'Engineers use them to rewrite a circuit with whatever gates they have at hand.'],
  pt:['As leis de De Morgan trocam AND por OR usando negação: NOT(A OR B) = (NOT A) AND (NOT B), e NOT(A AND B) = (NOT A) OR (NOT B).','Engenheiros as usam para reescrever um circuito com as portas que têm à mão.'],
  es:['Las leyes de De Morgan cambian AND por OR mediante negación: NOT(A OR B) = (NOT A) AND (NOT B), y NOT(A AND B) = (NOT A) OR (NOT B).','Los ingenieros las usan para reescribir un circuito con las compuertas que tienen a mano.']},
 task:{en:'Build Y = NOT(A OR B) using only AND and NOT.',pt:'Monte Y = NOT(A OR B) usando só AND e NOT.',es:'Construye Y = NOT(A OR B) usando solo AND y NOT.'}},

{id:'i2', trail:'comb', mins:5, mode:'build', palette:['AND','OR','NOT'], ins:['A','B'], outs:['Y'], f:v=>({Y:v.A^v.B}),
 title:{en:'XOR from scratch',pt:'XOR do zero',es:'XOR desde cero'},
 body:{
  en:['XOR is not a primitive. It can be written as (A AND NOT B) OR (NOT A AND B). Each AND term catches one row where the inputs differ.','This sum-of-products recipe works for any truth table: one AND per row that must give 1, then OR them all together.'],
  pt:['XOR não é primitiva. Pode ser escrita como (A AND NOT B) OR (NOT A AND B). Cada termo AND captura uma linha em que as entradas diferem.','Essa receita de soma de produtos vale para qualquer tabela-verdade: um AND para cada linha que deve dar 1, depois junte todos com OR.'],
  es:['XOR no es primitiva. Puede escribirse como (A AND NOT B) OR (NOT A AND B). Cada término AND captura una fila donde las entradas difieren.','Esta receta de suma de productos sirve para cualquier tabla de verdad: un AND por cada fila que debe dar 1, y luego se unen todos con OR.']},
 task:{en:'Build Y = A XOR B using only AND, OR and NOT.',pt:'Monte Y = A XOR B usando só AND, OR e NOT.',es:'Construye Y = A XOR B usando solo AND, OR y NOT.'}},

{id:'i3', trail:'comb', mins:4, mode:'build', palette:['XOR','AND','OR'], ins:['A','B'], outs:['S','C'], f:v=>({S:v.A^v.B,C:v.A&v.B}),
 title:{en:'Half adder',pt:'Meio somador',es:'Semisumador'},
 body:{
  en:['Adding two bits gives a 2-bit result: 1 + 1 = 10 in binary. The low bit is the sum S and the high bit is the carry C.','S is 1 when exactly one input is 1, which is XOR. C is 1 only when both are 1, which is AND. That is the whole half adder.'],
  pt:['Somar dois bits dá um resultado de 2 bits: 1 + 1 = 10 em binário. O bit baixo é a soma S e o alto é o vai-um C.','S é 1 quando exatamente uma entrada é 1, ou seja, XOR. C é 1 só quando as duas são 1, ou seja, AND. Isso é todo o meio somador.'],
  es:['Sumar dos bits da un resultado de 2 bits: 1 + 1 = 10 en binario. El bit bajo es la suma S y el alto es el acarreo C.','S es 1 cuando exactamente una entrada es 1, es decir XOR. C es 1 solo cuando ambas son 1, es decir AND. Eso es todo el semisumador.']},
 task:{en:'Build a half adder with outputs S and C.',pt:'Monte um meio somador com saídas S e C.',es:'Construye un semisumador con salidas S y C.'}},

{id:'i4', trail:'comb', mins:6, mode:'build', palette:['XOR','AND','OR'], ins:['A','B','Cin'], outs:['S','Cout'], f:v=>({S:v.A^v.B^v.Cin,Cout:(v.A&v.B)|(v.Cin&(v.A^v.B))}),
 title:{en:'Full adder',pt:'Somador completo',es:'Sumador completo'},
 body:{
  en:['To add numbers with many bits, each column must also accept the carry coming from the column on its right, Cin. A full adder adds three bits: A, B and Cin.','S = A XOR B XOR Cin. Cout = (A AND B) OR (Cin AND (A XOR B)). It is two half adders joined by an OR.'],
  pt:['Para somar números de vários bits, cada coluna também recebe o vai-um da coluna à direita, Cin. Um somador completo soma três bits: A, B e Cin.','S = A XOR B XOR Cin. Cout = (A AND B) OR (Cin AND (A XOR B)). São dois meios somadores unidos por um OR.'],
  es:['Para sumar números de varios bits, cada columna también recibe el acarreo de la columna a su derecha, Cin. Un sumador completo suma tres bits: A, B y Cin.','S = A XOR B XOR Cin. Cout = (A AND B) OR (Cin AND (A XOR B)). Son dos semisumadores unidos por un OR.']},
 task:{en:'Build a full adder with outputs S and Cout.',pt:'Monte um somador completo com saídas S e Cout.',es:'Construye un sumador completo con salidas S y Cout.'}},

{id:'i5', trail:'comb', mins:5, mode:'build', palette:['AND','OR','NOT'], ins:['A','B','S'], outs:['Y'], f:v=>({Y:v.S?v.B:v.A}),
 title:{en:'2:1 multiplexer',pt:'Multiplexador 2:1',es:'Multiplexor 2:1'},
 body:{
  en:['A multiplexer is a digital selector switch: the select line S chooses which data input reaches the output. With S = 0, Y follows A; with S = 1, Y follows B.','Formula: Y = (A AND NOT S) OR (B AND S). Processors use multiplexers everywhere to route data.'],
  pt:['Um multiplexador é uma chave seletora digital: a linha de seleção S escolhe qual entrada chega à saída. Com S = 0, Y segue A; com S = 1, Y segue B.','Fórmula: Y = (A AND NOT S) OR (B AND S). Processadores usam multiplexadores em toda parte para direcionar dados.'],
  es:['Un multiplexor es un selector digital: la línea de selección S elige qué entrada llega a la salida. Con S = 0, Y sigue a A; con S = 1, Y sigue a B.','Fórmula: Y = (A AND NOT S) OR (B AND S). Los procesadores usan multiplexores en todas partes para dirigir datos.']},
 task:{en:'Build a 2:1 multiplexer.',pt:'Monte um multiplexador 2:1.',es:'Construye un multiplexor 2:1.'}},

{id:'i6', trail:'comb', mins:6, mode:'build', palette:['AND','NOT'], ins:['A1','A0'], outs:['Y0','Y1','Y2','Y3'],
 f:v=>({Y0:+(!v.A1&&!v.A0),Y1:+(!v.A1&&v.A0),Y2:+(v.A1&&!v.A0),Y3:+(v.A1&&v.A0)}),
 title:{en:'2-to-4 decoder',pt:'Decodificador 2 para 4',es:'Decodificador 2 a 4'},
 body:{
  en:['A decoder turns a binary number into one-hot lines: with 2 input bits it lights exactly one of 4 outputs. This is how memory picks the cell to read.','Y0 = NOT A1 AND NOT A0, Y1 = NOT A1 AND A0, Y2 = A1 AND NOT A0, Y3 = A1 AND A0.'],
  pt:['Um decodificador transforma um número binário em linhas one-hot: com 2 bits de entrada ele acende exatamente uma de 4 saídas. É assim que a memória escolhe a célula a ler.','Y0 = NOT A1 AND NOT A0, Y1 = NOT A1 AND A0, Y2 = A1 AND NOT A0, Y3 = A1 AND A0.'],
  es:['Un decodificador convierte un número binario en líneas one-hot: con 2 bits de entrada enciende exactamente una de 4 salidas. Así la memoria elige qué celda leer.','Y0 = NOT A1 AND NOT A0, Y1 = NOT A1 AND A0, Y2 = A1 AND NOT A0, Y3 = A1 AND A0.']},
 task:{en:'Build a 2-to-4 decoder.',pt:'Monte um decodificador 2 para 4.',es:'Construye un decodificador 2 a 4.'}},

/* ---------- Sequential ---------- */
{id:'a1', trail:'seq', mins:4, mode:'explore',
 title:{en:'SR latch: the first memory',pt:'Latch SR: a primeira memória',es:'Latch SR: la primera memoria'},
 body:{
  en:['So far every output depended only on the current inputs. Feed an output back into an input and the circuit gains memory. Two cross-coupled NOR gates form an SR latch.','S (set) makes Q = 1 and R (reset) makes Q = 0. With S = R = 0 the latch holds whatever it had. S = R = 1 is the forbidden state: both outputs drop to 0.'],
  pt:['Até agora toda saída dependia só das entradas atuais. Realimente uma saída numa entrada e o circuito ganha memória. Duas NOR cruzadas formam um latch SR.','S (set) faz Q = 1 e R (reset) faz Q = 0. Com S = R = 0 o latch mantém o que tinha. S = R = 1 é o estado proibido: as duas saídas caem para 0.'],
  es:['Hasta ahora cada salida dependía solo de las entradas actuales. Realimenta una salida hacia una entrada y el circuito gana memoria. Dos NOR cruzadas forman un latch SR.','S (set) pone Q = 1 y R (reset) pone Q = 0. Con S = R = 0 el latch conserva lo que tenía. S = R = 1 es el estado prohibido: ambas salidas caen a 0.']},
 task:{en:'Pulse S (1, then back to 0), then pulse R. Watch Q hold its value in between.',pt:'Dê um pulso em S (1 e volta a 0), depois em R. Veja Q manter o valor entre os pulsos.',es:'Da un pulso en S (1 y vuelve a 0) y luego en R. Observa cómo Q conserva su valor entre pulsos.'},
 circuit:{comps:[
  {id:'R',type:'IN',x:40,y:85,label:'R',lock:1},{id:'S',type:'IN',x:40,y:285,label:'S',lock:1},
  {id:'n1',type:'NOR',x:300,y:90,lock:1},{id:'n2',type:'NOR',x:300,y:270,lock:1},
  {id:'Q',type:'OUT',x:600,y:95,label:'Q',lock:1},{id:'Qn',type:'OUT',x:600,y:275,label:'Q̄',lock:1}],
  wires:[{from:['R',0],to:['n1',0]},{from:['n2',0],to:['n1',1]},{from:['n1',0],to:['n2',0]},{from:['S',0],to:['n2',1]},{from:['n1',0],to:['Q',0]},{from:['n2',0],to:['Qn',0]}]},
 quiz:{q:{en:'With S = 0 and R = 0, what is Q?',pt:'Com S = 0 e R = 0, quanto vale Q?',es:'Con S = 0 y R = 0, ¿cuánto vale Q?'},
  opts:[{en:'Always 0',pt:'Sempre 0',es:'Siempre 0'},{en:'Always 1',pt:'Sempre 1',es:'Siempre 1'},{en:'The last value it stored',pt:'O último valor guardado',es:'El último valor guardado'}],a:2}},

{id:'a2', trail:'seq', mins:4, mode:'explore',
 title:{en:'The D flip-flop',pt:'O flip-flop D',es:'El flip-flop D'},
 body:{
  en:['A D flip-flop copies its input D to Q only at the rising edge of the clock, the instant CLK goes from 0 to 1. The rest of the time Q ignores D.','This discipline makes processors synchronous: every flip-flop updates on the same tick.'],
  pt:['Um flip-flop D copia a entrada D para Q somente na borda de subida do clock, o instante em que CLK passa de 0 para 1. No resto do tempo Q ignora D.','Essa disciplina torna os processadores síncronos: todos os flip-flops atualizam no mesmo tique.'],
  es:['Un flip-flop D copia su entrada D a Q solo en el flanco de subida del reloj, el instante en que CLK pasa de 0 a 1. El resto del tiempo Q ignora D.','Esa disciplina hace síncronos a los procesadores: todos los flip-flops se actualizan en el mismo tic.']},
 task:{en:'Set D, then click CLK twice (up and down). Change D while CLK stays still and see that Q does not move.',pt:'Ajuste D e clique duas vezes em CLK (sobe e desce). Mude D com CLK parado e veja que Q não muda.',es:'Ajusta D y haz clic dos veces en CLK (sube y baja). Cambia D con CLK quieto y verás que Q no cambia.'},
 circuit:{comps:[
  {id:'D',type:'IN',x:40,y:150,label:'D',lock:1},{id:'K',type:'CLK',x:40,y:280,label:'CLK',lock:1},
  {id:'F',type:'DFF',x:300,y:150,lock:1},{id:'Q',type:'OUT',x:600,y:150,label:'Q',lock:1}],
  wires:[{from:['D',0],to:['F',0]},{from:['K',0],to:['F',1]},{from:['F',0],to:['Q',0]}]},
 quiz:{q:{en:'When does Q take the value of D?',pt:'Quando Q assume o valor de D?',es:'¿Cuándo toma Q el valor de D?'},
  opts:[{en:'Whenever D changes',pt:'Sempre que D muda',es:'Cada vez que D cambia'},{en:'At the rising edge of CLK',pt:'Na borda de subida de CLK',es:'En el flanco de subida de CLK'},{en:'While CLK is 0',pt:'Enquanto CLK é 0',es:'Mientras CLK es 0'}],a:1}},

{id:'a3', trail:'seq', mins:4, mode:'toggle', palette:['NOT'],
 title:{en:'Divide by two',pt:'Divisor por dois',es:'Divisor entre dos'},
 body:{
  en:['Wire Q̄, the inverted output, back to D. On every rising edge the flip-flop now stores the opposite of what it had: it toggles.','The output switches at half the clock rate. This frequency divider is the first step of every counter.'],
  pt:['Ligue Q̄, a saída invertida, de volta em D. A cada borda de subida o flip-flop guarda o oposto do que tinha: ele alterna.','A saída muda na metade da frequência do clock. Esse divisor de frequência é o primeiro passo de todo contador.'],
  es:['Conecta Q̄, la salida invertida, de vuelta a D. En cada flanco de subida el flip-flop guarda lo opuesto de lo que tenía: alterna.','La salida cambia a la mitad de la frecuencia del reloj. Este divisor de frecuencia es el primer paso de todo contador.']},
 task:{en:'Wire the flip-flop so that Q flips on every clock tick, then press Check.',pt:'Ligue o flip-flop para que Q inverta a cada tique do clock e clique em Verificar.',es:'Conecta el flip-flop para que Q se invierta en cada tic del reloj y pulsa Verificar.'},
 circuit:{comps:[
  {id:'K',type:'CLK',x:40,y:280,label:'CLK',lock:1},{id:'F',type:'DFF',x:300,y:150,lock:1},{id:'Q',type:'OUT',x:600,y:150,label:'Q',lock:1}],
  wires:[{from:['K',0],to:['F',1]},{from:['F',0],to:['Q',0]}]}},

{id:'a4', trail:'seq', mins:4, mode:'explore',
 title:{en:'2-bit counter',pt:'Contador de 2 bits',es:'Contador de 2 bits'},
 body:{
  en:['Chain two toggle flip-flops so the second is clocked by Q̄ of the first. Now Q1 Q0 count in binary: 00, 01, 10, 11, 00 and so on.','This is a ripple counter: each stage waits for the previous one, like the wheels of a car odometer.'],
  pt:['Encadeie dois flip-flops alternadores de modo que o segundo receba o clock de Q̄ do primeiro. Agora Q1 Q0 contam em binário: 00, 01, 10, 11, 00 e assim por diante.','É um contador ondulante (ripple): cada estágio espera o anterior, como as rodas de um hodômetro.'],
  es:['Encadena dos flip-flops alternantes de modo que el segundo reciba el reloj de Q̄ del primero. Ahora Q1 Q0 cuentan en binario: 00, 01, 10, 11, 00 y así sucesivamente.','Es un contador asíncrono (ripple): cada etapa espera a la anterior, como las ruedas de un odómetro.']},
 task:{en:'Click CLK repeatedly, or start the auto clock, and read Q1 Q0 as a binary number.',pt:'Clique em CLK várias vezes, ou ligue o clock automático, e leia Q1 Q0 como número binário.',es:'Haz clic en CLK varias veces, o activa el reloj automático, y lee Q1 Q0 como número binario.'},
 circuit:{comps:[
  {id:'K',type:'CLK',x:40,y:300,label:'CLK',lock:1},{id:'F0',type:'DFF',x:200,y:200,lock:1},{id:'F1',type:'DFF',x:420,y:100,lock:1},
  {id:'Q1',type:'OUT',x:620,y:100,label:'Q1',lock:1},{id:'Q0',type:'OUT',x:620,y:300,label:'Q0',lock:1}],
  wires:[{from:['K',0],to:['F0',1]},{from:['F0',1],to:['F0',0]},{from:['F0',1],to:['F1',1]},{from:['F1',1],to:['F1',0]},{from:['F1',0],to:['Q1',0]},{from:['F0',0],to:['Q0',0]}]},
 quiz:{q:{en:'The counter shows Q1 Q0 = 11. What does it show after the next tick?',pt:'O contador mostra Q1 Q0 = 11. O que mostra após o próximo tique?',es:'El contador muestra Q1 Q0 = 11. ¿Qué muestra tras el siguiente tic?'},
  opts:[{en:'100',pt:'100',es:'100'},{en:'00',pt:'00',es:'00'},{en:'10',pt:'10',es:'10'}],a:1}},

/* ---------- Toward the CPU ---------- */
{id:'c1', trail:'cpu', mins:6, mode:'build', palette:['AND','XOR','OR','NOT'], ins:['A','B','Op'], outs:['Y'], f:v=>({Y:v.Op?(v.A^v.B):(v.A&v.B)}),
 title:{en:'A 1-bit ALU',pt:'Uma ULA de 1 bit',es:'Una ALU de 1 bit'},
 body:{
  en:['The arithmetic logic unit (ALU) is the calculator inside a CPU. An opcode input chooses the operation, and a multiplexer picks which result reaches the output.','Our 1-bit ALU: Op = 0 gives A AND B, Op = 1 gives A XOR B, the sum bit. Compute both, then select.'],
  pt:['A unidade lógica e aritmética (ULA) é a calculadora dentro da CPU. Uma entrada de opcode escolhe a operação, e um multiplexador escolhe qual resultado chega à saída.','Nossa ULA de 1 bit: Op = 0 dá A AND B, Op = 1 dá A XOR B, o bit de soma. Calcule os dois e depois selecione.'],
  es:['La unidad aritmético-lógica (ALU) es la calculadora dentro de la CPU. Una entrada de opcode elige la operación y un multiplexor decide qué resultado llega a la salida.','Nuestra ALU de 1 bit: Op = 0 da A AND B, Op = 1 da A XOR B, el bit de suma. Calcula ambos y luego selecciona.']},
 task:{en:'Build the ALU: Y = A AND B when Op = 0, Y = A XOR B when Op = 1.',pt:'Monte a ULA: Y = A AND B quando Op = 0, Y = A XOR B quando Op = 1.',es:'Construye la ALU: Y = A AND B cuando Op = 0, Y = A XOR B cuando Op = 1.'}},

{id:'c2', trail:'cpu', mins:8, mode:'build', palette:['XOR','AND','OR'], ins:['A1','A0','B1','B0'], outs:['S1','S0','C'],
 f:v=>{const a=v.A1*2+v.A0,b=v.B1*2+v.B0,s=a+b;return {S1:(s>>1)&1,S0:s&1,C:(s>>2)&1};},
 title:{en:'2-bit adder',pt:'Somador de 2 bits',es:'Sumador de 2 bits'},
 body:{
  en:['Chain adders to add multi-bit numbers: the carry out of bit 0 feeds bit 1. This is the ripple-carry adder.','Bit 0 is a half adder, since nothing carries into it. Bit 1 is a full adder. C is the final carry. Example: 11 + 01 = 100.'],
  pt:['Encadeie somadores para somar números de vários bits: o vai-um do bit 0 alimenta o bit 1. É o somador ripple-carry.','O bit 0 é um meio somador, pois não recebe vai-um. O bit 1 é um somador completo. C é o vai-um final. Exemplo: 11 + 01 = 100.'],
  es:['Encadena sumadores para sumar números de varios bits: el acarreo del bit 0 alimenta el bit 1. Es el sumador ripple-carry.','El bit 0 es un semisumador, porque no recibe acarreo. El bit 1 es un sumador completo. C es el acarreo final. Ejemplo: 11 + 01 = 100.']},
 task:{en:'Build a 2-bit adder: inputs A1 A0 and B1 B0, outputs S1, S0 and C.',pt:'Monte um somador de 2 bits: entradas A1 A0 e B1 B0, saídas S1, S0 e C.',es:'Construye un sumador de 2 bits: entradas A1 A0 y B1 B0, salidas S1, S0 y C.'}},

{id:'c3', trail:'cpu', mins:5, mode:'build', palette:['XNOR','XOR','AND','NOT'], ins:['A1','A0','B1','B0'], outs:['E'], f:v=>({E:+(v.A1===v.B1&&v.A0===v.B0)}),
 title:{en:'Equality comparator',pt:'Comparador de igualdade',es:'Comparador de igualdad'},
 body:{
  en:['To compare two numbers, check each pair of bits with XNOR, which gives 1 when they are equal, and combine the results with AND.','Processors use comparators to decide branches, as in "if x equals y, jump".'],

  get(k, d){ try{ const v = localStorage.getItem('circuitmicro.' + k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('circuitmicro.' + k, JSON.stringify(v)); }catch(e){} }

/* ---------- gate drawing ---------- */
const ST = 'style="fill:var(--gate-fill);stroke:var(--gate);stroke-width:2"';
const LD = 'style="fill:none;stroke:var(--gate);stroke-width:2"';
function bubble(cx){ return `<circle cx="${cx}" cy="20" r="4" ${ST}/>`; }
function leads2(x){ return `<path d="M0 10H${x}M0 30H${x}" ${LD}/>`; }
function gateShape(type){
  switch(type){
    case 'NOT':  return `<path d="M0 20H12M50 20H60" ${LD}/><path d="M12 6L42 20L12 34Z" ${ST}/>${bubble(46)}`;
    case 'AND':  return `${leads2(10)}<path d="M46 20H60" ${LD}/><path d="M10 4H30A16 16 0 0 1 30 36H10Z" ${ST}/>`;
    case 'NAND': return `${leads2(8)}<path d="M52 20H60" ${LD}/><path d="M8 4H28A16 16 0 0 1 28 36H8Z" ${ST}/>${bubble(48)}`;
    case 'OR':   return `${leads2(13)}<path d="M48 20H60" ${LD}/><path d="M8 4Q20 20 8 36Q32 36 48 20Q32 4 8 4Z" ${ST}/>`;
    case 'NOR':  return `${leads2(11)}<path d="M52 20H60" ${LD}/><path d="M6 4Q18 20 6 36Q28 36 44 20Q28 4 6 4Z" ${ST}/>${bubble(48)}`;
    case 'XOR':  return `${leads2(16)}<path d="M50 20H60" ${LD}/><path d="M12 4Q24 20 12 36Q36 36 50 20Q36 4 12 4Z" ${ST}/><path d="M6 4Q18 20 6 36" ${LD}/>`;
    case 'XNOR': return `${leads2(16)}<path d="M54 20H60" ${LD}/><path d="M12 4Q24 20 12 36Q32 36 46 20Q32 4 12 4Z" ${ST}/><path d="M6 4Q18 20 6 36" ${LD}/>${bubble(50)}`;
  }
  return '';
}
const valCol = v => v === 1 ? 'var(--hi)' : v === 0 ? 'var(--lo)' : 'var(--x)';
function compShape(p){
  const v = p.v;
  switch(p.type){
    case 'IN': return `<path d="M32 15H40" ${LD}/><rect x="2" y="2" width="30" height="26" rx="3" style="fill:${v?'var(--hi)':'var(--gate-fill)'};stroke:var(--gate);stroke-width:2"/>
      <text x="17" y="20" text-anchor="middle" class="gtxt" style="fill:${v?'#06210f':'var(--gate)'}">${v?1:0}</text>`;
    case 'CLK': return `<path d="M32 15H40" ${LD}/><rect x="2" y="2" width="30" height="26" rx="3" style="fill:var(--gate-fill);stroke:var(--gate);stroke-width:2"/>
      <path d="M7 20H12V10H19V20H25V10" style="fill:none;stroke:${valCol(v?1:0)};stroke-width:2.2"/>`;
    case 'OUT': return `<path d="M0 15H5" ${LD}/><circle cx="17" cy="15" r="12" style="fill:${v===1?'var(--hi)':v===0?'var(--gate-fill)':'var(--x)'};stroke:var(--gate);stroke-width:2"/>`;
    case 'DFF': return `<path d="M0 15H8M0 45H8M52 15H60M52 45H60" ${LD}/><rect x="8" y="2" width="44" height="56" ${ST}/>
      <path d="M8 39L15 45L8 51" ${LD}/><text x="13" y="19" class="gtxt">D</text><text x="36" y="19" class="gtxt">Q</text><text x="36" y="49" class="gtxt">Q̄</text>`;
  }
  return gateShape(p.type);
}
function paletteIcon(type){
  if (DEFS[type].w === 60 && type !== 'DFF') return `<svg viewBox="0 0 60 40" aria-hidden="true">${gateShape(type)}</svg>`;
  return '';
}

/* ---------- editor ---------- */
let UID = 0;
class Editor {
  constructor(host, o){
    this.host = host; this.o = Object.assign({vb:[720,400], palette:[], readonly:false}, o);
    this.c = {comps:[], wires:[], vals:{}}; this.sel = null; this.armed = null; this.drag = null; this.wiring = null; this.temp = null; this.timer = null;
    host.innerHTML = `<div class="editor">${this.o.readonly ? '' : '<div class="tools"></div>'}<div class="cv"><svg viewBox="0 0 ${this.o.vb[0]} ${this.o.vb[1]}" role="img"></svg></div>${this.o.readonly ? '' : '<div class="hint"></div>'}</div>`;
    this.svg = host.querySelector('svg'); this.tools = host.querySelector('.tools'); this.hint = host.querySelector('.hint');

    this.bind();
  }
  load(def){
    this.stopClock();
    const c = JSON.parse(JSON.stringify(def));
    c.comps.forEach(p => { if (p.v === undefined && (p.type === 'IN' || p.type === 'CLK')) p.v = 0; });
    c.vals = {}; this.c = c; this.sel = null; this.armed = null;
    this.drawTools(); this.run();
  }
  get(id){ return this.c.comps.find(p => p.id === id); }
  pinPos(id, k, i){ const p = this.get(id), d = DEFS[p.type][k === 'o' ? 'outs' : 'ins'][i]; return [p.x + d[0], p.y + d[1]]; }
  drawTools(){
    if (!this.tools) return;
    const pal = this.o.palette;
    const hasClk = this.c.comps.some(p => p.type === 'CLK') || pal.includes('CLK');
    this.tools.innerHTML = pal.map(ty => `<button type="button" data-add="${ty}" title="${ty}">${paletteIcon(ty)}${ty}</button>`).join('')
      + '<span class="gap"></span>'
      + (hasClk && !this.flow ? `<button type="button" data-act="clock">${t(this.timer ? 'stop' : 'auto')}</button>` : '')
      + `<button type="button" class="danger" data-act="del" ${this.sel ? '' : 'disabled'}>${t('del')}</button>`;
  }
  add(type){
    const d = DEFS[type]; let pos = null;
    const free = (x, y) => this.c.comps.every(p => { const q = DEFS[p.type]; return x + d.w + 20 < p.x || x > p.x + q.w + 20 || y + d.h + 14 < p.y || y > p.y + q.h + 14; });
    outer: for (let y = 60; y < this.o.vb[1] - d.h; y += 70) for (let x = 180; x < this.o.vb[0] - 150; x += 110) if (free(x, y)){ pos = [x, y]; break outer; }
    if (!pos) pos = [300 + (UID % 5) * 10, 170 + (UID % 5) * 10];
    const p = {id: 'u' + (++UID), type, x: pos[0], y: pos[1]};
    if (type === 'IN' || type === 'OUT'){
      const same = this.c.comps.filter(q => q.type === type).map(q => q.label);
      const pool = type === 'IN' ? 'ABCDEFGH' : 'YZWVUTSR';
      p.label = [...pool].find(ch => !same.includes(ch)) || type + this.c.comps.length;
      if (type === 'IN') p.v = 0;
    }
    if (type === 'CLK'){ p.label = 'CLK'; p.v = 0; }
    this.c.comps.push(p); this.sel = {t:'c', id:p.id}; this.run();
  }
  remove(){
    if (!this.sel) return;
    if (this.sel.t === 'c'){
      const p = this.get(this.sel.id); if (!p || p.lock) return;
      this.c.comps = this.c.comps.filter(q => q !== p);
      this.c.wires = this.c.wires.filter(w => w.from[0] !== p.id && w.to[0] !== p.id);
    } else this.c.wires.splice(this.sel.i, 1);
    this.sel = null; this.run();
  }
  connect(a, b){
    if (a.k === b.k) return false;
    const o = a.k === 'o' ? a : b, i = a.k === 'o' ? b : a;
    this.c.wires = this.c.wires.filter(w => !(w.to[0] === i.id && w.to[1] === i.i));
    this.c.wires.push({from:[o.id, o.i], to:[i.id, i.i]});
    return true;
  }
  route(w){
    const [x1, y1] = this.pinPos(w.from[0], 'o', w.from[1]), [x2, y2] = this.pinPos(w.to[0], 'i', w.to[1]);
    if (x2 >= x1 + 20){
      const mx = w.mx ?? Math.round((x1 + x2) / 20) * 10;
      return `M${x1} ${y1}H${mx}V${y2}H${x2}`;
    }
    const ym = w.ym ?? Math.round(y1 + (y2 - y1) * 0.4), xa = x1 + 12, xb = x2 - 10 - 10 * w.to[1];
    return `M${x1} ${y1}H${xa}V${ym}H${xb}V${y2}H${x2}`;
  }
  run(){
    if (this.flow){
      const prev = Object.assign({}, this.c.vals), prevOut = {};
      this.c.comps.forEach(p => { if (p.type === 'OUT') prevOut[p.id] = p.v; });

      this.startAnim(prev, prevOut);
    } else { this.anim = null; simulate(this.c); this.render(); }
    if (this.o.onChange) this.o.onChange(this);
  }
  /* depth of each component from the sources (IN, CLK, DFF = 0), used to reveal the signal gate by gate */
  depths(){
    const d = {}, src = {};
    this.c.wires.forEach(w => (src[w.to[0]] = src[w.to[0]] || []).push(w.from[0]));
    this.c.comps.forEach(p => d[p.id] = 0);
    for (let k = 0; k < this.c.comps.length; k++){
      let ch = false;
      for (const p of this.c.comps){
        if (p.type === 'IN' || p.type === 'CLK' || p.type === 'DFF') continue;
        const v = Math.min(30, 1 + Math.max(0, ...(src[p.id] || []).map(id => d[id])));
        if (v !== d[p.id]){ d[p.id] = v; ch = true; }
      }
      if (!ch) break;
    }
    return d;
  }
  startAnim(prev, prevOut){
    clearInterval(this.animT);
    const depth = this.depths(), max = Math.max(0, ...Object.values(depth));
    this.anim = {prev, prevOut, depth, level:0};
    this.render();
    this.animT = setInterval(() => {
      if (!this.anim || ++this.anim.level > max){ clearInterval(this.animT); this.anim = null; }
      this.render();
    }, 160);
  }
  shownVal(key){
    const v = this.c.vals[key];
    if (!this.anim) return v;
    const id = key.split(':')[0];
    return (this.anim.depth[id] ?? 0) <= this.anim.level ? v : this.anim.prev[key];
  }
  setFlow(on){
    this.flow = on;
    if (on) this.startClock(); else { this.stopClock(); clearInterval(this.animT); this.anim = null; }
    this.svg.classList.toggle('flowing', on);
    this.render();
  }
  step(){
    const clks = this.c.comps.filter(p => p.type === 'CLK');
    clks.forEach(p => p.v = p.v ? 0 : 1);
    this.ticks = (this.ticks || 0) + 1;
    this.run();
  }
  render(){
    const c = this.c, [W, H] = this.o.vb;
    let s = `<defs><pattern id="g${this.o.key}" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1.1" style="fill:var(--grid)"/></pattern></defs>
      <rect width="${W}" height="${H}" style="fill:url(#g${this.o.key})"/>`;
    c.wires.forEach((w, i) => {
      const d = this.route(w), v = this.shownVal(w.from[0] + ':' + w.from[1]);
      if (this.sel && this.sel.t === 'w' && this.sel.i === i) s += `<path d="${d}" class="wsel"/>`;
      s += `<path d="${d}" class="wire${this.flow && v === 1 ? ' on' : ''}" style="stroke:${valCol(v === undefined ? null : v)}"/>`;
      if (!this.o.readonly) s += `<path d="${d}" class="whit" data-wire="${i}"/>`;
    });
    for (const p of c.comps){
      const d = DEFS[p.type], tog = p.type === 'IN' || p.type === 'CLK';
      s += `<g transform="translate(${p.x} ${p.y})">`;
      const shown = (p.type === 'OUT' && this.anim && (this.anim.depth[p.id] ?? 0) > this.anim.level) ? Object.assign({}, p, {v:this.anim.prevOut[p.id]}) : p;
      s += `<g class="comp${tog ? ' tog' : ''}" data-comp="${p.id}"><rect width="${d.w}" height="${d.h}" style="fill:transparent"/>${compShape(shown)}</g>`;
      if (p.label) s += `<text class="lbl" x="${d.w / 2 - (p.type === 'IN' || p.type === 'CLK' ? 3 : 0)}" y="-7" text-anchor="middle">${esc(p.label)}</text>`;
      if (this.sel && this.sel.t === 'c' && this.sel.id === p.id) s += `<rect x="-5" y="-5" width="${d.w + 10}" height="${d.h + 10}" rx="4" style="fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:4 3"/>`;
      if (!this.o.readonly){
        const pin = (k, i, [x, y]) => {
          const a = this.armed && this.armed.id === p.id && this.armed.k === k && this.armed.i === i;
          return `<g class="pin${a ? ' armed' : ''}" data-id="${p.id}" data-k="${k}" data-i="${i}" data-pin="1"><circle cx="${x}" cy="${y}" r="11" style="fill:transparent"/><circle class="pinv" cx="${x}" cy="${y}" r="3.6"/></g>`;
        };
        d.ins.forEach((q, i) => s += pin('i', i, q)); d.outs.forEach((q, i) => s += pin('o', i, q));

      const [x, y] = this.pinPos(this.armed.id, this.armed.k, this.armed.i);
      s += `<path d="M${x} ${y}L${this.temp.x} ${this.temp.y}" style="stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;fill:none"/>`;
    }

    if (this.hint){ this.hint.textContent = this.armed ? t('armed') : t('hint'); this.hint.classList.toggle('armed', !!this.armed); }
    if (this.tools){ const b = this.tools.querySelector('[data-act="del"]'); if (b) b.disabled = !(this.sel && !(this.sel.t === 'c' && this.get(this.sel.id)?.lock)); }
  }
  /* standalone PNG of the canvas: theme tokens resolved, pins and hit areas removed */
  async toPNG(scale = 2){

    const clone = this.svg.cloneNode(true);
    this.sel = sel; this.armed = armed; this.anim = anim; this.render();
    clone.querySelectorAll('.pin,.whit,.wsel').forEach(n => n.remove());
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('width', W); clone.setAttribute('height', H);
    clone.removeAttribute('class'); clone.removeAttribute('style');
    const css = `.wire{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}

    clone.insertAdjacentHTML('afterbegin', `<style>${css}</style><rect width="${W}" height="${H}" style="fill:var(--canvas)"/>`);

      .replace(/var\((--[\w-]+)\)/g, (_, v) => cs.getPropertyValue(v).trim() || '#000');

  pt(e){ const m = this.svg.getScreenCTM().inverse(); const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m); return {x:p.x, y:p.y}; }

  bind(){
    const sv = this.svg;
    sv.addEventListener('pointerdown', e => {
      const p = this.pt(e), pin = e.target.closest('[data-pin]'), comp = e.target.closest('[data-comp]'), wire = e.target.closest('[data-wire]');
      if (this.o.readonly){ if (comp){ const c = this.get(comp.dataset.comp); if (c.type === 'IN' || c.type === 'CLK') this.toggle(c); } return; }
      if (pin){
        e.preventDefault();
        const P = {id:pin.dataset.id, k:pin.dataset.k, i:+pin.dataset.i};
        if (this.armed && this.connect(this.armed, P)){ this.armed = null; this.temp = null; this.run(); return; }

        if (d.moved){
          const q = DEFS[d.c.type], [W, H] = this.o.vb;
          d.c.x = Math.max(0, Math.min(W - q.w, Math.round((p.x - d.dx) / 10) * 10));
          d.c.y = Math.max(14, Math.min(H - q.h, Math.round((p.y - d.dy) / 10) * 10));

        }
      } else {
        if (Math.hypot(p.x - this.wiring.sx, p.y - this.wiring.sy) > 4) this.wiring.moved = true;
        if (this.wiring.moved){ this.temp = p; this.render(); }
      }
    });
    const up = e => {
      if (this.drag){
        const d = this.drag; this.drag = null;
        if (!d.moved && (d.c.type === 'IN' || d.c.type === 'CLK')) this.toggle(d.c); else this.run();
      } else if (this.wiring){
        const w = this.wiring; this.wiring = null;
        const el = document.elementFromPoint(e.clientX, e.clientY), pin = el && el.closest && el.closest('[data-pin]');
        if (pin && this.armed){
          const P = {id:pin.dataset.id, k:pin.dataset.k, i:+pin.dataset.i};
          if (!(P.id === this.armed.id && P.k === this.armed.k && P.i === this.armed.i)){

      }
    };
    sv.addEventListener('pointerup', up);
    sv.addEventListener('pointercancel', () => { this.drag = null; this.wiring = null; this.temp = null; this.render(); });
    if (this.tools) this.tools.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.add) this.add(b.dataset.add);

      else if (b.dataset.act === 'clock'){ this.timer ? this.stopClock() : this.startClock(); this.drawTools(); this.render(); }
    });

      if ((e.key === 'Delete' || e.key === 'Backspace') && this.sel && e.target.tagName !== 'INPUT'){ e.preventDefault(); this.remove(); }
      if (e.key === 'Escape'){ this.armed = null; this.sel = null; this.render(); }
    });
    sv.setAttribute('tabindex', '0');
  }
  startClock(){
    this.stopClock();
    this.timer = setInterval(() => {
      if (!this.c.comps.some(p => p.type === 'CLK')) return;
      if (this.flow) this.step();
      else { this.c.comps.forEach(p => { if (p.type === 'CLK') p.v = p.v ? 0 : 1; }); this.run(); }
    }, this.flow ? 1400 : 600);
  }
  stopClock(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } }
}

/* ---------- routing ---------- */
const PAGES = ['home','trails','lab','glossary','about','lesson'];
let current = 'home', curLesson = null;
function go(token, push = true){
  if (token && token.startsWith('l-')){ curLesson = LESSONS.find(l => l.id === token.slice(2)) || LESSONS[0]; current = 'lesson'; }
  else current = PAGES.includes(token) ? token : 'home';
  if (current !== 'lesson' && lessonEd) lessonEd.stopClock();
  if (current !== 'lab' && labEd) labEd.stopClock();
  PAGES.forEach(p => $('#p-' + p).hidden = p !== current);
  document.querySelectorAll('nav.menu button').forEach(b => b.setAttribute('aria-current', (b.dataset.go === current || (current === 'lesson' && b.dataset.go === 'trails')) ? 'page' : 'false'));
  renderPage();
  $('main').scrollTop = 0;
  if (push){ try{ history.replaceState(null, '', '#' + (current === 'lesson' ? 'l-' + curLesson.id : current)); }catch(e){} }
}

  place(l.ins, 'IN', 30); place(l.outs, 'OUT', 650);

}

  };
