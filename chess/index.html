  --lv-beg:#4CC48A; --lv-int:#7EA2F2; --lv-adv:#F08A73; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;font-stretch:112%}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:112%}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* board */
.board-wrap{position:relative;width:100%;max-width:540px;margin:0 auto;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none}
.board-wrap svg.board{width:100%;height:100%;display:block;overflow:visible}
.frame{fill:none;stroke:rgba(0,0,0,.18);stroke-width:2}
.sq-l{fill:var(--sq-light)} .sq-d{fill:var(--sq-dark)}
.coord{font-family:var(--f-mono);font-size:26px;font-weight:600;fill:var(--muted);pointer-events:none}
.hl{fill:var(--hl)} .selsq{fill:var(--sel)}
.dot{fill:var(--dot)} .ring{fill:none;stroke:var(--dot);stroke-width:7}
.checksq{fill:url(#chkGrad)}
.tgt{fill:none;stroke:var(--target);stroke-width:6;stroke-dasharray:14 9}
.flash-ok{fill:rgba(29,122,75,.55)} .flash-bad{fill:rgba(184,54,42,.55)}
.piece{cursor:grab;transition:transform .18s ease}
.piece.drag{transition:none;cursor:grabbing;pointer-events:none}
.board-wrap.locked .piece{cursor:default}
.promo{position:absolute;inset:0;background:rgba(20,16,12,.55);display:grid;place-items:center;border-radius:8px}
.promo[hidden]{display:none}
.promo div{display:flex;gap:8px;background:var(--surface);padding:10px;border-radius:12px;box-shadow:var(--shadow)}
.promo button{width:64px;height:64px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:4px}
.promo button:hover{border-color:var(--accent)}
.promo svg{width:100%;height:100%}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

</style>
</head>

ermite al rival perseguirla y ganar tiempo."}],"mission":{"type":"collect","fen":"8/3p3p/8/8/p7/4p2p/8/3Q4 w - - 0 1","prompt":{"en":"Capture all the pawns in as few moves as you can.","pt":"Capture todos os peões com o menor número de lances.","es":"Captura todos los peones en el menor número de jugadas."},"hint":{"en":"Mix straight and diagonal moves: a4, d7, h7…","pt":"Misture retas e diagonais: a4, d7, h7…","es":"Mezcla rectas y diagonales: a4, d7, h7…"},"par":5},"quiz":{"q":{"en":"Which two pieces does the queen combine?","pt":"A dama combina quais duas peças?","es":"¿Qué dos piezas combina la dama?"},"options":[{"en":"Rook and bishop","pt":"Torre e bispo","es":"Torre y alfil"},{"en":"Rook and knight","pt":"Torre e cavalo","es":"Torre y caballo"},{"en":"Bishop and king","pt":"Bispo e rei","es":"Alfil y rey"}],"answer":0,"explain":{"en":"Straight lines like a rook, diagonals like a bishop. She cannot jump like a knight.","pt":"Linhas retas como a torre, diagonais como o bispo. Ela não pula como o cavalo.","es":"Líneas rectas como la torre, diagonales como el alfil. No salta como el caballo."}}},{"id":"knight","track":"pieces2","mins":4,"title":{"en":"The knight","pt":"O cavalo","es":"El caballo"},"intro":{"en":"The knight moves in an L: two squares in one direction, then one to the side. It is the only piece that jumps over others.","pt":"O cavalo anda em L: duas casas numa direção e uma para o lado. É a única peça que pula as outras.","es":"El caballo se mueve en L: dos casillas en una dirección y una hacia el lado. Es la única pieza que salta sobre las demás."},"ideas":[{"en":"Every jump lands on the opposite colour.","pt":"Todo salto cai na cor oposta.","es":"Cada salto cae en el color contrario."},{"en":"In the centre it attacks eight squares; in a corner only two.","pt":"No centro ataca oito casas; no canto, só duas.","es":"En el centro ataca ocho casillas; en una esquina, solo dos."},{"en":"Its odd shape makes it the king of forks.","pt":"Seu formato estra es negros atacan en diagonal hacia abajo, hacia las blancas."},{"en":"In the endgame the king becomes a fighter. Bring him to the centre.","pt":"No final o rei vira lutador. Traga-o para o centro.","es":"En el final el rey se vuelve luchador. Llévalo al centro."}],"mission":{"type":"collect","fen":"8/8/3p4/5p2/8/6p1/8/4K3 w - - 0 1","prompt":{"en":"Walk the king and capture all three pawns. Squares under attack are off-limits.","pt":"Ande com o rei e capture os três peões. Casas atacadas são proibidas.","es":"Camina con el rey y captura los tres peones. Las casillas atacadas están prohibidas."},"hint":{"en":"g4 is attacked by the pawn on f5. Go around it via f4.","pt":"g4 é atacada pelo peão de f5. Contorne por f4.","es":"g4 está atacada por el peón de f5. Rodea por f4."},"par":7},"quiz":{"q":{"en":"Can a king capture a piece that is defended?","pt":"O rei pode capturar uma peça defendida?","es":"¿Puede el rey capturar una pieza defendida?"},"options":[{"en":"No, he would be moving into attack","pt":"Não, ele estaria indo para uma casa atacada","es":"No, se metería en una casilla atacada"},{"en":"Yes, always","pt":"Sim, sempre","es":"Sí, siempre"},{"en":"Only in the endgame","pt":"Só no final","es":"Solo en el final"}],"answer":0,"explain":{"en":"After capturing, the king would stand on a square the defender attacks, which is illegal.","pt":"Depois de capturar, o rei ficaria numa casa atacada pelo defensor, o que é ilegal.","es":"Tras capturar, el rey quedaría en una casilla atacada por el defensor, lo cual es ilegal."}}},{"id":"pawn","track":"pieces2","mins":4,"title":{"en":"The pawn and promotion","pt":"O peão e a promoção","es":"El peón y la coronación"},"intro":{"en":"Pawns move straight forward one square, or two on their first move. They capture one square diagonally forward. A pawn that reaches the last rank promotes.","pt":"O peão anda uma casa para a frente, ou duas no primeiro lance. Ele captura uma casa na diagonal para a frente. O peão que chega à última fileira é promovido.","es":"El peón avanza una casilla, o dos en su primera jugada. Captura una casilla en diagonal hacia delante. El peón que llega a la última fila corona."},"ideas":[{"en":"Pawns never move backwards.","pt":"Peões nunca andam para trás.","es":"Los peones nunca retroceden."},{"en":"A pawn is blocked by any piece directly in front of it.","pt":"Qualquer peça bem à frente bloqueia o peão.","es":"Cualquier pieza justo delante bloquea al peón."},{"en":"On the last rank it becomes a queen, rook, bishop or knight. Almost always a queen.","pt":"Na última fileira vira dama, torre, bispo ou cavalo. Quase sempre dama.","es":"En la última fila se convierte en dama, torre, alfil o caballo. Casi siempre dama."}],"mission":{"type":"promote","fen":"8/8/8/3pp3/8/8/4P3/8 w - - 0 1","prompt":{"en":"Get your pawn to the 8th rank and promote it.","pt":"Leve seu peão à 8ª fileira e promova.","es":"Lleva tu peón a la 8.ª fila y corónalo."},"hint":{"en":"The e-file is blocked on e5. Capture on d5 to change files.","pt":"A coluna e está bloqueada em e5. Capture em d5 para trocar de coluna.","es":"La columna e está bloqueada en e5. Captura en d5 para cambiar de columna."},"par":5},"quiz":{"q":{"en":"A white pawn on e4 can capture a black piece on…","pt":"Um peão branco em e4 pode capturar uma peça preta em…","es":"Un peón blanco en e4 puede capturar una pieza negra en…"},"options":["d5","e5","d4"],"answer":0,"explain":{"en":"Pawns capture one square diagonally forward: d5 or f5. Straight ahead they are only blocked.","pt":"Peões capturam uma casa na diagonal para a frente: d5 ou f5. Em frente eles só ficam bloqueados.","es":"Los peones capturan una casilla en diagonal hacia delante: d5 o f5. De frente solo se bloquean."}}},{"id":"values","track":"pieces2","mins":3,"title":{"en":"What each piece is worth","pt":"Quanto vale cada peça","es":"Cuánto vale cada pieza"},"intro":{"en":"Players count material with a simple scale: pawn 1, knight 3, bishop 3, rook 5, queen 9. The king is priceless.","pt":"Os jogadores contam material com uma escala simples: peão 1, cavalo 3, bispo 3, torre 5, dama 9. O rei não tem preço.","es":"Los jugadores cuentan material con una escala simple: peón 1, caballo 3, alfil 3, torre 5, dama 9. El rey no tiene precio."},"ideas":[{"en":"Before a trade, add up what you give and what you get.","pt":"Antes de uma troca, some o que você dá e o que recebe.","es":"Antes de un cambio, suma lo que das y lo que recibes."},{"en":"A hanging piece is one that nobody defends. Grab the biggest one.","pt":"Peça pendurada é a que ninguém defende. Pegue a maior.","es":"Una pieza colgada es la que nadie defiende. Llévate la más grande."},{"en":"Winning a rook for a minor piece is called winning the exchange.","pt":"Ganhar uma torre por uma peça menor se chama ganhar a qualidade.","es":"Ganar una torre por una pieza menor se llama ganar la calidad."}],"mission":{"type":"find","fen":"6k1/5pp1/3r3p/8/4N3/2b5/5PPP/5RK1 w - - 0 1","steps":[{"accept":["Nxd6"]}],"prompt":{"en":"Black left two pieces hanging. Take the more valuable one.","pt":"As pretas deixaram duas peças penduradas. Pegue a mais valiosa.","es":"Las negras dejaron dos piezas colgadas. Llévate la más valiosa."},"hint":{"en":"Your knight attacks both the rook and the bishop. A rook is worth 5, a bishop 3.","pt":"Seu cavalo ataca a torre e o bispo. Torre vale 5, bispo vale 3.","es":"Tu caballo ataca la torre y el alfil. La torre vale 5, el alfil 3."}},"quiz":{"q":{"en":"You give a knight and get a rook. How much did you gain?","pt":"Você entrega um cavalo e ganha uma torre. Quanto ganhou?","es":"Entregas un caballo y ganas una torre. ¿Cuánto ganaste?"},"options":[{"en":"2 points","pt":"2 pontos","es":"2 puntos"},{"en":"5 points","pt":"5 pontos","es":"5 puntos"},{"en":"Nothing","pt":"Nada","es":"Nada"}],"answer":0,"explain":{"en":"5 for the rook minus 3 for the knight: +2. That is winning the exchange.","pt":"5 da torre menos 3 do cavalo: +2. Isso é ganhar a qualidade.","es":"5 de la torre menos 3 del caballo: +2. Eso es ganar la calidad."}}},{"id":"check","track":"rules","mins":3,"title":{"en":"Check and how to escape it","pt":"Xeque e como sair dele","es":"Jaque y cómo salir de él"},"intro":{"en":"A king under attack is in check. You must get out of check at once, and there are only three ways to do it.","pt":"Um rei atacado está em xeque. Você precisa sair do xeque na hora, e só existem três jeitos.","es":"Un rey atacado está en jaque. Debes salir del jaque de inmediato, y solo hay tres maneras."},"ideas":[{"en":"Move the king to a safe square.","pt":"Mover o rei para uma casa segura.","es":"Mover el rey a una casilla segura."},{"en":"Block the line between the attacker and the king.","pt":"Bloquear a linha entre o atacante e o rei.","es":"Interponer una pieza entre el atacante y el rey."},{"en":"Capture the piece giving check. Often the best answer.","pt":"Capturar a peça que dá xeque. Muitas vezes a melhor resposta.","es":"Capturar la pieza que da jaque. A menudo la mejor respuesta."}],"mission":{"type":"find","fen":"6k1/5ppp/8/8/8/8/6PP/3Rq2K w - - 0 1","steps":[{"accept":["Rxe1#","Rxe1+","Rxe1"]}],"prompt":{"en":"Your king is in check. Escape by capturing the attacker.","pt":"Seu rei está em xeque. Escape capturando o atacante.","es":"Tu rey está en jaque. Escapa capturando al atacante."},"hint":{"en":"The queen on e1 is next to your rook.","pt":"A dama em e1 está ao lado da sua torre.","es":"La dama de e1 está al lado de tu torre."}},"quiz":{"q":{"en":"Which of these is NOT a way out of check?","pt":"Qual destes NÃO é um jeito de sair do xeque?","es":"¿Cuál de estas NO es una forma de salir del jaque?"},"options":[{"en":"Give check back","pt":"Dar xeque de volta","es":"Dar jaque de vuelta"},{"en":"Block","pt":"Bloquear","es":"Interponer"},{"en":"Capture the attacker","pt":"Capturar o atacante","es":"Capturar al atacante"}],"answer":0,"explain":{"en":"Checking the other king does not help: your own king must be safe after your move.","pt":"Dar xeque no outro rei não resolve: seu rei precisa estar seguro depois do seu lance.","es":"Dar jaque al otro rey no sirve: tu rey debe quedar a salvo tras tu jugada."}}},{"id":"checkmate","track":"rules","mins":3,"title":{"en":"Checkmate","pt":"Xeque-mate","es":"Jaque mate"},"intro":{"en":"Checkmate is check with no way out: the king cannot move, the check cannot be blocked and the attacker cannot be captured. The game ends there.","pt":"Xeque-mate é o xeque sem saída: o rei não pode se mover, o xeque não pode ser bloqueado e o atacante não pode ser capturado. A partida acaba ali.","es":"Jaque mate es un jaque sin salida: el rey no puede moverse, el jaque no se puede tapar y el atacante no se puede capturar. La partida termina ahí."},"ideas":[{"en":"A lone king on the edge is much easier to mate.","pt":"Um rei sozinho na borda é muito mais fácil de matar.","es":"Un rey solo en el borde es mucho más fácil de matar."},{"en":"Your own king can help: it guards squares next to the enemy king.","pt":"Seu próprio rei ajuda: ele vigia as casas ao lado do rei inimigo.","es":"Tu propio rey ayuda: vigila las casillas junto al rey rival."},{"en":"Always check every escape square before you announce mate.","pt":"Sempre confira cada casa de fuga antes de anunciar o mate.","es":"Comprueba siempre cada casilla de escape antes de anunciar mate."}],"mission":{"type":"find","fen":"7k/Q7/6K1/8/8/8/8/8 w - - 0 1","steps":[{"mate":true,"accept":["Qa8#","Qb8#","Qg7#","Qh7#"],"mateOnly":true}],"prompt":{"en":"Checkmate in one move.","pt":"Xeque-mate em um lance.","es":"Jaque mate en una jugada."},"hint":{"en":"Your king on g6 already covers g7, h7 and f7.","pt":"Seu rei em g6 já cobre g7, h7 e f7.","es":"Tu rey en g6 ya cubre g7, h7 y f7."}},"quiz":{"q":{"en":"In checkmate, the king…","pt":"No xeque-mate, o rei…","es":"En el jaque mate, el rey…"},"options":[{"en":"is in check and has no legal escape","pt":"está em xeque e não tem saída legal","es":"está en jaque y no tiene sal ura"},"def":{"en":"The first moves of the game, spent on the centre, development and king safety.","pt":"Os primeiros lances da partida, dedicados ao centro, ao desenvolvimento e à segurança do rei.","es":"Las primeras jugadas de la partida, dedicadas al centro, el desarrollo y la seguridad del rey."}},{"term":{"en":"Opposition","pt":"Oposição","es":"Oposición"},"def":{"en":"Kings facing each other with one square between them. Whoever does not have to move holds it.","pt":"Reis frente a frente com uma casa entre eles. Tem a oposição quem não precisa jogar.","es":"Reyes frente a frente con una casilla entre ellos. La tiene quien no tiene que mover."}},{"term":{"en":"Passed pawn","pt":"Peão passado","es":"Peón pasado"},"def":{"en":"A pawn with no enemy pawns able to stop it on its way to promotion.","pt":"Peão sem peões inimigos capazes de pará-lo no caminho até a promoção.","es":"Peón sin peones rivales capaces de frenarlo camino de la coronación."}},{"term":{"en":"Pin","pt":"Cravada","es":"Clavada"},"def":{"en":"An attack on a piece that cannot move without exposing a more valuable piece behind it.","pt":"Ataque a uma peça que não pode sair sem expor uma peça mais valiosa atrás.","es":"Ataque a una pieza que no puede moverse sin exponer otra más valiosa detrás."}},{"term":{"en":"Promotion","pt":"Promoção","es":"Coronación"},"def":{"en":"A pawn reaching the last rank becomes a queen, rook, bishop or knight.","pt":"Peão que chega à última fileira vira dama, torre, bispo ou cavalo.","es":"Peón que llega a la última fila se convierte en dama, torre, alfil o caballo."}},{"term":{"en":"Queenside","pt":"Ala da dama","es":"Flanco de dama"},"def":{"en":"The a- to d-files, where the queen starts.","pt":"As colunas de a até d, onde a dama começa.","es":"Las columnas de la a a la d, donde empieza la dama."}},{"term":{"en":"Rank","pt":"Fileira","es":"Fila"},"def":{"en":"A horizontal row of squares, numbered 1 to 8.","pt":"Linha horizontal de casas, numerada de 1 a 8.","es":"Fil /* ============ board ============ */
const FILES = "abcdefgh";
class Board {
  static M = 46; // width of the fixed coordinate margin (board units; a square is 100)
  constructor(host, opts = {}) {
    this.host = host; this.o = Object.assign({ orientation: "w", coords: true }, opts);
    this.pos = {}; this.sel = null; this.legal = []; this.last = null; this.check = null; this.targets = []; this.flash = null; this.locked = false; this.marks = [];
    host.classList.add("board-wrap");
    // Board standard for the .Micro family: fixed rank numbers on the left and file letters along the bottom, outside the squares
    const uid = "b" + (Board.n = (Board.n || 0) + 1);
    host.innerHTML = `<svg class="board" viewBox="${-Board.M} 0 ${800 + Board.M} ${800 + Board.M}" role="img"><defs><clipPath id="${uid}clip"><rect x="0" y="0" width="800" height="800" rx="10"/></clipPath><radialGradient id="chkGrad"><stop offset="0" stop-color="#ff2a1a" stop-opacity=".9"/><stop offset=".6" stop-color="#e0301e" stop-opacity=".35"/><stop offset="1" stop-color="#e0301e" stop-opacity="0"/></radialGradient></defs><g class="g-coord"></g><g clip-path="url(#${uid}clip)"><g class="g-sq"></g><g class="g-hl"></g></g><rect class="frame" x="0" y="0" width="800" height="800" rx="10"/><g class="g-pc"></g><g class="g-top"></g></svg><div class="promo" hidden><div></div></div>`;
    this.svg = host.querySelector("svg"); this.gSq = this.svg.querySelector(".g-sq"); this.gHl = this.svg.querySelector(".g-hl"); this.gPc = this.svg.querySelector(".g-pc"); this.gTop = this.svg.querySelector(".g-top"); this.gCoord = this.svg.querySelector(".g-coord");
    this.promoEl = host.querySelector(".promo");
    this.drawSquares();
    this.svg.addEventListener("pointerdown", e => this.down(e));
    this.svg.addEventListener("pointermove", e => this.moveDrag(e));
    this.svg.addEventListener("pointerup", e => this.up(e));
    this.svg.addEventListener("pointercancel", () => this.cancelDrag());
  }
  xy(sq) { const f = FILES.indexOf(sq[0]), r = +sq[1] - 1; return this.o.orientation === "w" ? [f * 100, (7 - r) * 100] : [(7 - f) * 100, r * 100]; }
  sqAt(px, py) { let f = Math.floor(px / 100), r = Math.floor(py / 100); if (f < 0 || f > 7 || r < 0 || r > 7) return null; return this.o.orientation === "w" ? FILES[f] + (8 - r) : FILES[7 - f] + (r + 1); }
  pt(e) { const b = this.svg.getBoundingClientRect(), W = 800 + Board.M; return [(e.clientX - b.left) / b.width * W - Board.M, (e.clientY - b.top) / b.height * W]; }
  drawSquares() {
    let h = "";
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const light = (r + f) % 2 === 0; h += `<rect x="${f * 100}" y="${r * 100}" width="100" height="100" class="${light ? "sq-l" : "sq-d"}"/>`; }
    this.gSq.innerHTML = h;
    let c = "";
    for (let i = 0; i < 8; i++) {
      const file = this.o.orientation === "w" ? FILES[i] : FILES[7 - i], rank = this.o.orientation === "w" ? 8 - i : i + 1;
      c += `<text class="coord" x="${i * 100 + 50}" y="${800 + Board.M / 2}" text-anchor="middle" dominant-baseline="central">${file}</text>`;
      c += `<text class="coord" x="${-Board.M / 2}" y="${i * 100 + 50}" text-anchor="middle" dominant-baseline="central">${rank}</text>`;
    }
    this.gCoord.innerHTML = c;
  }
  setOrientation(o) { this.o.orientation = o; this.drawSquares(); this.render(); }
  setPosition(chessOrMap, anim) {
    if (chessOrMap && chessOrMap.board) { const m = {}; chessOrMap.board().forEach(row => row.forEach(p => { if (p) m[p.square] = p.color + p.type; })); this.pos = m; } else this.pos = chessOrMap || {};
    this.render(anim);
  }
  render(anim) {
    let hl = "";
    const rect = (sq, cls) => { const [x, y] = this.xy(sq); return `<rect x="${x}" y="${y}" width="100" height="100" class="${cls}"/>`; };
    if (this.last) { hl += rect(this.last[0], "hl") + rect(this.last[1], "hl"); }
    if (this.check) hl += rect(this.check, "checksq");
    for (const m of this.marks) hl += rect(m.sq, m.cls);
    if (this.sel) hl += rect(this.sel, "selsq");
    for (const s of this.targets) { const [x, y] = this.xy(s); hl += `<rect x="${x + 6}" y="${y + 6}" width="88" height="88" rx="10" class="tgt"/>`; }
    this.gHl.innerHTML = hl;
    let pc = "";
    for (const [sq, id] of Object.entries(this.pos)) { const [x, y] = this.xy(sq); pc += `<use href="#pc-${id}" class="piece" data-sq="${sq}" x="0" y="0" width="100" height="100" style="transform:translate(${x}px,${y}px)"/>`; }
    this.gPc.innerHTML = pc;
    let top = "";
    for (const s of this.legal) { const [x, y] = this.xy(s); top += this.pos[s] ? `<circle cx="${x + 50}" cy="${y + 50}" r="44" class="ring"/>` : `<circle cx="${x + 50}" cy="${y + 50}" r="15" class="dot"/>`; }
    this.gTop.innerHTML = top;

      const el = this.gPc.querySelector(`[data-sq="${anim.to}"]`); if (el) { const [fx, fy] = this.xy(anim.from), [tx, ty] = this.xy(anim.to); el.style.transition = "none"; el.style.transform = `translate(${fx}px,${fy}px)`; el.getBoundingClientRect(); requestAnimationFrame(() => { el.style.transition = ""; el.style.transform = `translate(${tx}px,${ty}px)`; }); }
    }

    } else this.clearSel();
  }
  moveDrag(e) {
    if (!this.drag) return; const [px, py] = this.pt(e); const d = this.drag;
    if (!d.moved && Math.hypot(px - d.sx, py - d.sy) < 12) return;
    d.moved = true; d.el.classList.add("drag"); this.gPc.appendChild(d.el); d.el.style.transform = `translate(${px - 50}px,${py - 50}px)`;
  }
  up(e) {
    const d = this.drag; this.drag = null; if (!d) return;
    if (!d.moved) return; const [px, py] = this.pt(e); const to = this.sqAt(px, py);

  cancelDrag() { this.drag = null; this.render(); }
  async tryMove(from, to) {
    let promotion;
    const p = this.pos[from];
    if (p && p[1] === "p" && (to[1] === "8" || to[1] === "1")) { promotion = await this.askPromotion(p[0]); if (!promotion) { this.render(); return; } }
    this.o.onMove && this.o.onMove(from, to, promotion);
  }
  askPromotion(color) {
    return new Promise(res => {
      const box = this.promoEl.firstElementChild; box.innerHTML = ["q", "r", "b", "n"].map(k => `<button type="button" data-k="${k}" aria-label="${k}">${pieceSvg(color + k, 56)}</button>`).join("");
      this.promoEl.hidden = false;
      const done = k => { this.promoEl.hidden = true; this.promoEl.onclick = null; res(k); };
      this.promoEl.onclick = ev => { const b = ev.target.closest("button"); done(b ? b.dataset.k : null); };
      box.querySelector("button").focus();
    });
  }
  flashSq(sq, ok) { this.marks = [{ sq, cls: ok ? "flash-ok" : "flash-bad" }]; this.render(); clearTimeout(this.ft); this.ft = setTimeout(() => { this.marks = []; this.render(); }, 650); }
}

/* ============ chess helpers & engine ============ */
function kingSq(c, color) { for (const row of c.board()) for (const p of row) if (p && p.type === "k" && p.color === color) return p.square; return null; }
// the computer: Engine (see engine section) searches the position and returns {from,to,promotion}
function think(c, opts) { return Engine.best(c.fen(), opts); }
function statusText(c) {
  if (c.isCheckmate()) return t("checkmate") + " · " + (c.turn() === "w" ? t("black_wins") : t("white_wins"));
  if (c.isStalemate()) return t("stalemate") + " · " + t("draw");
  if (c.isDraw()) return t("draw");
  return (c.turn() === "w" ? t("w_turn") : t("b_turn")) + (c.isCheck() ? " · " + t("in_check") : "");
}
function checkSquare(c) { return c.isCheck() ? kingSq(c, c.turn()) : null; }

  const letters = [...new Set(items.map(i => i.term[0].toUpperCase()))];
  $("#v-glossary").innerHTML = `<div class="wrap"><div class="eyebrow">${t("glossary")}</div><h1 style="font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 6px">${t("gl_h")}</h1><p class="muted" style="margin:0 0 18px">${t("gl_p")}</p>
   <input type="search" id="glq" placeholder="${t("search")}" aria-label="${t("search")}">
   <div class="gl-index">${letters.map(c => `<a href="#gl-${encodeURIComponent(c)}" data-l="${c}">${c}</a>`).join("")}</div>
   <div class="gl-list" id="glList"></div></div>`;
  const draw = q => { const f = items.filter(i => !q || (i.term + " " + i.def).toLowerCase().includes(q.toLowerCase())); const seen = new Set();
    $("#glList").innerHTML = f.length ? f.map(i => { const c = i.term[0].toUpperCase(); const id = seen.has(c) ? "" : ` id="gl-${encodeURIComponent(c)}"`; seen.add(c); return `<div class="card term"${id}><h3>${esc(i.term)}<span>${c}</span></h3><p>${esc(i.def)}</p></div>`; }).join("") : `<p class="muted">${t("notfound")}</p>`; };
  draw(""); $("#glq").oninput = e => draw(e.target.value);
  document.querySelectorAll(".gl-index a").forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById("gl-" + encodeURIComponent(a.dataset.l)); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
}

<p>Chess.Micro is a micro-learning platform for chess. Each lesson takes three to five minutes: one idea explained in plain words, a mission on a real board and one question to check yourself.</p>
<p>The 24 lessons are grouped into six tracks, from how the rook moves to king-and-pawn endings. Beginners can start at lesson 1; players who already know the moves can jump straight to mating patterns or tactics. ${"{progress}"}</p>

<ul><li>Drag a piece, or tap it and then tap the destination square.</li><li>Dots show legal moves; rings show captures.</li><li>When a pawn reaches the last rank, pick the new piece.</li><li>To castle, move the king two squares; the rook follows by itself.</li><li>"Try again" restarts the mission; "Hint" shows a nudge without giving the answer away.</li></ul>
<h2>The Lab</h2>
<p>A free board for playing the computer (three levels), playing a friend on the same screen, or loading any position with a FEN string. Moves are listed in algebraic notation.</p>
