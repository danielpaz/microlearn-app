body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;font-stretch:112%}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:112%}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}

/* Check.Micro: draughts board with fixed outside coordinates (.Micro board standard) */
.dboard-wrap{position:relative;width:100%;max-width:540px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.dboard{display:block;width:100%;height:auto}
.dboard .sq-l{fill:var(--sq-l)} .dboard .sq-d{fill:var(--sq-d)}
.dboard .frame{fill:none;stroke:var(--frame);stroke-width:6}
.dboard .coord{fill:var(--muted);font-family:var(--f-mono);font-size:30px;font-weight:600}
.dboard .hl{fill:var(--hl);opacity:.55}
.dboard .selsq{fill:var(--accent);opacity:.35}
.dboard .dot{fill:var(--accent);opacity:.75}
.dboard .ring{fill:none;stroke:var(--accent);stroke-width:7;opacity:.85}
.dboard .okmk{fill:none;stroke:var(--ok);stroke-width:8}
.dboard .badmk{stroke:var(--bad);stroke-width:9;stroke-linecap:round}
.dboard .selmk{fill:var(--accent);opacity:.35}
.dboard .path{fill:none;stroke:var(--accent);stroke-width:6;stroke-dasharray:12 10;stroke-linecap:round;opacity:.9}
.dboard .capx{stroke:var(--bad);stroke-width:8;stroke-linecap:round}
.dboard .pc{transition:transform .22s ease}
.dboard .movable{cursor:pointer}
@media (prefers-reduced-motion: reduce){.dboard .pc{transition:none}}
.dboard-wrap.locked .dboard{cursor:default}
.rulebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
.rulebar > span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mboard{margin-bottom:6px}
.opts.choice{margin-top:12px}
.hv-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.hv-cap b{font-size:.95rem}
.hv-note{font-size:.84rem;color:var(--muted);margin-top:6px;font-family:var(--f-mono);min-height:1.3em}
.fieldset{display:grid;gap:6px}
.fieldset > span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scorebox div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:.86rem}
.scorebox b{display:block;font-family:var(--f-mono);font-size:1.15rem}
.labmsg{font-weight:700;min-height:1.4em}
.movelog{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);max-height:120px;overflow:auto;word-break:break-word;line-height:1.5}
.thinking::after{content:"";display:inline-block;width:.9em;height:.9em;margin-left:8px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.thinking::after{animation:none}}
@media (max-width:960px){.lab{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}

</style>
</head>
<body>
<header class="top"><div class="wrap top-in">
  <a class="brand" href="#/home" aria-label="Check.Micro"><span class="tile"><small>13</small>Ck</span><b>Check<i>.Micro</i></b></a>
  <nav class="menu" id="menu" aria-label="Main"></nav>
  <div class="tools">
    <div class="xp" title="XP"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg><b id="xpVal">0</b><span class="lbl" id="xpLbl">XP</span></div>
    <div class="lang"><button class="icon-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span id="langCode">EN</span></button><div class="lang-menu" id="langMenu" role="menu" hidden></div></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Theme"></button>
  </div>
</div></header>
<main id="main">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-tracks"></section>
  <section class="view" id="v-lesson"></section>
  <section class="view" id="v-lab"></section>
  <section class="view" id="v-glossary"></section>
  <section class="view" id="v-about"></section>
</main>

<script>const ABOUT_CHECK = {"en": "<h1>About Check.Micro</h1>\n<p>Check.Micro is a micro-learning platform for draughts, the game called checkers in North America and damas in Portuguese and Spanish. Each lesson takes three to five minutes: one idea, a mission on the board, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: first moves, the rules, tactics, breakthroughs, endgames and mastery. {progress}</p>\n<h2>Two rule sets</h2>\n<ul><li><b>International draughts</b> (default): 10×10 board, 20 men each. This is the form played in world championships.</li><li><b>Brazilian draughts</b>: the same rules on an 8×8 board with 12 men each, very popular in Brazil.</li></ul>\n<p>In both, White moves first, men move forward and capture forward and backward, capturing is compulsory and you must take the most pieces (majority rule), kings fly along the diagonals, captured pieces are removed after the whole move (Turkish strike rule), and a man is crowned only if it ends its move on the far row. Choose the rule set above any board; every lesson has its own position for each board.</p>\n<h2>How the missions are checked</h2>\n<ul><li>A draughts engine written for Check.Micro runs in your browser. Its move generator was checked against the published move counts for international draughts.</li><li>Every tactical position was found and proved by search: the engine confirms that the goal (win material, crown a king, win the game) can be forced, and that the first move given in the hint is the only one that works where the lesson says so.</li><li>When you play, Black answers with the move that resists longest.</li></ul>\n<h2>The Lab</h2>\n<p>Play against the computer (three levels) or a friend on the same screen, on either board. You can copy the move list.</p>\n<h2>Board standard</h2>\n<p>Like every .Micro board, the coordinates are fixed outside the board: numbers on the left, letters along the bottom. Squares are named like a3 or e5; the bottom-left corner a1 is dark.</p>\n<h2>Part of Microlearn</h2>\n<p>Check.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"microlearn.website.html\">www.microlearn.website</a>, next to <a href=\"Chess.Micro.html\">Chess.Micro</a> and <a href=\"Go.Micro.html\">Go.Micro</a>.</p>", "pt": "<h1>Sobre o Check.Micro</h1>\n<p>O Check.Micro é uma plataforma de microaprendizagem de damas, o jogo chamado de checkers na América do Norte. Cada lição leva de três a cinco minutos: uma ideia, uma missão no tabuleiro e uma pergunta para conferir o que você aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: primeiros lances, as regras, táticas, rupturas, finais e domínio. {progress}</p>\n<h2>Duas regras</h2>\n<ul><li><b>Damas internacionais</b> (padrão): tabuleiro 10×10, 20 pedras para cada lado. É a forma jogada nos campeonatos mundiais.</li><li><b>Damas brasileiras</b>: as mesmas regras num tabuleiro 8×8 com 12 pedras para cada lado, muito populares no Brasil.</li></ul>\n<p>Nas duas, as brancas começam, as pedras andam para frente e capturam para frente e para trás, capturar é obrigatório e é preciso tomar o maior número de peças (lei da maioria), as damas voam pelas diagonais, as peças capturadas saem só no fim do lance (regra do golpe turco) e a pedra só é promovida se terminar o lance na última linha. Escolha a regra acima de qualquer tabuleiro; cada lição tem uma posição própria para cada tabuleiro.</p>\n<h2>Como as missões são corrigidas</h2>\n<ul><li>Um motor de damas feito para o Check.Micro roda no seu navegador. O gerador de lances foi conferido com as contagens publicadas para as damas internacionais.</li><li>Cada posição tática foi encontrada e provada por busca: o motor confirma que o objetivo (ganhar material, fazer dama, vencer) pode ser forçado e que o primeiro lance da dica é o único que funciona quando a lição diz isso.</li><li>Quando você joga, as pretas respondem com o lance que resiste por mais tempo.</li></ul>\n<h2>O Laboratório</h2>\n<p>Jogue contra o computador (três níveis) ou contra um amigo na mesma tela, em qualquer tabuleiro. Dá para copiar a lista de lances.</p>\n<h2>Padrão de tabuleiro</h2>\n<p>Como em todo tabuleiro .Micro, as coordenadas ficam fixas fora do tabuleiro: números à esquerda, letras embaixo. As casas têm nomes como a3 ou e5; o canto inferior esquerdo, a1, é escuro.</p>\n<h2>Parte do Microlearn</h2>\n<p>O Check.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"microlearn.website.html\">www.microlearn.website</a>, ao lado do <a href=\"Chess.Micro.html\">Chess.Micro</a> e do <a href=\"Go.Micro.html\">Go.Micro</a>.</p>", "es": "<h1>Acerca de Check.Micro</h1>\n<p>Check.Micro es una plataforma de microaprendizaje de damas, el juego llamado checkers en Norteamérica. Cada lección dura de tres a cinco minutos: una idea, una misión en el tablero y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: primeras jugadas, las reglas, táctica, rupturas, finales y dominio. {progress}</p>\n<h2>Dos reglamentos</h2>\n<ul><li><b>Damas internacionales</b> (por defecto): tablero de 10×10, 20 piezas por bando. Es la forma de los campeonatos del mundo.</li><li><b>Damas brasileñas</b>: las mismas reglas en un tablero de 8×8 con 12 piezas por bando, muy populares en Brasil.</li></ul>\n<p>En ambas empiezan las blancas, las piezas avanzan y capturan hacia delante y hacia atrás, capturar es obligatorio y hay que tomar el mayor número de piezas (ley de la mayoría), las damas vuelan por las diagonales, las piezas capturadas se retiran al final de la jugada (regla del golpe turco) y una pieza solo corona si termina su jugada en la última fila. Elige el reglamento encima de cualquier tablero; cada lección tiene su propia posición para cada tablero.</p>\n<h2>Cómo se corrigen las misiones</h2>\n<ul><li>Un motor de damas hecho para Check.Micro funciona en tu navegador. Su generador de jugadas se comprobó con los recuentos publicados para las damas internacionales.</li><li>Cada posición táctica se encontró y demostró por búsqueda: el motor confirma que el objetivo (ganar material, coronar, ganar) se puede forzar y que la primera jugada de la pista es la única que funciona cuando la lección lo dice.</li><li>Cuando juegas, las negras responden con la jugada que más resiste.</li></ul>\n<h2>El Laboratorio</h2>\n<p>Juega contra el ordenador (tres niveles) o contra un amigo en la misma pantalla, en cualquiera de los tableros. Puedes copiar la lista de jugadas.</p>\n<h2>Estándar de tablero</h2>\n<p>Como en todo tablero .Micro, las coordenadas están fijas fuera del tablero: números a la izquierda y letras abajo. Las casillas se llaman a3 o e5; la esquina inferior izquierda, a1, es oscura.</p>\n<h2>Parte de Microlearn</h2>\n<p>Check.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"microlearn.website.html\">www.microlearn.website</a>, junto a <a href=\"Chess.Micro.html\">Chess.Micro</a> y <a href=\"Go.Micro.html\">Go.Micro</a>.</p>"};</script>

as las casillas a las que puede ir la pieza blanca de c3** y pulsa Comprobar."},"hint":{"en":"One step diagonally forward, to the left or to the right.","pt":"Um passo na diagonal para frente, à esquerda ou à direita.","es":"Un paso en diagonal hacia delante, a la izquierda o a la derecha."}},"quiz":{"q":{"en":"Who moves first in draughts?","pt":"Quem começa nas damas?","es":"¿Quién empieza en las damas?"},"options":[{"en":"White","pt":"As brancas","es":"Las blancas"},{"en":"Black","pt":"As pretas","es":"Las negras"},{"en":"Whoever wins a coin toss","pt":"Quem ganhar no cara ou coroa","es":"Quien gane a cara o cruz"}],"answer":0,"explain":{"en":"In both international and Brazilian draughts, White always starts.","pt":"Nas damas internacionais e nas brasileiras, as brancas sempre começam.","es":"En las damas internacionales y brasileñas, siempre empiezan las blancas."}}},{"id":"capture","track":"basics","mins":3,"title":{"en":"Capturing","pt":"Capturando","es":"Capturar"},"intro":{"en":"A man captures by jumping over an enemy piece on a neighbouring diagonal square to the empty square right behind it. The captured piece is removed. Capturing is compulsory: if you can capture, you must.","pt":"Uma pedra captura pulando sobre uma peça inimiga na casa diagonal vizinha até a casa vazia logo atrás. A peça capturada sai do tabuleiro. Capturar é obrigatório: se puder capturar, você precisa.","es":"Una pieza captura saltando sobre una pieza enemiga en la casilla diagonal vecina hasta la casilla vacía justo detrás. La pieza capturada sale del tablero. Capturar es obligatorio: si puedes, debes."},"ideas":[{"en":"The landing square must be empty.","pt":"A casa de chegada precisa estar vazia.","es":"La casilla de llegada debe estar vacía."},{"en":"Capturing is not optional, even if it is bad for you.","pt":"Capturar não é opcional, mesmo que seja ruim para você.","es":"Capturar no es opcional, aunque te perjudique."},{"en":"That rule is the engine of every combination.","pt":"Essa regra é o motor de todas as combinações.","es":"Esa regla es el motor de todas las combinaciones."}],"mission":{"type":"play","goal":{"type":"capture","n":1},"plies":1,"pos":{"8":{"w":["d4","b2","g3"],"b":["e5","a7","h8"]},"10":{"w":["d4","b2","g3"],"b":["e5","a7","h8"]}},"prompt":{"en":"**Capture the black man.**","pt":"**Capture a pedra preta.**","es":"**Captura la pieza negra.**"},"hint":{"en":"Tap your man on d4, then the empty square behind e5.","pt":"Toque na sua pedra em d4 e depois na casa vazia atrás de e5.","es":"Toca tu pieza en d4 y luego la casilla vacía detrás de e5."}},"quiz":{"q":{"en":"You can capture, but you would rather make a quiet move. Can you?","pt":"Você pode capturar, mas prefere um lance tranquilo. Pode?","es":"Puedes capturar, pero prefieres una jugada tranquila. ¿Puedes?"},"options":[{"en":"No, capturing is compulsory","pt":"Não, capturar é obrigatório","es":"No, capturar es obligatorio"},{"en":"Yes, always","pt":"Sim, sempre","es":"Sí, siempre"},{"en":"Only with a king","pt":"Só com dama","es":"Solo con dama"}],"answer":0,"explain":{"en":"If any capture exists, you must take one.","pt":"Se existe alguma captura, você precisa fazer uma.","es":"Si existe alguna captura, debes hacer una."}}},{"id":"back","track":"basics","mins":3,"title":{"en":"Capturing backward","pt":"Capturando para trás","es":"Capturar hacia atrás"},"intro":{"en":"Men move only forward, but in both international and Brazilian draughts they capture forward and backward. Always check the squares behind your men too.","pt":"As pedras só andam para frente, mas nas damas internacionais e brasileiras elas capturam para frente e para trás. Sempre confira também as casas atrás das suas pedras.","es":"Las piezas solo avanzan, pero en las damas internacionales y brasileñas capturan hacia delante y hacia atrás. Mira siempre también las casillas detrás de tus piezas."},"ideas":[{"en":"Moving: forward only. Capturing: all four diagonals.","pt":"Andar: só para frente. Capturar: nas quatro diagonais.","es":"Mover: solo hacia delante. Capturar: en las cuatro diagonales."},{"en":"A piece behind your man can be captured.","pt":"Uma peça atrás da sua pedra pode ser capturada.","es":"Una pieza detrás de tu pieza puede ser capturada."},{"en":"In English checkers men cannot capture backward; here they can.","pt":"No checkers inglês as pedras não capturam para trás; aqui capturam.","es":"En las damas inglesas las piezas no capturan hacia atrás; aquí sí."}],"mission":{"type":"play","goal":{"type":"capture","n":1},"plies":1,"pos":{"8":{"w":["d4","f2","a1"],"b":["c3","g7","h6"]},"10":{"w":["d4","f2","a1"],"b":["c3","g7","h6"]}},"prompt":{"en":"A black man has slipped behind your lines. **Capture it.**","pt":"Uma pedra preta entrou atrás das suas linhas. **Capture-a.**","es":"Una pieza negra se ha colado detrás de tus líneas. **Captúrala.**"},"hint":{"en":"Your man on d4 can jump backward over c3.","pt":"Sua pedra em d4 pode pular para trás sobre c3.","es":"Tu pieza de d4 puede saltar hacia atrás sobre c3."}},"quiz":{"q":{"en":"A man may…","pt":"Uma pedra pode…","es":"Una pieza puede…"},"options":[{"en":"capture backward but not move backward","pt":"capturar para trás, mas não andar para trás","es":"capturar hacia atrás pero no moverse hacia atrás"},{"en":"move and capture backward","pt":"andar e capturar para trás","es":"moverse y capturar hacia atrás"},{"en":"never go backward","pt":"nunca ir para trás","es":"nunca ir hacia atrás"}],"answer":0,"explain":{"en":"Backward moves are only for kings; backward captures are for every piece.","pt":"Andar para trás é só para damas; capturar para trás vale para todas as peças.","es":"Moverse hacia atrás es solo para damas; capturar hacia atrás vale para todas."}}},{"id":"multi","track":"basics","mins":4,"title":{"en":"Multiple captures","pt":"Capturas múltiplas","es":"Capturas múltiples"},"intro":{"en":"After a jump, if the same piece can jump again, it must continue in the same move. The captured pieces are removed only at the end of the whole move.","pt":"Depois de um salto, se a mesma peça puder saltar de novo, ela precisa continuar no mesmo lance. As peças capturadas só saem no fim do lance inteiro.","es":"Tras un salto, si la misma pieza puede saltar otra vez, debe continuar en la misma jugada. Las piezas capturadas se retiran solo al final de toda la jugada."},"ideas":[{"en":"One move can capture many pieces.","pt":"Um lance pode capturar várias peças.","es":"Una jugada puede capturar muchas piezas."},{"en":"The capturing piece can change direction between jumps.","pt":"A peça que captura pode mudar de direção entre os saltos.","es":"La pieza que captura puede cambiar de dirección entre saltos."},{"en":"A piece cannot be jumped twice in the same move.","pt":"Uma peça não pode ser pulada duas vezes no mesmo lance.","es":"Una pieza no puede ser saltada dos veces en la misma jugada."}],"mission":{"type":"play","goal":{"type":"capture","n":3},"plies":1,"pos":{"8":{"w":["b2","d2","f2","a5","g5"],"b":["b4","d4","f4","h4","c5","c7","e7"]},"10":{"w":["d2","j2","a5","j8","e9"],"b":["i3","h4","j4","d6","f6","i7","f8"]}},"prompt":{"en":"**Capture three black men in one move.**","pt":"**Capture três pedras pretas num só lance.**","es":"**Captura tres piezas negras en una sola jugada.**"},"hint":{"en":"Pick the man that can capture and tap the last square of its path.","pt":"Escolha a pedra que pode capturar e toque na última casa do caminho.","es":"Elige la pieza que puede capturar y toca la última casilla de su camino."}},"quiz":{"q":{"en":"When are captured pieces taken off the board?","pt":"Quando as peças capturadas saem do tabuleiro?","es":"¿Cuándo se retiran las piezas capturadas?"},"options":[{"en":"At the end of the whole move","pt":"No fim do lance inteiro","es":"Al final de toda la jugada"},{"en":"After each jump","pt":"Depois de cada salto","es":"Después de cada salto"},{"en":"At the end of the game","pt":"No fim da partida","es":"Al final de la partida"}],"answer":0,"explain":{"en":"This is the Turkish strike rule: they stay on the board, and block, until the move is finished.","pt":"É a regra do golpe turco: elas ficam no tabuleiro, e bloqueiam, até o lance terminar.","es":"Es la regla del golpe turco: siguen en el tablero, y bloquean, hasta que termina la jugada."}}},{"id":"majority","track":"rules","mins":4,"title":{"en":"The majority rule","pt":"A lei da maioria","es":"La ley de la mayoría"},"intro":{"en":"When you have several ways to capture, you must choose the one that captures the most pieces. A king and a man count the same. If two sequences take the same number, you choose.","pt":"Quando há várias maneiras de capturar, você precisa escolher a que captura mais peças. Dama e pedra contam igual. Se duas sequências capturam o mesmo número, você escolhe.","es":"Cuando hay varias formas de capturar, debes elegir la que captura más piezas. Una dama y una pieza cuentan igual. Si dos secuencias capturan lo mismo, eliges tú."},"ideas":[{"en":"Count every possible capture before you move.","pt":"Conte todas as capturas possíveis antes de jogar.","es":"Cuenta todas las capturas posibles antes de mover."},{"en":"The longest capture is compulsory, even if it is worse.","pt":"A captura mais longa é obrigatória, mesmo que seja pior.","es":"La captura más larga es obligatoria, aunque sea peor."},{"en":"Your opponent can use this rule to steer your pieces.","pt":"O adversário pode usar essa regra para conduzir suas peças.","es":"Tu rival puede usar esta regla para dirigir tus piezas."}],"mission":{"type":"select","mode":"one","rule":"mustcapture","pos":{"8":{"w":["b4","h6","a7","e7"],"b":["b2","c3","f4","b6","d6","f6","g7"]},"10":{"w":["b2","g5","b6","d6","j8","c9"],"b":["c3","a5","f6","e7","b8","h8","g9"]}},"prompt":{"en":"Two of your pieces can capture. **Tap the piece that must capture** under the majority rule.","pt":"Duas peças suas podem capturar. **Toque na peça que precisa capturar** pela lei da maioria.","es":"Dos de tus piez const CM = (() => {
  const D = (typeof DR !== "undefined") ? DR : require("./engine.js");
  function position(m, N) { if (!m.pos) return D.initial(N); const x = m.pos[String(N)]; return D.make(N, x.w, x.b, "w"); }
  const onMain = (N, i) => (i % N) === ((i / N) | 0);
  function ruleAnswer(m, p) {
    const N = p.N, ms = D.moves(p), r = m.rule || "";
    if (r.startsWith("dest:")) { const f = D.sq(N, r.slice(5)); return [...new Set(ms.filter(x => x.from === f).map(x => x.to))]; }
    if (r === "kingdest") return [...new Set(ms.filter(x => D.isKing(p.a[x.from])).map(x => x.to))];
    if (r === "diagdest") return [...new Set(ms.filter(x => D.isKing(p.a[x.from]) && onMain(N, x.to)).map(x => x.to))];
    if (r === "mustcapture") return [...new Set(ms.map(x => x.from))];

  }
  const unsafe = q => D.forced(q, { type: "gain", n: 1 }, "b", D.baseOf(q, "b"), 4);
  // after the user's move in a play mission: "win", "lose" or "go" with the opponent's reply
  function playStep(m, q, base, left) {
    const g = m.goal;
    if (D.goalMet(g, q, "w", base)) return { state: "win" };
    if (g.type === "capture") return { state: "lose" };
    if (left <= 0 || !D.forced(q, g, "w", base, left)) return { state: "lose" };
    const reply = D.defend(q, g, "w", base, left);
    if (!reply) return { state: D.goalMet(g, q, "w", base) ? "win" : "lose" };
    return { state: "go", reply };
  }
  return { position, ruleAnswer, unsafe, playStep, onMain };
})();

function ruleBar(id) { return `<div class="rulebar"><span>${t("rules")}</span><div class="seg" id="${id}">${[10, 8].map(n => `<button type="button" data-n="${n}" aria-pressed="${RULE === n}">${t(n === 10 ? "intl" : "braz")}</button>`).join("")}</div></div>`; }
function bindRuleBar(id) { const el = document.getElementById(id); if (el) el.querySelectorAll("button").forEach(b => b.onclick = () => { if (+b.dataset.n !== RULE) setRule(+b.dataset.n); }); }

/* ---------- draughts board (.Micro board standard: rank numbers fixed on the left, file letters along the bottom, outside the squares) ---------- */
const DS = 100, DM = 54;
class DBoard {
  constructor(host, N, opts = {}) {
    this.host = host; this.N = N; this.o = opts; this.p = null; this.sel = -1; this.marks = []; this.last = null; this.locked = false;
    host.classList.add("dboard-wrap"); const W = N * DS, uid = "d" + (DBoard.n = (DBoard.n || 0) + 1); this.uid = uid;
    let sq = "", co = "";
    for (let r = 0; r < N; r++) for (let f = 0; f < N; f++) sq += `<rect x="${f * DS}" y="${(N - 1 - r) * DS}" width="${DS}" height="${DS}" class="${DR.isDark(f, r) ? "sq-d" : "sq-l"}"/>`;
    for (let k = 0; k < N; k++) co += `<text class="coord" x="${-DM / 2}" y="${(N - 1 - k) * DS + DS / 2}" text-anchor="middle" dominant-baseline="central">${k + 1}</text><text class="coord" x="${k * DS + DS / 2}" y="${W + DM / 2}" text-anchor="middle" dominant-baseline="central">${DR.FILES[k]}</text>`;
    host.innerHTML = `<svg class="dboard" viewBox="${-DM} 0 ${W + DM} ${W + DM}" role="img" aria-label="Draughts board ${N}×${N}"><defs>
      <radialGradient id="${uid}w" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fffdf7"/><stop offset="1" stop-color="#d9d2c2"/></radialGradient>
      <radialGradient id="${uid}b" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5a4038"/><stop offset="1" stop-color="#1d1311"/></radialGradient></defs>
      ${sq}<rect class="frame" x="0" y="0" width="${W}" height="${W}"/><g class="g-hl"></g><g class="g-pc"></g><g class="g-top"></g>${co}</svg>`;
    this.svg = host.querySelector("svg"); this.gH = this.svg.querySelector(".g-hl"); this.gP = this.svg.querySelector(".g-pc"); this.gT = this.svg.querySelector(".g-top");
    this.svg.addEventListener("click", e => { if (this.locked) return; const i = this.at(e); if (i >= 0 && this.o.onSquare) this.o.onSquare(i); });
  }
  xy(i) { return [(i % this.N) * DS, (this.N - 1 - ((i / this.N) | 0)) * DS]; }
  at(e) { const pt = this.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const q = pt.matrixTransform(this.svg.getScreenCTM().inverse());
    const f = Math.floor(q.x / DS), r = this.N - 1 - Math.floor(q.y / DS); if (f < 0 || r < 0 || f >= this.N || r >= this.N) return -1; return r * this.N + f; }
  set(p) { this.p = p; this.render(); }
  lock(v) { this.locked = v; this.host.classList.toggle("locked", v); }
  piece(x, y, pc) { const c = DR.colorOf(pc), k = DR.isKing(pc), cx = x + 50, cy = y + 50, fill = `url(#${this.uid}${c})`, st = c === "w" ? "#8c8270" : "#000", ink = c === "w" ? "#8c8270" : "#c9a96b";
    let s = `<circle cx="${cx}" cy="${cy + 4}" r="38" fill="rgba(0,0,0,.25)"/><circle cx="${cx}" cy="${cy}" r="38" fill="${fill}" stroke="${st}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="27" fill="none" stroke="${ink}" stroke-width="2.5" opacity=".8"/>`;
    if (k) s += `<path d="M${cx - 18} ${cy + 10}h36l-4-22-9 8-5-12-5 12-9-8z" fill="${c === "w" ? "#b8862b" : "#e2b04a"}" stroke="${c === "w" ? "#6b4b12" : "#fff3"}" stroke-width="2" stroke-linejoin="round"/>`;
    return s; }
  render() {
    if (!this.p) return; const p = this.p, N = this.N; let hl = "", pc = "", top = "";
    const rect = (i, cls) => { const [x, y] = this.xy(i); return `<rect x="${x}" y="${y}" width="${DS}" height="${DS}" class="${cls}"/>`; };
    if (this.last) { hl += rect(this.last.from, "hl") + rect(this.last.to, "hl"); }
    if (this.sel >= 0) hl += rect(this.sel, "selsq");
    for (const m of this.marks) { if (m.c === "sel") hl += rect(m.i, "selmk"); }
    for (let i = 0; i < N * N; i++) if (p.a[i]) { const [x, y] = this.xy(i); pc += `<g class="pc${this.o.movable && this.o.movable(i) ? " movable" : ""}">${this.piece(x, y, p.a[i])}</g>`; }
    if (this.sel >= 0 && this.o.targets) for (const m of this.o.targets(this.sel)) { const [x, y] = this.xy(m.to); top += m.caps.length ? `<circle class="ring" cx="${x + 50}" cy="${y + 50}" r="30"/>` : `<circle class="dot" cx="${x + 50}" cy="${y + 50}" r="14"/>`; }
    if (this.showPath) { const m = this.showPath; const pts = [m.from, ...m.path].map(i => { const [x, y] = this.xy(i); return `${x + 50},${y + 50}`; }).join(" "); top += `<polyline class="path" points="${pts}"/>`; }
    for (const m of this.marks) { const [x, y] = this.xy(m.i);
      if (m.c === "ok") top += `<rect class="okmk" x="${x + 8}" y="${y + 8}" width="84" height="84" rx="12"/>`;
      if (m.c === "bad") top += `<path class="badmk" d="M${x + 26} ${y + 26}L${x + 74} ${y + 74}M${x + 74} ${y + 26}L${x + 26} ${y + 74}"/>`;
      if (m.c === "cap") top += `<path class="capx" d="M${x + 30} ${y + 30}L${x + 70} ${y + 70}M${x + 70} ${y + 30}L${x + 30} ${y + 70}"/>`; }
    this.gH.innerHTML = hl; this.gP.innerHTML = pc; this.gT.innerHTML = top;
  }
}
const mvName = (N, m) => DR.name(N, m.from) + (m.caps.length ? "x" : "-") + DR.name(N, m.to);
// user interaction: tap a piece, then a destination
function picker(bd, getPos, color, onMove) {
  const legal = () => { const p = getPos(); return p.toMove === color ? DR.moves(p) : []; };
  bd.o.movable = i => legal().some(m => m.from === i);
  bd.o.targets = i => legal().filter(m => m.from === i);
  bd.o.onSquare = i => { const ms = legal(); if (!ms.length) return;
    if (bd.sel >= 0) { const mv = ms.find(m => m.from === bd.sel && m.to === i); if (mv) { bd.sel = -1; onMove(mv); return; } }
    if (ms.some(m => m.from === i)) { bd.sel = bd.sel === i ? -1 : i; bd.render(); return; }
    if (DR.colorOf(getPos().a[i]) === color) { bd.sel = -1; bd.render(); if (bd.o.onBlocked) bd.o.onBlocked(); } };
}

          later(() => { bd.marks = []; bd.render(); }, 700);

    draw(); maybeCpu();
  }
};
