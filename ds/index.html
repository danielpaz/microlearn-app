<style>
/* Layout: header + (home | workspace de 3 painéis: lição · canvas de widgets · saída); abaixo de 1000px vira abas */
:root{
  --bg:#eef2ea; --surface:#fbfcf8; --sunk:#e4eadf; --ink:#16231d; --muted:#5a6a61; --line:#d3dccf; --dot:#c4cfc0;
  --accent:#e8700c; --accent-ink:#ffffff; --leaf:#2d6a4c; --leaf-soft:#d7e9dc; --peel:#ffd9a8; --link:#7d8c84;
  --ok:#2d8a57; --warn:#b7791f; --bad:#c2410c;
  --s1:#e8700c; --s2:#1f8a8a; --s3:#7b5cc8; --s4:#c94f6d; --s5:#6b8e23;
  --c-data-bg:#ffe2bd; --c-data-ring:#ec9a3c; --c-data-ink:#7a4210;
  --c-vis-bg:#ffd5cf; --c-vis-ring:#e2766a; --c-vis-ink:#7d2a20;
  --c-model-bg:#f9d2e4; --c-model-ring:#d26898; --c-model-ink:#6d1f45;
  --c-eval-bg:#cbeeee; --c-eval-ring:#47a9ad; --c-eval-ink:#164f52;
  --c-unsup-bg:#d4e5f3; --c-unsup-ring:#6797c3; --c-unsup-ink:#1f3f5c;
  --f-cjk:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Nirmala UI","Kohinoor Devanagari","Noto Sans Devanagari";
  --f-display:"Bricolage Grotesque", "Trebuchet MS", var(--f-cjk), system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", var(--f-cjk), system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#151f1a; --sunk:#0b110e; --ink:#e4eee8; --muted:#93a59a; --line:#26342d; --dot:#24312a;
  --accent:#ff9338; --accent-ink:#1b0e02; --leaf:#78cc9d; --leaf-soft:#1c3328; --peel:#5a3a17; --link:#6f8178;
  --ok:#5fd193; --warn:#f0b34f; --bad:#ff7a45;
  --s1:#ff9338; --s2:#4cc6c6; --s3:#a68bf0; --s4:#f07a97; --s5:#a6c85a;
  --c-data-bg:#3a2914; --c-data-ring:#e99a42; --c-data-ink:#ffd59e;
  --c-vis-bg:#3e1f1b; --c-vis-ring:#e47e72; --c-vis-ink:#ffc9c1;
  --c-model-bg:#3b1a2b; --c-model-ring:#dc78a6; --c-model-ink:#ffc6e0;
  --c-eval-bg:#123638; --c-eval-ring:#4fb7bb; --c-eval-ink:#b8f0f1;
  --c-unsup-bg:#16293b; --c-unsup-ring:#77a6d2; --c-unsup-ink:#c6def3;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#151f1a; --sunk:#0b110e; --ink:#e4eee8; --muted:#93a59a; --line:#26342d; --dot:#24312a;
  --accent:#ff9338; --accent-ink:#1b0e02; --leaf:#78cc9d; --leaf-soft:#1c3328; --peel:#5a3a17; --link:#6f8178;
  --ok:#5fd193; --warn:#f0b34f; --bad:#ff7a45;
  --s1:#ff9338; --s2:#4cc6c6; --s3:#a68bf0; --s4:#f07a97; --s5:#a6c85a;
  --c-data-bg:#3a2914; --c-data-ring:#e99a42; --c-data-ink:#ffd59e;
  --c-vis-bg:#3e1f1b; --c-vis-ring:#e47e72; --c-vis-ink:#ffc9c1;
  --c-model-bg:#3b1a2b; --c-model-ring:#dc78a6; --c-model-ink:#ffc6e0;
  --c-eval-bg:#123638; --c-eval-ring:#4fb7bb; --c-eval-ink:#b8f0f1;
  --c-unsup-bg:#16293b; --c-unsup-ring:#77a6d2; --c-unsup-ink:#c6def3;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--f-mono)}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.tnav{display:flex;gap:4px;margin-left:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tnav button{white-space:nowrap}
.tnav button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700}
.tnav button[aria-current="page"]{background:var(--sunk);color:var(--ink)}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.xp{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp .bar{width:90px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.xp .bar span{display:block;height:100%;background:var(--accent);transition:width .5s}
.lang{position:relative;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.lang svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;padding-right:2px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:18px;height:18px}

.view{flex:1;min-height:0}
#home,.page{overflow-y:auto;padding-block:28px 56px}
/* páginas FAQ e glossário */
.doc{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.doc h1{font-size:clamp(32px,4.4vw,50px);font-weight:800;letter-spacing:-.03em}
.doc .lead{color:var(--muted);font-size:17px;margin:10px 0 0;max-width:62ch}
.doc h2{font-size:22px;font-weight:700;margin-bottom:12px}
.faq{display:flex;flex-direction:column;gap:10px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 18px}
.faq details[open]{border-color:color-mix(in oklab,var(--accent) 45%,var(--line))}
.faq summary{cursor:pointer;list-style:none;padding:15px 0;font-weight:700;font-size:16px;display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--f-mono);color:var(--accent);font-size:20px;line-height:1;flex-shrink:0}
.faq details[open] summary::after{content:"−"}
.faq .ans{padding:0 0 16px;max-width:70ch;font-size:15px}
.faq .ans p{margin:0 0 8px}.faq .ans p:last-child{margin:0}
.faq .ans a,.doc .lead a{color:var(--leaf);font-weight:700}
.gsearch{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;max-width:460px}
.gsearch svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
.gsearch input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);padding:11px 0;outline:none}
.gsearch:focus-within{border-color:var(--accent)}
.gcount{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.term{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.term h3{font-size:18px;font-weight:700}
.term .en{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.term p{margin:0;font-size:14.5px}
.term .refs{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.chip{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;color:var(--leaf);text-align:left}
.chip:hover{border-color:var(--leaf)}
.footlinks{display:flex;gap:14px;flex-wrap:wrap;width:100%}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.hero h1{font-size:clamp(38px,5.4vw,66px);font-weight:800;letter-spacing:-.035em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:52ch;color:var(--muted);font-size:17px;margin:18px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.facts{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.heroart{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:20px 20px}
.heroart svg{width:100%;height:auto;display:block}
.heroart .flow{stroke-dasharray:6 7;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-26}}
.heroart figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:var(--f-mono)}

/* tracks */
.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sechead h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.sechead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tracks{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.track{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.track .tn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.track h3{font-size:22px;font-weight:700;margin-top:4px}
.track .td{color:var(--muted);font-size:14px;margin:6px 0 10px}
.lvl{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--leaf-soft);color:var(--leaf)}
.stops{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.stop{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:none;border:0;cursor:pointer;text-align:left;padding:4px 10px 4px 0;position:relative}
.stop .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;position:relative;z-index:1}
.stop::before{content:"";position:absolute;left:30px;right:0;top:19px;height:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.next .dot{border-color:var(--accent);color:var(--accent)}
.stop b{font-size:14.5px;line-height:1.25}
.stop small{color:var(--muted);font-size:12.5px}
.stop:hover b{color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.how div{border-top:2px solid var(--ink);padding-top:12px}
.how span{font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.how h3{font-size:19px;margin:6px 0}
.how p{margin:0;color:var(--muted);font-size:14.5px}
.foot{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:var(--leaf)}
.langlinks{display:flex;gap:12px;flex-wrap:wrap;width:100%}
.langlinks a[aria-current]{color:var(--ink);font-weight:700;text-decoration:none}

/* workspace */
#work{display:flex;flex-direction:column;padding-block:12px;gap:10px}
.mtabs{display:none;gap:4px;background:var(--sunk);padding:4px;border-radius:12px}
.mtabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.mtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.mtabs button .pip{position:absolute;top:7px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.wgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(270px,330px) minmax(0,1fr) minmax(290px,370px);gap:12px}
.pane{min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}

/* lesson pane */
.lmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.lp h2{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}
.concept{font-size:15px}
.concept p{margin:0 0 10px}
.concept code,.goals code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);padding:1px 5px;border-radius:5px}
.tip{border-left:3px solid var(--leaf);background:var(--leaf-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:6px 0 4px}
.tip b{color:var(--leaf);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.lp h3{font-size:15px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:600}
.goals{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.goals .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.goals .ck svg{width:12px;height:12px;opacity:0}
.goals li.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.goals li.ok .ck svg{opacity:1}
.goals li.ok span{color:var(--muted)}
.quiz p{margin:0 0 10px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:color-mix(in oklab,var(--ok) 14%,var(--surface))}
.opts button.wrong{border-color:var(--bad);background:color-mix(in oklab,var(--bad) 10%,var(--surface))}
.why{font-size:13.5px;margin-top:10px;color:var(--muted)}
.donebox{margin-top:18px;padding:14px;border-radius:12px;background:var(--peel);display:flex;gap:12px;align-items:center}
.donebox b{font-family:var(--f-display);font-size:18px}
.lnav{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.dsl{display:flex;flex-direction:column;gap:10px}
.dsl div{border:1px solid var(--line);border-radius:12px;padding:12px}
.dsl b{font-family:var(--f-display);font-size:16px}
.dsl small{display:block;font-family:var(--f-mono);color:var(--muted);font-size:11.5px}
.dsl p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.recipes{display:flex;flex-direction:column;gap:6px}

/* stage */
#stage{position:relative;display:flex;flex-direction:column;overflow:hidden}
.palette{display:flex;gap:14px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto;flex-shrink:0;scrollbar-width:thin}
.pgroup{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.pgroup>span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.pgroup div{display:flex;gap:4px}
.pitem{display:flex;align-items:center;gap:6px;padding:4px 9px 4px 4px;border-radius:999px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:12.5px;font-weight:700;white-space:nowrap}
.pitem i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--cbg);color:var(--cink);border:1.5px solid var(--cring)}
.pitem i svg{width:13px;height:13px}
.pitem:hover{border-color:var(--cring)}
.canvas{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.4px);background-size:22px 22px}
.canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;width:1px;height:1px}
#links path.l{fill:none;stroke:var(--link);stroke-width:2.5}
#links path.l.nodata{stroke-dasharray:6 6;opacity:.75}
#links path.tmp{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 5}
.lchip{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;font-family:var(--f-mono);font-size:10.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 2px 1px 8px;color:var(--muted);white-space:nowrap}
.lchip button{border:0;background:none;width:18px;height:18px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center;padding:0}
.lchip button:hover{background:var(--sunk);color:var(--bad)}
.node{position:absolute;width:72px;height:64px;--cbg:var(--c-data-bg);--cring:var(--c-data-ring);--cink:var(--c-data-ink)}
.cat-vis{--cbg:var(--c-vis-bg);--cring:var(--c-vis-ring);--cink:var(--c-vis-ink)}
.cat-model{--cbg:var(--c-model-bg);--cring:var(--c-model-ring);--cink:var(--c-model-ink)}
.cat-eval{--cbg:var(--c-eval-bg);--cring:var(--c-eval-ring);--cink:var(--c-eval-ink)}
.cat-unsup{--cbg:var(--c-unsup-bg);--cring:var(--c-unsup-ring);--cink:var(--c-unsup-ink)}
.cat-data{--cbg:var(--c-data-bg);--cring:var(--c-data-ring);--cink:var(--c-data-ink)}
.disc{position:absolute;left:4px;top:0;width:64px;height:64px;border-radius:50%;background:var(--cbg);border:2px solid var(--cring);display:grid;place-items:center;color:var(--cink);cursor:grab;padding:0;box-shadow:0 2px 0 color-mix(in oklab,var(--cring) 45%,transparent);transition:transform .15s}
.disc svg{width:28px;height:28px}
.node.sel .disc{outline:3px solid var(--accent);outline-offset:4px}
.node.target .disc{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.node.fresh .disc{animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.08)}}
.port{position:absolute;top:24px;width:16px;height:16px;border-radius:50%;background:var(--surface);border:2px solid var(--cring)}
.port::after{content:"";position:absolute;inset:-12px}
.pin{left:-5px}
.pout{right:-5px;cursor:crosshair}
.pout:hover,.pout.on{background:var(--accent);border-color:var(--accent)}
.nlabel{position:absolute;top:70px;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;font-weight:700;font-size:13px;line-height:1.2;pointer-events:none}
.nlabel small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px;font-weight:400}
.nbadge{position:absolute;top:-4px;right:0;min-width:20px;height:20px;border-radius:10px;font-size:12px;font-weight:700;display:none;place-items:center;padding:0 5px;border:2px solid var(--bg)}
.node.err .nbadge{display:grid;background:var(--bad);color:#fff}
.node.wait .nbadge{display:grid;background:var(--warn);color:#fff}
.zoom{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:10px;display:flex;gap:4px}
.zoom button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.hint{position:absolute;left:12px;bottom:12px;right:140px;font-size:12.5px;color:var(--muted);pointer-events:none}
.hint.live{color:var(--accent);font-weight:700}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13.5px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center;z-index:5}
.toast.on{opacity:1}

/* inspector */
.ihead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.ihead i{width:44px;height:44px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--cbg);color:var(--cink);border:2px solid var(--cring)}
.ihead i svg{width:22px;height:22px}
.ihead h2{font-size:20px;font-weight:700}
.ihead small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.idesc{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.form{display:flex;flex-direction:column;gap:10px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:700;color:var(--muted)}
.form select,.form input[type=number]{font:inherit;font-size:14px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:4px;font-weight:400;color:var(--ink)}
.checks label{flex-direction:row;align-items:center;gap:8px;font-weight:400;color:var(--ink);font-size:14px}
.status{font-size:13.5px;padding:10px 12px;border-radius:10px;margin-bottom:12px}
.status.wait{background:color-mix(in oklab,var(--warn) 14%,var(--surface))}
.status.err{background:color-mix(in oklab,var(--bad) 13%,var(--surface))}
.outh{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.tscroll{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:10px}
table.dt{border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums;width:100%}
table.dt th,table.dt td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.dt th{position:sticky;top:0;background:var(--sunk);font-weight:700;text-align:right}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td.miss{color:var(--bad);font-weight:700;text-align:center}
table.dt td.cat{text-align:left}
table.dt th .k{font-family:var(--f-mono);font-size:10px;color:var(--muted);font-weight:400;display:block}
table.dt th.tg{color:var(--accent)}
.sum{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-bottom:8px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .ax{stroke:var(--line)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%}
.metric{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.metric div{display:flex;flex-direction:column}
.metric b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.metric span{font-size:12px;color:var(--muted)}
.best{font-family:var(--f-mono);font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:1px 5px;margin-left:6px}
.rules{font-family:var(--f-mono);font-size:12px;line-height:1.6;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-x:auto}
.rules ul{list-style:none;margin:0;padding-left:16px;border-left:1px dashed var(--line)}
.rules>ul{padding-left:0;border:0}
.rules .leaf{color:var(--accent);font-weight:600}
.empty{color:var(--muted);font-size:14px}
.empty h2{font-size:20px;color:var(--ink);margin-bottom:8px}
.legendports{display:flex;flex-direction:column;gap:8px;margin-top:14px;font-size:13.5px}
.legendports div{display:flex;gap:10px;align-items:center}
.sw{width:26px;height:26px;border-radius:50%;flex-shrink:0;background:var(--cbg);border:2px solid var(--cring)}
.danger{margin-top:16px;color:var(--bad);border-color:color-mix(in oklab,var(--bad) 40%,var(--line))}

@media (max-width:1180px){.wgrid{grid-template-columns:minmax(250px,290px) minmax(0,1fr) minmax(270px,320px)}}
@media (max-width:1000px){
  .mtabs{display:flex}
  .wgrid{grid-template-columns:minmax(0,1fr)}
  #work[data-tab="lesson"] #stage,#work[data-tab="lesson"] #insp,
  #work[data-tab="flow"] #lesson,#work[data-tab="flow"] #insp,
  #work[data-tab="out"] #lesson,#work[data-tab="out"] #stage{display:none}
}
@media (max-width:860px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:minmax(0,1fr)}
  .how{grid-template-columns:minmax(0,1fr)}
  .xp .bar{display:none}
  .tnav{margin-left:0}
}
@media (max-width:560px){
  .lang{padding:0 7px}
  .tnav{order:3;width:100%}
  .stops{flex-direction:column;gap:12px}
  .stop{flex-direction:row;align-items:center;min-width:0;padding:0}
  .stop::before{display:none}
  .stop>span{display:flex;flex-direction:column}
  .brand b{font-size:18px}
  .xp{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <button class="brand" id="goHome" data-aria="brand.home">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><circle cx="16" cy="16" r="11.5" fill="var(--peel)"/><g stroke="var(--accent)" stroke-width="1.6"><path d="M16 4.5v23M4.5 16h23M7.9 7.9l16.2 16.2M24.1 7.9L7.9 24.1"/></g><circle cx="16" cy="16" r="2.4" fill="var(--accent)"/></svg>
      <b>DS<i>.</i>Micro</b>
    </button>
    <nav class="tnav" data-aria="nav.sections">
      <button id="navTracks" aria-current="page" data-t="nav.tracks"></button>
      <button id="navFree" data-t="nav.free"></button>
      <button id="navFaq" data-t="nav.faq"></button>
      <button id="navGloss" data-t="nav.gloss"></button>
    </nav>
    <div class="tright">
      <div class="xp" id="xp"></div>
      <label class="lang" for="langSel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><select id="langSel" data-aria="lang.label"></select></label>
      <button class="ibtn" id="themeBtn" data-aria="theme.toggle"></button>
    </div>
  </header>

  <main id="home" class="view"></main>
  <main id="faq" class="view page" hidden></main>
  <main id="gloss" class="view page" hidden></main>

  <section id="work" class="view" data-tab="flow" hidden>
    <div class="mtabs" role="tablist">
      <button role="tab" data-tab="lesson" aria-selected="false" data-t="tab.lesson"></button>

  </section>
</div>

<script>
/* ======================= IDIOMA ======================= */
const I18N = {"en":{"ui":{"and":" and ","brand.home":"DS.Micro, home","nav.sections":"Sections","nav.tracks":"Tracks","nav.free":"Data Lab","lang.label":"Language","theme.toggle":"Toggle light/dark theme","xp.lessons":"{n}/{t} lessons","hero.eyebrow":"Micro-learning · visual workflows in the style of Orange Data Mining","hero.title":"Data science, <em>one widget</em> at a time.","hero.lead":"3 to 5 minute lessons where you build real workflows: load data, clean it, visualize it, train models and measure the result. Everything runs right here in the browser, on real data.","hero.continue":"Continue: {t}","hero.start":"Start with lesson 1","hero.free":"Open Data Lab","facts.lessons":"micro-lessons","facts.widgets":"widgets","facts.datasets":"datasets","hero.aria":"Workflow: File and kNN connected to Test and Score","hero.caption":"Computed just now: kNN (k = 5) on Iris, 5-fold cross-validation.","tracks.h":"Tracks","tracks.p":"{n} tracks, from your first widget to ensembles and ROC curves. Each lesson has a short concept, a mission on the canvas and a check question.","track.n":"Track {i} · {d}/{t}","min":"{m} min","lvl.beginner":"Beginner","lvl.intermediate":"Intermediate","lvl.advanced":"Advanced","how.h":"How each lesson works","how.1s":"1 · 1 min","how.1t":"Read the concept","how.1p":"One idea at a time, with a tip on how it shows up in the real Orange.","how.2s":"2 · 2 to 3 min","how.2t":"Build the workflow","how.2p":"Drag widgets, connect ports and adjust parameters. The mission ticks itself off when the workflow works.","how.3s":"3 · 30 s","how.3t":"Check","how.3p":"One question about what you just saw in the data. Mission plus question completes the lesson.","foot.text":"Independent educational project inspired by <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a> (University of Ljubljana). The widgets here are simplified simulations.","foot.saved":"Progress saved in this browser.","tab.lesson":"Lesson","tab.flow":"Workflow","tab.out":"Output","canvas.aria":"Widget canvas","zoom.out":"Zoom out","zoom.in":"Zoom in","zoom.fit":"Fit workflow","hint.pending":"Tap the target widget (the pulsing ones accept the connection). Tap the background to cancel.","hint.empty":"Tap a palette item to add a widget. With a widget selected, the new one arrives already connected to it.","hint.normal":"Drag from the right dot to another widget to connect. Tap a widget to see its output.","toast.added":"{w} added","toast.addedLinked":"{w} added and connected to {s}","toast.noAccept":"{w} does not accept {c}.","toast.cycle":"That connection would create a cycle.","toast.linked":"{a} → {b} ({c})","toast.step":"Mission: step {i} done","toast.done":"Lesson complete · +{xp} XP","toast.reset":"Workflow restarted","toast.recipe":"Workflow loaded: {t}","port.drag":"Drag to connect","link.remove":"Remove connection","chan.data":"Data","chan.learner":"Model","chan.results":"Results","cat.data":"Data","cat.vis":"Visualize","cat.model":"Model","cat.eval":"Evaluate","cat.unsup":"Unsupervised","insp.emptyH":"Output","insp.emptyP":"Tap a widget on the canvas to see what comes out of it and adjust its parameters.","insp.output":"output: {c}","insp.err":"Error.","insp.wait":"Waiting for {x}. Connect the input on the left side of the widget.","insp.remove":"Remove widget","f.dataset":"Dataset","f.keep":"Kept variables","f.method":"Method","f.mean":"Mean (num.) and mode (cat.)","f.drop":"Drop rows with \"?\"","f.normalize":"Normalize","f.z":"Standardize: μ = 0, σ = 1","f.mm":"Range [0, 1]","f.rankn":"Keep the n best","f.var":"Variable","f.x":"x axis","f.y":"y axis","f.color":"Color","f.none":"(none)","f.k":"Neighbors (k)","f.depth":"Maximum depth","f.C":"Strength C (smaller = more regularization)","f.trees":"Number of trees","f.sampling":"Sampling","f.cv":"Cross-validation, {k} folds","f.train":"Test on training data","f.model":"Model","f.cls":"Target (positive) class","f.groups":"Number of clusters","f.fixed":"Fixed","f.range":"Try 2 to 8 (silhouette)","f.kfixed":"k (fixed mode)","f.norm":"Normalize columns","f.yes":"Yes","f.no":"No","sub.all":"all","sub.cols":"{n} columns","sub.meanmode":"mean / mode","sub.drop":"drop rows","sub.z":"standardize","sub.depth":"depth {d}","sub.folds":"{k} folds","sub.ontrain":"on train data","sub.range":"k = 2 to 8","sub.trees":"{n} trees","ln.tree":"Tree (depth {d})","ln.rf":"Random Forest ({n})","e.noTarget":"This data has no target variable. A classifier needs to know what to predict.","e.targetCat":"The target variable must be categorical for classification.","e.noFeat":"No input variables are left for the model to learn from.","e.missing":"There are missing values (\"?\") in \"{c}\". Put an Impute before the model.","e.kmNum":"k-Means needs numeric variables.","e.kmMissing":"There are \"?\" values in \"{c}\". Use Impute before k-Means.","e.rankTarget":"Rank needs a categorical target variable.","e.noSelect":"No variable selected. Tick at least one.","e.noNum":"There are no numeric variables to plot.","e.cycle":"cycle","v.output":"Output","v.outputOf":"Output · {d}","v.sum":"{r} rows · {c} columns · {m} missing · target: {t}","v.showing":"Showing 120 of {n} rows.","th.target":"target","v.var":"Variable","v.dist":"Distribution","v.mean":"Mean","v.sd":"SD","v.min":"Min","v.max":"Max","v.hist":"Histogram","v.scatter":"Scatter · {n} points","v.learnerOut":"Output: Model","v.untrained":"not trained yet: connect it to a Test and Score","v.treeHint":"Connect a File to the input to see the rules learned from all the data.","v.rules":"Learned rules (all data)","v.if":"if","v.oneLeaf":"A single leaf: {c}","v.lrHint":"Connect a File (or Impute) to the input to see the coefficients learned from all the data.","v.coefHead":"Coefficients for \"{c}\" · standardized variables","v.coefNote":"Orange pushes toward \"{c}\", blue pushes away. Because the variables were standardized, the sizes are comparable.","v.igHead":"Information gain about \"{t}\"","v.gain":"Gain","v.passes":"kept","v.cv":"Stratified cross-validation · {k} folds · {n} rows","v.train":"Tested on its own training data · {n} rows","v.trainWarn":"Warning: the model is being evaluated on the same data it trained on. This overestimates performance.","v.model":"Model","v.prec":"Precision","v.rec":"Recall","v.best":"best","v.weighted":"F1, precision and recall are averages weighted by class, as in Orange.","v.cmHead":"{m} · rows: actual, columns: predicted","v.cmCorner":"Actual \\ Predicted","v.cmNote":"Green on the diagonal: correct. Red off it: confusions.","v.rocHead":"Positive class: {c} · {p} positives, {n} negatives","v.fpr":"false positive rate","v.tpr":"true positive rate","v.rocNote":"The dashed diagonal is a model that guesses (AUC 0.5). The closer the curve gets to the top-left corner, the better.","v.clusters":"clusters","v.silMean":"mean silhouette","v.silByK":"Silhouette by k","v.silhouette":"Silhouette","v.sizes":"Cluster sizes","l.track":"Track {i} · {t}","l.inOrange":"In Orange","l.mission":"Mission","l.check":"Check","l.notYet":"Not yet. Look at the output on the canvas again and try another option.","l.doneTitle":"Lesson complete","l.doneSub":"Explore the workflow freely or move on to the next one.","l.needQuiz":"Mission accomplished. Now answer the question.","l.needMission":"Correct answer. Now finish the mission on the canvas.","l.prev":"← Previous","l.reset":"Restart workflow","l.next":"Next →","free.meta":"Open workspace","free.h":"Data Lab","free.p":"Build any workflow with the {n} widgets. Start from a ready-made workflow or from scratch.","free.recipes":"Ready-made workflows","free.datasets":"Datasets","free.dsMeta":"{r} rows · {c} columns · target: {t}","seo.title":"DS.Micro · Learn data science with visual workflows","seo.desc":"Free micro-lessons to learn data science by building Orange-style visual workflows in your browser: kNN, decision trees, random forest, ROC and k-Means.","nav.faq":"FAQ","nav.gloss":"Glossary","faq.h":"Frequently asked questions","faq.p":"What DS.Micro is for, how to use it and how it relates to the real Orange. Can't find a term? See the <a href=\"#glossary\" data-route=\"glossary\">glossary</a>.","gloss.h":"Glossary","gloss.p":"The {n} data science terms used in the lessons, in plain language. Each one links to the lessons where it appears.","gloss.search":"Search terms","gloss.count":"{n} of {t} terms","gloss.empty":"No term matches \"{q}\"."},"w":{"file":"Loads a dataset. It is the starting point of almost every workflow.","table":"Shows the data row by row. Missing values appear as \"?\".","stats":"Summary of each column: type, center, spread and missing values.","select":"Chooses which variables move on through the workflow. The target always moves on.","impute":"Fills the \"?\" (mean for numbers, most common value for categories) or drops incomplete rows.","normalize":"Normalizes numeric variables so they are on the same scale.","rank":"Orders variables by information gain about the target and passes on only the n best.","dist":"Histogram of one variable, split by the target classes.","scatter":"Each point is a data row; two numeric axes and color by category.","knn":"Classifies by the vote of the k nearest neighbors.","tree":"Learns \"if … then …\" rules. Connect data to it to see the tree.","nb":"Uses the probabilities of each variable per class, assuming the variables are independent.","logreg":"Linear model that estimates the probability of each class. Connect data to it to see the coefficients.","rf":"Many trees, each trained on a different sample; the forest decides by averaging.","test":"Evaluates models with stratified cross-validation or on the training data itself.","confusion":"Crosses actual class with predicted class: where the model gets it right and where it confuses.","roc":"ROC curve of each model for a target class: true positives against false alarms at every threshold.","kmeans":"Groups similar rows into k clusters without looking at the target. Adds the Cluster column."},"ds":{"iris":{"label":"Iris","desc":"Measurements of 150 flowers from three iris species (Fisher, 1936)."},"wine":{"label":"Wine","desc":"Chemical analysis of 178 wines from three Italian cultivars (UCI)."},"customers":{"label":"Customers (fictional)","desc":"220 fictional subscribers of an app; some fields came in empty. Predict who churns."}},"tracks":[{"title":"First steps","desc":"Widgets, connections and what lives inside a dataset."},{"title":"Visual exploration","desc":"Look before you model: scatter plots and variable selection."},{"title":"Data preparation","desc":"Real data arrives dirty and on different scales."},{"title":"Classification","desc":"Train, evaluate and compare models that predict classes."},{"title":"Clustering","desc":"Finding structure without labels: k-Means and silhouette."},{"title":"Advanced machine learning","desc":"Linear models, ensembles, overfitting, ROC curves and feature selection."}],"recipes":["Classify iris with 3 models","Clean and evaluate customers","Cluster wines and visualize","Churn: logistic vs. forest with ROC"],"lessons":{"l1":{"title":"Your first workflow","concept":"<p>In Orange, an analysis is a <b>workflow</b>. Each circle is a <b>widget</b> that does a single job, and each line carries data from one widget to the next.</p><p>Data leaves through the port on the <b>right</b> and enters through the port on the <b>left</b>. To connect, drag from the right dot of a widget to another one. On a phone, tap the dot and then the target widget.</p>","tip":"Orange's widgets also have the output on the right and the input on the left. Dashed lines mean no data is flowing yet.","goals":["Add a <code>Data Table</code> (palette › Data).","Connect the output of <code>File</code> to the input of <code>Data Table</code>.","Tap the <code>Data Table</code> to see the 150 flowers in the Output."],"quiz":{"q":"What does a line between two widgets represent?","o":["Data flowing from one widget to the other","The order in which the widgets were created","A copy of the file saved to disk"],"why":"The line is a channel: everything that leaves one widget reaches the next and is recomputed whenever something before it changes."}},"l2":{"title":"Types of variables","concept":"<p>Each column is a <b>variable</b>. <b>Numeric</b> ones hold measurements (petal length in cm). <b>Categorical</b> ones hold labels (the flower's species).</p><p>The <b>target variable</b> is the one we want to predict. Models learn the relationship between the other columns and the target.</p>","tip":"In Orange, the target appears with the \"target\" role and a highlight color in the Data Table. You change roles in the File widget or in Edit Domain.","goals":["Connect a <code>Feature Statistics</code> to the <code>File</code>.","Open <code>Feature Statistics</code> and compare the mean and spread of each column."],"quiz":{"q":"In the Iris dataset, which column is the target variable?","o":["iris","petal length","sepal width"],"why":"The \"iris\" column holds the species. That is what classifiers will try to predict from the measurements."}},"l3":{"title":"Distributions","concept":"<p>A <b>histogram</b> splits the values into ranges and counts how many rows fall into each. When we color the bars by class, we can see whether a variable separates the species well.</p>","tip":"Orange's Distributions widget colors the bars by the target automatically and lets you stack or overlay the classes.","goals":["Connect a <code>Distributions</code> to the <code>File</code>.","In the Output, choose the variable <code>petal length</code>."],"quiz":{"q":"Looking at petal length, which species stands apart from the others?","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"Setosa petals measure up to about 2 cm; the other two species start well after that. A variable like this is great for classification."}},"l4":{"title":"Scatter plot","concept":"<p>In a <b>scatter plot</b>, each point is a row of the data. Two numeric axes show the relationship between two variables and color shows the class.</p><p>If the colors form separate islands, a model will have an easy time.</p>","tip":"Orange's Scatter Plot has a \"Find Informative Projections\" button that searches on its own for the axis pairs that best separate the classes.","goals":["Connect a <code>Scatter Plot</code> to the <code>File</code>.","x axis = <code>petal length</code> and y axis = <code>petal width</code>.","Color = <code>iris</code>."],"quiz":{"q":"What does the petal plot show?","o":["The species form almost separate groups","The points are scattered at random","There are only two species in the data"],"why":"Setosa forms an isolated island; versicolor and virginica touch only in a narrow band. That is why classifiers score so high on Iris."}},"l5":{"title":"Choosing columns","concept":"<p>Not every variable helps. <b>Select Columns</b> lets only the ones you choose through. The target always moves on.</p><p>Fewer columns make plots and models easier to interpret.</p>","tip":"In the real Orange, Select Columns has three boxes: Features, Target and Metas. Dragging a column to Metas removes it from the model without deleting it.","goals":["Connect a <code>Select Columns</code> to the <code>File</code>.","Keep only <code>petal length</code> and <code>petal width</code>.","Connect a <code>Scatter Plot</code> after <code>Select Columns</code>."],"quiz":{"q":"Why remove columns before modeling?","o":["To focus on what is relevant and simplify the model","Because Orange only accepts two columns","To increase the number of rows"],"why":"Irrelevant variables bring noise. With a few good ones, the model is faster, more stable and easier to explain."}},"l6":{"title":"Missing values","concept":"<p>Real spreadsheets have holes. Orange shows each missing value as <code>?</code>. Many models cannot handle them.</p><p><b>Impute</b> fills the holes with the mean (numbers) or the most common value (categories). Another option is to drop incomplete rows.</p>","tip":"Orange's Impute can also predict the missing value with a model, or treat \"missing\" as a value of its own.","goals":["Open the <code>Data Table</code> and find the <code>?</code> in income and app hours.","Add an <code>Impute</code> after the <code>File</code>.","Connect a <code>Data Table</code> after <code>Impute</code> and confirm: zero missing."],"quiz":{"q":"What does mean imputation do?","o":["Replaces each \"?\" with the column's mean","Deletes the whole column","Copies the value from the row above"],"why":"It is simple and keeps every row. The cost is slightly shrinking the column's spread, so check how many \"?\" there were."}},"l7":{"title":"Normalization","concept":"<p>In the wine dataset, <code>Proline</code> ranges from 278 to 1680 while <code>Hue</code> stays near 1. For methods that measure <b>distance</b>, the larger column dominates everything.</p><p><b>Standardizing</b> gives each column mean 0 and standard deviation 1.</p>","tip":"In Orange, normalization lives in the Preprocess widget, under \"Normalize Features\". Orange's kNN and k-Means also normalize by default.","goals":["Connect a <code>Preprocess</code> to the wine <code>File</code>.","Connect a <code>Feature Statistics</code> after <code>Preprocess</code>.","Use \"Standardize\" and check: the mean of <code>Proline</code> = 0."],"quiz":{"q":"Why normalize before a kNN?","o":["Because kNN measures distances and Proline (hundreds) would dominate Hue (around 1)","Because kNN does not accept negative numbers","Because it increases the number of neighbors"],"why":"Without normalizing, the distance between two wines would be almost only the difference in Proline. The other variables would practically vanish."}},"l8":{"title":"Your first model: kNN","concept":"<p>A <b>classifier</b> learns from labeled examples and predicts the label of new ones. <b>kNN</b> looks at the k most similar examples and takes a vote.</p><p>Model widgets output a <b>Model</b>, not data. The one that trains and measures is <b>Test and Score</b>: it receives the data and one or more models.</p>","tip":"In Orange, Test and Score has two inputs: Data and Learner. A single Test and Score accepts several learners at once.","goals":["Connect the <code>File</code> to a <code>Test and Score</code>.","Connect a <code>kNN</code> to the same <code>Test and Score</code>.","Reach an accuracy (CA) of at least 0.90."],"quiz":{"q":"What is 5-fold cross-validation?","o":["Training 5 times, each time testing on a different part of the data","Training with 5% of the data","Repeating the same test 5 times to double-check"],"why":"Each row is used for testing exactly once, by a model that did not see it during training. That gives an honest estimate of performance."}},"l9":{"title":"Decision tree","concept":"<p>A <b>decision tree</b> asks questions in sequence: \"Proline &gt; 755?\", \"Flavanoids ≤ 1.4?\". Each leaf gives a class.</p><p>It is one of the few models you can read as rules. The <b>depth</b> controls how many questions in a row it can ask.</p>","tip":"In Orange, connect the Tree's Model output to a Tree Viewer to see the tree drawn. Here the rules appear directly in the Tree's Output.","goals":["Connect the wine <code>File</code> to a <code>Tree</code> and read the rules in the Output.","Evaluate the <code>Tree</code> in a <code>Test and Score</code> with the wines.","Adjust the depth until the tree's CA is 0.88 or higher."],"quiz":{"q":"Increasing the tree depth a lot tends to…","o":["Memorize the training data and make more mistakes on new data (overfitting)","Always improve test accuracy","Make the model easier to read"],"why":"A deep tree creates rules for rare training cases. Cross-validation shows when that starts to hurt the result."}},"l10":{"title":"Comparing models","concept":"<p>There is no model that is best at everything. The practice is to put several in the same <b>Test and Score</b> and compare them on the same folds.</p><p>The customers data has <code>?</code>, so the workflow needs an <b>Impute</b> before evaluation.</p>","tip":"Orange's Test and Score has a \"Compare models\" table that estimates the probability that one model is truly better than another.","goals":["Build <code>File → Impute → Test and Score</code>.","Connect at least two different models to <code>Test and Score</code>."],"quiz":{"q":"Which metric shows the proportion of correct predictions?","o":["CA (Classification Accuracy)","Recall","Number of folds"],"why":"CA is correct ÷ total. When classes are imbalanced (few churners), also look at F1, precision and recall."}},"l11":{"title":"Confusion matrix","concept":"<p>Accuracy hides <b>where</b> the model errs. The <b>confusion matrix</b> crosses the actual class (rows) with the predicted one (columns). The diagonal holds the correct answers.</p><p>For a retention team, failing to predict a churn usually costs more than a false alarm.</p>","tip":"In Orange, selecting cells in the Confusion Matrix sends those rows downstream. It is a quick way to investigate the cases the model got wrong.","goals":["Connect a <code>Confusion Matrix</code> to the output of <code>Test and Score</code>.","Open the matrix and find the churns the model did not predict."],"quiz":{"q":"A customer who churned, but the model predicted \"no\", is a…","o":["False negative (for the \"yes\" class)","True positive","False positive"],"why":"Actual \"yes\", predicted \"no\". It appears in row \"yes\", column \"no\", off the diagonal."}},"l12":{"title":"k-Means","concept":"<p><b>Unsupervised</b> learning does not use the target. <b>k-Means</b> splits the data into k groups of nearby points and creates the <code>Cluster</code> column.</p><p>Afterwards, you can compare the groups it found with the real species.</p>","tip":"In Orange, k-Means adds Cluster as a meta attribute. A Scatter Plot after it can color by Cluster right away.","goals":["Connect a <code>k-Means</code> with k = 3 to the iris <code>File</code>.","Connect a <code>Scatter Plot</code> after <code>k-Means</code>.","Color the plot by <code>Cluster</code> and then by <code>iris</code> to compare."],"quiz":{"q":"Does k-Means use the \"iris\" column to form the groups?","o":["No. It ignores the target and only looks at the measurements","Yes, one group per species","Only if k equals the number of species"],"why":"The groups come only from the geometry of the points. That they match the species well is a discovery, not a rule."}},"l13":{"title":"How many clusters? Silhouette","concept":"<p>Without labels, how do you choose k? The <b>silhouette</b> measures, for each point, how much closer it is to its own group than to the neighboring group. It ranges from −1 to 1.</p><p>Try several k and keep the one with the highest mean silhouette.</p>","tip":"Orange's k-Means has a \"From 2 to 8\" option that runs every k and lists the silhouette of each.","goals":["Connect a <code>k-Means</code> to the wines and use \"Try 2 to 8\".","Switch back to fixed mode with the k that has the highest silhouette."],"quiz":{"q":"A mean silhouette close to 1 indicates…","o":["Points well inside their own group and far from the others","Overlapping groups","That k is too large"],"why":"Near 0, the groups touch; negative, there are points in the wrong group. It is a clue, and domain knowledge decides in the end."}},"l14":{"title":"Logistic regression","concept":"<p>Despite the name, <b>logistic regression</b> is a classifier. It adds up the variables with weights (<b>coefficients</b>) and turns the result into a probability between 0 and 1.</p><p>The <b>C</b> parameter controls regularization. A small C keeps coefficients near zero; a large C lets the model follow the data more closely.</p>","tip":"In Orange, connect the Logistic Regression's Coefficients output to a Data Table to see the weights. The default regularization is Ridge (L2) with C = 1, the same used here.","goals":["Build a <code>Test and Score</code> after <code>Impute</code> with <code>Logistic Regression</code> and <code>kNN</code>.","Confirm that logistic regression beats kNN in CA.","Also connect <code>Impute</code> to the input of <code>Logistic Regression</code> and open the coefficients."],"quiz":{"q":"The coefficient of \"support tickets\" is positive. What does that indicate?","o":["More tickets raise the predicted chance of churning","Tickets do not influence the model","Customers with more tickets churn less"],"why":"The sign gives the direction and the size gives the strength. With standardized variables, the weights can be compared with each other."}},"l15":{"title":"Random Forest","concept":"<p>A single tree is unstable: changing a few rows changes the rules. A <b>Random Forest</b> trains many trees, each on a <b>sample drawn with replacement</b> and looking at a random subset of variables at each question.</p><p>The final prediction is the average of the trees. That is an <b>ensemble</b>.</p>","tip":"Orange's Random Forest uses 10 trees by default and draws √(number of variables) candidates at each split, as here.","goals":["Put <code>Tree</code> and <code>Random Forest</code> in the same <code>Test and Score</code> with the wines.","Check that the forest beats the tree in CA.","Grow the forest to 30 trees or more."],"quiz":{"q":"Why does a forest usually beat a single tree?","o":["The average of many different trees reduces variance","Each tree in the forest is deeper","The forest uses more rows than exist"],"why":"Each tree makes mistakes in a different way. On average, individual errors cancel out and what remains is the stable pattern."}},"l16":{"title":"Overfitting in practice","concept":"<p>A model that memorizes the training data looks great and fails on new data. That is <b>overfitting</b>.</p><p>To watch it happen, evaluate a deep tree <b>on its own training data</b> and then with <b>cross-validation</b>. The gap between the two numbers is how much the model memorized.</p>","tip":"In Orange's Test and Score, the \"Test on train data\" option exists precisely for comparison. Never use that number to choose a model.","goals":["In <code>Test and Score</code>, choose \"Test on training data\" with the depth-8 tree. Note the CA.","Switch back to 5-fold cross-validation and watch the CA drop.","Reduce the depth until the tree, under cross-validation, beats the depth-8 one."],"quiz":{"q":"The deep tree had high CA on training and low CA under cross-validation. That indicates…","o":["Overfitting: it memorized training cases","That cross-validation is broken","Underfitting: the model is too simple"],"why":"Underfitting shows up as poor performance on both. Overfitting is the gap between training and the data the model has not seen."}},"l17":{"title":"ROC curve and AUC","concept":"<p>A probabilistic classifier says \"73% chance of churning\". Where do you cut? Each <b>threshold</b> trades hits for false alarms.</p><p>The <b>ROC curve</b> shows every threshold at once. The <b>AUC</b> is the area under it: the chance that the model scores a randomly drawn positive higher than a randomly drawn negative.</p>","tip":"Orange's ROC Analysis also draws the cost curve and finds the optimal threshold given the cost of each type of error.","goals":["Evaluate <code>Logistic Regression</code> and <code>Naive Bayes</code> in a <code>Test and Score</code> after <code>Impute</code>.","Connect a <code>ROC Analysis</code> to <code>Test and Score</code>, with target class <code>yes</code>.","Open the curve and compare the AUCs."],"quiz":{"q":"A model with AUC = 0.5 is…","o":["Equivalent to a coin flip: it does not rank positives above negatives","Perfect for half of the cases","Always better than 50% CA"],"why":"AUC does not depend on the chosen threshold. 0.5 is the diagonal; 1 is perfect ranking. It is useful when classes are imbalanced."}},"l18":{"title":"Feature selection with Rank","concept":"<p><b>Information gain</b> measures how much knowing a variable's value reduces uncertainty about the target.</p><p><b>Rank</b> orders variables by this measure and lets only the n best through. Sometimes a few variables are enough for nearly the same performance.</p>","tip":"Orange's Rank computes several measures at once (information gain, Gini, ANOVA, ReliefF) and you choose which one to sort by.","goals":["Connect a <code>Rank</code> to the wine <code>File</code> and see which variable leads.","Connect <code>Rank</code> to a <code>Test and Score</code> with a <code>kNN</code>.","With at most 3 variables, reach a CA of 0.93 or higher."],"quiz":{"q":"Which variable has the highest information gain in the wines?","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids separates the three cultivars well. Malic Acid helps the least; Rank puts it last."}}},"faq":[{"s":"About the project","items":[{"q":"What is DS.Micro?","a":"<p>A free micro-learning platform for data science. Each lesson takes 3 to 5 minutes: you read one concept, build a small workflow of widgets on a canvas and answer a check question.</p><p>The goal is to help anyone take the first steps in data science by doing, without installing anything or writing code.</p>"},{"q":"Who is it for?","a":"<p>Students, teachers and professionals who want to understand how data analysis and machine learning work. The tracks go from beginner (what a dataset is) to advanced (ensembles, overfitting, ROC curves).</p>"},{"q":"What is its relationship with Orange Data Mining?","a":"<p>DS.Micro is an independent educational project inspired by <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>, the visual tool from the University of Ljubljana. The widgets have the same names and the same logic as in Orange, so what you learn here carries over directly.</p><p>The widgets here are simplified simulations. For real projects, use Orange itself.</p>"},{"q":"Is it free? Do I need an account?","a":"<p>Yes, it is free, and no account is needed. Everything runs in your browser.</p>"}]},{"s":"How to use it","items":[{"q":"How does a lesson work?","a":"<p>Each lesson has three parts:</p><p><b>Concept:</b> a short explanation and a tip on how it looks in the real Orange.<br><b>Mission:</b> steps to complete on the canvas. They tick themselves off when the workflow works.<br><b>Check:</b> a question about what you saw in the data.</p><p>The lesson is complete when the mission and the question are both done.</p>"},{"q":"How do I add and connect widgets?","a":"<p>Tap an item in the palette above the canvas to add a widget. If a widget is selected, the new one arrives already connected to it.</p><p>To connect two widgets, drag from the dot on the right side of one widget to another widget. On a phone, tap the dot and then the target widget. Data always flows from right (output) to left (input).</p><p>To remove a connection, use the × on its label. To remove a widget, select it and use the button in the Output panel.</p>"},{"q":"Where do I see the results?","a":"<p>Tap any widget. Its parameters and output (table, chart, metrics or rules) appear in the Output panel. On a phone, open the Output tab.</p>"},{"q":"What is the Data Lab?","a":"<p>An open workspace with no mission, where you build any workflow with all the widgets and datasets. It has ready-made workflows to start from. <a href=\"#lab\" data-route=\"lab\">Open the Data Lab</a>.</p>"},{"q":"Which datasets are used?","a":"<p><b>Iris</b> (150 flowers, three species) and <b>Wine</b> (178 wines, three cultivars) are classic real datasets. <b>Customers</b> is a fictional dataset with missing values, created to practice data cleaning and churn prediction.</p>"},{"q":"Are the results real?","a":"<p>Yes. Models, cross-validation and metrics are actually computed in your browser on the data. Numbers may differ slightly from Orange, because some algorithms here are simplified.</p>"}]},{"s":"Progress and technical questions","items":[{"q":"Where is my progress saved?","a":"<p>In your own browser (local storage). Nothing is sent to a server. If you clear site data or switch browser or device, progress starts over.</p>"},{"q":"Does it work offline?","a":"<p>Yes. DS.Micro is a single, self-contained HTML file: data, languages and fonts are inside it. Once loaded, it works without internet.</p>"},{"q":"How do I change the language?","a":"<p>Use the language selector at the top of the page. Available languages: English, Español, Português, 中文, हिन्दी and 한국어.</p>"},{"q":"How do I move on to the real Orange?","a":"<p>Download Orange for free at <a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a> and rebuild the workflows from the lessons. The widget names are the same, and the \"In Orange\" tips in each lesson point out the differences.</p>"}]}],"gloss":{"dataset":{"t":"Dataset","d":"A table of data: each row is an example (a flower, a wine, a customer) and each column is a variable."},"widget":{"t":"Widget","d":"A building block of a workflow that does one job, such as loading data, drawing a chart or training a model."},"workflow":{"t":"Workflow","d":"A chain of connected widgets. Data flows from one widget's output (right) to the next one's input (left)."},"variable":{"t":"Variable (feature)","d":"A column of the dataset that describes the examples, such as petal length. Models learn from the variables."},"numeric":{"t":"Numeric variable","d":"A variable whose values are numbers that can be measured and compared, such as income or age."},"categorical":{"t":"Categorical variable","d":"A variable whose values are labels from a fixed set, such as plan (basic, plus, premium) or species."},"target":{"t":"Target variable","d":"The variable we want to predict, such as the species or whether a customer churned. Also called the class."},"meta":{"t":"Meta attribute","d":"A column kept with the data but ignored by models, such as an ID or the Cluster column added by k-Means."},"histogram":{"t":"Histogram","d":"A chart that splits values into ranges and counts how many rows fall into each range."},"scatter":{"t":"Scatter plot","d":"A chart where each row is a point placed by two numeric variables; color can show the class."},"featsel":{"t":"Feature selection","d":"Choosing which variables to use in a model, keeping the informative ones and dropping noise."},"missing":{"t":"Missing value","d":"A cell with no value. Orange shows it as \"?\". Many models cannot work with missing values."},"imputation":{"t":"Imputation","d":"Filling in missing values, for example with the column mean or its most common value."},"normalization":{"t":"Normalization","d":"Putting numeric variables on the same scale. Standardizing gives each column mean 0 and standard deviation 1."},"classification":{"t":"Classification","d":"Predicting a category (the class) for each example, such as the species of a flower."},"learner":{"t":"Learner (model)","d":"An algorithm that learns patterns from labeled examples and then predicts the class of new examples."},"knn":{"t":"k-nearest neighbors (kNN)","d":"Classifies an example by a vote among the k most similar examples in the training data."},"cv":{"t":"Cross-validation","d":"An evaluation method that splits the data into folds and tests on each fold with a model trained on the others."},"fold":{"t":"Fold","d":"One of the equal parts the data is split into for cross-validation. Each fold is used for testing once."},"stratified":{"t":"Stratification","d":"Splitting data so each fold keeps the same class proportions as the whole dataset."},"ca":{"t":"Classification accuracy (CA)","d":"The share of examples the model predicted correctly: correct predictions ÷ total."},"precision":{"t":"Precision","d":"Of the examples predicted as a class, the share that truly belong to it. High precision means few false alarms."},"recall":{"t":"Recall","d":"Of the examples that truly belong to a class, the share the model found. High recall means few misses."},"f1":{"t":"F1 score","d":"The harmonic mean of precision and recall. It is high only when both are high."},"imbalance":{"t":"Class imbalance","d":"When one class is much rarer than the others, such as churners. Accuracy alone can then be misleading."},"tree":{"t":"Decision tree","d":"A model that asks a sequence of yes/no questions about the variables; each leaf gives a class. It can be read as rules."},"depth":{"t":"Tree depth","d":"The maximum number of questions in a row a decision tree can ask. Deeper trees fit more detail and overfit more easily."},"nb":{"t":"Naive Bayes","d":"A probabilistic classifier that combines the evidence from each variable, assuming the variables are independent."},"confusion":{"t":"Confusion matrix","d":"A table that crosses actual classes (rows) with predicted classes (columns). The diagonal holds the correct predictions."},"fpfn":{"t":"False positive / false negative","d":"A false positive is a false alarm (predicted yes, actually no). A false negative is a miss (predicted no, actually yes)."},"unsup":{"t":"Unsupervised learning","d":"Learning from data without a target variable, to find structure such as groups."},"clustering":{"t":"Clustering","d":"Grouping similar examples together without using labels."},"kmeans":{"t":"k-Means","d":"A clustering algorithm that splits the data into k groups, each built around a center of nearby points."},"silhouette":{"t":"Silhouette","d":"A score from −1 to 1 that measures how well each point fits its own cluster compared with the nearest other cluster."},"logreg":{"t":"Logistic regression","d":"A linear classifier that weighs the variables and turns the sum into a probability between 0 and 1."},"coefficient":{"t":"Coefficient","d":"The weight a linear model gives to a variable. The sign shows the direction of the effect and the size its strength."},"regularization":{"t":"Regularization","d":"A penalty that keeps model coefficients small to avoid overfitting. In logistic regression it is controlled by C."},"ensemble":{"t":"Ensemble","d":"A model that combines the predictions of many models to get a more stable result."},"rf":{"t":"Random forest","d":"An ensemble of decision trees, each trained on a bootstrap sample and a random subset of variables; it predicts by averaging."},"bootstrap":{"t":"Bootstrap sample","d":"A sample drawn with replacement from the data, the same size as the original. Some rows repeat and others are left out."},"overfitting":{"t":"Overfitting","d":"When a model memorizes the training data and performs much worse on new data."},"underfitting":{"t":"Underfitting","d":"When a model is too simple to capture the pattern and performs poorly even on the training data."},"traintest":{"t":"Training data and test data","d":"Training data is used to fit the model; test data, never seen during training, is used to measure it honestly."},"threshold":{"t":"Decision threshold","d":"The probability cut-off above which a probabilistic classifier predicts the positive class."},"roc":{"t":"ROC curve","d":"A curve showing the true positive rate against the false positive rate across all decision thresholds."},"auc":{"t":"AUC","d":"The area under the ROC curve: the chance the model scores a random positive above a random negative. 0.5 is guessing, 1 is perfect."},"infogain":{"t":"Information gain","d":"How much knowing a variable reduces uncertainty about the target. Used by Rank to order variables."}}},"es":{"ui":{"and":" y ","brand.home":"DS.Micro, inicio","nav.sections":"Secciones","nav.tracks":"Rutas","nav.free":"Data Lab","lang.label":"Idioma","theme.toggle":"Cambiar tema claro/oscuro","xp.lessons":"{n}/{t} lecciones","hero.eyebrow":"Microaprendizaje · flujos visuales al estilo de Orange Data Mining","hero.title":"Ciencia de datos, <em>un widget</em> a la vez.","hero.lead":"Lecciones de 3 a 5 minutos en las que construyes flujos reales: cargas datos, los limpias, los visualizas, entrenas modelos y mides el resultado. Todo se ejecuta aquí, en el navegador, con datos reales.","hero.continue":"Continuar: {t}","hero.start":"Empezar por la lección 1","hero.free":"Abrir Data Lab","facts.lessons":"microlecciones","facts.widgets":"widgets","facts.datasets":"conjuntos de datos","hero.aria":"Flujo: File y kNN conectados a Test and Score","hero.caption":"Calculado ahora: kNN (k = 5) en Iris, validación cruzada de 5 folds.","tracks.h":"Rutas","tracks.p":"{n} rutas, del primer widget a ensembles y curvas ROC. Cada lección tiene un concepto breve, una misión en el lienzo y una pregunta de verificación.","track.n":"Ruta {i} · {d}/{t}","min":"{m} min","lvl.beginner":"Inicial","lvl.intermediate":"Intermedio","lvl.advanced":"Avanzado","how.h":"Cómo funciona cada lección","how.1s":"1 · 1 min","how.1t":"Lee el concepto","how.1p":"Una idea a la vez, con una pista de cómo aparece en el Orange de verdad.","how.2s":"2 · 2 a 3 min","how.2t":"Construye el flujo","how.2p":"Arrastra widgets, conecta los puertos y ajusta parámetros. La misión se marca sola cuando el flujo funciona.","how.3s":"3 · 30 s","how.3t":"Comprueba","how.3p":"Una pregunta sobre lo que acabas de ver en los datos. Misión y pregunta completan la lección.","foot.text":"Proyecto educativo independiente, inspirado en <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a> (Universidad de Liubliana). Los widgets aquí son simulaciones simplificadas.","foot.saved":"Progreso guardado en este navegador.","tab.lesson":"Lección","tab.flow":"Flujo","tab.out":"Salida","canvas.aria":"Lienzo de widgets","zoom.out":"Alejar","zoom.in":"Acercar","zoom.fit":"Encuadrar flujo","hint.pending":"Toca el widget de destino (los que laten aceptan la conexión). Toca el fondo para cancelar.","hint.empty":"Toca un elemento de la paleta para añadir un widget. Con un widget seleccionado, el nuevo llega ya conectado a él.","hint.normal":"Arrastra desde el punto derecho hasta otro widget para conectar. Toca un widget para ver su salida.","toast.added":"{w} añadido","toast.added
