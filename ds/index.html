:"Estos datos no tienen variable objetivo. Un clasificador necesita saber qué predecir.","e.targetCat":"La variable objetivo debe ser categórica para clasificar.","e.noFeat":"No quedó ninguna variable de entrada para que el modelo aprenda.","e.missing":"Hay valores faltantes (\"?\") en \"{c}\". Pon un Impute antes del modelo.","e.kmNum":"k-Means necesita variables numéricas.","e.kmMissing":"Hay \"?\" en \"{c}\". Usa Impute antes de k-Means.","e.rankTarget":"Rank necesita una variable objetivo categórica.","e.noSelect":"Ninguna variable seleccionada. Marca al menos una.","e.noNum":"No hay variables numéricas para graficar.","e.cycle":"ciclo","v.output":"Salida","v.outputOf":"Salida · {d}","v.sum":"{r} filas · {c} columnas · {m} faltantes · objetivo: {t}","v.showing":"Mostrando 120 de {n} filas.","th.target":"objetivo","v.var":"Variable","v.dist":"Distribución","v.mean":"Media","v.sd":"Desv.","v.min":"Mín","v.max":"Máx","v.hist":"Histograma","v.scatter":"Dispersión · {n} puntos","v.learnerOut":"Salida: Modelo","v.untrained":"aún sin entrenar: conéctalo a un Test and Score","v.treeHint":"Conecta un File a la entrada para ver las reglas aprendidas con todos los datos.","v.rules":"Reglas aprendidas (todos los datos)","v.if":"si","v.oneLeaf":"Una sola hoja: {c}","v.lrHint":"Conecta un File (o Impute) a la entrada para ver los coeficientes aprendidos con todos los datos.","v.coefHead":"Coeficientes para \"{c}\" · variables estandarizadas","v.coefNote":"El naranja empuja hacia \"{c}\", el azul aleja. Como las variables se estandarizaron, los tamaños son comparables.","v.igHead":"Ganancia de información sobre \"{t}\"","v.gain":"Ganancia","v.passes":"sigue","v.cv":"Validación cruzada estratificada · {k} folds · {n} filas","v.train":"Probado con sus propios datos de entrenamiento · {n} filas","v.trainWarn":"Atención: el modelo se evalúa con los mismos datos con los que entrenó. Esto sobreestima el rendimiento.","v.model":"Modelo","v.prec":"Precisión","v.rec":"Recall","v.best":"mejor","v.weighted":"F1, precisión y recall son promedios ponderados por clase, como en Orange.","v.cmHead":"{m} · filas: real, columnas: predicho","v.cmCorner":"Real \\ Predicho","v.cmNote":"Verde en la diagonal: aciertos. Rojo fuera de ella: confusiones.","v.rocHead":"Clase positiva: {c} · {p} positivos, {n} negativos","v.fpr":"tasa de falsos positivos","v.tpr":"tasa de verdaderos positivos","v.rocNote":"La diagonal discontinua es un modelo que adivina (AUC 0,5). Cuanto más se acerca la curva a la esquina superior izquierda, mejor.","v.clusters":"grupos","v.silMean":"silueta media","v.silByK":"Silueta por k","v.silhouette":"Silueta","v.sizes":"Tamaño de los grupos","l.track":"Ruta {i} · {t}","l.inOrange":"En Orange","l.mission":"Misión","l.check":"Comprueba","l.notYet":"Todavía no. Mira de nuevo la salida en el lienzo y prueba otra opción.","l.doneTitle":"Lección completada","l.doneSub":"Explora el flujo libremente o pasa a la siguiente.","l.needQuiz":"Misión cumplida. Falta responder la pregunta.","l.needMission":"Respuesta correcta. Falta completar la misión en el lienzo.","l.prev":"← Anterior","l.reset":"Reiniciar flujo","l.next":"Siguiente →","free.meta":"Espacio abierto","free.h":"Data Lab","free.p":"Construye cualquier flujo con los {n} widgets. Empieza con un flujo listo o desde cero.","free.recipes":"Flujos listos","free.datasets":"Conjuntos de datos","free.dsMeta":"{r} filas · {c} columnas · objetivo: {t}","seo.title":"DS.Micro · Aprende ciencia de datos con flujos visuales","seo.desc":"Microlecciones gratuitas de ciencia de datos: construye flujos visuales al estilo Orange en el navegador con kNN, árboles, random forest, ROC y k-Means.","nav.faq":"FAQ","nav.gloss":"Glosario","faq.h":"Preguntas frecuentes","faq.p":"Para qué sirve DS.Micro, cómo usarlo y qué relación tiene con el Orange real. ¿No encuentras un término? Consulta el <a href=\"#glossary\" data-route=\"glossary\">glosario</a>.","gloss.h":"Glosario","gloss.p":"Los {n} términos de ciencia de datos usados en las lecciones, en lenguaje sencillo. Cada uno lleva a las lecciones donde aparece.","gloss.search":"Buscar términos","gloss.count":"{n} de {t} términos","gloss.empty":"Ningún término coincide con \"{q}\"."},"w":{"file":"Carga un conjunto de datos. Es el punto de partida de casi todo flujo.","table":"Muestra los datos fila por fila. Los valores faltantes aparecen como \"?\".","stats":"Resumen de cada columna: tipo, centro, dispersión y faltantes.","select":"Elige qué variables siguen adelante en el flujo. La variable objetivo siempre sigue.","impute":"Rellena los \"?\" (media para números, valor más frecuente para categorías) o descarta filas incompletas.","normalize":"Normaliza las variables numéricas para que queden en la misma escala.","rank":"Ordena las variables por ganancia de información sobre el objetivo y deja pasar solo las n mejores.","dist":"Histograma de una variable, separado por las clases del objetivo.","scatter":"Cada punto es una fila de los datos; dos ejes numéricos y color por categoría.","knn":"Clasifica por el voto de los k vecinos más cercanos.","tree":"Aprende reglas del tipo \"si … entonces …\". Conéctale datos para ver el árbol.","nb":"Usa las probabilidades de cada variable por clase, suponiendo independencia entre ellas.","logreg":"Modelo lineal que estima la probabilidad de cada clase. Conéctale datos para ver los coeficientes.","rf":"Muchos árboles, cada uno entrenado con una muestra distinta; el bosque decide por el promedio.","test":"Evalúa modelos con validación cruzada estratificada o con los propios datos de entrenamiento.","confusion":"Cruza la clase real con la predicha: dónde acierta el modelo y dónde confunde.","roc":"Curva ROC de cada modelo para una clase objetivo: aciertos positivos frente a falsas alarmas en todos los umbrales.","kmeans":"Agrupa filas parecidas en k grupos sin mirar el objetivo. Añade la columna Cluster."},"ds":{"iris":{"label":"Iris","desc":"Medidas de 150 flores de tres especies de iris (Fisher, 1936)."},"wine":{"label":"Vinos","desc":"Análisis químico de 178 vinos de tres cultivares italianos (UCI)."},"customers":{"label":"Clientes (ficticio)","desc":"220 suscriptores ficticios de una app; algunos campos llegaron vacíos. Predecir quién se da de baja."}},"tracks":[{"title":"Primeros pasos","desc":"Widgets, conexiones y lo que hay dentro de un conjunto de datos."},{"title":"Exploración visual","desc":"Mirar antes de modelar: dispersión y selección de variables."},{"title":"Preparación de datos","desc":"Los datos reales llegan sucios y en escalas distintas."},{"title":"Clasificación","desc":"Entrenar, evaluar y comparar modelos que predicen clases."},{"title":"Agrupamiento","desc":"Descubrir estructura sin etiquetas: k-Means y silueta."},{"title":"Machine Learning avanzado","desc":"Modelos lineales, ensembles, sobreajuste, curvas ROC y selección de variables."}],"recipes":["Clasificar iris con 3 modelos","Limpiar y evaluar clientes","Agrupar vinos y visualizar","Bajas: logística vs. bosque con ROC"],"lessons":{"l1":{"title":"Tu primer flujo","concept":"<p>En Orange, un análisis es un <b>flujo</b>. Cada círculo es un <b>widget</b> que hace una sola tarea, y cada línea lleva datos de un widget al siguiente.</p><p>Los datos salen por el puerto de la <b>derecha</b> y entran por el puerto de la <b>izquierda</b>. Para conectar, arrastra desde el punto derecho de un widget hasta otro. En el móvil, toca el punto y luego el widget de destino.</p>","tip":"Los widgets de Orange también tienen la salida a la derecha y la entrada a la izquierda. Las líneas discontinuas indican que todavía no pasa ningún dato.","goals":["Añade un <code>Data Table</code> (paleta › Datos).","Conecta la salida de <code>File</code> a la entrada de <code>Data Table</code>.","Toca el <code>Data Table</code> para ver las 150 flores en la Salida."],"quiz":{"q":"¿Qué representa una línea entre dos widgets?","o":["Datos que pasan de un widget al otro","El orden en que se crearon los widgets","Una copia del archivo guardada en disco"],"why":"La línea es un canal: todo lo que sale de un widget llega al siguiente y se recalcula cada vez que algo cambia antes."}},"l2":{"title":"Tipos de variables","concept":"<p>Cada columna es una <b>variable</b>. Las <b>numéricas</b> tienen medidas (largo del pétalo en cm). Las <b>categóricas</b> tienen etiquetas (la especie de la flor).</p><p>La <b>variable objetivo</b> (target) es la que queremos predecir. Los modelos aprenden la relación entre las demás columnas y el objetivo.</p>","tip":"En Orange, el objetivo aparece con el rol \"target\" y un color destacado en el Data Table. Los roles se cambian en el widget File o en Edit Domain.","goals":["Conecta un <code>Feature Statistics</code> al <code>File</code>.","Abre <code>Feature Statistics</code> y compara la media y la dispersión de cada columna."],"quiz":{"q":"En el conjunto Iris, ¿qué columna es la variable objetivo?","o":["iris","petal length","sepal width"],"why":"La columna \"iris\" guarda la especie. Es la que los clasificadores intentarán predecir a partir de las medidas."}},"l3":{"title":"Distribuciones","concept":"<p>Un <b>histograma</b> divide los valores en rangos y cuenta cuántas filas caen en cada uno. Al colorear las barras por clase, vemos si una variable separa bien las especies.</p>","tip":"El widget Distributions de Orange colorea las barras por el objetivo automáticamente y permite apilar o superponer las clases.","goals":["Conecta un <code>Distributions</code> al <code>File</code>.","En la Salida, elige la variable <code>petal length</code>."],"quiz":{"q":"Mirando petal length, ¿qué especie queda aislada de las demás?","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"Los pétalos de setosa miden hasta unos 2 cm; las otras dos especies empiezan mucho después. Una variable así es ideal para clasificar."}},"l4":{"title":"Gráfico de dispersión","concept":"<p>En el <b>gráfico de dispersión</b>, cada punto es una fila de los datos. Dos ejes numéricos muestran la relación entre dos variables y el color muestra la clase.</p><p>Si los colores forman islas separadas, un modelo lo tendrá fácil.</p>","tip":"El Scatter Plot de Orange tiene el botón \"Find Informative Projections\", que busca solo los pares de ejes que mejor separan las clases.","goals":["Conecta un <code>Scatter Plot</code> al <code>File</code>.","Eje x = <code>petal length</code> y eje y = <code>petal width</code>.","Color = <code>iris</code>."],"quiz":{"q":"¿Qué muestra el gráfico de pétalos?","o":["Las especies forman grupos casi separados","Los puntos están dispersos al azar","Solo hay dos especies en los datos"],"why":"Setosa forma una isla aislada; versicolor y virginica solo se tocan en una franja estrecha. Por eso los clasificadores aciertan tanto en Iris."}},"l5":{"title":"Elegir columnas","concept":"<p>No toda variable ayuda. <b>Select Columns</b> deja pasar solo las que elijas. La variable objetivo siempre sigue.</p><p>Menos columnas hacen que gráficos y modelos sean más fáciles de interpretar.</p>","tip":"En el Orange real, Select Columns tiene tres cajas: Features, Target y Metas. Arrastrar una columna a Metas la saca del modelo sin borrarla.","goals":["Conecta un <code>Select Columns</code> al <code>File</code>.","Conserva solo <code>petal length</code> y <code>petal width</code>.","Conecta un <code>Scatter Plot</code> después de <code>Select Columns</code>."],"quiz":{"q":"¿Por qué quitar columnas antes de modelar?","o":["Para centrarse en lo relevante y simplificar el modelo","Porque Orange solo acepta dos columnas","Para aumentar el número de filas"],"why":"Las variables irrelevantes traen ruido. Con pocas buenas, el modelo es más rápido, más estable y más fácil de explicar."}},"l6":{"title":"Valores faltantes","concept":"<p>Las hojas de cálculo reales tienen huecos. Orange muestra cada valor faltante como <code>?</code>. Muchos modelos no saben manejarlos.</p><p><b>Impute</b> rellena los huecos con la media (números) o el valor más frecuente (categorías). Otra opción es descartar las filas incompletas.</p>","tip":"El Impute de Orange también puede predecir el valor faltante con un modelo, o tratar \"faltante\" como un valor propio.","goals":["Abre el <code>Data Table</code> y encuentra los <code>?</code> en income y app hours.","Añade un <code>Impute</code> después del <code>File</code>.","Conecta un <code>Data Table</code> después de <code>Impute</code> y confirma: cero faltantes."],"quiz":{"q":"¿Qué hace la imputación por la media?","o":["Sustituye cada \"?\" por la media de la columna","Borra la columna entera","Copia el valor de la fila de arriba"],"why":"Es simple y conserva todas las filas. El coste es reducir un poco la variación de la columna, así que conviene ver cuántos \"?\" había."}},"l7":{"title":"Normalización","concept":"<p>En el conjunto de vinos, <code>Proline</code> va de 278 a 1680 mientras <code>Hue</code> se queda cerca de 1. En los métodos que miden <b>distancia</b>, la columna mayor lo domina todo.</p><p><b>Estandarizar</b> deja cada columna con media 0 y desviación 1.</p>","tip":"En Orange, la normalización está en el widget Preprocess, opción \"Normalize Features\". El kNN y el k-Means de Orange también normalizan por defecto.","goals":["Conecta un <code>Preprocess</code> al <code>File</code> de vinos.","Conecta un <code>Feature Statistics</code> después de <code>Preprocess</code>.","Usa \"Estandarizar\" y comprueba: media de <code>Proline</code> = 0."],"quiz":{"q":"¿Por qué normalizar antes de un kNN?","o":["Porque kNN mide distancias y Proline (cientos) dominaría a Hue (cerca de 1)","Porque kNN no acepta números negativos","Porque aumenta el número de vecinos"],"why":"Sin normalizar, la distancia entre dos vinos sería casi solo la diferencia de Proline. Las demás variables prácticamente desaparecerían."}},"l8":{"title":"Tu primer modelo: kNN","concept":"<p>Un <b>clasificador</b> aprende de ejemplos etiquetados y predice la etiqueta de ejemplos nuevos. <b>kNN</b> mira los k ejemplos más parecidos y hace una votación.</p><p>Los widgets de modelo producen un <b>Modelo</b>, no datos. El que entrena y mide es <b>Test and Score</b>: recibe los datos y uno o más modelos.</p>","tip":"En Orange, Test and Score tiene dos entradas: Data y Learner. Un mismo Test and Score acepta varios learners a la vez.","goals":["Conecta el <code>File</code> a un <code>Test and Score</code>.","Conecta un <code>kNN</code> al mismo <code>Test and Score</code>.","Llega a una exactitud (CA) de al menos 0,90."],"quiz":{"q":"¿Qué es la validación cruzada con 5 folds?","o":["Entrenar 5 veces, probando cada vez con una parte distinta de los datos","Entrenar con el 5% de los datos","Repetir la misma prueba 5 veces para comprobar"],"why":"Cada fila se usa para probar exactamente una vez, con un modelo que no la vio al entrenar. Eso da una estimación honesta del rendimiento."}},"l9":{"title":"Árbol de decisión","concept":"<p>Un <b>árbol de decisión</b> hace preguntas en secuencia: \"¿Proline &gt; 755?\", \"¿Flavanoids ≤ 1,4?\". Cada hoja da una clase.</p><p>Es uno de los pocos modelos que se leen como reglas. La <b>profundidad</b> controla cuántas preguntas seguidas puede hacer.</p>","tip":"En Orange, conecta la salida Model del Tree a un Tree Viewer para ver el árbol dibujado. Aquí las reglas aparecen directamente en la Salida del Tree.","goals":["Conecta el <code>File</code> de vinos a un <code>Tree</code> y lee las reglas en la Salida.","Evalúa el <code>Tree</code> en un <code>Test and Score</code> con los vinos.","Ajusta la profundidad hasta que la CA del árbol sea 0,88 o más."],"quiz":{"q":"Aumentar mucho la profundidad del árbol tiende a…","o":["Memorizar el entrenamiento y fallar más con datos nuevos (sobreajuste)","Mejorar siempre la exactitud en la prueba","Hacer el modelo más fácil de leer"],"why":"Un árbol profundo crea reglas para casos raros del entrenamiento. La validación cruzada muestra cuándo eso empieza a empeorar el resultado."}},"l10":{"title":"Comparar modelos","concept":"<p>No hay un modelo mejor para todo. La práctica es poner varios en el mismo <b>Test and Score</b> y compararlos con los mismos folds.</p><p>En clientes hay <code>?</code>, así que el flujo necesita un <b>Impute</b> antes de la evaluación.</p>","tip":"El Test and Score de Orange tiene la tabla \"Compare models\", que estima la probabilidad de que un modelo sea realmente mejor que otro.","goals":["Construye <code>File → Impute → Test and Score</code>.","Conecta al menos dos modelos distintos al <code>Test and Score</code>."],"quiz":{"q":"¿Qué métrica muestra la proporción de aciertos?","o":["CA (Classification Accuracy)","Recall","Número de folds"],"why":"CA es aciertos ÷ total. Cuando las clases están desbalanceadas (pocas bajas), mira también F1, precisión y recall."}},"l11":{"title":"Matriz de confusión","concept":"<p>La exactitud oculta <b>dónde</b> falla el modelo. La <b>matriz de confusión</b> cruza la clase real (filas) con la predicha (columnas). La diagonal son los aciertos.</p><p>Para un equipo de retención, no prever una baja suele costar más que una falsa alarma.</p>","tip":"En Orange, seleccionar celdas de la Confusion Matrix envía esas filas hacia adelante. Es una forma rápida de investigar los casos que el modelo falló.","goals":["Conecta un <code>Confusion Matrix</code> a la salida de <code>Test and Score</code>.","Abre la matriz y encuentra las bajas que el modelo no previó."],"quiz":{"q":"Un cliente que se dio de baja, pero el modelo predijo \"no\", es un…","o":["Falso negativo (para la clase \"yes\")","Verdadero positivo","Falso positivo"],"why":"Real \"yes\", predicho \"no\". Aparece en la fila \"yes\", columna \"no\", fuera de la diagonal."}},"l12":{"title":"k-Means","concept":"<p>El aprendizaje <b>no supervisado</b> no usa el objetivo. <b>k-Means</b> divide los datos en k grupos de puntos cercanos y crea la columna <code>Cluster</code>.</p><p>Después se pueden comparar los grupos encontrados con las especies reales.</p>","tip":"En Orange, k-Means añade Cluster como meta-atributo. Un Scatter Plot después de él ya puede colorear por Cluster.","goals":["Conecta un <code>k-Means</code> con k = 3 al <code>File</code> de iris.","Conecta un <code>Scatter Plot</code> después de <code>k-Means</code>.","Colorea el gráfico por <code>Cluster</code> y luego por <code>iris</code> para comparar."],"quiz":{"q":"¿Usa k-Means la columna \"iris\" para formar los grupos?","o":["No. Ignora el objetivo y solo mira las medidas","Sí, un grupo por especie","Solo si k es igual al número de especies"],"why":"Los grupos salen solo de la geometría de los puntos. Que coincidan bien con las especies es un descubrimiento, no una regla."}},"l13":{"title":"¿Cuántos grupos? Silueta","concept":"<p>Sin etiquetas, ¿cómo elegir k? La <b>silueta</b> mide, para cada punto, cuánto más cerca está de su propio grupo que del grupo vecino. Va de −1 a 1.</p><p>Prueba varios k y quédate con el de mayor silueta media.</p>","tip":"El k-Means de Orange tiene la opción \"From 2 to 8\", que ejecuta todos los k y muestra la silueta de cada uno en una lista.","goals":["Conecta un <code>k-Means</code> a los vinos y usa \"Probar de 2 a 8\".","Vuelve al modo fijo con el k de mayor silueta."],"quiz":{"q":"Una silueta media cercana a 1 indica…","o":["Puntos bien dentro de su grupo y lejos de los demás","Grupos superpuestos","Que k es demasiado grande"],"why":"Cerca de 0, los grupos se tocan; negativa, hay puntos en el grupo equivocado. Es una pista, y el conocimiento del dominio decide al final."}},"l14":{"title":"Regresión logística","concept":"<p>A pesar del nombre, la <b>regresión logística</b> es un clasificador. Suma las variables con pesos (<b>coeficientes</b>) y convierte el resultado en una probabilidad entre 0 y 1.</p><p>El parámetro <b>C</b> controla la regularización. Un C pequeño mantiene los coeficientes cerca de cero; un C grande deja que el modelo siga más los datos.</p>","tip":"En Orange, conecta la salida Coefficients de la Logistic Regression a un Data Table para ver los pesos. La regularización por defecto es Ridge (L2) con C = 1, la misma que aquí.","goals":["Construye un <code>Test and Score</code> tras el <code>Impute</code> con <code>Logistic Regression</code> y <code>kNN</code>.","Confirma que la regresión logística supera a kNN en CA.","Conecta también el <code>Impute</code> a la entrada de <code>Logistic Regression</code> y abre los coeficientes."],"quiz":{"q":"El coeficiente de \"support tickets\" es positivo. ¿Qué indica?","o":["Más tickets aumentan la probabilidad prevista de baja","Los tickets no influyen en el modelo","Los clientes con más tickets se dan menos de baja"],"why":"El signo indica la dirección y el tamaño, la fuerza. Con variables estandarizadas, los pesos se pueden comparar entre sí."}},"l15":{"title":"Random Forest","concept":"<p>Un árbol solo es inestable: cambiar unas pocas filas cambia las reglas. <b>Random Forest</b> entrena muchos árboles, cada uno con una <b>muestra con reemplazo</b> y mirando un subconjunto aleatorio de variables en cada pregunta.</p><p>La predicción final es el promedio de los árboles. Eso es un <b>ensemble</b>.</p>","tip":"El Random Forest de Orange usa 10 árboles por defecto y sortea √(nº de variables) candidatas en cada división, como aquí.","goals":["Pon <code>Tree</code> y <code>Random Forest</code> en el mismo <code>Test and Score</code> con los vinos.","Comprueba que el bosque supera al árbol en CA.","Aumenta el bosque a 30 árboles o más."],"quiz":{"q":"¿Por qué el bosque suele superar a un solo árbol?","o":["El promedio de muchos árboles distintos reduce la varianza","Cada árbol del bosque es más profundo","El bosque usa más filas de las que existen"],"why":"Cada árbol falla de una forma distinta. En promedio, los errores individuales se cancelan y lo que queda es el patrón estable."}},"l16":{"title":"Sobreajuste en la práctica","concept":"<p>Un modelo que memoriza el entrenamiento parece excelente y falla con datos nuevos. Eso es <b>sobreajuste</b> (overfitting).</p><p>Para verlo, evalúa un árbol profundo <b>con sus propios datos de entrenamiento</b> y después con <b>validación cruzada</b>. La diferencia entre ambos números es cuánto memorizó.</p>","tip":"En el Test and Score de Orange, la opción \"Test on train data\" existe justamente para comparar. Nunca uses ese número para elegir un modelo.","goals":["En <code>Test and Score</code>, elige \"Probar con los datos de entrenamiento\" con el árbol de profundidad 8. Anota la CA.","Vuelve a la validación cruzada de 5 folds y mira cómo cae la CA.","Reduce la profundidad hasta que el árbol, en validación cruzada, supere al de profundidad 8."],"quiz":{"q":"El árbol profundo tuvo CA alta en entrenamiento y baja en validación cruzada. Eso indica…","o":["Sobreajuste: memorizó casos del entrenamiento","Que la validación cruzada está rota","Subajuste: el modelo es demasiado simple"],"why":"El subajuste se ve como mal rendimiento en ambos. El sobreajuste es la distancia entre el entrenamiento y los datos que el modelo no vio."}},"l17":{"title":"Curva ROC y AUC","concept":"<p>Un clasificador probabilístico dice \"73% de probabilidad de baja\". ¿Dónde cortar? Cada <b>umbral</b> cambia aciertos por falsas alarmas.</p><p>La <b>curva ROC</b> muestra todos los umbrales a la vez. El <b>AUC</b> es el área bajo ella: la probabilidad de que el modelo puntúe más alto a un positivo al azar que a un negativo al azar.</p>","tip":"El ROC Analysis de Orange también dibuja la curva de costes y encuentra el umbral óptimo dado el coste de cada tipo de error.","goals":["Evalúa <code>Logistic Regression</code> y <code>Naive Bayes</code> en un <code>Test and Score</code> tras el <code>Impute</code>.","Conecta un <code>ROC Analysis</code> al <code>Test and Score</code>, con clase objetivo <code>yes</code>.","Abre la curva y compara los AUC."],"quiz":{"q":"Un modelo con AUC = 0,5 es…","o":["Equivalente a lanzar una moneda: no ordena positivos por encima de negativos","Perfecto en la mitad de los casos","Siempre mejor que una CA del 50%"],"why":"El AUC no depende del umbral elegido. 0,5 es la diagonal; 1 es ordenación perfecta. Es útil cuando las clases están desbalanceadas."}},"l18":{"title":"Selección de variables con Rank","concept":"<p>La <b>ganancia de información</b> mide cuánto reduce la incertidumbre sobre el objetivo conocer el valor de una variable.</p><p><b>Rank</b> ordena las variables por esa medida y deja pasar solo las n mejores. A veces pocas variables bastan para casi el mismo rendimiento.</p>","tip":"El Rank de Orange calcula varias medidas a la vez (ganancia de información, Gini, ANOVA, ReliefF) y tú eliges cuál usar para ordenar.","goals":["Conecta un <code>Rank</code> al <code>File</code> de vinos y mira qué variable lidera.","Conecta el <code>Rank</code> a un <code>Test and Score</code> con un <code>kNN</code>.","Con un máximo de 3 variables, llega a una CA de 0,93 o más."],"quiz":{"q":"¿Qué variable tiene la mayor ganancia de información en los vinos?","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids separa bien los tres cultivares. Malic Acid es la que menos ayuda; Rank la deja la última."}}},"faq":[{"s":"Sobre el proyecto","items":[{"q":"¿Qué es DS.Micro?","a":"<p>Una plataforma gratuita de microaprendizaje de ciencia de datos. Cada lección dura de 3 a 5 minutos: lees un concepto, construyes un pequeño flujo de widgets en el lienzo y respondes una pregunta de verificación.</p><p>El objetivo es ayudar a cualquier persona a dar sus primeros pasos en ciencia de datos practicando, sin instalar nada ni escribir código.</p>"},{"q":"¿Para quién es?","a":"<p>Estudiantes, docentes y profesionales que quieren entender cómo funcionan el análisis de datos y el aprendizaje automático. Las rutas van del nivel inicial (qué es un conjunto de datos) al avanzado (ensembles, sobreajuste, curvas ROC).</p>"},{"q":"¿Qué relación tiene con Orange Data Mining?","a":"<p>DS.Micro es un proyecto educativo independiente inspirado en <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>, la herramienta visual de la Universidad de Liubliana. Los widgets tienen los mismos nombres y la misma lógica que en Orange, así que lo que aprendes aquí te sirve allí.</p><p>Los widgets de aquí son simulaciones simplificadas. Para proyectos reales, usa el propio Orange.</p>"},{"q":"¿Es gratis? ¿Necesito una cuenta?","a":"<p>Sí, es gratis y no necesitas cuenta. Todo se ejecuta en tu navegador.</p>"}]},{"s":"Cómo usarlo","items":[{"q":"¿Cómo funciona una lección?","a":"<p>Cada lección tiene tres partes:</p><p><b>Concepto:</b> una explicación breve y una pista de cómo aparece en el Orange real.<br><b>Misión:</b> pasos para completar en el lienzo. Se marcan solos cuando el flujo funciona.<br><b>Comprueba:</b> una pregunta sobre lo que viste en los datos.</p><p>La lección se completa cuando la misión y la pregunta están hechas.</p>"},{"q":"¿Cómo añado y conecto widgets?","a":"<p>Toca un elemento de la paleta, encima del lienzo, para añadir un widget. Si hay un widget seleccionado, el nuevo llega ya conectado a él.</p><p>Para conectar dos widgets, arrastra desde el punto del lado derecho de uno hasta el otro. En el móvil, toca el punto y luego el widget de destino. Los datos siempre van de derecha (salida) a izquierda (entrada).</p><p>Para quitar una conexión, usa la × de su etiqueta. Para quitar un widget, selecciónalo y usa el botón del panel Salida.</p>"},{"q":"¿Dónde veo los resultados?","a":"<p>Toca cualquier widget. Sus parámetros y su salida (tabla, gráfico, métricas o reglas) aparecen en el panel Salida. En el móvil, abre la pestaña Salida.</p>"},{"q":"¿Qué es el Data Lab?","a":"<p>Un espacio abierto, sin misión, donde construyes cualquier flujo con todos los widgets y conjuntos de datos. Tiene flujos listos para empezar. <a href=\"#lab\" data-route=\"lab\">Abrir el Data Lab</a>.</p>"},{"q":"¿Qué conjuntos de datos se usan?","a":"<p><b>Iris</b> (150 flores, tres especies) y <b>Vinos</b> (178 vinos, tres cultivares) son conjuntos reales clásicos. <b>Clientes</b> es ficticio, con valores faltantes, creado para practicar limpieza de datos y predicción de bajas.</p>"},{"q":"¿Los resultados son reales?","a":"<p>Sí. Los modelos, la validación cruzada y las métricas se calculan de verdad en tu navegador con los datos. Los números pueden diferir un poco de Orange, porque algunos algoritmos aquí están simplificados.</p>"}]},{"s":"Progreso y cuestiones técnicas","items":[{"q":"¿Dónde se guarda mi progreso?","a":"<p>En tu propio navegador (almacenamiento local). No se envía nada a ningún servidor. Si borras los datos del sitio o cambias de navegador o dispositivo, el progreso empieza de cero.</p>"},{"q":"¿Funciona sin conexión?","a":"<p>Sí. DS.Micro es un único archivo HTML autocontenido: datos, idiomas y fuentes están dentro. Una vez cargado, funciona sin internet.</p>"},{"q":"¿Cómo cambio el idioma?","a":"<p>Usa el selector de idioma en la parte superior de la página. Idiomas disponibles: English, Español, Português, 中文, हिन्दी y 한국어.</p>"},{"q":"¿Cómo paso al Orange real?","a":"<p>Descarga Orange gratis en <a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a> y reconstruye los flujos de las lecciones. Los nombres de los widgets son los mismos, y las pistas \"En Orange\" de cada lección señalan las diferencias.</p>"}]}],"gloss":{"dataset":{"t":"Conjunto de datos","d":"Una tabla de datos: cada fila es un ejemplo (una flor, un vino, un cliente) y cada columna es una variable."},"widget":{"t":"Widget","d":"Un bloque del flujo que hace una sola tarea, como cargar datos, dibujar un gráfico o entrenar un modelo."},"workflow":{"t":"Flujo (workflow)","d":"Una cadena de widgets conectados. Los datos van de la salida de un widget (derecha) a la entrada del siguiente (izquierda)."},"variable":{"t":"Variable (feature)","d":"Una columna del conjunto de datos que describe los ejemplos, como el largo del pétalo. Los modelos aprenden de las variables."},"numeric":{"t":"Variable numérica","d":"Variable cuyos valores son números que se pueden medir y comparar, como los ingresos o la edad."},"categorical":{"t":"Variable categórica","d":"Variable cuyos valores son etiquetas de un conjunto fijo, como el plan (básico, plus, premium) o la especie."},"target":{"t":"Variable objetivo","d":"La variable que queremos predecir, como la especie o si un cliente se dio de baja. También se llama clase."},"meta":{"t":"Meta-atributo","d":"Una columna que acompaña a los datos pero que los modelos ignoran, como un ID o la columna Cluster creada por k-Means."},"histogram":{"t":"Histograma","d":"Gráfico que divide los valores en rangos y cuenta cuántas filas caen en cada uno."},"scatter":{"t":"Gráfico de dispersión","d":"Gráfico en el que cada fila es un punto situado por dos variables numéricas; el color puede mostrar la clase."},"featsel":{"t":"Selección de variables","d":"Elegir qué variables usar en el modelo, conservando las informativas y descartando el ruido."},"missing":{"t":"Valor faltante","d":"Una celda sin valor. Orange lo muestra como \"?\". Muchos modelos no pueden trabajar con valores faltantes."},"imputation":{"t":"Imputación","d":"Rellenar valores faltantes, por ejemplo con la media de la columna o con el valor más frecuente."},"normalization":{"t":"Normalización","d":"Poner las variables numéricas en la misma escala. Estandarizar deja cada columna con media 0 y desviación estándar 1."},"classification":{"t":"Clasificación","d":"Predecir una categoría (la clase) para cada ejemplo, como la especie de una flor."},"learner":{"t":"Learner (modelo)","d":"Un algoritmo que aprende patrones de ejemplos etiquetados y luego predice la clase de ejemplos nuevos."},"knn":{"t":"k vecinos más cercanos (kNN)","d":"Clasifica un ejemplo por la votación de los k ejemplos más parecidos de los datos de entrenamiento."},"cv":{"t":"Validación cruzada","d":"Método de evaluación que divide los datos en folds y prueba en cada fold con un modelo entrenado en los demás."},"fold":{"t":"Fold","d":"Cada una de las partes iguales en que se dividen los datos en la validación cruzada. Cada fold se usa una vez para probar."},"stratified":{"t":"Estratificación","d":"Dividir los datos de modo que cada fold conserve las mismas proporciones de clases que el conjunto completo."},"ca":{"t":"Exactitud (CA)","d":"La proporción de ejemplos que el modelo acertó: aciertos ÷ total."},"precision":{"t":"Precisión","d":"De los ejemplos predichos como de una clase, la parte que realmente pertenece a ella. Alta precisión significa pocas falsas alarmas."},"recall":{"t":"Recall (exhaustividad)","d":"De los ejemplos que realmente son de una clase, la parte que el modelo encontró. Recall alto significa pocos casos perdidos."},"f1":{"t":"F1","d":"La media armónica entre precisión y recall. Solo es alta cuando ambas lo son."},"imbalance":{"t":"Desbalance de clases","d":"Cuando una clase es mucho más rara que las demás, como las bajas. Entonces la exactitud por sí sola puede engañar."},"tree":{"t":"Árbol de decisión","d":"Modelo que hace una secuencia de preguntas de sí/no sobre las variables; cada hoja da una clase. Se puede leer como reglas."},"depth":{"t":"Profundidad del árbol","d":"El número máximo de preguntas seguidas que puede hacer un árbol. Los árboles más profundos captan más detalles y se sobreajustan con más facilidad."},"nb":{"t":"Naive Bayes","d":"Clasificador probabilístico que combina la evidencia de cada variable, suponiendo que son independientes."},"confusion":{"t":"Matriz de confusión","d":"Tabla que cruza las clases reales (filas) con las predichas (columnas). La diagonal contiene los aciertos."},"fpfn":{"t":"Falso positivo / falso negativo","d":"Un falso positivo es una falsa alarma (predijo sí, era no). Un falso negativo es un caso perdido (predijo no, era sí)."},"unsup":{"t":"Aprendizaje no supervisado","d":"Aprender de datos sin variable objetivo, para encontrar estructura como grupos."},"clustering":{"t":"Agrupamiento (clustering)","d":"Reunir ejemplos parecidos en grupos sin usar etiquetas."},"kmeans":{"t":"k-Means","d":"Algoritmo de agrupamiento que divide los datos en k grupos, cada uno formado alrededor de un centro de puntos cercanos."},"silhouette":{"t":"Silueta","d":"Medida de −1 a 1 que indica qué tan bien encaja cada punto en su propio grupo en comparación con el grupo vecino más cercano."},"logreg":{"t":"Regresión logística","d":"Clasificador lineal que pondera las variables y convierte la suma en una probabilidad entre 0 y 1."},"coefficient":{"t":"Coeficiente","d":"El peso que un modelo lineal da a una variable. El signo indica la dirección del efecto y el tamaño, su fuerza."},"regularization":{"t":"Regularización","d":"Una penalización que mantiene pequeños los coeficientes para evitar el sobreajuste. En la regresión logística se controla con C."},"ensemble":{"t":"Ensemble","d":"Modelo que combina las predicciones de muchos modelos para obtener un resultado más estable."},"rf":{"t":"Random Forest","d":"Ensemble de árboles de decisión, cada uno entrenado con una muestra bootstrap y un subconjunto aleatorio de variables; predice por el promedio."},"bootstrap":{"t":"Muestra bootstrap","d":"Muestra tomada con reemplazo de los datos, del mismo tamaño que el original. Algunas filas se repiten y otras quedan fuera."},"overfitting":{"t":"Sobreajuste (overfitting)","d":"Cuando el modelo memoriza los datos de entrenamiento y rinde mucho peor con datos nuevos."},"underfitting":{"t":"Subajuste (underfitting)","d":"Cuando el modelo es demasiado simple para captar el patrón y rinde mal incluso con los datos de entrenamiento."},"traintest":{"t":"Datos de entrenamiento y de prueba","d":"Los datos de entrenamiento sirven para ajustar el modelo; los de prueba, nunca vistos al entrenar, sirven para medirlo de forma honesta."},"threshold":{"t":"Umbral de decisión","d":"El valor de probabilidad a partir del cual un clasificador probabilístico predice la clase positiva."},"roc":{"t":"Curva ROC","d":"Curva que muestra la tasa de verdaderos positivos frente a la de falsos positivos en todos los umbrales de decisión."},"auc":{"t":"AUC","d":"Área bajo la curva ROC: la probabilidad de que el modelo puntúe más alto a un positivo al azar que a un negativo al azar. 0,5 es adivinar, 1 es perfecto."},"infogain":{"t":"Ganancia de información","d":"Cuánto reduce la incertidumbre sobre el objetivo conocer el valor de una variable. Es lo que usa Rank para ordenar las variables."}}},"pt":{"ui":{"and":" e ","brand.home":"DS.Micro, início","nav.sections":"Seções","nav.tracks":"Trilhas","nav.free":"Data Lab","lang.label":"Idioma","theme.toggle":"Alternar tema claro/escuro","xp.lessons":"{n}/{t} lições","hero.eyebrow":"Micro-learning · fluxos visuais no estilo Orange Data Mining","hero.title":"Ciência de dados, <em>um widget</em> de cada vez.","hero.lead":"Lições de 3 a 5 minutos em que você monta fluxos de verdade: carrega dados, limpa, visualiza, treina modelos e mede o resultado. Tudo roda aqui no navegador, com dados reais.","hero.continue":"Continuar: {t}","hero.start":"Começar pela lição 1","hero.free":"Abrir o Data Lab","facts.lessons":"micro-lições","facts.widgets":"widgets","facts.datasets":"conjuntos de dados","hero.aria":"Fluxo: File e kNN ligados ao Test and Score","hero.caption":"Calculado agora: kNN (k = 5) no Iris, validação cruzada de 5 folds.","tracks.h":"Trilhas","tracks.p":"{n} trilhas, do primeiro widget a ensembles e curvas ROC. Cada lição tem um conceito curto, uma missão no canvas e uma pergunta de verificação.","track.n":"Trilha {i} · {d}/{t}","min":"{m} min","lvl.beginner":"Iniciante","lvl.intermediate":"Intermediário","lvl.advanced":"Avançado","how.h":"Como cada lição funciona","how.1s":"1 · 1 min","how.1t":"Leia o conceito","how.1p":"Uma ideia por vez, com a dica de como ela aparece no Orange de verdade.","how.2s":"2 · 2 a 3 min","how.2t":"Monte o fluxo","how.2p" on":"Resposta certa. Falta concluir a missão no canvas.","l.prev":"← Anterior","l.reset":"Recomeçar fluxo","l.next":"Próxima →","free.meta":"Espaço aberto","free.h":"Data Lab","free.p":"Monte qualquer fluxo com os {n} widgets. Comece de um fluxo pronto ou do zero.","free.recipes":"Fluxos prontos","free.datasets":"Conjuntos de dados","free.dsMeta":"{r} linhas · {c} colunas · alvo: {t}","seo.title":"DS.Micro · Aprenda ciência de dados com fluxos visuais","seo.desc":"Micro-lições gratuitas de ciência de dados: monte fluxos visuais no estilo Orange no navegador com kNN, árvores, random forest, ROC e k-Means.","nav.faq":"FAQ","nav.gloss":"Glossário","faq.h":"Perguntas frequentes","faq.p":"Para que serve o DS.Micro, como usar e qual a relação com o Orange de verdade. Não achou um termo? Veja o <a href=\"#glossary\" data-route=\"glossary\">glossário</a>.","gloss.h":"Glossário","gloss.p":"Os {n} termos de ciência de dados usados nas lições, em linguagem simples. Cada um leva às lições em que aparece.","gloss.search":"Buscar termos","gloss.count":"{n} de {t} termos","gloss.empty":"Nenhum termo corresponde a \"{q}\"."},"w":{"file":"Carrega um conjunto de dados. É o ponto de partida de quase todo fluxo.","table":"Mostra os dados linha a linha. Valores faltantes aparecem como \"?\".","stats":"Resumo de cada coluna: tipo, centro, dispersão e faltantes.","select":"Escolhe quais variáveis seguem adiante no fluxo. A variável-alvo sempre segue.","impute":"Preenche os \"?\" (média para números, valor mais comum para categorias) ou descarta linhas incompletas.","normalize":"Normaliza as variáveis numéricas para ficarem na mesma escala.","rank":"Ordena as variáveis pelo ganho de informação sobre o alvo e deixa passar só as n melhores.","dist":"Histograma de uma variável, separado pelas classes do alvo.","scatter":"Cada ponto é uma linha dos dados; dois eixos numéricos e cor por categoria.","knn":"Classifica pelo voto dos k vizinhos mais próximos.","tree":"Aprende regras do tipo \"se … então …\". Ligue dados nele para ver a árvore.","nb":"Usa probabilidades de cada variável por classe, supondo independência entre elas.","logreg":"Modelo linear que estima a probabilidade de cada classe. Ligue dados nele para ver os coeficientes.","rf":"Muitas árvores, cada uma treinada numa amostra diferente; a floresta decide pela média.","test":"Avalia modelos com validação cruzada estratificada ou nos próprios dados de treino.","confusion":"Cruza a classe real com a prevista: onde o modelo acerta e onde confunde.","roc":"Curva ROC de cada modelo para uma classe-alvo: acertos positivos contra alarmes falsos em todos os limiares.","kmeans":"Agrupa linhas parecidas em k grupos, sem olhar o alvo. Adiciona a coluna Cluster."},"ds":{"iris":{"label":"Iris","desc":"Medidas de 150 flores de três espécies de íris (Fisher, 1936)."},"wine":{"label":"Vinhos","desc":"Análise química de 178 vinhos de três cultivares italianos (UCI)."},"customers":{"label":"Clientes (fictício)","desc":"220 assinantes fictícios de um app; alguns campos vieram vazios. Prever quem cancela."}},"tracks":[{"title":"Primeiros passos","desc":"Widgets, linhas e o que existe dentro de um conjunto de dados."},{"title":"Exploração visual","desc":"Olhar antes de modelar: dispersão e seleção de variáveis."},{"title":"Preparação de dados","desc":"Dados reais vêm sujos e em escalas diferentes."},{"title":"Classificação","desc":"Treinar, avaliar e comparar modelos que preveem classes."},{"title":"Agrupamento","desc":"Descobrir estrutura sem rótulos: k-Means e silhueta."},{"title":"Machine Learning avançado","desc":"Modelos lineares, ensembles, overfitting, curvas ROC e seleção de variáveis."}],"recipes":["Classificar íris com 3 modelos","Limpar e avaliar clientes","Agrupar vinhos e visualizar","Cancelamento: logística × floresta com ROC"],"lessons":{"l1":{"title":"Seu primeiro fluxo","concept":"<p>No Orange, uma análise é um <b>fluxo</b>. Cada círculo é um <b>widget</b> que faz uma única tarefa, e cada linha leva dados de um widget para o próximo.</p><p>Os dados saem pela porta da <b>direita</b> e entram pela porta da <b>esquerda</b>. Para ligar, arraste da bolinha direita de um widget até outro. No celular, toque na bolinha e depois no widget de destino.</p>","tip":"Os widgets do Orange também têm a saída à direita e a entrada à esquerda. Linhas tracejadas indicam que ainda não está passando nenhum dado.","goals":["Adicione um <code>Data Table</code> (paleta › Dados).","Ligue a saída do <code>File</code> à entrada do <code>Data Table</code>.","Toque no <code>Data Table</code> para ver as 150 flores na Saída."],"quiz":{"q":"O que uma linha entre dois widgets representa?","o":["Dados passando de um widget para o outro","A ordem em que os widgets foram criados","Uma cópia do arquivo salva no disco"],"why":"A linha é um canal: tudo que sai de um widget chega no próximo e é recalculado sempre que algo muda antes dele."}},"l2":{"title":"Tipos de variáveis","concept":"<p>Cada coluna é uma <b>variável</b>. As <b>numéricas</b> têm medidas (comprimento da pétala em cm). As <b>categóricas</b> têm rótulos (a espécie da flor).</p><p>A <b>variável-alvo</b> (target) é aquela que queremos prever. Os modelos aprendem a relação entre as demais colunas e o alvo.</p>","tip":"No Orange, o alvo aparece com o papel \"target\" e cor de destaque no Data Table. Você troca papéis no widget File ou no Edit Domain.","goals":["Ligue um <code>Feature Statistics</code> ao <code>File</code>.","Abra o <code>Feature Statistics</code> e compare média e desvio de cada coluna."],"quiz":{"q":"No conjunto Iris, qual coluna é a variável-alvo?","o":["iris","petal length","sepal width"],"why":"A coluna \"iris\" guarda a espécie. É ela que os classificadores vão tentar prever a partir das medidas."}},"l3":{"title":"Distribuições","concept":"<p>Um <b>histograma</b> divide os valores em faixas e conta quantas linhas caem em cada uma. Quando colorimos as barras pela classe, enxergamos se uma variável separa bem as espécies.</p>","tip":"O widget Distributions do Orange colore as barras pelo alvo automaticamente e permite empilhar ou sobrepor as classes.","goals":["Ligue um <code>Distributions</code> ao <code>File</code>.","Na Saída, escolha a variável <code>petal length</code>."],"quiz":{"q":"Olhando petal length, qual espécie fica isolada das outras?","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"As pétalas da setosa medem até uns 2 cm; as outras duas espécies começam bem depois. Uma variável assim é ótima para classificar."}},"l4":{"title":"Gráfico de dispersão","concept":"<p>No <b>gráfico de dispersão</b>, cada ponto é uma linha dos dados. Dois eixos numéricos mostram a relação entre duas variáveis e a cor mostra a classe.</p><p>Se as cores formam ilhas separadas, um modelo terá vida fácil.</p>","tip":"O Scatter Plot do Orange tem o botão \"Find Informative Projections\", que procura sozinho os pares de eixos que melhor separam as classes.","goals":["Ligue um <code>Scatter Plot</code> ao <code>File</code>.","Eixo x = <code>petal length</code> e eixo y = <code>petal width</code>.","Cor = <code>iris</code>."],"quiz":{"q":"O que o gráfico de pétalas mostra?","o":["As espécies formam grupos quase separados","Os pontos ficam espalhados ao acaso","Só existem duas espécies nos dados"],"why":"Setosa forma uma ilha isolada; versicolor e virginica se tocam só numa faixa estreita. Por isso classificadores acertam tanto no Iris."}},"l5":{"title":"Escolher colunas","concept":"<p>Nem toda variável ajuda. O <b>Select Columns</b> deixa passar só as que você escolher. A variável-alvo segue sempre.</p><p>Menos colunas deixam gráficos e modelos mais simples de interpretar.</p>","tip":"No Orange real, o Select Columns tem três caixas: Features, Target e Metas. Arrastar uma coluna para Metas a tira do modelo sem apagá-la.","goals":["Ligue um <code>Select Columns</code> ao <code>File</code>.","Mantenha só <code>petal length</code> e <code>petal width</code>.","Ligue um <code>Scatter Plot</code> depois do <code>Select Columns</code>."],"quiz":{"q":"Por que remover colunas antes de modelar?","o":["Para focar no que é relevante e simplificar o modelo","Porque o Orange só aceita duas colunas","Para aumentar o número de linhas"],"why":"Variáveis irrelevantes trazem ruído. Com poucas boas, o modelo fica mais rápido, mais estável e mais fácil de explicar."}},"l6":{"title":"Valores faltantes","concept":"<p>Planilhas reais têm buracos. O Orange mostra cada valor faltante como <code>?</code>. Muitos modelos não sabem lidar com eles.</p><p>O <b>Impute</b> preenche os buracos com a média (números) ou o valor mais comum (categorias). Outra opção é descartar as linhas incompletas.</p>","tip":"O Impute do Orange também pode prever o valor faltante com um modelo, ou tratar \"faltante\" como um valor próprio.","goals":["Abra o <code>Data Table</code> e encontre os <code>?</code> em income e app hours.","Adicione um <code>Impute</code> depois do <code>File</code>.","Ligue um <code>Data Table</code> depois do <code>Impute</code> e confirme: zero faltantes."],"quiz":{"q":"O que a imputação pela média faz?","o":["Troca cada \"?\" pela média da coluna","Apaga a coluna inteira","Copia o valor da linha de cima"],"why":"É simples e mantém todas as linhas. O custo é reduzir um pouco a variação da coluna, então vale olhar quantos \"?\" existiam."}},"l7":{"title":"Normalização","concept":"<p>No conjunto de vinhos, <code>Proline</code> vai de 278 a 1680 enquanto <code>Hue</code> fica perto de 1. Para métodos que medem <b>distância</b>, a coluna maior domina tudo.</p><p><b>Padronizar</b> deixa cada coluna com média 0 e desvio 1.</p>","tip":"No Orange, a normalização fica no widget Preprocess, opção \"Normalize Features\". O kNN e o k-Means do Orange também normalizam por padrão.","goals":["Ligue um <code>Preprocess</code> ao <code>File</code> de vinhos.","Ligue um <code>Feature Statistics</code> depois do <code>Preprocess</code>.","Use \"Padronizar\" e confira: média de <code>Proline</code> = 0."],"quiz":{"q":"Por que normalizar antes de um kNN?","o":["Porque o kNN mede distâncias e Proline (centenas) dominaria Hue (perto de 1)","Porque o kNN não aceita números negativos","Porque aumenta o número de vizinhos"],"why":"Sem normalizar, a distância entre dois vinhos seria quase só a diferença de Proline. As outras variáveis praticamente sumiriam."}},"l8":{"title":"Seu primeiro modelo: kNN","concept":"<p>Um <b>classificador</b> aprende com exemplos rotulados e prevê o rótulo de exemplos novos. O <b>kNN</b> olha os k exemplos mais parecidos e faz uma votação.</p><p>Widgets de modelo saem com um <b>Modelo</b>, não com dados. Quem treina e mede é o <b>Test and Score</b>: ele recebe os dados e um ou mais modelos.</p>","tip":"No Orange, Test and Score tem duas entradas: Data e Learner. Um mesmo Test and Score aceita vários learners ao mesmo tempo.","goals":["Ligue o <code>File</code> a um <code>Test and Score</code>.","Ligue um <code>kNN</code> ao mesmo <code>Test and Score</code>.","Chegue a uma acurácia (CA) de pelo menos 0,90."],"quiz":{"q":"O que é validação cruzada com 5 folds?","o":["Treinar 5 vezes, testando a cada vez numa parte diferente dos dados","Treinar com 5% dos dados","Repetir o mesmo teste 5 vezes para conferir"],"why":"Cada linha é usada para teste exatamente uma vez, por um modelo que não a viu no treino. Isso dá uma estimativa honesta do desempenho."}},"l9":{"title":"Árvore de decisão","concept":"<p>A <b>árvore de decisão</b> faz perguntas em sequência: \"Proline &gt; 755?\", \"Flavanoids ≤ 1,4?\". Cada folha dá uma classe.</p><p>É um dos poucos modelos que você lê como regras. A <b>profundidade</b> controla quantas perguntas seguidas ela pode fazer.</p>","tip":"No Orange, ligue a saída Model do Tree a um Tree Viewer para ver a árvore desenhada. Aqui as regras aparecem direto na Saída do Tree.","goals":["Ligue o <code>File</code> de vinhos a um <code>Tree</code> e leia as regras na Saída.","Avalie o <code>Tree</code> num <code>Test and Score</code> com os vinhos.","Ajuste a profundidade até a CA da árvore ficar em 0,88 ou mais."],"quiz":{"q":"Aumentar muito a profundidade da árvore tende a…","o":["Decorar o treino e errar mais em dados novos (overfitting)","Sempre melhorar a acurácia no teste","Deixar o modelo mais fácil de ler"],"why":"Uma árvore funda cria regras para casos raros do treino. A validação cruzada mostra quando isso começa a piorar o resultado."}},"l10":{"title":"Comparar modelos","concept":"<p>Não existe modelo melhor para tudo. A prática é colocar vários no mesmo <b>Test and Score</b> e comparar com os mesmos folds.</p><p>Nos clientes há <code>?</code>, então o fluxo precisa de um <b>Impute</b> antes da avaliação.</p>","tip":"O Test and Score do Orange tem a tabela \"Compare models\", que estima a probabilidade de um modelo ser realmente melhor que outro.","goals":["Monte <code>File → Impute → Test and Score</code>.","Ligue pelo menos dois modelos diferentes ao <code>Test and Score</code>."],"quiz":{"q":"Qual métrica mostra a proporção de acertos?","o":["CA (Classification Accuracy)","Recall","Número de folds"],"why":"CA é acertos ÷ total. Quando as classes são desbalanceadas (poucos cancelamentos), olhe também F1, precisão e recall."}},"l11":{"title":"Matriz de confusão","concept":"<p>A acurácia esconde <b>onde</b> o modelo erra. A <b>matriz de confusão</b> cruza a classe real (linhas) com a prevista (colunas). A diagonal são os acertos.</p><p>Para quem cuida de retenção, deixar de prever um cancelamento costuma custar mais caro que um alarme falso.</p>","tip":"No Orange, selecionar células da Confusion Matrix envia aquelas linhas adiante. É um jeito rápido de investigar os casos que o modelo errou.","goals":["Ligue um <code>Confusion Matrix</code> à saída do <code>Test and Score</code>.","Abra a matriz e encontre os cancelamentos que o modelo não previu."],"quiz":{"q":"Um cliente que cancelou, mas o modelo previu \"no\", é um…","o":["Falso negativo (para a classe \"yes\")","Verdadeiro positivo","Falso positivo"],"why":"Real \"yes\", previsto \"no\". Ele aparece na linha \"yes\", coluna \"no\", fora da diagonal."}},"l12":{"title":"k-Means","concept":"<p>Aprendizado <b>não supervisionado</b> não usa o alvo. O <b>k-Means</b> divide os dados em k grupos de pontos próximos e cria a coluna <code>Cluster</code>.</p><p>Depois, dá para comparar os grupos encontrados com as espécies reais.</p>","tip":"No Orange, o k-Means adiciona Cluster como meta-atributo. Um Scatter Plot depois dele já pode colorir por Cluster.","goals":["Ligue um <code>k-Means</code> com k = 3 ao <code>File</code> de íris.","Ligue um <code>Scatter Plot</code> depois do <code>k-Means</code>.","Pinte o gráfico por <code>Cluster</code> e depois por <code>iris</code> para comparar."],"quiz":{"q":"O k-Means usa a coluna \"iris\" para formar os grupos?","o":["Não. Ele ignora o alvo e só olha as medidas","Sim, um grupo por espécie","Só se k for igual ao número de espécies"],"why":"Os grupos saem só da geometria dos pontos. Que eles coincidam bem com as espécies é uma descoberta, não uma regra."}},"l13":{"title":"Quantos grupos? Silhueta","concept":"<p>Sem rótulos, como escolher k? A <b>silhueta</b> mede, para cada ponto, o quanto ele está mais perto do próprio grupo do que do grupo vizinho. Vai de −1 a 1.</p><p>Teste vários k e fique com o de maior silhueta média.</p>","tip":"O k-Means do Orange tem a opção \"From 2 to 8\", que roda todos os k e mostra a silhueta de cada um numa lista.","goals":["Ligue um <code>k-Means</code> aos vinhos e use \"Testar de 2 a 8\".","Volte ao modo fixo com o k de maior silhueta."],"quiz":{"q":"Silhueta média perto de 1 indica…","o":["Pontos bem dentro do próprio grupo e longe dos outros","Grupos sobrepostos","Que k é grande demais"],"why":"Perto de 0, os grupos se tocam; negativa, há pontos no grupo errado. É uma pista, e o conhecimento do domínio decide no fim."}},"l14":{"title":"Regressão logística","concept":"<p>Apesar do nome, a <b>regressão logística</b> é um classificador. Ela soma as variáveis com pesos (<b>coeficientes</b>) e transforma o resultado numa probabilidade entre 0 e 1.</p><p>O parâmetro <b>C</b> controla a regularização. C pequeno segura os coeficientes perto de zero; C grande deixa o modelo seguir mais os dados.</p>","tip":"No Orange, ligue a saída Coefficients da Logistic Regression a um Data Table para ver os pesos. A regularização padrão é Ridge (L2) com C = 1, a mesma usada aqui.","goals":["Monte um <code>Test and Score</code> após o <code>Impute</code> com <code>Logistic Regression</code> e <code>kNN</code>.","Confirme que a regressão logística supera o kNN em CA.","Ligue o <code>Impute</code> também à entrada da <code>Logistic Regression</code> e abra os coeficientes."],"quiz":{"q":"O coeficiente de \"support tickets\" é positivo. O que isso indica?","o":["Mais chamados aumentam a chance prevista de cancelar","Chamados não influenciam o modelo","Clientes com mais chamados cancelam menos"],"why":"O sinal diz a direção e o tamanho diz a força. Com variáveis padronizadas, dá para comparar os pesos entre si."}},"l15":{"title":"Random Forest","concept":"<p>Uma árvore sozinha é instável: mudar poucas linhas muda as regras. A <b>Random Forest</b> treina muitas árvores, cada uma numa <b>amostra com reposição</b> dos dados e olhando um subconjunto aleatório de variáveis a cada pergunta.</p><p>A previsão final é a média das árvores. Isso é um <b>ensemble</b>.</p>","tip":"A Random Forest do Orange usa 10 árvores por padrão e sorteia √(nº de variáveis) candidatas a cada divisão, como aqui.","goals":["Coloque <code>Tree</code> e <code>Random Forest</code> no mesmo <code>Test and Score</code> com os vinhos.","Verifique que a floresta supera a árvore em CA.","Aumente a floresta para 30 árvores ou mais."],"quiz":{"q":"Por que a floresta costuma superar uma árvore só?","o":["A média de muitas árvores diferentes reduz a variância","Cada árvore da floresta é mais profunda","A floresta usa mais linhas de dados que existem"],"why":"Cada árvore erra de um jeito diferente. Na média, os erros individuais se cancelam e o que sobra é o padrão estável."}},"l16":{"title":"Overfitting na prática","concept":"<p>Um modelo que decora o treino parece ótimo e falha com dados novos. Isso é <b>overfitting</b>.</p><p>Para ver acontecer, avalie uma árvore profunda <b>nos próprios dados de treino</b> e depois com <b>validação cruzada</b>. A diferença entre os dois números é o quanto o modelo decorou.</p>","tip":"No Test and Score do Orange, a opção \"Test on train data\" existe justamente para comparação. Nunca use esse número para escolher um modelo.","goals":["No <code>Test and Score</code>, escolha \"Testar nos dados de treino\" com a árvore de profundidade 8. Anote a CA.","Volte para validação cruzada de 5 folds e veja a CA cair.","Reduza a profundidade até a árvore, na validação cruzada, superar a de profundidade 8."],"quiz":{"q":"A árvore profunda teve CA alta no treino e baixa na validação cruzada. Isso indica…","o":["Overfitting: ela decorou casos do treino","Que a validação cruzada está com defeito","Underfitting: o modelo é simples demais"],"why":"Underfitting aparece como desempenho ruim nos dois. Overfitting é a distância entre o treino e os dados que o modelo não viu."}},"l17":{"title":"Curva ROC e AUC","concept":"<p>Um classificador probabilístico diz \"73% de chance de cancelar\". Onde cortar? Cada <b>limiar</b> troca acertos por alarmes falsos.</p><p>A <b>curva ROC</b> mostra todos os limiares de uma vez. A <b>AUC</b> é a área sob ela: a chance de o modelo dar nota maior a um positivo sorteado do que a um negativo sorteado.</p>","tip":"O ROC Analysis do Orange também desenha a curva de custo e acha o limiar ótimo dado o custo de cada tipo de erro.","goals":["Avalie <code>Logistic Regression</code> e <code>Naive Bayes</code> num <code>Test and Score</code> após o <code>Impute</code>.","Ligue um <code>ROC Analysis</code> ao <code>Test and Score</code>, com classe-alvo <code>yes</code>.","Abra a curva e compare as AUCs."],"quiz":{"q":"Um modelo com AUC = 0,5 é…","o":["Equivalente a sortear: não ordena positivos acima dos negativos","Perfeito pela metade dos casos","Sempre melhor que CA de 50%"],"why":"A AUC independe do limiar escolhido. 0,5 é a diagonal; 1 é ordenação perfeita. Ela é útil quando as classes são desbalanceadas."}},"l18":{"title":"Seleção de variáveis com Rank","concept":"<p>O <b>ganho de informação</b> mede quanto saber o valor de uma variável reduz a incerteza sobre o alvo.</p><p>O <b>Rank</b> ordena as variáveis por essa medida e deixa passar só as n melhores. Às vezes poucas variáveis bastam para quase o mesmo desempenho.</p>","tip":"O Rank do Orange calcula várias medidas ao mesmo tempo (ganho de informação, Gini, ANOVA, ReliefF) e você escolhe qual usar para ordenar.","goals":["Ligue um <code>Rank</code> ao <code>File</code> de vinhos e veja qual variável lidera.","Ligue o <code>Rank</code> a um <code>Test and Score</code> com um <code>kNN</code>.","Com no máximo 3 variáveis, chegue a CA de 0,93 ou mais."],"quiz":{"q":"Qual variável tem o maior ganho de informação nos vinhos?","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids separa bem os três cultivares. Malic Acid é a que menos ajuda; o Rank a deixa por último."}}},"faq":[{"s":"Sobre o projeto","items":[{"q":"O que é o DS.Micro?","a":"<p>Uma plataforma gratuita de micro-learning de ciência de dados. Cada lição leva de 3 a 5 minutos: você lê um conceito, monta um pequeno fluxo de widgets no canvas e responde a uma pergunta de verificação.</p><p>O objetivo é ajudar qualquer pessoa a dar os primeiros passos em ciência de dados praticando, sem instalar nada nem escrever código.</p>"},{"q":"Para quem é?","a":"<p>Estudantes, professores e profissionais que querem entender como funcionam a análise de dados e o aprendizado de máquina. As trilhas vão do iniciante (o que é um conjunto de dados) ao avançado (ensembles, overfitting, curvas ROC).</p>"},{"q":"Qual a relação com o Orange Data Mining?","a":"<p>O DS.Micro é um projeto educacional independente, inspirado no <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>, a ferramenta visual da Universidade de Ljubljana. Os widgets têm os mesmos nomes e a mesma lógica do Orange, então o que você aprende aqui vale lá.</p><p>Os widgets daqui são simulações simplificadas. Para projetos reais, use o próprio Orange.</p>"},{"q":"É gratuito? Preciso criar conta?","a":"<p>Sim, é gratuito, e não precisa de conta. Tudo roda no seu navegador.</p>"}]},{"s":"Como usar","items":[{"q":"Como funciona uma lição?","a":"<p>Cada lição tem três partes:</p><p><b>Conceito:</b> uma explicação curta e uma dica de como aquilo aparece no Orange de verdade.<br><b>Missão:</b> passos para cumprir no canvas. Eles se marcam sozinhos quando o fluxo funciona.<br><b>Verifique:</b> uma pergunta sobre o que você viu nos dados.</p><p>A lição é concluída quando a missão e a pergunta estão feitas.</p>"},{"q":"Como adiciono e ligo widgets?","a":"<p>Toque num item da paleta acima do canvas para adicionar um widget. Se houver um widget selecionado, o novo já entra ligado a ele.</p><p>Para ligar dois widgets, arraste da bolinha do lado direito de um até o outro. No celular, toque na bolinha e depois no widget de destino. Os dados sempre vão da direita (saída) para a esquerda (entrada).</p><p>Para remover uma ligação, use o × no rótulo dela. Para remover um widget, selecione-o e use o botão no painel Saída.</p>"},{"q":"Onde vejo os resultados?","a":"<p>Toque em qualquer widget. Os parâmetros e a saída dele (tabela, gráfico, métricas ou regras) aparecem no painel Saída. No celular, abra a aba Saída.</p>"},{"q":"O que é o Data Lab?","a":"<p>Um espaço aberto, sem missão, onde você monta qualquer fluxo com todos os widgets e conjuntos de dados. Ele tem fluxos prontos para começar. <a href=\"#lab\" data-route=\"lab\">Abrir o Data Lab</a>.</p>"},{"q":"Quais conjuntos de dados são usados?","a":"<p><b>Iris</b> (150 flores, três espécies) e <b>Vinhos</b> (178 vinhos, três cultivares) são conjuntos reais clássicos. <b>Clientes</b> é fictício, com valores faltantes, criado para praticar limpeza de dados e previsão de cancelamento.</p>"},{"q":"Os resultados são de verdade?","a":"<p>Sim. Os modelos, a validação cruzada e as métricas são calculados de fato no seu navegador, com os dados. Os números podem diferir um pouco do Orange, porque alguns algoritmos aqui são simplificados.</p>"}]},{"s":"Progresso e questões técnicas","items":[{"q":"Onde meu progresso fica salvo?","a":"<p>No seu próprio navegador (armazenamento local). Nada é enviado para servidor. Se você limpar os dados do site ou trocar de navegador ou aparelho, o progresso recomeça.</p>"},{"q":"Funciona offline?","a":"<p>Sim. O DS.Micro é um único arquivo HTML autocontido: dados, idiomas e fontes estão dentro dele. Depois de carregado, funciona sem internet.</p>"},{"q":"Como troco o idioma?","a":"<p>Use o seletor de idioma no topo da página. Idiomas disponíveis: English, Español, Português, 中文, हिन्दी e 한국어.</p>"},{"q":"Como passo para o Orange de verdade?","a":"<p>Baixe o Orange gratuitamente em <a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a> e refaça os fluxos das lições. Os nomes dos widgets são os mesmos, e as dicas \"No Orange\" de cada lição apontam as diferenças.</p>"}]}],"gloss":{"dataset":{"t":"Conjunto de dados","d":"Uma tabela de dados: cada linha é um exemplo (uma flor, um vinho, um cliente) e cada coluna é uma variável."},"widget":{"t":"Widget","d":"Um bloco do fluxo que faz uma única tarefa, como carregar dados, desenhar um gráfico ou treinar um modelo."},"workflow":{"t":"Fluxo (workflow)","d":"Uma cadeia de widgets ligados. Os dados vão da saída de um widget (direita) para a entrada do próximo (esquerda)."},"variable":{"t":"Variável (feature)","d":"Uma coluna do conjunto de dados que descreve os exemplos, como o comprimento da pétala. Os modelos aprendem com as variáveis."},"numeric":{"t":"Variável numérica","d":"Variável cujos valores são números que podem ser medidos e comparados, como renda ou idade."},"categorical":{"t":"Variável categórica","d":"Variável cujos valores são rótulos de um conjunto fixo, como plano (básico, plus, premium) ou espécie."},"target":{"t":"Variável-alvo","d":"A variável que queremos prever, como a espécie ou se o cliente cancelou. Também chamada de classe."},"meta":{"t":"Meta-atributo","d":"Uma coluna que acompanha os dados mas é ignorada pelos modelos, como um ID ou a coluna Cluster criada pelo k-Means."},"histogram":{"t":"Histograma","d":"Gráfico que divide os valores em faixas e conta quantas linhas caem em cada uma."},"scatter":{"t":"Gráfico de dispersão","d":"Gráfico em que cada linha é um ponto posicionado por duas variáveis numéricas; a cor pode mostrar a classe."},"featsel":{"t":"Seleção de variáveis","d":"Escolher quais variáveis usar no modelo, mantendo as informativas e descartando o ruído."},"missing":{"t":"Valor faltante","d":"Uma célula sem valor. O Orange mostra como \"?\". Muitos modelos não conseguem trabalhar com valores faltantes."},"imputation":{"t":"Imputação","d":"Preencher valores faltantes, por exemplo com a média da coluna ou com o valor mais comum."},"normalization":{"t":"Normalização","d":"Colocar variáveis numéricas na mesma escala. Padronizar deixa cada coluna com média 0 e desvio padrão 1."},"classification":{"t":"Classificação","d":"Prever uma categoria (a classe) para cada exemplo, como a espécie de uma flor."},"learner":{"t":"Learner (modelo)","d":"Um algoritmo que aprende padrões a partir de exemplos rotulados e depois prevê a classe de exemplos novos."},"knn":{"t":"k vizinhos mais próximos (kNN)","d":"Classifica um exemplo pela votação dos k exemplos mais parecidos nos dados de treino."},"cv":{"t":"Validação cruzada","d":"Método de avaliação que divide os dados em folds e testa em cada fold com um modelo treinado nos outros."},"fold":{"t":"Fold","d":"Cada uma das partes iguais em que os dados são divididos na validação cruzada. Cada fold é usado uma vez para teste."},"stratified":{"t":"Estratificação","d":"Dividir os dados de modo que cada fold mantenha as mesmas proporções de classes do conjunto todo."},"ca":{"t":"Acurácia (CA)","d":"A proporção de exemplos que o modelo acertou: acertos ÷ total."},"precision":{"t":"Precisão","d":"Dos exemplos previstos como de uma classe, a parte que realmente é dela. Precisão alta significa poucos alarmes falsos."},"recall":{"t":"Recall (revocação)","d":"Dos exemplos que realmente são de uma classe, a parte que o modelo encontrou. Recall alto significa poucos casos perdidos."},"f1":{"t":"F1","d":"A média harmônica entre precisão e recall. Só é alta quando as duas são altas."},"imbalance":{"t":"Desbalanceamento de classes","d":"Quando uma classe é bem mais rara que as outras, como os cancelamentos. Aí a acurácia sozinha pode enganar."},"tree":{"t":"Árvore de decisão","d":"Modelo que faz uma sequência de perguntas de sim/não sobre as variáveis; cada folha dá uma classe. Pode ser lido como regras."},"depth":{"t":"Profundidade da árvore","d":"O número máximo de perguntas seguidas que uma árvore pode fazer. Árvores mais fundas captam mais detalhes e sofrem overfitting com mais facilidade."},"nb":{"t":"Naive Bayes","d":"Classificador probabilístico que combina a evidência de cada variável, supondo que elas são independentes."},"confusion":{"t":"Matriz de confusão","d":"Tabela que cruza as classes reais (linhas) com as previstas (colunas). A diagonal guarda os acertos."},"fpfn":{"t":"Falso positivo / falso negativo","d":"Falso positivo é um alarme falso (previu sim, era não). Falso negativo é um caso perdido (previu não, era sim)."},"unsup":{"t":"Aprendizado não supervisionado","d":"Aprender com dados sem variável-alvo, para encontrar estrutura como grupos."},"clustering":{"t":"Agrupamento (clustering)","d":"Juntar exemplos parecidos em grupos sem usar rótulos."},"kmeans":{"t":"k-Means","d":"Algoritmo de agrupamento que divide os dados em k grupos, cada um formado em torno de um centro de pontos próximos."},"silhouette":{"t":"Silhueta","d":"Medida de −1 a 1 que indica quão bem cada ponto se encaixa no próprio grupo em comparação com o grupo vizinho mais próximo."},"logreg":{"t":"Regressão logística","d":"Classificador linear que pondera as variáveis e transforma a soma numa probabilidade entre 0 e 1."},"coefficient":{"t":"Coeficiente","d":"O peso que um modelo linear dá a uma variável. O sinal mostra a direção do efeito e o tamanho, sua força."},"regularization":{"t":"Regularização","d":"Uma penalidade que mantém os coeficientes pequenos para evitar overfitting. Na regressão logística é controlada por C."},"ensemble":{"t":"Ensemble","d":"Modelo que combina as previsões de vários modelos para obter um resultado mais estável."},"rf":{"t":"Random Forest","d":"Ensemble de árvores de decisão, cada uma treinada numa amostra bootstrap e num subconjunto aleatório de variáveis; prevê pela média."},"bootstrap":{"t":"Amostra bootstrap","d":"Amostra tirada com reposição dos dados, do mesmo tamanho do original. Algumas linhas se repetem e outras ficam de fora."},"overfitting":{"t":"Overfitting (sobreajuste)","d":"Quando o modelo decora os dados de treino e vai bem pior com dados novos."},"underfitting":{"t":"Underfitting (subajuste)","d":"Quando o modelo é simples demais para captar o padrão e vai mal até nos dados de treino."},"traintest":{"t":"Dados de treino e de teste","d":"Os dados de treino servem para ajustar o modelo; os de teste, nunca vistos no treino, servem para medi-lo de forma honesta."},"threshold":{"t":"Limiar de decisão","d":"O valor de probabilidade acima do qual um classificador probabilístico prevê a classe positiva."},"roc":{"t":"Curva ROC","d":"Curva que mostra a taxa de verdadeiros positivos contra a de falsos positivos em todos os limiares de decisão."},"auc":{"t":"AUC","d":"Área sob a curva ROC: a chance de o modelo dar nota maior a um positivo sorteado do que a um negativo sorteado. 0,5 é chute, 1 é perfeito."},"infogain":{"t":"Ganho de informação","d":"Quanto saber o valor de uma variável reduz a incerteza sobre o alvo. É o que o Rank usa para ordenar as variáveis."}}},"zh":{"ui":{"and":"和","brand.home":"DS.Micro，首页","nav.sections":"栏目","nav.tracks":"学习路径","nav.free":"Data Lab","lang.label":"语言","theme.toggle":"切换浅色/深色主题","xp.lessons":"{n}/{t} 节课","hero.eyebrow":"微学习 · Orange Data Mining 风格的可视化工作流","hero.title":"数据科学，<em>一次一个组件</em>。","hero.lead":"每节课 3 到 5 分钟，你会搭建真实的工作流：加载数据、清洗、可视化、训练模型并评估结果。一切都在浏览器中用真实数据运行。","hero.continue":"继续：{t}","hero.start":"从第 1 课开始","hero.free":"打开 Data Lab","facts.lessons":"节微课","facts.widgets":"个组件","facts.datasets":"个数据集","hero.aria":"工作流：File 和 kNN 连接到 Test and Score","hero.caption":"刚刚计算：在 Iris 上用 kNN（k = 5）做 5 折交叉验证。","tracks.h":"学习路径","tracks.p":"{n} 条路径，从第一个组件到集成方法和 ROC 曲线。每节课包含一个简短概念、一个画布任务和一道检验题。","track.n":"路径 {i} · {d}/{t}","min":"{m} 分钟","lvl.beginner":"入门","lvl.intermediate":"中级","lvl.advanced":"高级","how.h":"每节课如何进行","how.1s":"1 · 1 分钟","how.1t":"阅读概念","how.1p":"一次一个概念，并提示它在真正的 Orange 中是什么样子。","how.2s":"2 · 2 到 3 分钟","how.2t":"搭建工作流","how.2p":"拖动组件、连接端口、调整参数。工作流正确运行时，任务会自动打勾。","how.3s":"3 · 30 秒","how.3t":"检验","how.3p":"一道关于你刚在数据中看到内容的题目。完成任务并答对题目即完成本课。","foot.text":"独立教育项目，灵感来自 <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>（卢布尔雅那大学）。此处的组件是简化的模拟。","foot.saved":"进度保存在此浏览器中。","tab.lesson":"课程","tab.flow":"工作流","tab.out":"输出","canvas.aria":"组件画布","zoom.out":"缩小","zoom.in":"放大","zoom.fit":"适应工作流","hint.pending":"点击目标组件（闪动的组件可以接受连接）。点击背景取消。","hint.empty":"点击组件面板中的项目来添加组件。选中一个组件时，新组件会自动连接到它。","hint.normal":"从右侧圆点拖到另一个组件即可连接。点击组件查看其输出。","toast.added":"已添加 {w}","toast.addedLinked":"已添加 {w} 并连接到 {s}","toast.noAccept":"{w} 不接收{c}。","toast.cycle":"这个连接会形成循环。","toast.linked":"{a} → {b}（{c}）","toast.step":"任务：第 {i} 步完成","toast.done":"本课完成 · +{xp} XP","toast.reset":
