估计每个类别概率的线性模型。给它连接数据即可看到系数。","rf":"许多棵树，每棵在不同的样本上训练；森林取平均来决定。","test":"用分层交叉验证或在训练数据本身上评估模型。","confusion":"将实际类别与预测类别交叉对比：模型哪里预测对了，哪里混淆了。","roc":"每个模型针对某一目标类别的 ROC 曲线：在所有阈值下真正例与误报的对比。","kmeans":"不看目标，把相似的行分成 k 个簇。会添加 Cluster 列。"},"ds":{"iris":{"label":"鸢尾花","desc":"三种鸢尾花共 150 朵花的测量数据（Fisher，1936）。"},"wine":{"label":"葡萄酒","desc":"来自三个意大利品种的 178 种葡萄酒的化学分析（UCI）。"},"customers":{"label":"客户（虚构）","desc":"某应用的 220 名虚构订阅用户；部分字段为空。预测谁会流失。"}},"tracks":[{"title":"第一步","desc":"组件、连接，以及数据集里有什么。"},{"title":"可视化探索","desc":"建模之前先观察：散点图和变量选择。"},{"title":"数据准备","desc":"真实数据往往很脏，而且尺度各不相同。"},{"title":"分类","desc":"训练、评估并比较预测类别的模型。"},{"title":"聚类","desc":"在没有标签的情况下发现结构：k-Means 和轮廓系数。"},{"title":"高级机器学习","desc":"线性模型、集成方法、过拟合、ROC 曲线和特征选择。"}],"recipes":["用 3 个模型给鸢尾花分类","清洗并评估客户数据","葡萄酒聚类并可视化","流失：逻辑回归 vs 随机森林与 ROC"],"lessons":{"l1":{"title":"你的第一个工作流","concept":"<p>在 Orange 中，一次分析就是一个<b>工作流</b>。每个圆圈是一个只做一件事的<b>组件</b>，每条线把数据从一个组件送到下一个组件。</p><p>数据从<b>右侧</b>端口流出，从<b>左侧</b>端口流入。要连接时，从一个组件右侧的圆点拖到另一个组件。在手机上，先点圆点，再点目标组件。</p>","tip":"Orange 的组件同样是输出在右、输入在左。虚线表示还没有数据流过。","goals":["添加一个 <code>Data Table</code>（组件面板 › 数据）。","把 <code>File</code> 的输出连接到 <code>Data Table</code> 的输入。","点击 <code>Data Table</code>，在输出中查看这 150 朵花。"],"quiz":{"q":"两个组件之间的连线代表什么？","o":["数据从一个组件流向另一个组件","组件被创建的顺序","保存到磁盘上的文件副本"],"why":"连线是一条通道：从一个组件出来的所有内容都会到达下一个组件，并且只要前面有任何变化就会重新计算。"}},"l2":{"title":"变量的类型","concept":"<p>每一列是一个<b>变量</b>。<b>数值型</b>变量记录测量值（花瓣长度，单位厘米）。<b>类别型</b>变量记录标签（花的品种）。</p><p><b>目标变量</b>（target）是我们想要预测的变量。模型学习其他列与目标之间的关系。</p>","tip":"在 Orange 中，目标变量在 Data Table 里以 \"target\" 角色和高亮颜色显示。角色可以在 File 组件或 Edit Domain 中修改。","goals":["把一个 <code>Feature Statistics</code> 连接到 <code>File</code>。","打开 <code>Feature Statistics</code>，比较每列的均值和离散程度。"],"quiz":{"q":"在 Iris 数据集中，哪一列是目标变量？","o":["iris","petal length","sepal width"],"why":"\"iris\" 列保存的是品种。分类器要根据测量值预测的正是它。"}},"l3":{"title":"分布","concept":"<p><b>直方图</b>把数值分成若干区间，并统计每个区间里有多少行。按类别给柱子着色后，就能看出一个变量能否很好地区分品种。</p>","tip":"Orange 的 Distributions 组件会自动按目标给柱子着色，并可以把各类别堆叠或重叠显示。","goals":["把一个 <code>Distributions</code> 连接到 <code>File</code>。","在输出中选择变量 <code>petal length</code>。"],"quiz":{"q":"看 petal length 时，哪个品种与其他品种明显分开？","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"setosa 的花瓣最长约 2 厘米，另外两个品种的花瓣长度远在这之上。这样的变量非常适合分类。"}},"l4":{"title":"散点图","concept":"<p>在<b>散点图</b>中，每个点是一行数据。两个数值坐标轴展示两个变量之间的关系，颜色表示类别。</p><p>如果颜色形成彼此分开的\"岛屿\"，模型就很容易学好。</p>","tip":"Orange 的 Scatter Plot 有一个 \"Find Informative Projections\" 按钮，会自动寻找最能区分各类别的坐标轴组合。","goals":["把一个 <code>Scatter Plot</code> 连接到 <code>File</code>。","x 轴 = <code>petal length</code>，y 轴 = <code>petal width</code>。","颜色 = <code>iris</code>。"],"quiz":{"q":"花瓣散点图显示了什么？","o":["各品种形成几乎分开的群组","点是随机分散的","数据中只有两个品种"],"why":"setosa 形成一个孤立的岛；versicolor 和 virginica 只在一条窄带上相接。这就是分类器在 Iris 上准确率很高的原因。"}},"l5":{"title":"选择列","concept":"<p>并不是每个变量都有用。<b>Select Columns</b> 只让你选中的变量通过。目标变量总会保留。</p><p>列越少，图表和模型就越容易解读。</p>","tip":"在真正的 Orange 中，Select Columns 有三个框：Features、Target 和 Metas。把一列拖到 Metas 会让它不参与建模，但不会删除它。","goals":["把一个 <code>Select Columns</code> 连接到 <code>File</code>。","只保留 <code>petal length</code> 和 <code>petal width</code>。","在 <code>Select Columns</code> 之后连接一个 <code>Scatter Plot</code>。"],"quiz":{"q":"为什么要在建模前删除一些列？","o":["聚焦于相关信息并简化模型","因为 Orange 只接受两列","为了增加行数"],"why":"无关变量会带来噪声。只用少数好的变量，模型更快、更稳定，也更容易解释。"}},"l6":{"title":"缺失值","concept":"<p>真实的表格里会有空缺。Orange 把每个缺失值显示为 <code>?</code>。很多模型无法处理缺失值。</p><p><b>Impute</b> 用均值（数值）或最常见值（类别）填补空缺。另一种做法是删除不完整的行。</p>","tip":"Orange 的 Impute 还可以用模型预测缺失值，或把\"缺失\"当作一个单独的取值。","goals":["打开 <code>Data Table</code>，找到 income 和 app hours 中的 <code>?</code>。","在 <code>File</code> 之后添加一个 <code>Impute</code>。","在 <code>Impute</code> 之后连接一个 <code>Data Table</code>，确认缺失值为零。"],"quiz":{"q":"均值填补做了什么？","o":["把每个 \"?\" 替换为该列的均值","删除整列","复制上一行的值"],"why":"它简单并且保留所有行。代价是会略微缩小该列的波动，所以值得看一下原本有多少个 \"?\"。"}},"l7":{"title":"归一化","concept":"<p>在葡萄酒数据中，<code>Proline</code> 从 278 到 1680，而 <code>Hue</code> 在 1 附近。对于衡量<b>距离</b>的方法，数值大的那列会主导一切。</p><p><b>标准化</b>让每一列的均值为 0、标准差为 1。</p>","tip":"在 Orange 中，归一化位于 Preprocess 组件的 \"Normalize Features\" 选项。Orange 的 kNN 和 k-Means 默认也会归一化。","goals":["把一个 <code>Preprocess</code> 连接到葡萄酒的 <code>File</code>。","在 <code>Preprocess</code> 之后连接一个 <code>Feature Statistics</code>。","使用\"标准化\"并检查：<code>Proline</code> 的均值 = 0。"],"quiz":{"q":"为什么在使用 kNN 之前要归一化？","o":["因为 kNN 计算距离，Proline（数百）会压过 Hue（约为 1）","因为 kNN 不接受负数","因为它会增加近邻的数量"],"why":"不归一化的话，两种葡萄酒之间的距离几乎只取决于 Proline 的差异，其他变量几乎都会被忽略。"}},"l8":{"title":"你的第一个模型：kNN","concept":"<p><b>分类器</b>从带标签的样本中学习，并预测新样本的标签。<b>kNN</b> 查看最相似的 k 个样本并进行投票。</p><p>模型组件输出的是<b>模型</b>，而不是数据。负责训练和评估的是 <b>Test and Score</b>：它接收数据和一个或多个模型。</p>","tip":"在 Orange 中，Test and Score 有两个输入：Data 和 Learner。同一个 Test and Score 可以同时接收多个 learner。","goals":["把 <code>File</code> 连接到一个 <code>Test and Score</code>。","把一个 <code>kNN</code> 连接到同一个 <code>Test and Score</code>。","让准确率（CA）至少达到 0.90。"],"quiz":{"q":"什么是 5 折交叉验证？","o":["训练 5 次，每次用数据的不同部分来测试","只用 5% 的数据训练","把同一个测试重复 5 次来核对"],"why":"每一行恰好被测试一次，而且测试它的模型在训练时没见过它。这样得到的性能估计是诚实的。"}},"l9":{"title":"决策树","concept":"<p><b>决策树</b>依次提出问题：\"Proline &gt; 755？\"、\"Flavanoids ≤ 1.4？\"。每个叶节点给出一个类别。</p><p>它是少数可以读成规则的模型之一。<b>深度</b>控制它可以连续提出多少个问题。</p>","tip":"在 Orange 中，把 Tree 的 Model 输出连接到 Tree Viewer 就能看到画出来的树。这里规则直接显示在 Tree 的输出中。","goals":["把葡萄酒的 <code>File</code> 连接到 <code>Tree</code>，在输出中阅读规则。","用葡萄酒数据在 <code>Test and Score</code> 中评估 <code>Tree</code>。","调整深度，直到树的 CA 达到 0.88 或更高。"],"quiz":{"q":"把树的深度调得非常大，往往会……","o":["记住训练数据，在新数据上错得更多（过拟合）","总是提高测试准确率","让模型更容易阅读"],"why":"很深的树会为训练集中罕见的个例制定规则。交叉验证能显示这从何时开始让结果变差。"}},"l10":{"title":"比较模型","concept":"<p>没有在所有问题上都最好的模型。常见做法是把多个模型放进同一个 <b>Test and Score</b>，在相同的折上进行比较。</p><p>客户数据中有 <code>?</code>，所以工作流需要在评估前加一个 <b>Impute</b>。</p>","tip":"Orange 的 Test and Score 有一个 \"Compare models\" 表格，用来估计一个模型确实优于另一个模型的概率。","goals":["搭建 <code>File → Impute → Test and Score</code>。","把至少两个不同的模型连接到 <code>Test and Score</code>。"],"quiz":{"q":"哪个指标表示预测正确的比例？","o":["CA（分类准确率）","召回率","折数"],"why":"CA = 正确数 ÷ 总数。当类别不平衡（流失用户很少）时，还要看 F1、精确率和召回率。"}},"l11":{"title":"混淆矩阵","concept":"<p>准确率掩盖了模型错在<b>哪里</b>。<b>混淆矩阵</b>把实际类别（行）与预测类别（列）交叉。对角线上是预测正确的部分。</p><p>对客户留存团队来说，漏掉一个流失客户通常比一次误报代价更高。</p>","tip":"在 Orange 中，选中 Confusion Matrix 的单元格会把这些行传给下游。这是调查模型预测错误案例的快捷方法。","goals":["把一个 <code>Confusion Matrix</code> 连接到 <code>Test and Score</code> 的输出。","打开矩阵，找到模型没有预测到的流失客户。"],"quiz":{"q":"一位已经流失的客户，模型却预测为 \"no\"，这是……","o":["假负例（对 \"yes\" 类而言）","真正例","假正例"],"why":"实际为 \"yes\"，预测为 \"no\"。它位于 \"yes\" 行、\"no\" 列，在对角线之外。"}},"l12":{"title":"k-Means","concept":"<p><b>无监督</b>学习不使用目标变量。<b>k-Means</b> 把数据分成 k 组彼此靠近的点，并创建 <code>Cluster</code> 列。</p><p>之后，你可以把找到的簇与真实品种进行比较。</p>","tip":"在 Orange 中，k-Means 把 Cluster 作为元属性添加。在它后面接一个 Scatter Plot，就能直接按 Cluster 着色。","goals":["把 k = 3 的 <code>k-Means</code> 连接到鸢尾花的 <code>File</code>。","在 <code>k-Means</code> 之后连接一个 <code>Scatter Plot</code>。","先按 <code>Cluster</code> 再按 <code>iris</code> 给图着色进行比较。"],"quiz":{"q":"k-Means 会用 \"iris\" 列来分组吗？","o":["不会。它忽略目标，只看测量值","会，每个品种一组","只有当 k 等于品种数时才会"],"why":"簇完全来自点的几何分布。它们与品种高度吻合是一个发现，而不是规则。"}},"l13":{"title":"分几组？轮廓系数","concept":"<p>没有标签时，怎么选 k？<b>轮廓系数</b>衡量每个点离自己的组比离相邻组近多少，取值范围为 −1 到 1。</p><p>尝试多个 k，选平均轮廓系数最高的那个。</p>","tip":"Orange 的 k-Means 有 \"From 2 to 8\" 选项，会运行所有 k 并在列表中显示每个 k 的轮廓系数。","goals":["把 <code>k-Means</code> 连接到葡萄酒数据，并使用\"尝试 2 到 8\"。","切回固定模式，使用轮廓系数最高的 k。"],"quiz":{"q":"平均轮廓系数接近 1 说明……","o":["点都很好地位于自己的组内，并远离其他组","各组相互重叠","k 太大了"],"why":"接近 0 时各组相互接触；为负时有点被分错了组。这只是一个线索，最终要靠领域知识决定。"}},"l14":{"title":"逻辑回归","concept":"<p>虽然名字里有\"回归\"，<b>逻辑回归</b>其实是一个分类器。它把变量按权重（<b>系数</b>）相加，再把结果转换成 0 到 1 之间的概率。</p><p>参数 <b>C</b> 控制正则化。C 小时系数被压在 0 附近；C 大时模型更贴近数据。</p>","tip":"在 Orange 中，把 Logistic Regression 的 Coefficients 输出连接到 Data Table 即可查看权重。默认正则化是 Ridge（L2），C = 1，与这里相同。","goals":["在 <code>Impute</code> 之后搭建 <code>Test and Score</code>，接入 <code>Logistic Regression</code> 和 <code>kNN</code>。","确认逻辑回归的 CA 高于 kNN。","把 <code>Impute</code> 也连接到 <code>Logistic Regression</code> 的输入，并打开系数。"],"quiz":{"q":"\"support tickets\" 的系数为正。这说明什么？","o":["工单越多，预测的流失概率越高","工单不影响模型","工单越多的客户越不容易流失"],"why":"符号表示方向，大小表示强度。变量标准化后，各权重之间可以相互比较。"}},"l15":{"title":"随机森林","concept":"<p>单棵树并不稳定：改动几行数据，规则就会变化。<b>随机森林</b>训练许多棵树，每棵树使用<b>有放回抽样</b>得到的样本，并在每次提问时只看一个随机的变量子集。</p><p>最终预测是所有树的平均。这就是<b>集成</b>方法。</p>","tip":"Orange 的 Random Forest 默认使用 10 棵树，每次分裂随机抽取 √(变量数) 个候选变量，与这里相同。","goals":["用葡萄酒数据，把 <code>Tree</code> 和 <code>Random Forest</code> 放进同一个 <code>Test and Score</code>。","确认森林的 CA 高于单棵树。","把森林增加到 30 棵树或更多。"],"quiz":{"q":"为什么森林通常比单棵树更好？","o":["许多不同的树取平均可以降低方差","森林里的每棵树都更深","森林用了比实际更多的数据行"],"why":"每棵树犯错的方式不同。平均之后，个别错误相互抵消，留下的是稳定的模式。"}},"l16":{"title":"动手看过拟合","concept":"<p>把训练数据背下来的模型看起来很好，但在新数据上会失败。这就是<b>过拟合</b>。</p><p>要亲眼看到它，先<b>在训练数据本身上</b>评估一棵很深的树，再用<b>交叉验证</b>评估。两个数字之间的差距就是模型\"背下来\"的程度。</p>","tip":"在 Orange 的 Test and Score 中，\"Test on train data\" 选项正是为了这种对比而存在。永远不要用这个数字来挑选模型。","goals":["在 <code>Test and Score</code> 中，对深度为 8 的树选择\"在训练数据上测试\"。记下 CA。","切回 5 折交叉验证，观察 CA 下降。","降低深度，直到这棵树在交叉验证中超过深度为 8 的树。"],"quiz":{"q":"深树在训练集上 CA 很高，在交叉验证中却很低。这说明……","o":["过拟合：它记住了训练中的个例","交叉验证出了问题","欠拟合：模型太简单"],"why":"欠拟合表现为两者都很差。过拟合是训练结果与模型未见过的数据之间的差距。"}},"l17":{"title":"ROC 曲线与 AUC","concept":"<p>概率型分类器会说\"有 73% 的概率流失\"。该在哪里划线？每个<b>阈值</b>都是在命中与误报之间取舍。</p><p><b>ROC 曲线</b>一次展示所有阈值。<b>AUC</b> 是曲线下的面积：随机抽一个正例和一个负例时，模型给正例打分更高的概率。</p>","tip":"Orange 的 ROC Analysis 还会画出代价曲线，并根据每种错误的代价找到最优阈值。","goals":["在 <code>Impute</code> 之后用 <code>Test and Score</code> 评估 <code>Logistic Regression</code> 和 <code>Naive Bayes</code>。","把 <code>ROC Analysis</code> 连接到 <code>Test and Score</code>，目标类选 <code>yes</code>。","打开曲线，比较各模型的 AUC。"],"quiz":{"q":"AUC = 0.5 的模型……","o":["等同于抛硬币：不能把正例排在负例前面","在一半的情况下是完美的","总是比 50% 的 CA 好"],"why":"AUC 与所选阈值无关。0.5 对应对角线，1 表示完美排序。类别不平衡时它特别有用。"}},"l18":{"title":"用 Rank 选择特征","concept":"<p><b>信息增益</b>衡量知道某个变量的取值后，对目标的不确定性减少了多少。</p><p><b>Rank</b> 按这个指标对变量排序，只让前 n 个通过。有时少数几个变量就能达到几乎相同的效果。</p>","tip":"Orange 的 Rank 会同时计算多个指标（信息增益、Gini、ANOVA、ReliefF），由你选择按哪个排序。","goals":["把 <code>Rank</code> 连接到葡萄酒的 <code>File</code>，看看哪个变量排第一。","把 <code>Rank</code> 连接到带有 <code>kNN</code> 的 <code>Test and Score</code>。","最多使用 3 个变量，使 CA 达到 0.93 或更高。"],"quiz":{"q":"在葡萄酒数据中，哪个变量的信息增益最高？","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids 能很好地区分三个品种。Malic Acid 帮助最小，Rank 把它排在最后。"}}},"faq":[{"s":"关于本项目","items":[{"q":"DS.Micro 是什么？","a":"<p>一个免费的数据科学微学习平台。每节课 3 到 5 分钟：阅读一个概念，在画布上搭建一个小型组件工作流，然后回答一道检验题。</p><p>目标是帮助任何人通过动手实践迈出数据科学的第一步，无需安装任何软件，也不用写代码。</p>"},{"q":"适合谁？","a":"<p>想了解数据分析和机器学习如何运作的学生、教师和职场人士。学习路径从入门（什么是数据集）到高级（集成方法、过拟合、ROC 曲线）。</p>"},{"q":"它和 Orange Data Mining 是什么关系？","a":"<p>DS.Micro 是一个独立的教育项目，灵感来自卢布尔雅那大学开发的可视化工具 <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>。这里的组件与 Orange 同名、逻辑相同，所以你在这里学到的可以直接用到 Orange 中。</p><p>这里的组件是简化的模拟。做真实项目时，请使用 Orange 本身。</p>"},{"q":"免费吗？需要注册账号吗？","a":"<p>免费，而且不需要账号。一切都在你的浏览器中运行。</p>"}]},{"s":"如何使用","items":[{"q":"一节课是怎样进行的？","a":"<p>每节课分三部分：</p><p><b>概念：</b>简短的解释，以及它在真正的 Orange 中是什么样子的提示。<br><b>任务：</b>需要在画布上完成的步骤。工作流正确运行时会自动打勾。<br><b>检验：</b>一道关于你在数据中看到内容的题目。</p><p>完成任务并答对题目，本课即告完成。</p>"},{"q":"如何添加和连接组件？","a":"<p>点击画布上方组件面板中的项目即可添加组件。如果已选中一个组件，新组件会自动连接到它。</p><p>要连接两个组件，从一个组件右侧的圆点拖到另一个组件上。在手机上，先点圆点，再点目标组件。数据总是从右侧（输出）流向左侧（输入）。</p><p>要删除连接，点击连线标签上的 ×。要删除组件，选中它后使用输出面板中的按钮。</p>"},{"q":"在哪里查看结果？","a":"<p>点击任意组件，它的参数和输出（表格、图表、指标或规则）会显示在输出面板中。在手机上，请打开\"输出\"标签页。</p>"},{"q":"Data Lab 是什么？","a":"<p>一个没有任务的开放工作区，你可以用所有组件和数据集搭建任意工作流，并且有现成的工作流可以作为起点。<a href=\"#lab\" data-route=\"lab\">打开 Data Lab</a>。</p>"},{"q":"用到了哪些数据集？","a":"<p><b>鸢尾花</b>（150 朵花，三个品种）和<b>葡萄酒</b>（178 种葡萄酒，三个品种）是经典的真实数据集。<b>客户</b>是带有缺失值的虚构数据集，用于练习数据清洗和流失预测。</p>"},{"q":"结果是真实计算的吗？","a":"<p>是的。模型、交叉验证和各项指标都在你的浏览器中用这些数据真实计算。由于这里的部分算法经过简化，数值可能与 Orange 略有不同。</p>"}]},{"s":"进度与技术问题","items":[{"q":"我的进度保存在哪里？","a":"<p>保存在你自己的浏览器中（本地存储），不会发送到任何服务器。如果清除网站数据，或更换浏览器、设备，进度会从头开始。</p>"},{"q":"可以离线使用吗？","a":"<p>可以。DS.Micro 是一个独立的单一 HTML 文件，数据、语言和字体都包含在其中。加载完成后，无需联网即可使用。</p>"},{"q":"如何切换语言？","a":"<p>使用页面顶部的语言选择器。可用语言：English、Español、Português、中文、हिन्दी 和 한국어。</p>"},{"q":"如何过渡到真正的 Orange？","a":"<p>在 <a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a> 免费下载 Orange，然后重新搭建课程中的工作流。组件名称完全相同，每节课的\"在 Orange 中\"提示会指出其中的差异。</p>"}]}],"gloss":{"dataset":{"t":"数据集","d":"一张数据表：每一行是一个样本（一朵花、一种葡萄酒、一位客户），每一列是一个变量。"},"widget":{"t":"组件","d":"工作流中只做一件事的构建块，例如加载数据、绘制图表或训练模型。"},"workflow":{"t":"工作流","d":"由相互连接的组件组成的链条。数据从一个组件的输出（右侧）流向下一个组件的输入（左侧）。"},"variable":{"t":"变量（特征）","d":"数据集中描述样本的一列，例如花瓣长度。模型从变量中学习。"},"numeric":{"t":"数值型变量","d":"取值为可测量、可比较的数字的变量，例如收入或年龄。"},"categorical":{"t":"类别型变量","d":"取值为固定集合中标签的变量，例如套餐（basic、plus、premium）或品种。"},"target":{"t":"目标变量","d":"我们想要预测的变量，例如品种或客户是否流失，也称为类别。"},"meta":{"t":"元属性","d":"跟随数据一起保存但会被模型忽略的列，例如 ID，或 k-Means 添加的 Cluster 列。"},"histogram":{"t":"直方图","d":"把数值分成若干区间，并统计每个区间中有多少行的图表。"},"scatter":{"t":"散点图","d":"每一行是一个点、由两个数值变量确定位置的图表；颜色可以表示类别。"},"featsel":{"t":"特征选择","d":"选择在模型中使用哪些变量，保留有信息量的变量，去掉噪声。"},"missing":{"t":"缺失值","d":"没有取值的单元格。Orange 用 \"?\" 表示。很多模型无法处理缺失值。"},"imputation":{"t":"缺失值填补","d":"为缺失值填入数值，例如用该列的均值或最常见的值。"},"normalization":{"t":"归一化","d":"把数值变量放到同一尺度上。标准化使每一列的均值为 0、标准差为 1。"},"classification":{"t":"分类","d":"为每个样本预测一个类别，例如花的品种。"},"learner":{"t":"学习器（模型）","d":"从带标签的样本中学习规律，再预测新样本类别的算法。"},"knn":{"t":"k 近邻（kNN）","d":"根据训练数据中最相似的 k 个样本投票来对一个样本进行分类。"},"cv":{"t":"交叉验证","d":"一种评估方法：把数据分成若干折，每一折都用在其余折上训练的模型来测试。"},"fold":{"t":"折","d":"交叉验证中数据被分成的大小相等的部分之一。每一折恰好用于测试一次。"},"stratified":{"t":"分层","d":"划分数据时让每一折保持与整个数据集相同的类别比例。"},"ca":{"t":"分类准确率（CA）","d":"模型预测正确的样本所占的比例：正确数 ÷ 总数。"},"precision":{"t":"精确率","d":"被预测为某一类的样本中，真正属于该类的比例。精确率高意味着误报少。"},"recall":{"t":"召回率","d":"真正属于某一类的样本中，被模型找出来的比例。召回率高意味着漏报少。"},"f1":{"t":"F1 分数","d":"精确率和召回率的调和平均数。只有两者都高时它才会高。"},"imbalance":{"t":"类别不平衡","d":"某一类比其他类少得多的情况，例如流失客户。这时只看准确率可能会产生误导。"},"tree":{"t":"决策树","d":"对变量依次提出是/否问题的模型；每个叶节点给出一个类别，可以读成规则。"},"depth":{"t":"树的深度","d":"决策树可以连续提出的最大问题数。越深的树能拟合越多细节，也越容易过拟合。"},"nb":{"t":"朴素贝叶斯","d":"假设各变量相互独立、综合每个变量证据的概率型分类器。"},"confusion":{"t":"混淆矩阵","d":"把实际类别（行）与预测类别（列）交叉的表格。对角线上是预测正确的部分。"},"fpfn":{"t":"假正例 / 假负例","d":"假正例是误报（预测为是，实际为否）。假负例是漏报（预测为否，实际为是）。"},"unsup":{"t":"无监督学习","d":"在没有目标变量的数据中学习，以发现诸如群组之类的结构。"},"clustering":{"t":"聚类","d":"在不使用标签的情况下，把相似的样本归为一组。"},"kmeans":{"t":"k-Means","d":"把数据分成 k 组的聚类算法，每组围绕一个由邻近点组成的中心形成。"},"silhouette":{"t":"轮廓系数","d":"取值在 −1 到 1 之间的指标，衡量每个点与自身簇的契合程度，并与最近的其他簇相比较。"},"logreg":{"t":"逻辑回归","d":"对变量加权求和，并把结果转换为 0 到 1 之间概率的线性分类器。"},"coefficient":{"t":"系数","d":"线性模型赋予某个变量的权重。符号表示影响方向，大小表示影响强度。"},"regularization":{"t":"正则化","d":"让模型系数保持较小以避免过拟合的惩罚项。在逻辑回归中由 C 控制。"},"ensemble":{"t":"集成方法","d":"综合多个模型的预测以获得更稳定结果的模型。"},"rf":{"t":"随机森林","d":"由多棵决策树组成的集成模型，每棵树用自助样本和随机的变量子集训练，通过平均进行预测。"},"bootstrap":{"t":"自助样本","d":"从数据中有放回地抽取、与原数据大小相同的样本。有些行会重复，有些行会被遗漏。"},"overfitting":{"t":"过拟合","d":"模型记住了训练数据，在新数据上的表现明显变差。"},"underfitting":{"t":"欠拟合","d":"模型过于简单，无法捕捉规律，即使在训练数据上表现也很差。"},"traintest":{"t":"训练数据与测试数据","d":"训练数据用于拟合模型；测试数据在训练中从未见过，用于诚实地评估模型。"},"threshold":{"t":"决策阈值","d":"概率型分类器预测为正类的概率分界值。"},"roc":{"t":"ROC 曲线","d":"展示在所有决策阈值下真正率与假正率之间关系的曲线。"},"auc":{"t":"AUC","d":"ROC 曲线下的面积：随机抽取一个正例和一个负例时，模型给正例打分更高的概率。0.5 相当于猜测，1 为完美。"},"infogain":{"t":"信息增益","d":"知道某个变量的取值后，对目标的不确定性减少了多少。Rank 用它来给变量排序。"}}},"hi":{"ui":{"and":" और ","brand.home":"DS.Micro, होम","nav.sections":"खंड","nav.tracks":"ट्रैक","nav.free":"Data Lab","lang.label":"भाषा","theme.toggle":"लाइट/डार्क थीम बदलें","xp.lessons":"{n}/{t} पाठ","hero.eyebrow":"माइक्रो-लर्निंग · Orange Data Mining शैली के विज़ुअल वर्कफ़्लो","hero.title":"डेटा साइंस, <em>एक बार में एक विजेट</em>।","hero.lead":"3 से 5 मिनट के पाठ, जिनमें आप असली वर्कफ़्लो बनाते हैं: डेटा लोड करना, साफ़ करना, विज़ुअलाइज़ करना, मॉडल ट्रेन करना और नतीजा मापना। सब कुछ यहीं ब्राउज़र में, असली डेटा पर चलता है।","hero.continue":"जारी रखें: {t}","hero.start":"पाठ 1 से शुरू करें","hero.free":"Data Lab खोलें","facts.lessons":"माइक्रो-पाठ","facts.widgets":"विजेट","facts.datasets":"डेटासेट","hero.aria":"वर्कफ़्लो: File और kNN, Test and Score से जुड़े हुए","hero.caption":"अभी गणना की गई: Iris पर kNN (k = 5), 5-फ़ोल्ड क्रॉस-वैलिडेशन रेंगे।"}},"l3":{"title":"वितरण","concept":"<p><b>हिस्टोग्राम</b> मानों को सीमाओं में बाँटता है और गिनता है कि हर सीमा में कितनी पंक्तियाँ हैं। जब हम बार को क्लास के अनुसार रंगते हैं, तो दिखता है कि कोई वेरिएबल प्रजातियों को अच्छी तरह अलग करता है या नहीं।</p>","tip":"Orange का Distributions विजेट बार को अपने आप लक्ष्य के अनुसार रंगता है और क्लास को एक के ऊपर एक या ओवरले करके दिखा सकता है।","goals":["<code>File</code> से एक <code>Distributions</code> जोड़ें।","आउटपुट में वेरिएबल <code>petal length</code> चुनें।"],"quiz":{"q":"petal length देखकर, कौन सी प्रजाति बाकियों से अलग दिखती है?","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"setosa की पंखुड़ियाँ लगभग 2 सेमी तक होती हैं; बाकी दो प्रजातियाँ उसके काफ़ी बाद शुरू होती हैं। ऐसा वेरिएबल क्लासिफ़िकेशन के लिए बहुत अच्छा है।"}},"l4":{"title":"स्कैटर प्लॉट","concept":"<p><b>स्कैटर प्लॉट</b> में हर बिंदु डेटा की एक पंक्ति है। दो संख्यात्मक अक्ष दो वेरिएबल के बीच संबंध दिखाते हैं और रंग क्लास दिखाता है।</p><p>अगर रंग अलग-अलग द्वीप बनाते हैं, तो मॉडल का काम आसान होगा।</p>","tip":"Orange के Scatter Plot में \"Find Informative Projections\" बटन है, जो अपने आप वे अक्ष-जोड़े खोजता है जो क्लास को सबसे अच्छी तरह अलग करते हैं।","goals":["<code>File</code> से एक <code>Scatter Plot</code> जोड़ें।","x अक्ष = <code>petal length</code> और y अक्ष = <code>petal width</code>।","रंग = <code>iris</code>।"],"quiz":{"q":"पंखुड़ियों का प्लॉट क्या दिखाता है?","o":["प्रजातियाँ लगभग अलग-अलग समूह बनाती हैं","बिंदु बेतरतीब बिखरे हैं","डेटा में सिर्फ़ दो प्रजातियाँ हैं"],"why":"setosa एक अलग द्वीप बनाती है; versicolor और virginica केवल एक पतली पट्टी में मिलती हैं। इसीलिए Iris पर क्लासिफ़ायर इतने सटीक होते हैं।"}},"l5":{"title":"कॉलम चुनना","concept":"<p>हर वेरिएबल मदद नहीं करता। <b>Select Columns</b> सिर्फ़ आपके चुने हुए वेरिएबल को आगे जाने देता है। लक्ष्य वेरिएबल हमेशा आगे जाता है।</p><p>कम कॉलम होने से प्लॉट और मॉडल समझना आसान होता है।</p>","tip":"असली Orange में Select Columns के तीन बॉक्स होते हैं: Features, Target और Metas। किसी कॉलम को Metas में खींचने से वह मॉडल से हट जाता है, पर मिटता नहीं।","goals":["<code>File</code> से एक <code>Select Columns</code> जोड़ें।","सिर्फ़ <code>petal length</code> और <code>petal width</code> रखें।","<code>Select Columns</code> के बाद एक <code>Scatter Plot</code> जोड़ें।"],"quiz":{"q":"मॉडल बनाने से पहले कॉलम क्यों हटाएँ?","o":["जो प्रासंगिक है उस पर ध्यान देने और मॉडल को सरल बनाने के लिए","क्योंकि Orange सिर्फ़ दो कॉलम स्वीकार करता है","पंक्तियों की संख्या बढ़ाने के लिए"],"why":"अप्रासंगिक वेरिएबल शोर लाते हैं। कुछ अच्छे वेरिएबल के साथ मॉडल तेज़, ज़्यादा स्थिर और समझाने में आसान होता है।"}},"l6":{"title":"खाली मान","concept":"<p>असली स्प्रेडशीट में खाली जगहें होती हैं। Orange हर खाली मान को <code>?</code> के रूप में दिखाता है। कई मॉडल इन्हें संभाल नहीं पाते।</p><p><b>Impute</b> खाली जगहों को माध्य (संख्याएँ) या सबसे आम मान (श्रेणियाँ) से भरता है। दूसरा विकल्प अधूरी पंक्तियाँ हटाना है।</p>","tip":"Orange का Impute खाली मान का अनुमान किसी मॉडल से भी लगा सकता है, या \"खाली\" को अपना एक अलग मान मान सकता है।","goals":["<code>Data Table</code> खोलें और income और app hours में <code>?</code> खोजें।","<code>File</code> के बाद एक <code>Impute</code> जोड़ें।","<code>Impute</code> के बाद एक <code>Data Table</code> जोड़ें और पुष्टि करें: शून्य खाली मान।"],"quiz":{"q":"माध्य से इम्प्यूटेशन क्या करता है?","o":["हर \"?\" को कॉलम के माध्य से बदल देता है","पूरा कॉलम मिटा देता है","ऊपर वाली पंक्ति का मान कॉपी करता है"],"why":"यह सरल है और सभी पंक्तियाँ बचाता है। कीमत यह है कि कॉलम का फैलाव थोड़ा घटता है, इसलिए देख लें कि कितने \"?\" थे।"}},"l7":{"title":"नॉर्मलाइज़ेशन","concept":"<p>वाइन डेटा में <code>Proline</code> 278 से 1680 तक जाता है, जबकि <code>Hue</code> 1 के आसपास रहता है। <b>दूरी</b> मापने वाले तरीकों में बड़ा कॉलम सब पर हावी हो जाता है।</p><p><b>स्टैंडर्डाइज़</b> करने से हर कॉलम का माध्य 0 और मानक विचलन 1 हो जाता है।</p>","tip":"Orange में नॉर्मलाइज़ेशन Preprocess विजेट में \"Normalize Features\" विकल्प के अंदर है। Orange के kNN और k-Means भी डिफ़ॉल्ट रूप से नॉर्मलाइज़ करते हैं।","goals":["वाइन वाले <code>File</code> से एक <code>Preprocess</code> जोड़ें।","<code>Preprocess</code> के बाद एक <code>Feature Statistics</code> जोड़ें।","\"स्टैंडर्डाइज़\" चुनें और जाँचें: <code>Proline</code> का माध्य = 0।"],"quiz":{"q":"kNN से पहले नॉर्मलाइज़ क्यों करें?","o":["क्योंकि kNN दूरी मापता है और Proline (सैकड़ों में) Hue (लगभग 1) पर हावी हो जाएगा","क्योंकि kNN नेगेटिव संख्याएँ स्वीकार नहीं करता","क्योंकि इससे पड़ोसियों की संख्या बढ़ती है"],"why":"नॉर्मलाइज़ किए बिना, दो वाइनों के बीच की दूरी लगभग सिर्फ़ Proline का अंतर होगी। बाकी वेरिएबल लगभग गायब हो जाएँगे।"}},"l8":{"title":"आपका पहला मॉडल: kNN","concept":"<p><b>क्लासिफ़ायर</b> लेबल वाले उदाहरणों से सीखता है और नए उदाहरणों के लेबल का अनुमान लगाता है। <b>kNN</b> सबसे मिलते-जुलते k उदाहरणों को देखकर वोट करता है।</p><p>मॉडल विजेट से <b>मॉडल</b> निकलता है, डेटा नहीं। ट्रेन और माप करने का काम <b>Test and Score</b> करता है: वह डेटा और एक या अधिक मॉडल लेता है।</p>","tip":"Orange में Test and Score के दो इनपुट हैं: Data और Learner। एक ही Test and Score एक साथ कई learner स्वीकार करता है।","goals":["<code>File</code> को एक <code>Test and Score</code> से जोड़ें।","उसी <code>Test and Score</code> से एक <code>kNN</code> जोड़ें।","कम से कम 0.90 की सटीकता (CA) तक पहुँचें।"],"quiz":{"q":"5-फ़ोल्ड क्रॉस-वैलिडेशन क्या है?","o":["5 बार ट्रेन करना, हर बार डेटा के अलग हिस्से पर टेस्ट करना","डेटा के 5% से ट्रेन करना","जाँचने के लिए एक ही टेस्ट को 5 बार दोहराना"],"why":"हर पंक्ति ठीक एक बार टेस्ट होती है, ऐसे मॉडल से जिसने ट्रेनिंग में उसे नहीं देखा। इससे प्रदर्शन का ईमानदार अनुमान मिलता है।"}},"l9":{"title":"डिसीज़न ट्री","concept":"<p><b>डिसीज़न ट्री</b> क्रम से सवाल पूछता है: \"Proline &gt; 755?\", \"Flavanoids ≤ 1.4?\"। हर पत्ता एक क्लास देता है।</p><p>यह उन कुछ मॉडलों में से है जिन्हें नियमों की तरह पढ़ा जा सकता है। <b>गहराई</b> तय करती है कि वह लगातार कितने सवाल पूछ सकता है।</p>","tip":"Orange में Tree के Model आउटपुट को Tree Viewer से जोड़ने पर पेड़ चित्र के रूप में दिखता है। यहाँ नियम सीधे Tree के आउटपुट में दिखते हैं।","goals":["वाइन वाले <code>File</code> को एक <code>Tree</code> से जोड़ें और आउटपुट में नियम पढ़ें।","वाइन डेटा के साथ <code>Test and Score</code> में <code>Tree</code> का मूल्यांकन करें।","गहराई बदलते रहें जब तक पेड़ की CA 0.88 या उससे ज़्यादा न हो।"],"quiz":{"q":"पेड़ की गहराई बहुत बढ़ाने से अक्सर…","o":["ट्रेनिंग डेटा रट लिया जाता है और नए डेटा पर गलतियाँ बढ़ती हैं (ओवरफ़िटिंग)","टेस्ट सटीकता हमेशा बढ़ती है","मॉडल पढ़ना आसान हो जाता है"],"why":"गहरा पेड़ ट्रेनिंग के दुर्लभ मामलों के लिए नियम बनाता है। क्रॉस-वैलिडेशन दिखाता है कि यह कब नतीजा बिगाड़ने लगता है।"}},"l10":{"title":"मॉडलों की तुलना","concept":"<p>कोई भी मॉडल हर चीज़ में सबसे अच्छा नहीं होता। तरीका यह है कि कई मॉडल एक ही <b>Test and Score</b> में डालें और एक ही फ़ोल्ड पर तुलना करें।</p><p>ग्राहक डेटा में <code>?</code> हैं, इसलिए मूल्यांकन से पहले वर्कफ़्लो में एक <b>Impute</b> चाहिए।</p>","tip":"Orange के Test and Score में \"Compare models\" तालिका होती है, जो अनुमान लगाती है कि एक मॉडल सच में दूसरे से बेहतर होने की प्रायिकता कितनी है।","goals":["<code>File → Impute → Test and Score</code> बनाएँ।","<code>Test and Score</code> से कम से कम दो अलग-अलग मॉडल जोड़ें।"],"quiz":{"q":"कौन सा मीट्रिक सही अनुमानों का अनुपात दिखाता है?","o":["CA (Classification Accuracy)","रिकॉल","फ़ोल्ड की संख्या"],"why":"CA = सही ÷ कुल। जब क्लास असंतुलित हों (कम ग्राहक छोड़ते हों), तो F1, प्रिसिज़न और रिकॉल भी देखें।"}},"l11":{"title":"कन्फ़्यूज़न मैट्रिक्स","concept":"<p>सटीकता यह छिपा देती है कि मॉडल <b>कहाँ</b> गलती करता है। <b>कन्फ़्यूज़न मैट्रिक्स</b> वास्तविक क्लास (पंक्तियाँ) को अनुमानित क्लास (कॉलम) से मिलाता है। विकर्ण पर सही उत्तर होते हैं।</p><p>ग्राहक बनाए रखने वाली टीम के लिए, किसी के छोड़ने का अनुमान न लगा पाना अक्सर झूठे अलार्म से महँगा पड़ता है।</p>","tip":"Orange में Confusion Matrix के सेल चुनने पर वे पंक्तियाँ आगे भेजी जाती हैं। यह मॉडल की गलतियों वाले मामलों की जाँच का तेज़ तरीका है।","goals":["<code>Test and Score</code> के आउटपुट से एक <code>Confusion Matrix</code> जोड़ें।","मैट्रिक्स खोलें और वे ग्राहक खोजें जो छोड़ गए पर मॉडल ने अनुमान नहीं लगाया।"],"quiz":{"q":"जो ग्राहक छोड़ गया, लेकिन मॉडल ने \"no\" का अनुमान लगाया, वह है…","o":["फ़ॉल्स नेगेटिव (\"yes\" क्लास के लिए)","ट्रू पॉज़िटिव","फ़ॉल्स पॉज़िटिव"],"why":"वास्तविक \"yes\", अनुमानित \"no\"। यह \"yes\" पंक्ति, \"no\" कॉलम में, विकर्ण से बाहर दिखता है।"}},"l12":{"title":"k-Means","concept":"<p><b>अनसुपरवाइज़्ड</b> लर्निंग लक्ष्य का उपयोग नहीं करती। <b>k-Means</b> डेटा को पास-पास के बिंदुओं के k समूहों में बाँटता है और <code>Cluster</code> कॉलम बनाता है।</p><p>बाद में आप मिले हुए समूहों की तुलना असली प्रजातियों से कर सकते हैं।</p>","tip":"Orange में k-Means, Cluster को मेटा-एट्रिब्यूट के रूप में जोड़ता है। उसके बाद का Scatter Plot सीधे Cluster से रंग सकता है।","goals":["आइरिस वाले <code>File</code> से k = 3 वाला एक <code>k-Means</code> जोड़ें।","<code>k-Means</code> के बाद एक <code>Scatter Plot</code> जोड़ें।","तुलना के लिए प्लॉट को पहले <code>Cluster</code> से और फिर <code>iris</code> से रंगें।"],"quiz":{"q":"क्या k-Means समूह बनाने के लिए \"iris\" कॉलम का उपयोग करता है?","o":["नहीं। यह लक्ष्य को अनदेखा करता है और सिर्फ़ माप देखता है","हाँ, हर प्रजाति का एक समूह","सिर्फ़ तब जब k प्रजातियों की संख्या के बराबर हो"],"why":"समूह सिर्फ़ बिंदुओं की ज्यामिति से बनते हैं। उनका प्रजातियों से अच्छी तरह मेल खाना एक खोज है, नियम नहीं।"}},"l13":{"title":"कितने समूह? सिल्हूट","concept":"<p>लेबल के बिना k कैसे चुनें? <b>सिल्हूट</b> हर बिंदु के लिए मापता है कि वह अपने समूह के पड़ोसी समूह की तुलना में कितना ज़्यादा पास है। इसका मान −1 से 1 तक होता है।</p><p>कई k आज़माएँ और सबसे ऊँचे औसत सिल्हूट वाला चुनें।</p>","tip":"Orange के k-Means में \"From 2 to 8\" विकल्प है, जो सभी k चलाता है और हर एक का सिल्हूट सूची में दिखाता है।","goals":["वाइन डेटा से एक <code>k-Means</code> जोड़ें और \"2 से 8 आज़माएँ\" चुनें।","सबसे ऊँचे सिल्हूट वाले k के साथ स्थिर मोड पर लौटें।"],"quiz":{"q":"1 के पास का औसत सिल्हूट दर्शाता है…","o":["बिंदु अपने समूह के अंदर अच्छी तरह हैं और दूसरों से दूर हैं","समूह एक-दूसरे पर चढ़े हुए हैं","k बहुत बड़ा है"],"why":"0 के पास समूह एक-दूसरे को छूते हैं; नेगेटिव होने पर कुछ बिंदु गलत समूह में हैं। यह एक संकेत है, आख़िरी फ़ैसला विषय-ज्ञान से होता है।"}},"l14":{"title":"लॉजिस्टिक रिग्रेशन","concept":"<p>नाम के बावजूद, <b>लॉजिस्टिक रिग्रेशन</b> एक क्लासिफ़ायर है। यह वेरिएबल को भार (<b>गुणांक</b>) के साथ जोड़ता है और नतीजे को 0 से 1 के बीच की प्रायिकता में बदलता है।</p><p>पैरामीटर <b>C</b> रेगुलराइज़ेशन तय करता है। छोटा C गुणांकों को शून्य के पास रखता है; बड़ा C मॉडल को डेटा के ज़्यादा क़रीब चलने देता है।</p>","tip":"Orange में Logistic Regression के Coefficients आउटपुट को Data Table से जोड़कर भार देखे जा सकते हैं। डिफ़ॉल्ट रेगुलराइज़ेशन Ridge (L2) है, C = 1 के साथ, जैसा यहाँ है।","goals":["<code>Impute</code> के बाद <code>Logistic Regression</code> और <code>kNN</code> के साथ एक <code>Test and Score</code> बनाएँ।","पुष्टि करें कि CA में लॉजिस्टिक रिग्रेशन kNN से आगे है।","<code>Impute</code> को <code>Logistic Regression</code> के इनपुट से भी जोड़ें और गुणांक खोलें।"],"quiz":{"q":"\"support tickets\" का गुणांक पॉज़िटिव है। इसका क्या मतलब है?","o":["ज़्यादा टिकट से छोड़ने की अनुमानित संभावना बढ़ती है","टिकट मॉडल को प्रभावित नहीं करते","ज़्यादा टिकट वाले ग्राहक कम छोड़ते हैं"],"why":"चिह्न दिशा बताता है और आकार ताकत। स्टैंडर्डाइज़ किए गए वेरिएबल के साथ भारों की आपस में तुलना की जा सकती है।"}},"l15":{"title":"रैंडम फ़ॉरेस्ट","concept":"<p>अकेला पेड़ अस्थिर होता है: कुछ पंक्तियाँ बदलने से नियम बदल जाते हैं। <b>रैंडम फ़ॉरेस्ट</b> कई पेड़ ट्रेन करता है, हर एक <b>रिप्लेसमेंट के साथ लिए गए सैंपल</b> पर, और हर सवाल पर वेरिएबल के एक बेतरतीब उपसमूह को देखता है।</p><p>अंतिम अनुमान सभी पेड़ों का औसत होता है। इसे <b>एन्सेम्बल</b> कहते हैं।</p>","tip":"Orange का Random Forest डिफ़ॉल्ट रूप से 10 पेड़ इस्तेमाल करता है और हर विभाजन पर √(वेरिएबल की संख्या) उम्मीदवार चुनता है, जैसा यहाँ है।","goals":["वाइन डेटा के साथ <code>Tree</code> और <code>Random Forest</code> को एक ही <code>Test and Score</code> में रखें।","जाँचें कि CA में जंगल पेड़ से आगे है।","जंगल को 30 या उससे ज़्यादा पेड़ों तक बढ़ाएँ।"],"quiz":{"q":"जंगल आमतौर पर अकेले पेड़ से बेहतर क्यों होता है?","o":["कई अलग-अलग पेड़ों का औसत वैरिएंस घटाता है","जंगल का हर पेड़ ज़्यादा गहरा होता है","जंगल मौजूद पंक्तियों से ज़्यादा पंक्तियाँ इस्तेमाल करता है"],"why":"हर पेड़ अलग तरह से गलती करता है। औसत में अलग-अलग गलतियाँ एक-दूसरे को काट देती हैं और स्थिर पैटर्न बचता है।"}},"l16":{"title":"ओवरफ़िटिंग, व्यवहार में","concept":"<p>जो मॉडल ट्रेनिंग डेटा रट लेता है वह बहुत अच्छा दिखता है पर नए डेटा पर विफल होता है। इसे <b>ओवरफ़िटिंग</b> कहते हैं।</p><p>इसे होते देखने के लिए, एक गहरे पेड़ का मूल्यांकन <b>उसके अपने ट्रेनिंग डेटा पर</b> करें और फिर <b>क्रॉस-वैलिडेशन</b> से। दोनों संख्याओं का अंतर बताता है कि मॉडल ने कितना रटा।</p>","tip":"Orange के Test and Score में \"Test on train data\" विकल्प ठीक इसी तुलना के लिए है। मॉडल चुनने के लिए इस संख्या का कभी उपयोग न करें।","goals":["<code>Test and Score</code> में गहराई 8 वाले पेड़ के साथ \"ट्रेनिंग डेटा पर टेस्ट करें\" चुनें। CA नोट करें।","5-फ़ोल्ड क्रॉस-वैलिडेशन पर लौटें और CA गिरते देखें।","गहराई घटाएँ जब तक क्रॉस-वैलिडेशन में पेड़ गहराई 8 वाले से आगे न निकल जाए।"],"quiz":{"q":"गहरे पेड़ की CA ट्रेनिंग पर ऊँची और क्रॉस-वैलिडेशन में नीची रही। इसका मतलब है…","o":["ओवरफ़िटिंग: उसने ट्रेनिंग के मामले रट लिए","क्रॉस-वैलिडेशन में गड़बड़ी है","अंडरफ़िटिंग: मॉडल बहुत सरल है"],"why":"अंडरफ़िटिंग दोनों में खराब प्रदर्शन के रूप में दिखती है। ओवरफ़िटिंग ट्रेनिंग और अनदेखे डेटा के बीच का अंतर है।"}},"l17":{"title":"ROC कर्व और AUC","concept":"<p>एक प्रायिकता वाला क्लासिफ़ायर कहता है \"छोड़ने की 73% संभावना\"। रेखा कहाँ खींचें? हर <b>थ्रेशोल्ड</b> सही पकड़ और झूठे अलार्म के बीच समझौता है।</p><p><b>ROC कर्व</b> सारे थ्रेशोल्ड एक साथ दिखाता है। <b>AUC</b> उसके नीचे का क्षेत्रफल है: यह संभावना कि मॉडल किसी बेतरतीब पॉज़िटिव को किसी बेतरतीब नेगेटिव से ज़्यादा स्कोर दे।</p>","tip":"Orange का ROC Analysis लागत कर्व भी बनाता है और हर तरह की गलती की लागत के आधार पर सबसे अच्छा थ्रेशोल्ड खोजता है।","goals":["<code>Impute</code> के बाद एक <code>Test and Score</code> में <code>Logistic Regression</code> और <code>Naive Bayes</code> का मूल्यांकन करें।","<code>Test and Score</code> से एक <code>ROC Analysis</code> जोड़ें, लक्ष्य क्लास <code>yes</code> रखें।","कर्व खोलें और AUC की तुलना करें।"],"quiz":{"q":"AUC = 0.5 वाला मॉडल…","o":["सिक्का उछालने जैसा है: पॉज़िटिव को नेगेटिव से ऊपर नहीं रखता","आधे मामलों में परफ़ेक्ट है","हमेशा 50% CA से बेहतर है"],"why":"AUC चुने गए थ्रेशोल्ड पर निर्भर नहीं करता। 0.5 विकर्ण है; 1 परफ़ेक्ट क्रम है। असंतुलित क्लास में यह उपयोगी है।"}},"l18":{"title":"Rank से फ़ीचर चयन","concept":"<p><b>सूचना लाभ</b> मापता है कि किसी वेरिएबल का मान जानने से लक्ष्य के बारे में अनिश्चितता कितनी घटती है।</p><p><b>Rank</b> इस माप के अनुसार वेरिएबल को क्रम देता है और सिर्फ़ सबसे अच्छे n को आगे जाने देता है। कई बार कुछ ही वेरिएबल से लगभग वही प्रदर्शन मिल जाता है।</p>","tip":"Orange का Rank एक साथ कई माप निकालता है (सूचना लाभ, Gini, ANOVA, ReliefF) और आप चुनते हैं कि किससे क्रम दें।","goals":["वाइन वाले <code>File</code> से एक <code>Rank</code> जोड़ें और देखें कौन सा वेरिएबल सबसे आगे है।","<code>Rank</code> को <code>kNN</code> वाले एक <code>Test and Score</code> से जोड़ें।","ज़्यादा से ज़्यादा 3 वेरिएबल के साथ 0.93 या उससे ज़्यादा CA तक पहुँचें।"],"quiz":{"q":"वाइन डेटा में किस वेरिएबल का सूचना लाभ सबसे ज़्यादा है?","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids तीनों किस्मों को अच्छी तरह अलग करता है। Malic Acid सबसे कम मदद करता है; Rank उसे आख़िर में रखता है।"}}},"faq":[{"s":"प्रोजेक्ट के बारे में","items":[{"q":"DS.Micro क्या है?","a":"<p>डेटा साइंस का एक मुफ़्त माइक्रो-लर्निंग प्लेटफ़ॉर्म। हर पाठ 3 से 5 मिनट का है: आप एक कॉन्सेप्ट पढ़ते हैं, कैनवास पर विजेट का एक छोटा वर्कफ़्लो बनाते हैं और एक जाँच प्रश्न का उत्तर देते हैं।</p><p>लक्ष्य है कि कोई भी व्यक्ति बिना कुछ इंस्टॉल किए और बिना कोड लिखे, करके सीखते हुए डेटा साइंस में पहले कदम रख सके।</p>"},{"q":"यह किसके लिए है?","a":"<p>उन विद्यार्थियों, शिक्षकों और पेशेवरों के लिए जो समझना चाहते हैं कि डेटा विश्लेषण और मशीन लर्निंग कैसे काम करते हैं। ट्रैक शुरुआती स्तर (डेटासेट क्या है) से उन्नत स्तर (एन्सेम्बल, ओवरफ़िटिंग, ROC कर्व) तक जाते हैं।</p>"},{"q":"Orange Data Mining से इसका क्या संबंध है?","a":"<p>DS.Micro एक स्वतंत्र शैक्षिक प्रोजेक्ट है, जो ल्युब्लियाना विश्वविद्यालय के विज़ुअल टूल <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a> से प्रेरित है। यहाँ के विजेट के नाम और तर्क Orange जैसे ही हैं, इसलिए यहाँ जो सीखते हैं वह सीधे वहाँ काम आता है।</p><p>यहाँ के विजेट सरल सिमुलेशन हैं। असली प्रोजेक्ट के लिए ख़ुद Orange का उपयोग करें।</p>"},{"q":"क्या यह मुफ़्त है? क्या अकाउंट चाहिए?","a":"<p>हाँ, यह मुफ़्त है और किसी अकाउंट की ज़रूरत नहीं है। सब कुछ आपके ब्राउज़र में चलता है।</p>"}]},{"s":"इस्तेमाल कैसे करें","items":[{"q":"एक पाठ कैसे चलता है?","a":"<p>हर पाठ के तीन हिस्से हैं:</p><p><b>कॉन्सेप्ट:</b> एक छोटी व्याख्या और यह टिप कि असली Orange में यह कैसा दिखता है।<br><b>मिशन:</b> कैनवास पर पूरे करने वाले चरण। वर्कफ़्लो सही चलने पर ये अपने आप पूरे हो जाते हैं।<br><b>जाँचें:</b> आपने डेटा में जो देखा, उस पर एक प्रश्न।</p><p>मिशन और प्रश्न दोनों पूरे होने पर पाठ पूरा होता है।</p>"},{"q":"विजेट कैसे जोड़ें और कनेक्ट करें?","a":"<p>कैनवास के ऊपर पैलेट में किसी आइटम पर टैप करके विजेट जोड़ें। अगर कोई विजेट चुना हुआ है, तो नया विजेट सीधे उससे जुड़कर आता है।</p><p>दो विजेट जोड़ने के लिए, एक विजेट की दाईं बिंदी से दूसरे विजेट तक खींचें। फ़ोन पर बिंदी पर टैप करें, फिर लक्ष्य विजेट पर। डेटा हमेशा दाएँ (आउटपुट) से बाएँ (इनपुट) की ओर जाता है।</p><p>कनेक्शन हटाने के लिए उसके लेबल पर × का उपयोग करें। विजेट हटाने के लिए उसे चुनें और आउटपुट पैनल का बटन इस्तेमाल करें।</p>"},{"q":"परिणाम कहाँ दिखते हैं?","a":"<p>किसी भी विजेट पर टैप करें। उसके पैरामीटर और आउटपुट (तालिका, चार्ट, मीट्रिक या नियम) आउटपुट पैनल में दिखते हैं। फ़ोन पर आउटपुट टैब खोलें।</p>"},{"q":"Data Lab क्या है?","a":"<p>बिना मिशन वाला एक खुला वर्कस्पेस, जहाँ आप सभी विजेट और डेटासेट से कोई भी वर्कफ़्लो बना सकते हैं। शुरू करने के लिए इसमें तैयार वर्कफ़्लो भी हैं। <a href=\"#lab\" data-route=\"lab\">Data Lab खोलें</a>।</p>"},{"q":"कौन से डेटासेट इस्तेमाल होते हैं?","a":"<p><b>आइरिस</b> (150 फूल, तीन प्रजातियाँ) और <b>वाइन</b> (178 वाइन, तीन किस्में) क्लासिक असली डेटासेट हैं। <b>ग्राहक</b> खाली मानों वाला एक काल्पनिक डेटासेट है, जो डेटा सफ़ाई और ग्राहक छोड़ने के अनुमान का अभ्यास करने के लिए बनाया गया है।</p>"},{"q":"क्या परिणाम असली हैं?","a":"<p>हाँ। मॉडल, क्रॉस-वैलिडेशन और मीट्रिक सचमुच आपके ब्राउज़र में डेटा पर गणना किए जाते हैं। यहाँ कुछ एल्गोरिदम सरल किए गए हैं, इसलिए संख्याएँ Orange से थोड़ी अलग हो सकती हैं।</p>"}]},{"s":"प्रगति और तकनीकी प्रश्न","items":[{"q":"मेरी प्रगति कहाँ सहेजी जाती है?","a":"<p>आपके अपने ब्राउज़र में (लोकल स्टोरेज)। कुछ भी किसी सर्वर पर नहीं भेजा जाता। अगर आप साइट का डेटा मिटा दें या ब्राउज़र या डिवाइस बदलें, तो प्रगति फिर से शुरू होती है।</p>"},{"q":"क्या यह ऑफ़लाइन चलता है?","a":"<p>हाँ। DS.Micro एक अकेली, पूरी तरह स्वतंत्र HTML फ़ाइल है: डेटा, भाषाएँ और फ़ॉन्ट उसी के अंदर हैं। एक बार लोड होने के बाद यह बिना इंटरनेट के चलता है।</p>"},{"q":"भाषा कैसे बदलें?","a":"<p>पेज के ऊपर दिए भाषा चयनकर्ता का उपयोग करें। उपलब्ध भाषाएँ: English, Español, Português, 中文, हिन्दी और 한국어।</p>"},{"q":"असली Orange पर कैसे जाएँ?","a":"<p><a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a> से Orange मुफ़्त डाउनलोड करें और पाठों के वर्कफ़्लो फिर से बनाएँ। विजेट के नाम वही हैं, और हर पाठ की \"Orange में\" टिप अंतर बताती है।</p>"}]}],"gloss":{"dataset":{"t":"डेटासेट","d":"डेटा की एक तालिका: हर पंक्ति एक उदाहरण है (एक फूल, एक वाइन, एक ग्राहक) और हर कॉलम एक वेरिएबल।"},"widget":{"t":"विजेट","d":"वर्कफ़्लो का एक हिस्सा जो एक ही काम करता है, जैसे डेटा लोड करना, चार्ट बनाना या मॉडल ट्रेन करना।"},"workflow":{"t":"वर्कफ़्लो","d":"जुड़े हुए विजेट की एक श्रृंखला। डेटा एक विजेट के आउटपुट (दाएँ) से अगले के इनपुट (बाएँ) तक जाता है।"},"variable":{"t":"वेरिएबल (फ़ीचर)","d":"डेटासेट का एक कॉलम जो उदाहरणों का वर्णन करता है, जैसे पंखुड़ी की लंबाई। मॉडल वेरिएबल से सीखते हैं।"},"numeric":{"t":"संख्यात्मक वेरिएबल","d":"ऐसा वेरिएबल जिसके मान मापे और तुलना किए जा सक \"{t}\"에 대한 정보 이득","v.gain":"이득","v.passes":"유지","v.cv":"층화 교차 검증 · {k} 폴드 · {n}행","v.train":"자체 학습 데이터로 테스트 · {n}행","v.trainWarn":"주의: 모델이 학습한 것과 같은 데이터로 평가되고 있습니다. 성능이 과대평가됩니다.","v.model":"모델","v.prec":"정밀도","v.rec":"재현율","v.best":"최고","v.weighted":"F1, 정밀도, 재현율은 Orange와 같이 클래스별 가중 평균입니다.","v.cmHead":"{m} · 행: 실제, 열: 예측","v.cmCorner":"실제 \\ 예측","v.cmNote":"대각선의 초록색: 정답. 대각선 밖의 빨간색: 혼동.","v.rocHead":"양성 클래스: {c} · 양성 {p}개, 음성 {n}개","v.fpr":"위양성률","v.tpr":"진양성률","v.rocNote":"점선 대각선은 무작위로 추측하는 모델입니다(AUC 0.5). 곡선이 왼쪽 위 모서리에 가까울수록 좋습니다.","v.clusters":"군집","v.silMean":"평균 실루엣","v.silByK":"k별 실루엣","v.silhouette":"실루엣","v.sizes":"군집 크기","l.track":"트랙 {i} · {t}","l.inOrange":"Orange에서는","l.mission":"미션","l.check":"확인","l.notYet":"아직 아닙니다. 캔버스의 출력을 다시 보고 다른 답을 골라 보세요.","l.doneTitle":"레슨 완료","l.doneSub":"워크플로를 자유롭게 탐색하거나 다음 레슨으로 넘어가세요.","l.needQuiz":"미션 완료. 이제 질문에 답하세요.","l.needMission":"정답입니다. 이제 캔버스에서 미션을 마치세요.","l.prev":"← 이전","l.reset":"워크플로 다시 시작","l.next":"다음 →","free.meta":"열린 작업 공간","free.h":"Data Lab","free.p":"{n}개의 위젯으로 어떤 워크플로든 만들어 보세요. 준비된 워크플로나 빈 캔버스에서 시작하세요.","free.recipes":"준비된 워크플로","free.datasets":"데이터셋","free.dsMeta":"{r}행 · {c}열 · 목표: {t}","seo.title":"DS.Micro · 시각적 워크플로로 배우는 데이터 과학","seo.desc":"브라우저에서 Orange Data Mining 스타일의 워크플로를 만들며 데이터 과학을 배우는 무료 마이크로 레슨: 실제 데이터로 데이터 정리, 시각화, kNN, 의사결정나무, 랜덤 포레스트, ROC 곡선, k-Means를 익힙니다.","nav.faq":"FAQ","nav.gloss":"용어집","faq.h":"자주 묻는 질문","faq.p":"DS.Micro의 목적, 사용 방법, 실제 Orange와의 관계를 정리했습니다. 찾는 용어가 있다면 <a href=\"#glossary\" data-route=\"glossary\">용어집</a>을 보세요.","gloss.h":"용어집","gloss.p":"레슨에서 다루는 데이터 과학 용어 {n}개를 쉬운 말로 설명합니다. 각 용어는 그 용어가 나오는 레슨으로 연결됩니다.","gloss.search":"용어 검색","gloss.count":"전체 {t}개 중 {n}개","gloss.empty":"\"{q}\"와(과) 일치하는 용어가 없습니다."},"w":{"file":"데이터셋을 불러옵니다. 거의 모든 워크플로의 출발점입니다.","table":"데이터를 한 행씩 보여 줍니다. 결측값은 \"?\"로 표시됩니다.","stats":"각 열의 요약: 유형, 중심, 퍼짐, 결측값.","select":"워크플로에서 다음으로 넘어갈 변수를 고릅니다. 목표 변수는 항상 넘어갑니다.","impute":"\"?\"를 채우거나(수치는 평균, 범주는 최빈값) 불완전한 행을 삭제합니다.","normalize":"수치형 변수를 같은 척도로 정규화합니다.","rank":"목표에 대한 정보 이득으로 변수를 정렬하고 상위 n개만 통과시킵니다.","dist":"한 변수의 히스토그램을 목표 클래스별로 나누어 보여 줍니다.","scatter":"각 점은 데이터의 한 행입니다. 두 수치 축과 범주별 색상.","knn":"가장 가까운 k개 이웃의 투표로 분류합니다.","tree":"\"만약 … 이면 …\" 형태의 규칙을 학습합니다. 데이터를 연결하면 트리를 볼 수 있습니다.","nb":"변수들이 서로 독립이라고 가정하고, 클래스별 각 변수의 확률을 사용합니다.","logreg":"각 클래스의 확률을 추정하는 선형 모델입니다. 데이터를 연결하면 계수를 볼 수 있습니다.","rf":"서로 다른 샘플로 학습한 여러 트리가 평균으로 결정합니다.","test":"층화 교차 검증 또는 학습 데이터 자체로 모델을 평가합니다.","confusion":"실제 클래스와 예측 클래스를 교차해, 모델이 어디서 맞히고 어디서 혼동하는지 보여 줍니다.","roc":"대상 클래스에 대한 각 모델의 ROC 곡선: 모든 임계값에서 진양성과 오경보를 비교합니다.","kmeans":"목표를 보지 않고 비슷한 행을 k개 군집으로 묶습니다. Cluster 열을 추가합니다."},"ds":{"iris":{"label":"붓꽃","desc":"붓꽃 세 종의 꽃 150송이에 대한 측정값 (Fisher, 1936)."},"wine":{"label":"와인","desc":"이탈리아 세 품종의 와인 178종에 대한 화학 분석 (UCI)."},"customers":{"label":"고객 (가상)","desc":"어떤 앱의 가상 구독자 220명. 일부 필드가 비어 있습니다. 누가 이탈할지 예측합니다."}},"tracks":[{"title":"첫걸음","desc":"위젯, 연결, 그리고 데이터셋 안에 무엇이 있는지."},{"title":"시각적 탐색","desc":"모델링 전에 먼저 보기: 산점도와 변수 선택."},{"title":"데이터 준비","desc":"실제 데이터는 지저분하고 척도도 제각각입니다."},{"title":"분류","desc":"클래스를 예측하는 모델을 학습, 평가, 비교합니다."},{"title":"군집화","desc":"레이블 없이 구조 찾기: k-Means와 실루엣."},{"title":"고급 머신러닝","desc":"선형 모델, 앙상블, 과적합, ROC 곡선, 특성 선택."}],"recipes":["3개 모델로 붓꽃 분류","고객 데이터 정리 및 평가","와인 군집화 및 시각화","이탈: 로지스틱 vs 랜덤 포레스트와 ROC"],"lessons":{"l1":{"title":"첫 번째 워크플로","concept":"<p>Orange에서 분석은 하나의 <b>워크플로</b>입니다. 각 원은 한 가지 일만 하는 <b>위젯</b>이고, 각 선은 데이터를 한 위젯에서 다음 위젯으로 옮깁니다.</p><p>데이터는 <b>오른쪽</b> 포트로 나가고 <b>왼쪽</b> 포트로 들어옵니다. 연결하려면 위젯의 오른쪽 점에서 다른 위젯으로 끌어다 놓으세요. 휴대폰에서는 점을 탭한 뒤 대상 위젯을 탭하세요.</p>","tip":"Orange의 위젯도 출력은 오른쪽, 입력은 왼쪽에 있습니다. 점선은 아직 데이터가 흐르지 않는다는 뜻입니다.","goals":["<code>Data Table</code>을 추가하세요 (팔레트 › 데이터).","<code>File</code>의 출력을 <code>Data Table</code>의 입력에 연결하세요.","<code>Data Table</code>을 탭해 출력에서 150송이의 꽃을 확인하세요."],"quiz":{"q":"두 위젯 사이의 선은 무엇을 나타낼까요?","o":["한 위젯에서 다른 위젯으로 흐르는 데이터","위젯이 만들어진 순서","디스크에 저장된 파일 사본"],"why":"선은 채널입니다. 한 위젯에서 나온 모든 것이 다음 위젯에 도착하고, 앞쪽에서 무언가 바뀌면 다시 계산됩니다."}},"l2":{"title":"변수의 유형","concept":"<p>각 열은 하나의 <b>변수</b>입니다. <b>수치형</b> 변수에는 측정값(꽃잎 길이, cm)이 있고, <b>범주형</b> 변수에는 레이블(꽃의 품종)이 있습니다.</p><p><b>목표 변수</b>(target)는 우리가 예측하려는 변수입니다. 모델은 나머지 열과 목표 사이의 관계를 학습합니다.</p>","tip":"Orange에서 목표 변수는 Data Table에 \"target\" 역할과 강조 색상으로 표시됩니다. 역할은 File 위젯이나 Edit Domain에서 바꿀 수 있습니다.","goals":["<code>File</code>에 <code>Feature Statistics</code>를 연결하세요.","<code>Feature Statistics</code>를 열어 각 열의 평균과 퍼짐을 비교하세요."],"quiz":{"q":"Iris 데이터셋에서 목표 변수는 어느 열일까요?","o":["iris","petal length","sepal width"],"why":"\"iris\" 열에는 품종이 들어 있습니다. 분류기가 측정값으로 예측하려는 것이 바로 이 열입니다."}},"l3":{"title":"분포","concept":"<p><b>히스토그램</b>은 값을 구간으로 나누고 각 구간에 몇 개의 행이 들어가는지 셉니다. 막대를 클래스별로 색칠하면 변수가 품종을 잘 구분하는지 볼 수 있습니다.</p>","tip":"Orange의 Distributions 위젯은 목표에 따라 막대를 자동으로 색칠하고, 클래스를 쌓거나 겹쳐서 보여 줄 수 있습니다.","goals":["<code>File</code>에 <code>Distributions</code>를 연결하세요.","출력에서 변수 <code>petal length</code>를 선택하세요."],"quiz":{"q":"petal length를 보면, 어느 품종이 다른 품종과 뚜렷이 떨어져 있나요?","o":["Iris-setosa","Iris-versicolor","Iris-virginica"],"why":"setosa의 꽃잎은 약 2cm까지이고, 나머지 두 품종은 그보다 훨씬 뒤에서 시작합니다. 이런 변수는 분류에 아주 좋습니다."}},"l4":{"title":"산점도","concept":"<p><b>산점도</b>에서 각 점은 데이터의 한 행입니다. 두 수치 축이 두 변수의 관계를 보여 주고, 색상이 클래스를 보여 줍니다.</p><p>색상이 서로 떨어진 섬을 이루면 모델이 쉽게 학습할 수 있습니다.</p>","tip":"Orange의 Scatter Plot에는 \"Find Informative Projections\" 버튼이 있어, 클래스를 가장 잘 구분하는 축 조합을 자동으로 찾아 줍니다.","goals":["<code>File</code>에 <code>Scatter Plot</code>을 연결하세요.","x축 = <code>petal length</code>, y축 = <code>petal width</code>.","색상 = <code>iris</code>."],"quiz":{"q":"꽃잎 산점도는 무엇을 보여 주나요?","o":["품종들이 거의 분리된 그룹을 이룬다","점들이 무작위로 흩어져 있다","데이터에 품종이 두 개뿐이다"],"why":"setosa는 고립된 섬을 이루고, versicolor와 virginica는 좁은 띠에서만 맞닿습니다. 그래서 Iris에서는 분류기의 정확도가 아주 높습니다."}},"l5":{"title":"열 고르기","concept":"<p>모든 변수가 도움이 되지는 않습니다. <b>Select Columns</b>는 고른 변수만 통과시킵니다. 목표 변수는 항상 통과합니다.</p><p>열이 적을수록 그래프와 모델을 해석하기 쉬워집니다.</p>","tip":"실제 Orange의 Select Columns에는 Features, Target, Metas 세 상자가 있습니다. 열을 Metas로 옮기면 삭제하지 않고 모델에서만 뺄 수 있습니다.","goals":["<code>File</code>에 <code>Select Columns</code>를 연결하세요.","<code>petal length</code>와 <code>petal width</code>만 남기세요.","<code>Select Columns</code> 뒤에 <code>Scatter Plot</code>을 연결하세요."],"quiz":{"q":"모델링 전에 왜 열을 제거할까요?","o":["관련 있는 것에 집중하고 모델을 단순하게 하려고","Orange는 열을 두 개만 받기 때문에","행의 수를 늘리려고"],"why":"관련 없는 변수는 잡음을 더합니다. 좋은 변수 몇 개만 쓰면 모델이 더 빠르고, 안정적이고, 설명하기 쉬워집니다."}},"l6":{"title":"결측값","concept":"<p>실제 스프레드시트에는 빈칸이 있습니다. Orange는 결측값을 <code>?</code>로 표시합니다. 많은 모델이 결측값을 처리하지 못합니다.</p><p><b>Impute</b>는 빈칸을 평균(수치)이나 최빈값(범주)으로 채웁니다. 다른 방법은 불완전한 행을 삭제하는 것입니다.</p>","tip":"Orange의 Impute는 모델로 결측값을 예측하거나, \"결측\"을 하나의 독립된 값으로 다룰 수도 있습니다.","goals":["<code>Data Table</code>을 열고 income과 app hours에서 <code>?</code>를 찾으세요.","<code>File</code> 뒤에 <code>Impute</code>를 추가하세요.","<code>Impute</code> 뒤에 <code>Data Table</code>을 연결하고 결측값이 0개인지 확인하세요."],"quiz":{"q":"평균 대체는 무엇을 하나요?","o":["각 \"?\"를 그 열의 평균으로 바꾼다","열 전체를 삭제한다","바로 위 행의 값을 복사한다"],"why":"간단하고 모든 행을 유지합니다. 대신 열의 변동이 조금 줄어드니, 원래 \"?\"가 몇 개였는지 확인해 보세요."}},"l7":{"title":"정규화","concept":"<p>와인 데이터에서 <code>Proline</code>은 278에서 1680까지인 반면 <code>Hue</code>는 1 근처에 있습니다. <b>거리</b>를 재는 방법에서는 값이 큰 열이 모든 것을 좌우합니다.</p><p><b>표준화</b>하면 각 열의 평균이 0, 표준편차가 1이 됩니다.</p>","tip":"Orange에서 정규화는 Preprocess 위젯의 \"Normalize Features\" 옵션에 있습니다. Orange의 kNN과 k-Means도 기본적으로 정규화합니다.","goals":["와인 <code>File</code>에 <code>Preprocess</code>를 연결하세요.","<code>Preprocess</code> 뒤에 <code>Feature Statistics</code>를 연결하세요.","\"표준화\"를 선택하고 <code>Proline</code>의 평균이 0인지 확인하세요."],"quiz":{"q":"kNN 전에 왜 정규화할까요?","o":["kNN은 거리를 재는데, Proline(수백 단위)이 Hue(약 1)를 압도하기 때문에","kNN은 음수를 받지 않기 때문에","이웃의 수가 늘어나기 때문에"],"why":"정규화하지 않으면 두 와인 사이의 거리는 거의 Proline의 차이로만 결정됩니다. 다른 변수는 사실상 사라집니다."}},"l8":{"title":"첫 번째 모델: kNN","concept":"<p><b>분류기</b>는 레이블이 있는 예시에서 배우고 새 예시의 레이블을 예측합니다. <b>kNN</b>은 가장 비슷한 k개의 예시를 보고 투표합니다.</p><p>모델 위젯은 데이터가 아니라 <b>모델</b>을 출력합니다. 학습과 측정은 <b>Test and Score</b>가 합니다. 데이터와 하나 이상의 모델을 받습니다.</p>","tip":"Orange의 Test and Score에는 Data와 Learner 두 입력이 있습니다. 하나의 Test and Score가 여러 learner를 동시에 받을 수 있습니다.","goals":["<code>File</code>을 <code>Test and Score</code>에 연결하세요.","같은 <code>Test and Score</code>에 <code>kNN</code>을 연결하세요.","정확도(CA) 0.90 이상에 도달하세요."],"quiz":{"q":"5-폴드 교차 검증이란 무엇일까요?","o":["5번 학습하면서 매번 데이터의 다른 부분으로 테스트하는 것","데이터의 5%로 학습하는 것","확인을 위해 같은 테스트를 5번 반복하는 것"],"why":"각 행은 학습 때 그 행을 보지 않은 모델로 정확히 한 번 테스트됩니다. 그래서 성능을 정직하게 추정할 수 있습니다."}},"l9":{"title":"의사결정나무","concept":"<p><b>의사결정나무</b>는 차례로 질문합니다: \"Proline &gt; 755?\", \"Flavanoids ≤ 1.4?\". 각 잎 노드가 하나의 클래스를 줍니다.</p><p>규칙처럼 읽을 수 있는 몇 안 되는 모델입니다. <b>깊이</b>는 연속으로 몇 번까지 질문할 수 있는지를 정합니다.</p>","tip":"Orange에서 Tree의 Model 출력을 Tree Viewer에 연결하면 트리가 그림으로 그려집니다. 여기서는 규칙이 Tree의 출력에 바로 나타납니다.","goals":["와인 <code>File</code>을 <code>Tree</code>에 연결하고 출력에서 규칙을 읽으세요.","와인 데이터로 <code>Test and Score</code>에서 <code>Tree</code>를 평가하세요.","트리의 CA가 0.88 이상이 될 때까지 깊이를 조정하세요."],"quiz":{"q":"트리의 깊이를 크게 늘리면 대개…","o":["학습 데이터를 외워서 새 데이터에서 더 많이 틀린다(과적합)","테스트 정확도가 항상 좋아진다","모델을 읽기 쉬워진다"],"why":"깊은 트리는 학습 데이터의 드문 사례를 위한 규칙까지 만듭니다. 교차 검증은 그것이 언제부터 결과를 나쁘게 하는지 보여 줍니다."}},"l10":{"title":"모델 비교","concept":"<p>모든 문제에서 최고인 모델은 없습니다. 여러 모델을 같은 <b>Test and Score</b>에 넣고 같은 폴드로 비교하는 것이 일반적입니다.</p><p>고객 데이터에는 <code>?</code>가 있으므로 평가 전에 <b>Impute</b>가 필요합니다.</p>","tip":"Orange의 Test and Score에는 \"Compare models\" 표가 있어, 한 모델이 다른 모델보다 정말로 나을 확률을 추정합니다.","goals":["<code>File → Impute → Test and Score</code>를 만드세요.","<code>Test and Score</code>에 서로 다른 모델을 두 개 이상 연결하세요."],"quiz":{"q":"정답 비율을 보여 주는 지표는 무엇일까요?","o":["CA (Classification Accuracy)","재현율","폴드 수"],"why":"CA = 정답 ÷ 전체. 클래스가 불균형할 때(이탈 고객이 적을 때)는 F1, 정밀도, 재현율도 함께 보세요."}},"l11":{"title":"혼동 행렬","concept":"<p>정확도는 모델이 <b>어디서</b> 틀리는지 감춥니다. <b>혼동 행렬</b>은 실제 클래스(행)와 예측 클래스(열)를 교차합니다. 대각선이 정답입니다.</p><p>고객 유지 팀에게는 이탈을 놓치는 것이 오경보보다 대개 더 비쌉니다.</p>","tip":"Orange에서 Confusion Matrix의 셀을 선택하면 해당 행이 다음 위젯으로 전달됩니다. 모델이 틀린 사례를 빠르게 조사하는 방법입니다.","goals":["<code>Test and Score</code>의 출력에 <code>Confusion Matrix</code>를 연결하세요.","행렬을 열고 모델이 예측하지 못한 이탈 고객을 찾으세요."],"quiz":{"q":"이탈한 고객인데 모델이 \"no\"라고 예측했다면…","o":["위음성 (\"yes\" 클래스 기준)","진양성","위양성"],"why":"실제는 \"yes\", 예측은 \"no\"입니다. \"yes\" 행, \"no\" 열, 즉 대각선 밖에 나타납니다."}},"l12":{"title":"k-Means","concept":"<p><b>비지도</b> 학습은 목표를 사용하지 않습니다. <b>k-Means</b>는 데이터를 가까운 점들끼리 k개 그룹으로 나누고 <code>Cluster</code> 열을 만듭니다.</p><p>그다음 찾은 군집을 실제 품종과 비교할 수 있습니다.</p>","tip":"Orange에서 k-Means는 Cluster를 메타 속성으로 추가합니다. 그 뒤의 Scatter Plot에서 바로 Cluster로 색칠할 수 있습니다.","goals":["붓꽃 <code>File</code>에 k = 3인 <code>k-Means</code>를 연결하세요.","<code>k-Means</code> 뒤에 <code>Scatter Plot</code>을 연결하세요.","그래프를 <code>Cluster</code>로, 이어서 <code>iris</code>로 색칠해 비교하세요."],"quiz":{"q":"k-Means는 그룹을 만들 때 \"iris\" 열을 사용할까요?","o":["아니요. 목표를 무시하고 측정값만 봅니다","예, 품종마다 한 그룹","k가 품종 수와 같을 때만"],"why":"군집은 점들의 기하학적 배치에서만 나옵니다. 군집이 품종과 잘 맞는 것은 규칙이 아니라 발견입니다."}},"l13":{"title":"군집은 몇 개? 실루엣","concept":"<p>레이블이 없을 때 k는 어떻게 고를까요? <b>실루엣</b>은 각 점이 이웃 그룹보다 자기 그룹에 얼마나 더 가까운지 측정합니다. 값은 −1에서 1 사이입니다.</p><p>여러 k를 시도하고 평균 실루엣이 가장 높은 것을 고르세요.</p>","tip":"Orange의 k-Means에는 \"From 2 to 8\" 옵션이 있어 모든 k를 실행하고 각각의 실루엣을 목록으로 보여 줍니다.","goals":["와인 데이터에 <code>k-Means</code>를 연결하고 \"2~8 시도\"를 사용하세요.","실루엣이 가장 높은 k로 고정 모드로 돌아가세요."],"quiz":{"q":"평균 실루엣이 1에 가깝다는 것은…","o":["점들이 자기 그룹 안쪽에 잘 있고 다른 그룹과 멀다","그룹들이 겹친다","k가 너무 크다"],"why":"0에 가까우면 그룹이 맞닿아 있고, 음수면 잘못된 그룹에 속한 점이 있습니다. 하나의 단서일 뿐이며, 최종 판단은 도메인 지식이 합니다."}},"l14":{"title":"로지스틱 회귀","concept":"<p>이름과 달리 <b>로지스틱 회귀</b>는 분류기입니다. 변수에 가중치(<b>계수</b>)를 곱해 더하고, 그 결과를 0과 1 사이의 확률로 바꿉니다.</p><p>파라미터 <b>C</b>는 정규화를 조절합니다. C가 작으면 계수가 0 근처에 머물고, C가 크면 모델이 데이터를 더 가깝게 따라갑니다.</p>","tip":"Orange에서는 Logistic Regression의 Coefficients 출력을 Data Table에 연결해 가중치를 볼 수 있습니다. 기본 정규화는 C = 1인 Ridge(L2)로, 여기와 같습니다.","goals":["<code>Impute</code> 뒤에 <code>Logistic Regression</code>과 <code>kNN</code>을 넣은 <code>Test and Score</code>를 만드세요.","CA에서 로지스틱 회귀가 kNN보다 높은지 확인하세요.","<code>Impute</code>를 <code>Logistic Regression</code>의 입력에도 연결하고 계수를 여세요."],"quiz":{"q":"\"support tickets\"의 계수가 양수입니다. 무엇을 뜻할까요?","o":["문의 건수가 많을수록 예측 이탈 확률이 높아진다","문의 건수는 모델에 영향을 주지 않는다","문의가 많은 고객일수록 덜 이탈한다"],"why":"부호는 방향을, 크기는 강도를 나타냅니다. 표준화된 변수에서는 가중치끼리 비교할 수 있습니다."}},"l15":{"title":"랜덤 포레스트","concept":"<p>트리 하나는 불안정합니다. 몇 행만 바뀌어도 규칙이 바뀝니다. <b>랜덤 포레스트</b>는 많은 트리를 학습시키는데, 각 트리는 <b>복원 추출한 샘플</b>로 학습하고 질문마다 무작위로 고른 일부 변수만 봅니다.</p><p>최종 예측은 트리들의 평균입니다. 이것이 <b>앙상블</b>입니다.</p>","tip":"Orange의 Random Forest는 기본으로 트리 10개를 쓰고, 분할마다 √(변수 수)개의 후보를 무작위로 고릅니다. 여기와 같습니다.","goals":["와인 데이터로 <code>Tree</code>와 <code>Random Forest</code>를 같은 <code>Test and Score</code>에 넣으세요.","포레스트의 CA가 트리보다 높은지 확인하세요.","포레스트를 트리 30개 이상으로 늘리세요."],"quiz":{"q":"포레스트가 보통 트리 하나보다 나은 이유는?","o":["서로 다른 많은 트리의 평균이 분산을 줄이기 때문에","포레스트의 각 트리가 더 깊기 때문에","포레스트가 실제보다 많은 행을 쓰기 때문에"],"why":"각 트리는 서로 다른 방식으로 틀립니다. 평균을 내면 개별 오류가 상쇄되고 안정적인 패턴이 남습니다."}},"l16":{"title":"과적합 직접 보기","concept":"<p>학습 데이터를 외운 모델은 좋아 보이지만 새 데이터에서는 실패합니다. 이것이 <b>과적합</b>입니다.</p><p>직접 보려면 깊은 트리를 <b>자체 학습 데이터로</b> 평가한 뒤 <b>교차 검증</b>으로 평가하세요. 두 숫자의 차이가 모델이 외운 정도입니다.</p>","tip":"Orange의 Test and Score에 있는 \"Test on train data\" 옵션은 바로 이런 비교를 위해 있습니다. 이 숫자로 모델을 고르면 안 됩니다.","goals":["<code>Test and Score</code>에서 깊이 8인 트리로 \"학습 데이터로 테스트\"를 선택하세요. CA를 적어 두세요.","5-폴드 교차 검증으로 돌아가 CA가 떨어지는 것을 확인하세요.","교차 검증에서 깊이 8인 트리를 넘어설 때까지 깊이를 줄이세요."],"quiz":{"q":"깊은 트리가 학습 데이터에서는 CA가 높고 교차 검증에서는 낮았습니다. 이것은…","o":["과적합: 학습 사례를 외웠다","교차 검증이 고장 났다","과소적합: 모델이 너무 단순하다"],"why":"과소적합은 양쪽 모두에서 성능이 나쁜 것으로 나타납니다. 과적합은 학습 데이터와 보지 못한 데이터 사이의 차이입니다."}},"l17":{"title":"ROC 곡선과 AUC","concept":"<p>확률형 분류기는 \"이탈 확률 73%\"라고 말합니다. 어디서 끊어야 할까요? 각 <b>임계값</b>은 적중과 오경보를 맞바꿉니다.</p><p><b>ROC 곡선</b>은 모든 임계값을 한 번에 보여 줍니다. <b>AUC</b>는 곡선 아래 면적으로, 무작위로 뽑은 양성에 무작위 음성보다 높은 점수를 줄 확률입니다.</p>","tip":"Orange의 ROC Analysis는 비용 곡선도 그리고, 오류 유형별 비용을 고려해 최적 임계값을 찾습니다.","goals":["<code>Impute</code> 뒤의 <code>Test and Score</code>에서 <code>Logistic Regression</code>과 <code>Naive Bayes</code>를 평가하세요.","<code>Test and Score</code>에 <code>ROC Analysis</code>를 연결하고 대상 클래스를 <code>yes</code>로 하세요.","곡선을 열고 AUC를 비교하세요."],"quiz":{"q":"AUC = 0.5인 모델은…","o":["동전 던지기와 같다: 양성을 음성보다 위에 두지 못한다","절반의 경우에 완벽하다","항상 CA 50%보다 낫다"],"why":"AUC는 선택한 임계값과 무관합니다. 0.5는 대각선, 1은 완벽한 순위입니다. 클래스가 불균형할 때 유용합니다."}},"l18":{"title":"Rank로 특성 선택","concept":"<p><b>정보 이득</b>은 어떤 변수의 값을 알 때 목표에 대한 불확실성이 얼마나 줄어드는지를 잽니다.</p><p><b>Rank</b>는 이 값으로 변수를 정렬하고 상위 n개만 통과시킵니다. 때로는 몇 개의 변수만으로도 거의 같은 성능이 나옵니다.</p>","tip":"Orange의 Rank는 여러 지표(정보 이득, Gini, ANOVA, ReliefF)를 한 번에 계산하고, 어느 지표로 정렬할지 고를 수 있습니다.","goals":["와인 <code>File</code>에 <code>Rank</code>를 연결하고 어떤 변수가 1위인지 보세요.","<code>Rank</code>를 <code>kNN</code>이 있는 <code>Test and Score</code>에 연결하세요.","변수를 최대 3개만 써서 CA 0.93 이상에 도달하세요."],"quiz":{"q":"와인 데이터에서 정보 이득이 가장 높은 변수는?","o":["Flavanoids","Malic Acid","Hue"],"why":"Flavanoids는 세 품종을 잘 구분합니다. Malic Acid는 가장 도움이 적어서 Rank가 마지막에 둡니다."}}},"faq":[{"s":"프로젝트 소개","items":[{"q":"DS.Micro는 무엇인가요?","a":"<p>무료 데이터 과학 마이크로러닝 플랫폼입니다. 각 레슨은 3~5분 걸립니다. 개념 하나를 읽고, 캔버스에서 작은 위젯 워크플로를 만들고, 확인 질문에 답합니다.</p><p>설치나 코딩 없이, 직접 해 보면서 누구나 데이터 과학의 첫걸음을 뗄 수 있도록 돕는 것이 목표입니다.</p>"},{"q":"누구를 위한 것인가요?","a":"<p>데이터 분석과 머신러닝이 어떻게 작동하는지 이해하고 싶은 학생, 교사, 실무자를 위한 것입니다. 트랙은 입문(데이터셋이란 무엇인가)부터 고급(앙상블, 과적합, ROC 곡선)까지 이어집니다.</p>"},{"q":"Orange Data Mining과는 어떤 관계인가요?","a":"<p>DS.Micro는 류블랴나 대학교의 시각적 도구인 <a href=\"https://orangedatamining.com\" target=\"_blank\" rel=\"noopener\">Orange Data Mining</a>에서 영감을 받은 독립 교육 프로젝트입니다. 위젯의 이름과 논리가 Orange와 같아서 여기서 배운 것을 그대로 활용할 수 있습니다.</p><p>여기의 위젯은 단순화된 시뮬레이션입니다. 실제 프로젝트에는 Orange를 사용하세요.</p>"},{"q":"무료인가요? 계정이 필요한가요?","a":"<p>무료이며 계정도 필요 없습니다. 모든 것이 브라우저에서 실행됩니다.</p>"}]},{"s":"사용 방법","items":[{"q":"레슨은 어떻게 진행되나요?","a":"<p>각 레슨은 세 부분으로 되어 있습니다.</p><p><b>개념:</b> 짧은 설명과, 실제 Orange에서 어떻게 보이는지에 대한 팁.<br><b>미션:</b> 캔버스에서 완료할 단계. 워크플로가 작동하면 자동으로 체크됩니다.<br><b>확인:</b> 데이터에서 본 내용에 대한 질문.</p><p>미션과 질문을 모두 마치면 레슨이 완료됩니다.</p>"},{"q":"위젯은 어떻게 추가하고 연결하나요?","a":"<p>캔버스 위의 팔레트에서 항목을 탭하면 위젯이 추가됩니다. 위젯이 선택된 상태라면 새 위젯이 그 위젯에 바로 연결됩니다.</p><p>두 위젯을 연결하려면 한 위젯 오른쪽의 점에서 다른 위젯으로 끌어다 놓으세요. 휴대폰에서는 점을 탭한 뒤 대상 위젯을 탭합니다. 데이터는 항상 오른쪽(출력)에서 왼쪽(입력)으로 흐릅니다.</p><p>연결을 지우려면 연결 라벨의 ×를 누르세요. 위젯을 지우려면 위젯을 선택하고 출력 패널의 버튼을 누르세요.</p>"},{"q":"결과는 어디서 보나요?","a":"<p>아무 위젯이나 탭하세요. 파라미터와 출력(표, 그래프, 지표, 규칙)이 출력 패널에 나타납니다. 휴대폰에서는 출력 탭을 여세요.</p>"},{"q":"Data Lab은 무엇인가요?","a":"<p>미션 없이 모든 위젯과 데이터셋으로 어떤 워크플로든 만들 수 있는 열린 작업 공간입니다. 시작용으로 준비된 워크플로도 있습니다. <a href=\"#lab\" data-route=\"lab\">Data Lab 열기</a>.</p>"},{"q":"어떤 데이터셋을 사용하나요?","a":"<p><b>붓꽃</b>(꽃 150송이, 세 품종)과 <b>와인</b>(와인 178종, 세 품종)은 고전적인 실제 데이터셋입니다. <b>고객</b>은 결측값이 있는 가상 데이터셋으로, 데이터 정리와 이탈 예측을 연습하기 위해 만들었습니다.</p>"},{"q":"결과는 실제로 계산된 것인가요?","a":"<p>네. 모델, 교차 검증, 지표 모두 브라우저에서 데이터로 실제로 계산됩니다. 일부 알고리즘이 단순화되어 있어 Orange와 수치가 약간 다를 수 있습니다.</p>"}]},{"s":"진행 상황과 기술 문의","items":[{"q":"진행 상황은 어디에 저장되나요?","a":"<p>사용자의 브라우저(로컬 저장소)에 저장됩니다. 어떤 서버로도 전송되지 않습니다. 사이트 데이터를 지우거나 브라우저나 기기를 바꾸면 진행 상황이 처음부터 시작됩니다.</p>"},{"q":"오프라인에서도 작동하나요?","a":"<p>네. DS.Micro는 하나의 독립된 HTML 파일이며, 데이터와 언어, 글꼴이 모두 그 안에 들어 있습니다. 한 번 불러오면 인터넷 없이 작동합니다.</p>"},{"q":"언어는 어떻게 바꾸나요?","a":"<p>페이지 위쪽의 언어 선택기를 사용하세요. 지원 언어: English, Español, Português, 中文, हिन्दी, 한국어.</p>"},{"q":"실제 Orange로는 어떻게 넘어가나요?","a":"<p><a href=\"https://orangedatamining.com/download/\" target=\"_blank\" rel=\"noopener\">orangedatamining.com</a>에서 Orange를 무료로 내려받아 레슨의 워크플로를 다시 만들어 보세요. 위젯 이름이 같고, 각 레슨의 \"Orange에서는\" 팁이 차이점을 알려 줍니다.</p>"}]}],"gloss":{"dataset":{"t":"데이터셋","d":"데이터 표. 각 행은 하나의 예시(꽃, 와인, 고객)이고 각 열은 하나의 변수입니다."},"widget":{"t":"위젯","d":"데이터 불러오기, 그래프 그리기, 모델 학습처럼 한 가지 일만 하는 워크플로의 구성 요소."},"workflow":{"t":"워크플로","d":"연결된 위젯들의 사슬. 데이터는 한 위젯의 출력(오른쪽)에서 다음 위젯의 입력(왼쪽)으로 흐릅니다."},"variable":{"t":"변수(특성)","d":"꽃잎 길이처럼 예시를 설명하는 데이터셋의 열. 모델은 변수에서 학습합니다."},"numeric":{"t":"수치형 변수","d":"소득이나 나이처럼 측정하고 비교할 수 있는 숫자 값을 갖는 변수."},"categorical":{"t":"범주형 변수","d":"요금제(basic, plus, premium)나 품종처럼 정해진 목록의 레이블 값을 갖는 변수."},"target":{"t":"목표 변수","d":"품종이나 고객 이탈 여부처럼 우리가 예측하려는 변수. 클래스라고도 합니다."},"meta":{"t":"메타 속성","d":"ID나 k-Means가 추가한 Cluster 열처럼 데이터와 함께 있지만 모델이 무시하는 열."},"histogram":{"t":"히스토그램","d":"값을 구간으로 나누고 각 구간에 속한 행의 수를 세는 그래프."},"scatter":{"t":"산점도","d":"각 행을 두 수치형 변수로 위치를 정한 점으로 나타내는 그래프. 색상으로 클래스를 표시할 수 있습니다."},"featsel":{"t":"특성 선택","d":"모델에 쓸 변수를 고르는 일. 정보가 되는 변수는 남기고 잡음은 버립니다."},"missing":{"t":"결측값","d":"값이 없는 셀. Orange는 \"?\"로 표시합니다. 많은 모델이 결측값을 처리하지 못합니다."},"imputation":{"t":"결측값 대체","d":"열의 평균이나 최빈값 등으로 결측값을 채우는 일."},"normalization":{"t":"정규화","d":"수치형 변수를 같은 척도로 맞추는 일. 표준화하면 각 열의 평균이 0, 표준편차가 1이 됩니다."},"classification":{"t":"분류","d":"꽃의 품종처럼 각 예시의 범주(클래스)를 예측하는 일."},"learner":{"t":"학습기(모델)","d":"레이블이 있는 예시에서 패턴을 배우고, 새 예시의 클래스를 예측하는 알고리즘."},"knn":{"t":"k-최근접 이웃(kNN)","d":"학습 데이터에서 가장 비슷한 k개 예시의 투표로 예시를 분류합니다."},"cv":{"t":"교차 검증","d":"데이터를 폴드로 나누고, 각 폴드를 나머지로 학습한 모델로 테스트하는 평가 방법."},"fold":{"t":"폴드","d":"교차 검증에서 데이터를 나눈 같은 크기의 부분 중 하나. 각 폴드는 한 번씩 테스트에 쓰입니다."},"stratified":{"t":"층화","d":"각 폴드가 전체 데이터셋과 같은 클래스 비율을 유지하도록 데이터를 나누는 방법."},"ca":{"t":"분류 정확도(CA)","d":"모델이 맞힌 예시의 비율: 정답 수 ÷ 전체."},"precision":{"t":"정밀도","d":"어떤 클래스로 예측한 예시 중 실제로 그 클래스인 비율. 정밀도가 높으면 오경보가 적습니다."},"recall":{"t":"재현율","d":"실제로 어떤 클래스인 예시 중 모델이 찾아낸 비율. 재현율이 높으면 놓치는 경우가 적습니다."},"f1":{"t":"F1 점수","d":"정밀도와 재현율의 조화 평균. 둘 다 높을 때만 높습니다."},"imbalance":{"t":"클래스 불균형","d":"이탈 고객처럼 한 클래스가 다른 클래스보다 훨씬 드문 경우. 이때는 정확도만으로 판단하면 오해할 수 있습니다."},"tree":{"t":"의사결정나무","d":"변수에 대해 예/아니요 질문을 차례로 하는 모델. 각 잎 노드가 클래스를 주며, 규칙처럼 읽을 수 있습니다."},"depth":{"t":"트리 깊이","d":"의사결정나무가 연속으로 할 수 있는 최대 질문 수. 깊을수록 세부를 더 맞추고 과적합되기 쉽습니다."},"nb":{"t":"나이브 베이즈","d":"변수들이 서로 독립이라고 가정하고 각 변수의 증거를 결합하는 확률형 분류기."},"confusion":{"t":"혼동 행렬","d":"실제 클래스(행)와 예측 클래스(열)를 교차한 표. 대각선이 정답입니다."},"fpfn":{"t":"위양성 / 위음성","d":"위양성은 오경보(예라고 예측했지만 실제는 아니요)이고, 위음성은 놓침(아니요라고 예측했지만 실제는 예)입니다."},"unsup":{"t":"비지도 학습","d":"목표 변수 없는 데이터에서 그룹 같은 구조를 찾는 학습."},"clustering":{"t":"군집화","d":"레이블을 쓰지 않고 비슷한 예시끼리 묶는 일."},"kmeans":{"t":"k-Means","d":"데이터를 k개 그룹으로 나누는 군집화 알고리즘. 각 그룹은 가까운 점들의 중심을 기준으로 만들어집니다."},"silhouette":{"t":"실루엣","d":"각 점이 가장 가까운 다른 군집에 비해 자기 군집에 얼마나 잘 맞는지를 −1에서 1 사이로 나타내는 점수."},"logreg":{"t":"로지스틱 회귀","d":"변수에 가중치를 주어 더한 값을 0과 1 사이의 확률로 바꾸는 선형 분류기."},"coefficient":{"t":"계수","d":"선형 모델이 변수에 부여하는 가중치. 부호는 영향의 방향을, 크기는 강도를 나타냅니다."},"regularization":{"t":"정규화(규제)","d":"과적합을 막기 위해 모델 계수를 작게 유지하는 벌점. 로지스틱 회귀에서는 C로 조절합니다."},"ensemble":{"t":"앙상블","d":"여러 모델의 예측을 합쳐 더 안정적인 결과를 얻는 모델."},"rf":{"t":"랜덤 포레스트","d":"의사결정나무의 앙상블. 각 트리는 부트스트랩 샘플과 무작위 변수 부분집합으로 학습하며, 평균으로 예측합니다."},"bootstrap":{"t":"부트스트랩 샘플","d":"원본과 같은 크기로 데이터에서 복원 추출한 샘플. 어떤 행은 반복되고 어떤 행은 빠집니다."},"overfitting":{"t":"과적합","d":"모델이 학습 데이터를 외워 새 데이터에서 성능이 크게 떨어지는 현상."},"underfitting":{"t":"과소적합","d":"모델이 너무 단순해 패턴을 잡지 못하고 학습 데이터에서도 성능이 나쁜 현상."},"traintest":{"t":"학습 데이터와 테스트 데이터","d":"학습 데이터는 모델을 맞추는 데 쓰고, 학습에서 본 적 없는 테스트 데이터는 모델을 정직하게 측정하는 데 씁니다."},"threshold":{"t":"결정 임계값","d":"확률형 분류기가 양성 클래스로 예측하는 확률 기준선."},"roc":{"t":"ROC 곡선","d":"모든 결정 임계값에서 진양성률과 위양성률을 비교해 보여 주는 곡선."},"auc":{"t":"AUC","d":"ROC 곡선 아래 면적. 무작위 양성에 무작위 음성보다 높은 점수를 줄 확률입니다. 0.5는 추측, 1은 완벽."},"infogain":{"t":"정보 이득","d":"어떤 변수의 값을 알면 목표에 대한 불확실성이 얼마나 줄어드는지. Rank가 변수를 정렬할 때 씁니다."}}}};
const LANGS=[['en','English','en-US'],['es','Español','es-ES'],['pt','Português','pt-BR'],['zh','中文','zh-CN'],['hi','हिन्दी','hi-IN'],['ko','한국어','ko-KR']];
/* arquivo único publicado (<html data-standalone>): o idioma vem de ?lang=, depois da preferência salva; padrão inglês */
const STANDALONE=document.documentElement.hasAttribute('data-standalone');
const urlLang=(()=>{try{return new URLSearchParams(location.search).get('lang')}catch(e){return null}})();
let LANG='en';if(urlLang&&I18N[urlLang])LANG=urlLang;else try{const l=localStorage.getItem('pomar.lang');if(l&&I18N[l])LANG=l}catch(e){}
const langHref=l=>(l==='en'?((location.pathname.replace(/.*\//,'')+location.search.replace(/([?&])lang=[^&]*&?/,'$1').replace(/[?&]$/,''))||'./'):'?lang='+l);
/* mantém URL, título e descrição em sincronia com o idioma (só no arquivo publicado) */
function syncUrlMeta(){if(!STANDALONE)return;try{history.replaceState(null,'',langHref(LANG)+location.hash)}catch(e){}

function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const argmax=a=>a.reduce((b,v,i)=>v>a[b]?i:b,0);

function getDataset(key){const d=DATA[key];return{name:key,target:d.target,cols:d.cols.map(c=>({...c})),rows:d.rows.map(r=>r.slice())}}
function derive(d,cols,rows){return{name:d.name,target:d.target,cols,rows}}
const colIdx=(d,n)=>d.cols.findIndex(c=>c.name===n);
const featIdx=d=>d.cols.map((c,i)=>i).filter(i=>d.cols[i].name!==d.target&&!d.cols[i].meta);
function missingCount(d){let m=0;for(const r of d.rows)for(const v of r)if(v===null)m++;return m}
function hashData(d){let h=d.rows.length*31+d.cols.length;d.rows.forEach((r,i)=>r.forEach((v,j)=>{const x=typeof v==='number'?v:(v===null?-7.7:String(v).length*3.3);h=(h*1.0000013+x*((i%97)+1)*((j%13)+1))%1e12}));return d.name+':'+d.cols.map(c=>c.name).join('|')+':'+h.toFixed(4)}

function colStats(d,i){const c=d.cols[i];const v=d.rows.map(r=>r[i]);const ok=v.filter(x=>x!==null);const miss=v.length-ok.length;
  if(c.kind==='num'){const n=ok.length;const mean=ok.reduce((a,b)=>a+b,0)/(n||1);const sd=Math.sqrt(ok.reduce((a,b)=>a+(b-mean)**2,0)/((n-1)||1));
    return{kind:'num',mean,sd,min:Math.min(...ok),max:Math.max(...ok),miss,vals:ok}}
  const counts={};(c.values||[]).forEach(x=>counts[x]=0);ok.forEach(x=>counts[x]=(counts[x]||0)+1);
  const mode=Object.keys(counts).reduce((a,b)=>counts[b]>(counts[a]??-1)?b:a,Object.keys(counts)[0]);
  return{kind:'cat',counts,mode,miss}}

function design(d){
  const ti=colIdx(d,d.target);
  if(!d.target||ti<0)throw new Error(T('e.noTarget'));
  const tc=d.cols[ti];if(tc.kind!=='cat')throw new Error(T('e.targetCat'));
  const fi=featIdx(d);if(!fi.length)throw new Error(T('e.noFeat'));
  const names=[],enc=[];
  fi.forEach(i=>{const c=d.cols[i];if(c.kind==='num'){names.push(c.name);enc.push({i,kind:'num'})}else c.values.forEach(v=>{names.push(c.name+'='+v);enc.push({i,kind:'cat',v})})});
  const X=[],y=[];const classes=tc.values;
  for(const r of d.rows){if(r[ti]===null)continue;const row=[];
    for(const e of enc){const v=r[e.i];if(v===null)throw new Error(T('e.missing',{c:d.cols[e.i].name}));row.push(e.kind==='num'?v:(v===e.v?1:0))}
    X.push(row);y.push(classes.indexOf(r[ti]))}
  return{X,y,classes,names};
}
function scaler(X){const m=X[0].length,n=X.length;const mu=Array(m).fill(0),sd=Array(m).fill(0);
  X.forEach(r=>r.forEach((v,j)=>mu[j]+=v/n));X.forEach(r=>r.forEach((v,j)=>sd[j]+=(v-mu[j])**2/n));
  const s=sd.map(v=>Math.sqrt(v)||1);return r=>r.map((v,j)=>(v-mu[j])/s[j])}
const dist2=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=(a[i]-b[i])**2;return s};

function growTree(X,y,nc,maxD,opt={}){
  const m=X[0].length;const allF=[...Array(m).keys()];
  const counts=ids=>{const c=Array(nc).fill(0);ids.forEach(i=>c[y[i]]++);return c};
  const gini=(c,n)=>{let s=1;for(const v of c)s-=(v/n)**2;return s};
  function build(ids,depth){const c=counts(ids),n=ids.length;const node={counts:c,n,cls:argmax(c)};
    if(depth>=maxD||n<(opt.minN||4)||c.some(v=>v===n))return node;
    let best={g:gini(c,n)-1e-9,f:-1};
    const feats=opt.mtry?shuffle(allF.slice(),opt.R).slice(0,opt.mtry):allF;
    for(const f of feats){const s=ids.slice().sort((a,b)=>X[a][f]-X[b][f]);const L=Array(nc).fill(0),R=c.slice();
      for(let k=0;k<n-1;k++){const i=s[k];L[y[i]]++;R[y[i]]--;const a=X[i][f],b=X[s[k+1]][f];if(a===b)continue;const nl=k+1,nr=n-nl;if(nl<2||nr<2)continue;
        const g=(nl*gini(L,nl)+nr*gini(R,nr))/n;if(g<best.g)best={g,f,t:(a+b)/2}}}
    if(best.f<0)return node;
    node.f=best.f;node.t=best.t;node.left=build(ids.filter(i=>X[i][best.f]<=best.t),depth+1);node.right=build(ids.filter(i=>X[i][best.f]>best.t),depth+1);return node}
  return build(X.map((_,i)=>i),0)}
function leafOf(t,x){while(t.left)t=x[t.f]<=t.t?t.left:t.right;return t}
const norm1=v=>{const s=v.reduce((a,b)=>a+b,0)||1;return v.map(a=>a/s)};
const softmax=z=>{const m=Math.max(...z);const e=z.map(v=>Math.exp(v-m));return norm1(e)};
function fitLogReg(X,y,nc,C){const sc=scaler(X);const Z=X.map(sc);const m=Z[0].length,n=Z.length;const K=nc;const Wt=[...Array(K)].map(()=>Array(m+1).fill(0));const lr=.5;
  for(let it=0;it<300;it++){const G=Wt.map(()=>Array(m+1).fill(0));
    for(let i=0;i<n;i++){const zi=Z[i];const p=softmax(Wt.map(w=>{let s=w[m];for(let j=0;j<m;j++)s+=w[j]*zi[j];return s}));
      for(let c=0;c<K;c++){const g=p[c]-(y[i]===c?1:0);G[c][m]+=g;for(let j=0;j<m;j++)G[c][j]+=g*zi[j]}}
    for(let c=0;c<K;c++)for(let j=0;j<=m;j++)Wt[c][j]-=lr*(G[c][j]/n+(j<m?Wt[c][j]/(C*n):0))}
  return{W:Wt,predict:x=>{const z=sc(x);return softmax(Wt.map(w=>{let s=w[m];for(let j=0;j<m;j++)s+=w[j]*z[j];return s}))}}}

/* cada learner devolve x => vetor de probabilidades por classe */
const LEARN={
  knn:p=>(X,y,nc)=>{const sc=scaler(X);const Xs=X.map(sc);const k=Math.max(1,p.k|0);
    return x=>{const xs=sc(x);const d=Xs.map((r,i)=>[dist2(r,xs),y[i]]).sort((a,b)=>a[0]-b[0]);const v=Array(nc).fill(0);
      for(let j=0;j<Math.min(k,d.length);j++)v[d[j][1]]+=1+1e-6*(k-j);return norm1(v)}},
  logreg:p=>(X,y,nc)=>fitLogReg(X,y,nc,+p.C||1).predict,
  rf:p=>(X,y,nc)=>{const n=X.length,m=X[0].length;const T0=[];const R=rng(11);
    for(let t=0;t<(p.trees|0||10);t++){const ids=[...Array(n)].map(()=>Math.floor(R()*n));T0.push(growTree(ids.map(i=>X[i]),ids.map(i=>y[i]),nc,12,{mtry:Math.max(1,Math.round(Math.sqrt(m))),R,minN:5}))}
    return x=>norm1(T0.reduce((acc,t)=>{const pr=norm1(leafOf(t,x).counts);return acc.map((a,c)=>a+pr[c])},Array(nc).fill(0)))},
  nb:()=>(X,y,nc)=>{const m=X[0].length,n=X.length;const S=[...Array(nc)].map(()=>({n:0,mu:Array(m).fill(0),va:Array(m).fill(0)}));
    X.forEach((r,i)=>{const s=S[y[i]];s.n++;r.forEach((v,j)=>s.mu[j]+=v)});S.forEach(s=>s.mu=s.mu.map(v=>s.n?v/s.n:0));
    X.forEach((r,i)=>{const s=S[y[i]];r.forEach((v,j)=>s.va[j]+=(v-s.mu[j])**2)});
    let gmax=0;for(let j=0;j<m;j++){const mu=X.reduce((a,r)=>a+r[j],0)/n;gmax=Math.max(gmax,X.reduce((a,r)=>a+(r[j]-mu)**2,0)/n)}
    const eps=1e-6*gmax+1e-9;S.forEach(s=>s.va=s.va.map(v=>(s.n?v/s.n:0)+eps));
    return x=>softmax(S.map(s=>{if(!s.n)return -1e300;let lp=Math.log(s.n/n);for(let j=0;j<m;j++)lp+=-.5*Math.log(2*Math.PI*s.va[j])-(x[j]-s.mu[j])**2/(2*s.va[j]);return lp}))},
  tree:p=>(X,y,nc)=>{const t=growTree(X,y,nc,p.depth|0);return x=>norm1(leafOf(t,x).counts)}
};
function auc(score,pos){const idx=score.map((s,i)=>i).sort((a,b)=>score[a]-score[b]);let r=0,np=0,nn=0,i=0;const rank=Array(score.length);
  while(i<idx.length){let j=i;while(j+1<idx.length&&score[idx[j+1]]===score[idx[i]])j++;const avg=(i+j)/2+1;for(let k=i;k<=j;k++)rank[idx[k]]=avg;i=j+1}
  pos.forEach((p,k)=>{if(p){r+=rank[k];np++}else nn++});return np&&nn?(r-np*(np+1)/2)/(np*nn):.5}

function metrics(a,p,nc){const n=a.length;let ok=0;const tp=Array(nc).fill(0),pp=Array(nc).fill(0),ap=Array(nc).fill(0);
  a.forEach((v,i)=>{if(v===p[i]){ok++;tp[v]++}pp[p[i]]++;ap[v]++});let P=0,R=0,F=0;
  for(let c=0;c<nc;c++){const pr=pp[c]?tp[c]/pp[c]:0,rc=ap[c]?tp[c]/ap[c]:0,f=pr+rc?2*pr*rc/(pr+rc):0,w=ap[c]/n;P+=w*pr;R+=w*rc;F+=w*f}
  return{ca:ok/n,prec:P,rec:R,f1:F}}

const MEMO=new Map();
function memo(key,fn){if(MEMO.has(key))return MEMO.get(key);const v=fn();if(MEMO.size>60)MEMO.clear();MEMO.set(key,v);return v}

function crossVal(d,learners,folds){
  return memo('cv|'+hashData(d)+'|'+JSON.stringify(learners.map(l=>[l.kind,l.params]))+'|'+folds,()=>{
  const D=design(d);const n=D.y.length,nc=D.classes.length;const R=rng(42);
  const byC=[...Array(nc)].map(()=>[]);D.y.forEach((c,i)=>byC[c].push(i));
  const fold=Array(n);let k=0;byC.forEach(arr=>{shuffle(arr,R).forEach(i=>{fold[i]=k%folds;k++})});
  const models=learners.map(L=>({kind:L.kind,params:L.params,pred:Array(n),prob:Array(n)}));
  const all=[...Array(n).keys()];
  const splits=folds==='train'?[[all,all]]:[...Array(folds)].map((_,f)=>[all.filter(i=>fold[i]!==f),all.filter(i=>fold[i]===f)]);
  for(const[tr,te]of splits){if(!te.length||!tr.length)continue;
    const Xt=tr.map(i=>D.X[i]),yt=tr.map(i=>D.y[i]);
    learners.forEach((L,j)=>{const pr=LEARN[L.kind](L.params)(Xt,yt,nc);te.forEach(i=>{const p=pr(D.X[i]);models[j].prob[i]=p;models[j].pred[i]=argmax(p)})})}
  const aucW=m=>D.classes.reduce((s,_,c)=>{const pos=D.y.map(v=>v===c);const w=pos.filter(Boolean).length/n;return s+w*auc(m.prob.map(p=>p[c]),pos)},0);
  return{classes:D.classes,actual:D.y,n,folds,models:models.map(m=>({...m,...metrics(D.y,m.pred,nc),auc:nc===2?auc(m.prob.map(p=>p[1]),D.y.map(v=>v===1)):aucW(m)}))}})}

/* ranking de variáveis por ganho de informação (numéricas discretizadas em 4 quantis) */
function infoGain(d){const ti=colIdx(d,d.target);if(ti<0||d.cols[ti].kind!=='cat')throw new Error(T('e.rankTarget'));
  const H=a=>{const t=a.reduce((x,y)=>x+y,0);return t?-a.reduce((s,v)=>v?s+v/t*Math.log2(v/t):s,0):0};
  const cls=d.cols[ti].values;const rows=d.rows.filter(r=>r[ti]!==null);const base=H(cls.map(c=>rows.filter(r=>r[ti]===c).length));
  return featIdx(d).map(i=>{const c=d.cols[i];const ok=rows.filter(r=>r[i]!==null);let key;
    if(c.kind==='num'){const s=ok.map(r=>r[i]).sort((a,b)=>a-b);const q=[.25,.5,.75].map(p=>s[Math.floor(p*(s.length-1))]);key=v=>q.filter(t=>v>t).length}else key=v=>v;
    const g={};ok.forEach(r=>{const k=key(r[i]);(g[k]||(g[k]=Array(cls.length).fill(0)))[cls.indexOf(r[ti])]++});
    const cond=Object.values(g).reduce((s,a)=>s+a.reduce((x,y)=>x+y,0)/ok.length*H(a),0);
    return{name:c.name,kind:c.kind,ig:base-cond}}).sort((a,b)=>b.ig-a.ig)}

function kmeansRun(X,k,R){const n=X.length;const C=[X[Math.floor(R()*n)].slice()];
  while(C.length<k){const d=X.map(x=>Math.min(...C.map(c=>dist2(x,c))));const tot=d.reduce((a,b)=>a+b,0);let r=R()*tot,i=0;while(i<n-1&&(r-=d[i])>0)i++;C.push(X[i].slice())}
  let lab=Array(n).fill(-1);
  for(let it=0;it<100;it++){let ch=false;X.forEach((x,i)=>{let b=0,bd=Infinity;C.forEach((c,j)=>{const dd=dist2(x,c);if(dd<bd){bd=dd;b=j}});if(lab[i]!==b){lab[i]=b;ch=true}});
    if(!ch)break;C.forEach((c,j)=>{const mem=X.filter((_,i)=>lab[i]===j);if(mem.length)for(let q=0;q<c.length;q++)c[q]=mem.reduce((a,r)=>a+r[q],0)/mem.length})}
  const inertia=X.reduce((a,x,i)=>a+dist2(x,C[lab[i]]),0);return{lab,inertia}}
function silhouette(X,lab,k){const n=X.length;if(k<2)return 0;const size=Array(k).fill(0);lab.forEach(l=>size[l]++);let tot=0;
  for(let i=0;i<n;i++){const s=Array(k).fill(0);for(let j=0;j<n;j++)if(i!==j)s[lab[j]]+=Math.sqrt(dist2(X[i],X[j]));
    const own=lab[i];if(size[own]<2)continue;const a=s[own]/(size[own]-1);let b=Infinity;for(let c=0;c<k;c++)if(c!==own&&size[c])b=Math.min(b,s[c]/size[c]);tot+=(b-a)/Math.max(a,b)}
  return tot/n}
function kmeans(d,p){
  const fi=featIdx(d).filter(i=>d.cols[i].kind==='num');if(!fi.length)throw new Error(T('e.kmNum'));
  let X=d.rows.map(r=>fi.map(i=>{if(r[i]===null)throw new Error(T('e.kmMissing',{c:d.cols[i].name}));return r[i]}));
  if(p.norm)X=X.map(scaler(X));
  const best=k=>{const R=rng(7+k);let b=null;for(let t=0;t<10;t++){const r=kmeansRun(X,k,R);if(!b||r.inertia<b.inertia)b=r}return b};
  return memo('km|'+hashData(d)+'|'+p.norm,()=>{const runs={};for(let k=2;k<=8;k++){const r=best(k);runs[k]={lab:r.lab,sil:silhouette(X,r.lab,k)}}return runs})}
