   goals:[x=>x.of('kmeans').some(n=>x.inDS(n)==='iris'&&n.params.mode==='fixed'&&n.params.k==3&&x.ok(n)),
          x=>x.of('scatter').some(n=>x.up(n,'kmeans')&&x.ok(n)),
          x=>x.of('scatter').some(n=>x.up(n,'kmeans')&&n.params.color==='Cluster')&&x.seen('scatter.color.iris')]},
  {id:'l13',min:5,start:{nodes:[['f','file',40,80,{dataset:'wine'}]]},
   goals:[x=>x.of('kmeans').some(n=>x.inDS(n)==='wine'&&n.params.seenRange&&x.ok(n)),
          x=>x.of('kmeans').some(n=>{const o=x.out(n);return o&&x.inDS(n)==='wine'&&n.params.mode==='fixed'&&n.params.seenRange&&o.km.k===o.km.bestK})]}
 ]},
 {level:'advanced',lessons:[
  {id:'l14',min:5,start:{nodes:[['f','file',30,60,{dataset:'customers'}],['i','impute',200,60,{method:'mean'}]],links:[['f','i']]},
   goals:[x=>x.of('test').some(n=>{const o=x.out(n);return o&&x.inDS(n)==='customers'&&o.models.some(m=>m.kind==='logreg')&&o.models.some(m=>m.kind==='knn')}),
          x=>x.of('test').some(n=>{const o=x.out(n);if(!o||x.inDS(n)!=='customers')return false;const lr=o.models.filter(m=>m.kind==='logreg'),kn=o.models.filter(m=>m.kind==='knn');return lr.length&&kn.length&&Math.max(...lr.map(m=>m.ca))>Math.max(...kn.map(m=>m.ca))}),
          x=>x.of('logreg').some(n=>{const o=x.out(n);return o&&o.coef&&x.inDS(n)==='customers'})&&x.opened('logreg')]},
  {id:'l15',min:5,start:{nodes:[['f','file',40,80,{dataset:'wine'}]]},
   goals:[x=>x.of('test').some(n=>{const o=x.out(n);return o&&x.inDS(n)==='wine'&&o.models.some(m=>m.kind==='tree')&&o.models.some(m=>m.kind==='rf')}),
          x=>x.of('test').some(n=>{const o=x.out(n);if(!o||x.inDS(n)!=='wine')return false;const t=o.models.filter(m=>m.kind==='tree'),r=o.models.filter(m=>m.kind==='rf');return t.length&&r.length&&Math.max(...r.map(m=>m.ca))>Math.max(...t.map(m=>m.ca))}),
          x=>x.of('test').some(n=>{const o=x.out(n);return o&&x.inDS(n)==='wine'&&o.models.some(m=>m.kind==='rf'&&m.params.trees>=30)})]},
  {id:'l16',min:6,start:{nodes:[['f','file',30,50,{dataset:'customers'}],['i','impute',190,50,{method:'mean'}],['t','tree',190,200,{depth:8}],['s','test',370,120,{folds:5}]],links:[['f','i'],['i','s'],['t','s']]},
   goals:[x=>x.of('test').some(n=>{const o=x.out(n);return o&&o.folds==='train'&&o.models.some(m=>m.kind==='tree'&&m.params.depth>=6&&m.ca>=.85)}),
          x=>x.of('test').some(n=>{const o=x.out(n);return o&&n.params.seenTrain&&o.folds!=='train'&&o.models.some(m=>m.kind==='tree'&&m.params.depth>=6)}),
          x=>x.of('test').some(n=>{const o=x.out(n);if(!o||o.folds==='train'||!n.params.seenTrain)return false;const d=x.res(n).inputs.data;let deep;try{deep=crossVal(d,[{kind:'tree',params:{depth:8}}],o.folds).models[0].ca}catch(e){return false}return o.models.some(m=>m.kind==='tree'&&m.params.depth<=4&&m.ca>deep)})]},
  {id:'l17',min:5,start:{nodes:[['f','file',30,60,{dataset:'customers'}],['i','impute',200,60,{method:'mean'}]],links:[['f','i']]},
   goals:[x=>x.of('test').some(n=>{const o=x.out(n);return o&&x.inDS(n)==='customers'&&o.models.some(m=>m.kind==='logreg')&&o.models.some(m=>m.kind==='nb')}),
          x=>x.of('roc').some(n=>{const o=x.out(n);return o&&x.up(n,'test')&&o.classes[n.params.cls]==='yes'&&o.models.length>=2}),
          x=>x.opened('roc')]},
  {id:'l18',min:5,start:{nodes:[['f','file',40,80,{dataset:'wine'}]]},
   goals:[x=>x.of('rank').some(n=>x.inDS(n)==='wine'&&x.ok(n))&&x.opened('rank'),
          x=>x.of('test').some(n=>x.up(n,'rank')&&x.up(n,'knn')&&x.out(n)),
          x=>x.of('test').some(n=>{const o=x.out(n);const d=x.res(n).inputs?.data;return o&&d&&d.name==='wine'&&featIdx(d).length<=3&&o.models.some(m=>m.ca>=.93)})]}
 ]}
];
const LESSONS=TRACKS.flatMap((t,ti)=>t.lessons.map(l=>({...l,track:ti})));
const RECIPES=[
 {nodes:[['f','file',20,110,{dataset:'iris'}],['k','knn',200,0,{k:5}],['t','tree',200,110,{depth:3}],['b','nb',200,220,{}],['s','test',390,110,{folds:5}],['c','confusion',570,110,{model:0}]],links:[['f','s'],['k','s'],['t','s'],['b','s'],['s','c']]},
 {nodes:[['f','file',20,60,{dataset:'customers'}],['i','impute',190,60,{method:'mean'}],['d','dist',370,0,{col:'tenure (months)'}],['t','tree',190,200,{depth:3}],['s','test',370,140,{folds:5}]],links:[['f','i'],['i','d'],['i','s'],['t','s'],['i','t']]},
 {nodes:[['f','file',20,80,{dataset:'wine'}],['k','kmeans',200,80,{mode:'range',k:3,norm:true}],['p','scatter',380,80,{x:'Flavanoids',y:'Proline',color:'Cluster'}]],links:[['f','k'],['k','p']]},
 {nodes:[['f','file',20,60,{dataset:'customers'}],['i','impute',180,60,{method:'mean'}],['l','logreg',180,190,{C:1}],['r','rf',180,300,{trees:30}],['s','test',370,170,{folds:5}],['o','roc',550,170,{cls:1}]],links:[['f','i'],['i','s'],['l','s'],['r','s'],['s','o']]}
];
</script>

<script>
/* ======================= INTERFACE ======================= */
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(v,d=2)=>v==null||Number.isNaN(v)?'?':Number(v).toLocaleString(LOC(),{minimumFractionDigits:d,maximumFractionDigits:d});
const fnum=v=>typeof v!=='number'?v:(Math.abs(v)>=100?fmt(v,0):Number.isInteger(v)?String(v):fmt(v,Math.abs(v)<1?3:2));

const KEY='pomar.micro.v2';
let store={done:{},xp:0,drafts:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)store={...store,...s}}catch(e){}
/* migra progresso da v1 (rascunhos antigos usam o conjunto renomeado e são descartados) */
try{if(!localStorage.getItem(KEY)){const o=JSON.parse(localStorage.getItem('pomar.micro.v1')||'null');if(o){store.done=o.done||{};store.xp=o.xp||0}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}};

/* tema */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  $('#themeBtn').innerHTML=dark?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>'}
let theme=null;try{theme=localStorage.getItem('pomar.theme')}catch(e){}
theme=theme||'light';
applyTheme(theme);
$('#themeBtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')?document.documentElement.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  theme=dark?'light':'dark';try{localStorage.setItem('pomar.theme',theme)}catch(e){}applyTheme(theme)};

/* idioma */
$('#langSel').innerHTML=LANGS.map(([c,n])=>`<option value="${c}">${n}</option>`).join('');
function applyStatic(){document.documentElement.lang=LOC();$('#langSel').value=LANG;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));
  document.querySelectorAll('[data-aria]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.aria)));
  renderPalette()}
$('#langSel').onchange=e=>{const v=e.target.value;try{localStorage.setItem('pomar.lang',v)}catch(er){}
  LANG=v;syncUrlMeta();
  MEMO.clear();applyStatic();renderXP();
  if(CURPAGE==='home')renderHome();else if(CURPAGE==='faq')renderFaq();else if(CURPAGE==='gloss')renderGloss();else{mode==='free'?renderFree():renderLesson();evaluate()}};

function renderXP(){const n=Object.keys(store.done).filter(k=>LESSONS.some(l=>l.id===k)).length;
  $('#xp').innerHTML=`<span>${T('xp.lessons',{n,t:LESSONS.length})}</span><span class="bar"><span style="width:${n/LESSONS.length*100}%"></span></span><span>${store.xp} XP</span>`}

/* ---------- HOME ---------- */
function nextLesson(){return LESSONS.find(l=>!store.done[l.id])||LESSONS[0]}
function renderHome(){
  let demo='';try{const r=crossVal(getDataset('iris'),[{kind:'knn',params:{k:5}}],5);demo=fmt(r.models[0].ca,3)}catch(e){demo='—'}
  const nx=nextLesson();const started=Object.keys(store.done).length>0;
  const disc=(x,y,cat,t,label)=>`<g transform="translate(${x} ${y})"><circle r="30" fill="var(--c-${cat}-bg)" stroke="var(--c-${cat}-ring)" stroke-width="2"/><g transform="translate(-14 -14) scale(1.17)" style="color:var(--c-${cat}-ink)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[t]}</svg></g><text y="50" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="13" fill="var(--ink)">${label}</text></g>`;
  const chip=(x,y,txt)=>{const w=Math.max(54,txt.length*7+16);return`<rect x="${x-w/2}" y="${y}" width="${w}" height="18" rx="9" fill="var(--surface)" stroke="var(--line)"/><text x="${x}" y="${y+13}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">${esc(txt)}</text>`};
  $('#home').innerHTML=`<div class="wrap">
  <section class="hero">
    <div>
      <div class="eyebrow">${T('hero.eyebrow')}</div>
      <h1>${T('hero.title')}</h1>
      <p>${T('hero.lead')}</p>
      <div class="cta"><button class="btn pri" data-go="${nx.id}">${started?T('hero.continue',{t:esc(TL(nx.id).title)}):T('hero.start')} →</button><button class="btn" data-free>${T('hero.free')}</button></div>
      <div class="facts"><div><b>${LESSONS.length}</b><span>${T('facts.lessons')}</span></div><div><b>${Object.keys(W).length}</b><span>${T('facts.widgets')}</span></div><div><b>${Object.keys(DATA).length}</b><span>${T('facts.datasets')}</span></div></div>
    </div>
    <figure class="heroart" style="margin:0">
      <svg viewBox="0 0 440 250" role="img" aria-label="${esc(T('hero.aria'))}">
        <path d="M100 70 C190 70 220 125 300 125" fill="none" stroke="var(--link)" stroke-width="2.5" class="flow"/>
        <path d="M100 185 C190 185 220 125 300 125" fill="none" stroke="var(--link)" stroke-width="2.5" class="flow"/>
        ${chip(187,78,CHAN('data'))}${chip(187,160,CHAN('learner'))}
        ${disc(70,70,'data','file','File · Iris')}${disc(70,185,'model','knn','kNN')}${disc(330,125,'eval','test','Test and Score')}
        <rect x="282" y="196" width="128" height="34" rx="10" fill="var(--accent)"/><text x="346" y="218" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="var(--accent-ink)">CA = ${demo}</text>
      </svg>
      <figcaption>${T('hero.caption')}</figcaption>
    </figure>
  </section>
  <section>
    <div class="sechead"><div><h2>${T('tracks.h')}</h2><p>${T('tracks.p',{n:TRACKS.length})}</p></div></div>
    <div class="tracks">${TRACKS.map((t,ti)=>{const dn=t.lessons.filter(l=>store.done[l.id]).length;const tt=TT(ti);return `
      <article class="track"><div><div class="tn">${T('track.n',{i:ti+1,d:dn,t:t.lessons.length})}</div><h3>${tt.title}</h3><p class="td">${tt.desc}</p><span class="lvl">${T('lvl.'+t.level)}</span></div>
      <div class="stops">${t.lessons.map(l=>{const gi=LESSONS.findIndex(x=>x.id===l.id)+1;return `<button class="stop ${store.done[l.id]?'done':''} ${l.id===nx.id&&!store.done[l.id]?'next':''}" data-go="${l.id}"><span class="dot">${store.done[l.id]?'✓':gi}</span><span><b>${TL(l.id).title}</b><small>${T('min',{m:l.min})}</small></span></button>`}).join('')}</div></article>`}).join('')}
    </div>
  </section>
  <section>
    <div class="sechead"><div><h2>${T('how.h')}</h2></div></div>
    <div class="how">${[1,2,3].map(i=>`<div><span>${T('how.'+i+'s')}</span><h3>${T('how.'+i+'t')}</h3><p>${T('how.'+i+'p')}</p></div>`).join('')}</div>
  </section>
  <footer class="foot"><nav class="footlinks"><a href="#faq" data-route="faq">${T('nav.faq')}</a><a href="#glossary" data-route="glossary">${T('nav.gloss')}</a><a href="#lab" data-route="lab">Data Lab</a></nav><span>${T('foot.text')}</span><span>${T('foot.saved')}</span>${STANDALONE?`<nav class="langlinks" aria-label="${esc(T('lang.label'))}">${LANGS.map(([c,n])=>`<a href="${langHref(c)}" data-lang="${c}" hreflang="${c}"${c===LANG?' aria-current="page"':''}>${n}</a>`).join('')}</nav>`:''}</footer>
  </div>`;
}
$('#home').addEventListener('click',e=>{const ll=e.target.closest('a[data-lang]');if(ll){e.preventDefault();const sl=$('#langSel');sl.value=ll.dataset.lang;sl.dispatchEvent(new Event('change'));$('#home').scrollTop=0;return}
  const g=e.target.closest('[data-go]');if(g)openLesson(g.dataset.go);if(e.target.closest('[data-free]'))openFree()});

/* ---------- ESTADO DO WORKSPACE ---------- */
let mode='lesson',L=null,graph={nodes:[],links:[]},RES={},sel=null,view={x:30,y:30,z:1},opened=new Set(),QZ={};
let _id=0;const uid=()=>'n'+(++_id)+Math.random().toString(36).slice(2,5);
const nodeById=id=>graph.nodes.find(n=>n.id===id);

function buildStart(spec){const map={};const nodes=(spec.nodes||[]).map(([k,t,x,y,p])=>{const id=uid();map[k]=id;return{id,type:t,x,y,params:{...structuredClone(W[t].def),...p}}});
  graph={nodes,links:[]};(spec.links||[]).forEach(([a,b])=>connect(map[a],map[b],true));return graph}

function openLesson(id){L=LESSONS.find(l=>l.id===id);mode='lesson';opened=new Set();sel=null;
  const d=store.drafts[id];if(d&&d.nodes){graph=structuredClone(d);graph.nodes.forEach(n=>{const m=+String(n.id).replace(/\D/g,'');if(m>_id)_id=m})}else buildStart(L.start);
  showWork();setTab(innerWidth<=1000?'lesson':'flow');renderLesson();evaluate();fit()}
function openFree(){mode='free';L=null;opened=new Set();sel=null;
  const d=store.drafts.free;if(d&&d.nodes)graph=structuredClone(d);else buildStart({nodes:[['f','file',40,80,{dataset:'iris'}]]});
  showWork();setTab('flow');renderFree();evaluate();fit()}
/* páginas: home, work (lição / Data Lab), faq, gloss */
let CURPAGE='home';
function showPage(id){['home','work','faq','gloss'].forEach(p=>$('#'+p).hidden=p!==id);CURPAGE=id;
  const cur={home:'navTracks',faq:'navFaq',gloss:'navGloss',work:mode==='free'?'navFree':null}[id];
  ['navTracks','navFree','navFaq','navGloss'].forEach(n=>{const b=$('#'+n);if(n===cur)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function showWork(){showPage('work')}
function goHome(){renderHome();showPage('home');$('#home').scrollTop=0}
function openFaq(){renderFaq();showPage('faq');$('#faq').scrollTop=0}
function openGloss(){renderGloss();showPage('gloss');$('#gloss').scrollTop=0}
$('#goHome').onclick=goHome;$('#navTracks').onclick=goHome;$('#navFree').onclick=openFree;$('#navFaq').onclick=openFaq;$('#navGloss').onclick=openGloss;
/* links internos: <a data-route="faq|glossary|lab|tracks|lN"> */
function route(r){if(r==='faq')openFaq();else if(r==='glossary')openGloss();else if(r==='lab')openFree();else if(r==='tracks')goHome();else if(/^l\d+$/.test(r)&&LESSONS.some(l=>l.id===r))openLesson(r)}
document.addEventListener('click',e=>{const a=e.target.closest('a[data-route]');if(!a)return;e.preventDefault();route(a.dataset.route)});
addEventListener('hashchange',()=>route(location.hash.slice(1)));

let saveT;function saveDraft(){clearTimeout(saveT);saveT=setTimeout(()=>{store.drafts[mode==='free'?'free':L.id]=graph;save()},300)}

/* abas mobile */
function setTab(t){$('#work').dataset.tab=t;document.querySelectorAll('.mtabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));if(t==='out')$('#outPip').hidden=true;if(t==='flow')requestAnimationFrame(applyView)}
document.querySelector('.mtabs').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab)};

/* ---------- PALETA ---------- */
function renderPalette(){$('#palette').innerHTML=CATS.map(c=>`<div class="pgroup cat-${c}"><span>${T('cat.'+c)}</span><div>${Object.keys(W).filter(t=>W[t].cat===c).map(t=>`<button class="pitem cat-${c}" data-add="${t}" title="${esc(WD(t))}"><i>${icon(t)}</i>${W[t].name}</button>`).join('')}</div></div>`).join('')}
$('#palette').onclick=e=>{const b=e.target.closest('[data-add]');if(b)addNode(b.dataset.add)};

let fresh=null;
function addNode(type){const w=W[type];const cv=$('#canvas').getBoundingClientRect();let x,y;const s=sel&&nodeById(sel);let auto=null;
  if(s&&W[s.type].out&&w.ins.some(i=>i.type===W[s.type].out)){const kids=graph.links.filter(l=>l.from===s.id).length;x=s.x+170;y=s.y+kids*120-(kids?40:0);auto=s.id}
  else{const k=graph.nodes.length%5;x=(cv.width/2-view.x)/view.z-36+k*22;y=(cv.height/2-view.y)/view.z-60+k*22}
  const n={id:uid(),type,x:Math.round(x),y:Math.round(y),params:structuredClone(w.def)};graph.nodes.push(n);
  if(auto)connect(auto,n.id,true);fresh=n.id;select(n.id,true);changed();
  toast(auto?T('toast.addedLinked',{w:w.name,s:W[s.type].name}):T('toast.added',{w:w.name}))}

/* ---------- LIGAÇÕES ---------- */
function reachable(a,b){const st=[a],seen=new Set();while(st.length){const c=st.pop();if(c===b)return true;if(seen.has(c))continue;seen.add(c);graph.links.filter(l=>l.from===c).forEach(l=>st.push(l.to))}return false}
function connect(from,to,quiet){if(from===to)return false;const a=nodeById(from),b=nodeById(to);const t=W[a.type].out;if(!t)return false;
  const inp=W[b.type].ins.find(i=>i.type===t);
  if(!inp){if(!quiet)toast(T('toast.noAccept',{w:W[b.type].name,c:CHAN(t)}));return false}
  if(reachable(to,from)){if(!quiet)toast(T('toast.cycle'));return false}
  if(graph.links.some(l=>l.from===from&&l.to===to))return false;
  if(!inp.multi)graph.links=graph.links.filter(l=>!(l.to===to&&l.port===inp.id));
  graph.links.push({from,to,port:inp.id});if(!quiet){toast(T('toast.linked',{a:W[a.type].name,b:W[b.type].name,c:CHAN(t)}));changed()}return true}

/* ---------- AVALIAÇÃO ---------- */
function compute(id,stack){if(RES[id])return RES[id];const n=nodeById(id),w=W[n.type];if(stack.has(id))return{error:T('e.cycle')};stack.add(id);
  const inputs={};for(const inp of w.ins){const vals=graph.links.filter(l=>l.to===id&&l.port===inp.id).map(l=>compute(l.from,stack)).filter(r=>r.out!=null&&!r.error).map(r=>r.out);inputs[inp.id]=inp.multi?vals:vals[0]}
  const res={inputs};const miss=w.ins.filter(i=>!i.optional&&(i.multi?!inputs[i.id].length:!inputs[i.id]));
  if(miss.length)res.waiting=miss.map(i=>CHAN(i.type)).join(T('and'));
  else try{res.out=w.run(inputs,n.params,n)}catch(e){res.error=e.message}
  stack.delete(id);RES[id]=res;return res}
function evaluate(){RES={};graph.nodes.forEach(n=>compute(n.id,new Set()));renderCanvas();renderInsp();checkGoals()}
function changed(){evaluate();saveDraft()}

/* ---------- CANVAS ---------- */
const world=$('#world'),svg=$('#links'),canvas=$('#canvas');
let drag=null,tmpPath=null,pending=null;
function applyView(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`}
function portPos(n,side){return side==='out'?[n.x+72,n.y+32]:[n.x,n.y+32]}
function curve(x1,y1,x2,y2){const dx=Math.max(40,Math.abs(x2-x1)/2);return`M${x1} ${y1} C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}`}
function renderLinks(){let p='';world.querySelectorAll('.lchip').forEach(e=>e.remove());
  graph.links.forEach((l,i)=>{const a=nodeById(l.from),b=nodeById(l.to);const[x1,y1]=portPos(a,'out'),[x2,y2]=portPos(b,'in');const r=RES[l.from];const nod=!r||r.out==null||r.error;
    p+=`<path class="l ${nod?'nodata':''}" d="${curve(x1,y1,x2,y2)}"/>`;

function renderCanvas(){world.querySelectorAll('.node').forEach(e=>e.remove());

    world.appendChild(el)});fresh=null;renderLinks();applyView();

function canTake(from,to){const t=W[nodeById(from).type].out;return W[nodeById(to).type].ins.some(i=>i.type===t)&&!reachable(to,from)}

const toWorld=(cx,cy)=>{const r=canvas.getBoundingClientRect();return[(cx-r.left-view.x)/view.z,(cy-r.top-view.y)/view.z]};
canvas.addEventListener('pointerdown',e=>{if(e.button>0)return;const un=e.target.closest('[data-unlink]');
  if(un){graph.links.splice(+un.dataset.unlink,1);changed();return}
  if(e.target.closest('.lchip,.zoom'))return;

  if(pending&&nodeEl&&nodeEl.dataset.id!==pending&&!port){const a=pending;pending=null;connect(a,nodeEl.dataset.id)||renderCanvas();return}
  if(port){drag={kind:'link',from:nodeEl.dataset.id,sx:e.clientX,sy:e.clientY,moved:false};return}
  if(nodeEl){const n=nodeById(nodeEl.dataset.id);drag={kind:'node',n,el:nodeEl,sx:e.clientX,sy:e.clientY,ox:n.x,oy:n.y,moved:false};return}
  drag={kind:'pan',sx:e.clientX,sy:e.clientY,ox:view.x,oy:view.y,moved:false};canvas.classList.add('panning')});
addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(Math.hypot(dx,dy)>4)drag.moved=true;if(!drag.moved)return;
  if(drag.kind==='pan'){view.x=drag.ox+dx;view.y=drag.oy+dy;applyView()}
  else if(drag.kind==='node'){drag.n.x=Math.round(drag.ox+dx/view.z);drag.n.y=Math.round(drag.oy+dy/view.z);drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';renderLinks()}
  else{const a=nodeById(drag.from);const[x1,y1]=portPos(a,'out');const[x2,y2]=toWorld(e.clientX,e.clientY);tmpPath=curve(x1,y1,x2,y2);renderLinks()}});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;canvas.classList.remove('panning');
  if(d.kind==='pan'){if(!d.moved){pending=null;select(null)}}
  else if(d.kind==='node'){if(d.moved)saveDraft();else select(d.n.id)}
  else{tmpPath=null;if(d.moved){const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');if(el&&el.dataset.id!==d.from)connect(d.from,el.dataset.id);else renderLinks()}
    else{pending=pending===d.from?null:d.from;renderCanvas()}}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
function zoomAt(f,mx,my){const z=Math.min(2,Math.max(.35,view.z*f));view.x=mx-(mx-view.x)*z/view.z;view.y=my-(my-view.y)*z/view.z;view.z=z;applyView()}
$('#zIn').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2)};
$('#zOut').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2)};
$('#zFit').onclick=()=>fit();
function fit(){requestAnimationFrame(()=>{const r=canvas.getBoundingClientRect();if(!r.width)return;if(!graph.nodes.length){view={x:30,y:30,z:1};applyView();return}
  const xs=graph.nodes.map(n=>n.x),ys=graph.nodes.map(n=>n.y);const x0=Math.min(...xs)-50,x1=Math.max(...xs)+130,y0=Math.min(...ys)-30,y1=Math.max(...ys)+110;
  const z=Math.min(1.15,(r.width-20)/(x1-x0),(r.height-60)/(y1-y0));view.z=Math.max(.4,z);view.x=(r.width-(x1-x0)*view.z)/2-x0*view.z;view.y=(r.height-40-(y1-y0)*view.z)/2-y0*view.z;applyView()})}
addEventListener('resize',()=>{if(!$('#work').hidden)applyView()});
addEventListener('keydown',e=>{if((e.key==='Delete'||e.key==='Backspace')&&sel&&!e.target.closest('input,select,textarea')){removeNode(sel);e.preventDefault()}if(e.key==='Escape'&&pending){pending=null;renderCanvas()}});
function removeNode(id){graph.nodes=graph.nodes.filter(n=>n.id!==id);graph.links=graph.links.filter(l=>l.from!==id&&l.to!==id);if(sel===id)sel=null;changed()}

function select(id,silent){sel=id;if(id){const n=nodeById(id);opened.add(n.type);if(n.type==='scatter'&&n.params.color)opened.add('scatter.color.'+n.params.color);
  if(innerWidth<=1000&&!silent&&$('#work').dataset.tab==='flow')$('#outPip').hidden=false}

function renderInsp(){const box=$('#insp');const st=box.scrollTop;const n=sel&&nodeById(sel);

    if(f.type==='checks'){const cur=v||f.opts;return`<label>${f.label}</label><div class="checks">${f.opts.map((o,i)=>`<label for="c-${i}"><input type="checkbox" id="c-${i}" data-check="${esc(o)}" ${cur.includes(o)?'checked':''}>${esc(o)}</label>`).join('')}</div>`}}).join('')}</div>`:'';
  let body='';if(r.error)body=`<div class="status err"><b>${T('insp.err')}</b> ${esc(r.error)}</div>`;else if(r.waiting)body=`<div class="status wait">${T('insp.wait',{x:r.waiting})}</div>`;
  else{try{body=VIEW[n.type]?VIEW[n.type](r.out,n):''}catch(e){body=`<div class="status err">${esc(e.message)}</div>`}}

$('#insp').addEventListener('change',e=>{const n=sel&&nodeById(sel);if(!n)return;const t=e.target;
  if(t.dataset.key){let v=t.value;if(t.type==='number')v=Math.max(+t.min,Math.min(+t.max,+v||+t.min));if(['model','cls','C'].includes(t.dataset.key)||(t.dataset.key==='folds'&&v!=='train'))v=+v;if(t.dataset.key==='norm')v=v==='true';n.params[t.dataset.key]=v;

const PAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--leaf)','var(--muted)','var(--ink)'];
function niceTicks(lo,hi,n=5){if(lo===hi){lo-=1;hi+=1}const s0=(hi-lo)/n,mag=10**Math.floor(Math.log10(s0)),e=s0/mag;const st=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag;const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st;const t=[];for(let v=a;v<=b+st*1e-6;v+=st)t.push(+v.toFixed(10));return{t,a,b}}
const tl=v=>Math.abs(v)>=1000?fmt(v/1000,1)+'k':(Number.isInteger(v)?String(v):fmt(v,Math.abs(v)<1?2:1));
function sumLine(d){return`<div class="sum">${T('v.sum',{r:d.rows.length,c:d.cols.length,m:missingCount(d),t:esc(d.target||'—')})}</div>`}
function viewTable(d){const ti=colIdx(d,d.target);const rows=d.rows.slice(0,120);
  return`<div class="outh">${T('v.outputOf',{d:esc(DSL(d.name).label)})}</div>${sumLine(d)}<div class="tscroll"><table class="dt"><thead><tr><th>#</th>${d.cols.map((c,i)=>`<th class="${i===ti?'tg':''}"><span class="k">${i===ti?T('th.target'):c.meta?'meta':c.kind==='num'?'N':'C'}</span>${esc(c.name)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map((v,j)=>v===null?'<td class="miss">?</td>':`<td class="${d.cols[j].kind==='cat'?'cat':''}">${esc(fnum(v))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${d.rows.length>120?`<div class="sum" style="margin-top:6px">${T('v.showing',{n:d.rows.length})}</div>`:''}`}
function spark(vals){if(!vals.length)return'';const lo=Math.min(...vals),hi=Math.max(...vals);const b=Array(12).fill(0);vals.forEach(v=>b[Math.min(11,Math.floor((v-lo)/((hi-lo)||1)*12))]++);const m=Math.max(...b);
  return`<svg width="72" height="20" viewBox="0 0 72 20">${b.map((c,i)=>`<rect x="${i*6}" y="${20-c/m*20}" width="5" height="${c/m*20}" fill="var(--accent)" opacity=".75"/>`).join('')}</svg>`}
function learnerNote(o){return`<div class="outh">${T('v.learnerOut')}</div><div class="metric"><div><b style="font-size:20px">${esc(lname(o))}</b><span>${T('v.untrained')}</span></div></div>`}
const VIEW={
  file:d=>`<div class="outh">${T('v.output')}</div>${sumLine(d)}<p class="idesc" style="margin-top:0">${esc(DSL(d.name).desc)}</p>${viewTable({...d,rows:d.rows.slice(0,8)})}`,
  table:viewTable,select:viewTable,impute:viewTable,normalize:viewTable,
  stats:d=>{const ti=colIdx(d,d.target);return`<div class="outh">${T('v.output')}</div>${sumLine(d)}<div class="tscroll"><table class="dt"><thead><tr><th>${T('v.var')}</th><th>${T('v.dist')}</th><th>${T('v.mean')}</th><th>${T('v.sd')}</th><th>${T('v.min')}</th><th>${T('v.max')}</th><th>?</th></tr></thead><tbody>${d.cols.map((c,i)=>{const s=colStats(d,i);
    if(s.kind==='num')return`<tr><td>${esc(c.name)}</td><td>${spark(s.vals)}</td><td>${fmt(s.mean,2)}</td><td>${fmt(s.sd,2)}</td><td>${fnum(s.min)}</td><td>${fnum(s.max)}</td><td>${s.miss}</td></tr>`;
    return`<tr><td>${esc(c.name)}${i===ti?` <span class="best">${T('th.target')}</span>`:''}</td><td colspan="5" style="text-align:left">${Object.entries(s.counts).map(([k,v])=>`${esc(k)}: ${v}`).join(' · ')}</td><td>${s.miss}</td></tr>`}).join('')}</tbody></table></div>`},
  dist:(d,n)=>{const i=colIdx(d,n.params.col);const c=d.cols[i];const ti=colIdx(d,d.target);const by=ti>=0&&ti!==i?d.cols[ti]:null;const cls=by?by.values:['all'];
    const W0=360,H0=230,ml=36,mb=34,mt=10,mr=8;let labels,counts;
    const ok=d.rows.filter(r=>r[i]!==null);
    if(c.kind==='num'){const vals=ok.map(r=>r[i]);const lo=Math.min(...vals),hi=Math.max(...vals);const nb=10;const w=(hi-lo)/nb||1;
      counts=[...Array(nb)].map(()=>Array(cls.length).fill(0));ok.forEach(r=>{const b=Math.min(nb-1,Math.floor((r[i]-lo)/w));counts[b][by?Math.max(0,by.values.indexOf(r[ti])):0]++});labels=[...Array(nb+1)].map((_,k)=>lo+k*w)}
    else{counts=c.values.map(v=>Array(cls.length).fill(0));ok.forEach(r=>{counts[c.values.indexOf(r[i])][by?Math.max(0,by.values.indexOf(r[ti])):0]++})}
    const tot=counts.map(a=>a.reduce((x,y)=>x+y,0));const yt=niceTicks(0,Math.max(...tot),4);const sy=v=>mt+(H0-mt-mb)*(1-v/yt.b);const bw=(W0-ml-mr)/counts.length;
    let s=yt.t.map(t=>`<line class="ax" x1="${ml}" x2="${W0-mr}" y1="${sy(t)}" y2="${sy(t)}" stroke-width=".7"/><text x="${ml-6}" y="${sy(t)+3}" text-anchor="end">${t}</text>`).join('');
    counts.forEach((a,b)=>{let acc=0;a.forEach((v,k)=>{if(!v)return;s+=`<rect x="${ml+b*bw+1}" y="${sy(acc+v)}" width="${bw-2}" height="${sy(acc)-sy(acc+v)}" fill="${PAL[k%8]}" opacity=".85"/>`;acc+=v})});
    if(c.kind==='num')labels.forEach((v,k)=>{if(k%2===0)s+=`<text x="${ml+k*bw}" y="${H0-mb+14}" text-anchor="middle">${tl(+v.toFixed(2))}</text>`});
    else c.values.forEach((v,k)=>s+=`<text x="${ml+(k+.5)*bw}" y="${H0-mb+14}" text-anchor="middle">${esc(v)}</text>`);
    s+=`<text x="${(ml+W0-mr)/2}" y="${H0-4}" text-anchor="middle">${esc(c.name)}</text>`;
    return`<div class="outh">${T('v.hist')}</div><svg class="chart" viewBox="0 0 ${W0} ${H0}">${s}</svg>${by?`<div class="legend">${cls.map((v,k)=>`<span><i style="background:${PAL[k%8]}"></i>${esc(v)}</span>`).join('')}</div>`:''}`},
  scatter:(d,n)=>{const p=n.params,xi=colIdx(d,p.x),yi=colIdx(d,p.y),ci=colIdx(d,p.color);const cc=ci>=0?d.cols[ci]:null;const pts=d.rows.filter(r=>r[xi]!==null&&r[yi]!==null);
    const W0=360,H0=290,ml=40,mb=40,mt=10,mr=10;const xs=pts.map(r=>r[xi]),ys=pts.map(r=>r[yi]);const X=niceTicks(Math.min(...xs),Math.max(...xs)),Y=niceTicks(Math.min(...ys),Math.max(...ys));
    const sx=v=>ml+(W0-ml-mr)*(v-X.a)/(X.b-X.a),sy=v=>mt+(H0-mt-mb)*(1-(v-Y.a)/(Y.b-Y.a));
    let s=X.t.map(t=>`<line class="ax" x1="${sx(t)}" x2="${sx(t)}" y1="${mt}" y2="${H0-mb}" stroke-width=".6"/><text x="${sx(t)}" y="${H0-mb+14}" text-anchor="middle">${tl(t)}</text>`).join('')+Y.t.map(t=>`<line class="ax" x1="${ml}" x2="${W0-mr}" y1="${sy(t)}" y2="${sy(t)}" stroke-width=".6"/><text x="${ml-6}" y="${sy(t)+3}" text-anchor="end">${tl(t)}</text>`).join('');
    s+=pts.map(r=>{const k=cc&&r[ci]!==null?cc.values.indexOf(r[ci]):0;return`<circle cx="${sx(r[xi]).toFixed(1)}" cy="${sy(r[yi]).toFixed(1)}" r="4" fill="${cc?PAL[k%8]:'var(--accent)'}" fill-opacity=".72" stroke="var(--surface)" stroke-width=".8"/>`}).join('');
    s+=`<text x="${(ml+W0-mr)/2}" y="${H0-6}" text-anchor="middle">${esc(p.x)}</text><text transform="translate(11 ${(mt+H0-mb)/2}) rotate(-90)" text-anchor="middle">${esc(p.y)}</text>`;
    return`<div class="outh">${T('v.scatter',{n:pts.length})}</div><svg class="chart" viewBox="0 0 ${W0} ${H0}">${s}</svg>${cc?`<div class="legend">${cc.values.map((v,k)=>`<span><i style="background:${PAL[k%8]}"></i>${esc(v)}</span>`).join('')}</div>`:''}`},
  knn:o=>learnerNote(o),nb:o=>learnerNote(o),rf:o=>learnerNote(o),
  tree:o=>{if(!o.fitted)return learnerNote(o)+`<p class="idesc">${T('v.treeHint')}</p>`;const{t,D}=o.fitted;
    const cond=(f,th,left)=>{const nm=D.names[f];if(nm.includes('=')){const[a,b]=nm.split('=');return`${esc(a)} ${left?'≠':'='} ${esc(b)}`}return`${esc(nm)} ${left?'≤':'>'} ${fnum(+th.toFixed(3))}`};

    const w=D.names.map((nm,j)=>[nm,fit.W[c][j]-(D.classes.length===2?fit.W[0][j]:0)]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));const mx=Math.max(...w.map(x=>Math.abs(x[1])))||1;
    return learnerNote(o)+`<div class="outh">${T('v.coefHead',{c:esc(D.classes[c])})}</div><div class="tscroll"><table class="dt"><tbody>${w.map(([nm,v])=>`<tr><td>${esc(nm)}</td><td style="width:50%;text-align:left"><span style="display:inline-block;height:9px;border-radius:4px;margin-left:${v<0?50-Math.abs(v)/mx*50:50}%;width:${Math.max(1,Math.abs(v)/mx*50)}%;background:${v<0?'var(--s2)':'var(--accent)'}"></span></td><td>${v>0?'+':''}${fmt(v,2)}</td></tr>`).join('')}</tbody></table></div><p class="idesc" style="margin-top:10px">${T('v.coefNote',{c:esc(D.classes[c])})}</p>`},
  rank:o=>{const mx=Math.max(...o.rank.map(r=>r.ig))||1;return`<div class="outh">${T('v.igHead',{t:esc(o.target)})}</div><div class="tscroll"><table class="dt"><thead><tr><th>#</th><th style="text-align:left">${T('v.var')}</th><th style="text-align:left">${T('v.gain')}</th><th></th></tr></thead><tbody>${o.rank.map((r,i)=>`<tr style="${i<o.keepN?'':'opacity:.5'}"><td>${i+1}</td><td style="text-align:left">${esc(r.name)}${i<o.keepN?` <span class="best">${T('v.passes')}</span>`:''}</td><td style="text-align:left"><span style="display:inline-block;height:9px;border-radius:4px;background:var(--accent);width:${Math.max(2,r.ig/mx*110)}px"></span></td><td>${fmt(r.ig,3)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:14px">${viewTable(o)}</div>`},
  test:o=>{const best=Math.max(...o.models.map(m=>m.ca));return`<div class="outh">${o.folds==='train'?T('v.train',{n:o.n}):T('v.cv',{k:o.folds,n:o.n})}</div>${o.folds==='train'?`<div class="status wait">${T('v.trainWarn')}</div>`:''}<div class="tscroll"><table class="dt"><thead><tr><th>${T('v.model')}</th><th>AUC</th><th>CA</th><th>F1</th><th>${T('v.prec')}</th><th>${T('v.rec')}</th></tr></thead><tbody>${o.models.map(m=>`<tr><td>${esc(lname(m))}${o.models.length>1&&m.ca===best?`<span class="best">${T('v.best')}</span>`:''}</td><td>${fmt(m.auc,3)}</td><td>${fmt(m.ca,3)}</td><td>${fmt(m.f1,3)}</td><td>${fmt(m.prec,3)}</td><td>${fmt(m.rec,3)}</td></tr>`).join('')}</tbody></table></div><p class="idesc" style="margin-top:10px">${T('v.weighted')}</p>`},
  confusion:(o,n)=>{const m=o.models[n.params.model]||o.models[0];const k=o.classes.length;const M=[...Array(k)].map(()=>Array(k).fill(0));o.actual.forEach((a,i)=>M[a][m.pred[i]]++);const mx=Math.max(...M.flat());
    return`<div class="outh">${T('v.cmHead',{m:esc(lname(m))})}</div><div class="tscroll"><table class="dt"><thead><tr><th>${T('v.cmCorner')}</th>${o.classes.map(c=>`<th>${esc(c)}</th>`).join('')}<th>Σ</th></tr></thead><tbody>${M.map((r,i)=>`<tr><td><b>${esc(o.classes[i])}</b></td>${r.map((v,j)=>`<td style="background:color-mix(in oklab,${i===j?'var(--ok)':'var(--bad)'} ${Math.round(v/mx*(i===j?45:60))}%,transparent);font-weight:${v?700:400}">${v}</td>`).join('')}<td>${r.reduce((a,b)=>a+b,0)}</td></tr>`).join('')}<tr><td>Σ</td>${o.classes.map((_,j)=>`<td>${M.reduce((a,r)=>a+r[j],0)}</td>`).join('')}<td>${o.n}</td></tr></tbody></table></div><p class="idesc" style="margin-top:10px">${T('v.cmNote')}</p>`},

function ctx(){const up=(id)=>{const s=new Set(),st=[id];while(st.length){const c=st.pop();graph.links.filter(l=>l.to===c).forEach(l=>{if(!s.has(l.from)){s.add(l.from);st.push(l.from)}})}return s};
  return{of:t=>graph.nodes.filter(n=>n.type===t),out:n=>RES[n.id]&&!RES[n.id].error?RES[n.id].out:null,ok:n=>!!(RES[n.id]&&RES[n.id].out&&!RES[n.id].error),res:n=>RES[n.id]||{},
    up:(n,t)=>[...up(n.id)].some(id=>nodeById(id).type===t),inDS:n=>RES[n.id]?.inputs?.data?.name,opened:t=>opened.has(t),seen:k=>opened.has(k)}}
let goalState=[];const STICK={};

const qOrder=(id,n)=>shuffle([...Array(n).keys()],rng([...id].reduce((h,c)=>h*31+c.charCodeAt(0),7)));
function renderLesson(){const tx=TL(L.id);const tt=TT(L.track);const idx=LESSONS.indexOf(L);const q=QZ[L.id]||{};
  $('#lesson').innerHTML=`<div class="pad lp"><div class="lmeta"><span>${T('l.track',{i:L.track+1,t:tt.title})}</span><span class="lvl">${T('lvl.'+TRACKS[L.track].level)}</span><span>${T('min',{m:L.min})}</span></div>
    <h2>${idx+1}. ${tx.title}</h2><div class="concept">${tx.concept}</div><div class="tip"><b>${T('l.inOrange')}</b>${tx.tip}</div>
    <h3>${T('l.mission')}</h3><ol class="goals" id="goals"></ol>
    <h3>${T('l.check')}</h3><div class="quiz"><p>${tx.quiz.q}</p><div class="opts">${qOrder(L.id,tx.quiz.o.length).map(i=>`<button data-q="${i}" class="${q.pick===i?(i===0?'right':'wrong'):''}" ${q.ok?'disabled':''}>${tx.quiz.o[i]}</button>`).join('')}</div>${q.pick!=null?`<div class="why">${q.pick===0?tx.quiz.why:T('l.notYet')}</div>`:''}</div>
    <div id="donebox"></div>
    <div class="lnav"><button class="btn sm" data-nav="-1" ${idx===0?'disabled':''}>${T('l.prev')}</button><button class="btn sm" data-reset>${T('l.reset')}</button><button class="btn sm ${store.done[L.id]?'pri':''}" data-nav="1" ${idx===LESSONS.length-1?'disabled':''}>${T('l.next')}</button></div></div>`;
  goalState=[];checkGoals()}
function checkGoals(){if(mode!=='lesson'||!L)return;const x=ctx();const sk=STICK[L.id]||(STICK[L.id]=[]);const tx=TL(L.id);
  const st=L.goals.map((g,i)=>{let v=false;try{v=!!g(x)}catch(e){}return sk[i]=v||!!sk[i]});
  const el=$('#goals');if(!el)return;
  el.innerHTML=tx.goals.map((g,i)=>`<li class="${st[i]?'ok':''}"><span class="ck"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg></span><span>${g}</span></li>`).join('');
  st.forEach((v,i)=>{if(v&&goalState.length&&!goalState[i])toast(T('toast.step',{i:i+1}))});goalState=st;maybeComplete()}
function maybeComplete(){const all=goalState.length&&goalState.every(Boolean);const q=QZ[L.id]||{};
  if(all&&q.ok&&!store.done[L.id]){store.done[L.id]=true;const gain=20+(q.first?5:0);store.xp+=gain;save();renderXP();toast(T('toast.done',{xp:gain}));
    document.querySelector('[data-nav="1"]')?.classList.add('pri')}
  const db=$('#donebox');if(!db)return;
  db.innerHTML=store.done[L.id]?`<div class="donebox"><svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><path d="M9.5 16.5l4.2 4.2 8.8-9.2" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>${T('l.doneTitle')}</b><br><small>${T('l.doneSub')}</small></div></div>`
    :(all&&!q.ok?`<p class="why">${T('l.needQuiz')}</p>`:(!all&&q.ok?`<p class="why">${T('l.needMission')}</p>`:''))}
$('#lesson').addEventListener('click',e=>{if(mode!=='lesson'){const r=e.target.closest('[data-recipe]');if(r)loadRecipe(+r.dataset.recipe);return}
  const qb=e.target.closest('[data-q]');if(qb){const i=+qb.dataset.q;const q=QZ[L.id]||(QZ[L.id]={tries:0});q.tries++;q.pick=i;if(i===0){q.ok=true;q.first=q.tries===1}renderLesson();return}
  const nv=e.target.closest('[data-nav]');if(nv&&!nv.disabled){const i=LESSONS.indexOf(L)+ +nv.dataset.nav;openLesson(LESSONS[i].id);$('#lesson').scrollTop=0;return}

 ['histogram',['l3']],['scatter',['l4','l12']],['featsel',['l5','l18']],['missing',['l6']],['imputation',['l6']],['normalization',['l7']],
 ['classification',['l8']],['learner',['l8','l10']],['knn',['l8']],['cv',['l8','l16']],['fold',['l8']],['stratified',['l8']],['ca',['l8','l10']],
 ['precision',['l10']],['recall',['l10']],['f1',['l10']],['imbalance',['l10','l17']],['tree',['l9']],['depth',['l9','l16']],['nb',['l10']],
