<style>

:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#E9EEF2; --ink:#14202A; --muted:#5A6873; --line:#D9E1E7;
  --accent:#0B7285; --accent-ink:#FFFFFF; --accent-soft:#DDF0F3;
  --ok:#1D7A4C; --ok-soft:#E1F2E8; --bad:#B8362A; --bad-soft:#FBE7E4; --gold:#B7791F;
  --lv-beg:#1D7A4C; --lv-int:#2F5FBF; --lv-adv:#0B7285;
  --night:#0B1026;
  --f-display:"Outfit", "Segoe UI", system-ui, sans-serif;
  --f-body:"Work Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,32,42,.06), 0 6px 24px -12px rgba(20,32,42,.22);
}
:root[data-theme="dark"]{
  --bg:#0A0F1A; --surface:#111827; --surface-2:#1A2333; --ink:#E8EEF5; --muted:#9AA7B6; --line:#263247;
  --accent:#66D9E8; --accent-ink:#04222A; --accent-soft:#12303A;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5BCB90; --lv-int:#8EA9F0; --lv-adv:#66D9E8;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}

.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}

.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}

.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}

.quiz{padding:20px;margin-top:4px}

.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}

.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}

.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}

.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}

.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}

.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}

.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}

las, anos-luz, nebulosas e a escala do Universo.","es":"Colores de las estrellas, años luz, nebulosas y la escala del Universo."}}],"lessons":[{"id":"sphere","track":"sky","mins":3,"title":{"en":"The celestial sphere","pt":"A esfera celeste","es":"La esfera celeste"},"intro":{"en":"Look up on a clear night and the sky seems to be a giant dome over you. Astronomers use that idea, the celestial sphere, to describe where things are: every star has a direction, even if the distances are wildly different.","pt":"Olhe para cima numa noite limpa e o céu parece uma cúpula gigante sobre você. Os astrônomos usam essa ideia, a esfera celeste, para dizer onde as coisas estão: cada estrela tem uma direção, mesmo que as distâncias sejam muito diferentes.","es":"Mira hacia arriba en una noche despejada y el cielo parece una cúpula gigante sobre ti. Los astrónomos usan esa idea, la esfera celeste, para decir dónde están las cosas: cada estrella tiene una dirección, aunque las distancias sean muy distintas."},"ideas":[{"en":"The **horizon** is the edge of the sky; the **zenith** is the point straight overhead.","pt":"O **horizonte** é a borda do céu; o **zênite** é o ponto bem acima da sua cabeça.","es":"El **horizonte** es el borde del cielo; el **cenit** es el punto justo sobre tu cabeza."},{"en":"**Altitude** is the angle above the horizon (0° to 90°); **azimuth** is the direction along it, from North (0°) through East (90°).","pt":"**Altura** é o ângulo acima do horizonte (0° a 90°); **azimute** é a direção ao longo dele, a partir do Norte (0°) passando pelo Leste (90°).","es":"La **altura** es el ángulo sobre el horizonte (0° a 90°); el **acimut** es la dirección a lo largo de él, desde el Norte (0°) pasando por el Este (90°)."},{"en":"A sky map is drawn as if you lie on your back: North at the top, so **East is on the left**.","pt":"Um mapa do céu é desenhado como se você estivesse deitado de costas: Norte em cima, então **o Leste fica à esquerda**.","es":"Un mapa del cielo se e 0° en el horizonte a 90° en el cenit."}}},{"id":"magnitude","track":"sky","mins":4,"title":{"en":"Brightness and magnitude","pt":"Brilho e magnitude","es":"Brillo y magnitud"},"intro":{"en":"Stars are not all equally bright. Around 130 BC Hipparchus sorted them into six classes, and astronomers still use his scale, called magnitude.","pt":"As estrelas não têm todas o mesmo brilho. Por volta de 130 a.C., Hiparco as separou em seis classes, e os astrônomos ainda usam essa escala, chamada magnitude.","es":"No todas las estrellas brillan igual. Hacia el 130 a. C., Hiparco las clasificó en seis clases, y los astrónomos aún usan esa escala, llamada magnitud."},"ideas":[{"en":"**Smaller magnitude means brighter**: magnitude 1 is brighter than magnitude 3.","pt":"**Magnitude menor quer dizer mais brilho**: magnitude 1 é mais brilhante que magnitude 3.","es":"**Menor magnitud significa más brillo**: magnitud 1 es más brillante que magnitud 3."},{"en":"The very brightest have negative magnitudes: Sirius is −1.46.","pt":"As mais brilhantes têm magnitude negativa: Sírius tem −1,46.","es":"Las más brillantes tienen magnitud negativa: Sirio tiene −1,46."},{"en":"Five magnitudes are a factor of 100 in brightness. Under a dark sky the eye reaches about magnitude 6.","pt":"Cinco magnitudes equivalem a 100 vezes mais brilho. Num céu escuro, o olho chega a cerca de magnitude 6.","es":"Cinco magnitudes equivalen a 100 veces más brillo. Con cielo oscuro, el ojo llega a magnitud 6 aproximadamente."}],"mission":{"kind":"tap","view":{"loc":{"lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas, Brazil","pt":"Campinas, Brasil","es":"Campinas, Brasil"}},"t":"2027-01-16T01:00:00Z"},"layers":{},"targets":[{"brightest":3}],"prompt":{"en":"Tap the **three brightest stars** in this sky (not planets). Bigger dots are brighter.","pt":"Toque nas **três estrelas mais brilhantes** deste céu (planetas não contam). Pontos maiores são mais brilhantes.","es":"Toca las **tres estrellas más brillantes** de este cielo (los planetas no cuentan). Los puntos más grandes son más brillantes."},"hint":{"en":"Sirius and Canopus are the two largest dots. The third is lower in the sky: look near the horizon too.","pt":"Sírius e Canopus são os dois maiores pontos. A terceira está mais baixa: olhe também perto do horizonte.","es":"Sirio y Canopus son los dos puntos más grandes. La tercera está más baja: mira también cerca del horizonte."}},"quiz":{"q":{"en":"Which star is brightest?","pt":"Qual estrela é a mais brilhante?","es":"¿Qué estrella es la más brillante?"},"options":[{"en":"Magnitude −0.7","pt":"Magnitude −0,7","es":"Magnitud −0,7"},{"en":"Magnitude 0.5","pt":"Magnitude 0,5","es":"Magnitud 0,5"},{"en":"Magnitude 4","pt":"Magnitude 4","es":"Magnitud 4"}],"answer":0,"explain":{"en":"The lower the number, the brighter the star; negative numbers are brightest of all.","pt":"Quanto menor o número, mais brilhante; os negativos são os mais brilhantes.","es":"Cuanto menor el número, más brillante; los negativos son los más brillantes."}}},{"id":"constellations","track":"sky","mins":4,"title":{"en":"Constellations","pt":"Constelações","es":"Constelaciones"},"intro":{"en":"Constellations are patterns that people drew between stars. Today the sky is split into 88 official constellations, like countries on a map.","pt":"Constelações são desenhos que as pessoas fizeram ligando estrelas. Hoje o céu é dividido em 88 constelações oficiais, como países num mapa.","es":"Las constelaciones son dibujos que la gente trazó entre las estrellas. Hoy el cielo se divide en 88 constelaciones oficiales, como países en un mapa."},"ideas":[{"en":"The stars of a constellation are usually far apart in space: they only line up from our point of view.","pt":"As estrelas de uma constelação costumam estar muito distantes entre si: só parecem juntas do nosso ponto de vista.","es":"Las estrellas de una constelación suelen estar muy lejos entre sí: solo se alinean desde nuestro punto de vista."},{"en":"**Orion** is easy to find in summer evenings in the south (winter in the north): three stars in a row form its **Belt**.","pt":"**Órion** é fácil de achar nas noites de verão no hemisfério sul (inverno no norte): três estrelas em fila formam o **Cinturão** (as Três Marias).","es":"**Orión** es fácil de encontrar en las noches de verano del hemisferio sur (invierno en el norte): tres estrellas en fila forman su **Cinturón** (las Tres Marías)."},{"en":"Smaller patterns inside constellations, like the Big Dipper, are called **asterisms**.","pt":"Desenhos menores dentro das constelações, como as Três Marias, se chamam **asterismos**.","es":"Los dibujos más pequeños dentro de las constelaciones, como las Tres Marías, se llaman **asterismos**."}],"mission":{"kind":"tap","view":{"loc":{"lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas, Brazil","pt":"Campinas, Brasil","es":"Campinas, Brasil"}},"t":"2027-01-16T01:00:00Z"},"layers":{"lines":true,"cnames":true},"targets":[{"star":26727},{"star":26311},{"star":25930}],"prompt":{"en":"Find Orion and tap the **three stars of its Belt**.","pt":"Ache Órion e toque nas **três estrelas do Cinturão** (as Três Marias).","es":"Encuentra Orión y toca las **tres estrellas del Cinturón** (las Tres Marías)."},"hint":{"en":"Orion is high up, near the centre: look for three similar stars in a short straight line between two bright stars (Rigel and Betelgeuse).","pt":"Órion está alto, perto do centro: procure três estrelas parecidas numa fila curta entre duas estrelas brilhantes (Rigel e Betelgeuse).","es":"Orión está alto, cerca del centro: busca tres estrellas parecidas en una fila corta entre dos estrellas brillantes (Rigel y Betelgeuse)."}},"quiz":{"q":{"en":"How many official constellations are there?","pt":"Quantas constelações oficiais existem?","es":"¿Cuántas constelaciones oficiales hay?"},"options":[{"en":"About 6,000","pt":"Cerca de 6.000","es":"Unas 6.000"},{"en":"88","pt":"88","es":"88"},{"en":"12","pt":"12","es":"12"}],"answer":1,"explain":{"en":"The International Astronomical Union fixed 88 constellations in 1922; 12 is only the zodiac, and 6,000 is the number of stars visible to the eye.","pt":"A União Astronômica Internacional fixou 88 constelações em 1922; 12 é só o zodíaco, e 6.000 é o número de estrelas visíveis a olho nu.","es":"La Unión Astronómica Internacional fijó 88 constelaciones en 1922; 12 es solo el zodiaco, y 6.000 es el número de estrellas visibles a simple vista."}}},{"id":"poles","track":"sky","mins":4,"title":{"en":"Finding north with Polaris","pt":"Achando o norte pela Polar","es":"Encontrar el norte con la Polar"},"intro":{"en":"The Earth spins around an axis, and that axis points to two spots in the sky: the celestial poles. Near the north pole there happens to be a fairly bright star, Polaris.","pt":"A Terra gira em torno de um eixo, e esse eixo aponta para dois pontos do céu: os polos celestes. Perto do polo norte existe uma estrela razoavelmente brilhante, a Polar.","es":"La Tierra gira alrededor de un eje, y ese eje apunta a dos puntos del cielo: los polos celestes. Cerca del polo norte hay una estrella bastante brillante, la Polar."},"ideas":[{"en":"Polaris hardly moves during the night, so it shows where **north** is.","pt":"A Polar quase não se mexe durante a noite, por isso mostra onde fica o **norte**.","es":"La Polar casi no se mueve durante la noche, por eso indica dónde está el **norte**."},{"en":"Find it with the **pointers**: the two end stars of the Big Dipper (Dubhe and Merak) point to it.","pt":"Ache-a pelos **ponteiros**: as duas estrelas da ponta da Ursa Maior (Dubhe e Merak) apontam para ela.","es":"Encuéntrala con los **punteros**: las dos estrellas del extremo de la Osa Mayor (Dubhe y Merak) apuntan a ella."},{"en":"In the Southern Hemisphere Polaris is below the horizon; there the **Southern Cross** helps find the south pole.","pt":"No Hemisfério Sul a Polar fica abaixo do horizonte; lá o **Cruzeiro do Sul** ajuda a achar o polo sul.","es":"En el hemisferio sur la Polar está bajo el horizonte; allí la **Cruz del Sur** ayuda a encontrar el polo sur."}],"mission":{"kind":"tap","view":{"loc":{"lat":38.72,"lon":-9.14,"tz":0,"name":{"en":"Lisbon, Portugal","pt":"Lisboa, Portugal","es":"Lisboa, Portugal"}},"t":"2027-03-15T22:00:00Z"},"layers":{"lines":true,"cnames":true},"ordered":true,"targets":[{"star":53910},{"star":54061},{"star":11767}],"prompt":{"en":"In the sky of Lisbon, tap the pointers **Merak**, then **Dubhe**, then follow them to **Polaris**.","pt":"No céu de Lisboa, toque nos ponteiros **Merak**, depois **Dubhe**, e siga a direção até a **Polar**.","es":"En el cielo de Lisboa, toca los punteros **Merak**, luego **Dubhe**, y sigue su dirección hasta la **Polar**."},"hint":{"en":"The Big Dipper (in Ursa Major) is high in the north. Merak is the bottom of the 'bowl' farther from the handle; extend Merak→Dubhe about five times.","pt":"A Ursa Maior está alta, ao norte. Merak é o fundo da 'concha' longe do cabo; prolongue Merak→Dubhe umas cinco vezes.","es":"La Osa Mayor está alta, al norte. Merak es el fondo del 'cazo' lejos del mango; prolonga Merak→Dubhe unas cinco veces."}},"quiz":{"q":{"en":"Why does Polaris stay almost still?","pt":"Por que a Polar fica quase parada?","es":"¿Por qué la Polar se queda casi quieta?"},"options":[{"en":"It is the closest star to us","pt":"É a estrela mais próxima de nós","es":"Es la estrella más cercana a nosotros"},{"en":"It is the brightest star","pt":"É a estrela mais brilhante","es":"Es la estrella más brillante"},{"en":"It is near the point the Earth's axis points to","pt":"Ela está perto do ponto para onde aponta o eixo da Terra","es":"Está cerca del punto al que apunta el eje de la Tierra"}],"answer":2,"explain":{"en":"Everything turns around the celestial poles; Polaris is less than 1° from the north pole. It is neither the closest nor the brightest star.","pt":"Tudo gira em torno dos polos celestes; a Polar está a menos de 1° do polo norte. Ela não é nem a mais próxima nem a mais brilhante.","es":"Todo gira alrededor de los polos celestes; la Polar está a menos de 1° del polo norte. No es ni la más cercana ni la más brillante."}}},{"id":"daily","track":"motion","mins":4,"title":{"en":"Daily motion","pt":"Movimento diário","es":"Movimiento diario"},"intro":{"en":"Over a night the stars rise in the east, climb, and set in the west. It's not the stars moving: it's the Earth turning once a day.","pt":"Ao longo da noite as estrelas nascem no leste, sobem e se põem no oeste. Não são elas que se movem: é a Terra girando uma vez por dia.","es":"A lo largo de la noche las estrellas salen por el este, suben y se ponen por el oeste. No se mueven ellas: es la Tierra girando una vez al día."},"ideas":[{"en":"The whole sky turns 15° per hour around the celestial poles.","pt":"O céu inteiro gira 15° por hora em torno dos polos celestes.","es":"Todo el cielo gira 15° por hora alrededor de los polos celestes."},{"en":"Each star reaches its highest point when it crosses the **meridian**, the north–south line through the zenith.","pt":"Cada estrela chega ao ponto mais alto quando cruza o **meridiano**, a linha norte–sul que passa pelo zênite.","es":"Cada estrella alcanza su punto más alto al cruzar el **meridiano**, la línea norte–sur que pasa por el cenit."},{"en":"The stars come back to the same place about 4 minutes earlier each night: a **sidereal day** lasts 23 h 56 min.","pt":"As estrelas voltam ao mesmo lugar cerca de 4 minutos mais cedo a cada noite: o **dia sideral** dura 23 h 56 min.","es":"Las estrellas vuelven al mismo lugar unos 4 minutos antes cada noche: el **día sidéreo** dura 23 h 56 min."}],"mission":{"kind":"sky","view":{"loc":{"lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas, Brazil","pt":"Campinas, Brasil","es":"Campinas, Brasil"}},"t":"2027-01-15T22:00:00Z"},"layers":{"lines":true},"control":{"k":"time","min":0,"max":10,"step":0.05,"start":0},"goal":{"type":"transit","star":32349},"follow":32349,"prompt":{"en":"Move the clock and find the moment **Sirius** is highest in the sky (it crosses the meridian).","pt":"Mova o relógio e ache o momento em que **Sírius** fica mais alta no céu (quando cruza o meridiano).","es":"Mueve el reloj y encuentra el momento en que **Sirio** está más alta en el cielo (cuando cruza el meridiano)."},"hint":{"en":"Watch Sirius's altitude: it grows, stops growing, then falls. Stop where it peaks, close to midnight.","pt":"Observe a altura de Sírius: ela sobe, para de subir e depois cai. Pare no pico, perto da meia-noite.","es":"Observa la altura de Sirio: sube, deja de subir y luego baja. Para en el máximo, cerca de la medianoche."}},"quiz":{"q":{"en":"How many degrees does the sky turn in 2 hours?","pt":"Quantos graus o céu gira em 2 horas?","es":"¿Cuántos grados gira el cielo en 2 horas?"},"options":[{"en":"30°","pt":"30°","es":"30°"},{"en":"15°","pt":"15°","es":"15°"},{"en":"90°","pt":"90°","es":"90°"}],"answer":0,"explain":{"en":"360° in about 24 hours is 15° per hour, so 30° in two hours.","pt":"360° em cerca de 24 horas dá 15° por hora, então 30° em duas horas.","es":"360° en unas 24 horas son 15° por hora, así que 30° en dos horas."}}},{"id":"seasons","track":"motion","mins":4,"title":{"en":"The Sun's path and the seasons","pt":"O caminho do Sol e as estações","es":"El camino del Sol y las estaciones"},"intro":{"en":"The Earth's axis is tilted 23.4°. As we go around the Sun, each hemisphere leans toward it for half the year: the Sun climbs higher, days get longer, and it's summer.","pt":"O eixo da Terra é inclinado 23,4°. Enquanto damos a volta no Sol, cada hemisfério fica inclinado para ele metade do ano: o Sol sobe mais, os dias ficam mais longos e é verão.","es":"El eje de la Tierra está inclinado 23,4°. Mientras damos la vuelta al Sol, cada hemisferio se inclina hacia él la mitad del año: el Sol sube más, los días son más largos y es verano."},"ideas":[{"en":"Seasons come from the **tilt**, not from the distance to the Sun (we are closest in January).","pt":"As estações vêm da **inclinação**, não da distância ao Sol (ficamos mais perto em janeiro).","es":"Las estaciones vienen de la **inclinación**, no de la distancia al Sol (estamos más cerca en enero)."},{"en":"The longest day is the **summer solstice**: around 21 December in the south, 21 June in the north.","pt":"O dia mais longo é o **solstício de verão**: por volta de 21 de dezembro no sul e 21 de junho no norte.","es":"El día más largo es el **solsticio de verano**: hacia el 21 de diciembre en el sur y el 21 de junio en el norte."},{"en":"At the **equinoxes** (March and September) day and night are about 12 hours everywhere.","pt":"Nos **equinócios** (março e setembro) o dia e a noite têm cerca de 12 horas em todo lugar.","es":"En los **equinoccios** (marzo y septiembre) el día y la noche duran unas 12 horas en todas partes."}],"mission":{"kind":"sky","view":{"loc":{"lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas, Brazil","pt":"Campinas, Brasil","es":"Campinas, Brasil"}},"t":"2027-01-01T15:00:00Z"},"layers":{},"control":{"k":"day","min":0,"max":364,"step":1,"start":151},"goal":{"type":"dayMax","tol":0.02},"show":["daylen","noon"],"prompt":{"en":"In Campinas, move through the year and find the day with the **most daylight**.","pt":"Em Campinas, percorra o ano e ache o dia com **mais horas de Sol**.","es":"En Campinas, recorre el año y encuentra el día con **más horas de luz**."},"hint":{"en":"Campinas is in the Southern Hemisphere, so summer is at the end of the year. Watch the day length and the Sun's noon altitude.","pt":"Campinas fica no Hemisfério Sul, então o verão é no fim do ano. Observe a duração do dia e a altura do Sol ao meio-dia.","es":"Campinas está en el hemisferio sur, así que el verano es a fin de año. Observa la duración del día y la altura del Sol al mediodía."}},"quiz":{"q":{"en":"What causes the seasons?","pt":"O que causa as estações do ano?","es":"¿Qué causa las estaciones?"},"options":[{"en":"The Moon's phases","pt":"As fases da Lua","es":"Las fases de la Luna"},{"en":"The tilt of the Earth's axis","pt":"A inclinação do eixo da Terra","es":"La inclinación del eje de la Tierra"},{"en":"The changing distance to the Sun","pt":"A distância variável ao Sol","es":"La distancia variable al Sol"}],"answer":1,"explain":{"en":"The tilt changes how high the Sun climbs and how long it stays up. The distance changes only about 3%.","pt":"A inclinação muda a altura do Sol e quanto tempo ele fica no céu. A distância varia só uns 3%.","es":"La inclinación cambia cuánto sube el Sol y cuánto tiempo está arriba. La distancia varía solo un 3%."}}},{"id":"latitude","track":"motion","mins":3,"title":{"en":"Your latitude shapes the sky","pt":"Sua latitude muda o céu","es":"Tu latitud cambia el cielo"},"intro":{"en":"Travel north or south and the sky changes: some stars disappear below the horizon, others appear. The height of the celestial pole tells you exactly where you are.","pt":"Viaje para o norte ou para o sul e o céu muda: algumas estrelas somem abaixo do horizonte, outras aparecem. A altura do polo celeste diz exatamente onde você está.","es":"Viaja al norte o al sur y el cielo cambia: unas estrellas desaparecen bajo el horizonte y otras aparecen. La altura del polo celeste dice exactamente dónde estás."},"ideas":[{"en":"The altitude of the celestial pole equals your **latitude**.","pt":"A altura do polo celeste é igual à sua **latitude**.","es":"La altura del polo celeste es igual a tu **latitud**."},{"en":"At the Equator both poles sit on the horizon; at the North Pole, Polaris is at the zenith.","pt":"No Equador os dois polos ficam no horizonte; no Polo Norte, a Polar fica no zênite.","es":"En el Ecuador los dos polos están en el horizonte; en el Polo Norte, la Polar está en el cenit."},{"en":"Sailors used this to measure latitude long before GPS.","pt":"Os navegadores usavam isso para medir a latitude muito antes do GPS.","es":"Los navegantes lo usaban para medir la latitud  de 1° por dia, num caminho chamado eclíptica. As constelações nesse caminho formam o zodíaco.","es":"Mientras la Tierra orbita, el Sol parece desplazarse frente a las estrellas de fondo, cerca de 1° al día, por un camino llamado eclíptica. Las constelaciones de ese camino forman el zodiaco."},"ideas":[{"en":"The **ecliptic** is the Sun's yearly path; the planets and the Moon stay close to it.","pt":"A **eclíptica** é o caminho anual do Sol; os planetas e a Lua ficam perto dela.","es":"La **eclíptica** es el camino anual del Sol; los planetas y la Luna quedan cerca de ella."},{"en":"The real constellation borders are uneven: the Sun spends 37 days in Virgo but only 7 in Scorpius, and also crosses **Ophiuchus**.","pt":"As fronteiras reais das constelações são desiguais: o Sol passa 37 dias em Virgem e só 7 em Escorpião, e também cruza o **Ofiúco**.","es":"Los límites reales de las constelaciones son desiguales: el Sol pasa 37 días en Virgo y solo 7 en Escorpio, y también cruza **Ofiuco**."},{"en":"Astrology's 'signs' are fixed 30° slices set 2,000 years ago; precession has since shifted them about one constellation.","pt":"Os 'signos' da astrologia são fatias fixas de 30° definidas há 2.000 anos; a precessão os deslocou cerca de uma constelação desde então.","es":"Los 'signos' de la astrología son porciones fijas de 30° definidas hace 2.000 años; la precesión los ha desplazado cerca de una constelación desde entonces."}],"mission":{"kind":"sky","view":{"loc":{"lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas, Brazil","pt":"Campinas, Brasil","es":"Campinas, Brasil"}},"t":"2027-01-01T15:00:00Z"},"layers":{},"control":{"k":"day","min":0,"max":364,"step":1,"start":0},"goal":{"type":"sunIn","c":"Leo"},"show":["suncon"],"prompt":{"en":"Move through the year until the Sun is **in the constellation Leo**.","pt":"Percorra o ano até o Sol estar **na constelação de Leão**.","es":"Recorre el año hasta que el Sol esté **en la constelación de Leo**."},"hint":{"en":"On 1 Jan ar."}}},{"id":"waxing","track":"moon","mins":4,"title":{"en":"Waxing or waning?","pt":"Crescente ou minguante?","es":"¿Creciente o menguante?"},"intro":{"en":"Between new and full the lit part grows (waxing); after full it shrinks (waning). Which side is lit depends on your hemisphere.","pt":"Entre a nova e a cheia a parte iluminada cresce (crescente); depois da cheia ela diminui (minguante). O lado iluminado depende do seu hemisfério.","es":"Entre la nueva y la llena la parte iluminada crece (creciente); después de la llena disminuye (menguante). El lado iluminado depende de tu hemisferio."},"ideas":[{"en":"Seen from the Northern Hemisphere, a waxing Moon is lit on the **right**; from the Southern Hemisphere, on the **left**.","pt":"Vista do Hemisfério Norte, a Lua crescente é iluminada à **direita**; do Hemisfério Sul, à **esquerda**.","es":"Vista desde el hemisferio norte, la Luna creciente está iluminada a la **derecha**; desde el hemisferio sur, a la **izquierda**."},{"en":"The lit side always faces the Sun: a waxing Moon is in the evening sky, after sunset.","pt":"O lado iluminado sempre aponta para o Sol: a Lua crescente aparece no céu da tarde e da noite, depois do pôr do Sol.","es":"El lado iluminado siempre mira al Sol: la Luna creciente está en el cielo de la tarde, tras la puesta del Sol."},{"en":"**Gibbous** means more than half lit; **crescent**, less than half.","pt":"**Gibosa** quer dizer mais da metade iluminada; **crescente** (fina), menos da metade.","es":"**Gibosa** significa más de la mitad iluminada; **creciente** (fina), menos de la mitad."}],"note":{"en":"The drawings show the Moon as seen from the hemisphere marked on each one.","pt":"Os desenhos mostram a Lua vista do hemisfério indicado em cada um.","es":"Los dibujos muestran la Luna vista desde el hemisferio indicado en cada uno."},"mission":{"kind":"rounds","rounds":[{"vis":{"type":"moon","elong":50},"q":{"en":"Which phase is this?","pt":"Que fase é esta?","es":"¿Qué fase es esta?"},"opt iz o quanto a elipse é achatada (0 = círculo).","es":"El **semieje mayor** a es la distancia media; la **excentricidad** e indica cuánto se alarga la elipse (0 = círculo)."},{"en":"Planets have small e (Earth 0.017); many comets are very eccentric.","pt":"Os planetas têm e pequena (Terra 0,017); muitos cometas são muito excêntricos.","es":"Los planetas tienen e pequeña (Tierra 0,017); muchos cometas son muy excéntricos."},{"en":"The closest point to the Sun is the **perihelion**, the farthest the **aphelion**.","pt":"O ponto mais perto do Sol é o **periélio**; o mais longe, o **afélio**.","es":"El punto más cercano al Sol es el **perihelio**; el más lejano, el **afelio**."}],"mission":{"kind":"kepler","kep":{"a":1,"e":0},"controls":["a","e"],"goal":{"type":"halley"},"prompt":{"en":"Build an orbit like **Halley's comet**: semi-major axis between 15 and 20 AU and eccentricity of at least 0.9.","pt":"Monte uma órbita como a do **cometa Halley**: semieixo maior entre 15 e 20 UA e excentricidade de pelo menos 0,9.","es":"Construye una órbita como la del **cometa Halley**: semieje mayor entre 15 y 20 UA y excentricidad de al menos 0,9."},"hint":{"en":"Halley has a ≈ 17.8 AU and e ≈ 0.97. Move both sliders.","pt":"O Halley tem a ≈ 17,8 UA e e ≈ 0,97. Mexa os dois controles.","es":"El Halley tiene a ≈ 17,8 UA y e ≈ 0,97. Mueve los dos controles."}},"quiz":{"q":{"en":"An orbit with eccentricity 0 is…","pt":"Uma órbita com excentricidade 0 é…","es":"Una órbita con excentricidad 0 es…"},"options":[{"en":"A circle","pt":"Um círculo","es":"Un círculo"},{"en":"A straight line","pt":"Uma linha reta","es":"Una línea recta"},{"en":"A very long ellipse","pt":"Uma elipse bem alongada","es":"Una elipse muy alargada"}],"answer":0,"explain":{"en":"e = 0 is a perfect circle; as e approaches 1 the ellipse gets longer and longer.","pt":"e = 0 é um círculo perfeito; quando e se aproxima de 1, a elipse fica cada vez mais alongada.","es":"e = 0 es un círculo perfecto; cuando e se acerca a 1, la elipse se alarga cada vez más."}}},{"id":"areas","track":"orbits","mins":4,"title":{"en":"Kepler 2: equal areas","pt":"Kepler 2: áreas iguais","es":"Kepler 2: áreas iguales"},"intro":{"en":"Kepler's second law: the line from the Sun to a planet sweeps equal areas in equal times. So a planet speeds up near the Sun and slows down far away.","pt":"A segunda lei de Kepler: a linha do Sol ao planeta varre áreas iguais em tempos iguais. Então o planeta acelera perto do Sol e desacelera longe dele.","es":"La segunda ley de Kepler: la línea del Sol al planeta barre áreas iguales en tiempos iguales. Así el planeta acelera cerca del Sol y frena lejos de él."},"ideas":[{"en":"The coloured slices in the simulator all take the same time and have the same area.","pt":"As fatias coloridas do simulador levam o mesmo tempo e têm a mesma área.","es":"Las porciones de colores del simulador tardan lo mismo y tienen la misma área."},{"en":"The planet is **fastest at perihelion** and slowest at aphelion.","pt":"O planeta é **mais rápido no periélio** e mais lento no afélio.","es":"El planeta es **más rápido en el perihelio** y más lento en el afelio."},{"en":"The Earth moves at 30.3 km/s in early January and 29.3 km/s in early July.","pt":"A Terra anda a 30,3 km/s no começo de janeiro e a 29,3 km/s no começo de julho.","es":"La Tierra va a 30,3 km/s a principios de enero y a 29,3 km/s a principios de julio."}],"mission":{"kind":"kepler","kep":{"a":3,"e":0.6},"controls":[],"goal":{"type":"tapFast"},"prompt":{"en":"Watch the planet sweep equal areas, then **tap the point of the orbit where it moves fastest**.","pt":"Observe o planeta varrer áreas iguais e depois **toque no ponto da órbita em que ele anda mais rápido**.","es":"Observa el planeta barrer áreas iguales y luego **toca el punto de la órbita donde va más rápido**."},"hint":{"en":"The thinnest, longest slices are where it moves fastest: next to the Sun.","pt":"As fatias mais finas e compridas mostram onde ele anda mais rápido: a  excentricidad."}],"mission":{"kind":"kepler","kep":{"a":1,"e":0.05},"controls":["a","e"],"goal":{"type":"period","lo":11.5,"hi":12.3},"prompt":{"en":"Set an orbit with a **period of about 12 years**, like Jupiter's.","pt":"Ajuste uma órbita com **período de cerca de 12 anos**, como a de Júpiter.","es":"Ajusta una órbita con un **período de unos 12 años**, como la de Júpiter."},"hint":{"en":"P² = a³ → a = P^(2/3). For 12 years, a ≈ 5.2 AU.","pt":"P² = a³ → a = P^(2/3). Para 12 anos, a ≈ 5,2 UA.","es":"P² = a³ → a = P^(2/3). Para 12 años, a ≈ 5,2 UA."}},"quiz":{"q":{"en":"A planet at 4 AU takes how long to orbit?","pt":"Um planeta a 4 UA leva quanto tempo para dar a volta?","es":"¿Cuánto tarda en orbitar un planeta a 4 UA?"},"options":[{"en":"4 years","pt":"4 anos","es":"4 años"},{"en":"16 years","pt":"16 anos","es":"16 años"},{"en":"8 years","pt":"8 anos","es":"8 años"}],"answer":2,"explain":{"en":"a³ = 64, so P² = 64 and P = 8 years.","pt":"a³ = 64, então P² = 64 e P = 8 anos.","es":"a³ = 64, así que P² = 64 y P = 8 años."}}},{"id":"speed","track":"orbits","mins":4,"title":{"en":"Gravity and orbital speed","pt":"Gravidade e velocidade orbital","es":"Gravedad y velocidad orbital"},"intro":{"en":"Newton explained Kepler's laws with gravity: a planet is always falling toward the Sun, but moves sideways fast enough to keep missing it.","pt":"Newton explicou as leis de Kepler com a gravidade: o planeta está sempre caindo em direção ao Sol, mas anda de lado rápido o bastante para nunca acertá-lo.","es":"Newton explicó las leyes de Kepler con la gravedad: el planeta está siempre cayendo hacia el Sol, pero se mueve de lado tan rápido que nunca lo alcanza."},"ideas":[{"en":"Gravity weakens with the square of the distance.","pt":"A gravidade enfraquece com o quadrado da distância.","es":"La gravedad se debilita con el cuadrado de la distancia."},{"en":"On a circular orbit the speed is v = 29.8 / √a km/s (a in AU): closer means faster.","pt":"Numa órbita circular a velocidade sto sobre la cabeza; altura 90°."}},{"term":{"en":"Altitude","pt":"Altura","es":"Altura"},"def":{"en":"Angle of an object above the horizon, from 0° to 90°.","pt":"Ângulo de um objeto acima do horizonte, de 0° a 90°.","es":"Ángulo de un objeto sobre el horizonte, de 0° a 90°."}},{"term":{"en":"Azimuth","pt":"Azimute","es":"Acimut"},"def":{"en":"Direction along the horizon, measured from North (0°) through East (90°), South (180°) and West (270°).","pt":"Direção ao longo do horizonte, medida a partir do Norte (0°) passando por Leste (90°), Sul (180°) e Oeste (270°).","es":"Dirección a lo largo del horizonte, medida desde el Norte (0°) pasando por Este (90°), Sur (180°) y Oeste (270°)."}},{"term":{"en":"Meridian","pt":"Meridiano","es":"Meridiano"},"def":{"en":"The north–south line through the zenith. Objects are highest when they cross it.","pt":"A linha norte–sul que passa pelo zênite. Os astros ficam mais altos ao cruzá-la.","es":"La línea norte–sur que pasa por el cenit. Los astros están más altos al cruzarla."}},{"term":{"en":"Magnitude","pt":"Magnitude","es":"Magnitud"},"def":{"en":"Brightness scale: smaller numbers are brighter; 5 magnitudes = 100 times.","pt":"Escala de brilho: números menores são mais brilhantes; 5 magnitudes = 100 vezes.","es":"Escala de brillo: números menores son más brillantes; 5 magnitudes = 100 veces."}},{"term":{"en":"Constellation","pt":"Constelação","es":"Constelación"},"def":{"en":"One of the 88 regions of the sky defined by the IAU, usually named after a traditional star pattern.","pt":"Uma das 88 regiões do céu definidas pela UAI, em geral com o nome de um desenho tradicional de estrelas.","es":"Una de las 88 regiones del cielo definidas por la UAI, normalmente con el nombre de un dibujo tradicional de estrellas."}},{"term":{"en":"Asterism","pt":"Asterismo","es":"Asterismo"},"def":{"en":"A recognisable star pattern that is not an official constellation, such as Orion's Belt or the Big Dipper.","pt":"Um desenho de estrelas reconhecível que não é constelação oficial, como as Três Marias ou o Cruzeiro.","es":"Un dibujo de estrellas reconocible que no es una constelación oficial, como las Tres Marías."}},{"term":{"en":"Celestial pole","pt":"Polo celeste","es":"Polo celeste"},"def":{"en":"The points in the sky the Earth's axis points to; the sky turns around them.","pt":"Os pontos do céu para onde aponta o eixo da Terra; o céu gira em torno deles.","es":"Los puntos del cielo a los que apunta el eje de la Tierra; el cielo gira a su alrededor."}},{"term":{"en":"Polaris","pt":"Estrela Polar","es":"Estrella Polar"},"def":{"en":"Star less than 1° from the north celestial pole; its altitude equals your latitude.","pt":"Estrela a menos de 1° do polo celeste norte; a altura dela é igual à sua latitude.","es":"Estrella a menos de 1° del polo celeste norte; su altura es igual a tu latitud."}},{"term":{"en":"Southern Cross","pt":"Cruzeiro do Sul","es":"Cruz del Sur"},"def":{"en":"Small, bright constellation (Crux) used to find the south celestial pole.","pt":"Constelação pequena e brilhante (Crux) usada para achar o polo celeste sul.","es":"Constelación pequeña y brillante (Crux) usada para encontrar el polo celeste sur."}},{"term":{"en":"Latitude","pt":"Latitude","es":"Latitud"},"def":{"en":"Angle north or south of the Equator; it sets which stars you can see.","pt":"Ângulo ao norte ou ao sul do Equador; define quais estrelas você vê.","es":"Ángulo al norte o al sur del Ecuador; define qué estrellas ves."}},{"term":{"en":"Sidereal day","pt":"Dia sideral","es":"Día sidéreo"},"def":{"en":"One turn of the Earth relative to the stars: 23 h 56 min.","pt":"Uma volta da Terra em relação às estrelas: 23 h 56 min.","es":"Una vuelta de la Tierra respecto a las estrellas: 23 h 56 min."}},{"term":{"en":"Ecliptic","pt":"Eclíptica","es":"Eclíptica"},"def":{"en":"The Sun's yearly path against the stars; the plane of the Earth's orbit.","pt":"O caminho anual do Sol diante das estrelas; o plano da órbita da Terra.","es":"El camino anual del Sol frente a las estrellas; el plano de la órbita de la Tierra."}},{"term":{"en":"Zodiac","pt":"Zodíaco","es":"Zodiaco"},"def":{"en":"The constellations along the ecliptic, where the Sun, Moon and planets travel.","pt":"As constelações ao longo da eclíptica, por onde passam o Sol, a Lua e os planetas.","es":"Las constelaciones a lo largo de la eclíptica, por donde pasan el Sol, la Luna y los planetas."}},{"term":{"en":"Solstice","pt":"Solstício","es":"Solsticio"},"def":{"en":"The day the Sun reaches its highest or lowest noon altitude; the longest or shortest day.","pt":"O dia em que o Sol chega à maior ou menor altura ao meio-dia; o dia mais longo ou mais curto.","es":"El día en que el Sol alcanza su mayor o menor altura al mediodía; el día más largo o más corto."}},{"term":{"en":"Equinox","pt":"Equinócio","es":"Equinoccio"},"def":{"en":"The two dates when day and night last about 12 hours everywhere (March and September).","pt":"As duas datas em que o dia e a noite duram cerca de 12 horas em todo lugar (março e setembro).","es":"Las dos fechas en que el día y la noche duran unas 12 horas en todas partes (marzo y septiembre)."}},{"term":{"en":"Axial tilt","pt":"Inclinação do eixo","es":"Inclinación del eje"},"def":{"en":"The 23.4° tilt of the Earth's axis that causes the seasons.","pt":"A inclinação de 23,4° do eixo da Terra que causa as estações.","es":"La inclinación de 23,4° del eje de la Tierra que causa las estaciones."}},{"term":{"en":"Moon phase","pt":"Fase da Lua","es":"Fase de la Luna"},"def":{"en":"How much of the Moon's sunlit half we see; a full cycle takes 29.5 days.","pt":"Quanto da metade iluminada da Lua nós vemos; um ciclo completo leva 29,5 dias.","es":"Cuánto de la mitad iluminada de la Luna vemos; un ciclo completo dura 29,5 días."}},{"term":{"en":"Waxing / waning","pt":"Crescente / minguante","es":"Creciente / menguante"},"def":{"en":"Growing (from new to full) or shrinking (from full to new) lit part of the Moon.","pt":"Parte iluminada da Lua aumentando (da nova à cheia) ou diminuindo (da cheia à nova).","es":"Parte iluminada de la Luna que crece (de nueva a llena) o disminuye (de llena a nueva)."}},{"term":{"en":"Gibbous","pt":"Gibosa","es":"Gibosa"},"def":{"en":"Phase with more than half of the Moon's disc lit.","pt":"Fase com mais da metade do disco da Lua iluminada.","es":"Fase con más de la mitad del disco de la Luna iluminada."}},{"term":{"en":"Eclipse","pt":"Eclipse","es":"Eclipse"},"def":{"en":"When one body blocks the Sun's light: solar (Moon in front of the Sun) or lunar (Moon in the Earth's shadow).","pt":"Quando um astro bloqueia a luz do Sol: solar (a Lua na frente do Sol) ou lunar (a Lua na sombra da Terra).","es":"Cuando un astro bloquea la luz del Sol: solar (la Luna delante del Sol) o lunar (la Luna en la sombra de la Tierra)."}},{"term":{"en":"Planet","pt":"Planeta","es":"Planeta"},"def":{"en":"A large body orbiting the Sun that has cleared its path; there are eight.","pt":"Um corpo grande que orbita o Sol e limpou o seu caminho; são oito.","es":"Un cuerpo grande que orbita el Sol y ha limpiado su camino; son ocho."}},{"term":{"en":"Dwarf planet","pt":"Planeta anão","es":"Planeta enano"},"def":{"en":"A round body orbiting the Sun that has not cleared its path, like Pluto or Ceres.","pt":"Um corpo redondo que orbita o Sol mas não limpou o seu caminho, como Plutão ou Ceres.","es":"Un cuerpo redondo que orbita el Sol pero no ha limpiado su camino, como Plutón o Ceres."}},{"term":{"en":"Astronomical unit (AU)","pt":"Unidade astronômica (UA)","es":"Unidad astronómica (UA)"},"def":{"en":"The average Earth–Sun distance, about 150 million km.","pt":"A distância média Terra–Sol, cerca de 150 milhões de km.","es":"La distancia media Tierra–Sol, unos 150 millones de km."}},{"term":{"en":"Elongation","pt":"Elongação","es":"Elongación"},"def":{"en":"Angle between a planet and the Sun, as seen from Earth.","pt":"Ângulo entre um planeta e o Sol, visto da Terra.","es":"Ángulo entre un planeta y el Sol, visto desde la Tierra."}},{"term":{"en":"Ellipse","pt":"Elipse","es":"Elipse"},"def":{"en":"An oval curve with two foci; planets orbit on ellipses with the Sun at one focus.","pt":"Uma curva oval com dois focos; os planetas orbitam em elipses com o Sol num dos focos.","es":"Una curva ovalada con dos focos; los planetas orbitan en elipses con el Sol en un foco."}},{"term":{"en":"Eccentricity","pt":"Excentricidade","es":"Excentricidad"},"def":{"en":"How stretched an orbit is: 0 is a circle, close to 1 a long ellipse.","pt":"O quanto uma órbita é alongada: 0 é um círculo; perto de 1, uma elipse comprida.","es":"Cuánto se alarga una órbita: 0 es un círculo; cerca de 1, una elipse larga."}},{"term":{"en":"Semi-major axis","pt":"Semieixo maior","es":"Semieje mayor"},"def":{"en":"Half the longest diameter of an ellipse; the average distance of an orbit.","pt":"Metade do maior diâmetro da elipse; a distância média de uma órbita.","es":"La mitad del diámetro mayor de una elipse; la distancia media de una órbita."}},{"term":{"en":"Perihelion / aphelion","pt":"Periélio / afélio","es":"Perihelio / afelio"},"def":{"en":"The closest and farthest points of an orbit from the Sun.","pt":"Os pontos da órbita mais perto e mais longe do Sol.","es":"Los puntos de la órbita más cercano y más lejano del Sol."}},{"term":{"en":"Kepler's laws","pt":"Leis de Kepler","es":"Leyes de Kepler"},"def":{"en":"Orbits are ellipses; they sweep equal areas in equal times; P² = a³.","pt":"As órbitas são elipses; varrem áreas iguais em tempos iguais; P² = a³.","es":"Las órbitas son elipses; barren áreas iguales en tiempos iguales; P² = a³."}},{"term":{"en":"Orbital period","pt":"Período orbital","es":"Período orbital"},"def":{"en":"The time for one full orbit: one year for the Earth.","pt":"O tempo de uma volta completa: um ano para a Terra.","es":"El tiempo de una vuelta completa: un año para la Tierra."}},{"term":{"en":"Light-year","pt":"Ano-luz","es":"Año luz"},"def":{"en":"The distance light travels in a year, about 9.5 trillion km.","pt":"A distância que a luz percorre em um ano, cerca de 9,5 trilhões de km.","es":"La distancia que recorre la luz en un año, unos 9,5 billones de km."}},{"term":{"en":"B−V colour index","pt":"Índice de cor B−V","es":"Índice de color B−V"},"def":{"en":"Difference between a star's blue and visual magnitudes; higher means redder and cooler.","pt":"Diferença entre as magnitudes azul e visual de uma estrela; maior quer dizer mais vermelha e mais fria.","es":"Diferencia entre las magnitudes azul y visual de una estrella; mayor significa más roja y más fría."}},{"term":{"en":"Kelvin (K)","pt":"Kelvin (K)","es":"Kelvin (K)"},"def":{"en":"Temperature unit starting at absolute zero; the Sun's surface is about 5,800 K.","pt":"Unidade de temperatura que começa no zero absoluto; a superfície do Sol tem cerca de 5.800 K.","es":"Unidad de temperatura que empieza en el cero absoluto; la superficie del Sol tiene unos 5.800 K."}},{"term":{"en":"Nebula","pt":"Nebulosa","es":"Nebulosa"},"def":{"en":"A cloud of gas and dust; some are places where stars form.","pt":"Uma nuvem de gás e poeira; algumas são lugares onde estrelas se formam.","es":"Una nube de gas y polvo; algunas son lugares donde se forman estrellas."}},{"term":{"en":"Star cluster","pt":"Aglomerado estelar","es":"Cúmulo estelar"},"def":{"en":"A group of stars born together, like the Pleiades.","pt":"Um grupo de estrelas que nasceram juntas, como as Plêiades.","es":"Un grupo de estrellas que nacieron juntas, como las Pléyades."}},{"term":{"en":"Messier catalogue","pt":"Catálogo Messier","es":"Catálogo Messier"},"def":{"en":"List of 110 nebulae, clusters and galaxies made by Charles Messier (M1 to M110).","pt":"Lista de 110 nebulosas, aglomerados e galáxias feita por Charles Messier (M1 a M110).","es":"Lista de 110 nebulosas, cúmulos y galaxias hecha por Charles Messier (M1 a M110)."}},{"term":{"en":"Galaxy","pt":"Galáxia","es":"Galaxia"},"def":{"en":"A huge system of stars, gas and dark matter; the Milky Way is ours.","pt":"Um enorme sistema de estrelas, gás e matéria escura; a Via Láctea é a nossa.","es":"Un enorme sistema de estrellas, gas y materia oscura; la Vía Láctea es la nuestra."}},{"term":{"en":"Milky Way","pt":"Via Láctea","es":"Vía Láctea"},"def":{"en":"Our spiral galaxy, about 100,000 light-years across; also the pale band it forms in the night sky.","pt":"A nossa galáxia espiral, com cerca de 100.000 anos-luz; também a faixa clara que ela forma no céu noturno.","es":"Nuestra galaxia espiral, de unos 100.000 años luz; también la franja pálida que forma en el cielo nocturno."}},{"term":{"en":"Stereographic projection","pt":"Projeção estereográfica","es":"Proyección estereográfica"},"def":{"en":"The way the round sky maps here are drawn: zenith in the centre, horizon on the edge.","pt":"O jeito como os mapas redondos do céu são desenhados aqui: zênite no centro, horizonte na borda.","es":"La forma en que se dibujan aquí los mapas redondos del cielo: cenit en el centro, horizonte en el borde."}}],"locs":[{"id":"campinas","lat":-22.91,"lon":-47.06,"tz":-3,"name":{"en":"Campinas","pt":"Campinas","es":"Campinas"}},{"id":"saopaulo","lat":-23.55,"lon":-46.63,"tz":-3,"name":{"en":"São Paulo","pt":"São Paulo","es":"São Paulo"}},{"id":"rio","lat":-22.91,"lon":-43.17,"tz":-3,"name":{"en":"Rio de Janeiro","pt":"Rio de Janeiro","es":"Río de Janeiro"}},{"id":"buenosaires","lat":-34.6,"lon":-58.38,"tz":-3,"name":{"en":"Buenos Aires","pt":"Buenos Aires","es":"Buenos Aires"}},{"id":"lisbon","lat":38.72,"lon":-9.14,"tz":0,"name":{"en":"Lisbon","pt":"Lisboa","es":"Lisboa"}},{"id":"madrid","lat":40.42,"lon":-3.7,"tz":1,"name":{"en":"Madrid","pt":"Madri","es":"Madrid"}},{"id":"london","lat":51.51,"lon":-0.13,"tz":0,"name":{"en":"London","pt":"Londres","es":"Londres"}},{"id":"newyork","lat":40.71,"lon":-74.01,"tz":-5,"name":{"en":"New York","pt":"Nova York","es":"Nueva York"}},{"id":"mexico","lat":19.43,"lon":-99.13,"tz":-6,"name":{"en":"Mex function labMoon(b, st) { const now = new Date(); if (!st.month) st.month = [now.getUTCFullYear(), now.getUTCMonth()];

  about: {"en": "<h1>About Astro.Micro</h1>\n<p>Astro.Micro is a micro-learning platform for astronomy. Each lesson takes three to five minutes: one idea, a mission in a live sky map or simulator, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: the naked-eye sky, the moving sky, the Moon, the Solar System, orbits and gravity, and stars and galaxies. {progress}</p>\n<h2>How the missions work</h2>\n<ul><li><b>Sky missions</b>: tap stars, planets, nebulae and points of the sky on a map calculated for a real place and time.</li><li><b>Time and place missions</b>: move the clock, the date or your latitude until the sky matches the goal.</li><li><b>Orbit missions</b>: shape an orbit in a Kepler simulator.</li><li><b>Reasoning missions</b>: name phases, read eclipse diagrams, order distances.</li></ul>\n<h2>The sky engine</h2>\n<p>The sky is calculated in your browser. Stars down to magnitude 5 (1,627 stars), constellation figures and the Messier catalogue come from the d3-celestial data set (Olaf Frohn, BSD-3-Clause), with star positions for the year 2000. The Sun and the Moon use low-precision formulas by Jean Meeus and Paul Schlyter, and the planets the approximate orbital elements published by NASA JPL. Checked against the astronomy-engine library for 2000–2040, positions are within about 0.1° for the Moon and better for the Sun and planets; ignoring precession shifts the stars by up to half a degree. That is plenty for learning and naked-eye observing, not for navigation or eclipse timing.</p>\n<p>Times are shown in each place's standard time, without daylight saving time.</p>\n<h2>The Lab</h2>\n<p>The Lab has a planetarium for any city and date, with constellations, planets, the Moon and Messier objects, a Moon phase calendar, an orbit simulator and a top view of the Solar System.</p>\n<h2>Part of Microlearn</h2>\n<p>Astro.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"{portal}\">www.microlearn.website</a>.</p>", "pt": "<h1>Sobre o Astro.Micro</h1>\n<p>O Astro.Micro é uma plataforma de microaprendizagem de astronomia. Cada lição leva de três a cinco minutos: uma ideia, uma missão num mapa do céu ou simulador ao vivo, e uma pergunta para conferir o que aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: o céu a olho nu, o céu em movimento, a Lua, o Sistema Solar, órbitas e gravidade, e estrelas e galáxias. {progress}</p>\n<h2>Como funcionam as missões</h2>\n<ul><li><b>Missões no céu</b>: toque em estrelas, planetas, nebulosas e pontos do céu num mapa calculado para um lugar e um horário reais.</li><li><b>Missões de tempo e lugar</b>: mova o relógio, a data ou a latitude até o céu ficar como o objetivo pede.</li><li><b>Missões de órbita</b>: dê forma a uma órbita num simulador de Kepler.</li><li><b>Missões de raciocínio</b>: nomear fases, ler diagramas de eclipse, ordenar distâncias.</li></ul>\n<h2>O motor do céu</h2>\n<p>O céu é calculado no seu navegador. As estrelas até magnitude 5 (1.627 estrelas), os desenhos das constelações e o catálogo Messier vêm do conjunto de dados d3-celestial (Olaf Frohn, licença BSD-3), com posições das estrelas para o ano 2000. O Sol e a Lua usam fórmulas de baixa precisão de Jean Meeus e Paul Schlyter, e os planetas os elementos orbitais aproximados publicados pelo JPL da NASA. Conferidas com a biblioteca astronomy-engine para 2000–2040, as posições ficam a cerca de 0,1° para a Lua e melhores para o Sol e os planetas; ignorar a precessão desloca as estrelas em até meio grau. É mais que suficiente para aprender e observar a olho nu, mas não para navegação ou horários exatos de eclipses.</p>\n<p>Os horários aparecem no horário padrão de cada lugar, sem horário de verão.</p>\n<h2>O Laboratório</h2>\n<p>O Laboratório tem um planetário para qualquer cidade e data, com constelações, planetas, a Lua e objetos de Messier, um calendário de fases da Lua, um simulador de órbitas e uma vista de cima do Sistema Solar.</p>\n<h2>Parte do Microlearn</h2>\n<p>O Astro.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"{portal}\">www.microlearn.website</a>.</p>", "es": "<h1>Acerca de Astro.Micro</h1>\n<p>Astro.Micro es una plataforma de microaprendizaje de astronomía. Cada lección dura de tres a cinco minutos: una idea, una misión en un mapa del cielo o simulador en vivo, y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: el cielo a simple vista, el cielo en movimiento, la Luna, el Sistema Solar, órbitas y gravedad, y estrellas y galaxias. {progress}</p>\n<h2>Cómo funcionan las misiones</h2>\n<ul><li><b>Misiones en el cielo</b>: toca estrellas, planetas, nebulosas y puntos del cielo en un mapa calculado para un lugar y una hora reales.</li><li><b>Misiones de tiempo y lugar</b>: mueve el reloj, la fecha o la latitud hasta que el cielo cumpla el objetivo.</li><li><b>Misiones de órbita</b>: da forma a una órbita en un simulador de Kepler.</li><li><b>Misiones de razonamiento</b>: nombrar fases, leer diagramas de eclipses, ordenar distancias.</li></ul>\n<h2>El motor del cielo</h2>\n<p>El cielo se calcula en tu navegador. Las estrellas hasta magnitud 5 (1.627 estrellas), las figuras de las constelaciones y el catálogo Messier vienen del conjunto de datos d3-celestial (Olaf Frohn, licencia BSD-3), con posiciones de las estrellas para el año 2000. El Sol y la Luna usan fórmulas de baja precisión de Jean Meeus y Paul Schlyter, y los planetas los elementos orbitales aproximados publicados por el JPL de la NASA. Comparadas con la biblioteca astronomy-engine para 2000–2040, las posiciones quedan a unos 0,1° para la Luna y mejor para el Sol y los planetas; ignorar la precesión desplaza las estrellas hasta medio grado. Es más que suficiente para aprender y observar a simple vista, no para navegación ni horarios exactos de eclipses.</p>\n<p>Las horas se muestran en la hora estándar de cada lugar, sin horario de verano.</p>\n<h2>El Laboratorio</h2>\n<p>El Laboratorio tiene un planetario para cualquier ciudad y fecha, con constelaciones, planetas, la Luna y objetos Messier, un calendario de fases lunares, un simulador de órbitas y una vista desde arriba del Sistema Solar.</p>\n<h2>Parte de Microlearn</h2>\n<p>Astro.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"{portal}\">www.microlearn.website</a>.</p>"},

/* ---------- router ---------- */
const VIEWS = ["home", "tracks", "lesson", "lab", "glossary", "about"];
let ACTIVE = null; // active mission controller
function route() {
  let h = location.hash.replace(/^#\/?/, ""); if (!h) h = "home";
  let [v, arg] = h.split("/"); if (v === "lesson" && !LESSONS.some(l => l.id === arg)) v = "tracks";
  if (!VIEWS.includes(v)) v = "home";
  for (const x of VIEWS) $("#v-" + x).classList.toggle("on", x === v);
  document.querySelectorAll("nav.menu a").forEach(a => a.setAttribute("aria-current", a.dataset.v === (v === "lesson" ? "tracks" : v) ? "page" : "false"));
  if (ACTIVE && ACTIVE.stop) ACTIVE.stop(); ACTIVE = null; if (APP.leave) APP.leave();
  ({ home: renderHome, tracks: renderTracks, lesson: () => renderLesson(arg), lab: () => APP.renderLab($("#v-lab")), glossary: renderGlossary, about: renderAbout })[v]();
  document.title = v === "home" ? APP.titleHome : (v === "lesson" ? L(LESSONS[lessonIndex(arg)].title) : t(v)) + " · " + APP.name;
  if (route.prev !== h) window.scrollTo(0, 0); route.prev = h;
}

function missionApi(l) {
  return {
    status: setStatus,
    counter: txt => { $("#mCount").textContent = txt; },
    solved: msg => { setStatus(`<span class="big">✓</span><span>${msg}</span>`, "ok"); award(l.id, "m", 10); renderDone(l); },
    isSolved: () => !!(progress.done[l.id] && progress.done[l.id].m)
  };
}
function renderDone(l) {
  const i = lessonIndex(l.id), next = LESSONS[i + 1];
  $("#doneBox").innerHTML = isDone(l.id) ? `<div class="done-banner">✓ ${t("done")}${next ? `<a class="btn small primary" href="#/lesson/${next.id}">${t("next")} →</a>` : `<a class="btn small primary" href="#/tracks">${t("tracks")} →</a>`}</div>` : "";
}
function renderQuiz(l) {
  const q = l.quiz, box = $("#quiz"); const answered = progress.done[l.id]?.q;
  box.innerHTML = `<div class="eyebrow">${t("quiz")}</div><h3>${APP.richText(L(q.q))}</h3><div class="opts">${q.options.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="k">${"ABC"[k]}</span><span>${APP.richText(L(o))}</span></button>`).join("")}</div><div class="fb" id="qfb" aria-live="polite"></div>`;
  const show = k => { box.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === q.answer) b.classList.add("right"); else if (+b.dataset.k === k) b.classList.add("wrong"); });
    $("#qfb").innerHTML = `<b class="${k === q.answer ? "ok" : "bad"}">${k === q.answer ? t("right") : t("wrong")}</b> ${APP.richText(L(q.explain))}`; };
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; show(k); if (k === q.answer) { award(l.id, "q", 5); renderDone(l); } else setTimeout(() => renderQuiz(l), 2600); });
  if (answered) show(q.answer);
}

/* ---------- glossary & about ---------- */
function renderGlossary() {
  const items = DATA.glossary.map(g => ({ term: L(g.term), def: L(g.def) })).sort((a, b) => a.term.localeCompare(b.term, lang));
  const letters = [...new Set(items.map(i => i.term[0].toUpperCase()))];
  $("#v-glossary").innerHTML = `<div class="wrap"><div class="eyebrow">${t("glossary")}</div><h1 class="page-h">${t("gl_h")}</h1><p class="muted page-p">${t("gl_p")}</p>
   <input type="search" id="glq" placeholder="${t("search")}" aria-label="${t("search")}">
   <div class="gl-index">${letters.map(c => `<a href="#gl-${encodeURIComponent(c)}" data-l="${c}">${c}</a>`).join("")}</div>
   <div class="gl-list" id="glList"></div></div>`;
  const draw = q => { const f = items.filter(i => !q || (i.term + " " + i.def).toLowerCase().includes(q.toLowerCase())); const seen = new Set();
    $("#glList").innerHTML = f.length ? f.map(i => { const c = i.term[0].toUpperCase(); const id = seen.has(c) ? "" : ` id="gl-${encodeURIComponent(c)}"`; seen.add(c); return `<div class="card term"${id}><h3>${esc(i.term)}<span>${c}</span></h3><p>${APP.richText(i.def)}</p></div>`; }).join("") : `<p class="muted">${t("notfound")}</p>`; };
  draw(""); $("#glq").oninput = e => draw(e.target.value);
  document.querySelectorAll(".gl-index a").forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById("gl-" + encodeURIComponent(a.dataset.l)); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
}
function renderAbout() { $("#v-about").innerHTML = `<div class="wrap"><div class="eyebrow">${t("about")}</div><div class="prose">${APP.about[lang].replace("{progress}", t("progress_note")).split("{portal}").join(PORTAL)}</div></div>`; }

/* ---------- boot ---------- */
function boot() {
  applyTheme(store.get("theme", "light"));
  $("#themeBtn").onclick = () => { const nt = isDark() ? "light" : "dark"; store.set("theme", nt); applyTheme(nt); };
  $("#langBtn").onclick = e => { e.stopPropagation(); const m = $("#langMenu"); m.hidden = !m.hidden; $("#langBtn").setAttribute("aria-expanded", String(!m.hidden)); };
  document.addEventListener("click", () => { $("#langMenu").hidden = true; $("#langBtn").setAttribute("aria-expanded", "false"); });
  $("#langMenu").onclick = e => { const b = e.target.closest("button[data-l]"); if (!b) return; lang = b.dataset.l; store.set("lang", lang); renderShell(); route(); };
  renderShell(); window.addEventListener("hashchange", route); route();
}

boot();
