<style>

:root{
  --bg:#F6F4F1; --surface:#FFFFFF; --surface-2:#EFEBE6; --ink:#1E1A17; --muted:#665E57; --line:#E2DBD3;
  --accent:#C2410C; --accent-ink:#FFFFFF; --accent-soft:#FBE7DB;
  --ok:#1D7A4C; --ok-soft:#E1F2E8; --bad:#B8362A; --bad-soft:#FBE7E4; --gold:#B7791F; --warn:#B45309; --warn-soft:#FDF0DC;
  --lv-beg:#1D7A4C; --lv-int:#2F5FBF; --lv-adv:#C2410C;
  --term-bg:#1C1815; --term-ink:#EEE7E0; --term-muted:#9E948B; --term-line:#2E2823; --t-red:#FF7B72; --t-green:#7EE787; --t-yellow:#E3B341; --t-cyan:#79C0FF;
  --g1:#C2410C; --g2:#2F5FBF; --g3:#1D7A4C; --g4:#8A2BA3; --g5:#B7791F; --g6:#0E7490;
  --f-display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(30,26,23,.06), 0 6px 24px -12px rgba(30,26,23,.22);
}
:root[data-theme="dark"]{
  --bg:#12100E; --surface:#1B1815; --surface-2:#26221E; --ink:#F2ECE6; --muted:#A99F96; --line:#38312B;
  --accent:#FF9A62; --accent-ink:#2A0E02; --accent-soft:#3D2417;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A; --warn:#F2B35B; --warn-soft:#3A2A14;
  --lv-beg:#5BCB90; --lv-int:#8EA9F0; --lv-adv:#FF9A62;
  --term-bg:#0B0A09; --term-ink:#EEE7E0; --term-muted:#8F867E; --term-line:#24201C;
  --g1:#FF9A62; --g2:#8EA9F0; --g3:#5BCB90; --g4:#D9A2F2; --g5:#E2B04A; --g6:#5CC8DB;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}


/* Git.Micro: terminal, goals, panels, graph, editor */
.brand .tile{font-weight:700;font-size:.98rem}
.hero h1{font-weight:700;letter-spacing:-.025em}
.sec-head h2,.track-head h2,.page-h,.lesson h1,.prose h1,.prose h2{font-weight:700;letter-spacing:-.02em}
.lesson{grid-template-columns:minmax(0,1fr) minmax(360px,600px)}
@media (max-width:1060px){.lesson{grid-template-columns:minmax(0,1fr) minmax(340px,520px)}}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr)}}
.mission{padding:14px}
.goals{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:4px}
.goals li{display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;font-size:.9rem;line-height:1.35;padding:5px 8px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.goals li i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.7rem;margin-top:1px;background:var(--surface)}
.goals li.on{color:var(--ok);background:var(--ok-soft);font-weight:600}
.goals li.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.goals li.on i::before{content:"✓"}
.goals li.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}

/* terminal */
.tty{font-variant-ligatures:none;background:var(--term-bg);color:var(--term-ink);border-radius:12px;font-family:var(--f-mono);font-size:.8rem;line-height:1.5;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--term-line)}
.term-bar{display:flex;align-items:center;gap:6px;padding:7px 10px;border-bottom:1px solid var(--term-line);color:var(--term-muted);font-size:.72rem}
.term-bar i{width:9px;height:9px;border-radius:50%;background:#3a332d}
.term-bar i:nth-child(1){background:#e0605a}.term-bar i:nth-child(2){background:#e3b341}.term-bar i:nth-child(3){background:#5ec26a}
.term-bar span{margin-left:6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.term-bar button{border:0;background:none;color:var(--term-muted);font:inherit;padding:2px 6px;border-radius:6px}
.term-bar button:hover{color:var(--term-ink);background:#ffffff14}
.term-out{flex:1;overflow:auto;padding:8px 12px 4px;white-space:pre-wrap;word-break:break-word;min-height:150px;max-height:300px;overscroll-behavior:contain}
.tty.big .term-out{max-height:none;height:clamp(260px,46vh,520px)}
.term-out .cmd{color:var(--term-ink)}
.term-out .ps{color:var(--t-green);font-weight:600}
.term-out .ps b{color:var(--t-cyan);font-weight:600}
.term-out .welcome{color:var(--term-muted)}
.term-out .err{color:var(--t-red)}
.a31{color:var(--t-red)}.a32{color:var(--t-green)}.a33{color:var(--t-yellow)}.a36{color:var(--t-cyan)}.a1{font-weight:700}.a2{opacity:.7}
.term-in{display:flex;align-items:center;gap:8px;padding:6px 12px 9px;border-top:1px solid var(--term-line)}
.term-in .ps{color:var(--t-green);font-weight:600;white-space:nowrap;font-size:.78rem}
.term-in .ps b{color:var(--t-cyan);font-weight:600}
.term-in input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--term-ink);font:inherit;font-size:.85rem;padding:4px 0;caret-color:var(--t-yellow)}
.term-in input::placeholder{color:var(--term-muted)}
.term-in button{border:1px solid #ffffff22;background:#ffffff10;color:var(--term-ink);border-radius:8px;padding:4px 10px;font:inherit;font-size:.78rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
.chips button{font-family:var(--f-mono);font-size:.74rem;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:5px 8px;white-space:nowrap}
.chips button:hover{border-color:var(--accent);color:var(--accent)}

/* panels */
.ptabs{display:flex;gap:4px;margin:12px 0 8px;flex-wrap:wrap}
.ptabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.82rem;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.ptabs button svg{width:15px;height:15px}
.ptabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ptabs .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pbody{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:10px;min-height:120px;overflow:auto;max-height:420px}
.empty{color:var(--muted);font-size:.88rem;padding:14px 6px;text-align:center}

/* three areas */
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.area h4{margin:0 0 6px;font-size:.7rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.area h4 small{font-size:.66rem;letter-spacing:0;text-transform:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fchip{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.74rem;padding:4px 6px;border-radius:7px;margin-top:4px;background:var(--surface-2);border:1px solid transparent;min-width:0;cursor:pointer;width:100%;text-align:left;color:var(--ink)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.fchip em{font-style:normal;font-size:.62rem;font-weight:600;padding:0 5px;border-radius:5px;flex:none;text-transform:uppercase;letter-spacing:.03em}
.fchip.untracked{border-color:var(--bad);background:var(--bad-soft)}.fchip.untracked em{color:var(--bad)}
.fchip.modified{border-color:var(--warn);background:var(--warn-soft)}.fchip.modified em{color:var(--warn)}
.fchip.deleted{border-style:dashed;border-color:var(--bad);color:var(--muted);text-decoration:line-through}.fchip.deleted em{color:var(--bad);text-decoration:none}
.fchip.staged{border-color:var(--ok);background:var(--ok-soft)}.fchip.staged em{color:var(--ok)}
.fchip.conflict{border-color:var(--bad);background:var(--bad);color:#fff}.fchip.conflict em{color:#fff}
.fchip.ignored{opacity:.5}
.fchip.same{opacity:.85}
.area .none{font-size:.74rem;color:var(--muted);padding:4px 2px}
.areas-arrows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:6px;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);text-align:center}
.areas-arrows span:nth-child(1){grid-column:1/3}.areas-arrows span:nth-child(2){grid-column:2/4}
@media (max-width:520px){.areas{gap:5px}.area{padding:6px}.fchip{font-size:.68rem;padding:3px 4px}.fchip em{display:none}}

/* graph */
.graph{position:relative;font-size:.8rem}
.graph svg{position:absolute;left:0;top:0;overflow:visible}
.grow{position:relative;display:flex;align-items:center;gap:6px;height:30px;white-space:nowrap;cursor:pointer;border-radius:7px;padding-right:6px}
.grow:hover{background:var(--surface)}
.grow .h{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);flex:none}
.grow .m{overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.grow .who{font-size:.7rem;color:var(--muted);flex:none}
.rp{font-family:var(--f-mono);font-size:.68rem;font-weight:600;border-radius:6px;padding:1px 6px;flex:none;border:1.5px solid currentColor;line-height:1.35}
.rp.head{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rp.br{color:var(--g3)}
.rp.rem{color:var(--g2);border-style:dashed}
.rp.tag{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.rp.dh{background:var(--bad);color:#fff;border-color:var(--bad)}
.gnode{stroke:var(--surface-2);stroke-width:2.5}
.gnode.head{stroke:var(--accent);stroke-width:2.5;fill:var(--surface)!important}
.gedge{fill:none;stroke-width:2.2;stroke-linecap:round}
.grow.new{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.srv-head{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);margin:0 0 6px;font-family:var(--f-mono);flex-wrap:wrap}
.srv-head b{color:var(--ink)}

/* files + editor */
.files{display:grid;gap:4px}
.files .fchip{margin:0}
.editor{margin-top:10px;border:1.5px solid var(--accent);border-radius:12px;background:var(--surface);padding:10px}
.editor .eh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-family:var(--f-mono);font-size:.82rem}
.editor textarea{width:100%;min-height:150px;font-family:var(--f-mono);font-size:.82rem;line-height:1.5;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical;tab-size:2}
.editor .row{margin-top:8px}

/* lab */
.labgrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
@media (max-width:980px){.labgrid{grid-template-columns:1fr}}
.labside{padding:14px}
.labbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.labbar .seg{flex:1 1 420px}
.cheat{margin-top:16px}
.cheat h3{font-family:var(--f-body);font-size:.95rem;margin:12px 0 6px;font-weight:700;letter-spacing:0}
.cheat .chips{margin:0}
.labnote{font-size:.88rem;color:var(--muted);margin:8px 0 0}

/* hero */
.hero-term .term-out{min-height:0;height:168px;max-height:168px;overflow:hidden}
.hero-graph{margin-top:10px;background:var(--surface-2);border-radius:12px;padding:8px 10px;height:186px;overflow:hidden;border:1px solid var(--line)}
.hero-graph .grow{cursor:default}
.hero-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.hero-cap b{font-size:.95rem}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--t-yellow);vertical-align:-2px;animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.kbd-hint{font-size:.78rem;color:var(--muted);margin:6px 0 0}
.tty code{background:#ffffff1c;color:inherit;border-radius:4px;padding:0 4px}
.prompt code{word-break:break-all}
code,.code{font-variant-ligatures:none}

</style>
</head>

e you type real Git commands in the terminal. The panels show the three areas of Git and the commit graph, updated after every command.","pt":"Aqui você digita comandos Git de verdade no terminal. Os painéis mostram as três áreas do Git e o grafo de commits, atualizados a cada comando.","es":"Aquí escribes comandos Git de verdad en el terminal. Los paneles muestran las tres áreas de Git y el grafo de commits, actualizados tras cada comando."},"mission":{"prompt":{"en":"This folder has a small website but no history. Turn it into a Git repository, then check its status.","pt":"Esta pasta tem um pequeno site, mas nenhum histórico. Transforme-a em um repositório Git e depois confira o status.","es":"Esta carpeta tiene un pequeño sitio web pero ningún historial. Conviértela en un repositorio Git y luego revisa su estado."},"hint":{"en":"Type `git init` and press Enter, then `git status`.","pt":"Digite `git init` e aperte Enter, depois `git status`.","es":"Escribe `git init` y pulsa Enter, luego `git status`."},"setup":[{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}}],"goals":[{"t":"repo"},{"t":"ran","re":"^git status","cmd":"git status","afterRepo":true}],"chips":["git init","git status","ls"],"solution":["git init","git status"],"wrong":[["git status"],["git init","ls"]]},"quiz":{"q":{"en":"What does `git init` do?","pt":"O que o `git init` faz?","es":"¿Qué hace `git init`?"},"options":[{"en":"Saves a first version of every file","pt":"Salva uma primeira versão de todos os arquivos","es":"Guarda una primera versión de todos los archivos"},{"en":"Uploads the folder to a server","pt":"Envia a pasta para um servidor","es":"Sube la carpeta a un servidor"},{"en":"Creates an empty repository (`.git`) in the folder","pt":"Cria um repositório vazio (`.git`) na pasta","es":"Crea un repositorio vacío (`.git`) en la carpeta"}],"answer":2,"explain":{"en":"`git init` only creates the repository. Nothing is saved until you stage files and commit them.","pt":"O `git init` só cria o repositório. Nada é salvo até você preparar os arquivos e fazer o commit.","es":"`git init` solo crea el repositorio. No se guarda nada hasta que preparas los archivos y haces commit."}}},{"id":"stage","track":"first","mins":4,"title":{"en":"The staging area","pt":"A área de preparação","es":"La área de preparación"},"intro":{"en":"Before saving a version, you choose what goes into it. `git add` copies a file into the **staging area** (also called the index): the draft of your next commit.","pt":"Antes de salvar uma versão, você escolhe o que entra nela. `git add` copia um arquivo para a **área de preparação** (staging area, ou index): o rascunho do seu próximo commit.","es":"Antes de guardar una versión, eliges qué entra en ella. `git add` copia un archivo a la **área de preparación** (staging area, o index): el borrador de tu próximo commit."},"ideas":[{"en":"Git has three areas: the **working directory** (your files), the **staging area** (the next commit) and the **repository** (saved commits).","pt":"O Git tem três áreas: o **diretório de trabalho** (seus arquivos), a **área de preparação** (o próximo commit) e o **repositório** (os commits salvos).","es":"Git tiene tres áreas: el **directorio de trabajo** (tus archivos), la **área de preparación** (el próximo commit) y el **repositorio** (los commits guardados)."},{"en":"`git add file` stages one file; `git add .` stages every change in the folder.","pt":"`git add arquivo` prepara um arquivo; `git add .` prepara todas as mudanças da pasta.","es":"`git add archivo` prepara un archivo; `git add .` prepara todos los cambios de la carpeta."},{"en":"New files start as **untracked**: Git sees them but doesn't follow them until you add them.","pt":"Arquivos novos começam como **não rastreados** (untracked): o Git vê, mas só acompanha depois do add.","es":"Los archivos nuevos empiezan como **no rastreados** (untracked): Git los ve, pero no los sigue hasta que los añades."}],"mission":{"prompt":{"en":"Stage `index.html` and `style.css` for the first commit, but keep your personal notes in `todo.txt` out of it.","pt":"Prepare `index.html` e `style.css` para o primeiro commit, mas deixe de fora as suas anotações em `todo.txt`.","es":"Prepara `index.html` y `style.css` para el primer commit, pero deja fuera tus notas personales de `todo.txt`."},"hint":{"en":"`git add` accepts several files: `git add index.html style.css`. Check with `git status`.","pt":"O `git add` aceita vários arquivos: `git add index.html style.css`. Confira com `git status`.","es":"`git add` acepta varios archivos: `git add index.html style.css`. Compruébalo con `git status`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n","todo.txt":"- buy flour\n- call Ana\n"}}],"goals":[{"t":"staged","path":"index.html"},{"t":"staged","path":"style.css"},{"t":"staged","path":"todo.txt","no":true},{"t":"exists","path":"todo.txt"}],"chips":["git status","git add index.html","git add style.css"],"solution":["git add index.html style.css","git status"],"wrong":[["git add ."],["git add index.html"],["git add .","rm todo.txt"]]},"quiz":{"q":{"en":"Right after `git add style.css`, where is that version of the file?","pt":"Logo depois de `git add style.css`, onde está essa versão do arquivo?","es":"Justo después de `git add style.css`, ¿dónde está esa versión del archivo?"},"options":[{"en":"In the staging area, ready for the next commit","pt":"Na área de preparação, pronta para o próximo commit","es":"En la área de preparación, lista para el próximo commit"},{"en":"In a new commit in the history","pt":"Em um novo commit no histórico","es":"En un nuevo commit del historial"},{"en":"On the server, for the team","pt":"No servidor, para a equipe","es":"En el servidor, para el equipo"}],"answer":0,"explain":{"en":"`git add` only stages. The version becomes part of the history when you commit.","pt":"O `git add` só prepara. A versão entra no histórico quando você faz o commit.","es":"`git add` solo prepara. La versión entra en el historial cuando haces commit."}}},{"id":"commit","track":"first","mins":4,"title":{"en":"Your first commit","pt":"Seu primeiro commit","es":"Tu primer commit"},"intro":{"en":"A **commit** is a saved snapshot of everything in the staging area, with a message, an author and a date. It is the unit of history in Git.","pt":"Um **commit** é uma foto salva de tudo o que está na área de preparação, com mensagem, autor e data. É a unidade do histórico no Git.","es":"Un **commit** es una foto guardada de todo lo que hay en la área de preparación, con mensaje, autor y fecha. Es la unidad del historial en Git."},"ideas":[{"en":"`git commit -m \"message\"` saves everything that is staged as one commit.","pt":"`git commit -m \"mensagem\"` salva tudo o que está preparado como um commit.","es":"`git commit -m \"mensaje\"` guarda todo lo preparado como un commit."},{"en":"A good message says what the commit does, in a short sentence: \"Add contact page\".","pt":"Uma boa mensagem diz o que o commit faz, numa frase curta: \"Adicionar página de contato\".","es":"Un buen mensaje dice qué hace el commit, en una frase corta: \"Añadir página de contacto\"."},{"en":"Each commit gets a **hash** such as `3f9a2c1…`, calculated from its content: change anything and the hash changes.","pt":"Cada commit recebe um **hash** como `3f9a2c1…`, calculado a partir do conteúdo: mudou qualquer coisa, muda o hash.","es":"Cada commit recibe un **hash** como `3f9a2c1…`, calculado a partir de su contenido: si cambia algo, cambia el hash."}],"note":{"en":"Git signs each commit with a name and email, set with `git config user.name` and `git config user.email`. Here they are already set to \"You\".","pt":"O Git assina cada commit com nome e e-mail, definidos com `git config user.name` e `git config user.email`. Aqui eles já estão definidos como \"You\".","es":"Git firma cada commit con un nombre y un correo, definidos con `git config user.name` y `git config user.email`. Aquí ya están definidos como \"You\"."},"mission":{"prompt":{"en":"Stage all three files and save them in a commit with the message `Create the website`.","pt":"Prepare os três arquivos e salve-os em um commit com a mensagem `Criar o site`.","es":"Prepara los tres archivos y guárdalos en un commit con el mensaje `Crear el sitio`."},"hint":{"en":"`git add .` then `git commit -m \"Create the website\"`.","pt":"`git add .` e depois `git commit -m \"Criar o site\"`.","es":"`git add .` y luego `git commit -m \"Crear el sitio\"`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n","README.md":"# Bakery Bloom website\n"}}],"goals":[{"t":"commits","ref":"HEAD","n":1},{"t":"inCommit","ref":"HEAD","path":"index.html"},{"t":"inCommit","ref":"HEAD","path":"style.css"},{"t":"inCommit","ref":"HEAD","path":"README.md"},{"t":"msg","ref":"HEAD","is":{"en":"Create the website","pt":"Criar o site","es":"Crear el sitio"}}],"chips":["git add .","git commit -m \"\"","git log"],"solution":["git add .","git commit -m '{msg}'"],"wrong":[["git add index.html","git commit -m '{msg}'"],["git add .","git commit -m 'stuff'"]]},"quiz":{"q":{"en":"What does a commit save?","pt":"O que um commit salva?","es":"¿Qué guarda un commit?"},"options":[{"en":"Only the message, the files stay where they are","pt":"Só a mensagem; os arquivos ficam onde estão","es":"Solo el mensaje; los archivos se quedan donde están"},{"en":"A snapshot of the files in the staging area","pt":"Uma foto dos arquivos na área de preparação","es":"Una foto de los archivos en la área de preparación"},{"en":"Every file in the folder, staged or not","pt":"Todos os arquivos da pasta, preparados ou não","es":"Todos los archivos de la carpeta, preparados o no"}],"answer":1,"explain":{"en":"Only what is staged goes in. Unstaged changes and untracked files stay out of the commit.","pt":"Só entra o que está preparado. Mudanças não preparadas e arquivos não rastreados ficam de fora.","es":"Solo entra lo que está preparado. Los cambios sin preparar y los archivos no rastreados se quedan fuera."}}},{"id":"log","track":"first","mins":4,"title":{"en":"Reading the history","pt":"Lendo o histórico","es":"Leer el historial"},"intro":{"en":"Each commit remembers its parent, so the commits form a chain: the history. `git log` walks it from the newest commit back to the first.","pt":"Cada commit lembra o seu pai, então os commits formam uma corrente: o histórico. O `git log` percorre essa corrente do commit mais novo até o primeiro.","es":"Cada commit recuerda a su padre, así que los commits forman una cadena: el historial. `git log` la recorre desde el commit más nuevo hasta el primero."},"ideas":[{"en":"`git log` shows hash, author, date and message; `git log --oneline` shows one line per commit.","pt":"`git log` mostra hash, autor, data e mensagem; `git log --oneline` mostra uma linha por commit.","es":"`git log` muestra hash, autor, fecha y mensaje; `git log --oneline` muestra una línea por commit."},{"en":"`git show <hash>` shows one commit and exactly what it changed.","pt":"`git show <hash>` mostra um commit e exatamente o que ele mudou.","es":"`git show <hash>` muestra un commit y exactamente qué cambió."},{"en":"You don't need the whole hash: the first 7 characters are enough for Git to find the commit.","pt":"Não precisa do hash inteiro: os 7 primeiros caracteres bastam para o Git achar o commit.","es":"No hace falta el hash completo: los 7 primeros caracteres bastan para que Git encuentre el commit."}],"mission":{"prompt":{"en":"List the history in short form, find the commit that added the prices page and open it with `git show`.","pt":"Liste o histórico em forma curta, ache o commit que adicionou a página de preços e abra-o com `git show`.","es":"Lista el historial en forma corta, encuentra el commit que añadió la página de precios y ábrelo con `git show`."},"hint":{"en":"Run `git log --oneline`, copy the 7-character hash next to \"Add prices page\" and run `git show` followed by that hash. Tapping a commit in the graph also fills the hash in.","pt":"Rode `git log --oneline`, copie o hash de 7 caracteres ao lado de \"Add prices page\" e rode `git show` seguido desse hash. Tocar num commit do grafo também preenche o hash.","es":"Ejecuta `git log --oneline`, copia el hash de 7 caracteres junto a \"Add prices page\" y ejecuta `git show` seguido de ese hash. Tocar un commit en el grafo también rellena el hash."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n<p>Sourdough, baguette, croissant</p>\n"}},"git add menu.html","git commit -m 'Add the menu'",{"files":{"prices.html":"<h2>Prices</h2>\n<p>Baguette 1.20</p>\n"}},"git add prices.html","git commit -m 'Add prices page'",{"files":{"style.css":"body { font-family: sans-serif; color: #333; }\n"}},"git commit -am 'Darker text'",{"files":{"menu.html":"<h2>Menu</h2>\n<p>Sourdough, baguette, croissant, brioche</p>\n"}},"git commit -am 'Add brioche to the menu'"],"goals":[{"t":"ran","re":"^git log\\b.*--oneline","cmd":"git log --oneline"},{"t":"shown","msg":"Add prices page"}],"chips":["git log --oneline","git show "],"solution":["git log --oneline","git show {sha:Add prices page}"],"wrong":[["git log --oneline","git show HEAD"],["git show {sha:Add prices page}"]]},"quiz":{"q":{"en":"`git log --oneline` prints `a1b2c3d Fix typo`. What is `a1b2c3d`?","pt":"`git log --oneline` mostra `a1b2c3d Fix typo`. O que é `a1b2c3d`?","es":"`git log --oneline` muestra `a1b2c3d Fix typo`. ¿Qué es `a1b2c3d`?"},"options":[{"en":"The number of the commit, counting from 1","pt":"O número do commit, contando a partir de 1","es":"El número del commit, contando desde 1"},{"en":"A code for the date of the commit","pt":"Um código da data do commit","es":"Un código de la fecha del commit"},{"en":"The start of the commit's hash","pt":"O começo do hash do commit","es":"El comienzo del hash del commit"}],"answer":2,"explain":{"en":"Hashes are 40 hexadecimal characters; logs abbreviate them to 7, which is enough to identify the commit.","pt":"Hashes têm 40 caracteres hexadecimais; os logs abreviam para 7, o que basta para identificar o commit.","es":"Los hashes tienen 40 caracteres hexadecimales; los logs los abrevian a 7, lo que basta para identificar el commit."}}},{"id":"diff","track":"changes","mins":4,"title":{"en":"What changed? git diff","pt":"O que mudou? git diff","es":"¿Qué cambió? git diff"},"intro":{"en":"Before you commit, look at what you changed. `git diff` compares versions line by line, so you can commit related changes together.","pt":"Antes de fazer o commit, veja o que você mudou. O `git diff` compara versões linha a linha, para você juntar no mesmo commit as mudanças relacionadas.","es":"Antes de hacer commit, mira qué cambiaste. `git diff` compara versiones línea a línea, para que hagas commit de los cambios relacionados juntos."},"ideas":[{"en":"`git diff` shows changes not staged yet: lines starting with `-` were removed, `+` were added.","pt":"`git diff` mostra mudanças ainda não preparadas: linhas com `-` saíram, com `+` entraram.","es":"`git diff` muestra cambios aún no preparados: las líneas con `-` salieron, las de `+` entraron."},{"en":"`git diff --staged` shows what is already staged, that is, what the next commit will contain.","pt":"`git diff --staged` mostra o que já está preparado, ou seja, o que o próximo commit vai conter.","es":"`git diff --staged` muestra lo ya preparado, es decir, lo que contendrá el próximo commit."},{"en":"One commit, one idea: unrelated changes go in separate commits, so each is easy to read and to undo.","pt":"Um commit, uma ideia: mudanças sem relação vão em commits separados, fáceis de ler e de desfazer.","es":"Un commit, una idea: los cambios sin relación van en commits separados, fáciles de leer y de deshacer."}],"mission":{"prompt":{"en":"Two files changed. Commit **only the price change** with the message `Update coffee price`; leave the other change for later. Use `git diff` to see which file is which.","pt":"Dois arquivos mudaram. Faça o commit **só da mudança de preço**, com a mensagem `Atualizar preço do café`; deixe a outra mudança para depois. Use `git diff` para ver qual é qual.","es":"Cambiaron dos archivos. Haz commit **solo del cambio de precio**, con el mensaje `Actualizar precio del café`; deja el otro cambio para después. Usa `git diff` para ver cuál es cuál."},"hint":{"en":"`git diff` shows the coffee price in `prices.txt`. Stage just that file: `git add prices.txt`, then commit.","pt":"O `git diff` mostra o preço do café em `prices.txt`. Prepare só esse arquivo: `git add prices.txt`, e faça o commit.","es":"`git diff` muestra el precio del café en `prices.txt`. Prepara solo ese archivo: `git add prices.txt`, y haz commit."},"setup":["git init",{"files":{"prices.txt":"bread 2.50\ncoffee 3.50\ncake 4.00\n","menu.txt":"Today: bread, cofee, cake\n"}},"git add .","git commit -m 'Open the shop'",{"files":{"prices.txt":"bread 2.50\ncoffee 4.00\ncake 4.00\n","menu.txt":"Today: bread, coffee, cake\n"}}],"goals":[{"t":"msg","ref":"HEAD","is":{"en":"Update coffee price","pt":"Atualizar preço do café","es":"Actualizar precio del café"}},{"t":"changedOnly","ref":"HEAD","paths":["prices.txt"]},{"t":"modified","path":"menu.txt"}],"chips":["git diff","git add prices.txt","git commit -m \"\""],"solution":["git diff","git add prices.txt","git commit -m '{msg}'"],"wrong":[["git commit -am '{msg}'"],["git add menu.txt","git commit -m '{msg}'"]]},"quiz":{"q":{"en":"In the output of `git diff`, what does a line starting with `+` mean?","pt":"Na saída do `git diff`, o que significa uma linha que começa com `+`?","es":"En la salida de `git diff`, ¿qué significa una línea que empieza con `+`?"},"options":[{"en":"A line that was added","pt":"Uma linha que foi adicionada","es":"Una línea que se añadió"},{"en":"A line that is already staged","pt":"Uma linha que já está preparada","es":"Una línea que ya está preparada"},{"en":"A line in conflict","pt":"Uma linha em conflito","es":"Una línea en conflicto"}],"answer":0,"explain":{"en":"`+` marks added lines and `-` removed ones. A changed line appears as one `-` and one `+`.","pt":"`+` marca linhas adicionadas e `-` removidas. Uma linha alterada aparece como um `-` e um `+`.","es":"`+` marca líneas añadidas y `-` eliminadas. Una línea modificada aparece como un `-` y un `+`."}}},{"id":"restore","track":"changes","mins":3,"title":{"en":"Undo changes in a file","pt":"Desfazer mudanças num arquivo","es":"Deshacer cambios en un archivo"},"intro":{"en":"Broke a file and want the last saved version back? `git restore` replaces your copy with the one Git has saved.","pt":"Estragou um arquivo e quer de volta a última versão salva? O `git restore` troca a sua cópia pela que o Git guardou.","es":"¿Rompiste un archivo y quieres la última versión guardada? `git restore` cambia tu copia por la que Git tiene guardada."},"ideas":[{"en":"`git restore file` throws away the unstaged changes in that file.","pt":"`git restore arquivo` descarta as mudanças não preparadas daquele arquivo.","es":"`git restore archivo` descarta los cambios sin preparar de ese archivo."},{"en":"Careful: discarded changes were never committed, so Git can't bring them back.","pt":"Cuidado: mudanças descartadas nunca entraram num commit, então o Git não consegue recuperá-las.","es":"Cuidado: los cambios descartados nunca entraron en un commit, así que Git no puede recuperarlos."},{"en":"Restore one file at a time when other files have work you want to keep.","pt":"Restaure um arquivo de cada vez quando outros arquivos tiverem trabalho que você quer manter.","es":"Restaura un archivo cada vez cuando otros archivos tengan trabajo que quieres conservar."}],"mission":{"prompt":{"en":"`index.html` was broken by accident. Restore it to the last commit, but keep the new paragraph you wrote in `about.html`.","pt":"O `index.html` foi estragado sem querer. Restaure-o para o último commit, mas mantenha o parágrafo novo que você escreveu em `about.html`.","es":"`index.html` se rompió sin querer. Restáuralo al último commit, pero conserva el párrafo nuevo que escribiste en `about.html`."},"hint":{"en":"`git restore index.html`. Don't use `git restore .`: it would also erase the new text in `about.html`.","pt":"`git restore index.html`. Não use `git restore .`: isso apagaria também o texto novo de `about.html`.","es":"`git restore index.html`. No uses `git restore .`: también borraría el texto nuevo de `about.html`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n","about.html":"<h2>About us</h2>\n"}},"git add .","git commit -m 'Create the website'",{"files":{"index.html":"oops <h1\n","about.html":"<h2>About us</h2>\n<p>A family bakery since 1987.</p>\n"}}],"goals":[{"t":"wtSame","path":"index.html","ref":"HEAD"},{"t":"wtHas","path":"about.html","text":"since 1987"}],"chips":["git status","git diff","git restore index.html"],"solution":["git status","git restore index.html"],"wrong":[["git restore ."],["git reset --hard"],["git checkout ."]]},"quiz":{"q":{"en":"You ran `git restore notes.txt` by mistake. Can Git bring back the changes you had?","pt":"Você rodou `git restore notes.txt` sem querer. O Git consegue trazer de volta as mudanças que você tinha?","es":"Ejecutaste `git restore notes.txt` por error. ¿Puede Git recuperar los cambios que tenías?"},"options":[{"en":"Yes, they go to the staging area","pt":"Sim, elas vão para a área de preparação","es":"Sí, pasan a la área de preparación"},{"en":"No, they were never committed","pt":"Não, elas nunca entraram num commit","es":"No, nunca entraron en un commit"},{"en":"Yes, with `git log`","pt":"Sim, com `git log`","es":"Sí, con `git log`"}],"answer":1,"explain":{"en":"Git can only give back what it saved. Uncommitted, unstaged changes are gone after a restore.","pt":"O Git só devolve o que guardou. Mudanças não preparadas e sem commit somem depois do restore.","es":"Git solo devuelve lo que guardó. Los cambios sin preparar y sin commit desaparecen tras el restore."}}},{"id":"unstage","track":"changes","mins":3,"title":{"en":"Take a file out of the staging area","pt":"Tirar um arquivo da preparação","es":"Sacar un archivo de la preparación"},"intro":{"en":"Staged something by mistake? You can take it out of the staging area without losing anything: the file stays in your folder exactly as it is.","pt":"Preparou algo sem querer? Dá para tirar da área de preparação sem perder nada: o arquivo continua na pasta exatamente como está.","es":"¿Preparaste algo por error? Puedes sacarlo de la área de preparación sin perder nada: el archivo sigue en tu carpeta exactamente como está."},"ideas":[{"en":"`git restore --staged file` unstages a file; older guides use `git reset file`.","pt":"`git restore --staged arquivo` tira o arquivo da preparação; guias antigos usam `git reset arquivo`.","es":"`git restore --staged archivo` saca el archivo de la preparación; las guías antiguas usan `git reset archivo`."},{"en":"Unstaging doesn't touch your copy of the file: only the next commit changes.","pt":"Tirar da preparação não mexe na sua cópia do arquivo: só muda o próximo commit.","es":"Sacar de la preparación no toca tu copia del archivo: solo cambia el próximo commit."},{"en":"Passwords and keys must never be committed: once in the history, they're hard to remove.","pt":"Senhas e chaves nunca devem entrar num commit: depois de irem para o histórico, são difíceis de remover.","es":"Las contraseñas y claves nunca deben entrar en un commit: una vez en el historial, son difíciles de quitar."}],"mission":{"prompt":{"en":"Someone ran `git add .` and staged `secret.env`, which holds a password. Unstage it and commit the other files with the message `Add login page`.","pt":"Alguém rodou `git add .` e preparou o `secret.env`, que tem uma senha. Tire-o da preparação e faça o commit dos outros arquivos com a mensagem `Adicionar página de login`.","es":"Alguien ejecutó `git add .` y preparó `secret.env`, que tiene una contraseña. Sácalo de la preparación y haz commit de los demás archivos con el mensaje `Añadir página de login`."},"hint":{"en":"`git restore --staged secret.env`, then `git commit -m \"Add login page\"`.","pt":"`git restore --staged secret.env` e depois `git commit -m \"Adicionar página de login\"`.","es":"`git restore --staged secret.env` y luego `git commit -m \"Añadir página de login\"`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"login.html":"<form>user, password</form>\n","login.js":"checkLogin();\n","secret.env":"DB_PASSWORD=hunter2\n"}},"git add ."],"goals":[{"t":"msg","ref":"HEAD","is":{"en":"Add login page","pt":"Adicionar página de login","es":"Añadir página de login"}},{"t":"inCommit","ref":"HEAD","path":"login.html"},{"t":"inCommit","ref":"HEAD","path":"login.js"},{"t":"inCommit","ref":"HEAD","path":"secret.env","no":true},{"t":"exists","path":"secret.env"}],"chips":["git status","git restore --staged secret.env","git commit -m \"\""],"solution":["git restore --staged secret.env","git commit -m '{msg}'"],"wrong":[["git commit -m '{msg}'"],["rm secret.env","git add .","git commit -m '{msg}'"]]},"quiz":{"q":{"en":"What happens to `secret.env` in your folder after `git restore --staged secret.env`?","pt":"O que acontece com o `secret.env` na sua pasta depois de `git restore --staged secret.env`?","es":"¿Qué le pasa a `secret.env` en tu carpeta tras `git restore --staged secret.env`?"},"options":[{"en":"It is deleted","pt":"É apagado","es":"Se borra"},{"en":"It goes back to the last commit","pt":"Volta para o último commit","es":"Vuelve al último commit"},{"en":"Nothing: it stays as it is, just not staged","pt":"Nada: continua igual, só não está preparado","es":"Nada: sigue igual, solo que no está preparado"}],"answer":2,"explain":{"en":"`--staged` only changes the staging area. Without it, `git restore` would change your file.","pt":"O `--staged` só muda a área de preparação. Sem ele, o `git restore` mudaria o seu arquivo.","es":"`--staged` solo cambia la área de preparación. Sin él, `git restore` cambiaría tu archivo."}}},{"id":"ignore","track":"changes","mins":4,"title":{"en":"Ignore files with .gitignore","pt":"Ignorar arquivos com .gitignore","es":"Ignorar archivos con .gitignore"},"intro":{"en":"Some files should never be committed: logs, build output, downloaded libraries. List them in a `.gitignore` file and Git stops offering them.","pt":"Alguns arquivos nunca devem ir para um commit: logs, arquivos gerados, bibliotecas baixadas. Liste-os num arquivo `.gitignore` e o Git deixa de oferecê-los.","es":"Algunos archivos nunca deben ir a un commit: logs, archivos generados, bibliotecas descargadas. Enuméralos en un archivo `.gitignore` y Git deja de ofrecerlos."},"ideas":[{"en":"Each line of `.gitignore` is a pattern: `*.log` matches every file ending in .log.","pt":"Cada linha do `.gitignore` é um padrão: `*.log` pega todo arquivo terminado em .log.","es":"Cada línea de `.gitignore` es un patrón: `*.log` coincide con todo archivo terminado en .log."},{"en":"A name ending in `/` matches a folder and everything inside it, like `node_modules/`.","pt":"Um nome terminado em `/` pega uma pasta e tudo o que há dentro, como `node_modules/`.","es":"Un nombre terminado en `/` coincide con una carpeta y todo su contenido, como `node_modules/`."},{"en":"`.gitignore` is a normal file: commit it so the whole team ignores the same things.","pt":"O `.gitignore` é um arquivo normal: faça o commit dele para a equipe toda ignorar as mesmas coisas.","es":"`.gitignore` es un archivo normal: haz commit de él para que todo el equipo ignore lo mismo."}],"note":{"en":"Create the file with `echo \"*.log\" > .gitignore` and add lines with `>>`, or type `edit .gitignore` to open the editor.","pt":"Crie o arquivo com `echo \"*.log\" > .gitignore` e acrescente linhas com `>>`, ou digite `edit .gitignore` para abrir o editor.","es":"Crea el archivo con `echo \"*.log\" > .gitignore` y añade líneas con `>>`, o escribe `edit .gitignore` para abrir el editor."},"mission":{"prompt":{"en":"Make Git ignore every `.log` file and the `node_modules/` folder, then commit `.gitignore` with the message `Ignore logs and dependencies`.","pt":"Faça o Git ignorar todo arquivo `.log` e a pasta `node_modules/`, e faça o commit do `.gitignore` com a mensagem `Ignorar logs e dependências`.","es":"Haz que Git ignore todo archivo `.log` y la carpeta `node_modules/`, y haz commit de `.gitignore` con el mensaje `Ignorar logs y dependencias`."},"hint":{"en":"`echo \"*.log\" > .gitignore`, then `echo \"node_modules/\" >> .gitignore`. `git status` should list only `.gitignore`; add it and commit.","pt":"`echo \"*.log\" > .gitignore` e depois `echo \"node_modules/\" >> .gitignore`. O `git status` deve listar só o `.gitignore`; adicione e faça o commit.","es":"`echo \"*.log\" > .gitignore` y luego `echo \"node_modules/\" >> .gitignore`. `git status` debería listar solo `.gitignore`; añádelo y haz commit."},"setup":["git init",{"files":{"app.js":"start();\n"}},"git add .","git commit -m 'Start the app'",{"files":{"debug.log":"boot ok\n","error.log":"none\n","node_modules/left-pad/index.js":"module.exports = pad;\n","node_modules/left-pad/package.json":"{}\n"}}],"goals":[{"t":"inCommit","ref":"HEAD","path":".gitignore"},{"t":"msg","ref":"HEAD","is":{"en":"Ignore logs and dependencies","pt":"Ignorar logs e dependências","es":"Ignorar logs y dependencias"}},{"t":"noUntracked"},{"t":"notTracked","paths":["debug.log","error.log","node_modules/left-pad/index.js"]},{"t":"exists","path":"debug.log"}],"chips":["git status","echo \"*.log\" > .gitignore","echo \"node_modules/\" >> .gitignore","git add .gitignore"],"solution":["echo '*.log' > .gitignore","echo 'node_modules/' >> .gitignore","git status","git add .gitignore","git commit -m '{msg}'"],"wrong":[["echo '*.log' > .gitignore","git add .gitignore","git commit -m '{msg}'"],["git add .","git commit -m '{msg}'"],["rm -r node_modules","rm debug.log error.log","echo x > .gitignore","git add .","git commit -m '{msg}'"]]},"quiz":{"q":{"en":"Which `.gitignore` line ignores the whole `build` folder?","pt":"Qual linha do `.gitignore` ignora a pasta `build` inteira?","es":"¿Qué línea de `.gitignore` ignora toda la carpeta `build`?"},"options":[{"en":"`build/`","pt":"`build/`","es":"`build/`"},{"en":"`*.build`","pt":"`*.build`","es":"`*.build`"},{"en":"`!build`","pt":"`!build`","es":"`!build`"}],"answer":0,"explain":{"en":"A trailing slash means a folder. `*.build` matches files ending in .build, and `!` un-ignores a pattern.","pt":"A barra no fim indica pasta. `*.build` pega arquivos terminados em .build, e `!` desfaz um padrão.","es":"La barra final indica carpeta. `*.build` coincide con archivos terminados en .build, y `!` anula un patrón."}}},{"id":"branch","track":"branches","mins":4,"title":{"en":"Branches are pointers","pt":"Branches são ponteiros","es":"Las ramas son punteros"},"intro":{"en":"A **branch** lets you work on something new without touching the main line. In Git it is just a label that points at a commit, so creating one is instant.","pt":"Uma **branch** (ramo) deixa você trabalhar em algo novo sem mexer na linha principal. No Git ela é só um rótulo que aponta para um commit, então criar uma é instantâneo.","es":"Una **rama** (branch) te deja trabajar en algo nuevo sin tocar la línea principal. En Git es solo una etiqueta que apunta a un commit, así que crear una es instantáneo."},"ideas":[{"en":"`git branch` lists branches; `git switch -c name` creates one and moves to it (`git checkout -b` in older guides).","pt":"`git branch` lista as branches; `git switch -c nome` cria uma e vai para ela (`git checkout -b` nos guias antigos).","es":"`git branch` lista las ramas; `git switch -c nombre` crea una y se mueve a ella (`git checkout -b` en guías antiguas)."},{"en":"New commits move the branch you are on forward; every other branch stays where it was.","pt":"Commits novos fazem avançar a branch em que você está; as outras ficam onde estavam.","es":"Los commits nuevos hacen avanzar la rama en la que estás; las demás se quedan donde estaban."},{"en":"`main` is just the conventional name of the main branch: technically it's like any other.","pt":"`main` é só o nome convencional da branch principal: tecnicamente é igual às outras.","es":"`main` es solo el nombre convencional de la rama principal: técnicamente es como las demás."}],"mission":{"prompt":{"en":"Create a branch `dark-mode`, switch to it and commit a new file `dark.css` there. `main` must stay where it is.","pt":"Crie uma branch `dark-mode`, vá para ela e faça lá o commit de um arquivo novo `dark.css`. A `main` deve ficar onde está.","es":"Crea una rama `dark-mode`, cámbiate a ella y haz allí commit de un archivo nuevo `dark.css`. `main` debe quedarse donde está."},"hint":{"en":"`git switch -c dark-mode`, then `echo \"body { background: #111 }\" > dark.css`, `git add dark.css` and `git commit -m \"Add dark mode\"`.","pt":"`git switch -c dark-mode`, depois `echo \"body { background: #111 }\" > dark.css`, `git add dark.css` e `git commit -m \"Adicionar modo escuro\"`.","es":"`git switch -c dark-mode`, luego `echo \"body { background: #111 }\" > dark.css`, `git add dark.css` y `git commit -m \"Añadir modo oscuro\"`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'"],"goals":[{"t":"branch","name":"dark-mode"},{"t":"on","branch":"dark-mode"},{"t":"inCommit","ref":"dark-mode","path":"dark.css"},{"t":"same","a":"main","b":"@main"}],"chips":["git switch -c dark-mode","git branch","echo \"body { background: #111 }\" > dark.css","git add dark.css"],"solution":["git switch -c dark-mode","echo 'body { background: #111 }' > dark.css","git add dark.css","git commit -m 'Add dark mode'"],"wrong":[["echo x > dark.css","git add dark.css","git commit -m x","git switch -c dark-mode"],["git branch dark-mode","echo x > dark.css","git add dark.css","git commit -m x"]]},"quiz":{"q":{"en":"You're on `dark-mode` and make a commit. What happens to `main`?","pt":"Você está na `dark-mode` e faz um commit. O que acontece com a `main`?","es":"Estás en `dark-mode` y haces un commit. ¿Qué le pasa a `main`?"},"options":[{"en":"It is deleted","pt":"Ela é apagada","es":"Se borra"},{"en":"Nothing: it keeps pointing at the same commit","pt":"Nada: continua apontando para o mesmo commit","es":"Nada: sigue apuntando al mismo commit"},{"en":"It moves forward too","pt":"Ela também avança","es":"También avanza"}],"answer":1,"explain":{"en":"Only the current branch moves. That's what keeps work on different branches separate.","pt":"Só a branch atual se move. É isso que mantém separado o trabalho em branches diferentes.","es":"Solo se mueve la rama actual. Eso mantiene separado el trabajo en ramas distintas."}}},{"id":"head","track":"branches","mins":4,"title":{"en":"HEAD and moving through history","pt":"HEAD e andar pelo histórico","es":"HEAD y moverse por el historial"},"intro":{"en":"**HEAD** marks where you are. Usually it points at a branch, but you can also point it at any old commit to look at the project as it was.","pt":"O **HEAD** marca onde você está. Normalmente aponta para uma branch, mas também pode apontar para qualquer commit antigo para ver o projeto como era.","es":"**HEAD** marca dónde estás. Normalmente apunta a una rama, pero también puede apuntar a cualquier commit antiguo para ver el proyecto como era."},"ideas":[{"en":"`git switch branch` moves HEAD to another branch and updates your files to match.","pt":"`git switch branch` move o HEAD para outra branch e atualiza os arquivos.","es":"`git switch rama` mueve HEAD a otra rama y actualiza tus archivos."},{"en":"`git checkout <hash>` visits an old commit in **detached HEAD** state: no branch moves if you commit there.","pt":"`git checkout <hash>` visita um commit antigo em estado de **HEAD destacado** (detached HEAD): nenhuma branch avança se você fizer commit ali.","es":"`git checkout <hash>` visita un commit antiguo en estado de **HEAD separado** (detached HEAD): ninguna rama avanza si haces commit ahí."},{"en":"`git switch -c name <hash>` creates a branch at any commit: the safe way to start work from the past.","pt":"`git switch -c nome <hash>` cria uma branch em qualquer commit: o jeito seguro de começar a trabalhar a partir do passado.","es":"`git switch -c nombre <hash>` crea una rama en cualquier commit: la forma segura de empezar a trabajar desde el pasado."}],"mission":{"prompt":{"en":"Version 1.0 (the commit `Release 1.0`) needs an urgent fix. Create a branch `hotfix` starting **at that commit** and switch to it.","pt":"A versão 1.0 (o commit `Release 1.0`) precisa de uma correção urgente. Crie uma branch `hotfix` começando **nesse commit** e vá para ela.","es":"La versión 1.0 (el commit `Release 1.0`) necesita un arreglo urgente. Crea una rama `hotfix` que empiece **en ese commit** y cámbiate a ella."},"hint":{"en":"Find the hash with `git log --oneline`, then `git switch -c hotfix <hash>`. Or `git checkout <hash>` followed by `git switch -c hotfix`.","pt":"Ache o hash com `git log --oneline` e rode `git switch -c hotfix <hash>`. Ou `git checkout <hash>` seguido de `git switch -c hotfix`.","es":"Busca el hash con `git log --oneline` y ejecuta `git switch -c hotfix <hash>`. O `git checkout <hash>` seguido de `git switch -c hotfix`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'","git commit --allow-empty -m 'Release 1.0'",{"files":{"blog.html":"<h2>Blog</h2>\n"}},"git add blog.html","git commit -m 'Start the blog'",{"files":{"blog.html":"<h2>Blog</h2>\n<p>First post</p>\n"}},"git commit -am 'First post'"],"goals":[{"t":"branch","name":"hotfix"},{"t":"same","a":"hotfix","b":"{sha:Release 1.0}"},{"t":"on","branch":"hotfix"},{"t":"same","a":"main","b":"@main"}],"chips":["git log --oneline","git switch -c hotfix ","git checkout "],"solution":["git log --oneline","git switch -c hotfix {sha:Release 1.0}"],"wrong":[["git switch -c hotfix"],["git checkout {sha:Release 1.0}"],["git branch hotfix {sha:Release 1.0}"]]},"quiz":{"q":{"en":"In detached HEAD, what does HEAD point at?","pt":"Em detached HEAD, para onde aponta o HEAD?","es":"En detached HEAD, ¿a qué apunta HEAD?"},"options":[{"en":"At the `main` branch","pt":"Para a branch `main`","es":"A la rama `main`"},{"en":"At nothing: the repository is broken","pt":"Para nada: o repositório quebrou","es":"A nada: el repositorio está roto"},{"en":"Straight at a commit, not at a branch","pt":"Direto para um commit, não para uma branch","es":"Directamente a un commit, no a una rama"}],"answer":2,"explain":{"en":"Detached just means HEAD names a commit directly. Create a branch there if you want to keep commits you make.","pt":"Destacado só quer dizer que o HEAD aponta direto para um commit. Crie uma branch ali se quiser manter os commits que fizer.","es":"Separado solo significa que HEAD apunta directamente a un commit. mpares both tips with their common ancestor and creates a **merge commit** with two parents.","pt":"Se as duas branches ganharam commits novos, o Git não consegue só deslizar uma. Ele compara as duas pontas com o ancestral comum e cria um **commit de merge** com dois pais.","es":"Si las dos ramas recibieron commits nuevos, Git no puede solo deslizar una. Compara las dos puntas con su ancestro común y crea un **commit de fusión** con dos padres."},"ideas":[{"en":"Three versions take part: the common ancestor (the merge base) and the tips of the two branches.","pt":"Participam três versões: o ancestral comum (a base do merge) e as pontas das duas branches.","es":"Participan tres versiones: el ancestro común (la base de la fusión) y las puntas de las dos ramas."},{"en":"Changes in different files or different parts of a file are combined automatically.","pt":"Mudanças em arquivos diferentes ou em partes diferentes de um arquivo são combinadas automaticamente.","es":"Los cambios en archivos distintos o en partes distintas de un archivo se combinan automáticamente."},{"en":"The merge commit records that two lines of work came together; the graph shows it as a join.","pt":"O commit de merge registra que duas linhas de trabalho se juntaram; o grafo mostra isso como uma junção.","es":"El commit de fusión registra que dos líneas de trabajo se unieron; el grafo lo muestra como una unión."}],"mission":{"prompt":{"en":"`main` and `newsletter` both have new commits. Merge `newsletter` into `main`: Git will create a merge commit.","pt":"A `main` e a `newsletter` têm commits novos. Faça o merge da `newsletter` na `main`: o Git vai criar um commit de merge.","es":"`main` y `newsletter` tienen commits nuevos. Fusiona `newsletter` en `main`: Git creará un commit de fusión."},"hint":{"en":"You're on `main` already: `git merge newsletter`. Then look at the graph.","pt":"Você já está na `main`: `git merge newsletter`. Depois olhe o grafo.","es":"Ya estás en `main`: `git merge newsletter`. Luego mira el grafo."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'","git switch -c newsletter",{"files":{"signup.html":"<form>email</form>\n"}},"git add signup.html","git commit -m 'Add newsletter form'","git switch main",{"files":{"style.css":"body { font-family: sans-serif; }\nh1 { color: #b5651d; }\n"}},"git commit -am 'Brown headings'"],"goals":[{"t":"on","branch":"main"},{"t":"parents","ref":"main","n":2},{"t":"ancestor","a":"newsletter","b":"main"},{"t":"inCommit","ref":"main","path":"signup.html"}],"chips":["git merge newsletter","git log --oneline --graph"],"solution":["git merge newsletter"],"wrong":[["git switch newsletter","git merge main"],["git switch newsletter","git rebase main","git switch main","git merge newsletter"]]},"quiz":{"q":{"en":"How many parents does a merge commit have?","pt":"Quantos pais tem um commit de merge?","es":"¿Cuántos padres tiene un commit de fusión?"},"options":[{"en":"None","pt":"Nenhum","es":"Ninguno"},{"en":"Two: the tips of both branches","pt":"Dois: as pontas das duas branches","es":"Dos: las puntas de las dos ramas"},{"en":"One, like every commit","pt":"Um, como todo commit","es":"Uno, como todo commit"}],"answer":1,"explain":{"en":"Its first parent is where you were (`main`), the second is the branch you merged.","pt":"O primeiro pai é onde você estava (`main`); o segundo é a branch que entrou no merge.","es":"Su primer padre es donde estabas (`main`); el segundo es la rama que fusionaste."}}},{"id":"conflict","track":"conflicts","mins":5,"title":{"en":"Resolving a merge conflict","pt":"Resolvendo um conflito de merge","es":"Resolver un conflicto de fusión"},"intro":{"en":"When both branches changed the same lines, Git can't choose for you. It stops the merge, marks the conflict in the file and waits for you to decide.","pt":"Quando as duas branches mudaram as mesmas linhas, o Git não tem como escolher por você. Ele para o merge, marca o conflito no arquivo e espera você decidir.","es":"Cuando las dos ramas cambiaron las mismas líneas, Git no puede elegir por ti. Detiene la fusión, marca el conflicto en el archivo y espera a que decidas."},"ideas":[{"en":"The file shows both versions: yours between `<<<<<<< HEAD` and `=======`, theirs up to `>>>>>>> branch`.","pt":"O arquivo mostra as duas versões: a sua entre `<<<<<<< HEAD` e `=======`, a outra até `>>>>>>> branch`.","es":"El archivo muestra las dos versiones: la tuya entre `<<<<<<< HEAD` y `=======`, la otra hasta `>>>>>>> rama`."},{"en":"Edit the file into its final form and delete the three marker lines.","pt":"Edite o arquivo até a forma final e apague as três linhas de marcação.","es":"Edita el archivo hasta su forma final y borra las tres líneas de marcas."},{"en":"Then `git add` the file to mark it resolved and `git commit` to finish the merge. `git merge --abort` cancels instead.","pt":"Depois, `git add` no arquivo para marcá-lo como resolvido e `git commit` para terminar o merge. `git merge --abort` cancela.","es":"Después, `git add` del archivo para marcarlo como resuelto y `git commit` para terminar la fusión. `git merge --abort` la cancela."}],"note":{"en":"Type `edit menu.txt` (or tap the file in the Files panel) to open it in the editor.","pt":"Digite `edit menu.txt` (ou toque no arquivo no painel Arquivos) para abri-lo no editor.","es":"Escribe `edit menu.txt` (o toca el archivo en el panel Archivos) para abrirlo en el editor."},"mission":{"prompt":{"en":"Merge `shop` into `main`. Both branches added a line to the menu: keep **both** Blog and Shop, then finish the merge.","pt":"Faça o merge da `shop` na `main`. As duas branches adicionaram uma linha ao menu: mantenha **as duas**, Blog e Shop, e termine o merge.","es":"Fusiona `shop` en `main`. Las dos ramas añadieron una línea al menú: conserva **las dos**, Blog y Shop, y termina la fusión."},"hint":{"en":"`git merge shop`, then `edit menu.txt`: leave `- Blog` and `- Shop` and remove the `<<<<<<<`, `=======` and `>>>>>>>` lines. Save, `git add menu.txt`, `git commit`.","pt":"`git merge shop`, depois `edit menu.txt`: deixe `- Blog` e `- Shop` e apague as linhas `<<<<<<<`, `=======` e `>>>>>>>`. Salve, `git add menu.txt`, `git commit`.","es":"`git merge shop`, luego `edit menu.txt`: deja `- Blog` y `- Shop` y borra las líneas `<<<<<<<`, `=======` y `>>>>>>>`. Guarda, `git add menu.txt`, `git commit`."},"setup":["git init",{"files":{"menu.txt":"Menu\n- Home\n- About\n"}},"git add .","git commit -m 'Create the menu'","git switch -c shop",{"files":{"menu.txt":"Menu\n- Home\n- About\n- Shop\n"}},"git commit -am 'Add Shop to the menu'","git switch main",{"files":{"menu.txt":"Menu\n- Home\n- About\n- Blog\n"}},"git commit -am 'Add Blog to the menu'"],"goals":[{"t":"parents","ref":"main","n":2},{"t":"ancestor","a":"shop","b":"main"},{"t":"fileHas","ref":"main","path":"menu.txt","text":["- Blog","- Shop","- About"]},{"t":"noMarkers","ref":"main","path":"menu.txt"},{"t":"noOp"}],"chips":["git merge shop","git status","edit menu.txt","git add menu.txt","git commit"],"solution":["git merge shop","printf 'Menu\\n- Home\\n- About\\n- Blog\\n- Shop\\n' > menu.txt","git add menu.txt","git commit"],"wrong":[["git merge shop","git add menu.txt","git commit"],["git merge shop","printf 'Menu\\n- Home\\n- About\\n- Shop\\n' > menu.txt","git add menu.txt","git commit"],["git merge shop","git merge --abort"]]},"quiz":{"q":{"en":"What does `git add` mean during a merge conflict?","pt":"O que significa `git add` durante um conflito de merge?","es":"¿Qué significa `git add` durante un conflicto de fusión?"},"options":[{"en":"Add the other branch's version","pt":"Adicione a versão da outra branch","es":"Añade la versión de la otra rama"},{"en":"Cancel the merge","pt":"Cancele o merge","es":"Cancela la fusión"},{"en":"This file is resolved","pt":"Este arquivo está resolvido","es":"Este archivo está resuelto"}],"answer":2,"explain":{"en":"Staging a conflicted file tells Git you've settled it. When none are left, `git commit` creates the merge commit.","pt":"Preparar um arquivo em conflito diz ao Git que você o resolveu. Quando não sobra nenhum, `git commit` cria o commit de merge.","es":"Preparar un archivo en conflicto le dice a Git que lo resolviste. Cuando no queda ninguno, `git commit` crea el commit de fusión."}}},{"id":"sides","track":"conflicts","mins":4,"title":{"en":"Pick a side: --ours and --theirs","pt":"Escolher um lado: --ours e --theirs","es":"Elegir un lado: --ours y --theirs"},"intro":{"en":"Sometimes one side of a conflict is simply right. Instead of editing by hand, take that whole version of the file.","pt":"Às vezes um dos lados do conflito simplesmente está certo. Em vez de editar à mão, fique com aquela versão inteira do arquivo.","es":"A veces uno de los lados del conflicto simplemente es el correcto. En vez de editar a mano, quédate con esa versión completa del archivo."},"ideas":[{"en":"During a merge, **ours** is the branch you're on and **theirs** is the branch coming in.","pt":"Durante um merge, **ours** (nosso) é a branch em que você está e **theirs** (deles) é a branch que está entrando.","es":"Durante una fusión, **ours** (nuestro) es la rama en la que estás y **theirs** (suyo) es la rama que entra."},{"en":"`git checkout --theirs file` (or `git restore --theirs file`) takes their version; `--ours` keeps yours.","pt":"`git checkout --theirs arquivo` (ou `git restore --theirs arquivo`) pega a versão deles; `--ours` fica com a sua.","es":"`git checkout --theirs archivo` (o `git restore --theirs archivo`) toma su versión; `--ours` conserva la tuya."},{"en":"Then `git add` and `git commit` as usual. Changed your mind? `git merge --abort` goes back to before the merge.","pt":"Depois, `git add` e `git commit` como sempre. Mudou de ideia? `
