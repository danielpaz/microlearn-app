h -u`.","es":"Los archivos nuevos quedan fuera, salvo que uses `git stash -u`."}],"mission":{"prompt":{"en":"You're halfway through changes to `index.html` when an urgent typo shows up in `contact.html` (`Contcat`). Stash your work, fix the typo, commit it alone as `Fix typo`, then bring your work back.","pt":"Você está no meio de mudanças no `index.html` quando aparece um erro urgente em `contact.html` (`Contcat`). Guarde o trabalho no stash, corrija o erro, faça o commit só dele como `Corrigir erro de digitação` e depois traga o trabalho de volta.","es":"Estás a mitad de cambios en `index.html` cuando aparece una errata urgente en `contact.html` (`Contcat`). Guarda tu trabajo en el stash, corrige la errata, haz commit solo de ella como `Corregir errata` y luego recupera tu trabajo."},"hint":{"en":"`git stash`, then `echo \"<h1>Contact us</h1>\" > contact.html`, `git commit -am \"Fix typo\"`, and `git stash pop`.","pt":"`git stash`, depois `echo \"<h1>Contact us</h1>\" > contact.html`, `git commit -am \"Corrigir erro de digitação\"` e `git stash pop`.","es":"`git stash`, luego `echo \"<h1>Contact us</h1>\" > contact.html`, `git commit -am \"Corregir errata\"` y `git stash pop`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n","contact.html":"<h1>Contcat us</h1>\n"}},"git add .","git commit -m 'Create the website'",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>New: weekend brunch (draft)</p>\n"}}],"goals":[{"t":"msg","ref":"HEAD","is":{"en":"Fix typo","pt":"Corrigir erro de digitação","es":"Corregir errata"}},{"t":"changedOnly","ref":"HEAD","paths":["contact.html"]},{"t":"fileHas","ref":"HEAD","path":"contact.html","text":["Contact us"]},{"t":"wtHas","path":"index.html","text":"weekend brunch"},{"t":"stashCount","n":0}],"chips":["git stash","echo \"<h1>Contact us</h1>\" > contact.html","git commit -am \"\"","git stash pop"],"solution":["git stash","echo '<h1>Contact us</h1>' > contact.html","git commit -am '{msg}'","git stash pop"],"wrong":[["echo '<h1>Contact us</h1>' > contact.html","git commit -am '{msg}'"],["git stash","echo '<h1>Contact us</h1>' > contact.html","git commit -am '{msg}'"]]},"quiz":{"q":{"en":"What does `git stash pop` do?","pt":"O que faz o `git stash pop`?","es":"¿Qué hace `git stash pop`?"},"options":[{"en":"Commits the stashed changes","pt":"Faz commit das mudanças guardadas","es":"Hace commit de los cambios guardados"},{"en":"Brings back the latest stash and removes it from the list","pt":"Traz de volta o stash mais recente e o tira da lista","es":"Recupera el stash más reciente y lo quita de la lista"},{"en":"Deletes every stash","pt":"Apaga todos os stashes","es":"Borra todos los stashes"}],"answer":1,"explain":{"en":"`pop` = apply + drop. Use `git stash apply` to bring changes back but keep the stash.","pt":"`pop` = apply + drop. Use `git stash apply` para trazer de volta e manter o stash.","es":"`pop` = apply + drop. Usa `git stash apply` para recuperar los cambios y conservar el stash."}}},{"id":"tags","track":"conflicts","mins":3,"title":{"en":"Tags for releases","pt":"Tags para versões","es":"Etiquetas para versiones"},"intro":{"en":"A **tag** is a permanent name for a commit, usually a version number such as `v1.0`. Unlike a branch, it never moves.","pt":"Uma **tag** é um nome permanente para um commit, normalmente um número de versão como `v1.0`. Diferente de uma branch, ela nunca se move.","es":"Una **etiqueta** (tag) es un nombre permanente para un commit, normalmente un número de versión como `v1.0`. A diferencia de una rama, nunca se mueve."},"ideas":[{"en":"`git tag v0.9 <hash>` creates a lightweight tag: just a name for the commit.","pt":"`git tag v0.9 <hash>` cria uma tag leve: só um nome para o commit.","es":"`git tag v0.9 <hash>` crea una etiqueta ligera: solo un nombre para el commit."},{"en":"`git tag -a v1.0 -m \"message\"` creates an annotated tag, with author, date and message: use it for releases.","pt":"`git tag -a v1.0 -m \"mensagem\"` cria uma tag anotada, com autor, data e mensagem: use para versões publicadas.","es":"`git tag -a v1.0 -m \"mensaje\"` crea una etiqueta anotada, con autor, fecha y mensaje: úsala para versiones publicadas."},{"en":"Tags are not sent by a plain `git push`: use `git push origin v1.0` or `git push --tags`.","pt":"Tags não vão num `git push` simples: use `git push origin v1.0` ou `git push --tags`.","es":"Las etiquetas no se envían con un `git push` simple: usa `git push origin v1.0` o `git push --tags`."}],"mission":{"prompt":{"en":"Mark the current commit as `v1.0` with an annotated tag (message `First release`), and the older commit `Beta ready` with the tag `v0.9`.","pt":"Marque o commit atual como `v1.0` com uma tag anotada (mensagem `Primeira versão`) e o commit antigo `Beta ready` com a tag `v0.9`.","es":"Marca el commit actual como `v1.0` con una etiqueta anotada (mensaje `Primera versión`) y el commit antiguo `Beta ready` con la etiqueta `v0.9`."},"hint":{"en":"`git tag -a v1.0 -m \"First release\"`; find the hash of `Beta ready` with `git log --oneline` and run `git tag v0.9 <hash>`.","pt":"`git tag -a v1.0 -m \"Primeira versão\"`; ache o hash de `Beta ready` com `git log --oneline` e rode `git tag v0.9 <hash>`.","es":"`git tag -a v1.0 -m \"Primera versión\"`; busca el hash de `Beta ready` con `git log --oneline` y ejecuta `git tag v0.9 <hash>`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'","git commit --allow-empty -m 'Beta ready'",{"files":{"prices.html":"<h2>Prices</h2>\n"}},"git add .","git commit -m 'Add prices'","git commit --allow-empty -m 'Final checks'"],"goals":[{"t":"tag","name":"v1.0","at":"HEAD","annotated":true,"msg":{"en":"First release","pt":"Primeira versão","es":"Primera versión"}},{"t":"tag","name":"v0.9","at":"{sha:Beta ready}"}],"chips":["git tag -a v1.0 -m \"\"","git log --oneline","git tag v0.9 ","git tag"],"solution":["git tag -a v1.0 -m '{msg}'","git tag v0.9 {sha:Beta ready}"],"wrong":[["git tag v1.0","git tag v0.9 {sha:Beta ready}"],["git tag -a v1.0 -m '{msg}'","git tag v0.9"]]},"quiz":{"q":{"en":"What's the difference between a tag and a branch?","pt":"Qual é a diferença entre uma tag e uma branch?","es":"¿Cuál es la diferencia entre una etiqueta y una rama?"},"options":[{"en":"A tag can only point at the first commit","pt":"Uma tag só pode apontar para o primeiro commit","es":"Una etiqueta solo puede apuntar al primer commit"},{"en":"A tag copies the files","pt":"Uma tag copia os arquivos","es":"Una etiqueta copia los archivos"},{"en":"A tag stays on its commit; a branch moves with new commits","pt":"A tag fica no commit dela; a branch anda com os commits novos","es":"La etiqueta se queda en su commit; la rama avanza con los commits nuevos"}],"answer":2,"explain":{"en":"Both are names for commits, but only branches move. That's why releases are tagged.","pt":"As duas são nomes para commits, mas só a branch se move. Por isso versões levam tag.","es":"Las dos son nombres para commits, pero solo la rama se mueve. Por eso las versiones llevan etiqueta."}}},{"id":"push","track":"remotes","mins":4,"title":{"en":"Publish your work: push","pt":"Publicar o trabalho: push","es":"Publicar tu trabajo: push"},"intro":{"en":"A **remote** is another copy of the repository, usually on a server such as GitHub or GitLab. `git push` sends your commits there so others can get them.","pt":"Um **remoto** é outra cópia do repositório, normalmente num servidor como GitHub ou GitLab. O `git push` envia seus commits para lá, para os outros poderem pegá-los.","es":"Un **remoto** es otra copia del repositorio, normalmente en un servidor como GitHub o GitLab. `git push` envía tus commits allí para que otros puedan obtenerlos."},"ideas":[{"en":"`git remote add origin <url>` gives the server a short name; `origin` is the usual one.","pt":"`git remote add origin <url>` dá um nome curto ao servidor; `origin` é o mais comum.","es":"`git remote add origin <url>` le da un nombre corto al servidor; `origin` es el habitual."},{"en":"`git push -u origin main` sends `main` and sets **upstream**: from then on, `git push` alone is enough.","pt":"`git push -u origin main` envia a `main` e define o **upstream**: daí em diante, basta `git push`.","es":"`git push -u origin main` envía `main` y define el **upstream**: a partir de ahí, basta con `git push`."},{"en":"`origin/main` in the graph is your record of where `main` is on the server.","pt":"`origin/main` no grafo é o seu registro de onde a `main` está no servidor.","es":"`origin/main` en el grafo es tu registro de dónde está `main` en el servidor."}],"note":{"en":"The server here is simulated in your browser, so nothing leaves this page.","pt":"O servidor aqui é simulado no navegador, então nada sai desta página.","es":"El servidor aquí está simulado en el navegador, así que nada sale de esta página."},"mission":{"prompt":{"en":"An empty repository was created for you at `https://git.micro/you/portfolio.git`. Add it as the remote `origin` and push `main` to it, setting the upstream.","pt":"Um repositório vazio foi criado para você em `https://git.micro/you/portfolio.git`. Adicione-o como o remoto `origin` e faça o push da `main` para ele, definindo o upstream.","es":"Se creó para ti un repositorio vacío en `https://git.micro/you/portfolio.git`. Añádelo como el remoto `origin` y haz push de `main` a él, definiendo el upstream."},"hint":{"en":"`git remote add origin https://git.micro/you/portfolio.git`, then `git push -u origin main`.","pt":"`git remote add origin https://git.micro/you/portfolio.git` e depois `git push -u origin main`.","es":"`git remote add origin https://git.micro/you/portfolio.git` y luego `git push -u origin main`."},"setup":[{"server":"https://git.micro/you/portfolio.git"},"git init",{"fi as por delante o por detrás."}}},{"id":"pull","track":"remotes","mins":4,"title":{"en":"Get updates: fetch and pull","pt":"Receber novidades: fetch e pull","es":"Recibir novedades: fetch y pull"},"intro":{"en":"Your teammates push to the same server. To work on top of their changes, bring them into your copy.","pt":"Seus colegas fazem push para o mesmo servidor. Para trabalhar em cima das mudanças deles, traga-as para a sua cópia.","es":"Tus compañeros hacen push al mismo servidor. Para trabajar sobre sus cambios, tráelos a tu copia."},"ideas":[{"en":"`git fetch` downloads new commits and updates `origin/main`, without touching your files.","pt":"`git fetch` baixa os commits novos e atualiza a `origin/main`, sem mexer nos seus arquivos.","es":"`git fetch` descarga los commits nuevos y actualiza `origin/main`, sin tocar tus archivos."},{"en":"`git pull` is a fetch followed by a merge of `origin/main` into your branch.","pt":"`git pull` é um fetch seguido do merge da `origin/main` na sua branch.","es":"`git pull` es un fetch seguido de la fusión de `origin/main` en tu rama."},{"en":"Pull before you start working, and you'll have fewer conflicts.","pt":"Faça pull antes de começar a trabalhar e você terá menos conflitos.","es":"Haz pull antes de empezar a trabajar y tendrás menos conflictos."}],"mission":{"prompt":{"en":"Ana pushed new commits to the shared repository. Bring them into your `main`.","pt":"A Ana fez push de commits novos no repositório compartilhado. Traga-os para a sua `main`.","es":"Ana hizo push de commits nuevos al repositorio compartido. Tráelos a tu `main`."},"hint":{"en":"`git pull`. Or, step by step: `git fetch`, look at the graph, then `git merge origin/main`.","pt":"`git pull`. Ou, passo a passo: `git fetch`, olhe o grafo e depois `git merge origin/main`.","es":"`git pull`. O, paso a paso: `git fetch`, mira el grafo y luego `git merge origin/main`."},"setup":[{"server":"https://git.micro/team/site.git"},{"teammate":{"url":"https://git.micro/team/site.git","branch":"main","changes":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n","README.md":"# Team site\n"},"msg":"Start the team site"}},"git clone https://git.micro/team/site.git .",{"teammate":{"url":"https://git.micro/team/site.git","branch":"main","changes":{"news.html":"<h2>News</h2>\n"},"msg":"Add news page"}},{"teammate":{"url":"https://git.micro/team/site.git","branch":"main","changes":{"news.html":"<h2>News</h2>\n<p>We open on Sundays!</p>\n"},"msg":"First news item"}}],"goals":[{"t":"historyHas","ref":"main","msg":"First news item"},{"t":"serverSame","url":"https://git.micro/team/site.git","branch":"main","as":"main"},{"t":"on","branch":"main"}],"chips":["git fetch","git status","git pull","git log --oneline"],"solution":["git pull"],"wrong":[["git fetch"],["git status"]]},"quiz":{"q":{"en":"What's the difference between `git fetch` and `git pull`?","pt":"Qual é a diferença entre `git fetch` e `git pull`?","es":"¿Cuál es la diferencia entre `git fetch` y `git pull`?"},"options":[{"en":"None: they're the same","pt":"Nenhuma: são iguais","es":"Ninguna: son iguales"},{"en":"Fetch only downloads; pull downloads and merges into your branch","pt":"Fetch só baixa; pull baixa e faz merge na sua branch","es":"Fetch solo descarga; pull descarga y fusiona en tu rama"},{"en":"Fetch sends your commits; pull receives","pt":"Fetch envia seus commits; pull recebe","es":"Fetch envía tus commits; pull recibe"}],"answer":1,"explain":{"en":"`git fetch` is always safe; `git pull` changes your branch and files.","pt":"O `git fetch` é sempre seguro; o `git pull` muda a sua branch e os arquivos.","es":"`git fetch` siempre es seguro; `git pull` cambia tu rama y tus archivos."}}},{"id":"rejected","track":"remotes","mins":5,"title":{"en":"When a push is rejected","pt":"Quando o push é recusado","es":"Cuando el push es rechazado"},"intro":{"en":"If someone pushed while you were working, the server refuses your push: accepting it would erase their commits. Integrate their work first.","pt":"Se alguém fez push enquanto você trabalhava, o servidor recusa o seu push: aceitar apagaria os commits da outra pessoa. Integre o trabalho dela primeiro.","es":"Si alguien hizo push mientras trabajabas, el servidor rechaza tu push: aceptarlo borraría sus commits. Integra su trabajo primero."},"ideas":[{"en":"\"rejected (fetch first)\" means the server has commits you don't have.","pt":"\"rejected (fetch first)\" quer dizer que o servidor tem commits que você não tem.","es":"\"rejected (fetch first)\" significa que el servidor tiene commits que tú no tienes."},{"en":"`git pull` brings them in (with a merge commit if the histories diverged), then `git push` works.","pt":"`git pull` traz esses commits (com um commit de merge se os históricos divergiram) e aí o `git push` funciona.","es":"`git pull` los trae (con un commit de fusión si los historiales divergieron) y entonces `git push` funciona."},{"en":"Never fix it with `git push --force`: that overwrites the server and deletes your teammates' work.","pt":"Nunca resolva com `git push --force`: isso sobrescreve o servidor e apaga o trabalho dos colegas.","es":"Nunca lo arregles con `git push --force`: eso sobrescribe el servidor y borra el trabajo de tus compañeros."}],"note":{"en":"This sandbox has `pull.rebase=false`, so `git pull` merges. `git pull --rebase` also works and gives a straight history.","pt":"Este ambiente tem `pull.rebase=false`, então o `git pull` faz merge. `git pull --rebase` também funciona e deixa o histórico em linha reta.","es":"Este entorno tiene `pull.rebase=false`, así que `git pull` fusiona. `git pull --rebase` también funciona y deja el historial en línea recta."},"mission":{"prompt":{"en":"You committed `Add gallery`, but Ana pushed first. Try to push, then integrate her work and publish yours, without losing anything.","pt":"Você fez o commit `Add gallery`, mas a Ana fez push antes. Tente o push, de icionar página de contato","es":"Añadir página de contacto"}},{"t":"inCommit","ref":"HEAD","path":"contact.css"},{"t":"same","a":"HEAD~1","b":"@HEAD~1","l":{"en":"No extra commit: the old one was replaced","pt":"Nenhum commit a mais: o antigo foi substituído","es":"Ningún commit extra: el viejo fue sustituido"}},{"t":"historyHas","ref":"HEAD","msg":"Add contcat page","no":true}],"chips":["git add contact.css","git commit --amend -m \"\"","git log --oneline"],"solution":["git add contact.css","git commit --amend -m '{msg}'"],"wrong":[["git add contact.css","git commit -m '{msg}'"],["git commit --amend -m '{msg}'"]]},"quiz":{"q":{"en":"After `git commit --amend`, the commit's hash…","pt":"Depois de `git commit --amend`, o hash do commit…","es":"Después de `git commit --amend`, el hash del commit…"},"options":[{"en":"is removed","pt":"é removido","es":"se elimina"},{"en":"changes: it's a new commit","pt":"muda: é um commit novo","es":"cambia: es un commit nuevo"},{"en":"stays the same","pt":"continua igual","es":"sigue igual"}],"answer":1,"explain":{"en":"The content changed, so the hash changes. That's why amending pushed commits causes trouble.","pt":"O conteúdo mudou, então o hash muda. Por isso fazer amend em commits enviados dá problema.","es":"El contenido cambió, así que el hash cambia. Por eso hacer amend en commits enviados da problemas."}}},{"id":"reset","track":"rewrite","mins":5,"title":{"en":"reset: move a branch back","pt":"reset: voltar uma branch","es":"reset: mover una rama hacia atrás"},"intro":{"en":"`git reset` moves the current branch to another commit. The commits after it leave the branch, and the options decide what happens to your files.","pt":"O `git reset` move a branch atual para outro commit. Os commits depois dele saem da branch, e as opções decidem o que acontece com os seus arquivos.","es":"`git reset` mueve la rama actual a otro commit. Los commits posteriores salen de la rama, y las opciones deciden qué pasa con tus archivos."},"ideas":[{"en":"`--soft` keeps every change staged; `--mixed` (the default) keeps them unstaged; `--hard` throws them away.","pt":"`--soft` mantém tudo preparado; `--mixed` (o padrão) mantém as mudanças sem preparar; `--hard` descarta.","es":"`--soft` mantiene todo preparado; `--mixed` (por defecto) mantiene los cambios sin preparar; `--hard` los descarta."},{"en":"`HEAD~3` means three commits before HEAD: `git reset --soft HEAD~3` + a commit squashes three commits into one.","pt":"`HEAD~3` quer dizer três commits antes do HEAD: `git reset --soft HEAD~3` + um commit juntam três commits em um.","es":"`HEAD~3` significa tres commits antes de HEAD: `git reset --soft HEAD~3` + un commit juntan tres commits en uno."},{"en":"Went too far? `git reflog` lists where HEAD has been, so `git reset --hard HEAD@{1}` undoes the reset.","pt":"Exagerou? O `git reflog` lista por onde o HEAD passou, então `git reset --hard HEAD@{1}` desfaz o reset.","es":"¿Te pasaste? `git reflog` lista por dónde pasó HEAD, así que `git reset --hard HEAD@{1}` deshace el reset."}],"mission":{"prompt":{"en":"The last three commits are all called `wip`. Squash them into a single commit `Add photo gallery`, keeping exactly the same final files.","pt":"Os três últimos commits se chamam `wip`. Junte-os num único commit `Adicionar galeria de fotos`, mantendo exatamente os mesmos arquivos no final.","es":"Los tres últimos commits se llaman `wip`. Júntalos en un solo commit `Añadir galería de fotos`, manteniendo exactamente los mismos archivos al final."},"hint":{"en":"`git reset --soft HEAD~3` (the changes stay staged), then `git commit -m \"Add photo gallery\"`.","pt":"`git reset --soft HEAD~3` (as mudanças ficam preparadas) e depois `git commit -m \"Adicionar galeria de fotos\"`.","es":"`git reset --soft HEAD~3` (los cambios quedan preparados) y luego `git commit -m \"Añadir galería de fotos\"`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'",{"files":{"gallery.html":"<h2>Gallery</h2>\n"}},"git add .","git commit -m 'wip'",{"files":{"gallery.html":"<h2>Gallery</h2>\n<img src=bread.jpg>\n"}},"git commit -am 'wip'",{"files":{"gallery.css":"img { width: 100%; }\n"}},"git add .","git commit -m 'wip'"],"goals":[{"t":"msg","ref":"HEAD","is":{"en":"Add photo gallery","pt":"Adicionar galeria de fotos","es":"Añadir galería de fotos"}},{"t":"same","a":"HEAD~1","b":"@HEAD~3","l":{"en":"The three `wip` commits became one","pt":"Os três commits `wip` viraram um","es":"Los tres commits `wip` se convirtieron en uno"}},{"t":"treeSame","a":"HEAD","b":"@HEAD","l":{"en":"The final files are exactly the same","pt":"Os arquivos finais são exatamente os mesmos","es":"Los archivos finales son exactamente los mismos"}},{"t":"historyHas","ref":"HEAD","msg":"wip","no":true}],"chips":["git log --oneline","git reset --soft HEAD~3","git status","git commit -m \"\""],"solution":["git reset --soft HEAD~3","git commit -m '{msg}'"],"wrong":[["git reset --hard HEAD~3","git commit --allow-empty -m '{msg}'"],["git reset --soft HEAD~2","git commit -m '{msg}'"],["git commit --amend -m '{msg}'"]]},"quiz":{"q":{"en":"Which reset throws away your changes?","pt":"Qual reset descarta as suas mudanças?","es":"¿Qué reset descarta tus cambios?"},"options":[{"en":"`git reset --soft`","pt":"`git reset --soft`","es":"`git reset --soft`"},{"en":"`git reset` (mixed)","pt":"`git reset` (mixed)","es":"`git reset` (mixed)"},{"en":"`git reset --hard`","pt":"`git reset --hard`","es":"`git reset --hard`"}],"answer":2,"explain":{"en":"Only `--hard` rewrites your files. Committed work can still be found with `git reflog`; uncommitted work can't.","pt":"Só o `--hard` reescreve os seus arquivos. O que tinha commit ainda aparece no `git reflog`; o que não tinha, não.","es":"Solo `--hard` ico commit para a branch atual.","es":"`git cherry-pick <hash>` copia un solo commit a la rama actual."}],"mission":{"prompt":{"en":"Replay your branch `search` on top of the latest `main` with a rebase, then fast-forward `main` to it. The history must end up as a straight line.","pt":"Reaplique a sua branch `search` em cima da `main` mais recente com um rebase e depois faça o fast-forward da `main` até ela. O histórico deve terminar em linha reta.","es":"Vuelve a aplicar tu rama `search` encima de la `main` más reciente con un rebase y luego haz fast-forward de `main` hasta ella. La historia debe quedar en línea recta."},"hint":{"en":"You're on `search`: `git rebase main`, then `git switch main` and `git merge search`.","pt":"Você está na `search`: `git rebase main`, depois `git switch main` e `git merge search`.","es":"Estás en `search`: `git rebase main`, luego `git switch main` y `git merge search`."},"setup":["git init",{"files":{"index.html":"<h1>Bakery Bloom</h1>\n<p>Fresh bread every morning.</p>\n","style.css":"body { font-family: sans-serif; }\n"}},"git add .","git commit -m 'Create the website'",{"files":{"menu.html":"<h2>Menu</h2>\n"}},"git add menu.html","git commit -m 'Add the menu'","git switch -c search",{"files":{"search.js":"find();\n"}},"git add .","git commit -m 'Add search box'",{"files":{"search.css":"input { border: 1px solid; }\n"}},"git add .","git commit -m 'Style search box'","git switch main",{"files":{"prices.html":"<h2>Prices</h2>\n"}},"git add .","git commit -m 'Add prices'",{"files":{"style.css":"body { font-family: serif; }\n"}},"git commit -am 'Serif font'","git switch search"],"goals":[{"t":"ancestor","a":"@main","b":"search","l":{"en":"`search` now starts from the latest `main`","pt":"A `search` agora começa da `main` mais recente","es":"`search` ahora empieza desde la `main` más reciente"}},{"t":"linear","ref":"main"},{"t":"historyHas","ref":"search","msg":"Style search box"},{"t":"same","a":"main","b":"search"},{"t":"on","branch   about: {"en": "<h1>About Git.Micro</h1>\n<p>Git.Micro is a micro-learning platform for Git, the version control system used by almost every software team. Each lesson takes three to five minutes: one idea, a mission you solve with real Git commands, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: first commits, changes under control, branches, conflicts and tools, remotes and teamwork, and rewriting history. {progress}</p>\n<h2>How the missions work</h2>\n<ul><li><b>A real terminal</b>: you type the same commands you would use on your computer (<code>git add</code>, <code>git commit</code>, <code>git merge</code>, <code>git push</code>…), with the same messages Git prints.</li><li><b>Live panels</b>: the three areas (working directory, staging area, repository), the files and the commit graph update after every command.</li><li><b>Goals you can see</b>: each mission lists its goals and ticks them as you reach them. Any correct path counts, not only the one in the hint.</li><li><b>Reset any time</b>: the Try again button rebuilds the starting repository.</li></ul>\n<h2>The engine</h2>\n<p>Git.Micro runs a small Git written for this page, in your browser. It stores blobs, trees, commits and tags in the same format as Git, so the hashes match: the same files, author, date and message give the same commit hash in Git.Micro and in Git. The engine was checked against Git 2.43 with 48 scripts covering commits, branches, merges and conflicts, stash, tags, reset, revert, cherry-pick, rebase and remotes, comparing every hash, the staging area, the files and the status.</p>\n<p>The remote server (<code>git.micro</code>) and teammate Ana are simulated on the page too, so nothing is sent anywhere and everything works offline. Commands that need an editor take their text with <code>-m</code>; interactive staging (<code>-p</code>), interactive rebase (<code>-i</code>) and <code>git bisect</code> are not available. File edits use <code>echo</code>, <code>printf</code> or the built-in editor (<code>edit file</code>).</p>\n<h2>The Lab</h2>\n<p>The Lab is a free sandbox with the same terminal and panels, four starting scenarios (empty folder, project with history, team with a remote, merge conflict) and a button that makes Ana push a commit, so you can practise pulls and rejected pushes.</p>\n<h2>Part of Microlearn</h2>\n<p>Git.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"{portal}\">www.microlearn.website</a>.</p>", "pt": "<h1>Sobre o Git.Micro</h1>\n<p>O Git.Micro é uma plataforma de microaprendizagem de Git, o sistema de controle de versões usado por quase todas as equipes de software. Cada lição leva de três a cinco minutos: uma ideia, uma missão resolvida com comandos Git de verdade e uma pergunta para conferir o que aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: primeiros commits, mudanças sob controle, branches, conflitos e ferramentas, remotos e trabalho em equipe, e reescrevendo a história. {progress}</p>\n<h2>Como funcionam as missões</h2>\n<ul><li><b>Um terminal de verdade</b>: você digita os mesmos comandos que usaria no seu computador (<code>git add</code>, <code>git commit</code>, <code>git merge</code>, <code>git push</code>…), com as mesmas mensagens que o Git mostra.</li><li><b>Painéis ao vivo</b>: as três áreas (diretório de trabalho, área de preparação, repositório), os arquivos e o grafo de commits se atualizam a cada comando.</li><li><b>Objetivos à vista</b>: cada missão lista os objetivos e marca cada um quando você chega lá. Qualquer caminho correto vale, não só o da dica.</li><li><b>Recomece quando quiser</b>: o botão Tentar de novo reconstrói o repositório inicial.</li></ul>\n<h2>O motor</h2>\n<p>O Git.Micro roda um pequeno Git escrito para esta página, no seu navegador. Ele guarda blobs, trees, commits e tags no mesmo formato do Git, então os hashes coincidem: os mesmos arquivos, autor, data e mensagem geram o mesmo hash de commit no Git.Micro e no Git. O motor foi conferido com o Git 2.43 em 48 roteiros que cobrem commits, branches, merges e conflitos, stash, tags, reset, revert, cherry-pick, rebase e remotos, comparando cada hash, a área de preparação, os arquivos e o status.</p>\n<p>O servidor remoto (<code>git.micro</code>) e a colega Ana também são simulados na página, então nada é enviado para lugar nenhum e tudo funciona offline. Comandos que precisam de editor recebem o texto com <code>-m</code>; a preparação interativa (<code>-p</code>), o rebase interativo (<code>-i</code>) e o <code>git bisect</code> não estão disponíveis. Para editar arquivos, use <code>echo</code>, <code>printf</code> ou o editor embutido (<code>edit arquivo</code>).</p>\n<h2>O Laboratório</h2>\n<p>O Laboratório é um ambiente livre com o mesmo terminal e os mesmos painéis, quatro cenários iniciais (pasta vazia, projeto com histórico, equipe com remoto, conflito de merge) e um botão que faz a Ana enviar um commit, para praticar pulls e pushes recusados.</p>\n<h2>Parte do Microlearn</h2>\n<p>O Git.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"{portal}\">www.microlearn.website</a>.</p>", "es": "<h1>Acerca de Git.Micro</h1>\n<p>Git.Micro es una plataforma de microaprendizaje de Git, el sistema de control de versiones que usan casi todos los equipos de software. Cada lección dura de tres a cinco minutos: una idea, una misión que resuelves con comandos Git de verdad y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: primeros commits, cambios bajo control, ramas, conflictos y herramientas, remotos y trabajo en equipo, y reescribir la historia. {progress}</p>\n<h2>Cómo funcionan las misiones</h2>\n<ul><li><b>Un terminal de verdad</b>: escribes los mismos comandos que usarías en tu ordenador (<code>git add</code>, <code>git commit</code>, <code>git merge</code>, <code>git push</code>…), con los mismos mensajes que muestra Git.</li><li><b>Paneles en vivo</b>: las tres áreas (directorio de trabajo, área de preparación, repositorio), los archivos y el grafo de commits se actualizan tras cada comando.</li><li><b>Objetivos a la vista</b>: cada misión enumera sus objetivos y marca cada uno al alcanzarlo. Vale cualquier camino correcto, no solo el de la pista.</li><li><b>Empieza de nuevo cuando quieras</b>: el botón Reintentar reconstruye el repositorio inicial.</li></ul>\n<h2>El motor</h2>\n<p>Git.Micro ejecuta un pequeño Git escrito para esta página, en tu navegador. Guarda blobs, trees, commits y etiquetas en el mismo formato que Git, así que los hashes coinciden: los mismos archivos, autor, fecha y mensaje dan el mismo hash de commit en Git.Micro y en Git. El motor se comprobó con Git 2.43 en 48 guiones que cubren commits, ramas, fusiones y conflictos, stash, etiquetas, reset, revert, cherry-pick, rebase y remotos, comparando cada hash, la área de preparación, los archivos y el estado.</p>\n<p>El servidor remoto (<code>git.micro</code>) y la compañera Ana también se simulan en la página, así que no se envía nada a ningún sitio y todo funciona sin conexión. Los comandos que necesitan editor reciben el texto con <code>-m</code>; la preparación interactiva (<code>-p</code>), el rebase interactivo (<code>-i</code>) y <code>git bisect</code> no están disponibles. Para editar archivos usa <code>echo</code>, <code>printf</code> o el editor integrado (<code>edit archivo</code>).</p>\n<h2>El Laboratorio</h2>\n<p>El Laboratorio es un entorno libre con el mismo terminal y los mismos paneles, cuatro escenarios iniciales (carpeta vacía, proyecto con historial, equipo con remoto, conflicto de fusión) y un botón que hace que Ana envíe un commit, para practicar pulls y pushes rechazados.</p>\n<h2>Parte de Microlearn</h2>\n<p>Git.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"{portal}\">www.microlearn.website</a>.</p>"},
