/* Layout: fixed app shell, top menu, one scrolling main. Lessons: Concept → Build (event sheet beside a live scene) → Quiz.
   Visual world: GDevelop's event sheet (conditions left, actions right) next to a small 2D platformer stage. */
:root {
  color-scheme: light;
  --bg: #f5f4f9; --surface: #ffffff; --surface-2: #efedf6; --ink: #1d1a2e; --muted: #605b77; --line: #dedbea;
  --accent: #6a3fe0; --accent-ink: #ffffff; --accent-soft: #ece6fd;
  --good: #16794a; --good-soft: #dcf3e6; --bad: #b83a2a; --bad-soft: #fbe6e1;
  --cond: #f7f5fd; --act: #ffffff;
  --k-scene: #6a3fe0; --k-key: #2f64cf; --k-coll: #cf3f35; --k-timer: #b07000; --k-var: #12806a; --k-flow: #8a4fe8;
  --k-text: #2a6a98; --k-move: #2459d6; --k-obj: #a14e27; --k-sound: #b0306f; --k-fx: #c06a00; --k-rand: #0f7f8c;
  --sky1: #b9dcff; --sky2: #eef6ff; --cloud: rgba(255,255,255,.88); --ground: #7a5638; --grass: #4ba64a;
  --player: #6a3fe0; --coin: #f4b400; --coin-edge: #a97300; --enemy: #e0435a; --hud: #1d1a2e;
  --f-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121019; --surface: #1b1826; --surface-2: #252136; --ink: #ecebf5; --muted: #a29eba; --line: #332e48;
  --accent: #a58bff; --accent-ink: #15112a; --accent-soft: #2a2350;
  --good: #5dd197; --good-soft: #142b20; --bad: #ff8e7b; --bad-soft: #341b16;
  --cond: #1f1c2d; --act: #1b1826;
  --k-scene: #a58bff; --k-key: #7aa6ff; --k-coll: #ff8a80; --k-timer: #f2b84b; --k-var: #4fd1b1; --k-flow: #c4a3ff;
  --k-text: #76b8e6; --k-move: #82a8ff; --k-obj: #e9a07a; --k-sound: #f08ac0; --k-fx: #ffb15a; --k-rand: #4fc8d6;
  --sky1: #1a2045; --sky2: #2e2b5c; --cloud: rgba(255,255,255,.08); --ground: #4a3424; --grass: #3d8c3b;
  --player: #a58bff; --coin: #ffc928; --coin-edge: #c08b00; --enemy: #ff6b80; --hud: #ecebf5;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121019; --surface: #1b1826; --surface-2: #252136; --ink: #ecebf5; --muted: #a29eba; --line: #332e48;
  --accent: #a58bff; --accent-ink: #15112a; --accent-soft: #2a2350;
  --good: #5dd197; --good-soft: #142b20; --bad: #ff8e7b; --bad-soft: #341b16;
  --cond: #1f1c2d; --act: #1b1826;
  --k-scene: #a58bff; --k-key: #7aa6ff; --k-coll: #ff8a80; --k-timer: #f2b84b; --k-var: #4fd1b1; --k-flow: #c4a3ff;
  --k-text: #76b8e6; --k-move: #82a8ff; --k-obj: #e9a07a; --k-sound: #f08ac0; --k-fx: #ffb15a; --k-rand: #4fc8d6;
  --sky1: #1a2045; --sky2: #2e2b5c; --cloud: rgba(255,255,255,.08); --ground: #4a3424; --grass: #3d8c3b;
  --player: #a58bff; --coin: #ffc928; --coin-edge: #c08b00; --enemy: #ff6b80; --hud: #ecebf5;
  color-scheme: dark }

html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13.5px; }
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.015em; margin: 0; }
.eyebrow { font: 600 11px/1.2 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

#app { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px 20px; flex-shrink: 0; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line);
  padding: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; border: 0; background: none; padding: 2px 0; color: var(--ink); text-align: left; }
.mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); position: relative; flex-shrink: 0; }
.mark::before, .mark::after { content: ""; position: absolute; top: 8px; bottom: 8px; border-radius: 2px; }
.mark::before { left: 7px; width: 6px; background: var(--accent-ink); opacity: .55; }
.mark::after { left: 15px; right: 7px; background: var(--accent-ink); }
.wordmark { display: flex; flex-direction: column; line-height: 1.05; }
.wordmark b { font: 800 20px/1 var(--f-display); letter-spacing: -0.02em; }
.wordmark b span { color: var(--accent); }
.wordmark small { font-size: 12px; color: var(--muted); margin-top: 3px; }
#topnav { display: flex; gap: 2px; min-width: 0; }
.nav-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 8px; border: 0; background: transparent; color: var(--muted); font-size: 15px; font-weight: 700; white-space: nowrap; }
.nav-btn .ic { width: 18px; height: 18px; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { background: var(--accent-soft); color: var(--accent); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
#prog { display: flex; align-items: center; gap: 8px; margin-right: 6px; }
.pbar { width: 90px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; display: block; }
.pbar i { display: block; height: 100%; background: var(--good); }
.pnum { font: 600 13px var(--f-mono); color: var(--muted); }
.lang { display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; height: 38px; border-radius: 8px; color: var(--muted); cursor: pointer; }
.lang:hover { background: var(--surface-2); color: var(--ink); }
.lang select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: 700 13px var(--f-mono); color: inherit; cursor: pointer; padding: 0 2px; }
.lang select option { background: var(--surface); color: var(--ink); }

lessons: {
l1:{ title:"Your first event",
  concept:["GDevelop games are not written as code. You describe what happens with **events**, listed one under another on the **event sheet**.",
    "Every event has two sides. On the left are the **conditions**: what must be true. On the right are the **actions**: what to do when all the conditions are true. GDevelop reads the whole sheet from top to bottom about 60 times per second.",
    "One of the most useful conditions is *At the beginning of the scene*. It is true only on the very first frame, so it is where you set things up."],
  example:"In the real editor, each event shows its conditions in the left column and its actions in the right column. You add them with “Add condition” and “Add action”, just like here.",
  task:"Make the text object **Msg** say hello when the scene starts.",
  hint:"Add a new event. Condition: *At the beginning of the scene*. Action: *Change the text of Msg*. Then press Preview.",
  quiz:[{q:"When does an action run?", o:["When all the conditions of its event are true","Once, when the game is installed","Whenever the player clicks on it"], why:"An event checks its conditions. Only when every one of them is true do its actions run."},
    {q:"How often does GDevelop read the event sheet while the game runs?", o:["Every frame, about 60 times per second","Only when a key is pressed","Once per scene"], why:"The sheet is evaluated on every frame. That is why a key press is noticed the moment it happens."}]},
l2:{ title:"Move with the keyboard",
  concept:["A condition can watch the keyboard. *The Right key is pressed* stays true on every frame while the key is held down.",
    "Pair it with an action that changes the **X position** of the Player. Since the sheet runs every frame, adding 4 pixels per frame turns into smooth movement: about 240 pixels per second.",
    "Each direction needs its own event. Two small events are the simplest movement system you can build."],
  example:"In GDevelop, X grows to the right and Y grows downward. The point (0, 0) is the top-left corner of the scene.",
  task:"Make **Player** move right with the Right key and left with the Left key.",
  hint:"Two events. *The Right key is pressed* → *X of Player: add 4*. *The Left key is pressed* → *X of Player: subtract 4*. Press Preview, click the scene and use the arrows.",
  quiz:[{q:"Why does adding 4 to X on each frame look like smooth motion?", o:["The event runs about 60 times per second while the key is held","GDevelop animates every change on its own","A key press lasts exactly one frame"], why:"Sixty small steps per second blend into continuous movement, roughly 240 px/s."},
    {q:"In GDevelop, which way does the Y axis grow?", o:["Downward","Upward","It depends on the scene"], why:"Screen coordinates start at the top-left corner, so a larger Y is lower on the screen."}]},
l3:{ title:"Behaviors do the heavy lifting",
  concept:["Moving by hand shows the idea, but real games need gravity, jumps, acceleration and slopes. GDevelop packs this kind of logic into **behaviors** that you attach to objects.",
    "Attach **Platformer character** to the Player and it runs with the arrows and jumps with Space. It still needs something to stand on: attach the **Platform** behavior to the Ground.",
    "Behaviors and events work together. Behaviors handle the standard parts; events add the rules that make the game yours."],
  example:"In GDevelop, behaviors are added in the object editor, on the Behaviors tab. Other common ones are Top-down movement, Physics, Draggable and Tween.",
  task:"Give **Player** the Platformer character behavior and **Ground** the Platform behavior. Then preview: run with the arrows, jump with Space.",
  hint:"Use the Behaviors panel. Try setting only the Player first and press Preview: it falls straight through the floor. Then fix the Ground.",
  quiz:[{q:"Your platformer character falls through the floor. What is the most likely cause?", o:["The floor has no Platform behavior","The scene has too many events","The character is missing a variable"], why:"A platformer character only lands on objects that have the Platform behavior."},
    {q:"What is a behavior?", o:["Ready-made logic attached to an object","A list of sounds","A kind of variable"], why:"Behaviors add prebuilt functions, such as gravity and jumping, to the objects they are attached to."}]},
l4:{ title:"Collect the coins",
  concept:["A **collision** condition is true when two objects overlap. *Player is in collision with Coin* is how almost every pickup in a 2D game begins.",
    "There are five coins, and each one is an **instance** of the Coin object. The collision condition **picks** only the instances touching the Player, so *Delete Coin* removes that coin and leaves the others alone.",
    "A **variable** stores a value that changes during play. Add 1 to the scene variable **Score** each time a coin is picked up."],
  example:"Object picking is the quiet superpower of GDevelop events: the actions of an event apply only to the instances its conditions selected.",
  task:"When **Player** touches a **Coin**, delete that coin and add 1 to **Score**. Watch Score in the debugger.",
  hint:"One event. Condition: *Player is in collision with Coin*. Actions: *Delete Coin* and *Score: add 1*.",
  quiz:[{q:"Five coins are on screen and the player touches one. Which coins does *Delete Coin* remove?", o:["Only the one picked by the collision condition","All five","None, deleting needs a timer"], why:"Conditions pick instances; the actions act only on the picked ones."},
    {q:"Where should the number of collected coins be stored?", o:["In a variable","In the color of the coin","In the name of the scene"], why:"Variables hold values that change while the game runs, like a score, lives or a level number."}]},
l5:{ title:"Show the score",
  concept:["The Score changes, but the player cannot see it. The text object **ScoreText** still shows the text it was created with.",
    "An event with **no conditions** runs on every frame. That makes it the right place for actions that keep the screen in step with your variables, such as updating a score label.",
    "Putting the same action under *At the beginning of the scene* would run it only once and show 0 forever. Try it and compare."],
  example:"In GDevelop you build that text with an expression: \"Score: \" + ToString(Score). The action here does the same.",
  task:"Keep **ScoreText** updated so the player always sees the current Score.",
  hint:"Add a new event, leave its condition side empty, and give it the action *Change the text of ScoreText*.",
  quiz:[{q:"An event with no conditions runs…", o:["On every frame","Never","Only at the beginning of the scene"], why:"With nothing to check, the event's actions run on every frame."},
    {q:"You update ScoreText only at the beginning of the scene. What does the player see?", o:["Score: 0, forever","The right score","An error message"], why:"The text is set once, before any coin is collected, and never changes again."}]},
l6:{ title:"Trigger once",
  concept:["Some moments should happen once, like a fanfare when the player reaches 5 coins. But *Score ≥ 5* stays true on every frame after that, so its actions repeat about 60 times per second.",
    "Add the condition **Trigger once while true**. The event then runs only on the frame its conditions become true, and waits until they turn false before it can run again.",
    "Preview without it first and watch *Sounds played* climb in the debugger. Then fix it."],
  example:"In GDevelop, Trigger once is one of the general conditions. It is the standard fix for sounds, effects and messages that fire too many times.",
  task:"When **Score** reaches 5, play the fanfare exactly once.",
  hint:"One event with two conditions: *Score ≥ 5* and *Trigger once while true*. Action: *Play the sound fanfare.wav*.",
  quiz:[{q:"Without Trigger once, what happens after Score reaches 5?", o:["The sound plays on every frame","The sound plays once","The game stops"], why:"The condition stays true, so the action repeats on each frame."},
    {q:"When can an event with Trigger once run again?", o:["After its conditions turn false and then true again","Never","After exactly one second"], why:"Trigger once resets when its conditions stop being true."}]},
l7:{ title:"Timers and spawning",
  concept:["A level with nothing left to do is finished. To keep the player busy, new coins should keep **spawning**.",
    "A **scene timer** counts seconds. The condition *timer “spawn” > 2 seconds* becomes true two seconds after the timer starts. Create a coin, then reset the timer so the count starts again.",
    "Forgetting the reset is a classic bug: the condition stays true and a coin appears on every frame."],
  example:"In GDevelop, the action *Start (or reset) a scene timer* starts the count. Objects can also have their own timers.",
  task:"Every 2 seconds, create a new **Coin** at a random position.",
  hint:"One event. Condition: *timer “spawn” > 2 seconds*. Actions: *Create Coin* and *Start (or reset) the timer “spawn”*.",
  quiz:[{q:"You create a coin when the timer passes 2 s but never reset the timer. What happens?", o:["A coin spawns on every frame","One coin spawns every 2 s","Nothing spawns"], why:"After 2 s the condition stays true, so the action repeats on every frame."},
    {q:"What is a spawner in game design?", o:["A rule that creates new objects during play","The first scene of a game","A kind of sprite"], why:"Spawners keep the world stocked with things to collect, avoid or fight."}]},
l8:{ title:"Enemies and lives",
  concept:["Rewards need risk. An enemy patrolling the ground gives the player a reason to jump and a way to lose.",
    "When the Player touches an Enemy, subtract 1 from **Lives** and delete that enemy, so one touch costs exactly one life. Deleting the picked enemy works just like deleting a picked coin.",
    "A second event watches the result: when **Lives** reaches 0, show *Game over*. Keeping “what happens” apart from “what it means” keeps each event simple."],
  example:"Real projects usually give the player a few seconds of invincibility after a hit instead of deleting the enemy. Same idea, more polish.",
  task:"Touching an **Enemy** costs one life and removes that enemy. At 0 lives, show Game over.",
  hint:"Event 1: *Player in collision with Enemy* → *Lives: subtract 1* and *Delete Enemy*. Event 2: *Lives ≤ 0* → *Show “Game over”*.",
  quiz:[{q:"Why delete the enemy after a hit in this lesson?", o:["Otherwise the collision stays true and drains a life every frame","Enemies cannot be reused","Deleting it gives the player points"], why:"A collision that continues is true on every frame. Removing the enemy makes one touch cost one life."},
    {q:"Why use a separate event for Lives ≤ 0?", o:["It reacts to the result, whatever caused the loss","GDevelop allows one action per event","It runs faster"], why:"One event changes the value; another reacts to it. Later, traps or falls can cost lives without new game-over logic."}]},
l9:{ title:"The core loop",
  concept:["Every game has a **core loop**: the short cycle of actions the player repeats most. Here it is: move, collect, see the score rise, look for the next coin.",
    "A loop holds together with three parts: an **action** the player takes, a **reward** they can see, and a **renewal** that brings the next chance. Take one away and the game stops after a few seconds.",
    "This time the sheet starts empty. Rebuild the whole loop from what you have learned."],
  example:"Designers often draw the core loop as a cycle before building anything. If the loop is not fun in its simplest form, more content will not save it.",
  task:"Build the full loop: touching a Coin deletes it and adds to Score, ScoreText always shows Score, and a new Coin appears every 2 seconds.",
  hint:"Three events: the collision pickup, an event without conditions for the text, and the timer spawner with its reset.",
  quiz:[{q:"Which of these belongs to this game's core loop?", o:["Collecting a coin and seeing the score rise","The title screen","Choosing a language"], why:"The core loop is what the player does again and again, moment to moment."},
    {q:"You remove the spawner. What happens to the loop?", o:["It ends when the coins run out","It gets more fun","Nothing changes"], why:"Without renewal there is nothing left to do, and the loop breaks."}]},
l10:{ title:"The difficulty curve",
  concept:["A game that never changes gets boring; one that gets hard too fast gets frustrating. The zone in between is often called **flow**, a term from the psychologist Mihaly Csikszentmihalyi.",
    "A **difficulty curve** raises the challenge as the player improves. Here the Enemy already chases the Player. When Score reaches 5, make it faster.",
    "Raise difficulty in steps tied to the player's progress, not only to time. The player then feels the game answering what they did."],
  example:"In GDevelop you keep the speed in a variable and use that variable in the movement action, so a single change affects every enemy.",
  task:"When **Score** reaches 5, multiply **EnemySpeed** by 1.6, once.",
  hint:"Same shape as the fanfare: *Score ≥ 5* + *Trigger once while true* → *EnemySpeed: multiply by 1.6*. Without Trigger once the enemy becomes unstoppable.",
  quiz:[{q:"What is flow, in game design?", o:["A state where the challenge matches the player's skill","The order of the scenes","How fast the game runs"], why:"Too easy bores, too hard frustrates. Flow sits in between."},
    {q:"Why tie the speed-up to Score instead of a clock?", o:["The challenge grows with the player's progress","Timers are not available","Score is faster to compute"], why:"Steps tied to progress keep the difficulty in line with what the player has achieved."}]},
l11:{ title:"Game feel",
  concept:["Picking up a coin works, but it feels flat. **Game feel**, often called *juice*, is the layer of feedback that makes actions satisfying: a sound, particles, a small camera shake.",
    "Juice does not change the rules. It tells the player, clearly and right away, that something happened.",
    "Order matters inside an event: actions run from top to bottom. Create the particles at the Coin **before** deleting it. After the delete there is no coin left to place them on."],
  example:"In GDevelop, particle emitters and the Camera shake extension do this job. The 2012 talk “Juice it or lose it” by Martin Jonasson and Petri Purho is the classic demonstration.",
  task:"Add juice to the pickup: particles at the coin and a camera shake, with the particles created before the coin is deleted.",
  hint:"Edit the collision event. Add *Create particles at Coin* and *Shake the camera*, then use the up arrow on the particles action until it sits above *Delete Coin*.",
  quiz:[{q:"What does juice change in a game?", o:["How the actions feel, not the rules","The win condition","The number of levels"], why:"Juice is feedback. The mechanics stay the same; the experience gets sharper."},
    {q:"You put *Delete Coin* above *Create particles at Coin*. What happens?", o:["No particles appear","The particles appear twice","The game crashes"], why:"Actions run in order. After the delete, no picked coin is left to place the particles on."}]},
l12:{ title:"Winning and losing",
  concept:["A game needs a clear way to end. A **win state** and a **lose state** give each action a purpose: every coin brings the player closer to winning, every hit closer to losing.",
    "The goal should be visible. The player can see the Score, so a target of 10 coins is easy to understand.",
    "Both endings pause the scene so the result stays on screen. Then playtest: is 10 the right target? Are 3 lives enough? Tuning these values is called **balancing**."],
  example:"In GDevelop the ending usually switches scene with the action *Change the scene*, going to a Victory or Game Over scene with its own events.",
  task:"Win at 10 coins, once. Lose at 0 lives.",
  hint:"Event 1: *Score ≥ 10* + *Trigger once while true* → *Show “You win!”*. Event 2: *Lives ≤ 0* → *Show “Game over”*.",
  quiz:[{q:"Why should the win goal be visible to the player?", o:["So they understand what they are working toward","To save memory","GDevelop requires it"], why:"A goal the player can see turns each action into progress."},
    {q:"After playtesting, you change the target from 10 coins to 30. What are you doing?", o:["Balancing","Debugging","Spawning"], why:"Adjusting values so the game feels right is balancing."}]}
},
gloss: [
  ["Event","A rule on the event sheet: a list of conditions and a list of actions. When all the conditions are true, the actions run."],
  ["Event sheet","The list of events of a scene. GDevelop reads it from top to bottom on every frame."],
  ["Condition","The left side of an event. Something that is true or false, such as a key press or a collision."],
  ["Action","The right side of an event. Something that changes the game, such as moving, creating or deleting an object."],
  ["Object","A kind of thing in your game, such as Player, Coin or Enemy. It defines how its instances look and behave."],
  ["Instance","One copy of an object in a scene. Five coins are five instances of the Coin object."],
  ["Object picking","Conditions select the instances that meet them; the actions of that event apply only to those instances."],
  ["Behavior","Prebuilt logic attached to an object, such as Platformer character, Platform or Top-down movement."],
  ["Scene","A level or screen of the game, with its own objects and its own event sheet."],
  ["Variable","A named value that can change during play, such as Score or Lives. It can belong to a scene, to the whole game or to an object."],
  ["Text object","An object that shows text on screen. Actions can change its text."],
  ["Collision","Two objects overlapping. GDevelop checks it with each object's hitbox."],
  ["Timer","A stopwatch that counts seconds since it was started or reset. Used for spawning, cooldowns and delays."],
  ["Trigger once","A condition that lets an event run only on the frame its other conditions become true."],
  ["Frame","One update of the game. GDevelop runs about 60 frames per second and reads the event sheet each time."],
  ["Expression","A formula that produces a value, such as \"Score: \" + ToString(Score)."],
  ["Preview","Running the game straight from the editor to test it."],
  ["Debugger","A tool that shows variables and instances live while the game runs."],
  ["Extension","A package that adds objects, behaviors, conditions or actions to GDevelop."],
  ["Spawner","A rule that creates new objects during play."],
  ["Core loop","The short cycle the player repeats most: act, get a reward, find the next chance."],
  ["Flow","A state where the challenge matches the player's skill. Too easy bores, too hard frustrates."],
  ["Difficulty curve","How the challenge rises over the course of a game."],
  ["Game feel (juice)","Feedback such as sounds, particles and camera shake that makes actions satisfying."],
  ["Win and lose states","The clear endings of a game. They give the player's actions a purpose."],
  ["Balancing","Tuning values such as speed, lives and targets until the game feels fair and interesting."],
  ["Playtest","Watching people play your game to find what confuses, bores or delights them."]
],
about: { title:"About GDev.Micro",
  body:["GDev.Micro is a micro-learning platform for game design with GDevelop. Each lesson is a short loop of its own: read one idea, build it on a live event sheet, preview it, answer two questions.",
    "The event sheet follows the model of **GDevelop**, the free and open-source game engine where games are made with events instead of code: conditions on the left, actions on the right, read from top to bottom on every frame. The lessons cover the engine's core ideas (events, behaviors, variables, object picking, timers) and the design ideas behind good games (core loop, difficulty, game feel, endings) and procedural generation (randomness, seeds, constraints, weighted tables).",
    "Everything runs in your browser on a small simulation of the event system. The same ideas work directly in the real GDevelop editor. Progress is stored only on this device.",
    "GDev.Micro belongs to the .Micro family of learning platforms, alongside AI2.Micro, DS.Micro, Stats.Micro and the other Microlearn platforms. It is an independent educational project and is not affiliated with the GDevelop team."],
  credits:"Credits",
  creditList:["GDevelop: open-source game engine by Florian Rival and contributors (MIT licence)","“Juice it or lose it”: talk by Martin Jonasson and Petri Purho (2012)","Flow: Mihaly Csikszentmihalyi, Flow: The Psychology of Optimal Experience (1990)"],
  links:"GDevelop links" }
};

lessons: {
l1:{ title:"Seu primeiro evento",
  concept:["Jogos no GDevelop não são escritos em código. Você descreve o que acontece com **eventos**, listados um abaixo do outro na **folha de eventos**.",
    "Todo evento tem dois lados. À esquerda ficam as **condições**: o que precisa ser verdade. À direita ficam as **ações**: o que fazer quando todas as condições forem verdadeiras. O GDevelop lê a folha inteira de cima para baixo cerca de 60 vezes por segundo.",
    "Uma das condições mais úteis é *No início da cena*. Ela só é verdadeira no primeiro quadro, por isso é o lugar de preparar as coisas."],
  example:"No editor de verdade, cada evento mostra as condições na coluna da esquerda e as ações na da direita. Você as adiciona com “Adicionar condição” e “Adicionar ação”, como aqui.",
  task:"Faça o objeto de texto **Msg** dizer olá quando a cena começar.",
  hint:"Adicione um novo evento. Condição: *No início da cena*. Ação: *Mudar o texto de Msg*. Depois aperte Pré-visualizar.",
  quiz:[{q:"Quando uma ação é executada?", o:["Quando todas as condições do seu evento são verdadeiras","Uma vez, quando o jogo é instalado","Sempre que o jogador clica nela"], why:"O evento verifica suas condições. Só quando todas são verdadeiras as ações rodam."},
    {q:"Com que frequência o GDevelop lê a folha de eventos durante o jogo?", o:["A cada quadro, cerca de 60 vezes por segundo","Só quando uma tecla é pressionada","Uma vez por cena"], why:"A folha é avaliada a cada quadro. Por isso um toque de tecla é percebido na hora."}]},
l2:{ title:"Mover com o teclado",
  concept:["Uma condição pode observar o teclado. *A tecla Direita está pressionada* fica verdadeira em todos os quadros enquanto a tecla está apertada.",
    "Junte-a a uma ação que muda a **posição X** do Player. Como a folha roda a cada quadro, somar 4 pixels por quadro vira um movimento suave: cerca de 240 pixels por segundo.",
    "Cada direção precisa do seu próprio evento. Dois eventos pequenos são o sistema de movimento mais simples que dá para montar."],
  example:"No GDevelop, o X cresce para a direita e o Y cresce para baixo. O ponto (0, 0) é o canto superior esquerdo da cena.",
  task:"Faça **Player** ir para a direita com a tecla Direita e para a esquerda com a tecla Esquerda.",
  hint:"Dois eventos. *Tecla Direita pressionada* → *X de Player: somar 4*. *Tecla Esquerda pressionada* → *X de Player: subtrair 4*. Aperte Pré-visualizar, clique na cena e use as setas.",
  quiz:[{q:"Por que somar 4 ao X a cada quadro parece um movimento suave?", o:["O evento roda cerca de 60 vezes por segundo enquanto a tecla está apertada","O GDevelop anima toda mudança sozinho","Um toque de tecla dura exatamente um quadro"], why:"Sessenta passos pequenos por segundo se fundem num movimento contínuo, cerca de 240 px/s."},
    {q:"No GDevelop, para que lado cresce o eixo Y?", o:["Para baixo","Para cima","Depende da cena"], why:"As coordenadas começam no canto superior esquerdo, então um Y maior fica mais embaixo na tela."}]},
l3:{ title:"Comportamentos fazem o trabalho pesado",
  concept:["Mover na mão mostra a ideia, mas jogos de verdade precisam de gravidade, pulo, aceleração e rampas. O GDevelop empacota esse tipo de lógica em **comportamentos** que você liga aos objetos.",
    "Ligue **Personagem de plataforma** ao Player e ele corre com as setas e pula com Espaço. Mas precisa de algo onde pisar: ligue o comportamento **Plataforma** ao Ground.",
    "Comportamentos e eventos trabalham juntos. Os comportamentos cuidam da parte padrão; os eventos trazem as regras que fazem o jogo ser seu."],
  example:"No GDevelop, os comportamentos são adicionados no editor do objeto, na aba Comportamentos. Outros comuns são Movimento top-down, Física, Arrastável e Tween.",
  task:"Dê a **Player** o comportamento Personagem de plataforma e a **Ground** o comportamento Plataforma. Depois pré-visualize: corra com as setas, pule com Espaço.",
  hint:"Use o painel Comportamentos. Experimente configurar só o Player e aperte Pré-visualizar: ele atravessa o chão. Depois corrija o Ground.",
  quiz:[{q:"Seu personagem de plataforma atravessa o chão. Qual a causa mais provável?", o:["O chão não tem o comportamento Plataforma","A cena tem eventos demais","Falta uma variável no personagem"], why:"Um personagem de plataforma só pisa em objetos com o comportamento Plataforma."},
    {q:"O que é um comportamento?", o:["Lógica pronta ligada a um objeto","Uma lista de sons","Um tipo de variável"], why:"Comportamentos acrescentam funções prontas, como gravidade e pulo, aos objetos em que estão ligados."}]},
l4:{ title:"Colete as moedas",
  concept:["Uma condição de **colisão** é verdadeira quando dois objetos se sobrepõem. *Player está em colisão com Coin* é como começa quase toda coleta num jogo 2D.",
    "Há cinco moedas, e cada uma é uma **instância** do objeto Coin. A condição de colisão **seleciona** só as instâncias que tocam o Player, então *Excluir Coin* remove aquela moeda e deixa as outras em paz.",
    "Uma **variável** guarda um valor que muda durante o jogo. Some 1 à variável de cena **Score** cada vez que uma moeda é coletada."],
  example:"A seleção de objetos é o superpoder discreto dos eventos do GDevelop: as ações de um evento valem só para as instâncias que as condições selecionaram.",
  task:"Quando **Player** tocar uma **Coin**, exclua essa moeda e some 1 a **Score**. Acompanhe o Score no depurador.",
  hint:"Um evento. Condição: *Player está em colisão com Coin*. Ações: *Excluir Coin* e *Score: somar 1*.",
  quiz:[{q:"Há cinco moedas na tela e o jogador toca uma. Quais moedas *Excluir Coin* remove?", o:["Só a selecionada pela condição de colisão","As cinco","Nenhuma, excluir exige um temporizador"], why:"As condições selecionam instâncias; as ações agem só sobre as selecionadas."},
    {q:"Onde guardar o número de moedas coletadas?", o:["Numa variável","Na cor da moeda","No nome da cena"], why:"Variáveis guardam valores que mudam durante o jogo, como pontuação, vidas ou número da fase."}]},
l5:{ title:"Mostre a pontuação",
  concept:["O Score muda, mas o jogador não vê. O objeto de texto **ScoreText** continua mostrando o texto com que foi criado.",
    "Um evento **sem condições** roda a cada quadro. Por isso é o lugar certo para ações que mantêm a tela em dia com as variáveis, como atualizar um placar.",
    "Colocar a mesma ação em *No início da cena* faria ela rodar uma vez só e mostrar 0 para sempre. Experimente e compare."],
  example:"No GDevelop você monta esse texto com uma expressão: \"Score: \" + ToString(Score). A ação aqui faz o mesmo.",
  task:"Mantenha **ScoreText** atualizado para o jogador sempre ver o Score atual.",
  hint:"Adicione um novo evento, deixe o lado das condições vazio e dê a ele a ação *Mudar o texto de ScoreText*.",
  quiz:[{q:"Um evento sem condições roda…", o:["A cada quadro","Nunca","Só no início da cena"], why:"Sem nada a verificar, as ações do evento rodam a cada quadro."},
    {q:"Você atualiza ScoreText só no início da cena. O que o jogador vê?", o:["Score: 0, para sempre","A pontuação certa","Uma mensagem de erro"], why:"O texto é definido uma vez, antes de qualquer moeda, e nunca mais muda."}]},
l6:{ title:"Disparar uma vez",
  concept:["Alguns momentos devem acontecer uma vez só, como uma fanfarra quando o jogador chega a 5 moedas. Mas *Score ≥ 5* continua verdadeira em todo quadro depois disso, então as ações se repetem cerca de 60 vezes por segundo.",
    "Acrescente a condição **Disparar uma vez enquanto verdadeiro**. O evento passa a rodar só no quadro em que as condições ficam verdadeiras, e espera elas ficarem falsas antes de poder rodar de novo.",
    "Pré-visualize primeiro sem ela e veja *Sons tocados* disparar no depurador. Depois corrija."],
  example:"No GDevelop, Disparar uma vez está entre as condições gerais. É a correção padrão para sons, efeitos e mensagens que disparam vezes demais.",
  task:"Quando **Score** chegar a 5, toque a fanfarra exatamente uma vez.",
  hint:"Um evento com duas condições: *Score ≥ 5* e *Disparar uma vez enquanto verdadeiro*. Ação: *Tocar o som fanfare.wav*.",
  quiz:[{q:"Sem Disparar uma vez, o que acontece depois que Score chega a 5?", o:["O som toca a cada quadro","O som toca uma vez","O jogo para"], why:"A condição continua verdadeira, então a ação se repete a cada quadro."},
    {q:"Quando um evento com Disparar uma vez pode rodar de novo?", o:["Depois que as condições ficam falsas e voltam a ser verdadeiras","Nunca","Depois de exatamente um segundo"], why:"Disparar uma vez se rearma quando as condições deixam de ser verdadeiras."}]},
l7:{ title:"Temporizadores e geração",
  concept:["Uma fase sem nada para fazer acabou. Para manter o jogador ocupado, novas moedas precisam continuar **surgindo**.",
    "Um **temporizador de cena** conta segundos. A condição *temporizador “spawn” > 2 segundos* fica verdadeira dois segundos depois que ele começa. Crie uma moeda e reinicie o temporizador para a contagem recomeçar.",
    "Esquecer de reiniciar é um bug clássico: a condição continua verdadeira e uma moeda aparece a cada quadro."],
  example:"No GDevelop, a ação *Iniciar (ou reiniciar) um temporizador de cena* começa a contagem. Objetos também podem ter seus próprios temporizadores.",
  task:"A cada 2 segundos, crie uma nova **Coin** numa posição aleatória.",
  hint:"Um evento. Condição: *temporizador “spawn” > 2 segundos*. Ações: *Criar Coin* e *Iniciar (ou reiniciar) o temporizador “spawn”*.",
  quiz:[{q:"Você cria uma moeda quando o temporizador passa de 2 s, mas nunca o reinicia. O que acontece?", o:["Surge uma moeda a cada quadro","Surge uma moeda a cada 2 s","Não surge nada"], why:"Depois de 2 s a condição fica verdadeira, então a ação se repete a cada quadro."},
    {q:"O que é um gerador (spawner) em game design?", o:["Uma regra que cria objetos novos durante o jogo","A primeira cena de um jogo","Um tipo de sprite"], why:"Geradores mantêm o mundo abastecido de coisas para coletar, evitar ou enfrentar."}]},
l8:{ title:"Inimigos e vidas",
  concept:["Recompensa pede risco. Um inimigo patrulhando o chão dá ao jogador um motivo para pular e uma forma de perder.",
    "Quando o Player tocar um Enemy, subtraia 1 de **Lives** e exclua esse inimigo, para que um toque custe exatamente uma vida. Excluir o inimigo selecionado funciona igual a excluir a moeda selecionada.",
    "Um segundo evento observa o resultado: quando **Lives** chegar a 0, mostre *Game over*. Separar “o que acontece” de “o que isso significa” deixa cada evento simples."],
  example:"Projetos reais costumam dar ao jogador alguns segundos de invencibilidade após o golpe, em vez de excluir o inimigo. Mesma ideia, mais acabamento.",
  task:"Tocar um **Enemy** custa uma vida e remove esse inimigo. Com 0 vidas, mostre Game over.",
  hint:"Evento 1: *Player em colisão com Enemy* → *Lives: subtrair 1* e *Excluir Enemy*. Evento 2: *Lives ≤ 0* → *Mostrar “Game over”*.",
  quiz:[{q:"Por que excluir o inimigo depois do golpe nesta lição?", o:["Senão a colisão continua verdadeira e tira uma vida a cada quadro","Inimigos não podem ser reaproveitados","Excluir dá pontos ao jogador"], why:"Uma colisão que continua é verdadeira em todo quadro. Remover o inimigo faz um toque custar uma vida."},
    {q:"Por que usar um evento separado para Lives ≤ 0?", o:["Ele reage ao resultado, seja qual for a causa da perda","O GDevelop aceita uma ação por evento","Ele roda mais rápido"], why:"Um evento muda o valor; outro reage a ele. Depois, armadilhas ou quedas podem tirar vidas sem nova lógica de game over."}]},
l9:{ title:"O loop central",
  concept:["Todo jogo tem um **loop central**: o ciclo curto de ações que o jogador mais repete. Aqui ele é: mover, coletar, ver a pontuação subir, procurar a próxima moeda.",
    "Um loop se sustenta com três partes: uma **ação** do jogador, uma **recompensa** visível e uma **renovação** que traz a próxima chance. Tire uma delas e o jogo acaba em poucos segundos.",
    "Desta vez a folha começa vazia. Reconstrua o loop inteiro com o que você aprendeu."],
  example:"Designers costumam desenhar o loop central como um ciclo antes de construir qualquer coisa. Se o loop não é divertido na forma mais simples, mais conteúdo não vai salvá-lo.",
  task:"Monte o loop completo: tocar uma Coin a exclui e soma ao Score, ScoreText sempre mostra o Score, e uma nova Coin aparece a cada 2 segundos.",
  hint:"Três eventos: a coleta por colisão, um evento sem condições para o texto e o gerador por temporizador com o reinício.",
  quiz:[{q:"Qual destes faz parte do loop central deste jogo?", o:["Coletar uma moeda e ver a pontuação subir","A tela de título","Escolher o idioma"], why:"O loop central é o que o jogador faz de novo e de novo, momento a momento."},
    {q:"Você remove o gerador. O que acontece com o loop?", o:["Ele acaba quando as moedas terminam","Fica mais divertido","Nada muda"], why:"Sem renovação não sobra nada para fazer, e o loop se rompe."}]},
l10:{ title:"A curva de dificuldade",
  concept:["Um jogo que nunca muda fica chato; um que fica difícil rápido demais frustra. A zona entre os dois costuma ser chamada de **flow** (fluxo), termo do psicólogo Mihaly Csikszentmihalyi.",
    "Uma **curva de dificuldade** aumenta o desafio conforme o jogador melhora. Aqui o Enemy já persegue o Player. Quando Score chegar a 5, deixe-o mais rápido.",
    "Aumente a dificuldade em degraus ligados ao progresso do jogador, não só ao tempo. Assim o jogador sente o jogo respondendo ao que ele fez."],
  example:"No GDevelop você guarda a velocidade numa variável e usa essa variável na ação de movimento, então uma única mudança afeta todos os inimigos.",
  task:"Quando **Score** chegar a 5, multiplique **EnemySpeed** por 1,6, uma vez.",
  hint:"Mesmo formato da fanfarra: *Score ≥ 5* + *Disparar uma vez enquanto verdadeiro* → *EnemySpeed: multiplicar por 1,6*. Sem Disparar uma vez, o inimigo fica imparável.",
  quiz:[{q:"O que é flow, em game design?", o:["Um estado em que o desafio combina com a habilidade do jogador","A ordem das cenas","A velocidade do jogo"], why:"Fácil demais entedia, difícil demais frustra. O flow fica no meio."},
    {q:"Por que ligar o aumento de velocidade ao Score e não a um relógio?", o:["O desafio cresce com o progresso do jogador","Não existem temporizadores","Score é mais rápido de calcular"], why:"Degraus ligados ao progresso mantêm a dificuldade alinhada ao que o jogador conquistou."}]},
l11:{ title:"Game feel",
  concept:["Coletar uma moeda funciona, mas parece sem graça. O **game feel**, muitas vezes chamado de *juice*, é a camada de retorno que torna as ações satisfatórias: um som, partículas, um leve tremor de câmera.",
    "O juice não muda as regras. Ele avisa o jogador, com clareza e na hora, que algo aconteceu.",
    "A ordem importa dentro de um evento: as ações rodam de cima para baixo. Crie as partículas na Coin **antes** de excluí-la. Depois da exclusão não sobra moeda onde colocá-las."],
  example:"No GDevelop, emissores de partículas e a extensão de tremor de câmera fazem esse trabalho. A palestra “Juice it or lose it”, de Martin Jonasson e Petri Purho (2012), é a demonstração clássica.",
  task:"Dê juice à coleta: partículas na moeda e um tremor de câmera, com as partículas criadas antes de a moeda ser excluída.",
  hint:"Edite o evento de colisão. Adicione *Criar partículas em Coin* e *Tremer a câmera*, depois use a seta para cima na ação de partículas até ela ficar acima de *Excluir Coin*.",
  quiz:[{q:"O que o juice muda num jogo?", o:["Como as ações são sentidas, não as regras","A condição de vitória","O número de fases"], why:"Juice é retorno. A mecânica continua a mesma; a experiência fica mais nítida."},
    {q:"Você coloca *Excluir Coin* acima de *Criar partículas em Coin*. O que acontece?", o:["Nenhuma partícula aparece","As partículas aparecem duas vezes","O jogo trava"], why:"As ações rodam em ordem. Depois da exclusão não sobra moeda selecionada onde pôr as partículas."}]},
l12:{ title:"Vencer e perder",
  concept:["Um jogo precisa de um jeito claro de acabar. Um **estado de vitória** e um **estado de derrota** dão propósito a cada ação: cada moeda aproxima da vitória, cada golpe aproxima da derrota.",
    "A meta deve ser visível. O jogador vê o Score, então uma meta de 10 moedas é fácil de entender.",
    "Os dois finais pausam a cena para o resultado ficar na tela. Depois, faça um playtest: 10 é a meta certa? 3 vidas bastam? Ajustar esses valores se chama **balanceamento**."],
  example:"No GDevelop o final costuma trocar de cena com a ação *Mudar a cena*, indo para uma cena de Vitória ou de Game Over com seus próprios eventos.",
  task:"Vença com 10 moedas, uma vez. Perca com 0 vidas.",
  hint:"Evento 1: *Score ≥ 10* + *Disparar uma vez enquanto verdadeiro* → *Mostrar “Você venceu!”*. Evento 2: *Lives ≤ 0* → *Mostrar “Game over”*.",
  quiz:[{q:"Por que a meta de vitória deve ficar visível ao jogador?", o:["Para ele entender em direção a quê está trabalhando","Para economizar memória","O GDevelop exige"], why:"Uma meta que o jogador vê transforma cada ação em progresso."},
    {q:"Depois de um playtest, você muda a meta de 10 para 30 moedas. O que está fazendo?", o:["Balanceamento","Depuração","Geração"], why:"Ajustar valores até o jogo parecer certo é balanceamento."}]}
},
gloss: [
  ["Evento","Uma regra na folha de eventos: uma lista de condições e uma de ações. Quando todas as condições são verdadeiras, as ações rodam."],
  ["Folha de eventos","A lista de eventos de uma cena. O GDevelop a lê de cima para baixo a cada quadro."],
  ["Condição","O lado esquerdo de um evento. Algo verdadeiro ou falso, como uma tecla pressionada ou uma colisão."],
  ["Ação","O lado direito de um evento. Algo que muda o jogo, como mover, criar ou excluir um objeto."],
  ["Objeto","Um tipo de coisa no jogo, como Player, Coin ou Enemy. Define como suas instâncias aparecem e se comportam."],
  ["Instância","Uma cópia de um objeto na cena. Cinco moedas são cinco instâncias do objeto Coin."],
  ["Seleção de objetos","As condições selecionam as instâncias que as atendem; as ações daquele evento valem só para elas."],
  ["Comportamento","Lógica pronta ligada a um objeto, como Personagem de plataforma, Plataforma ou Movimento top-down."],
  ["Cena","Uma fase ou tela do jogo, com seus próprios objetos e sua própria folha de eventos."],
  ["Variável","Um valor com nome que pode mudar durante o jogo, como Score ou Lives. Pode pertencer à cena, ao jogo inteiro ou a um objeto."],
  ["Objeto de texto","Um objeto que mostra texto na tela. Ações podem mudar esse texto."],
  ["Colisão","Dois objetos se sobrepondo. O GDevelop verifica pela caixa de colisão (hitbox) de cada objeto."],
  ["Temporizador","Um cronômetro que conta os segundos desde que foi iniciado ou reiniciado. Serve para gerar objetos, recargas e atrasos."],
  ["Disparar uma vez","Uma condição que deixa o evento rodar só no quadro em que as outras condições ficam verdadeiras."],
  ["Quadro (frame)","Uma atualização do jogo. O GDevelop roda cerca de 60 quadros por segundo e lê a folha de eventos a cada um."],
  ["Expressão","Uma fórmula que produz um valor, como \"Score: \" + ToString(Score)."],
  ["Pré-visualização","Rodar o jogo direto do editor para testá-lo."],
  ["Depurador","Uma ferramenta que mostra variáveis e instâncias ao vivo enquanto o jogo roda."],
  ["Extensão","Um pacote que acrescenta objetos, comportamentos, condições ou ações ao GDevelop."],
  ["Gerador (spawner)","Uma regra que cria objetos novos durante o jogo."],
  ["Loop central","O ciclo curto que o jogador mais repete: agir, receber uma recompensa, achar a próxima chance."],
  ["Flow (fluxo)","Um estado em que o desafio combina com a habilidade do jogador. Fácil demais entedia, difícil demais frustra."],
  ["Curva de dificuldade","Como o desafio cresce ao longo do jogo."],
  ["Game feel (juice)","Retornos como sons, partículas e tremor de câmera que tornam as ações satisfatórias."],
  ["Estados de vitória e derrota","Os finais claros de um jogo. Dão propósito às ações do jogador."],
  ["Balanceamento","Ajustar valores como velocidade, vidas e metas até o jogo parecer justo e interessante."],
  ["Playtest","Observar pessoas jogando para descobrir o que confunde, entedia ou encanta."]

about: { title:"Sobre o GDev.Micro",
  body:["O GDev.Micro é uma plataforma de micro-learning de game design com GDevelop. Cada lição é um pequeno loop próprio: ler uma ideia, montá-la numa folha de eventos ao vivo, pré-visualizar e responder a duas perguntas.",
    "A folha de eventos segue o modelo do **GDevelop**, o motor de jogos gratuito e de código aberto em que jogos são feitos com eventos em vez de código: condições à esquerda, ações à direita, lidas de cima para baixo a cada quadro. As lições cobrem as ideias centrais do motor (eventos, comportamentos, variáveis, seleção de objetos, temporizadores) e as ideias de design por trás de bons jogos (loop central, dificuldade, game feel, finais) e a geração procedural (aleatoriedade, sementes, restrições, tabelas com pesos).",
    "Tudo roda no seu navegador, numa pequena simulação do sistema de eventos. As mesmas ideias funcionam direto no editor real do GDevelop. O progresso fica salvo só neste dispositivo.",
    "O GDev.Micro faz parte da família .Micro de plataformas de aprendizagem, ao lado de AI2.Micro, DS.Micro, Stats.Micro e das outras plataformas do Microlearn. É um projeto educacional independente, sem vínculo com a equipe do GDevelop."],
  credits:"Créditos",
  creditList:["GDevelop: motor de jogos de código aberto de Florian Rival e colaboradores (licença MIT)","“Juice it or lose it”: palestra de Martin Jonasson e Petri Purho (2012)","Flow: Mihaly Csikszentmihalyi, A psicologia do alto desempenho e da felicidade (1990)"],
  links:"Links do GDevelop" }
};

lessons: {
l1:{ title:"Tu primer evento",
  concept:["Los juegos en GDevelop no se escriben en código. Describes lo que pasa con **eventos**, listados uno debajo del otro en la **hoja de eventos**.",
    "Cada evento tiene dos lados. A la izquierda están las **condiciones**: lo que debe ser cierto. A la derecha están las **acciones**: qué hacer cuando todas las condiciones se cumplen. GDevelop lee toda la hoja de arriba abajo unas 60 veces por segundo.",
    "Una de las condiciones más útiles es *Al comienzo de la escena*. Solo es verdadera en el primer fotograma, así que es el lugar para preparar las cosas."],
  example:"En el editor real, cada evento muestra las condiciones en la columna izquierda y las acciones en la derecha. Las añades con “Añadir condición” y “Añadir acción”, igual que aquí.",
  task:"Haz que el objeto de texto **Msg** salude cuando empiece la escena.",
  hint:"Añade un evento nuevo. Condición: *Al comienzo de la escena*. Acción: *Cambiar el texto de Msg*. Luego pulsa Vista previa.",
  quiz:[{q:"¿Cuándo se ejecuta una acción?", o:["Cuando todas las condiciones de su evento son verdaderas","Una vez, al instalar el juego","Cada vez que el jugador hace clic en ella"], why:"El evento comprueba sus condiciones. Solo cuando todas se cumplen se ejecutan las acciones."},
    {q:"¿Con qué frecuencia lee GDevelop la hoja de eventos durante el juego?", o:["En cada fotograma, unas 60 veces por segundo","Solo cuando se pulsa una tecla","Una vez por escena"], why:"La hoja se evalúa en cada fotograma. Por eso una tecla pulsada se nota al instante."}]},
l2:{ title:"Moverse con el teclado",
  concept:["Una condición puede vigilar el teclado. *La tecla Derecha está presionada* sigue siendo verdadera en cada fotograma mientras la tecla se mantiene pulsada.",
    "Únela a una acción que cambie la **posición X** del Player. Como la hoja corre en cada fotograma, sumar 4 píxeles por fotograma se convierte en un movimiento suave: unos 240 píxeles por segundo.",
    "Cada dirección necesita su propio evento. Dos eventos pequeños son el sistema de movimiento más simple que puedes armar."],
  example:"En GDevelop, X crece hacia la derecha e Y crece hacia abajo. El punto (0, 0) es la esquina superior izquierda de la escena.",
  task:"Haz que **Player** vaya a la derecha con la tecla Derecha y a la izquierda con la tecla Izquierda.",
  hint:"Dos eventos. *Tecla Derecha presionada* → *X de Player: sumar 4*. *Tecla Izquierda presionada* → *X de Player: restar 4*. Pulsa Vista previa, haz clic en la escena y usa las flechas.",
  quiz:[{q:"¿Por qué sumar 4 a X en cada fotograma parece un movimiento suave?", o:["El evento corre unas 60 veces por segundo mientras la tecla está pulsada","GDevelop anima cada cambio por su cuenta","Pulsar una tecla dura exactamente un fotograma"], why:"Sesenta pasos pequeños por segundo se funden en un movimiento continuo, unos 240 px/s."},
    {q:"En GDevelop, ¿hacia dónde crece el eje Y?", o:["Hacia abajo","Hacia arriba","Depende de la escena"], why:"Las coordenadas empiezan en la esquina superior izquierda, así que una Y mayor está más abajo en la pantalla."}]},
l3:{ title:"Los comportamientos hacen el trabajo pesado",
  concept:["Mover a mano muestra la idea, pero los juegos reales necesitan gravedad, saltos, aceleración y pendientes. GDevelop empaqueta esa lógica en **comportamientos** que añades a los objetos.",
    "Añade **Personaje de plataformas** al Player y correrá con las flechas y saltará con Espacio. Pero necesita algo donde pisar: añade el comportamiento **Plataforma** al Ground.",
    "Comportamientos y eventos trabajan juntos. Los comportamientos resuelven la parte estándar; los eventos ponen las reglas que hacen tuyo el juego."],
  example:"En GDevelop, los comportamientos se añaden en el editor del objeto, en la pestaña Comportamientos. Otros comunes son Movimiento top-down, Física, Arrastrable y Tween.",
  task:"Da a **Player** el comportamiento Personaje de plataformas y a **Ground** el comportamiento Plataforma. Luego pulsa Vista previa: corre con las flechas, salta con Espacio.",
  hint:"Usa el panel Comportamientos. Prueba a configurar solo el Player y pulsa Vista previa: atraviesa el suelo. Después arregla el Ground.",
  quiz:[{q:"Tu personaje de plataformas atraviesa el suelo. ¿Cuál es la causa más probable?", o:["El suelo no tiene el comportamiento Plataforma","La escena tiene demasiados eventos","Al personaje le falta una variable"], why:"Un personaje de plataformas solo se apoya en objetos con el comportamiento Plataforma."},
    {q:"¿Qué es un comportamiento?", o:["Lógica lista para usar añadida a un objeto","Una lista de sonidos","Un tipo de variable"], why:"Los comportamientos añaden funciones prefabricadas, como gravedad y salto, a los objetos que los tienen."}]},
l4:{ title:"Recoge las monedas",
  concept:["Una condición de **colisión** es verdadera cuando dos objetos se superponen. *Player está en colisión con Coin* es como empieza casi cualquier recolección en un juego 2D.",
    "Hay cinco monedas, y cada una es una **instancia** del objeto Coin. La condición de colisión **selecciona** solo las instancias que tocan al Player, así que *Eliminar Coin* quita esa moneda y deja las demás.",
    "Una **variable** guarda un valor que cambia durante el juego. Suma 1 a la variable de escena **Score** cada vez que se recoge una moneda."],
  example:"La selección de objetos es el superpoder discreto de los eventos de GDevelop: las acciones de un evento se aplican solo a las instancias que eligieron sus condiciones.",
  task:"Cuando **Player** toque una **Coin**, elimina esa moneda y suma 1 a **Score**. Mira el Score en el depurador.",
  hint:"Un evento. Condición: *Player está en colisión con Coin*. Acciones: *Eliminar Coin* y *Score: sumar 1*.",
  quiz:[{q:"Hay cinco monedas en pantalla y el jugador toca una. ¿Qué monedas quita *Eliminar Coin*?", o:["Solo la seleccionada por la condición de colisión","Las cinco","Ninguna, eliminar requiere un temporizador"], why:"Las condiciones seleccionan instancias; las acciones actúan solo sobre las seleccionadas."},
    {q:"¿Dónde guardar el número de monedas recogidas?", o:["En una variable","En el color de la moneda","En el nombre de la escena"], why:"Las variables guardan valores que cambian durante el juego, como la puntuación, las vidas o el número de nivel."}]},
l5:{ title:"Muestra la puntuación",
  concept:["El Score cambia, pero el jugador no lo ve. El objeto de texto **ScoreText** sigue mostrando el texto con el que se creó.",
    "Un evento **sin condiciones** se ejecuta en cada fotograma. Por eso es el lugar indicado para acciones que mantienen la pantalla al día con las variables, como actualizar un marcador.",
    "Poner la misma acción en *Al comienzo de la escena* la ejecutaría una sola vez y mostraría 0 para siempre. Pruébalo y compara."],
  example:"En GDevelop construyes ese texto con una expresión: \"Score: \" + ToString(Score). La acción de aquí hace lo mismo.",
  task:"Mantén **ScoreText** actualizado para que el jugador siempre vea el Score actual.",
  hint:"Añade un evento nuevo, deja vacío el lado de condiciones y dale la acción *Cambiar el texto de ScoreText*.",
  quiz:[{q:"Un evento sin condiciones se ejecuta…", o:["En cada fotograma","Nunca","Solo al comienzo de la escena"], why:"Sin nada que comprobar, sus acciones se ejecutan en cada fotograma."},
    {q:"Actualizas ScoreText solo al comienzo de la escena. ¿Qué ve el jugador?", o:["Score: 0, para siempre","La puntuación correcta","Un mensaje de error"], why:"El texto se fija una vez, antes de recoger ninguna moneda, y no vuelve a cambiar."}]},
l6:{ title:"Disparar una vez",
  concept:["Algunos momentos deben ocurrir una sola vez, como una fanfarria cuando el jugador llega a 5 monedas. Pero *Score ≥ 5* sigue siendo verdadera en cada fotograma después, así que sus acciones se repiten unas 60 veces por segundo.",
    "Añade la condición **Disparar una vez mientras sea verdadero**. El evento solo se ejecuta en el fotograma en que sus condiciones se vuelven verdaderas, y espera a que sean falsas antes de poder ejecutarse otra vez.",
    "Prueba primero sin ella y mira cómo sube *Sonidos reproducidos* en el depurador. Luego corrígelo."],
  example:"En GDevelop, Disparar una vez está entre las condiciones generales. Es el arreglo habitual para sonidos, efectos y mensajes que se disparan demasiadas veces.",
  task:"Cuando **Score** llegue a 5, reproduce la fanfarria exactamente una vez.",
  hint:"Un evento con dos condiciones: *Score ≥ 5* y *Disparar una vez mientras sea verdadero*. Acción: *Reproducir el sonido fanfare.wav*.",
  quiz:[{q:"Sin Disparar una vez, ¿qué pasa cuando Score llega a 5?", o:["El sonido suena en cada fotograma","El sonido suena una vez","El juego se detiene"], why:"La condición sigue siendo verdadera, así que la acción se repite en cada fotograma."},
    {q:"¿Cuándo puede volver a ejecutarse un evento con Disparar una vez?", o:["Cuando sus condiciones pasan a falsas y luego otra vez a verdaderas","Nunca","Después de exactamente un segundo"], why:"Disparar una vez se rearma cuando sus condiciones dejan de cumplirse."}]},
l7:{ title:"Temporizadores y generación",
  concept:["Un nivel sin nada que hacer está terminado. Para mantener ocupado al jugador, deben seguir **apareciendo** monedas nuevas.",
    "Un **temporizador de escena** cuenta segundos. La condición *temporizador “spawn” > 2 segundos* se vuelve verdadera dos segundos después de que empieza. Crea una moneda y reinicia el temporizador para que la cuenta vuelva a empezar.",
    "Olvidar el reinicio es un error clásico: la condición sigue verdadera y aparece una moneda en cada fotograma."],
  example:"En GDevelop, la acción *Iniciar (o reiniciar) un temporizador de escena* empieza la cuenta. Los objetos también pueden tener sus propios temporizadores.",
  task:"Cada 2 segundos, crea una nueva **Coin** en una posición aleatoria.",
  hint:"Un evento. Condición: *temporizador “spawn” > 2 segundos*. Acciones: *Crear Coin* e *Iniciar (o reiniciar) el temporizador “spawn”*.",
  quiz:[{q:"Creas una moneda cuando el temporizador pasa de 2 s, pero nunca lo reinicias. ¿Qué pasa?", o:["Aparece una moneda en cada fotograma","Aparece una moneda cada 2 s","No aparece nada"], why:"Después de 2 s la condición queda verdadera, así que la acción se repite en cada fotograma."},
    {q:"¿Qué es un generador (spawner) en diseño de juegos?", o:["Una regla que crea objetos nuevos durante el juego","La primera escena de un juego","Un tipo de sprite"], why:"Los generadores mantienen el mundo lleno de cosas que recoger, evitar o enfrentar."}]},
l8:{ title:"Enemigos y vidas",
  concept:["La recompensa necesita riesgo. Un enemigo que patrulla el suelo le da al jugador una razón para saltar y una forma de perder.",
    "Cuando el Player toque un Enemy, resta 1 a **Lives** y elimina ese enemigo, para que un toque cueste exactamente una vida. Eliminar el enemigo seleccionado funciona igual que eliminar la moneda seleccionada.",
    "Un segundo evento vigila el resultado: cuando **Lives** llegue a 0, muestra *Game over*. Separar “lo que pasa” de “lo que significa” mantiene simple cada evento."],
  example:"Los proyectos reales suelen dar al jugador unos segundos de invencibilidad tras el golpe en vez de eliminar al enemigo. La misma idea, más pulida.",
  task:"Tocar un **Enemy** cuesta una vida y quita ese enemigo. Con 0 vidas, muestra Game over.",
  hint:"Evento 1: *Player en colisión con Enemy* → *Lives: restar 1* y *Eliminar Enemy*. Evento 2: *Lives ≤ 0* → *Mostrar “Game over”*.",
  quiz:[{q:"¿Por qué eliminar al enemigo después del golpe en esta lección?", o:["Si no, la colisión sigue verdadera y quita una vida en cada fotograma","Los enemigos no se pueden reutilizar","Eliminarlo da puntos al jugador"], why:"Una colisión que continúa es verdadera en cada fotograma. Quitar al enemigo hace que un toque cueste una vida."},
    {q:"¿Por qué usar un evento aparte para Lives ≤ 0?", o:["Reacciona al resultado, sea cual sea la causa de la pérdida","GDevelop permite una acción por evento","Se ejecuta más rápido"], why:"Un evento cambia el valor; otro reacciona a él. Más adelante, trampas o caídas pueden quitar vidas sin nueva lógica de game over."}]},
l9:{ title:"El bucle central",
  concept:["Todo juego tiene un **bucle central** (core loop): el ciclo corto de acciones que el jugador más repite. Aquí es: moverse, recoger, ver subir la puntuación, buscar la siguiente moneda.",
    "Un bucle se sostiene con tres partes: una **acción** del jugador, una **recompensa** visible y una **renovación** que trae la siguiente oportunidad. Quita una y el juego se acaba en pocos segundos.",
    "Esta vez la hoja empieza vacía. Reconstruye el bucle completo con lo que has aprendido."],
  example:"Los diseñadores suelen dibujar el bucle central como un ciclo antes de construir nada. Si el bucle no es divertido en su forma más simple, más contenido no lo salvará.",
  task:"Arma el bucle completo: tocar una Coin la elimina y suma al Score, ScoreText siempre muestra el Score, y aparece una Coin nueva cada 2 segundos.",
  hint:"Tres eventos: la recolección por colisión, un evento sin condiciones para el texto y el generador con temporizador y su reinicio.",
  quiz:[{q:"¿Cuál de estos forma parte del bucle central de este juego?", o:["Recoger una moneda y ver subir la puntuación","La pantalla de título","Elegir el idioma"], why:"El bucle central es lo que el jugador hace una y otra vez, momento a momento."},
    {q:"Quitas el generador. ¿Qué le pasa al bucle?", o:["Se acaba cuando se terminan las monedas","Se vuelve más divertido","No cambia nada"], why:"Sin renovación no queda nada que hacer, y el bucle se rompe."}]},
l10:{ title:"La curva de dificultad",
  concept:["Un juego que nunca cambia aburre; uno que se vuelve difícil demasiado rápido frustra. La zona intermedia suele llamarse **flow** (flujo), término del psicólogo Mihaly Csikszentmihalyi.",
    "Una **curva de dificultad** sube el desafío a medida que el jugador mejora. Aquí el Enemy ya persigue al Player. Cuando Score llegue a 5, hazlo más rápido.",
    "Sube la dificultad en escalones ligados al progreso del jugador, no solo al tiempo. Así el jugador siente que el juego responde a lo que hizo."],
  example:"En GDevelop guardas la velocidad en una variable y usas esa variable en la acción de movimiento, así un solo cambio afecta a todos los enemigos.",
  task:"Cuando **Score** llegue a 5, multiplica **EnemySpeed** por 1,6, una vez.",
  hint:"La misma forma que la fanfarria: *Score ≥ 5* + *Disparar una vez mientras sea verdadero* → *EnemySpeed: multiplicar por 1,6*. Sin Disparar una vez, el enemigo se vuelve imparable.",
  quiz:[{q:"¿Qué es el flow en diseño de juegos?", o:["Un estado en que el desafío encaja con la habilidad del jugador","El orden de las escenas","La velocidad del juego"], why:"Demasiado fácil aburre, demasiado difícil frustra. El flow está en medio."},
    {q:"¿Por qué ligar el aumento de velocidad al Score y no a un reloj?", o:["El desafío crece con el progreso del jugador","No hay temporizadores","Score se calcula más rápido"], why:"Los escalones ligados al progreso mantienen la dificultad alineada con lo que el jugador ha logrado."}]},
l11:{ title:"Game feel",
  concept:["Recoger una moneda funciona, pero se siente plano. El **game feel**, a menudo llamado *juice*, es la capa de respuesta que hace satisfactorias las acciones: un sonido, partículas, una pequeña sacudida de cámara.",
    "El juice no cambia las reglas. Le dice al jugador, con claridad y al instante, que algo pasó.",
    "El orden importa dentro de un evento: las acciones se ejecutan de arriba abajo. Crea las partículas en la Coin **antes** de eliminarla. Tras eliminarla no queda moneda donde ponerlas."],
  example:"En GDevelop, los emisores de partículas y la extensión de sacudida de cámara hacen este trabajo. La charla “Juice it or lose it” de Martin Jonasson y Petri Purho (2012) es la demostración clásica.",
  task:"Dale juice a la recolección: partículas en la moneda y una sacudida de cámara, con las partículas creadas antes de eliminar la moneda.",
  hint:"Edita el evento de colisión. Añade *Crear partículas en Coin* y *Sacudir la cámara*, y usa la flecha hacia arriba en la acción de partículas hasta que quede encima de *Eliminar Coin*.",
  quiz:[{q:"¿Qué cambia el juice en un juego?", o:["Cómo se sienten las acciones, no las reglas","La condición de victoria","El número de niveles"], why:"El juice es respuesta. La mecánica sigue igual; la experiencia se vuelve más nítida."},
    {q:"Pones *Eliminar Coin* encima de *Crear partículas en Coin*. ¿Qué pasa?", o:["No aparece ninguna partícula","Las partículas aparecen dos veces","El juego se cuelga"], why:"Las acciones se ejecutan en orden. Tras eliminarla, no queda moneda seleccionada donde poner las partículas."}]},
l12:{ title:"Ganar y perder",
  concept:["Un juego necesita una forma clara de terminar. Un **estado de victoria** y uno de **derrota** dan sentido a cada acción: cada moneda acerca a la victoria, cada golpe acerca a la derrota.",
    "La meta debe estar a la vista. El jugador ve el Score, así que una meta de 10 monedas se entiende enseguida.",
    "Ambos finales pausan la escena para que el resultado quede en pantalla. Después, haz un playtest: ¿10 es la meta correcta? ¿Bastan 3 vidas? Ajustar esos valores se llama **balanceo**."],
  example:"En GDevelop el final suele cambiar de escena con la acción *Cambiar la escena*, hacia una escena de Victoria o de Game Over con sus propios eventos.",
  task:"Gana con 10 monedas, una vez. Pierde con 0 vidas.",
  hint:"Evento 1: *Score ≥ 10* + *Disparar una vez mientras sea verdadero* → *Mostrar “¡Ganaste!”*. Evento 2: *Lives ≤ 0* → *Mostrar “Game over”*.",
  quiz:[{q:"¿Por qué la meta de victoria debe estar a la vista del jugador?", o:["Para que entienda hacia qué está trabajando","Para ahorrar memoria","GDevelop lo exige"], why:"Una meta que el jugador ve convierte cada acción en progreso."},
    {q:"Tras un playtest cambias la meta de 10 a 30 monedas. ¿Qué estás haciendo?", o:["Balanceo","Depuración","Generación"], why:"Ajustar valores hasta que el juego se sienta bien es balanceo."}]}
},
gloss: [
  ["Evento","Una regla en la hoja de eventos: una lista de condiciones y otra de acciones. Cuando todas las condiciones se cumplen, se ejecutan las acciones."],
  ["Hoja de eventos","La lista de eventos de una escena. GDevelop la lee de arriba abajo en cada fotograma."],
  ["Condición","El lado izquierdo de un evento. Algo verdadero o falso, como una tecla pulsada o una colisión."],
  ["Acción","El lado derecho de un evento. Algo que cambia el juego, como mover, crear o eliminar un objeto."],
  ["Objeto","Un tipo de cosa en el juego, como Player, Coin o Enemy. Define cómo se ven y se comportan sus instancias."],
  ["Instancia","Una copia de un objeto en la escena. Cinco monedas son cinco instancias del objeto Coin."],
  ["Selección de objetos","Las condiciones seleccionan las instancias que las cumplen; las acciones de ese evento se aplican solo a ellas."],
  ["Comportamiento","Lógica prefabricada añadida a un objeto, como Personaje de plataformas, Plataforma o Movimiento top-down."],
  ["Escena","Un nivel o pantalla del juego, con sus propios objetos y su propia hoja de eventos."],
  ["Variable","Un valor con nombre que puede cambiar durante el juego, como Score o Lives. Puede pertenecer a la escena, al juego entero o a un objeto."],
  ["Objeto de texto","Un objeto que muestra texto en pantalla. Las acciones pueden cambiar ese texto."],
  ["Colisión","Dos objetos superpuestos. GDevelop la comprueba con la caja de colisión (hitbox) de cada objeto."],
  ["Temporizador","Un cronómetro que cuenta segundos desde que se inició o reinició. Sirve para generar objetos, recargas y retrasos."],
  ["Disparar una vez","Una condición que deja ejecutar el evento solo en el fotograma en que sus otras condiciones se vuelven verdaderas."],
  ["Fotograma (frame)","Una actualización del juego. GDevelop corre unos 60 fotogramas por segundo y lee la hoja de eventos en cada uno."],
  ["Expresión","Una fórmula que produce un valor, como \"Score: \" + ToString(Score)."],
  ["Vista previa","Ejecutar el juego directamente desde el editor para probarlo."],
  ["Depurador","Una herramienta que muestra variables e instancias en vivo mientras el juego corre."],
  ["Extensión","Un paquete que añade objetos, comportamientos, condiciones o acciones a GDevelop."],
  ["Generador (spawner)","Una regla que crea objetos nuevos durante el juego."],
  ["Bucle central","El ciclo corto que el jugador más repite: actuar, recibir una recompensa, encontrar la siguiente oportunidad."],
  ["Flow (flujo)","Un estado en que el desafío encaja con la habilidad del jugador. Demasiado fácil aburre, demasiado difícil frustra."],
  ["Curva de dificultad","Cómo sube el desafío a lo largo del juego."],
  ["Game feel (juice)","Respuestas como sonidos, partículas y sacudidas de cámara que hacen satisfactorias las acciones."],
  ["Estados de victoria y derrota","Los finales claros de un juego. Dan sentido a las acciones del jugador."],
  ["Balanceo","Ajustar valores como velocidad, vidas y metas hasta que el juego se sienta justo e interesante."],
  ["Playtest","Observar a personas jugando para descubrir qué confunde, aburre o encanta."]
],
about: { title:"Acerca de GDev.Micro",
  body:["GDev.Micro es una plataforma de micro-learning de diseño de juegos con GDevelop. Cada lección es un pequeño bucle propio: leer una idea, armarla en una hoja de eventos en vivo, probarla y responder dos preguntas.",
    "La hoja de eventos sigue el modelo de **GDevelop**, el motor de juegos gratuito y de código abierto en el que los juegos se hacen con eventos en vez de código: condiciones a la izquierda, acciones a la derecha, leídas de arriba abajo en cada fotograma. Las lecciones cubren las ideas centrales del motor (eventos, comportamientos, variables, selección de objetos, temporizadores) y las ideas de diseño detrás de los buenos juegos (bucle central, dificultad, game feel, finales) y la generación procedimental (aleatoriedad, semillas, restricciones, tablas con pesos).",
    "Todo corre en tu navegador sobre una pequeña simulación del sistema de eventos. Las mismas ideas funcionan directamente en el editor real de GDevelop. El progreso se guarda solo en este dispositivo.",
    "GDev.Micro forma parte de la familia .Micro de plataformas de aprendizaje, junto a AI2.Micro, DS.Micro, Stats.Micro y las demás plataformas de Microlearn. Es un proyecto educativo independiente, sin vínculo con el equipo de GDevelop."],
  credits:"Créditos",
  creditList:["GDevelop: motor de juegos de código abierto de Florian Rival y colaboradores (licencia MIT)","“Juice it or lose it”: charla de Martin Jonasson y Petri Purho (2012)","Flow: Mihaly Csikszentmihalyi, Fluir: una psicología de la felicidad (1990)"],
  links:"Enlaces de GDevelop" }
};

  lessons: {
  l13:{ title:"Randomness and Repeat",
    concept:["**Procedural generation** means building content with rules instead of placing every piece by hand. The level is made when the scene starts, so it can be different every time.",
      "The simplest generator is a loop with randomness. A **Repeat** event runs its actions a set number of times, and each new coin gets a random position. In GDevelop that position comes from expressions like *RandomInRange(30, 600)*.",
      "This scene starts with no coins at all. Generate them when the scene begins, then press Restart a few times and compare the layouts."],
    example:"In GDevelop, Repeat is its own event type: add a repeat event and give it a count. Random(), RandomInRange() and RandomFloat() are the built-in random expressions.",
    task:"When the scene starts, create 5 coins at random positions.",
    hint:"One event. Condition: *At the beginning of the scene*. Action: *Repeat 5 times: create Coin at a random position*. Press Restart to see a new layout.",
    quiz:[{q:"What makes generation procedural?", o:["Content is created by rules while the game runs","Every object is placed by hand in the editor","The game has many scenes"], why:"A procedural level comes out of a process. The designer writes rules instead of layouts."},
      {q:"What does a Repeat event do?", o:["Runs its actions a fixed number of times, within one frame","Runs once per second","Restarts the whole scene"], why:"Repeat loops over its actions the given number of times, all inside the same frame."}]},
  l14:{ title:"Seeds make it repeatable",
    concept:["Pure randomness has a cost. You cannot share a good level, reproduce a bug or run a daily challenge, because the next run is always different.",
      "Computers do not make true randomness. They use a **pseudorandom generator**: a formula that turns one starting number, the **seed**, into a long sequence that looks random. Same seed, same sequence, same level.",
      "Set the seed **before** generating. Then press Restart a few times: the coins land in the same places every run. Remove the seed and they move again."],
    example:"The built-in random expressions in GDevelop give different results on every run. Projects that need repeatable levels use a seeded generator, built with variables and events or taken from a community extension.",
    task:"Make the generated level identical on every run: set the seed to 42 before generating.",
    hint:"Edit the start event so its actions are, in this order: *Set the random seed to 42*, then *Repeat 5 times: create Coin*. Use the up arrow to fix the order.",
    quiz:[{q:"Two players use the same seed. What do they get?", o:["The same generated level","Two different levels","An error"], why:"A pseudorandom generator is deterministic: the same seed always gives the same sequence."},
      {q:"Why must the seed be set before generating?", o:["The generator uses the seed from the first number it draws","Seeds only work at the end of an event","The order does not matter"], why:"Numbers drawn before the seed is set come from the old state, so the layout still changes."}]},
  l15:{ title:"Rules and constraints",
    concept:["Random heights for platforms sound fine until one appears too high to reach. A generator that can produce impossible levels is a broken generator.",
      "Good generators combine randomness with **constraints**: rules every result must respect. The player jumps about 100 px, so each platform may rise at most 85 px above the previous one. Inside that rule, anything goes.",
      "Order matters again: create the platforms first, then place a coin above each one. Watch *Biggest step up* in the debugger and compare the two generators."],
    example:"Games like Spelunky mix handmade room templates with random rules, so every level is new and still solvable. Constraints are the part of a generated level the designer still controls.",
    task:"Generate the platforms with the 85 px rule, then place a coin above each platform.",
    hint:"Start event actions, in order: *Generate Platforms: rise at most 85 px each*, then *Create a Coin above each Platform*. Leave out the any-height generator.",
    quiz:[{q:"What is a constraint in procedural generation?", o:["A rule every generated result must respect","A random number","A kind of behavior"], why:"Constraints keep generated content playable and in line with the design."},
      {q:"The player jumps 100 px. Which rule keeps the platforms reachable?", o:["Each platform rises at most 85 px above the previous one","Platforms appear anywhere between 0 and 300 px high","Each platform is exactly 150 px higher"], why:"Keeping every step below the jump height, with a margin, guarantees the climb is possible."}]},
  l16:{ title:"Weighted tables",
    concept:["Not every outcome should be equally likely. A **weighted table** gives each result a share: here, a new spawn is a coin 75% of the time and an enemy 25%.",
      "Weights are a design dial. At 50/50 the ground fills with enemies and the game turns into survival; at 75/25 the player mostly collects, with enough danger to stay alert.",

      {q:"Raising the enemy weight from 25% to 50% mainly changes…", o:["The pace and difficulty of the game","The graphics","The number of scenes"], why:"Weights shape how the game feels: more danger, fewer rewards."}]}

function hash(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
