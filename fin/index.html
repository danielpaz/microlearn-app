<style>
:root{
  --bg:#F5F5F0; --surface:#FFFFFF; --surface-2:#EFEFE8; --ink:#14201A; --muted:#5D6A62; --line:#DFE2D9;
  --accent:#1B6E4E; --accent-ink:#FFFFFF; --accent-soft:#E2F1E9;
  --ok:#1B7A4A; --ok-soft:#E1F2E8; --bad:#B8362A; --bad-soft:#FBE7E4; --gold:#B7791F;
  --lv-beg:#1B7A4A; --lv-int:#2F5FBF; --lv-adv:#9B3B2A;
  --c1:#1B6E4E; --c2:#C08A1E; --c3:#3F6FB5;
  --f-display:"Sora", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(20,32,26,.06), 0 6px 24px -12px rgba(20,32,26,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1F2923; --ink:#E6EEE9; --muted:#9AA9A0; --line:#2B3630;
  --accent:#5CCB97; --accent-ink:#0A1D14; --accent-soft:#183326;
  --ok:#5CCB97; --ok-soft:#163324; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5CCB97; --lv-int:#7EA2F2; --lv-adv:#F08A73;
  --c1:#5CCB97; --c2:#E2B04A; --c3:#7EA6F0; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#161E1A; --surface-2:#1F2923; --ink:#E6EEE9; --muted:#9AA9A0; --line:#2B3630;
  --accent:#5CCB97; --accent-ink:#0A1D14; --accent-soft:#183326;
  --ok:#5CCB97; --ok-soft:#163324; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5CCB97; --lv-int:#7EA2F2; --lv-adv:#F08A73;
  --c1:#5CCB97; --c2:#E2B04A; --c3:#7EA6F0; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;font-stretch:112%}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:112%}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}

/* Fin.Micro: sliders → outputs → chart, ledger-like tables */
.sliders{display:grid;gap:14px;margin-bottom:14px}
.sl-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:4px}
.sl label{font-size:.9rem;font-weight:600}
.sl output{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.sl input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.outs{display:grid;gap:8px;margin:6px 0 12px}
.out{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem}
.out span{color:var(--muted);min-width:0}
.out b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.out b small{color:var(--muted);font-weight:500}
.out.big{background:var(--accent-soft)}
.out.big b{font-size:1.25rem;color:var(--accent)}
.out.bad b{color:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:11px}
.chart .ln{fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.chart .area{fill:var(--c1);opacity:.1}
.ln0{stroke:var(--c1)}.ln1{stroke:var(--c2)}.ln2{stroke:var(--c3)}
.ln.dash{stroke-dasharray:6 5;stroke-width:2}
.pt0{fill:var(--c1)}.pt1{fill:var(--c2)}.pt2{fill:var(--c3)}
.pt{stroke:var(--surface);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin-top:4px}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i,.hv-final i{display:inline-block;width:16px;height:3px;border-radius:2px}
.sw0{background:var(--c1)}.sw1{background:var(--c2)}.sw2{background:var(--c3)}
.lg i.dash{background:repeating-linear-gradient(90deg,var(--c2) 0 5px,transparent 5px 9px)}
.lg i.sw0.dash{background:repeating-linear-gradient(90deg,var(--c1) 0 5px,transparent 5px 9px)}
.budget{margin-top:6px}
.bbar{position:relative;display:flex;height:34px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.bbar > div{height:100%;transition:width .2s}
.seg-needs,.b-needs{background:var(--c1)} .seg-wants,.b-wants{background:var(--c2)} .seg-save,.b-save{background:var(--c3)} .seg-left,.b-left{background:var(--line)}
.lg i[class^="b-"]{width:12px;height:12px;border-radius:3px}
.bbar .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.blabels{position:relative;height:18px;font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.blabels span{position:absolute;transform:translateX(-50%)} .blabels span:first-child{transform:none}
.blabels span:last-child{transform:translateX(-100%)}
.bars3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;height:200px;margin-top:8px}
.b3{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.b3bar{position:relative;flex:1;width:60%;background:var(--surface-2);border-radius:8px 8px 0 0;overflow:hidden}
.b3fill{position:absolute;left:0;right:0;bottom:0}
.b3-0{background:var(--bad);opacity:.75}.b3-1{background:var(--c1)}.b3-2{background:var(--c3)}
.b3line{position:absolute;left:-10%;right:-10%;height:2px;background:var(--ink)}
.b3 b{font-family:var(--f-mono);font-size:.85rem}.b3 span{font-size:.75rem;color:var(--muted);text-align:center}
.ftable{overflow-x:auto;margin-bottom:12px;border:1px solid var(--line);border-radius:10px}
.ftable table{border-collapse:collapse;width:100%;font-size:.88rem}
.ftable th,.ftable td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.ftable th{background:var(--surface-2);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ftable td.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ftable tr:last-child td{border-bottom:0;font-weight:700}
.opts.choice{margin-top:12px}
.numform label{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.numform input{font:inherit;font-family:var(--f-mono);font-size:1.05rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:180px;max-width:100%}
.numform input:focus{border-color:var(--accent);outline:none}
.hv-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.hv-final{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--muted);margin-top:6px}
.hv-final span{display:inline-flex;align-items:center;gap:6px}
.hv-final b{color:var(--ink);font-family:var(--f-mono)}
.tabsbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabsbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tabsbar button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.labmain{padding:18px}
.small{font-size:.82rem}

</style>
</head>

</main>
<footer><div class="wrap in" id="foot"></div></footer>

<script>const ABOUT_FIN = {"en": "<h1>About Fin.Micro</h1>\n<p>Fin.Micro is a micro-learning platform for personal finance. Each lesson takes three to five minutes: one idea, a simulator mission where you move the numbers yourself, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: budget, interest, debt, inflation, investing and planning. {progress}</p>\n<h2>How the simulators work</h2>\n<ul><li>Every mission is a small model with real formulas: compound interest, present value, loan payments (Price and SAC), effective cost, real returns.</li><li>Move the sliders until the result meets the goal. Some missions ask you to pick the better option or type a number.</li><li>The risk lesson runs 400 possible 20-year market paths with fixed random numbers, so everyone sees the same results.</li><li>The Lab has free calculators for compound interest, loans, inflation and retirement.</li></ul>\n<h2>Important</h2>\n<p>Fin.Micro is educational content, not financial, tax or investment advice. Rates and amounts in the lessons are illustrative and do not describe any real product. Amounts are shown in the currency of the chosen language (US$, R$ or €), but the numbers are the same in all three.</p>\n<h2>Part of Microlearn</h2>\n<p>Fin.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"microlearn.website.html\">www.microlearn.website</a>, next to Stats.Micro for probability and statistics.</p>", "pt": "<h1>Sobre o Fin.Micro</h1>\n<p>O Fin.Micro é uma plataforma de microaprendizagem de finanças pessoais. Cada lição leva de três a cinco minutos: uma ideia, uma missão no simulador em que você mexe nos números, e uma pergunta para conferir o que aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: orçamento, juros, dívidas, inflação, investimentos e planejamento. {progress}</p>\n<h2>Como funcionam os simuladores</h2>\n<ul><li>Cada missão é um pequeno modelo com fórmulas reais: juros compostos, valor presente, parcelas de financiamento (Price e SAC), custo efetivo total, rendimento real.</li><li>Mexa os controles até o resultado atingir a meta. Algumas missões pedem para escolher a melhor opção ou digitar um número.</li><li>A lição de risco roda 400 caminhos possíveis de mercado em 20 anos com números aleatórios fixos, então todo mundo vê os mesmos resultados.</li><li>O Laboratório tem calculadoras livres de juros compostos, financiamento, inflação e aposentadoria.</li></ul>\n<h2>Importante</h2>\n<p>O Fin.Micro é conteúdo educativo, não é recomendação financeira, tributária ou de investimento. Taxas e valores das lições são ilustrativos e não descrevem nenhum produto real. Os valores aparecem na moeda do idioma escolhido (US$, R$ ou €), mas os números são os mesmos nos três. Em português, quadros \"No Brasil\" trazem as regras e produtos daqui (CET, FGC, IR regressivo, IPCA).</p>\n<h2>Parte do Microlearn</h2>\n<p>O Fin.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"microlearn.website.html\">www.microlearn.website</a>, ao lado do Stats.Micro, de probabilidade e estatística.</p>", "es": "<h1>Acerca de Fin.Micro</h1>\n<p>Fin.Micro es una plataforma de microaprendizaje de finanzas personales. Cada lección dura de tres a cinco minutos: una idea, una misión en el simulador en la que mueves tú los números y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: presupuesto, intereses, deudas, inflación, inversión y planificación. {progress}</p>\n<h2>Cómo funcionan los simuladores</h2>\n<ul><li>Cada misión es un pequeño modelo con fórmulas reales: interés compuesto, valor presente, cuotas de préstamos (francés y alemán), coste efectivo, rentabilidad real.</li><li>Mueve los controles hasta que el resultado cumpla la meta. Algunas misiones piden elegir la mejor opción o escribir un número.</li><li>La lección de riesgo recorre 400 caminos posibles de mercado a 20 años con números aleatorios fijos, así que todo el mundo ve los mismos resultados.</li><li>El Laboratorio tiene calculadoras libres de interés compuesto, préstamos, inflación y jubilación.</li></ul>\n<h2>Importante</h2>\n<p>Fin.Micro es contenido educativo, no asesoramiento financiero, fiscal ni de inversión. Las tasas e importes de las lecciones son ilustrativos y no describen ningún producto real. Los importes se muestran en la moneda del idioma elegido (US$, R$ o €), pero las cifras son las mismas en los tres.</p>\n<h2>Parte de Microlearn</h2>\n<p>Fin.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"microlearn.website.html\">www.microlearn.website</a>, junto a Stats.Micro, de probabilidad y estadística.</p>"};</script>
