you must be able to withdraw it in a day or two.","pt":"Liquidez primeiro: você precisa conseguir sacar em um ou dois dias.","es":"Liquidez ante todo: tienes que poder retirarlo en uno o dos días."},{"en":"Low risk: this money is not for chasing returns.","pt":"Baixo risco: esse dinheiro não é para buscar rentabilidade.","es":"Bajo riesgo: este dinero no es para buscar rentabilidad."},{"en":"Self-employed or one-income households usually aim for 6 months or more.","pt":"Autônomos ou famílias com uma só renda costumam mirar 6 meses ou mais.","es":"Autónomos u hogares con un solo ingreso suelen apuntar a 6 meses o más."}],"mission":{"model":"emergency","prompt":{"en":"Monthly expenses are **2,500**, so the target is 6 months: **15,000**. Choose a monthly saving that reaches it in **24 months or less**.","pt":"As despesas mensais são de **2.500**, então a meta é de 6 meses: **15.000**. Escolha quanto guardar por mês para chegar lá em **24 meses ou menos**.","es":"Los gastos mensuales son **2.500**, así que el objetivo son 6 meses: **15.000**. Elige cuánto ahorrar al mes para alcanzarlo en **24 meses o menos**."},"hint":{"en":"15,000 ÷ 24 = 625. Anything from 650 up works.","pt":"15.000 ÷ 24 = 625. Qualquer valor a partir de 650 funciona.","es":"15.000 ÷ 24 = 625. Cualquier valor desde 650 sirve."}},"quiz":{"q":{"en":"Which is the best place for an emergency fund?","pt":"Qual é o melhor lugar para a reserva de emergência?","es":"¿Cuál es el mejor sitio para el fondo de emergencia?"},"options":[{"en":"A safe account you can withdraw from any day","pt":"Uma aplicação segura com saque a qualquer dia","es":"Una cuenta segura de la que puedas retirar cualquier día"},{"en":"Stocks, for higher returns","pt":"Ações, para render mais","es":"Acciones, para ganar más"},{"en":"A 5-year locked deposit","pt":"Um depósito travado por 5 anos","es":"Un depósito bloqueado a 5 años"}],"answer":0,"explain":{"en":"Emergencies do not wait. Safety and quick access matter more than return here.","pt":"Emergências não esperam. Aqui segurança e acesso rápido importam mais que rentabilidade.","es":"Las emergencias no esperan. Aquí la seguridad y el acceso rápido importan más que la rentabilidad."}},"note":{"en":"","pt":"**No Brasil:** a reserva costuma ficar em Tesouro Selic, CDB com liquidez diária ou fundos DI de taxa baixa, todos com saque rápido. CDBs têm garantia do FGC até R$ 250 mil por instituição.","es":""}},{"id":"goal","track":"budget","mins":3,"title":{"en":"Saving for a goal","pt":"Poupando para uma meta","es":"Ahorrar para una meta"},"intro":{"en":"A goal becomes a plan when it has an amount and a date. Divide what is missing by the months you have, and you know the monthly deposit.","pt":"Uma meta vira plano quando tem valor e prazo. Divida o que falta pelos meses que você tem e descubra o depósito mensal.","es":"Una meta se convierte en plan cuando tiene importe y fecha. Divide lo que falta entre los meses que tienes y sabrás el depósito mensual."},"ideas":[{"en":"Missing amount = goal − what you already have.","pt":"Quanto falta = meta − o que você já tem.","es":"Lo que falta = meta − lo que ya tienes."},{"en":"Monthly deposit = missing amount ÷ months.","pt":"Depósito mensal = quanto falta ÷ meses.","es":"Depósito mensual = lo que falta ÷ meses."},{"en":"Automate it: a scheduled transfer beats willpower.","pt":"Automatize: uma transferência programada vence a força de vontade.","es":"Automatízalo: una transferencia programada gana a la fuerza de voluntad."}],"mission":{"model":"goal","prompt":{"en":"A trip costs **6,000**. You already have **1,200** and travel in **12 months**. Find the **smallest** monthly deposit (in steps of 10) that pays for the trip.","pt":"Uma viagem custa **6.000**. Você já tem **1.200** e viaja em **12 meses**. Ache o **menor** depósito mensal (de 10 em 10) que paga a viagem.","es":"Un viaje cuesta **6.000**. Ya tienes **1.200** y viajas en **12 meses**. Encuentra el depósito mensual **más pequeño** (de 10 en 10) que paga el viaje."},"hint":{"en":"(6,000 − 1,200) ÷ 12.","pt":"(6.000 − 1.200) ÷ 12.","es":"(6.000 − 1.200) ÷ 12."}},"quiz":{"q":{"en":"You have 2,000 of a 5,000 goal and 6 months left. Monthly deposit?","pt":"Você tem 2.000 de uma meta de 5.000 e faltam 6 meses. Depósito mensal?","es":"Tienes 2.000 de una meta de 5.000 y quedan 6 meses. ¿Depósito mensual?"},"options":["500","833","1,000"],"answer":0,"explain":{"en":"(5,000 − 2,000) ÷ 6 = 500.","pt":"(5.000 − 2.000) ÷ 6 = 500.","es":"(5.000 − 2.000) ÷ 6 = 500."}}},{"id":"latte","track":"budget","mins":3,"title":{"en":"Small expenses add up","pt":"Pequenos gastos somam","es":"Los pequeños gastos suman"},"intro":{"en":"A daily coffee looks harmless, but small recurring expenses add up over a year, and even more if that money could have been invested.","pt":"Um café por dia parece inofensivo, mas gastos pequenos e frequentes somam muito em um ano, e mais ainda se esse dinheiro pudesse estar investido.","es":"Un café al día parece inofensivo, pero los pequeños gastos recurrentes suman mucho en un año, y más aún si ese dinero pudiera estar invertido."},"ideas":[{"en":"Multiply: price × times per week × 52.","pt":"Multiplique: preço × vezes por semana × 52.","es":"Multiplica: precio × veces por semana × 52."},{"en":"Subscriptions are the same trap: review them every few months.","pt":"Assinaturas são a mesma armadilha: revise a cada poucos meses.","es":"Las suscripciones son la misma trampa: revísalas cada pocos meses."},{"en":"The point is choice, not guilt: spend on what you value.","pt":"A questão é escolha, não culpa: gaste no que você valoriza.","es":"La cuestión es elegir, no sentirse culpable: gasta en lo que valoras."}],"mission":{"model":"latte","prompt":{"en":"Seven coffees a week at 6 cost over 2,000 a year. Adjust the habit so it costs **600 a year or less** (but not zero).","pt":"Sete cafés por semana a 6 custam mais de 2.000 por ano. Ajuste o hábito para custar **600 por ano ou menos** (mas não zero).","es":"Siete cafés a la semana a 6 cuestan más de 2.000 al año. Ajusta el hábito para que cueste **600 al año o menos** (pero no cero)."},"hint":{"en":"Fewer cups, a cheaper coffee, or both. 2 a week at 5.5 = 572.","pt":"Menos cafés, um café mais barato ou os dois. 2 por semana a 5,5 = 572.","es":"Menos cafés, uno más barato o ambas cosas. 2 a la semana a 5,5 = 572."}},"quiz":{"q":{"en":"A 30-a-month subscription costs how much per year?","pt":"Uma assinatura de 30 por mês custa quanto por ano?","es":"Una suscripción de 30 al mes cuesta cuánto al año?"},"options":["360","300","3,000"],"answer":0,"explain":{"en":"30 × 12 = 360.","pt":"30 × 12 = 360.","es":"30 × 12 = 360."}}},{"id":"compound","track":"interest","mins":4,"title":{"en":"Simple vs compound interest","pt":"Juros simples e compostos","es":"Interés simple y compuesto"},"intro":{"en":"Simple interest is paid only on the original amount. Compound interest is paid on the amount plus the interest already earned, so growth speeds up over time.","pt":"Juros simples incidem só sobre o valor inicial. Juros compostos incidem sobre o valor mais os juros já ganhos, então o crescimento acelera com o tempo.","es":"El interés simple se paga solo sobre el importe inicial. El compuesto se paga sobre el importe más los intereses ya ganados, así que el crecimiento se acelera con el tiempo."},"ideas":[{"en":"Simple: 1,000 at 10% a year earns 100 every year.","pt":"Simples: 1.000 a 10% ao ano rende 100 todo ano.","es":"Simple: 1.000 al 10 % anual gana 100 cada año."},{"en":"Compound: 1,000 × 1.1 × 1.1 × … earns more each year.","pt":"Compostos: 1.000 × 1,1 × 1,1 × … rende mais a cada ano.","es":"Compuesto: 1.000 × 1,1 × 1,1 × … gana más cada año."},{"en":"Time is the key ingredient: the curve bends upward.","pt":"O tempo é o ingrediente principal: a curva entorta para cima.","es":"El tiempo es el ingrediente clave: la curva se dobla hacia arriba."}],"mission":{"model":"compound","prompt":{"en":"1,000 at 10% a year. Find the **first year** in which compound interest beats simple interest by **more than 1,000**.","pt":"1.000 a 10% ao ano. Ache o **primeiro ano** em que os juros compostos superam os simples em **mais de 1.000**.","es":"1.000 al 10 % anual. Encuentra el **primer año** en que el interés compuesto supera al simple en **más de 1.000**."},"hint":{"en":"Move the years one by one and watch the difference.","pt":"Mova os anos um a um e observe a diferença.","es":"Mueve los años uno a uno y observa la diferencia."}},"quiz":{"q":{"en":"100 at 10% compound for 2 years becomes…","pt":"100 a 10% compostos por 2 anos viram…","es":"100 al 10 % compuesto durante 2 años se convierten en…"},"options":["121","120","110"],"answer":0,"explain":{"en":"100 × 1.1 × 1.1 = 121. Simple interest would give 120.","pt":"100 × 1,1 × 1,1 = 121. Juros simples dariam 120.","es":"100 × 1,1 × 1,1 = 121. Con interés simple serían 120."}}},{"id":"rule72","track":"interest","mins":3,"title":{"en":"The rule of 72","pt":"A regra do 72","es":"La regla del 72"},"intro":{"en":"A quick mental shortcut: divide 72 by the yearly rate to estimate how many years it takes to double your money.","pt":"Um atalho rápido: divida 72 pela taxa anual para estimar em quantos anos o dinheiro dobra.","es":"Un atajo mental: divide 72 entre la tasa anual para estimar en cuántos años se duplica el dinero."},"ideas":[{"en":"At 6% a year: 72 ÷ 6 = about 12 years.","pt":"A 6% ao ano: 72 ÷ 6 = cerca de 12 anos.","es":"Al 6 % anual: 72 ÷ 6 = unos 12 años."},{"en":"It works best for rates between 4% and 12%.","pt":"Funciona melhor para taxas entre 4% e 12%.","es":"Funciona mejor con tasas entre el 4 % y el 12 %."},{"en":"It also works backwards: inflation of 8% halves money's value in about 9 years.","pt":"Funciona ao contrário também: inflação de 8% corta o valor do dinheiro pela metade em uns 9 anos.","es":"También funciona al revés: una inflación del 8 % reduce a la mitad el valor del dinero en unos 9 años."}],"mission":{"model":"rule72","prompt":{"en":"Find the yearly rate at which money doubles in about **9 years**.","pt":"Ache a taxa anual com que o dinheiro dobra em cerca de **9 anos**.","es":"Encuentra la tasa anual con la que el dinero se duplica en unos **9 años**."},"hint":{"en":"72 ÷ 9.","pt":"72 ÷ 9.","es":"72 ÷ 9."}},"quiz":{"q":{"en":"Roughly how long to double at 12% a year?","pt":"Em quanto tempo, mais ou menos, o dinheiro dobra a 12% ao ano?","es":"¿Cuánto tarda, más o menos, en duplicarse al 12 % anual?"},"options":[{"en":"6 years","pt":"6 anos","es":"6 años"},{"en":"12 years","pt":"12 anos","es":"12 años"},{"en":"8 years","pt":"8 anos","es":"8 años"}],"answer":0,"explain":{"en":"72 ÷ 12 = 6.","pt":"72 ÷ 12 = 6.","es":"72 ÷ 12 = 6."}}},{"id":"early","track":"interest","mins":4,"title":{"en":"Start early","pt":"Comece cedo","es":"Empieza pronto"},"intro":{"en":"Ana invests 200 a month from 25 to 35 and then stops. Bruno starts at 35 and invests until 65. Who ends with more? Compound interest rewards the years more than the amounts.","pt":"Ana investe 200 por mês dos 25 aos 35 e para. Bruno começa aos 35 e investe até os 65. Quem termina com mais? Os juros compostos premiam mais os anos que os valores.","es":"Ana invierte 200 al mes de los 25 a los 35 y para. Bruno empieza a los 35 e invierte hasta los 65. ¿Quién acaba con más? El interés compuesto premia más los años que las cantidades."},"ideas":[{"en":"Money invested early has more years to compound.","pt":"Dinheiro investido cedo tem mais anos para render juros sobre juros.","es":"El dinero invertido pronto tiene más años para componer."},{"en":"Waiting 10 years can cost more than doubling the deposit later.","pt":"Esperar 10 anos pode custar mais do que dobrar o aporte depois.","es":"Esperar 10 años puede costar más que duplicar el aporte después."},{"en":"Small and regular beats large and late.","pt":"Pequeno e regular vence grande e tardio.","es":"Poco y constante gana a mucho y tarde."}],"mission":{"model":"early","prompt":{"en":"Both earn 8% a year. Ana put in 24,000 in total. Find the monthly deposit Bruno needs, from 35 to 65, to **match Ana at 65**.","pt":"Os dois rendem 8% ao ano. Ana aplicou 24.000 no total. Ache o depósito mensal que o Bruno precisa, dos 35 aos 65, para **igualar a Ana aos 65**.","es":"Los dos ganan un 8 % anual. Ana aportó 24.000 en total. Encuentra el depósito mensual que Bruno necesita, de los 35 a los 65, para **igualar a Ana a los 65**."},"hint":{"en":"It is more than 200, but not by as much as you might think. Then compare how much each one put in.","pt":"É mais que 200, mas não tanto quanto parece. Depois compare quanto cada um aplicou.","es":"Es más de 200, pero no tanto como parece. Luego compara cuánto aportó cada uno."}},"quiz":{"q":{"en":"Why does Ana's money keep growing after she stops?","pt":"Por que o dinheiro da Ana continua crescendo depois que ela para?","es":"¿Por qué el dinero de Ana sigue creciendo después de que deja de aportar?"},"options":[{"en":"Interest earns interest","pt":"Os juros rendem juros","es":"Los intereses generan intereses"},{"en":"She keeps depositing","pt":"Ela continua depositando","es":"Sigue depositando"},{"en":"Inflation","pt":"Inflação","es":"Inflación"}],"answer":0,"explain":{"en":"That is compounding: the balance keeps earning on its own growth.","pt":"Isso é composição: o saldo continua rendendo sobre o próprio crescimento.","es":"Eso es la composición: el saldo sigue rindiendo sobre su propio crecimiento."}}},{"id":"contrib","track":"interest","mins":4,"title":{"en":"Monthly deposits","pt":"Aportes mensais","es":"Aportes mensuales"},"intro":{"en":"Most people do not start with a big amount; they invest a bit every month. With compound interest, regular deposits grow faster than the sum of what you put in.","pt":"A maioria das pessoas não começa com muito dinheiro; investe um pouco todo mês. Com juros compostos, aportes regulares crescem mais rápido que a soma do que você coloca.","es":"La mayoría no empieza con mucho dinero; invierte un poco cada mes. Con interés compuesto, los aportes regulares crecen más rápido que la suma de lo que pones."},"ideas":[{"en":"Future value of deposits: FV = deposit × ((1 + i)ⁿ − 1) ÷ i.","pt":"Valor futuro dos aportes: VF = aporte × ((1 + i)ⁿ − 1) ÷ i.","es":"Valor futuro de los aportes: VF = aporte × ((1 + i)ⁿ − 1) ÷ i."},{"en":"Use a monthly rate with monthly deposits: 9% a year ≈ 0.72% a month.","pt":"Use taxa mensal com aportes mensais: 9% ao ano ≈ 0,72% ao mês.","es":"Usa tasa mensual con aportes mensuales: 9 % anual ≈ 0,72 % mensual."},{"en":"After a few years, interest becomes a big part of the balance.","pt":"Depois de alguns anos, os juros viram boa parte do saldo.","es":"Tras unos años, los intereses son una gran parte del saldo."}],"mission":{"model":"contrib","prompt":{"en":"At 9% a year, find the **smallest** monthly deposit (steps of 10) that reaches **100,000 in 10 years**.","pt":"A 9% ao ano, ache o **menor** aporte mensal (de 10 em 10) que chega a **100.000 em 10 anos**.","es":"Al 9 % anual, encuentra el aporte mensual **más pequeño** (de 10 en 10) que llega a **100.000 en 10 años**."},"hint":{"en":"Without interest you would need 834 a month. With interest it is far less: try around 500.","pt":"Sem juros você precisaria de 834 por mês. Com juros é bem menos: tente perto de 500.","es":"Sin intereses necesitarías 834 al mes. Con intereses es mucho menos: prueba alrededor de 500."}},"quiz":{"q":{"en":"Who earns more interest over 10 years?","pt":"Quem ganha mais juros em 10 anos?","es":"¿Quién gana más intereses en 10 años?"},"options":[{"en":"Someone who deposits monthly from year 1","pt":"Quem aporta todo mês desde o ano 1","es":"Quien aporta cada mes desde el año 1"},{"en":"Someone who deposits the same total in year 10","pt":"Quem aporta o mesmo total no ano 10","es":"Quien aporta el mismo total en el año 10"},{"en":"They earn the same","pt":"Ganham o mesmo","es":"Ganan lo mismo"}],"answer":0,"explain":{"en":"Earlier money stays invested longer, so it compounds more.","pt":"O dinheiro aplicado antes fica mais tempo investido e rende mais juros sobre juros.","es":"El dinero aportado antes está más tiempo invertido y compone más."}}},{"id":"card","track":"debt","mins":4,"title":{"en":"The credit card trap","pt":"A armadilha do cartão","es":"La trampa de la tarjeta"},"intro":{"en":"Revolving credit card debt is among the most expensive money there is. If your payment barely covers the interest, the debt never ends.","pt":"O rotativo do cartão de crédito está entre o dinheiro mais caro que existe. Se o pagamento mal cobre os juros, a dívida nunca acaba.","es":"La deuda revolvente de la tarjeta es de los dineros más caros que existen. Si el pago apenas cubre los intereses, la deuda no termina nunca."},"ideas":[{"en":"At 12% a month, a 2,000 debt costs 240 in interest in the first month alone.","pt":"A 12% ao mês, uma dívida de 2.000 custa 240 de juros só no primeiro mês.","es":"Al 12 % mensual, una deuda de 2.000 cuesta 240 de intereses solo el primer mes."},{"en":"Paying the minimum keeps you in the trap.","pt":"Pagar o mínimo mantém você na armadilha.","es":"Pagar el mínimo te mantiene en la trampa."},{"en":"Swapping it for a cheaper personal loan usually saves a lot.","pt":"Trocar por um empréstimo pessoal mais barato costuma economizar muito.","es":"Cambiarla por un préstamo personal más barato suele ahorrar mucho."}],"mission":{"model":"card","prompt":{"en":"A **2,000** card debt at **12% a month**. Find the **smallest** monthly payment (steps of 10) that clears it in **12 months or less**.","pt":"Uma dívida de **2.000** no cartão a **12% ao mês**. Ache o **menor** pagamento mensal (de 10 em 10) que a quita em **12 meses ou menos**.","es":"Una deuda de **2.000** en la tarjeta al **12 % mensual**. Encuentra el pago mensual **más pequeño** (de 10 en 10) que la liquida en **12 meses o menos**."},"hint":{"en":"At 260 it takes 23 months, because 240 of it is interest. Go up until it fits in 12.","pt":"Com 260 leva 23 meses, porque 240 disso são juros. Vá subindo até caber em 12.","es":"Con 260 tarda 23 meses, porque 240 son intereses. Ve subiendo hasta que quepa en 12."}},"quiz":{"q":{"en":"Your payment equals exactly the monthly interest. The debt…","pt":"Seu pagamento é igual aos juros do mês. A dívida…","es":"Tu pago es igual a los intereses del mes. La deuda…"},"options":[{"en":"stays the same forever","pt":"fica igual para sempre","es":"se queda igual para siempre"},{"en":"is paid off slowly","pt":"é quitada devagar","es":"se paga poco a poco"},{"en":"disappears","pt":"some","es":"desaparece"}],"answer":0,"explain":{"en":"You only pay the interest; the principal never goes down.","pt":"Você só paga os juros; o principal nunca diminui.","es":"Solo pagas intereses; el principal nunca baja."}},"note":{"en":"","pt":"**No Brasil:** o rotativo do cartão está entre os juros mais altos do mercado. Desde 2024, os juros e encargos do rotativo não podem passar de 100% do valor original da dívida, mas ainda assim é dívida a evitar.","es":""}},{"id":"cash","track":"debt","mins":4,"title":{"en":"'Interest-free' instalments","pt":"O 'parcelado sem juros'","es":"Las cuotas 'sin intereses'"},"intro":{"en":"Paying in instalments 'with no interest' still has a cost: the cash discount you give up. Compare in today's money, because your money could earn interest meanwhile.","pt":"Parcelar 'sem juros' ainda tem custo: o desconto à vista que você deixa de ganhar. Compare em dinheiro de hoje, porque seu dinheiro poderia render enquanto isso.","es":"Pagar a plazos 'sin intereses' sigue teniendo un coste: el descuento al contado al que renuncias. Compara en dinero de hoy, porque tu dinero podría rendir mientras tanto."},"ideas":[{"en":"Present value: what future payments are worth today.","pt":"Valor presente: quanto pagamentos futuros valem hoje.","es":"Valor presente: lo que valen hoy los pagos futuros."},{"en":"If your savings earn 1% a month, 12 × 100 is worth about 1,126 today, not 1,200.","pt":"Se seu dinheiro rende 1% ao mês, 12 × 100 valem uns 1.126 hoje, não 1.200.","es":"Si tu dinero rinde un 1 % mensual, 12 × 100 valen hoy unos 1.126, no 1.200."},{"en":"Always ask for the cash price before choosing.","pt":"Sempre pergunte o preço à vista antes de escolher.","es":"Pregunta siempre el precio al contado antes de elegir."}],"mission":{"model":"cash","prompt":{"en":"A 1,200 phone: 12 × 100 'interest-free' or a cash discount. Find the **smallest discount** (steps of 0.5%) that makes **paying cash the better deal**.","pt":"Um celular de 1.200: 12 × 100 'sem juros' ou desconto à vista. Ache o **menor desconto** (de 0,5 em 0,5%) que faz **pagar à vista valer mais a pena**.","es":"Un móvil de 1.200: 12 × 100 'sin intereses' o descuento al contado. Encuentra el **descuento más pequeño** (de 0,5 en 0,5 %) con el que **pagar al contado sale mejor**."},"hint":{"en":"The instalments are worth about 1,125.51 today. The cash price must be lower than that.","pt":"As parcelas valem cerca de 1.125,51 hoje. O preço à vista precisa ser menor que isso.","es":"Las cuotas valen hoy unos 1.125,51. El precio al contado debe ser menor."}},"quiz":{"q":{"en":"A shop offers 5% off for cash or 10 'interest-free' instalments. Your money earns nothing. Which is better?","pt":"Uma loja oferece 5% de desconto à vista ou 10× 'sem juros'. Seu dinheiro não rende nada. O que é melhor?","es":"Una tienda ofrece un 5 % de descuento al contado o 10 cuotas 'sin intereses'. Tu dinero no rinde nada. ¿Qué es mejor?"},"options":[{"en":"Cash","pt":"À vista","es":"Al contado"},{"en":"Instalments","pt":"Parcelado","es":"A plazos"},{"en":"Exactly the same","pt":"Exatamente igual","es":"Exactamente igual"}],"answer":0,"explain":{"en":"If money earns nothing, any discount wins.","pt":"Se o dinheiro não rende nada, qualquer desconto vence.","es":"Si el dinero no rinde nada, cualquier descuento gana."}}},{"id":"cet","track":"debt","mins":4,"title":{"en":"The true cost of a loan","pt":"O custo real de um empréstimo","es":"El coste real de un préstamo"},"intro":{"en":"The advertised rate is not the whole story. Fees, insurance and charges raise the real cost. The total effective cost puts everything into one yearly rate you can compare.","pt":"A taxa anunciada não conta tudo. Tarifas, seguros e encargos aumentam o custo real. O custo efetivo total (CET) junta tudo numa taxa anual que dá para comparar.","es":"La tasa anunciada no lo cuenta todo. Comisiones, seguros y cargos elevan el coste real. La TAE reúne todo en una tasa anual comparable."},"ideas":[{"en":"Compare offers by total cost, not by the monthly rate alone.","pt":"Compare ofertas pelo custo total, não só pela taxa mensal.","es":"Compara ofertas por el coste total, no solo por la tasa mensual."},{"en":"An upfront fee means you receive less money but repay the same.","pt":"Uma tarifa na contratação faz você receber menos dinheiro e pagar o mesmo.","es":"Una comisión inicial hace que recibas menos dinero y devuelvas lo mismo."},{"en":"Monthly to yearly: (1 + monthly)¹² − 1. 2% a month is about 26.8% a year.","pt":"De mensal para anual: (1 + mensal)¹² − 1. 2% ao mês dá cerca de 26,8% ao ano.","es":"De mensual a anual: (1 + mensual)¹² − 1. Un 2 % mensual es aproximadamente un 26,8 % anual."}],"mission":{"model":"cet","prompt":{"en":"Two offers for a **10,000** loan in **12 payments**. Which one is really cheaper?","pt":"Duas ofertas de empréstimo de **10.000** em **12 parcelas**. Qual é realmente mais barata?","es":"Dos ofertas de préstamo de **10.000** en **12 cuotas**. ¿Cuál es realmente más barata?"},"hint":{"en":"Look at the last line of the table, not the first.","pt":"Olhe a última linha da tabela, não a primeira.","es":"Mira la última fila de la tabla, no la primera."}},"quiz":{"q":{"en":"Why can a lower rate end up more expensive?","pt":"Por que uma taxa menor pode sair mais cara?","es":"¿Por qué una tasa menor puede salir más cara?"},"options":[{"en":"Fees and charges add to the cost","pt":"Tarifas e encargos somam ao custo","es":"Las comisiones y cargos se suman al coste"},{"en":"Rates are always wrong","pt":"Taxas sempre estão erradas","es":"Las tasas siempre están mal"},{"en":"It cannot","pt":"Não pode","es":"No puede"}],"answer":0,"explain":{"en":"The total effective cost includes fees; that is why it is the number to compare.","pt":"O custo efetivo total inclui as tarifas; por isso é o número a comparar.","es":"El coste efectivo incluye las comisiones; por eso es la cifra a comparar."}},"note":{"en":"","pt":"**No Brasil:** os bancos são obrigados a informar o **CET** (Custo Efetivo Total) antes da contratação. É ele que deve ser comparado, não a taxa de juros anunciada.","es":""}},{"id":"sac","track":"debt","mins":5,"title":{"en":"Price vs SAC","pt":"Price contra SAC","es":"Sistema francés frente a alemán"},"intro":{"en":"Long loans such as mortgages are repaid with one of two systems. Price keeps the payment fixed; SAC repays the same share of the principal each month, so payments start higher and fall.","pt":"Financiamentos longos, como o de imóveis, são pagos por um de dois sistemas. Na tabela Price a parcela é fixa; no SAC a amortização é igual todo mês, então a parcela começa maior e vai caindo.","es":"Los préstamos largos, como las hipotecas, se devuelven con uno de dos sistemas. En el francés la cuota es fija; en el alemán (SAC) se amortiza lo mismo cada mes, así que la cuota empieza más alta y baja."},"ideas":[{"en":"Price: early payments are mostly interest.","pt":"Price: as primeiras parcelas são quase só juros.","es":"Francés: las primeras cuotas son casi todo intereses."},{"en":"SAC: the balance falls faster, so less interest is paid in total.","pt":"SAC: o saldo cai mais rápido, então se paga menos juros no total.","es":"Alemán: el saldo baja más rápido, así que se pagan menos intereses en total."},{"en":"Price fits a tight budget at the start; SAC costs less overall.","pt":"Price cabe melhor num orçamento apertado no início; SAC custa menos no total.","es":"El francés encaja mejor en un presupuesto ajustado al principio; el alemán cuesta menos en total."}],"mission":{"model":"sac","prompt":{"en":"A **100,000** loan over **120 months** at **1% a month**. Which system pays **less interest in total**?","pt":"Um financiamento de **100.000** em **120 meses** a **1% ao mês**. Qual sistema paga **menos juros no total**?","es":"Un préstamo de **100.000** a **120 meses** al **1 % mensual**. ¿Qué sistema paga **menos intereses en total**?"},"hint":{"en":"Compare the 'Total interest' line.","pt":"Compare a linha 'Juros totais'.","es":"Compara la fila 'Intereses totales'."}},"quiz":{"q":{"en":"In SAC, what happens to the payment over time?","pt":"No SAC, o que acontece com a parcela ao longo do tempo?","es":"En el sistema alemán, ¿qué pasa con la cuota con el tiempo?"},"options":[{"en":"It falls","pt":"Cai","es":"Baja"},{"en":"It stays fixed","pt":"Fica fixa","es":"Se mantiene"},{"en":"It rises","pt":"Sobe","es":"Sube"}],"answer":0,"explain":{"en":"Amortisation is fixed and the interest falls with the balance, so each payment is smaller than the last.","pt":"A amortização é fixa e os juros caem com o saldo, então cada parcela é menor que a anterior.","es":"La amortización es fija y los intereses bajan con el saldo, así que cada cuota es menor que la anterior."}}},{"id":"power","track":"inflation","mins":3,"title":{"en":"Purchasing power","pt":"Poder de compra","es":"Poder adquisitivo"},"intro":{"en":"Inflation is the general rise in prices. The same note buys less every year, so money kept still loses value even though the number does not change.","pt":"Inflação é a alta geral dos preços. A mesma nota compra menos a cada ano, então dinheiro parado perde valor mesmo sem o número mudar.","es":"La inflación es la subida general de los precios. El mismo billete compra menos cada año, así que el dinero quieto pierde valor aunque la cifra no cambie."},"ideas":[{"en":"Real value = amount ÷ (1 + inflation)ʸᵉᵃʳˢ.","pt":"Valor real = valor ÷ (1 + inflação)ᵃⁿᵒˢ.","es":"Valor real = importe ÷ (1 + inflación)ᵃñᵒˢ."},{"en":"The rule of 72 works here too: 72 ÷ inflation = years to halve.","pt":"A regra do 72 vale aqui também: 72 ÷ inflação = anos para cair pela metade.","es":"La regla del 72 también vale aquí: 72 ÷ inflación = años para reducirse a la mitad."},{"en":"Cash under the mattress has a real return equal to minus inflation.","pt":"Dinheiro no colchão tem rendimento real igual a menos a inflação.","es":"El dinero bajo el colchón tiene una rentabilidad real igual a menos la inflación."}],"mission":{"model":"power","prompt":{"en":"Find the **lowest** yearly inflation (steps of 0.1%) at which 1,000 loses **half its purchasing power in 10 years**.","pt":"Ache a **menor** inflação anual (de 0,1 em 0,1%) com que 1.000 perde **metade do poder de compra em 10 anos**.","es":"Encuentra la inflación anual **más baja** (de 0,1 en 0,1 %) con la que 1.000 pierde **la mitad de su poder adquisitivo en 10 años**."},"hint":{"en":"The rule of 72 says about 7.2%.","pt":"A regra do 72 diz cerca de 7,2%.","es":"La regla del 72 dice alrededor del 7,2 %."}},"quiz":{"q":{"en":"Prices rose 10% and your salary did not change. Your purchasing power…","pt":"Os preços subiram 10% e seu salário não mudou. Seu poder de compra…","es":"Los precios subieron un 10 % y tu salario no cambió. Tu poder adquisitivo…"},"options":[{"en":"fell about 9%","pt":"caiu cerca de 9%","es":"bajó alrededor de un 9 %"},{"en":"fell exactly 10%","pt":"caiu exatamente 10%","es":"bajó exactamente un 10 %"},{"en":"stayed the same","pt":"ficou igual","es":"se mantuvo"}],"answer":0,"explain":{"en":"1 ÷ 1.10 = 0.909, a loss of about 9.1%.","pt":"1 ÷ 1,10 = 0,909, uma perda de cerca de 9,1%.","es":"1 ÷ 1,10 = 0,909, una pérdida de alrededor del 9,1 %."}}},{"id":"real","track":"inflation","mins":3,"title":{"en":"Real returns","pt":"Rendimento real","es":"Rentabilidad real"},"intro":{"en":"A return only makes you richer if it beats inflation. The real return is what is left after discounting the rise in prices.","pt":"Um rendimento só deixa você mais rico se vencer a inflação. O rendimento real é o que sobra depois de descontar a alta dos preços.","es":"Una rentabilidad solo te hace más rico si supera la inflación. La rentabilidad real es lo que queda tras descontar la subida de precios."},"ideas":[{"en":"Real = (1 + nominal) ÷ (1 + inflation) − 1.","pt":"Real = (1 + nominal) ÷ (1 + inflação) − 1.","es":"Real = (1 + nominal) ÷ (1 + inflación) − 1."},{"en":"Quick estimate: nominal minus inflation.","pt":"Estimativa rápida: nominal menos inflação.","es":"Estimación rápida: nominal menos inflación."},{"en":"Compare investments by their real return, especially over many years.","pt":"Compare investimentos pelo rendimento real, principalmente em muitos anos.","es":"Compara inversiones por su rentabilidad real, sobre todo a muchos años."}],"mission":{"model":"real","prompt":{"en":"Your savings pay **6% a year**. Find the **lowest** inflation (steps of 0.1%) at which your **real return turns negative**.","pt":"Sua aplicação paga **6% ao ano**. Ache a **menor** inflação (de 0,1 em 0,1%) com que seu **rendimento real fica negativo**.","es":"Tu ahorro rinde un **6 % anual**. Encuentra la inflación **más baja** (de 0,1 en 0,1 %) con la que tu **rentabilidad real se vuelve negativa**."},"hint":{"en":"Just above 6%.","pt":"Logo acima de 6%.","es":"Justo por encima del 6 %."}},"quiz":{"q":{"en":"Nominal 10%, inflation 4%. Real return is about…","pt":"Nominal 10%, inflação 4%. O rendimento real é de cerca de…","es":"Nominal 10 %, inflación 4 %. La rentabilidad real es de unos…"},"options":["5.8%","14%","6.5%"],"answer":0,"explain":{"en":"1.10 ÷ 1.04 − 1 = 5.77%.","pt":"1,10 ÷ 1,04 − 1 = 5,77%.","es":"1,10 ÷ 1,04 − 1 = 5,77 %."}},"note":{"en":"","pt":"**No Brasil:** o Tesouro IPCA+ paga uma taxa real acima da inflação medida pelo IPCA, o que protege o poder de compra no longo prazo.","es":""}},{"id":"basket","track":"inflation","mins":4,"title":{"en":"Price indexes","pt":"Índices de preços","es":"Índices de precios"},"intro":{"en":"Inflation is measured with a basket of goods and services that a typical family buys. Compare the basket's cost in two periods and you get the inflation rate.","pt":"A inflação é medida com uma cesta de bens e serviços que uma família típica compra. Compare o custo da cesta em dois períodos e você tem a taxa de inflação.","es":"La inflación se mide con una cesta de bienes y servicios que compra una familia típica. Compara el coste de la cesta en dos periodos y obtienes la tasa de inflación."},"ideas":[{"en":"Inflation = (cost now ÷ cost before − 1) × 100.","pt":"Inflação = (custo agora ÷ custo antes − 1) × 100.","es":"Inflación = (coste ahora ÷ coste antes − 1) × 100."},{"en":"Official indexes weigh hundreds of items by how much families spend on each.","pt":"Índices oficiais pesam centenas de itens pelo quanto as famílias gastam em cada um.","es":"Los índices oficiales ponderan cientos de productos según lo que gastan las familias en cada uno."},{"en":"Your personal inflation can differ from the official number.","pt":"A sua inflação pessoal pode ser diferente da oficial.","es":"Tu inflación personal puede ser distinta de la oficial."}],"mission":{"model":"basket","prompt":{"en":"Add up the basket in both years and type the **inflation of this basket**, in % (one decimal).","pt":"Some a cesta nos dois anos e digite a **inflação desta cesta**, em % (uma casa decimal).","es":"Suma la cesta en los dos años y escribe la **inflación de esta cesta**, en % (un decimal)."},"hint":{"en":"Last year: 58. This year: 66. Then 66 ÷ 58 − 1.","pt":"Ano passado: 58. Este ano: 66. Depois 66 ÷ 58 − 1.","es":"Año pasado: 58. Este año: 66. Después 66 ÷ 58 − 1."}},"quiz":{"q":{"en":"A basket cost 200 and now costs 210. Inflation?","pt":"Uma cesta custava 200 e agora custa 210. Inflação?","es":"Una cesta costaba 200 y ahora cuesta 210. ¿Inflación?"},"options":["5%","10%","2.1%"],"answer":0,"explain":{"en":"210 ÷ 200 − 1 = 5%.","pt":"210 ÷ 200 − 1 = 5%.","es":"210 ÷ 200 − 1 = 5 %."}},"note":{"en":"","pt":"**No Brasil:** o índice oficial de inflação é o **IPCA**, calculado pelo IBGE. A meta de inflação é definida pelo Conselho Monetário Nacional.","es":""}},{"id":"salary","track":"inflation","mins":3,"title":{"en":"Your real salary","pt":"Seu salário real","es":"Tu salario real"},"intro":{"en":"A raise smaller than inflation is a pay cut in disguise. What matters is how much your salary buys, not the number on the payslip.","pt":"Um aumento menor que a inflação é uma redução disfarçada. O que importa é quanto o salário compra, não o número no holerite.","es":"Una subida menor que la inflación es un recorte disfrazado. Lo que importa es cuánto compra tu salario, no la cifra de la nómina."},"ideas":[{"en":"Real change = (1 + raise) ÷ (1 + inflation) − 1.","pt":"Variação real = (1 + aumento) ÷ (1 + inflação) − 1.","es":"Variación real = (1 + subida) ÷ (1 + inflación) − 1."},{"en":"A 5% raise with 8% inflation loses purchasing power.","pt":"Um aumento de 5% com inflação de 8% perde poder de compra.","es":"Una subida del 5 % con inflación del 8 % pierde poder adquisitivo."},{"en":"Use this when negotiating: talk in real terms.","pt":"Use isso ao negociar: fale em termos reais.","es":"Úsalo al negociar: habla en términos reales."}],"mission":{"model":"salary","prompt":{"en":"The salary went from **3,000** to **3,150** while inflation was **8%**. Type the **real change** in purchasing power, in % (negative if it fell).","pt":"O salário foi de **3.000** para **3.150** e a inflação foi de **8%**. Digite a **variação real** do poder de compra, em % (negativa se caiu).","es":"El salario pasó de **3.000** a **3.150** y la inflación fue del **8 %**. Escribe la **variación real** del poder adquisitivo, en % (negativa si bajó)."},"hint":{"en":"1.05 ÷ 1.08 − 1.","pt":"1,05 ÷ 1,08 − 1.","es":"1,05 ÷ 1,08 − 1."}},"quiz":{"q":{"en":"Raise 6%, inflation 6%. Real change?","pt":"Aumento de 6%, inflação de 6%. Variação real?","es":"Subida del 6 %, inflación del 6 %. ¿Variación real?"},"options":["0%","12%","−6%"],"answer":0,"explain":{"en":"The salary buys exactly what it bought before.","pt":"O salário compra exatamente o mesmo que antes.","es":"El salario compra exactamente lo mismo que antes."}}},{"id":"fixed","track":"invest","mins":4,"title":{"en":"Fixed income and taxes","pt":"Renda fixa e impostos","es":"Renta fija e impuestos"},"intro":{"en":"Fixed-income investments pay a known rate. When comparing them, look at the return after tax: a tax-free product can lose to a taxed one that pays more.","pt":"Investimentos de renda fixa pagam uma taxa conhecida. Ao comparar, olhe o rendimento depois do imposto: um produto isento pode perder para um tributado que paga mais.","es":"Las inversiones de renta fija pagan una tasa conocida. Al compararlas, mira la rentabilidad después de impuestos: un producto exento puede perder frente a uno con impuestos que pague más."},"ideas":[{"en":"Tax usually applies only to the gain, not to the money you put in.","pt":"O imposto geralmente incide só sobre o ganho, não sobre o dinheiro aplicado.","es":"El impuesto suele aplicarse solo a la ganancia, no al dinero aportado."},{"en":"Compare net returns over the same period.","pt":"Compare os rendimentos líquidos no mesmo prazo.","es":"Compara rentabilidades netas en el mismo plazo."},{"en":"Check the issuer's safety and any deposit guarantee.","pt":"Confira a segurança do emissor e se há garantia.","es":"Comprueba la solvencia del emisor y si hay garantía de depósitos."}],"mission":{"model":"fixed","prompt":{"en":"You will invest **10,000** for **2 years**. Which product leaves **more money after tax**?","pt":"Você vai aplicar **10.000** por **2 anos**. Qual produto deixa **mais dinheiro depois do imposto**?","es":"Vas a invertir **10.000** durante **2 años**. ¿Qué producto deja **más dinero después de impuestos**?"},"hint":{"en":"Compare the last line of the table.","pt":"Compare a última linha da tabela.","es":"Compara la última fila de la tabla."}},"quiz":{"q":{"en":"Tax of 15% on the gain. You invested 1,000 and it became 1,200. Tax due?","pt":"Imposto de 15% sobre o ganho. Você aplicou 1.000 e virou 1.200. Imposto devido?","es":"Impuesto del 15 % sobre la ganancia. Invertiste 1.000 y se convirtió en 1.200. ¿Impuesto a pagar?"},"options":["30","180","150"],"answer":0,"explain":{"en":"The gain is 200; 15% of 200 is 30.","pt":"O ganho é 200; 15% de 200 é 30.","es":"La ganancia es 200; el 15 % de 200 es 30."}},"note":{"en":"","pt":"**No Brasil:** CDB, LCI, LCA e Tesouro seguem regras diferentes. CDB e Tesouro pagam IR regressivo sobre o ganho (22,5% até 6 meses, caindo até 15% acima de 2 anos); LCI e LCA são isentas para pessoa física. CDB, LCI e LCA têm garantia do FGC até R$ 250 mil por instituição.","es":""}},{"id":"risk","track":"invest","mins":5,"title":{"en":"Risk and return","pt":"Risco e retorno","es":"Riesgo y rentabilidad"},"intro":{"en":"Higher expected returns come with bigger swings. Over 20 years, a portfolio full of stocks has the best typical result but also the widest range of outcomes.","pt":"Retornos esperados maiores vêm com oscilações maiores. Em 20 anos, uma carteira só de ações tem o melhor resultado típico, mas também a maior variação de resultados.","es":"Rentabilidades esperadas mayores vienen con oscilaciones mayores. En 20 años, una cartera solo de acciones tiene el mejor resultado típico, pero también el abanico más amplio."},"ideas":[{"en":"The simulation runs 400 possible 20-year paths for 10,000 invested.","pt":"A simulação roda 400 caminhos possíveis de 20 anos para 10.000 investidos.","es":"La simulación recorre 400 caminos posibles de 20 años para 10.000 invertidos."},{"en":"Look at the bad case, not just the typical one.","pt":"Olhe o cenário ruim, não só o típico.","es":"Mira el escenario malo, no solo el típico."},{"en":"Mixing assets changes the shape of the outcomes, not just the average.","pt":"Misturar ativos muda o formato dos resultados, não só a média.","es":"Combinar activos cambia la forma de los resultados, no solo la media."}],"mission":{"model":"risk","prompt":{"en":"Choose the share in stocks with the **highest typical result** while the **bad case stays at 20,000 or more**.","pt":"Escolha a parcela em ações com o **maior resultado típico** em que o **cenário ruim continua em 20.000 ou mais**.","es":"Elige la parte en acciones con el **mejor resultado típico** en la que el **escenario malo se mantiene en 20.000 o más**."},"hint":{"en":"Go down from 100% and stop at the first mix where the bad case is back above 20,000.","pt":"Desça a partir de 100% e pare na primeira mistura em que o cenário ruim volta a ficar acima de 20.000.","es":"Baja desde el 100 % y para en la primera mezcla en que el escenario malo vuelve a superar 20.000."}},"quiz":{"q":{"en":"Why not always choose 100% stocks?","pt":"Por que não escolher sempre 100% em ações?","es":"¿Por qué no elegir siempre 100 % en acciones?"},"options":[{"en":"The bad outcomes are much worse","pt":"Os resultados ruins são bem piores","es":"Los malos resultados son mucho peores"},{"en":"Stocks always lose","pt":"Ações sempre perdem","es":"Las acciones siempre pierden"},{"en":"Bonds always win","pt":"Renda fixa sempre ganha","es":"La renta fija siempre gana"}],"answer":0,"explain":{"en":"The typical result is higher, but you may need the money in a bad stretch. Your mix depends on your time and stomach for risk.","pt":"O resultado típico é maior, mas você pode precisar do dinheiro num período ruim. A mistura depende do seu prazo e da sua tolerância a risco.","es":"El resultado típico es mayor, pero puedes necesitar el dinero en una mala racha. La mezcla depende de tu plazo y tu tolerancia al riesgo."}}},{"id":"divers","track":"invest","mins":4,"title":{"en":"Diversification","pt":"Diversificação","es":"Diversificación"},"intro":{"en":"Combining assets that do not move together lowers the swings of the whole portfolio, without lowering the expected return. It is the closest thing to a free lunch in finance.","pt":"Combinar ativos que não se movem juntos reduz as oscilações da carteira toda sem reduzir o retorno esperado. É o mais perto de um almoço grátis nas finanças.","es":"Combinar activos que no se mueven juntos reduce las oscilaciones de toda la cartera sin reducir la rentabilidad esperada. Es lo más parecido a una comida gratis en finanzas."},"ideas":[{"en":"Correlation goes from −1 (opposite moves) to +1 (identical moves).","pt":"Correlação vai de −1 (movimentos opostos) a +1 (movimentos iguais).","es":"La correlación va de −1 (movimientos opuestos) a +1 (movimientos idénticos)."},{"en":"Two assets with correlation +1 give no diversification at all.","pt":"Dois ativos com correlação +1 não diversificam nada.","es":"Dos activos con correlación +1 no diversifican nada."},{"en":"Spread across asset types, sectors and countries.","pt":"Espalhe entre tipos de ativo, setores e países.","es":"Reparte entre tipos de activo, sectores y países."}],"mission":{"model":"divers","prompt":{"en":"Two assets, each with **20%** volatility, 50/50. Find a correlation that brings the portfolio's volatility to **12% or less**.","pt":"Dois ativos, cada um com **20%** de volatilidade, 50/50. Ache uma correlação que leve a volatilidade da carteira a **12% ou menos**.","es":"Dos activos, cada uno con un **20 %** de volatilidad, 50/50. Encuentra una correlación que lleve la volatilidad de la cartera al **12 % o menos**."},"hint":{"en":"Lower the correlation below about 0.4.","pt":"Baixe a correlação para menos de 0,4, mais ou menos.","es":"Baja la correlación por debajo de 0,4, más o menos."}},"quiz":{"q":{"en":"Which pair diversifies best?","pt":"Qual par diversifica melhor?","es":"¿Qué par diversifica mejor?"},"options":[{"en":"Correlation −0.2","pt":"Correlação −0,2","es":"Correlación −0,2"},{"en":"Correlation 0.9","pt":"Correlação 0,9","es":"Correlación 0,9"},{"en":"Correlation 1","pt":"Correlação 1","es":"Correlación 1"}],"answer":0,"explain":{"en":"The lower the correlation, the more the swings cancel out.","pt":"Quanto menor a correlação, mais as oscilações se compensam.","es":"Cuanto menor es la correlación, más se compensan las oscilaciones."}}},{"id":"fees","track":"invest","mins":4,"title":{"en":"Fees eat returns","pt":"Taxas comem o rendimento","es":"Las comisiones se comen la rentabilidad"},"intro":{"en":"A yearly fee of 1% or 2% looks small, but it is charged every year on the whole balance. Over decades it can take a large part of your result.","pt":"Uma taxa anual de 1% ou 2% parece pequena, mas é cobrada todo ano sobre o saldo inteiro. Em décadas, pode levar boa parte do seu resultado.","es":"Una comisión anual del 1 % o 2 % parece pequeña, pero se cobra cada año sobre todo el saldo. En décadas puede llevarse buena parte de tu resultado."},"ideas":[{"en":"Fees compound against you, the same way returns compound for you.","pt":"Taxas se compõem contra você, do mesmo jeito que os juros a seu favor.","es":"Las comisiones componen en tu contra, igual que la rentabilidad a tu favor."},{"en":"Compare total costs before choosing a fund.","pt":"Compare os custos totais antes de escolher um fundo.","es":"Compara los costes totales antes de elegir un fondo."},{"en":"Low-cost index funds keep more of the return with you.","pt":"Fundos de índice de baixo custo deixam mais rendimento com você.","es":"Los fondos indexados de bajo coste te dejan más rentabilidad."}],"mission":{"model":"fees","prompt":{"en":"10,000 invested for **30 years** at **8%** before fees. Find the **highest fee** (steps of 0.1%) that still leaves you **at least 80%** of the no-fee result.","pt":"10.000 investidos por **30 anos** a **8%** antes das taxas. Ache a **maior taxa** (de 0,1 em 0,1%) que ainda deixa **pelo menos 80%** do resultado sem taxa.","es":"10.000 invertidos **30 años** al **8 %** antes de comisiones. Encuentra la **comisión más alta** (de 0,1 en 0,1 %) que aún te deja **al menos el 80 %** del resultado sin comisión."},"hint":{"en":"It is under 1%.","pt":"É menos de 1%.","es":"Es menos del 1 %."}},"quiz":{"q":{"en":"A 2% yearly fee over 30 years takes roughly…","pt":"Uma taxa de 2% ao ano por 30 anos leva mais ou menos…","es":"Una comisión del 2 % anual durante 30 años se lleva más o menos…"},"options":[{"en":"40% of the final value","pt":"40% do valor final","es":"el 40 % del valor final"},{"en":"2% of the final value","pt":"2% do valor final","es":"el 2 % del valor final"},{"en":"60% of the gains only once","pt":"60% dos ganhos uma única vez","es":"el 60 % de las ganancias una sola vez"}],"answer":0,"explain":{"en":"(1.06 ÷ 1.08)³⁰ ≈ 0.57: you keep about 57%, so the fee takes about 43%.","pt":"(1,06 ÷ 1,08)³⁰ ≈ 0,57: você fica com cerca de 57%, então a taxa leva cerca de 43%.","es":"(1,06 ÷ 1,08)³⁰ ≈ 0,57: te quedas con un 57 %, así que la comisión se lleva un 43 %."}}},{"id":"fourpct","track":"plan","mins":4,"title":{"en":"Your retirement number","pt":"Seu número da aposentadoria","es":"Tu cifra de jubilación"},"intro":{"en":"How much do you need to stop working? A popular rule of thumb: you can withdraw about 4% of your savings each year, so you need about 25 times your yearly spending.","pt":"Quanto você precisa para parar de trabalhar? Uma regra de bolso popular: dá para sacar cerca de 4% do patrimônio por ano, então você precisa de umas 25 vezes o gasto anual.","es":"¿Cuánto necesitas para dejar de trabajar? Una regla popular: puedes retirar alrededor de un 4 % de tus ahorros al año, así que necesitas unas 25 veces tu gasto anual."},"ideas":[{"en":"Number = yearly spending ÷ 0.04 = yearly spending × 25.","pt":"Número = gasto anual ÷ 0,04 = gasto anual × 25.","es":"Cifra = gasto anual ÷ 0,04 = gasto anual × 25."},{"en":"It is a rough guide based on past markets, not a guarantee.","pt":"É uma referência aproximada baseada em mercados passados, não uma garantia.","es":"Es una guía aproximada basada en mercados pasados, no una garantía."},{"en":"Public pensions and other income reduce the number you need.","pt":"Aposentadoria pública e outras rendas reduzem o número necessário.","es":"Las pensiones públicas y otros ingresos reducen la cifra necesaria."}],"mission":{"model":"fourpct","prompt":{"en":"You want **5,000 a month** of income. Using the 4% rule, type how much capital you need.","pt":"Você quer **5.000 por mês** de renda. Pela regra dos 4%, digite quanto patrimônio você precisa.","es":"Quieres **5.000 al mes** de ingresos. Con la regla del 4 %, escribe cuánto capital necesitas."},"hint":{"en":"5,000 × 12 = 60,000 a year; then ÷ 0.04.","pt":"5.000 × 12 = 60.000 por ano; depois ÷ 0,04.","es":"5.000 × 12 = 60.000 al año; luego ÷ 0,04."}},"quiz":{"q":{"en":"You spend 40,000 a year. Rough retirement number?","pt":"Você gasta 40.000 por ano. Número aproximado da aposentadoria?","es":"Gastas 40.000 al año. ¿Cifra aproximada de jubilación?"},"options":["1,000,000","400,000","160,000"],"answer":0,"explain":{"en":"40,000 × 25 = 1,000,000.","pt":"40.000 × 25 = 1.000.000.","es":"40.000 × 25 = 1.000.000."}}},{"id":"retire","track":"plan","mins":4,"title":{"en":"The monthly plan","pt":"O plano mensal","es":"El plan mensual"},"intro":{"en":"Once you know the number, work backwards: how much must you invest each month, at a realistic return, to reach it by your retirement age?","pt":"Sabendo o número, faça a conta ao contrário: quanto precisa investir por mês, com um rendimento realista, para chegar lá na idade de se aposentar?","es":"Con la cifra clara, calcula al revés: ¿cuánto debes invertir cada mes, con una rentabilidad realista, para alcanzarla a tu edad de jubilación?"},"ideas":[{"en":"Use a real return (above inflation) so the target stays in today's money.","pt":"Use rendimento real (acima da inflação) para a meta ficar em dinheiro de hoje.","es":"Usa una rentabilidad real (por encima de la inflación) para que el objetivo quede en dinero de hoy."},{"en":"Required deposit = target × i ÷ ((1 + i)ⁿ − 1).","pt":"Aporte necessário = meta × i ÷ ((1 + i)ⁿ − 1).","es":"Aporte necesario = objetivo × i ÷ ((1 + i)ⁿ − 1)."},{"en":"Review the plan every year and raise deposits with your salary.","pt":"Revise o plano todo ano e aumente os aportes junto com o salário.","es":"Revisa el plan cada año y sube los aportes con tu salario."}],"mission":{"model":"retire","prompt":{"en":"You are **30** and want **1,000,000** (in today's money) at **65**, earning **6% a year above inflation**. Find the **smallest** monthly deposit (steps of 25).","pt":"Você tem **30** anos e quer **1.000.000** (em dinheiro de hoje) aos **65**, rendendo **6% ao ano acima da inflação**. Ache o **menor** aporte mensal (de 25 em 25).","es":"Tienes **30** años y quieres **1.000.000** (en dinero de hoy) a los **65**, ganando un **6 % anual por encima de la inflación**. Encuentra el aporte mensual **más pequeño** (de 25 en 25)."},"hint":{"en":"It is between 700 and 800.","pt":"Fica entre 700 e 800.","es":"Está entre 700 y 800."}},"quiz":{"q":{"en":"If you start at 40 instead of 30, the monthly deposit…","pt":"Se começar aos 40 em vez de 30, o aporte mensal…","es":"Si empiezas a los 40 en lugar de a los 30, el aporte mensual…"},"options":[{"en":"more than doubles","pt":"mais que dobra","es":"más que se duplica"},{"en":"rises about 30%","pt":"sobe uns 30%","es":"sube un 30 %"},{"en":"stays the same","pt":"fica igual","es":"se mantiene"}],"answer":0,"explain":{"en":"With 25 years instead of 35, compounding has much less time: the deposit goes from about 730 to about 1,480.","pt":"Com 25 anos em vez de 35, a composição tem muito menos tempo: o aporte vai de uns 730 para uns 1.480.","es":"Con 25 años en lugar de 35, la composición tiene mucho menos tiempo: el aporte pasa de unos 730 a unos 1.480."}}},{"id":"bias","track":"plan","mins":3,"title":{"en":"Money and the mind","pt":"Dinheiro e a mente","es":"El dinero y la mente"},"intro":{"en":"Most money mistakes are behavioural, not mathematical. Knowing the common biases helps you build rules that protect you from yourself.","pt":"A maioria dos erros com dinheiro é de comportamento, não de matemática. Conhecer os vieses mais comuns ajuda a criar regras que protegem você de você mesmo.","es":"La mayoría de errores con el dinero son de comportamiento, no de matemáticas. Conocer los sesgos habituales ayuda a crear reglas que te protejan de ti mismo."},"ideas":[{"en":"Recency bias: expecting the recent past to continue.","pt":"Viés de recência: achar que o passado recente vai continuar.","es":"Sesgo de recencia: esperar que el pasado reciente continúe."},{"en":"Loss aversion: losses hurt about twice as much as equal gains feel good.","pt":"Aversão à perda: perdas doem cerca de duas vezes mais do que ganhos iguais agradam.","es":"Aversión a la pérdida: las pérdidas duelen el doble de lo que alegran las ganancias iguales."},{"en":"Herd behaviour: buying because everyone else is buying.","pt":"Efeito manada: comprar porque todo mundo está comprando.","es":"Efecto rebaño: comprar porque todo el mundo compra."}],"mission":{"model":"bias","prompt":{"en":"A fund **rose 40% last year**. What does that tell you about next year?","pt":"Um fundo **subiu 40% no ano passado**. O que isso diz sobre o próximo ano?","es":"Un fondo **subió un 40 % el año pasado**. ¿Qué te dice eso sobre el año que viene?"},"hint":{"en":"Think about recency bias.","pt":"Pense no viés de recência.","es":"Piensa en el sesgo de recencia."}},"quiz":{"q":{"en":"Which rule best protects against panic selling?","pt":"Qual regra protege melhor contra vender em pânico?","es":"¿Qué regla protege mejor contra vender por pánico?"},"options":[{"en":"A written plan with automatic monthly investing","pt":"Um plano escrito com investimento mensal automático","es":"Un plan escrito con inversión mensual automática"},{"en":"Checking prices every hour","pt":"Olhar os preços toda hora","es":"Mirar los precios cada hora"},{"en":"Following tips from social media","pt":"Seguir dicas de redes sociais","es":"Seguir consejos de redes sociales"}],"answer":0,"explain":{"en":"Automatic, rule-based decisions remove the emotional moment where mistakes happen.","pt":"Decisões automáticas e baseadas em regras eliminam o momento emocional em que os erros acontecem.","es":"Las decisiones automáticas y basadas en reglas eliminan el momento emocional en que ocurren los errores."}}},{"id":"plan","track":"plan","mins":5,"title":{"en":"Your plan","pt":"Seu plano","es":"Tu plan"},"intro":{"en":"Put it all together: spend less than you earn, keep an emergency fund, kill expensive debt, invest regularly at low cost, and let time do the rest.","pt":"Junte tudo: gaste menos do que ganha, mantenha a reserva de emergência, elimine dívidas caras, invista com regularidade e baixo custo, e deixe o tempo fazer o resto.","es":"Júntalo todo: gasta menos de lo que ganas, mantén un fondo de emergencia, elimina las deudas caras, invierte con regularidad y bajo coste y deja que el tiempo haga el resto."},"ideas":[{"en":"Order of steps: budget → emergency fund → expensive debt → investing.","pt":"Ordem dos passos: orçamento → reserva → dívidas caras → investimentos.","es":"Orden de los pasos: presupuesto → fondo de emergencia → deudas caras → inversión."},{"en":"A savings rate of 15% to 20% of income is a solid long-term habit.","pt":"Investir de 15% a 20% da renda é um hábito sólido de longo prazo.","es":"Ahorrar entre el 15 % y el 20 % de los ingresos es un hábito sólido a largo plazo."},{"en":"Keep it simple enough to follow for years.","pt":"Mantenha simples o bastante para seguir por anos.","es":"Mantenlo lo bastante simple como para seguirlo durante años."}],"mission":{"model":"plan","prompt":{"en":"Income is **5,000**. Adjust the budget so it **fits the income**, you invest **at least 15%**, and the investment reaches **300,000 in 20 years**.","pt":"A renda é de **5.000**. Ajuste o orçamento para /* ============ Fin.Micro models: every mission is a small simulator ============ */
const FIN = (() => {
  const T = (en, pt, es) => ({ en, pt, es });
  const pmt = (pv, i, n) => i === 0 ? pv / n : pv * i / (1 - Math.pow(1 + i, -n));         // payment of a loan
  const fvAnnuity = (p, i, n) => i === 0 ? p * n : p * (Math.pow(1 + i, n) - 1) / i;          // future value of n deposits
  const pvAnnuity = (p, i, n) => i === 0 ? p * n : p * (1 - Math.pow(1 + i, -n)) / i;
  const monthly = a => Math.pow(1 + a, 1 / 12) - 1;                                           // annual → monthly rate
  const irr = (flows) => { let lo = -0.99, hi = 1; for (let k = 0; k < 200; k++) { const m = (lo + hi) / 2; const v = flows.reduce((s, f, t) => s + f / Math.pow(1 + m, t), 0); if (v > 0) lo = m; else hi = m; } return (lo + hi) / 2; };
  const range = (a, b) => Array.from({ length: b - a + 1 }, (_, k) => a + k);
  // deterministic random numbers for the risk simulation
  function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const gauss = r => Math.sqrt(-2 * Math.log(r() + 1e-12)) * Math.cos(2 * Math.PI * r());
  const SIMS = (() => { const r = rng(20261025), out = []; for (let p = 0; p < 400; p++) { const a = [], b = []; for (let y = 0; y < 20; y++) { a.push(gauss(r)); b.push(gauss(r)); } out.push([a, b]); } return out; })();
  function portfolio(mixStocks) { // 10,000 for 20 years; stocks: 9% ± 18%, bonds: 4.5% ± 4%, independent
    const w = mixStocks / 100, finals = SIMS.map(([a, b]) => { let v = 10000; for (let y = 0; y < 20; y++) v *= 1 + w * (0.09 + 0.18 * a[y]) + (1 - w) * (0.045 + 0.04 * b[y]); return v; }).sort((x, y) => x - y);
    return { p10: finals[Math.floor(finals.length * 0.1)], med: finals[Math.floor(finals.length / 2)], p90: finals[Math.floor(finals.length * 0.9)] };
  }

  const M = {};
  // ---------- Track 1: budget ----------
  M.budget = { kind: "sim", income: 4000,
    inputs: [{ id: "groceries", label: T("Groceries", "Mercado", "Supermercado"), min: 300, max: 1000, step: 50, value: 750, fmt: "money" },
             { id: "transport", label: T("Transport", "Transporte", "Transporte"), min: 100, max: 600, step: 50, value: 400, fmt: "money" },

             { id: "save", label: T("Savings", "Poupança", "Ahorro"), min: 0, max: 1500, step: 50, value: 300, fmt: "money" }],
    fixed: { rent: 1200, bills: 250 },
    compute(v) { const needs = 1200 + 250 + v.groceries + v.transport, wants = v.leisure, total = needs + wants + v.save, left = 4000 - total;
      return { needs, wants, total, left, bars: [{ k: "needs", v: needs }, { k: "wants", v: wants }, { k: "save", v: v.save }, { k: "left", v: Math.max(0, left) }],
        outputs: [{ label: T("Needs (rent 1,200 + bills 250 + groceries + transport)", "Necessidades (aluguel 1.200 + contas 250 + mercado + transporte)", "Necesidades (alquiler 1.200 + facturas 250 + súper + transporte)"), value: needs, fmt: "money", pct: needs / 4000 },
                  { label: T("Wants", "Desejos", "Deseos"), value: wants, fmt: "money", pct: wants / 4000 }, { label: T("Savings", "Poupança", "Ahorro"), value: v.save, fmt: "money", pct: v.save / 4000 },
                  { label: T("Not assigned", "Sem destino", "Sin asignar"), value: left, fmt: "money", bad: left < 0 }] }; },
    chart: "budget",
    goal: (v, o) => o.left === 0 && o.needs <= 2000 && v.save >= 800 },
  M.emergency = { kind: "sim",
    inputs: [{ id: "save", label: T("Saved per month", "Guardado por mês", "Ahorro mensual"), min: 100, max: 1500, step: 50, value: 300, fmt: "money" }],
    compute(v) { const target = 6 * 2500, months = Math.ceil(target / v.save), xs = range(0, Math.min(months, 60)); return { months,
      outputs: [{ label: T("Target: 6 months × 2,500", "Meta: 6 meses × 2.500", "Objetivo: 6 meses × 2.500"), value: target, fmt: "money" }, { label: T("Months to reach it", "Meses para chegar lá", "Meses para alcanzarlo"), value: months, fmt: "int", big: true }],
      line: { x: xs, series: [{ name: T("Emergency fund", "Reserva", "Fondo"), data: xs.map(m => Math.min(target, m * v.save)) }, { name: T("Target", "Meta", "Objetivo"), data: xs.map(() => target), dash: true }] } }; },
    goal: (v, o) => o.months <= 24 },
  M.goal = { kind: "sim",

    compute(v) { const xs = range(0, 12), bal = xs.map(m => 1200 + m * v.dep); return { final: bal[12],

      line: { x: xs, series: [{ name: T("Trip fund", "Fundo da viagem", "Fondo del viaje"), data: bal }, { name: T("Trip cost", "Custo da viagem", "Coste del viaje"), data: xs.map(() => 6000), dash: true }] } }; },
    goal: (v, o) => o.final >= 6000 && 1200 + 12 * (v.dep - 10) < 6000 },
  M.latte = { kind: "sim",

             { id: "price", label: T("Price per coffee", "Preço do café", "Precio del café"), min: 2, max: 8, step: 0.5, value: 6, fmt: "money" }],
    compute(v) { const year = v.days * v.price * 52, ten = fvAnnuity(v.days * v.price * 52 / 12, 0.005, 120); return { year,
      outputs: [{ label: T("Per year", "Por ano", "Por año"), value: year, fmt: "money", big: true }, { label: T("10 years, if invested at 0.5% a month", "10 anos, se investido a 0,5% ao mês", "10 años, si se invierte al 0,5 % mensual"), value: ten, fmt: "money" }] }; },
    goal: (v, o) => o.year <= 600 && o.year > 0 },
  // ---------- Track 2: interest ----------
  M.compound = { kind: "sim",
    inputs: [{ id: "years", label: T("Years", "Anos", "Años"), min: 1, max: 30, step: 1, value: 5, fmt: "int" }],
    compute(v) { const xs = range(0, v.years), s = xs.map(t => 1000 * (1 + 0.1 * t)), c = xs.map(t => 1000 * Math.pow(1.1, t)); return { diff: c[v.years] - s[v.years],
      outputs: [{ label: T("Simple interest", "Juros simples", "Interés simple"), value: s[v.years], fmt: "money" }, { label: T("Compound interest", "Juros compostos", "Interés compuesto"), value: c[v.years], fmt: "money" }, { label: T("Difference", "Diferença", "Diferencia"), value: c[v.years] - s[v.years], fmt: "money", big: true }],
      line: { x: xs, series: [{ name: T("Compound", "Compostos", "Compuesto"), data: c }, { name: T("Simple", "Simples", "Simple"), data: s, dash: true }] } }; },
    goal: (v, o) => o.diff > 1000 && (Math.pow(1.1, v.years - 1) * 1000 - 1000 * (1 + 0.1 * (v.years - 1))) <= 1000 },
  M.rule72 = { kind: "sim",
    inputs: [{ id: "rate", label: T("Annual rate", "Taxa anual", "Tasa anual"), min: 1, max: 20, step: 0.5, value: 4, fmt: "pct" }],
    compute(v) { const exact = Math.log(2) / Math.log(1 + v.rate / 100), est = 72 / v.rate; return { exact,
      outputs: [{ label: T("Rule of 72 estimate", "Estimativa pela regra do 72", "Estimación con la regla del 72"), value: est, fmt: "years" }, { label: T("Exact years to double", "Anos exatos para dobrar", "Años exactos para duplicar"), value: exact, fmt: "years", big: true }] }; },
    goal: (v, o) => Math.abs(o.exact - 9) < 0.25 },
  M.early = { kind: "sim",
    inputs: [{ id: "bruno", label: T("Bruno's monthly deposit (ages 35–65)", "Depósito mensal do Bruno (35 a 65 anos)", "Depósito mensual de Bruno (35–65 años)"), min: 100, max: 800, step: 10, value: 200, fmt: "money" }],
    compute(v) { const i = monthly(0.08), ages = range(25, 65); let a = 0, b = 0; const A = [], B = [];
      for (const age of ages) { A.push(a); B.push(b); for (let m = 0; m < 12; m++) { a = a * (1 + i) + (age < 35 ? 200 : 0); b = b * (1 + i) + (age >= 35 ? v.bruno : 0); } }
      A[A.length - 1] = a; B[B.length - 1] = b; return { a, b,
      outputs: [{ label: T("Ana: 200/month from 25 to 35, then stops", "Ana: 200/mês dos 25 aos 35, depois para", "Ana: 200/mes de 25 a 35 años y luego para"), value: a, fmt: "money" }, { label: T("Ana put in", "Ana aplicou", "Ana aportó"), value: 24000, fmt: "money" },
                { label: T("Bruno at 65", "Bruno aos 65", "Bruno a los 65"), value: b, fmt: "money", big: true }, { label: T("Bruno put in", "Bruno aplicou", "Bruno aportó"), value: v.bruno * 360, fmt: "money" }],
      line: { x: ages, series: [{ name: T("Ana", "Ana", "Ana"), data: A }, { name: T("Bruno", "Bruno", "Bruno"), data: B }] } }; },
    goal: (v, o) => o.b >= o.a },
  M.contrib = { kind: "sim",
    inputs: [{ id: "dep", label: T("Monthly deposit", "Aporte mensal", "Aporte mensual"), min: 100, max: 1000, step: 10, value: 300, fmt: "money" }],
    compute(v) { const i = monthly(0.09), xs = range(0, 10), bal = xs.map(y => fvAnnuity(v.dep, i, 12 * y)); return { final: bal[10],
      outputs: [{ label: T("After 10 years", "Depois de 10 anos", "Tras 10 años"), value: bal[10], fmt: "money", big: true }, { label: T("Deposited", "Depositado", "Depositado"), value: v.dep * 120, fmt: "money" }, { label: T("Interest earned", "Juros ganhos", "Intereses ganados"), value: bal[10] - v.dep * 120, fmt: "money" }],

  // ---------- Track 3: debt ----------
  M.card = { kind: "sim",

      const never = n >= 120; return { n, never,
      outputs: [{ label: T("Interest in the first month", "Juros no primeiro mês", "Intereses del primer mes"), value: 240, fmt: "money" }, { label: T("Months to pay off", "Meses para quitar", "Meses para liquidar"), value: never ? null : n, fmt: "int", big: true, text: never ? T("never", "nunca", "nunca") : null }, { label: T("Total paid", "Total pago", "Total pagado"), value: never ? null : paid, fmt: "money", text: never ? "∞" : null }],

  M.cash = { kind: "sim",

const LOCALE = { en: ["en-US", "USD"], pt: ["pt-BR", "BRL"], es: ["es-ES", "EUR"] };
const nf = (d) => new Intl.NumberFormat(LOCALE[lang][0], { minimumFractionDigits: d, maximumFractionDigits: d });
function money(v, dec) { if (v === null || v === undefined || !isFinite(v)) return "—"; const d = dec ?? (Math.abs(v) < 100 && Math.round(v) !== v ? 2 : 0); return new Intl.NumberFormat(LOCALE[lang][0], { style: "currency", currency: LOCALE[lang][1], minimumFractionDigits: d, maximumFractionDigits: d }).format(v); }
function fmt(v, kind) {
  if (v === null || v === undefined) return "—";
  switch (kind) {
    case "money": return money(v);
    case "pct": return nf(1).format(v) + "%"; case "pct0": return nf(0).format(v) + "%"; case "pct1": return nf(1).format(v) + "%"; case "pct2": return nf(2).format(v) + "%";
    case "int": return nf(0).format(v); case "dec": return nf(1).format(v);
    case "years": return nf(1).format(v) + " " + t("years_u");
    default: return typeof v === "number" ? nf(0).format(v) : v;

}

function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

function lineChart(line, opts = {}) {
  const W = 560, H = 250, l = 54, r = 14, tp = 14, b = 34; const xs = line.x, n = xs.length;
  const all = line.series.flatMap(s => s.data).filter(isFinite); const ymax = niceMax(Math.max(...all, 1)); const ymin = Math.min(0, ...all);
  const X = i => l + (n === 1 ? 0 : i / (n - 1)) * (W - l - r), Y = v => tp + (1 - (v - ymin) / (ymax - ymin)) * (H - tp - b);
  let g = "";
  for (let k = 0; k <= 4; k++) { const v = ymin + (ymax - ymin) * k / 4, y = Y(v); g += `<line x1="${l}" x2="${W - r}" y1="${y}" y2="${y}" class="grid"/><text x="${l - 8}" y="${y + 4}" text-anchor="end" class="ax">${shortNum(v)}</text>`; }
  const step = Math.max(1, Math.ceil(n / 7)); for (let i = 0; i < n; i += step) g += `<text x="${X(i)}" y="${H - 12}" text-anchor="middle" class="ax">${xs[i]}</text>`;
  if ((n - 1) % step) g += `<text x="${X(n - 1)}" y="${H - 12}" text-anchor="middle" class="ax">${xs[n - 1]}</text>`;
  line.series.forEach((s, k) => { const pts = s.data.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
    if (!s.dash && k === 0) g += `<polygon points="${X(0)},${Y(Math.max(0, ymin))} ${pts} ${X(n - 1)},${Y(Math.max(0, ymin))}" class="area"/>`;
    g += `<polyline points="${pts}" class="ln ln${k}${s.dash ? " dash" : ""}"/>`; if (!s.dash) g += `<circle cx="${X(n - 1)}" cy="${Y(s.data[n - 1])}" r="4.5" class="pt pt${k}"/>`; });
  const legend = line.series.map((s, k) => `<span class="lg"><i class="sw${k}${s.dash ? " dash" : ""}"></i>${esc(L(s.name))}</span>`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="chart">${g}</svg>${opts.noLegend ? "" : `<div class="legend">${legend}${opts.xLabel ? `<span class="muted">${esc(opts.xLabel)}</span>` : ""}</div>`}</div>`;
}

      host.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; host.querySelectorAll(".opt").forEach(x => x.classList.remove("right", "wrong"));
        if (k === r.answer) { b.classList.add("right"); api.solved(t("choice_ok")); } else { b.classList.add("wrong"); api.status(t("choice_bad"), "bad"); } });
      return {};
    }
    if (m.kind === "number") {
      host.innerHTML = `<div class="ftable"><table><thead><tr>${m.cols.map(c => `<th>${esc(L(c))}</th>`).join("")}</tr></thead><tbody>${m.rows.map(row => `<tr>${row.map((c, k) => `<td class="${k ? "num" : ""}">${typeof c === "number" ? money(c) : esc(L(c))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>

        let x; if (/^-?\d{1,3}([.,]\d{3})+$/.test(raw)) x = +raw.replace(/[.,]/g, ""); else x = +raw.replace(",", ".");
        const ok = isFinite(x) && (m.rel ? Math.abs(x - m.answer) <= Math.abs(m.answer) * m.tol : Math.abs(x - m.answer) <= m.tol);
        if (ok) api.solved(t("num_ok")); else api.status(t("num_bad"), "bad"); };

  renderLab(view) {
    const st = APP.labState || (APP.labState = { tab: "compound", v: { compound: { p: 1000, d: 200, r: 8, y: 20 }, loan: { a: 100000, r: 1, n: 120, sys: "price" }, infl: { a: 1000, r: 5, y: 10 }, retire: { a: 30, b: 65, tg: 1000000, r: 5 } } });
    const tabs = ["compound", "loan", "infl", "retire"];
    view.innerHTML = `<div class="wrap"><div class="eyebrow">${t("lab")}</div><h1 class="page-h">${t("lab_h")}</h1><p class="muted page-p">${t("lab_p")}</p>

      <div class="lab"><div class="card labmain"><div id="calcChart"></div><div id="calcOut"></div></div><aside class="card side"><div class="sliders" id="calcIn"></div><p class="muted small">${t("disclaimer")}</p></aside></div></div>`;
    const DEF = {
      compound: [["p", "initial", 0, 100000, 500, "money"], ["d", "monthlyDep", 0, 5000, 50, "money"], ["r", "rateY", 0, 15, 0.5, "pct"], ["y", "years", 1, 50, 1, "int"]],
      loan: [["a", "amount", 1000, 1000000, 1000, "money"], ["r", "rateM", 0.1, 5, 0.1, "pct"], ["n", "months", 6, 420, 6, "int"]],
      infl: [["a", "amount", 100, 100000, 100, "money"], ["r", "inflY", 0, 20, 0.5, "pct"], ["y", "years", 1, 50, 1, "int"]],
      retire: [["a", "ageNow", 18, 60, 1, "int"], ["b", "ageRet", 40, 75, 1, "int"], ["tg", "target", 100000, 5000000, 50000, "money"], ["r", "rateReal", 1, 10, 0.5, "pct"]]
    };
    const draw = () => { const k = st.tab, v = st.v[k];
      $("#calcIn").innerHTML = DEF[k].map(([id, lab, mn, mx, sp, f]) => sliderHtml({ id, label: t(lab), min: mn, max: mx, step: sp, fmt: f }, v[id])).join("") + (k === "loan" ? `<div class="seg" id="sysSeg"><button type="button" data-s="price" aria-pressed="${v.sys === "price"}">Price</button><button type="button" data-s="sac" aria-pressed="${v.sys === "sac"}">SAC</button></div>` : "");
      DEF[k].forEach(([id, , , , , f]) => { const el = $("#in-" + id); el.oninput = () => { v[id] = +el.value; $("#out-" + id).textContent = fmt(v[id], f); calc(); }; });
      if (k === "loan") $("#sysSeg").querySelectorAll("button").forEach(b => b.onclick = () => { v.sys = b.dataset.s; draw(); });
      calc(); };
    const calc = () => { const k = st.tab, v = st.v[k]; let outs = [], line = null;
      if (k === "compound") { const i = FIN.monthly(v.r / 100), xs = Array.from({ length: v.y + 1 }, (_, y) => y); const bal = xs.map(y => v.p * Math.pow(1 + i, 12 * y) + FIN.fvAnnuity(v.d, i, 12 * y)), dep = xs.map(y => v.p + v.d * 12 * y);
        outs = [{ label: t("final"), value: bal[v.y], fmt: "money", big: true }, { label: t("deposited"), value: dep[v.y], fmt: "money" }, { label: t("interest"), value: bal[v.y] - dep[v.y], fmt: "money" }];
        line = { x: xs, series: [{ name: t("balance"), data: bal }, { name: t("deposited"), data: dep, dash: true }] }; }
      if (k === "loan") { const i = v.r / 100, n = v.n, xs = Array.from({ length: n }, (_, j) => j + 1); let pays;
        if (v.sys === "price") { const p = FIN.pmt(v.a, i, n); pays = xs.map(() => p); } else pays = xs.map(j => v.a / n + (v.a - v.a / n * (j - 1)) * i);
        const tot = pays.reduce((s, x) => s + x, 0); outs = [{ label: t("payment1"), value: pays[0], fmt: "money", big: true }, { label: t("paymentN"), value: pays[n - 1], fmt: "money" }, { label: t("totalInt"), value: tot - v.a, fmt: "money" }];
        line = { x: xs, series: [{ name: v.sys === "price" ? "Price" : "SAC", data: pays }] }; }
      if (k === "infl") { const xs = Array.from({ length: v.y + 1 }, (_, y) => y), w = xs.map(y => v.a / Math.pow(1 + v.r / 100, y));
        outs = [{ label: t("worth"), value: w[v.y], fmt: "money", big: true }, { label: t("lost"), value: (1 - w[v.y] / v.a) * 100, fmt: "pct1" }]; line = { x: xs, series: [{ name: t("value"), data: w }] }; }
      if (k === "retire") { const n = Math.max(1, (v.b - v.a) * 12), i = FIN.monthly(v.r / 100), need = v.tg * i / (Math.pow(1 + i, n) - 1), ages = Array.from({ length: Math.max(1, v.b - v.a) + 1 }, (_, y) => v.a + y);
        outs = [{ label: t("needMonthly"), value: need, fmt: "money", big: true }, { label: t("deposited"), value: need * n, fmt: "money" }, { label: t("interest"), value: v.tg - need * n, fmt: "money" }];
        line = { x: ages, series: [{ name: t("balance"), data: ages.map(a => FIN.fvAnnuity(need, i, 12 * (a - v.a))) }, { name: t("target"), data: ages.map(() => v.tg), dash: true }] }; }
      $("#calcOut").innerHTML = outputsHtml(outs); $("#calcChart").innerHTML = lineChart(line); };
    view.querySelectorAll(".tabsbar button").forEach(b => b.onclick = () => { st.tab = b.dataset.k; view.querySelectorAll(".tabsbar button").forEach(x => x.setAttribute("aria-selected", x === b)); draw(); });
    draw();
  }
};

  let [v, arg] = h.split("/"); if (v === "lesson" && !LESSONS.some(l => l.id === arg)) v = "tracks";

  for (const x of VIEWS) $("#v-" + x).classList.toggle("on", x === v);
  document.querySelectorAll("nav.menu a").forEach(a => a.setAttribute("aria-current", a.dataset.v === (v === "lesson" ? "tracks" : v) ? "page" : "false"));
  if (ACTIVE && ACTIVE.stop) ACTIVE.stop(); ACTIVE = null; if (APP.leave) APP.leave();
  ({ home: renderHome, tracks: renderTracks, lesson: () => renderLesson(arg), lab: () => APP.renderLab($("#v-lab")), glossary: renderGlossary, about: renderAbout })[v]();
  document.title = v === "home" ? APP.titleHome : (v === "lesson" ? L(LESSONS[lessonIndex(arg)].title) : t(v)) + " · " + APP.name;
  if (route.prev !== h) window.scrollTo(0, 0); route.prev = h;

function isDark() { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }

/* ---------- home ---------- */
function renderHome() {
  const next = LESSONS.find(l => !isDone(l.id)); const started = Object.keys(progress.done).length > 0;
  const tracksHtml = TRACKS.map((tr, i) => { const ls = LESSONS.filter(l => l.track === tr.id); const d = ls.filter(l => isDone(l.id)).length;
    return `<a class="ltile${d === ls.length ? " done" : ""}" href="#/lesson/${ls.find(l => !isDone(l.id))?.id || ls[0].id}"><span class="num">${i + 1}</span><div><b>${esc(L(tr.name))}</b><span>${t(tr.level)} · ${d}/${ls.length}</span></div></a>`; }).join("");

   </div><div class="card showcase" id="heroVis"></div></div>
   <section class="sec"><div class="sec-head"><div><h2>${t("tracks_h")}</h2><p>${t("tracks_p")}</p></div><a class="btn small ghost" href="#/tracks">${t("tracks")} →</a></div><div class="lessons">${tracksHtml}</div></section>

  APP.heroVisual($("#heroVis"));
}

/* ---------- tracks ---------- */
function renderTracks() {
  $("#v-tracks").innerHTML = `<div class="wrap"><div class="eyebrow">${t("tracks")}</div><h1 class="page-h">${t("tracks_h")}</h1><p class="muted page-p">${t("tracks_p")}</p>${TRACKS.map(tr => {

    return `<div class="card track"><div class="track-head"><div class="track-ico">${APP.trackIcon(tr)}</div><div><span class="pill lv ${tr.level}">${t(tr.level)}</span><h2>${esc(L(tr.name))}</h2><p>${esc(L(tr.desc))}</p></div><span class="count">${d}/${ls.length}</span></div>

/* ---------- lesson ---------- */
function renderLesson(id) {
  const i = lessonIndex(id), l = LESSONS[i], tr = TRACKS.find(x => x.id === l.track), mi = l.mission;
  $("#v-lesson").innerHTML = `<div class="wrap">
   <div class="crumbs"><a href="#/tracks">← ${t("back")}</a><span class="pill lv ${tr.level}">${t(tr.level)}</span><span class="pill">${esc(L(tr.name))}</span><span class="pill">${t("lesson")} ${i + 1} ${t("of")} ${LESSONS.length}</span></div>
   <div class="lesson"><div class="l-text">
     <h1>${esc(L(l.title))}</h1><p class="intro">${esc(L(l.intro))}</p>
     <div class="eyebrow" style="margin-top:22px">${t("key")}</div>
     <ol class="ideas">${l.ideas.map((x, k) => `<li><i>${k + 1}</i><span>${APP.richText(L(x))}</span></li>`).join("")}</ol>

     <div class="hintbox" id="mHintBox" hidden>${APP.richText(L(mi.hint))}</div>
