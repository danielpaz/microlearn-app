}
function setStatus(html, cls = "") { const s = $("#mStatus"); if (!s) return; s.className = "status " + cls; s.innerHTML = html; s.hidden = !html; }
function missionApi(l) {
  return {
    status: setStatus,
    counter: txt => { $("#mCount").textContent = txt; },
    solved: msg => { setStatus(`<span class="big">✓</span><span>${msg}</span>`, "ok"); award(l.id, "m", 10); renderDone(l); },
    isSolved: () => !!(progress.done[l.id] && progress.done[l.id].m)
  };
}
function renderDone(l) {
  const i = lessonIndex(l.id), next = LESSONS[i + 1];
  $("#doneBox").innerHTML = isDone(l.id) ? `<div class="done-banner">✓ ${t("done")}${next ? `<a class="btn small primary" href="#/lesson/${next.id}">${t("next")} →</a>` : `<a class="btn small primary" href="#/tracks">${t("tracks")} →</a>`}</div>` : "";
}
function renderQuiz(l) {
  const q = l.quiz, box = $("#quiz"); const answered = progress.done[l.id]?.q;
  box.innerHTML = `<div class="eyebrow">${t("quiz")}</div><h3>${APP.richText(L(q.q))}</h3><div class="opts">${q.options.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="k">${"ABC"[k]}</span><span>${APP.richText(L(o))}</span></button>`).join("")}</div><div class="fb" id="qfb" aria-live="polite"></div>`;
  const show = k => { box.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === q.answer) b.classList.add("right"); else if (+b.dataset.k === k) b.classList.add("wrong"); });
    $("#qfb").innerHTML = `<b class="${k === q.answer ? "ok" : "bad"}">${k === q.answer ? t("right") : t("wrong")}</b> ${APP.richText(L(q.explain))}`; };
  box.querySelectorAll(".opt").forEach(b => b.onclick = () => { const k = +b.dataset.k; show(k); if (k === q.answer) { award(l.id, "q", 5); renderDone(l); } else setTimeout(() => renderQuiz(l), 2600); });
  if (answered) show(q.answer);
}

/* ---------- glossary & about ---------- */
function renderGlossary() {
  const items = DATA.glossary.map(g => ({ term: L(g.term), def: L(g.def) })).sort((a, b) => a.term.localeCompare(b.term, lang));
  const letters = [...new Set(items.map(i => i.term[0].toUpperCase()))];
  $("#v-glossary").innerHTML = `<div class="wrap"><div class="eyebrow">${t("glossary")}</div><h1 class="page-h">${t("gl_h")}</h1><p class="muted page-p">${t("gl_p")}</p>
   <input type="search" id="glq" placeholder="${t("search")}" aria-label="${t("search")}">
   <div class="gl-index">${letters.map(c => `<a href="#gl-${encodeURIComponent(c)}" data-l="${c}">${c}</a>`).join("")}</div>
   <div class="gl-list" id="glList"></div></div>`;
  const draw = q => { const f = items.filter(i => !q || (i.term + " " + i.def).toLowerCase().includes(q.toLowerCase())); const seen = new Set();
    $("#glList").innerHTML = f.length ? f.map(i => { const c = i.term[0].toUpperCase(); const id = seen.has(c) ? "" : ` id="gl-${encodeURIComponent(c)}"`; seen.add(c); return `<div class="card term"${id}><h3>${esc(i.term)}<span>${c}</span></h3><p>${APP.richText(i.def)}</p></div>`; }).join("") : `<p class="muted">${t("notfound")}</p>`; };
  draw(""); $("#glq").oninput = e => draw(e.target.value);
  document.querySelectorAll(".gl-index a").forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById("gl-" + encodeURIComponent(a.dataset.l)); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); });
}
function renderAbout() { $("#v-about").innerHTML = `<div class="wrap"><div class="eyebrow">${t("about")}</div><div class="prose">${APP.about[lang].replace("{progress}", t("progress_note"))}</div></div>`; }

/* ---------- boot ---------- */
function boot() {
  applyTheme(store.get("theme", "light"));
  $("#themeBtn").onclick = () => { const nt = isDark() ? "light" : "dark"; store.set("theme", nt); applyTheme(nt); };
  $("#langBtn").onclick = e => { e.stopPropagation(); const m = $("#langMenu"); m.hidden = !m.hidden; $("#langBtn").setAttribute("aria-expanded", String(!m.hidden)); };
  document.addEventListener("click", () => { $("#langMenu").hidden = true; $("#langBtn").setAttribute("aria-expanded", "false"); });
  $("#langMenu").onclick = e => { const b = e.target.closest("button[data-l]"); if (!b) return; lang = b.dataset.l; store.set("lang", lang); renderShell(); route(); };
  renderShell(); window.addEventListener("hashchange", route); route();
}

boot();

      return "<li><b>" + esc(L(q.q)) + "</b><br>" + (r.pick != null ? '<span class="mn-no">' + t("your") + ":</span> " + esc(L(q.o[r.pick])) + "<br>" : "") +
        (full ? '<span class="mn-ok">' + t("ok") + ":</span> " + esc(L(q.o[q.a])) + '<br><span class="mn-x">' + esc(L(q.x)) + "</span><br>" : "") +
        (LINK && q.l ? '<a href="#/lesson/' + esc(q.l) + '" data-mn="lesson">' + t("lesson") + ": " + esc(L(q.t)) + "</a>" : '<span class="mn-x">' + esc(L(q.t)) + "</span>") + "</li>"; }).join("") + "</ul></div>";
  }
  function question() {
    var r = run, q = r.qs[r.k], h = '<div class="mn-in"><div class="mn-top"><span class="mn-meta">' + t("att", { i: r.n }) + '</span><span class="mn-meta">' + t("q", { i: r.k + 1, n: r.qs.length }) + "</span></div>";
    h += '<div class="mn-bar"><i style="width:' + (100 * r.k / r.qs.length) + '%"></i></div><div class="mn-card"><p class="mn-q">' + esc(L(q.q.q)) + '</p><div class="mn-opts">';
    h += q.ord.map(function (j) { return '<button class="mn-opt" data-mn="pick" data-j="' + j + '">' + esc(L(q.q.o[j])) + "</button>"; }).join("");
    return h + "</div></div></div>";
  }
  function result() {
    var r = run, s = load(), c = r.ans.filter(function (a) { return a.ok; }).length, wrong = r.ans.filter(function (a) { return !a.ok; }), last = s.used >= MAX;
    var h = '<div class="mn-in"><p class="mn-meta">' + t("att", { i: r.n }) + '</p><div class="mn-card"><div class="mn-big">' + t("score", { s: r.score }) + "</div><p>" + t("right", { c: c, n: r.qs.length }) + " · " +
      (MAX - s.used > 0 ? (MAX - s.used === 1 ? t("left1") : t("left", { n: MAX - s.used })) : t("none")) + '</p><button class="mn-btn mn-ghost" data-mn="home">' + t("title") + "</button></div>";
    if (last) h += review(Q.map(function (q) { var a = r.ans.filter(function (x) { return x.q === q; })[0]; return { q: q, pick: a && !a.ok ? a.pick : null }; }), true);
    else if (wrong.length) h += review(wrong.map(function (a) { return { q: a.q, pick: a.pick }; }), false);
    return h + "</div>";
  }
  function render() { view.innerHTML = !run ? home() : run.k < run.qs.length ? question() : result(); }
  view.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-mn]"); if (!b) return; var d = b.getAttribute("data-mn");
    if (d === "start") { var s = load(); if (s.used >= MAX) return; s.used++; s.scores.push(null); save(s);
      run = { n: s.used, k: 0, ans: [], qs: shuffle(Q).map(function (q) { return { q: q, ord: shuffle(q.o.map(function (_, j) { return j; })) }; }) }; render(); view.scrollTop = 0; }
    else if (d === "pick" && run) { var q = run.qs[run.k], j = +b.getAttribute("data-j"); run.ans.push({ q: q.q, pick: j, ok: j === q.q.a }); run.k++;
      if (run.k >= run.qs.length) { run.score = Math.min(100, run.ans.filter(function (a) { return a.ok; }).length * PTS); var s2 = load(); s2.scores[run.n - 1] = run.score; save(s2); }
      render(); view.scrollTop = 0; }
    else if (d === "home") { run = null; render(); }
    else if (d === "lesson") { close(); }
  });
  window.MicroNano = { open: open, close: close, key: KEY, size: Q.length };
})();</script>
<script data-micro-foot>
/* .Micro footer line (standard 5.3, 2026-11-04): "Part of MicroLearn.website" as the last line of the footer, linking to the portal.
   Link: "/" (site and microlearn.website.html) · "microlearn.website.html" (offline package, file://) · inside an embed, data-micro-nav sends it to the Google Sites home page.
   Hides the old "Part of the Microlearn network" badge and any other portal link in the footer, so the portal is mentioned once. */
(function () {
  if (window.MicroFoot) return;
  var TX = { en: "Part of", pt: "Parte do", es: "Parte de" };
  var HREF = location.protocol === "file:" ? "microlearn.website.html" : "/";
  var st = document.createElement("style");
  st.textContent = ".mf-line{display:block!important;width:100%;box-sizing:border-box;margin:14px 0 0!important;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))!important;text-align:center!important;font:400 .85rem/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif!important;opacity:.78;color:inherit;clear:both;order:9999}" +
    ".mf-line a{color:var(--mf-acc,inherit)!important;font-weight:600;text-decoration:none!important}.mf-line a:hover,.mf-line a:focus-visible{text-decoration:underline!important}" +
    "footer.mf-own{display:block;border:0;background:none}";
  document.head.appendChild(st);
  function lang() { var l = (document.documentElement.lang || "en").slice(0, 2).toLowerCase(); return TX[l] ? l : "en"; }
  function vis(el) { return !!(el.offsetParent || el.getClientRects().length); }
  function isPortal(a) {
    var h = (a.getAttribute("href") || "").trim();
    if (/^(\/|\.\/|\.\.\/|\.\.\/\.\.\/|\/(pt|es)\/?|microlearn\.website\.html)(#.*)?$/i.test(h)) return true;
    return /^https?:\/\/(www\.)?microlearn\.website\/?(#.*)?$/i.test(h) || /^https?:\/\/(www\.)?learnware\.online/i.test(h);
  }
  function hide(el) { if (el.getAttribute("data-mf-old") == null) { el.setAttribute("data-mf-old", ""); el.style.setProperty("display", "none", "important"); } }
  function cleanOld(f) {
    [].forEach.call(f.querySelectorAll('[class*="lw-"],[id^="lw-"],[data-lw]'), function (el) { if (!el.closest(".mf-line")) hide(el); });
    [].forEach.call(f.querySelectorAll("a[href]"), function (a) {
      if (a.closest(".mf-line") || a.closest("nav")) return;
      if (isPortal(a) && /micro\s*learn|learnware/i.test(a.textContent)) {
        hide(a);
        var p = a.parentElement;
        while (p && p !== f && !p.closest(".mf-line")) {
          var txt = [].map.call(p.childNodes, function (n) { return n.nodeType === 3 ? n.textContent : (n.getAttribute && n.getAttribute("data-mf-old") != null) ? "" : n.textContent; }).join("");
          if (/^[\s·•|—–\-,.:;]*$/.test(txt)) { hide(p); p = p.parentElement; } else break;
        }
      }
    });
    [].forEach.call(f.querySelectorAll("*"), function (el) {
      if (el.children.length || el.closest(".mf-line") || el.getAttribute("data-mf-old") != null) return;
      if (/^\s*(part of the microlearn network|parte da rede microlearn|parte de la red microlearn)\s*$/i.test(el.textContent)) hide(el);
    });
  }
  var line = null, busy = false;
  function make() {
    var d = document.createElement("div"); d.className = "mf-line"; d.setAttribute("data-micro-foot", "");
    d.innerHTML = '<span class="mf-t"></span> <a class="mf-a" href="' + HREF + '">MicroLearn.website</a>'; return d;
  }
  function host() {
    var fs = [].filter.call(document.querySelectorAll("footer"), function (f) { return !f.closest("nav") && !f.closest("[data-micro-nano-view],.mn-in"); });
    var v = fs.filter(vis);
    if (v.length) return v[v.length - 1];
    if (fs.length) return fs[fs.length - 1];
    var own = document.querySelector("footer.mf-own");
    if (!own) { own = document.createElement("footer"); own.className = "mf-own"; }
    var ms = [].filter.call(document.querySelectorAll("main"), vis), m = ms[ms.length - 1] || document.body;
    if (own.parentNode !== m || m.lastElementChild !== own) m.appendChild(own);
    return own;
  }
  function acc() {
    var on = document.querySelector("nav .mstd-on") || document.querySelector("nav .mstd-item");
    var c = on ? getComputedStyle(on).color : "";
    if (c) document.documentElement.style.setProperty("--mf-acc", c);
  }
  function ensure() {
    if (busy) return; busy = true;
    try {
      var f = host();
      [].forEach.call(document.querySelectorAll(".mf-line"), function (el) { if (el !== line || el.parentNode !== f) el.remove(); });
      if (!line) line = make();
      if (line.parentNode !== f || f.lastElementChild !== line) f.appendChild(line);
      var t = TX[lang()], s = line.querySelector(".mf-t"); if (s.textContent !== t) s.textContent = t;
      line.setAttribute("lang", lang());
      [].forEach.call(document.querySelectorAll("footer"), cleanOld);
      acc();
    } finally { setTimeout(function () { busy = false; }, 0); }
  }
  var q = 0;
  function later() { if (q) return; q = setTimeout(function () { q = 0; ensure(); }, 60); }
  function start() {
    ensure();
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true });
    new MutationObserver(later).observe(document.documentElement, { attributes: true, attributeFilter: ["lang", "data-theme", "class"] });
    addEventListener("hashchange", later); addEventListener("resize", later);
  }
  if (document.body) start(); else document.addEventListener("DOMContentLoaded", start);
  window.MicroFoot = { ensure: ensure };
})();
</script>
