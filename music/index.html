<style>
:root{
  --bg:#F7F4F8; --surface:#FFFFFF; --surface-2:#F0EAF2; --ink:#1D1420; --muted:#665C6A; --line:#E2D9E5;
  --accent:#8A2BA3; --accent-ink:#FFFFFF; --accent-soft:#F3E3F7;
  --ok:#1D7A4C; --ok-soft:#E1F2E8; --bad:#B8362A; --bad-soft:#FBE7E4; --gold:#B7791F;
  --lv-beg:#1D7A4C; --lv-int:#2F5FBF; --lv-adv:#8A2BA3;
  --staff-line:#8A8090; --key-w:#FFFFFF; --key-edge:#B9AFBD; --key-b:#1D1420; --key-hover:#FBF7FC; --key-down:#E9DDEE; --given:#FFE9A8; --given-b:#B7791F;
  --f-display:"STIX Two Text", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(29,20,32,.06), 0 6px 24px -12px rgba(29,20,32,.2);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141016; --surface:#1C171F; --surface-2:#262029; --ink:#F1EAF3; --muted:#A99CAD; --line:#352D38;
  --accent:#E29CF5; --accent-ink:#24082C; --accent-soft:#3A2141;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5BCB90; --lv-int:#8EA9F0; --lv-adv:#E29CF5;
  --staff-line:#8C8090; --key-w:#EDE6EF; --key-edge:#6E6472; --key-b:#0B080C; --key-hover:#F6F1F7; --key-down:#CFC3D3; --given:#E8C766; --given-b:#C99A2E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141016; --surface:#1C171F; --surface-2:#262029; --ink:#F1EAF3; --muted:#A99CAD; --line:#352D38;
  --accent:#E29CF5; --accent-ink:#24082C; --accent-soft:#3A2141;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5BCB90; --lv-int:#8EA9F0; --lv-adv:#E29CF5;
  --staff-line:#8C8090; --key-w:#EDE6EF; --key-edge:#6E6472; --key-b:#0B080C; --key-hover:#F6F1F7; --key-down:#CFC3D3; --given:#E8C766; --given-b:#C99A2E;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;font-stretch:112%}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:112%}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}

/* Music.Micro: piano keyboard, staff, missions */
.staff-box{overflow-x:auto;margin:0 0 8px;padding:2px 0;color:var(--ink)}
.staff{display:block;max-width:100%;height:auto;margin:0 auto;color:var(--ink)}
.staff .sl{stroke:var(--staff-line);stroke-width:1}
.staff .bl{stroke:var(--ink);stroke-width:1.3}
.staff .bl.thick{stroke-width:3.4}
.staff .hd{fill:currentColor}
.staff .hd.hollow{fill:none;stroke:currentColor}
.staff .stem{stroke:currentColor;stroke-width:1.4}
.staff .flag{fill:none;stroke:currentColor;stroke-width:2}
.staff .ink{fill:currentColor}
.staff .ts{font-family:var(--f-display);font-weight:700;font-size:22px;fill:currentColor}
.staff .nn{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.staff .brace{fill:none;stroke:var(--ink);stroke-width:3}
.staff .col.hl,.staff .col.ok{color:var(--accent)}
.staff .col.given{color:var(--muted)}
.staff .col.ghost{color:var(--line)}
.staff.mini{width:38px;height:auto}
.kbd-wrap{overflow-x:auto;padding:4px 0 2px;-webkit-overflow-scrolling:touch}
.kbd{display:block;width:100%;min-width:300px;height:auto;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.k{cursor:pointer;outline:none}
.k.w rect{fill:var(--key-w);stroke:var(--key-edge);stroke-width:1}
.k.b rect{fill:var(--key-b);stroke:var(--key-b);stroke-width:1}
.k .kl{font-family:var(--f-mono);font-size:8.5px;fill:var(--muted);pointer-events:none}
.k .kdot{fill:var(--muted);pointer-events:none}
.k:hover.w rect{fill:var(--key-hover)}
.k:focus-visible rect{stroke:var(--accent);stroke-width:2.5}
.k.down.w rect{fill:var(--key-down)}.k.down.b rect{fill:#555}
.k.sel.w rect{fill:var(--accent-soft);stroke:var(--accent)}.k.sel.b rect{fill:var(--accent)}
.k.sel .kl{fill:var(--accent);font-weight:700}
.k.given.w rect{fill:var(--given)}.k.given.b rect{fill:var(--given-b)}
.k.ok.w rect{fill:var(--ok-soft);stroke:var(--ok)}.k.ok.b rect{fill:var(--ok)}
.k.ok .kl{fill:var(--ok);font-weight:700}
.k.bad.w rect{fill:var(--bad-soft);stroke:var(--bad)}.k.bad.b rect{fill:var(--bad)}
.rq{font-weight:600;margin:0 0 8px;min-height:1.4em}
.rq:empty{display:none}
.bctl{margin-top:10px}
.small{font-size:.82rem}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;margin:10px 0 2px}
.pal{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 2px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);text-align:left;font-size:.8rem;font-weight:600;line-height:1.15}
.pal:hover:not([disabled]){border-color:var(--accent)}
.pal[disabled]{opacity:.38;cursor:default}
.pal small{display:block;font-family:var(--f-mono);color:var(--muted);font-weight:500}
.pal-ico{flex:none;width:38px}
.beats{display:flex;align-items:center;gap:6px;margin:2px 0 4px}
.beats i{width:22px;height:8px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.beats i.full{background:var(--accent);border-color:var(--accent)}
.beats i.half{background:linear-gradient(90deg,var(--accent) 50%,var(--surface-2) 50%)}
.beats b{font-family:var(--f-mono);font-size:.85rem;margin-left:6px}
.tempo,.metro{text-align:center}
.tempo-big b{font-family:var(--f-display);font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.tempo-big span{display:block;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);margin-top:2px}
.pulse{display:flex;justify-content:center;gap:12px;margin:14px 0}
.pulse i{width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);transition:transform .08s}
.pulse i:first-child{border-color:var(--accent)}
.pulse i.on{background:var(--accent);border-color:var(--accent);transform:scale(1.25)}
.pulse.big i{width:30px;height:30px}
.sl input[type=range]{width:100%;accent-color:var(--accent);height:30px}
.outs{display:grid;gap:8px;margin:6px 0 4px;text-align:left}
.out{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:.9rem}
.out span{color:var(--muted)}
.out b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.out.big{background:var(--accent-soft)}.out.big b{color:var(--accent);font-size:1.15rem}
.tempo .bctl{justify-content:center}
.opts.choice{margin-top:10px}
details.circ{margin:6px 0}
details.circ summary{cursor:pointer;font-weight:600;font-size:.9rem;color:var(--accent)}
.circle5{display:block;width:100%;max-width:300px;margin:6px auto}
.cf-ring{fill:none;stroke:var(--line);stroke-width:1}
.cf-maj{fill:var(--surface-2);stroke:var(--line)}
.cf.on .cf-maj{fill:var(--accent);stroke:var(--accent)}
.cf-t{font-family:var(--f-display);font-weight:700;font-size:14px;fill:var(--ink)}
.cf-t.sm{font-size:9px}
.cf.on .cf-t{fill:var(--accent-ink)}
.cf-m{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.cf.on .cf-m{fill:var(--accent);font-weight:700}
.cf-a{font-family:var(--f-mono);font-size:8.5px;fill:var(--muted)}
.hv-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.tabsbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabsbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--muted)}
.tabsbar button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.labmain{padding:16px;min-width:0}
.lp-info{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;min-height:2.2em;margin:4px 0 10px;font-size:.95rem}
.lp-info b{font-family:var(--f-mono)}
.lp-info span{color:var(--accent);font-weight:600}
.lt-h{font-size:1.3rem;margin:0 0 6px;font-family:var(--f-body);font-stretch:100%;letter-spacing:0;font-weight:600}
.lt-h b{font-family:var(--f-display);color:var(--accent)}
.roots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.roots button,.chips button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 4px;font-weight:600;font-size:.84rem;color:var(--muted)}
.roots button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:6px 9px}
.ftable{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px}
.ftable table{border-collapse:collapse;width:100%;font-size:.88rem}
.ftable th,.ftable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.ftable th{background:var(--surface-2);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ftable tr:last-child td{border-bottom:0}
@media (max-width:520px){ .palette{grid-template-columns:repeat(2,minmax(0,1fr))} .tempo-big b{font-size:2.6rem} }

#soundBtn.muted{color:var(--muted);border-style:dashed}
@media (max-width:440px){ .top-in{gap:8px} .tools{gap:5px} .tools .icon-btn{min-width:32px;height:32px;padding:0 7px} .xp{height:32px;padding:0 8px} .brand{gap:8px} .brand b{font-size:1.06rem} }
@media (max-width:360px){ .brand b{display:none} }

</style>

  <nav class="menu" id="menu" aria-label="Main"></nav>
  <div class="tools">

</div></header>
<main id="main">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-tracks"></section>
  <section class="view" id="v-lesson"></section>
  <section class="view" id="v-lab"></section>
  <section class="view" id="v-glossary"></section>
  <section class="view" id="v-about"></section>
</main>

<script>const ABOUT_MUSIC = {"en": "<h1>About Music.Micro</h1>\n<p>Music.Micro is a micro-learning platform for music theory. Each lesson takes three to five minutes: one idea, a mission you play on the keyboard or the staff, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: the keyboard, reading notes, rhythm, intervals, scales and keys, and chords and harmony. {progress}</p>\n<h2>How the missions work</h2>\n<ul><li><b>Keyboard missions</b>: find notes, play scales in order or answer note by note what the staff shows.</li><li><b>Build missions</b>: select keys to build intervals, scales and chords; the app checks the notes and, for inversions, the bass.</li><li><b>Rhythm missions</b>: fill a bar with note values and rests until it adds up and meets the goal.</li><li><b>Ear missions</b>: listen and decide, with the option to reveal the keys and count.</li></ul>\n<h2>The tools</h2>\n<p>The keyboard, the sheet music and the sound are built into this page: the staff is drawn as vector graphics and the piano is synthesised with the Web Audio API in your browser, so everything works offline and nothing is sent anywhere. The Lab has a piano that names any interval or chord, every scale and chord in every key, and a metronome with tap tempo.</p>\n<h2>Note names</h2>\n<p>English uses letters (C D E F G A B). Portuguese and Spanish use solfège (Do Re Mi Fa Sol La Si), while chord symbols use letters in every language (C, Dm, G7). Octave numbers follow the scientific convention: middle C is C4 and the tuning A is A4 = 440 Hz.</p>\n<h2>Part of Microlearn</h2>\n<p>Music.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"microlearn.website.html\">www.microlearn.website</a>.</p>", "pt": "<h1>Sobre o Music.Micro</h1>\n<p>O Music.Micro é uma plataforma de microaprendizagem de teoria musical. Cada lição leva de três a cinco minutos: uma ideia, uma missão para tocar no teclado ou na pauta, e uma pergunta para conferir o que aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: o teclado, leitura de notas, ritmo, intervalos, escalas e tonalidades, e acordes e harmonia. {progress}</p>\n<h2>Como funcionam as missões</h2>\n<ul><li><b>Missões no teclado</b>: achar notas, tocar escalas em ordem ou responder nota a nota o que a pauta mostra.</li><li><b>Missões de montar</b>: selecionar teclas para montar intervalos, escalas e acordes; o app confere as notas e, nas inversões, o baixo.</li><li><b>Missões de ritmo</b>: preencher um compasso com figuras e pausas até fechar e cumprir a meta.</li><li><b>Missões de ouvido</b>: ouvir e decidir, com a opção de mostrar as teclas e contar.</li></ul>\n<h2>As ferramentas</h2>\n<p>O teclado, a partitura e o som estão dentro desta página: a pauta é desenhada em gráficos vetoriais e o piano é sintetizado com a Web Audio API no seu navegador, então tudo funciona offline e nada é enviado para lugar nenhum. O Laboratório tem um piano que dá nome a qualquer intervalo ou acorde, todas as escalas e acordes em todos os tons, e um metrônomo com marcação de andamento.</p>\n<h2>Nomes das notas</h2>\n<p>Em português usamos o solfejo (Dó Ré Mi Fá Sol Lá Si); as cifras usam letras (C, Dm, G7), como nos songbooks e revistinhas de violão. A numeração das oitavas segue a convenção científica: o Dó central é o Dó4 (C4) e o Lá de afinação é o Lá4 = 440 Hz.</p>\n<h2>Parte do Microlearn</h2>\n<p>O Music.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"microlearn.website.html\">www.microlearn.website</a>.</p>", "es": "<h1>Acerca de Music.Micro</h1>\n<p>Music.Micro es una plataforma de microaprendizaje de teoría musical. Cada lección dura de tres a cinco minutos: una idea, una misión para tocar en el teclado o en el pentagrama y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: el teclado, leer notas, ritmo, intervalos, escalas y tonalidades, y acordes y armonía. {progress}</p>\n<h2>Cómo funcionan las misiones</h2>\n<ul><li><b>Misiones de teclado</b>: encontrar notas, tocar escalas en orden o responder nota a nota lo que muestra el pentagrama.</li><li><b>Misiones de construir</b>: seleccionar teclas para formar intervalos, escalas y acordes; la app comprueba las notas y, en las inversiones, el bajo.</li><li><b>Misiones de ritmo</b>: llenar un compás con figuras y silencios hasta que cuadre y cumpla la meta.</li><li><b>Misiones de oído</b>: escuchar y decidir, con la opción de mostrar las teclas y contar.</li></ul>\n<h2>Las herramientas</h2>\n<p>El teclado, la partitura y el sonido están dentro de esta página: el pentagrama se dibuja con gráficos vectoriales y el piano se sintetiza con la Web Audio API en tu navegador, así que todo funciona sin conexión y no se envía nada. El Laboratorio tiene un piano que nombra cualquier intervalo o acorde, todas las escalas y acordes en todas las tonalidades y un metrónomo con marcación de tempo.</p>\n<h2>Nombres de las notas</h2>\n<p>En español usamos el solfeo (Do Re Mi Fa Sol La Si); los cifrados usan letras (C, Dm, G7) en todos los idiomas. Las octavas siguen la convención científica: el Do central es Do4 (C4) y el La de afinación es La4 = 440 Hz.</p>\n<h2>Parte de Microlearn</h2>\n<p>Music.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"microlearn.website.html\">www.microlearn.website</a>.</p>"};</script>

const DATA = {"tracks":[{"id":"keys","level":"beginner","icon":"keys","name":{"en":"The keyboard","pt":"O teclado","es":"El teclado"},"desc":{"en":"Note names, black keys, half steps and octaves.","pt":"Nomes das notas, teclas pretas, semitons e oitavas.","es":"Nombres de las notas, teclas negras, semitonos y octavas."}},{"id":"read","level":"beginner","icon":"staff","name":{"en":"Reading notes","pt":"Lendo notas","es":"Leer notas"},"desc":{"en":"Treble and bass clefs, ledger lines and accidentals on the staff.","pt":"Claves de sol e de fá, linhas suplementares e acidentes na pauta.","es":"Claves de sol y de fa, líneas adicionales y alteraciones en el pentagrama."}},{"id":"rhythm","level":"beginner","icon":"rhythm","name":{"en":"Rhythm","pt":"Ritmo","es":"Ritmo"},"desc":{"en":"Beat and tempo, note values, time signatures, dots and rests.","pt":"Pulso e andamento, figuras, fórmulas de compasso, pontos e pausas.","es":"Pulso y tempo, figuras, compases, puntillos y silencios."}},{"id":"intervals","level":"intermediate","icon":"interval","name":{"en":"Intervals","pt":"Intervalos","es":"Intervalos"},"desc":{"en":"Steps, interval numbers, major and minor thirds, fourths, fifths and the tritone.","pt":"Tons e semitons, números de intervalo, terças maiores e menores, quartas, quintas e o trítono.","es":"Tonos y semitonos, números de intervalo, terceras mayores y menores, cuartas, quintas y el tritono."}},{"id":"scales","level":"intermediate","icon":"scale","name":{"en":"Scales and keys","pt":"Escalas e tonalidades","es":"Escalas y tonalidades"},"desc":{"en":"Major and minor scales, key signatures, the circle of fifths and the pentatonic scale.","pt":"Escalas maiores e menores, armaduras de clave, o ciclo das quintas e a pentatônica.","es":"Escalas mayores y menores, armaduras, el círculo de quintas y la pentatónica."}},{"id":"chords","level":"advanced","icon":"chord","name":{"en":"Chords and harmony","pt":"Acordes e harmonia","es":"Acordes y armonía"},"desc":{"en":"Triads, inversions, seventh chords and the progressions behind most songs.","pt":"Tríades, inversões, acordes de sétima e as progressões por trás da maioria das músicas.","es":"Tríadas, inversiones, acordes de séptima y las progresiones detrás de casi todas las canciones."}}],"lessons":[{"id":"names","track":"keys","mins":3,"title":{"en":"White keys and note names","pt":"Teclas brancas e nomes das notas","es":"Teclas blancas y nombres de las notas"},"intro":{"en":"Music uses only seven note names, repeated over and over: C D E F G A B. On a piano they are the white keys, and the black keys, in groups of two and three, show you where you are.","pt":"A música usa só sete nomes de notas, que se repetem: Dó Ré Mi Fá Sol Lá Si. Nas cifras e em inglês elas são C D E F G A B. No piano são as teclas brancas, e as teclas pretas, em grupos de duas e de três, mostram onde você está.","es":"La música usa solo siete nombres de notas, que se repiten: Do Re Mi Fa Sol La Si. En los cifrados y en inglés son C D E F G A B. En el piano son las teclas blancas, y las negras, en grupos de dos y de tres, te dicen dónde estás."},"ideas":[{"en":"**C** is the white key just left of each group of **two** black keys.","pt":"**Dó (C)** é a tecla branca logo à esquerda de cada grupo de **duas** teclas pretas.","es":"**Do (C)** es la tecla blanca justo a la izquierda de cada grupo de **dos** teclas negras."},{"en":"**F** is the white key just left of each group of **three** black keys.","pt":"**Fá (F)** é a tecla branca logo à esquerda de cada grupo de **três** teclas pretas.","es":"**Fa (F)** es la tecla blanca justo a la izquierda de cada grupo de **tres** teclas negras."},{"en":"After B the names start again at C, one octave higher.","pt":"Depois do Si os nomes recomeçam no Dó, uma oitava acima.","es":"Después del Si los nombres vuelven a empezar en Do, una octava más arriba."}],"mission":{"kind":"find","mode":"set","range":["C4","C6"],"targets":["C4","F4","C5","F5","C6"],"labels":false,"prompt":{"en":"Find and press **every C and every F** on this keyboard (there are five). The labels are hidden: use the black keys.","pt":"Ache e toque **todos os Dós (C) e todos os Fás (F)** deste teclado (são cinco). Os nomes estão escondidos: use as teclas pretas.","es":"Encuentra y pulsa **todos los Do (C) y todos los Fa (F)** de este teclado (son cinco). Los nombres están ocultos: usa las teclas negras."},"hint":{"en":"C sits left of the pairs of black keys, F left of the groups of three. The last key on the right is a C too.","pt":"O Dó fica à esquerda das duplas de teclas pretas, o Fá à esquerda dos trios. A última tecla da direita também é um Dó.","es":"El Do está a la izquierda de las parejas de teclas negras, el Fa a la izquierda de los tríos. La última tecla de la derecha también es un Do."}},"quiz":{"q":{"en":"Which note comes right after G?","pt":"Que nota vem logo depois do Sol (G)?","es":"¿Qué nota viene justo después del Sol (G)?"},"options":[{"en":"A","pt":"Lá (A)","es":"La (A)"},{"en":"H","pt":"Si (B)","es":"Si (B)"},{"en":"C","pt":"Dó (C)","es":"Do (C)"}],"answer":0,"explain":{"en":"The order is C D E F G A B, then C again. (Only in German music texts is B called H.)","pt":"A ordem é Dó Ré Mi Fá Sol Lá Si (C D E F G A B), e volta ao Dó.","es":"El orden es Do Re Mi Fa Sol La Si (C D E F G A B), y vuelve al Do."}},"note":{"en":"","pt":"**No Brasil:** nas partituras se fala Dó, Ré, Mi…, mas nas cifras de violão e teclado se usam as letras: C = Dó, D = Ré, E = Mi, F = Fá, G = Sol, A = Lá, B = Si. O Music.Micro mostra os dois.","es":"**En los cifrados** de guitarra y teclado se usan las letras: C = Do, D = Re, E = Mi, F = Fa, G = Sol, A = La, B = Si. Music.Micro muestra ambos."}},{"id":"black","track":"keys","mins":3,"title":{"en":"Sharps and flats","pt":"Sustenidos e bemóis","es":"Sostenidos y bemoles"},"intro":{"en":"A black key takes its name from its neighbours. Going up from C you reach C sharp (C♯); going down from D you reach D flat (D♭). They are the same key: two names for one sound.","pt":"Uma tecla preta recebe o nome das vizinhas. Subindo a partir do Dó você chega ao Dó sustenido (Dó♯); descendo a partir do Ré você chega ao Ré bemol (Ré♭). É a mesma tecla: dois nomes para um som.","es":"Una tecla negra toma su nombre de sus vecinas. Subiendo desde Do llegas a Do sostenido (Do♯); bajando desde Re llegas a Re bemol (Re♭). Es la misma tecla: dos nombres para un sonido."},"ideas":[{"en":"**Sharp ♯** raises a note by one half step; **flat ♭** lowers it by one half step.","pt":"**Sustenido ♯** sobe a nota meio tom; **bemol ♭** desce meio tom.","es":"**Sostenido ♯** sube la nota un semitono; **bemol ♭** la baja un semitono."},{"en":"Two names for the same key (C♯ = D♭) are called **enharmonic**.","pt":"Dois nomes para a mesma tecla (Dó♯ = Ré♭) são **enarmônicos**.","es":"Dos nombres para la misma tecla (Do♯ = Re♭) son **enarmónicos**."},{"en":"E–F and B–C have no black key between them.","pt":"Entre Mi e Fá e entre Si e Dó não há tecla preta.","es":"Entre Mi y Fa y entre Si y Do no hay tecla negra."}],"mission":{"kind":"find","mode":"set","range":["C4","C6"],"targets":["C#4","Eb4","F#4","Ab4","Bb4"],"labels":true,"prompt":{"en":"In the first octave (from the leftmost C), press **C♯, E♭, F♯, A♭ and B♭**.","pt":"Na primeira oitava (a partir do Dó da esquerda), toque **Dó♯, Mi♭, Fá♯, Lá♭ e Si♭** (C♯, E♭, F♯, A♭, B♭).","es":"En la primera octava (desde el Do de la izquierda), pulsa **Do♯, Mi♭, Fa♯, La♭ y Si♭** (C♯, E♭, F♯, A♭, B♭)."},"hint":{"en":"Sharp = the black key to the right; flat = the black key to the left. Together they are all five black keys of that octave.","pt":"Sustenido = a tecla preta à direita; bemol = a tecla preta à esquerda. Juntas são as cinco teclas pretas dessa oitava.","es":"Sostenido = la tecla negra a la derecha; bemol = la tecla negra a la izquierda. Juntas son las cinco teclas negras de esa octava."}},"quiz":{"q":{"en":"Which is another name for G♯?","pt":"Qual é outro nome para Sol♯ (G♯)?","es":"¿Cuál es otro nombre de Sol♯ (G♯)?"},"options":[{"en":"A♭","pt":"Lá♭ (A♭)","es":"La♭ (A♭)"},{"en":"G♭","pt":"Sol♭ (G♭)","es":"Sol♭ (G♭)"},{"en":"A♯","pt":"Lá♯ (A♯)","es":"La♯ (A♯)"}],"answer":0,"explain":{"en":"G♯ is one half step above G, and that same key is one half step below A: A♭.","pt":"Sol♯ fica meio tom acima do Sol, e essa mesma tecla fica meio tom abaixo do Lá: Lá♭.","es":"Sol♯ está un semitono por encima de Sol, y esa misma tecla está un semitono por debajo de La: La♭."}}},{"id":"halfsteps","track":"keys","mins":3,"title":{"en":"Half steps","pt":"Semitons","es":"Semitonos"},"intro":{"en":"The smallest distance on the keyboard is the half step (semitone): from one key to the very next, black or white. An octave has twelve of them.","pt":"A menor distância no teclado é o semitom (meio tom): de uma tecla para a vizinha, preta ou branca. Uma oitava tem doze.","es":"La distancia más pequeña del teclado es el semitono: de una tecla a la siguiente, negra o blanca. Una octava tiene doce."},"ideas":[{"en":"Every key to the next key = one half step.","pt":"De cada tecla para a seguinte = um semitom.","es":"De cada tecla a la siguiente = un semitono."},{"en":"Two half steps make a **whole step** (tone): C to D, E to F♯.","pt":"Dois semitons formam um **tom**: Dó a Ré, Mi a Fá♯.","es":"Dos semitonos forman un **tono**: Do a Re, Mi a Fa♯."},{"en":"Playing all twelve in order gives the **chromatic scale**.","pt":"Tocar os doze em ordem dá a **escala cromática**.","es":"Tocar los doce en orden da la **escala cromática**."}],"mission":{"kind":"find","mode":"seq","range":["C4","C6"],"targets":["C4","C#4","D4","D#4","E4","F4","F#4","G4","G#4","A4","A#4","B4","C5"],"labels":true,"prompt":{"en":"Climb from the first **C** to the next **C**, one half step at a time: every key, black and white, in order.","pt":"Suba do primeiro **Dó** ao próximo **Dó**, de semitom em semitom: todas as teclas, pretas e brancas, em ordem.","es":"Sube del primer **Do** al siguiente **Do**, semitono a semitono: todas las teclas, negras y blancas, en orden."},"hint":{"en":"Do not skip black keys, and remember E→F and B→C are neighbours.","pt":"Não pule teclas pretas, e lembre que Mi→Fá e Si→Dó são vizinhas.","es":"No te saltes teclas negras, y recuerda que Mi→Fa y Si→Do son vecinas."}},"quiz":{"q":{"en":"How many half steps are there in one octave?","pt":"Quantos semitons há numa oitava?","es":"¿Cuántos semitonos hay en una octava?"},"options":["12","7","8"],"answer":0,"explain":{"en":"Seven white keys plus five black keys: twelve half steps from C to the next C.","pt":"Sete teclas brancas mais cinco pretas: doze semitons de um Dó ao próximo.","es":"Siete teclas blancas más cinco negras: doce semitonos de un Do al siguiente."}}},{"id":"octaves","track":"keys","mins":3,"title":{"en":"Octaves and middle C","pt":"Oitavas e o Dó central","es":"Octavas y el Do central"},"intro":{"en":"Notes with the same name sound alike even when they are far apart: they are octaves. To tell them apart we add a number. Middle C, near the centre of the piano, is C4.","pt":"Notas com o mesmo nome soam parecidas mesmo longe uma da outra: são oitavas. Para distinguir, juntamos um número. O Dó central, perto do meio do piano, é o Dó4 (C4).","es":"Las notas con el mismo nombre suenan parecidas aunque estén lejos: son octavas. Para distinguirlas añadimos un número. El Do central, cerca del centro del piano, es el Do4 (C4)."},"ideas":[{"en":"An octave up doubles the frequency: A4 = 440 Hz, A5 = 880 Hz.","pt":"Uma oitava acima dobra a frequência: Lá4 = 440 Hz, Lá5 = 880 Hz.","es":"Una octava arriba duplica la frecuencia: La4 = 440 Hz, La5 = 880 Hz."},{"en":"The number changes at every C: B3 is followed by C4.","pt":"O número muda a cada Dó: depois do Si3 vem o Dó4.","es":"El número cambia en cada Do: después de Si3 viene Do4."},{"en":"A4 is the tuning note orchestras use.","pt":"O Lá4 é a nota de afinação das orquestras.","es":"El La4 es la nota con la que afinan las orquestas."}],"mission":{"kind":"find","mode":"seq","range":["C3","C6"],"targets":["A4","A5","A3"],"labels":true,"octaves":true,"prompt":{"en":"Play **A4** (the tuning A), then the A **one octave higher**, then the A **one octave lower** than A4.","pt":"Toque o **Lá4** (o Lá de afinação), depois o Lá **uma oitava acima** e então o Lá **uma oitava abaixo** do Lá4.","es":"Toca el **La4** (el La de afinación), luego el La **una octava más arriba** y después el La **una octava más abajo** que el La4."},"hint":{"en":"The labels show the octave number. A4 is in the middle of this keyboard; A5 and A3 are twelve keys to the right and left.","pt":"Os nomes mostram o número da oitava. O Lá4 está no meio deste teclado; Lá5 e Lá3 ficam doze teclas à direita e à esquerda.","es":"Las etiquetas muestran el número de octava. El La4 está en el centro de este teclado; La5 y La3 están doce teclas a la derecha y a la izquierda."}},"quiz":{"q":{"en":"A4 vibrates at 440 Hz. What is the frequency of A3?","pt":"O Lá4 vibra a 440 Hz. Qual a frequência do Lá3?","es":"El La4 vibra a 440 Hz. ¿Cuál es la frecuencia del La3?"},"options":["220 Hz","880 Hz","430 Hz"],"answer":0,"explain":{"en":"One octave down halves the frequency: 440 ÷ 2 = 220 Hz.","pt":"Uma oitava abaixo corta a frequência pela metade: 440 ÷ 2 = 220 Hz.","es":"Una octava abajo divide la frecuencia por dos: 440 ÷ 2 = 220 Hz."}}},{"id":"treble","track":"read","mins":4,"title":{"en":"The treble clef","pt":"A clave de sol","es":"La clave de sol"},"intro":{"en":"Music is written on a staff of five lines. The treble clef (G clef) curls around the second line from the bottom and names it G4. Every line and every space is one letter higher than the one below.","pt":"A música é escrita numa pauta de cinco linhas. A clave de sol se enrola na segunda linha de baixo para cima e diz que ali é o Sol4. Cada linha e cada espaço é uma nota acima do anterior.","es":"La música se escribe en un pentagrama de cinco líneas. La clave de sol se enrosca en la segunda línea desde abajo y dice que allí está el Sol4. Cada línea y cada espacio es una nota más aguda que el anterior."},"ideas":[{"en":"Lines, bottom to top: **E G B D F** (Every Good Boy Does Fine).","pt":"Linhas, de baixo para cima: **Mi Sol Si Ré Fá**.","es":"Líneas, de abajo arriba: **Mi Sol Si Re Fa**."},{"en":"Spaces, bottom to top: **F A C E** (it spells FACE).","pt":"Espaços, de baixo para cima: **Fá Lá Dó Mi**.","es":"Espacios, de abajo arriba: **Fa La Do Mi**."},{"en":"Higher on the staff = higher sound = further right on the piano.","pt":"Mais alto na pauta = som mais agudo = mais à direita no piano.","es":"Más arriba en el pentagrama = sonido más agudo = más a la derecha en el piano."}],"mission":{"kind":"rounds","range":["C4","C6"],"clef":"treble","labels":false,"rounds":[{"show":"E4","answer":"E4"},{"show":"A4","answer":"A4"},{"show":"C5","answer":"C5"},{"show":"G4","answer":"G4"},{"show":"F5","answer":"F5"},{"show":"D5","answer":"D5"}],"prompt":{"en":"Read each note on the treble staff and press the **same key** on the piano (the right octave counts). Six notes.","pt":"Leia cada nota na clave de sol e toque a **mesma tecla** no piano (a oitava certa conta). São seis notas.","es":"Lee cada nota en clave de sol y pulsa la **misma tecla** en el piano (la octava correcta cuenta). Son seis notas."},"hint":{"en":"The bottom line is E4, the E just right of middle C's D. The first C of this keyboard is middle C (C4), just below the staff.","pt":"A linha de baixo é o Mi4. O primeiro Dó deste teclado é o Dó central (Dó4), logo abaixo da pauta.","es":"La línea de abajo es Mi4. El primer Do de este teclado es el Do central (Do4), justo debajo del pentagrama."}},"quiz":{"q":{"en":"Which note sits on the middle line of the treble staff?","pt":"Que nota fica na linha do meio da clave de sol?","es":"¿Qué nota está en la línea central de la clave de sol?"},"options":[{"en":"B","pt":"Si","es":"Si"},{"en":"C","pt":"Dó","es":"Do"},{"en":"A","pt":"Lá","es":"La"}],"answer":0,"explain":{"en":"Lines are E G B D F: the third one, the middle, is B (B4).","pt":"As linhas são Mi Sol Si Ré Fá: a terceira, do meio, é o Si (Si4).","es":"Las líneas son Mi Sol Si Re Fa: la tercera, la del medio, es Si (Si4)."}}},{"id":"bass","track":"read","mins":4,"title":{"en":"The bass clef","pt":"A clave de fá","es":"La clave de fa"},"intro":{"en":"Low notes are written in the bass clef (F clef). Its two dots surround the fourth line, which is F3. Left hand on the piano, cellos, bass guitar and low voices read in this clef.","pt":"As notas graves são escritas na clave de fá. Seus dois pontos cercam a quarta linha, que é o Fá3. A mão esquerda do piano, violoncelos, contrabaixos e vozes graves leem nessa clave.","es":"Las notas graves se escriben en clave de fa. Sus dos puntos rodean la cuarta línea, que es Fa3. La mano izquierda del piano, los violonchelos, el bajo y las voces graves leen en esta clave."},"ideas":[{"en":"Lines, bottom to top: **G B D F A** (Good Boys Do Fine Always).","pt":"Linhas, de baixo para cima: **Sol Si Ré Fá Lá**.","es":"Líneas, de abajo arriba: **Sol Si Re Fa La**."},{"en":"Spaces, bottom to top: **A C E G** (All Cows Eat Grass).","pt":"Espaços, de baixo para cima: **Lá Dó Mi Sol**.","es":"Espacios, de abajo arriba: **La Do Mi Sol**."},{"en":"Middle C sits one ledger line **above** the bass staff and one **below** the treble staff.","pt":"O Dó central fica numa linha suplementar **acima** da clave de fá e **abaixo** da clave de sol.","es":"El Do central está en una línea adicional **encima** de la clave de fa y **debajo** de la clave de sol."}],"mission":{"kind":"rounds","range":["C2","C4"],"clef":"bass","labels":false,"rounds":[{"show":"G2","answer":"G2"},{"show":"D3","answer":"D3"},{"show":"C3","answer":"C3"},{"show":"A3","answer":"A3"},{"show":"F3","answer":"F3"},{"show":"B2","answer":"B2"}],"prompt":{"en":"Read each note in the **bass clef** and press it on this lower keyboard (C2 to C4). Six notes.","pt":"Leia cada nota na **clave de fá** e toque no teclado grave (Dó2 a Dó4). São seis notas.","es":"Lee cada nota en **clave de fa** y tócala en este teclado grave (Do2 a Do4). Son seis notas."},"hint":{"en":"The fourth line, between the dots, is F3. The last key on the right is middle C (C4).","pt":"A quarta linha, entre os pontos, é o Fá3. A última tecla da direita é o Dó central (Dó4).","es":"La cuarta línea, entre los puntos, es Fa3. La última tecla de la derecha es el Do central (Do4)."}},"quiz":{"q":{"en":"Which note is on the bottom line of the bass staff?","pt":"Que nota fica na linha de baixo da clave de fá?","es":"¿Qué nota está en la línea de abajo de la clave de fa?"},"options":[{"en":"G","pt":"Sol","es":"Sol"},{"en":"E","pt":"Mi","es":"Mi"},{"en":"F","pt":"Fá","es":"Fa"}],"answer":0,"explain":{"en":"Bass lines are G B D F A, so the bottom one is G2. (E is the bottom line of the treble clef.)","pt":"As linhas da clave de fá são Sol Si Ré Fá Lá: a de baixo é o Sol2. (Mi é a linha de baixo da clave de sol.)","es":"Las líneas de la clave de fa son Sol Si Re Fa La: la de abajo es Sol2. (Mi es la línea de abajo de la clave de sol.)"}}},{"id":"ledger","track":"read","mins":4,"title":{"en":"Ledger lines and middle C","pt":"Linhas suplementares e o Dó central","es":"Líneas adicionales y el Do central"},"intro":{"en":"When a note is too high or too low for the staff, short extra lines called ledger lines extend it. They follow the same pattern: line, space, line, space.","pt":"Quando a nota é aguda ou grave demais para a pauta, pequenas linhas extras, as linhas suplementares, ampliam a pauta. Elas seguem o mesmo padrão: linha, espaço, linha, espaço.","es":"Cuando una nota es demasiado aguda o grave para el pentagrama, unas líneas cortas llamadas líneas adicionales lo amplían. Siguen el mismo patrón: línea, espacio, línea, espacio."},"ideas":[{"en":"Middle C (C4) is on the **first ledger line below** the treble staff.","pt":"O Dó central (Dó4) fica na **primeira linha suplementar abaixo** da clave o justo debajo es una nota más grave: Si3."}}},{"id":"accidentals","track":"read","mins":4,"title":{"en":"Accidentals on the staff","pt":"Acidentes na pauta","es":"Alteraciones en el pentagrama"},"intro":{"en":"Sharps, flats and naturals written before a note are accidentals. They change that note, and every repeat of it on the same line or space, until the end of the bar.","pt":"Sustenidos, bemóis e bequadros escritos antes de uma nota são acidentes. Eles alteram a nota, e as repetições dela na mesma linha ou espaço, até o fim do compasso.","es":"Los sostenidos, bemoles y becuadros escritos antes de una nota son alteraciones accidentales. Cambian esa nota, y sus repeticiones en la misma línea o espacio, hasta el final del compás."},"ideas":[{"en":"The sign goes **before** the note on the staff, though we say it after: F♯.","pt":"O sinal vem **antes** da nota na pauta, mas falamos depois: Fá♯.","es":"El signo va **antes** de la nota en el pentagrama, aunque lo decimos después: Fa♯."},{"en":"A **natural ♮** cancels a sharp or flat.","pt":"O **bequadro ♮** cancela um sustenido ou bemol.","es":"El **becuadro ♮** anula un sostenido o un bemol."},{"en":"Accidentals last only until the next bar line.","pt":"O acidente vale só até a próxima barra de compasso.","es":"La alteración solo dura hasta la siguiente barra de compás."}],"mission":{"kind":"rounds","range":["C4","C6"],"clef":"treble","labels":false,"rounds":[{"show":"F#4","answer":"F#4"},{"show":"Bb4","answer":"Bb4"},{"show":"C#5","answer":"C#5"},{"show":"Eb5","answer":"Eb5"},{"show":"Ab4","answer":"Ab4"}],"prompt":{"en":"Each note has an accidental. Read it and press the **black key** it names. Five notes.","pt":"Cada nota tem um acidente. Leia e toque a **tecla preta** correspondente. São cinco notas.","es":"Cada nota tiene una alteración. Léela y pulsa la **tecla negra** que indica. Son cinco notas."},"hint":{"en":"Find the white note first, then move one key right for ♯ or one key left for ♭.","pt":"Ache primeiro a nota branca, depois ande uma tecla para a direita no ♯ ou para a esquerda no ♭.","es":"Encuentra primero la nota blanca y luego muévete una tecla a la derecha con ♯ o a la izquierda con ♭."}},"quiz":{"q":{"en":"Which sign cancels a sharp earlier in the same bar?","pt":"Que sinal cancela um sustenido escrito antes no mesmo compasso?","es":"¿Qué signo anula un sostenido anterior en el mismo compás?"},"options":[{"en":"Natural ♮","pt":"Bequadro ♮","es":"Becuadro ♮"},{"en":"Flat ♭","pt":"Bemol ♭","es":"Bemol ♭"},{"en":"Double sharp 𝄪","pt":"Dobrado sustenido 𝄪","es":"Doble sostenido 𝄪"}],"answer":0,"explain":{"en":"The natural sign brings the note back to its plain white-key letter.","pt":"O bequadro devolve a nota ao seu nome natural, sem alteração.","es":"El becuadro devuelve la nota a su nombre natural, sin alteración."}}},{"id":"beat","track":"rhythm","mins":3,"title":{"en":"Beat and tempo","pt":"Pulso e andamento","es":"Pulso y tempo"},"intro":{"en":"The beat is the steady pulse you tap your foot to. Tempo is how fast it goes, measured in beats per minute (BPM). At 60 BPM each beat lasts one second.","pt":"O pulso é a batida regular que você marca com o pé. O andamento é a velocidade desse pulso, medida em batidas por minuto (BPM). A 60 BPM cada batida dura um segundo.","es":"El pulso es el latido regular que marcas con el pie. El tempo es su velocidad, medida en pulsos por minuto (BPM). A 60 BPM cada pulso dura un segundo."},"ideas":[{"en":"Seconds per beat = 60 ÷ BPM.","pt":"Segundos por batida = 60 ÷ BPM.","es":"Segundos por pulso = 60 ÷ BPM."},{"en":"Italian words describe tempo: **adagio** (slow), **moderato**, **allegro** (fast).","pt":"Palavras italianas descrevem o andamento: **adagio** (lento), **moderato**, **allegro** (rápido).","es":"Palabras italianas describen el tempo: **adagio** (lento), **moderato**, **allegro** (rápido)."},{"en":"A metronome clicks the beat so you can practise steadily.","pt":"O metrônomo marca o pulso para você praticar com regularidade.","es":"El metrónomo marca el pulso para practicar con regularidad."}],"mission":{"kind":"tempo","goal":120,"beats":4,"start":72,"prompt":{"en":"Set the tempo so that **4 beats last exactly 2 seconds**. Press play to hear it.","pt":"Ajuste o andamento para que **4 batidas durem exatamente 2 segundos**. Aperte o play para ouvir.","es":"Ajusta el tempo para que **4 pulsos duren exactamente 2 segundos**. Pulsa reproducir para oírlo."},"hint":{"en":"2 seconds ÷ 4 beats = 0.5 s per beat. How many half-seconds fit in a minute?","pt":"2 segundos ÷ 4 batidas = 0,5 s por batida. Quantos meios segundos cabem num minuto?","es":"2 segundos ÷ 4 pulsos = 0,5 s por pulso. ¿Cuántos medios segundos caben en un minuto?"}},"quiz":{"q":{"en":"At 60 BPM, how long is one beat?","pt":"A 60 BPM, quanto dura uma batida?","es":"A 60 BPM, ¿cuánto dura un pulso?"},"options":[{"en":"1 second","pt":"1 segundo","es":"1 segundo"},{"en":"0.5 seconds","pt":"0,5 segundo","es":"0,5 segundos"},{"en":"60 seconds","pt":"60 segundos","es":"60 segundos"}],"answer":0,"explain":{"en":"60 beats in 60 seconds: one beat per second.","pt":"60 batidas em 60 segundos: uma batida por segundo.","es":"60 pulsos en 60 segundos: un pulso por segundo."}}},{"id":"values","track":"rhythm","mins":4,"title":{"en":"Note values","pt":"Figuras de duração","es":"Figuras de duración"},"intro":{"en":"The shape of a note tells how long it lasts. In 4/4 a quarter note gets one beat, a half note two, a whole note four, and an eighth note half a beat.","pt":"O desenho da nota diz quanto ela dura. Em 4/4 a semínima vale um tempo, a mínima dois, a semibreve quatro e a colcheia meio tempo.","es":"La forma de la nota indica cuánto dura. En 4/4 la negra vale un pulso, la blanca dos, la redonda cuatro y la corchea medio pulso."},"ideas":[{"en":"Whole = 2 halves = 4 quarters = 8 eighths.","pt":"Semibreve = 2 mínimas = 4 semínimas = 8 colcheias.","es":"Redonda = 2 blancas = 4 negras = 8 corcheas."},{"en":"Hollow heads are long (whole, half); filled heads are short (quarter, eighth).","pt":"Cabeças vazadas são longas (semibreve, mínima); cheias são curtas (semínima, colcheia).","es":"Las cabezas huecas son largas (redonda, blanca); las rellenas son cortas (negra, corchea)."},{"en":"A flag on the stem halves the value: quarter → eighth.","pt":"Uma bandeirola na haste corta o valor pela metade: semínima → colcheia.","es":"Un corchete en la plica divide el valor por dos: negra → corchea."}],"mission":{"kind":"rhythm","time":[4,4],"palette":["w","h","q","e"],"goal":{"notes":5},"prompt":{"en":"Fill one bar of **4/4** with **exactly 5 notes**. The bar must add up to 4 beats.","pt":"Preencha um compasso de **4/4** com **exatamente 5 notas**. O compasso precisa somar 4 tempos.","es":"Completa un compás de **4/4** con **exactamente 5 notas**. El compás debe sumar 4 pulsos."},"hint":{"en":"Four quarters are 4 notes. Split one quarter into two eighths.","pt":"Quatro semínimas são 4 notas. Divida uma semínima em duas colcheias.","es":"Cuatro negras son 4 notas. Divide una negra en dos corcheas."}},"quiz":{"q":{"en":"How many eighth notes fill a bar of 4/4?","pt":"Quantas colcheias preenchem um compasso de 4/4?","es":"¿Cuántas corcheas llenan un compás de 4/4?"},"options":["8","4","16"],"answer":0,"explain":{"en":"Each eighth is half a beat: 4 beats × 2 = 8.","pt":"Cada colcheia vale meio tempo: 4 tempos × 2 = 8.","es":"Cada corchea vale medio pulso: 4 pulsos × 2 = 8."}}},{"id":"meter","track":"rhythm","mins":4,"title":{"en":"Time signatures","pt":"Fórmulas de compasso","es":"Indicaciones de compás"},"intro":{"en":"The two numbers at the start of the music are the time signature. The top number says how many beats are in each bar; the bottom says which note gets one beat (4 = quarter note).","pt":"Os dois números no início da música são a fórmula de compasso. O de cima diz quantos tempos há em cada compasso; o de baixo diz qual figura vale um tempo (4 = semínima).","es":"Los dos números al principio de la música son la indicación de compás. El de arriba dice cuántos pulsos hay en cada compás; el de abajo, qué figura vale un pulso (4 = negra)."},"ideas":[{"en":"**4/4**: four beats, most pop and rock songs.","pt":"**4/4**: quatro tempos, a maioria do pop e do rock.","es":"**4/4**: cuatro pulsos, casi todo el pop y el rock."},{"en":"**3/4**: three beats, the waltz: ONE-two-three.","pt":"**3/4**: três tempos, a valsa: UM-dois-três.","es":"**3/4**: tres pulsos, el vals: UN-dos-tres."},{"en":"**2/4**: two beats, marches, samba and many folk dances.","pt":"**2/4**: dois tempos, marchas, samba e muitas danças populares.","es":"**2/4**: dos pulsos, marchas, samba y muchas danzas populares."}],"mission":{"kind":"rhythm","time":[3,4],"palette":["hd","h","q","e"],"goal":{"notes":3,"forbid":["q"]},"prompt":{"en":"Fill one bar of **3/4** with **exactly 3 notes** and **no quarter notes**.","pt":"Preencha um compasso de **3/4** com **exatamente 3 notas** e **nenhuma semínima**.","es":"Completa un compás de **3/4** con **exactamente 3 notas** y **ninguna negra**."},"hint":{"en":"A half note takes 2 of the 3 beats. What fills the last beat with two notes?","pt":"A mínima ocupa 2 dos 3 tempos. O que preenche o último tempo com duas notas?","es":"La blanca ocupa 2 de los 3 pulsos. ¿Qué llena el último pulso con dos notas?"}},"quiz":{"q":{"en":"In 3/4, how many quarter notes fit in one bar?","pt":"Em 3/4, quantas semínimas cabem num compasso?","es":"En 3/4, ¿cuántas negras caben en un compás?"},"options":["3","4","6"],"answer":0,"explain":{"en":"The top number is 3 and the bottom 4 means quarter-note beats: three quarters per bar.","pt":"O 3 de cima são três tempos e o 4 de baixo diz que cada tempo é uma semínima: três por compasso.","es":"El 3 de arriba son tres pulsos y el 4 de abajo dice que cada pulso es una negra: tres por compás."}}},{"id":"dots","track":"rhythm","mins":4,"title":{"en":"Dots and rests","pt":"Pontos e pausas","es":"Puntillos y silencios"},"intro":{"en":"A dot after a note adds half of its value: a dotted half note lasts 2 + 1 = 3 beats. Rests are silences, and each note value has a rest of the same length.","pt":"Um ponto depois da nota soma metade do valor dela: a mínima pontuada dura 2 + 1 = 3 tempos. As pausas são silêncios, e cada figura tem uma pausa com a mesma duração.","es":"Un puntillo después de una nota suma la mitad de su valor: una blanca con puntillo dura 2 + 1 = 3 pulsos. Los silencios son pausas, y cada figura tiene un silencio de la misma duración."},"ideas":[{"en":"Dotted half = 3 beats; dotted quarter = 1½ beats.","pt":"Mínima pontuada = 3 tempos; semínima pontuada = 1½ tempo.","es":"Blanca con puntillo = 3 pulsos; negra con puntillo = 1½ pulsos."},{"en":"Rests count exactly like notes: a bar must still add up.","pt":"Pausas contam como notas: o compasso continua tendo que fechar.","es":"Los silencios cuentan igual que las notas: el compás tiene que cuadrar."},{"en":"A half rest sits **on** the middle line, a whole rest **hangs** from the fourth line.","pt":"A pausa de mínima fica **sobre** a linha do meio; a de semibreve fica **pendurada** na quarta linha.","es":"El silencio de blanca se apoya **sobre** la línea central; el de redonda **cuelga** de la cuarta línea."}],"mission":{"kind":"rhythm","time":[4,4],"palette":["h","hd","q","qd","e","hr","qr","er"],"goal":{"must":["hd"],"minRests":1},"prompt":{"en":"Fill a bar of **4/4** that uses a **dotted half note** and **at least one rest**.","pt":"Preencha um compasso de **4/4** que use uma **mínima pontuada** e **pelo menos uma pausa**.","es":"Completa un compás de **4/4** que use una **blanca con puntillo** y **al menos un silencio**."},"hint":{"en":"The dotted half takes 3 beats. One beat is left for silence.","pt":"A mínima pontuada ocupa 3 tempos. Sobra um tempo para o silêncio.","es":"La blanca con puntillo ocupa 3 pulsos. Queda un pulso para el silencio."}},"quiz":{"q":{"en":"How long is a dotted quarter note?","pt":"Quanto dura uma semínima pontuada?","es":"¿Cuánto dura una negra con puntillo?"},"options":[{"en":"1½ beats","pt":"1½ tempo","es":"1½ pulsos"},{"en":"2 beats","pt":"2 tempos","es":"2 pulsos"},{"en":"1¼ beats","pt":"1¼ tempo","es":"1¼ pulsos"}],"answer":0,"explain":{"en":"1 beat + half of 1 beat = 1½.","pt":"1 tempo + metade de 1 tempo = 1½.","es":"1 pulso + la mitad de 1 pulso = 1½."}}},{"id":"steps","track":"intervals","mins":4,"title":{"en":"Whole steps and half steps","pt":"Tons e semitons","es":"Tonos y semitonos"},"intro":{"en":"Melodies move in steps. A half step goes to the very next key; a whole step skips one key. Notice that a whole step up from E is F♯, because E and F are only a half step apart.","pt":"Melodias andam por graus. Um semitom vai para a tecla vizinha; um tom pula uma tecla. Repare que um tom acima do Mi é o Fá♯, porque Mi e Fá estão a só um semitom.","es":"Las melodías se mueven por grados. Un semitono va a la tecla vecina; un tono se salta una tecla. Fíjate en que un tono por encima de Mi es Fa♯, porque Mi y Fa están a solo un semitono."},"ideas":[{"en":"**Half step** = 1 key; **whole step** = 2 keys.","pt":"**Semitom** = 1 tecla; **tom** = 2 teclas.","es":"**Semitono** = 1 tecla; **tono** = 2 teclas."},{"en":"E→F and B→C are half steps on white keys.","pt":"Mi→Fá e Si→Dó são semitons entre teclas brancas.","es":"Mi→Fa y Si→Do son semitonos entre teclas blancas."},{"en":"Count keys, not white keys.","pt":"Conte teclas, não só as brancas.","es":"Cuenta teclas, no solo las blancas."}],"mission":{"kind":"rounds","range":["C4","C6"],"clef":"treble","labels":true,"rounds":[{"given":"E4","answer":"F#4","semis":2,"q":{"en":"A **whole step up** from E4","pt":"Um **tom acima** do Mi4","es":"Un **tono por encima** de Mi4"}},{"given":"B4","answer":"C5","semis":1,"q":{"en":"A **half step up** from B4","pt":"Um **semitom acima** do Si4","es":"Un **semitono por encima** de Si4"}},{"given":"F4","answer":"Eb4","semis":-2,"q":{"en":"A **whole step down** from F4","pt":"Um **tom abaixo** do Fá  4, 4th = 5, 5th = 7, 6th = 9, octave = 12.","pt":"Conte semitons: 3ª = 4, 4ª = 5, 5ª = 7, 6ª = 9, oitava = 12.","es":"Cuenta semitonos: 3.ª = 4, 4.ª = 5, 5.ª = 7, 6.ª = 9, octava = 12."}},"quiz":{"q":{"en":"C up to G is which interval number?","pt":"De Dó até Sol é que intervalo?","es":"De Do a Sol, ¿qué intervalo es?"},"options":[{"en":"A 5th","pt":"Uma 5ª","es":"Una 5.ª"},{"en":"A 4th","pt":"Uma 4ª","es":"Una 4.ª"},{"en":"A 7th","pt":"Uma 7ª","es":"Una 7.ª"}],"answer":0,"explain":{"en":"C-D-E-F-G is five letter names, so it is a 5th (a perfect 5th: 7 half steps).","pt":"Dó-Ré-Mi-Fá-Sol são cinco nomes: é uma 5ª (justa, 7 semitons).","es":"Do-Re-Mi-Fa-Sol son cinco nombres: es una 5.ª (justa, 7 semitonos)."}}},{"id":"thirds","track":"intervals","mins":4,"title":{"en":"Major and minor thirds","pt":"Terças maiores e menores","es":"Terceras mayores y menores"},"intro":{"en":"Thirds are the building blocks of chords. A major third (4 half steps) sounds bright; a minor third (3 half steps) sounds darker. Train your ear to tell them apart.","pt":"As terças são os tijolos dos acordes. A terça maior (4 semitons) soa brilhante; a terça menor (3 semitons) soa mais escura. Treine o ouvido para diferenciar.","es":"Las terceras son los ladrillos de los acordes. La tercera mayor (4 semitonos) suena brillante; la menor (3 semitonos), más oscura. Entrena el oído para distinguirlas."},"ideas":[{"en":"**Major 3rd**: C–E, F–A, G–B (4 half steps).","pt":"**3ª maior**: Dó–Mi, Fá–Lá, Sol–Si (4 semitons).","es":"**3.ª mayor**: Do–Mi, Fa–La, Sol–Si (4 semitonos)."},{"en":"**Minor 3rd**: D–F, E–G, A–C (3 half steps).","pt":"**3ª menor**: Ré–Fá, Mi–Sol, Lá–Dó (3 semitons).","es":"**3.ª menor**: Re–Fa, Mi–Sol, La–Do (3 semitonos)."},{"en":"Can't hear it yet? Reveal the keys and count.","pt":"Ainda não ouve a diferença? Mostre as teclas e conte.","es":"¿Aún no oyes la diferencia? Muestra las teclas y cuenta."}],"mission":{"kind":"ask","ear":true,"range":["C4","C6"],"rounds":[{"play":["C4","E os. Entre elas fica o trítono, seis semitons, tenso e instável.","es":"Las cuartas y quintas se llaman justas: suenan abiertas y estables, por eso los power chords y la afinación las usan. Entre ellas está el tritono, seis semitonos, tenso e inestable."},"ideas":[{"en":"Perfect 4th = 5 half steps; perfect 5th = 7; tritone = 6.","pt":"4ª justa = 5 semitons; 5ª justa = 7; trítono = 6.","es":"4.ª justa = 5 semitonos; 5.ª justa = 7; tritono = 6."},{"en":"Almost every white-key 5th is perfect, except **B–F**, which is a tritone.","pt":"Quase toda 5ª entre teclas brancas é justa, menos **Si–Fá**, que é um trítono.","es":"Casi todas las 5.ª entre teclas blancas son justas, menos **Si–Fa**, que es un tritono."},{"en":"So a perfect 5th above B needs a sharp: F♯.","pt":"Por isso a 5ª justa acima do Si precisa de sustenido: Fá♯.","es":"Por eso la 5.ª justa sobre Si necesita sostenido: Fa♯."}],"mission":{"kind":"rounds","range":["C4","C6"],"clef":"treble","labels":true,"rounds":[{"given":"B4","answer":"F#5","semis":7,"q":{"en":"A **perfect 5th** above B4","pt":"Uma **5ª justa** acima do Si4","es":"Una **5.ª justa** por encima de Si4"}},{"given":"F4","answer":"Bb4","semis":5,"q":{"en":"A **perfect 4th** above F4","pt":"Uma **4ª justa** acima do Fá4","es":"Una **4.ª justa** por encima de Fa4"}},{"given":"F4","answer":"B4","semis":6,"q":{"en":"A **tritone** above F4","pt":"Um **trítono** acima do Fá4","es":"Un **tritono** por encima de Fa4"}},{"given":"Bb4","answer":"F5","semis":7,"q":{"en":"A **perfect 5th** above B♭4","pt":"Uma **5ª justa** acima do Si♭4","es":"Una **5.ª justa** por encima de Si♭4"}}],"prompt":{"en":"Build each interval up from the highlighted key. Watch out for the black keys. Four intervals.","pt":"Monte cada intervalo para cima a partir da tecla destacada. Cuidado com as teclas pretas. São quatro.","es":"Construye cada intervalo hacia arriba desde la tecla resaltada. Ojo con las teclas negras. Son cuatro."},"hint":{"en":"Count: 4th = 5 keys up, tritone = 6, 5th = 7. Don't count by white keys.","pt":"Conte: 4ª = 5 teclas acima, trítono = 6, 5ª = 7. Não conte só as brancas.","es":"Cuenta: 4.ª = 5 teclas arriba, tritono = 6, 5.ª = 7. No cuentes solo las blancas."}},"quiz":{"q":{"en":"Which white-key 5th is NOT perfect?","pt":"Qual quinta entre teclas brancas NÃO é justa?","es":"¿Qué quinta entre teclas blancas NO es justa?"},"options":[{"en":"B–F","pt":"Si–Fá","es":"Si–Fa"},{"en":"D–A","pt":"Ré–Lá","es":"Re–La"},{"en":"E–B","pt":"Mi–Si","es":"Mi–Si"}],"answer":0,"explain":{"en":"B to F is only 6 half steps: a diminished 5th, the tritone.","pt":"De Si a Fá são só 6 semitons: uma 5ª diminuta, o trítono.","es":"De Si a Fa hay solo 6 semitonos: una 5.ª disminuida, el tritono."}}},{"id":"major","track":"scales","mins":4,"title":{"en":"The major scale","pt":"A escala maior","es":"La escala mayor"},"intro":{"en":"The major scale is the do-re-mi you know. Its secret is a fixed pattern of steps: whole, whole, half, whole, whole, whole, half. Start that pattern on any key and you get that key's major scale.","pt":"A escala maior é o dó-ré-mi que você conhece. O segredo é um padrão fixo de passos: tom, tom, semitom, tom, tom, tom, semitom. Comece esse padrão em qualquer tecla e você tem a escala maior daquela nota.","es":"La escala mayor es el do-re-mi que conoces. Su secreto es un patrón fijo de pasos: tono, tono, semitono, tono, tono, tono, semitono. Empieza ese patrón en cualquier tecla y obtendrás su escala mayor."},"ideas":[{"en":"Pattern: **W W H W W W H**.","pt":"Padrão: **T T S T T T S**.","es":"Patrón: **T T S T T T S**."},{"en":"C major uses only white keys. Other keys need sharps or flats to keep the pattern.","pt":"Dó maior usa só teclas brancas. As outras precisam de sustenidos ou bemóis para manter o padrão.","es":"Do mayor usa solo teclas blancas. Las demás necesitan sostenidos o bemoles para mantener el patrón."},{"en":"Each letter is used once: G major has F♯, never G♭.","pt":"Cada letra aparece uma vez: Sol maior te
