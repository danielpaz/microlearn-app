*W H W W H W W**.","pt":"Padrão: **T S T T S T T**.","es":"Patrón: **T S T T S T T**."},{"en":"Compared with major, the 3rd, 6th and 7th notes are lowered.","pt":"Comparada com a maior, a 3ª, a 6ª e a 7ª notas ficam mais baixas.","es":"Comparada con la mayor, la 3.ª, la 6.ª y la 7.ª notas están más bajas."},{"en":"D minor needs one flat: B♭.","pt":"Ré menor precisa de um bemol: Si♭.","es":"Re menor necesita un bemol: Si♭."}],"mission":{"kind":"find","mode":"seq","range":["C4","C6"],"targets":["D4","E4","F4","G4","A4","Bb4","C5","D5"],"labels":true,"staff":true,"prompt":{"en":"Play the **D natural minor scale** going up, from D4 to D5 (8 notes).","pt":"Toque a **escala de Ré menor natural** subindo, do Ré4 ao Ré5 (8 notas).","es":"Toca la **escala de Re menor natural** subiendo, de Re4 a Re5 (8 notas)."},"hint":{"en":"Follow W H W W H W W from D. The 6th note is a black key.","pt":"Siga T S T T S T T a partir do Ré. A 6ª nota é uma tecla preta.","es":"Sigue T S T T S T T desde Re. La 6.ª nota es una tecla negra."}},"quiz":{"q":{"en":"Which scale has the same notes as C major?","pt":"Qual escala tem as mesmas notas de Dó maior?","es":"¿Qué escala tiene las mismas notas que Do mayor?"},"options":[{"en":"A natural minor","pt":"Lá menor natural","es":"La menor natural"},{"en":"C natural minor","pt":"Dó menor natural","es":"Do menor natural"},{"en":"G major","pt":"Sol maior","es":"Sol mayor"}],"answer":0,"explain":{"en":"A minor is the relative minor of C major: same white keys, starting on A.","pt":"Lá menor é a relativa menor de Dó maior: as mesmas teclas brancas, começando no Lá.","es":"La menor es el relativo menor de Do mayor: las mismas teclas blancas, empezando en La."}}},{"id":"keysig","track":"scales","mins":5,"title":{"en":"Key signatures and the circle of fifths","pt":"Armaduras e o ciclo das quintas","es":"Armaduras y el círculo de quintas"},"intro":{"en":"Instead of writing the same sharps or flats on every note, music puts them once at the start of each line: the key signature. The circle of fifths orders all keys: each step clockwise adds one sharp.","pt":"Em vez de escrever os mesmos sustenidos ou bemóis em toda nota, a partitura os coloca uma vez no início de cada linha: a armadura de clave. O ciclo das quintas organiza todas as tonalidades: cada passo no sentido horário soma um sustenido.","es":"En lugar de escribir los mismos sostenidos o bemoles en cada nota, la partitura los pone una vez al principio de cada línea: la armadura. El círculo de quintas ordena todas las tonalidades: cada paso en el sentido del reloj añade un sostenido."},"ideas":[{"en":"Sharps always appear in the order **F C G D A E B**; flats in the reverse **B E A D G C F**.","pt":"Os sustenidos aparecem sempre na ordem **Fá Dó Sol Ré Lá Mi Si**; os bemóis ao contrário, **Si Mi Lá Ré Sol Dó Fá**.","es":"Los sostenidos aparecen siempre en el orden **Fa Do Sol Re La Mi Si**; los bemoles al revés, **Si Mi La Re Sol Do Fa**."},{"en":"Sharp keys: the major key is a half step above the last sharp. Flat keys: it is the second-to-last flat.","pt":"Com sustenidos, a tonalidade maior está meio tom acima do último sustenido. Com bemóis, é o penúltimo bemol.","es":"Con sostenidos, la tonalidad mayor está un semitono por encima del último sostenido. Con bemoles, es el penúltimo bemol."},{"en":"Every major key shares its signature with a **relative minor**, three half steps below.","pt":"Toda tonalidade maior divide a armadura com uma **relativa menor**, três semitons abaixo.","es":"Cada tonalidad mayor comparte armadura con un **relativo menor**, tres semitonos más abajo."}],"mission":{"kind":"ask","circle":true,"rounds":[{"key":3,"q":{"en":"Which **major** key has this signature?","pt":"Que tonalidade **maior** tem esta armadura?","es":"¿Qué tonalidad **mayor** tiene esta armadura?"},"options":[{"en":"A major","pt":"Lá maior","es":"La mayor"},{"en":"E major","pt":"Mi maior","es":"Mi mayor"},{"en":"D major","pt":"Ré maior","es":"Re mayor"}],"answer":0,"check":{"major":3,"is":"A"}},{"key":-2,"q":{"en":"Which **major** key has this signature?","pt":"Que tonalidade **maior** tem esta armadura?","es":"¿Qué tonalidad **mayor** tiene esta armadura?"},"options":[{"en":"F major","pt":"Fá maior","es":"Fa mayor"},{"en":"B♭ major","pt":"Si♭ maior","es":"Si♭ mayor"},{"en":"E♭ major","pt":"Mi♭ maior","es":"Mi♭ mayor"}],"answer":1,"check":{"major":-2,"is":"Bb"}},{"key":1,"q":{"en":"Which **minor** key shares this signature?","pt":"Que tonalidade **menor** tem esta armadura?","es":"¿Qué tonalidad **menor** comparte esta armadura?"},"options":[{"en":"G minor","pt":"Sol menor","es":"Sol menor"},{"en":"B minor","pt":"Si menor","es":"Si menor"},{"en":"E minor","pt":"Mi menor","es":"Mi menor"}],"answer":2,"check":{"minor":1,"is":"E"}}],"prompt":{"en":"Read each key signature and name the key. The circle of fifths can help. Three questions.","pt":"Leia cada armadura e diga a tonalidade. O ciclo das quintas ajuda. São três perguntas.","es":"Lee cada armadura y nombra la tonalidad. El círculo de quintas te ayuda. Son tres preguntas."},"hint":{"en":"Three sharps are F♯ C♯ G♯: a half step above G♯ is A. Two flats are B♭ E♭: the second-to-last is B♭.","pt":"Três sustenidos são Fá♯ Dó♯ Sol♯: meio tom acima do Sol♯ é o Lá. Dois bemóis são Si♭ Mi♭: o penúltimo é o Si♭.","es":"Tres sostenidos son Fa♯ Do♯ Sol♯: un semitono por encima de Sol♯ está La. Dos bemoles son Si♭ Mi♭: el penúltimo es Si♭."}},"quiz":{"q":{"en":"How many sharps does G major have?","pt":"Quantos sustenidos tem Sol maior?","es":"¿Cuántos sostenidos tiene Sol mayor?"},"options":[{"en":"One (F♯)","pt":"Um (Fá♯)","es":"Uno (Fa♯)"},{"en":"Two","pt":"Dois","es":"Dos"},{"en":"None","pt":"Nenhum","es":"Ninguno"}],"answer":0,"explain":{"en":"G is one step clockwise from C on the circle of fifths: one sharp, F♯.","pt":"Sol está um passo depois do Dó no ciclo das quintas: um sustenido, Fá♯.","es":"Sol está un paso después de Do en el círculo de quintas: un sostenido, Fa♯."}}},{"id":"penta","track":"scales","mins":4,"title":{"en":"The pentatonic scale","pt":"A escala pentatônica","es":"La escala pentatónica"},"intro":{"en":"Take the major scale and drop the 4th and 7th notes: five notes with no half steps left. That is the major pentatonic, the sound of folk songs, blues riffs and guitar solos all over the world.","pt":"Pegue a escala maior e tire a 4ª e a 7ª notas: sobram cinco notas, sem nenhum semitom. É a pentatônica maior, o som de canções folclóricas, riffs de blues e solos de guitarra no mundo inteiro.","es":"Toma la escala mayor y quita la 4.ª y la 7.ª notas: quedan cinco notas, sin ningún semitono. Es la pentatónica mayor, el sonido de canciones populares, riffs de blues y solos de guitarra en todo el mundo."},"ideas":[{"en":"Major pentatonic = degrees **1 2 3 5 6**.","pt":"Pentatônica maior = graus **1 2 3 5 6**.","es":"Pentatónica mayor = grados **1 2 3 5 6**."},{"en":"No half steps means no note clashes: any order sounds good.","pt":"Sem semitons não há choques: qualquer ordem soa bem.","es":"Sin semitonos no hay choques: cualquier orden suena bien."},{"en":"The five black keys form a pentatonic scale (G♭ major).","pt":"As cinco teclas pretas formam uma pentatônica (Sol♭ maior).","es":"Las cinco teclas negras forman una pentatónica (Sol♭ mayor)."}],"mission":{"kind":"build","range":["C4","C6"],"targets":[{"set":"scale","root":"C","type":"pentaMaj"},{"set":"scale","root":"G","type":"pentaMaj"}],"prompt":{"en":"Select the five notes of **C major pentatonic**, then of **G major pentatonic** (any octave). Press Check after each.","pt":"Selecione as cinco notas da **pentatônica de Dó maior** e depois da **pentatônica de Sol maior** (qualquer oitava). Aperte Conferir depois de cada uma.","es":"Selecciona las cinco notas de la **pentatónica de Do mayor** y luego de la **pentatónica de Sol mayor** (cualquier octava). Pulsa Comprobar después de cada una."},"hint":{"en":"Write the major scale and remove the 4th and the 7th. In G major those are C and F♯.","pt":"Escreva a escala maior e tire a 4ª e a 7ª. Em Sol maior são o Dó e o Fá♯.","es":"Escribe la escala mayor y quita la 4.ª y la 7.ª. En Sol mayor son Do y Fa♯."}},"quiz":{"q":{"en":"How many notes does a pentatonic scale have?","pt":"Quantas notas tem uma escala pentatônica?","es":"¿Cuántas notas tiene una escala pentatónica?"},"options":["5","7","6"],"answer":0,"explain":{"en":"'Penta' means five.","pt":"'Penta' quer dizer cinco.","es":"'Penta' significa cinco."}}},{"id":"triads","track":"chords","mins":4,"title":{"en":"Major and minor triads","pt":"Tríades maiores e menores","es":"Tríadas mayores y menores"},"intro":{"en":"A triad is three notes stacked in thirds: root, third and fifth. A major third on the bottom makes a major chord; a minor third makes a minor chord. The fifth is perfect in both.","pt":"Uma tríade são três notas empilhadas em terças: fundamental, terça e quinta. Uma terça maior embaixo faz um acorde maior; uma terça menor, um acorde menor. A quinta é justa nos dois.","es":"Una tríada son tres notas apiladas en terceras: fundamental, tercera y quinta. Una tercera mayor abajo da un acorde mayor; una tercera menor, un acorde menor. La quinta es justa en los dos."},"ideas":[{"en":"**Major** = root + 4 + 3 half steps (C E G).","pt":"**Maior** = fundamental + 4 + 3 semitons (Dó Mi Sol).","es":"**Mayor** = fundamental + 4 + 3 semitonos (Do Mi Sol)."},{"en":"**Minor** = root + 3 + 4 half steps (D F A).","pt":"**Menor** = fundamental + 3 + 4 semitons (Ré Fá Lá).","es":"**Menor** = fundamental + 3 + 4 semitonos (Re Fa La)."},{"en":"Chord symbols: **D** = D major, **Dm** = D minor.","pt":"Cifras: **D** = Ré maior, **Dm** = Ré menor.","es":"Cifrado: **D** = Re mayor, **Dm** = Re menor."}],"mission":{"kind":"build","range":["C4","C6"],"targets":[{"set":"chord","root":"D","type":"min"},{"set":"chord","root":"F","type":"maj"},{"set":"chord","root":"E","type":"maj"}],"prompt":{"en":"Build three triads on the keyboard: **Dm**, **F** and **E**. Select the keys, then press Check.","pt":"Monte três tríades no teclado: **Dm**, **F** e **E** (Ré menor, Fá maior e Mi maior). Selecione as teclas e aperte Conferir.","es":"Construye tres tríadas en el teclado: **Dm**, **F** y **E** (Re menor, Fa mayor y Mi mayor). Selecciona las teclas y pulsa Comprobar."},"hint":{"en":"E major needs a black key: E + 4 half steps = G♯.","pt":"Mi maior precisa de uma tecla preta: Mi + 4 semitons = Sol♯.","es":"Mi mayor necesita una tecla negra: Mi + 4 semitonos = Sol♯."}},"quiz":{"q":{"en":"Which notes make A minor?","pt":"Quais notas formam Lá menor (Am)?","es":"¿Qué notas forman La menor (Am)?"},"options":[{"en":"A C E","pt":"Lá Dó Mi","es":"La Do Mi"},{"en":"A C♯ E","pt":"Lá Dó♯ Mi","es":"La Do♯ Mi"},{"en":"A D E","pt":"Lá Ré Mi","es":"La Re Mi"}],"answer":0,"explain":{"en":"A + 3 half steps = C (minor third), + 4 more = E. A C♯ E would be A major.","pt":"Lá + 3 semitons = Dó (terça menor), + 4 = Mi. Lá Dó♯ Mi seria Lá maior.","es":"La + 3 semitonos = Do (tercera menor), + 4 = Mi. La Do♯ Mi sería La mayor."}}},{"id":"inversions","track":"chords","mins":4,"title":{"en":"Inversions","pt":"Inversões","es":"Inversiones"},"intro":{"en":"The notes of a chord can be stacked in any order. The lowest note decides the inversion: root on the bottom is root position, the third on the bottom is first inversion, the fifth on the bottom is second inversion.","pt":"As notas de um acorde podem ser empilhadas em qualquer ordem. A nota mais grave define a inversão: fundamental embaixo é o estado fundamental, terça embaixo é a primeira inversão, quinta embaixo é a segunda inversão.","es":"Las notas de un acorde se pueden apilar en cualquier orden. La nota más grave define la inversión: fundamental abajo es estado fundamental, tercera abajo es primera inversión, quinta abajo es segunda inversión."},"ideas":[{"en":"Inversions keep the chord name but change the colour and make smooth moves between chords.","pt":"As inversões mantêm o nome do acorde, mas mudam a cor e deixam as passagens entre acordes mais suaves.","es":"Las inversiones mantienen el nombre del acorde, pero cambian su color y suavizan los pasos entre acordes."},{"en":"Chord charts write the bass after a slash: **C/E** = C major with E in the bass.","pt":"As cifras escrevem o baixo depois de uma barra: **C/E** = Dó maior com Mi no baixo.","es":"El cifrado escribe el bajo tras una barra: **C/E** = Do mayor con Mi en el bajo."},{"en":"Only the lowest note matters for the inversion; the rest can be in any order.","pt":"Só a nota mais grave define a inversão; as outras podem estar em qualquer ordem.","es":"Solo la nota más grave define la inversión; las demás pueden ir en cualquier orden."}],"mission":{"kind":"build","range":["C4","C6"],"targets":[{"set":"chord","root":"C","type":"maj","bass":"E"},{"set":"chord","root":"G","type":"maj","bass":"D"},{"set":"chord","root":"D","type":"min","bass":"F"}],"prompt":{"en":"Build **C/E** (first inversion), **G/D** (second inversion) and **Dm/F** (first inversion). The lowest key you select is the bass.","pt":"Monte **C/E** (primeira inversão), **G/D** (segunda inversão) e **Dm/F** (primeira inversão). A tecla mais grave selecionada é o baixo.","es":"Construye **C/E** (primera inversión), **G/D** (segunda inversión) y **Dm/F** (primera inversión). La tecla más grave que selecciones es el bajo."},"hint":{"en":"For C/E: start on E, then G, then the C above. Every chord tone once is enough.","pt":"Para C/E: comece no Mi, depois Sol e o Dó acima. Basta cada nota do acorde uma vez.","es":"Para C/E: empieza en Mi, luego Sol y el Do de arriba. Basta cada nota del acorde una vez."}},"quiz":{"q":{"en":"G B D with B in the bass is…","pt":"Sol Si Ré com Si no baixo é…","es":"Sol Si Re con Si en el bajo es…"},"options":[{"en":"G in first inversion (G/B)","pt":"Sol maior na primeira inversão (G/B)","es":"Sol mayor en primera inversión (G/B)"},{"en":"B minor","pt":"Si menor","es":"Si menor"},{"en":"G in second inversion","pt":"Sol maior na segunda inversão","es":"Sol mayor en segunda inversión"}],"answer":0,"explain":{"en":"B is the third of G major, so the third is in the bass: first inversion.","pt":"Si é a terça de Sol maior: terça no baixo é a primeira inversão.","es":"Si es la tercera de Sol mayor: tercera en el bajo es la primera inversión."}}},{"id":"sevenths","track":"chords","mins":4,"title":{"en":"Seventh chords","pt":"Acordes de sétima","es":"Acordes de séptima"},"intro":{"en":"Add one more third on top of a triad and you get a seventh chord: four notes, richer and jazzier. Three kinds cover most songs: major seventh, dominant seventh and minor seventh.","pt":"Some mais uma terça em cima da tríade e você tem um acorde de sétima: quatro notas, mais rico e com cara de jazz. Três tipos cobrem a maioria das músicas: sétima maior, sétima dominante e menor com sétima.","es":"Añade otra tercera encima de una tríada y obtendrás un acorde de séptima: cuatro notas, más rico y con aire de jazz. Tres tipos cubren casi todas las canciones: séptima mayor, séptima dominante y menor séptima."},"ideas":[{"en":"**Cmaj7** = C E G B (major triad + major 7th).","pt":"**C7M** ou **Cmaj7** = Dó Mi Sol Si (tríade maior + 7ª maior).","es":"**Cmaj7** = Do Mi Sol Si (tríada mayor + 7.ª mayor)."},{"en":"**G7** = G B D F (major triad + minor 7th): the dominant, it wants to resolve.","pt":"**G7** = Sol Si Ré Fá (tríade maior + 7ª menor): a dominante, que pede resolução.","es":"**G7** = Sol Si Re Fa (tríada mayor + 7.ª menor): la dominante, que pide resolver."},{"en":"**Am7** = A C E G (minor triad + minor 7th).","pt":"**Am7** = Lá Dó Mi Sol (tríade menor + 7ª menor).","es":"**Am7** = La Do Mi Sol (tríada menor + 7.ª menor)."}],"mission":{"kind":"build","range":["C4","C6"],"targets":[{"set":"chord","root":"G","type":"dom7"},{"set":"chord","root":"C","type":"maj7"},{"set":"chord","root":"A","type":"min7"}],"prompt":{"en":"Build **G7**, **Cmaj7** and **Am7** (four notes each, any position).","pt":"Monte **G7**, **C7M** e **Am7** (quatro notas cada, em qualquer posição).","es":"Construye **G7**, **Cmaj7** y **Am7** (cuatro notas cada uno, en cualquier posición)."},"hint":{"en":"Stack thirds: G-B-D-F, C-E-G-B, A-C-E-G. All white keys.","pt":"Empilhe terças: Sol-Si-Ré-Fá, Dó-Mi-Sol-Si, Lá-Dó-Mi-Sol. Todas teclas brancas.","es":"Apila terceras: Sol-Si-Re-Fa, Do-Mi-Sol-Si, La-Do-Mi-Sol. Todas teclas blancas."}},"quiz":{"q":{"en":"What is the difference between Cmaj7 and C7?","pt":"Qual a diferença entre C7M (Cmaj7) e C7?","es":"¿Cuál es la diferencia entre Cmaj7 y C7?"},"options":[{"en":"The 7th: B in Cmaj7, B♭ in C7","pt":"A sétima: Si no C7M, Si♭ no C7","es":"La séptima: Si en Cmaj7, Si♭ en C7"},{"en":"The 3rd","pt":"A terça","es":"La tercera"},{"en":"Nothing, same chord","pt":"Nenhuma, é o mesmo acorde","es":"Ninguna, es el mismo acorde"}],"answer":0,"explain":{"en":"Both are C E G; Cmaj7 adds the major 7th (B), C7 the minor 7th (B♭).","pt":"Os dois têm Dó Mi Sol; C7M soma a 7ª maior (Si), C7 a 7ª menor (Si♭).","es":"Los dos tienen Do Mi Sol; Cmaj7 añade la 7.ª mayor (Si), C7 la 7.ª menor (Si♭)."}},"note":{"en":"","pt":"**Nas cifras brasileiras** a sétima maior costuma ser escrita **7M** (C7M), e a menor com sétima, **m7** (Am7).","es":""}},{"id":"progression","track":"chords","mins":5,"title":{"en":"Chord progressions","pt":"Progressões de acordes","es":"Progresiones de acordes"},"intro":{"en":"Build a triad on each note of a major scale and number them with Roman numerals. Three of them, I, IV and V, can accompany thousands of songs. The V7 pulls strongly back home to I.","pt":"Monte uma tríade sobre cada nota da escala maior e numere com algarismos romanos. Três delas, I, IV e V, acompanham milhares de músicas. O V7 puxa com força de volta para casa, o I.","es":"Construye una tríada sobre cada nota de la escala mayor y numéralas con números romanos. Tres de ellas, I, IV y V, acompañan miles de canciones. El V7 tira con fuerza de vuelta a casa, al I."},"ideas":[{"en":"In a major function labMetro(view, st) {
  view.innerHTML = `<div class="lab"><div class="card labmain metro"><div class="tempo-big"><b id="mB">${st.bpm}</b><span>BPM · <i id="mName">${tempoName(st.bpm)}</i></span></div>
    <div class="pulse big" id="mP">${Array.from({ length: st.beats }, () => "<i></i>").join("")}</div>
    <div class="sl"><input type="range" id="mIn" min="30" max="240" step="1" value="${st.bpm}" aria-label="BPM"></div>
    <div class="row" style="justify-content:center"><button class="btn primary" type="button" id="mGo">${st.on ? "■ " + t("stop") : "▶ " + t("start_m")}</button><button class="btn ghost" type="button" id="mTap">${t("tap")}</button></div></div>
    <aside class="card side"><div class="field"><label>${t("beats_bar")}</label><div class="seg" id="mBeats">${[2, 3, 4, 6].map(n => `<button type="button" data-n="${n}" aria-pressed="${st.beats === n}">${n}</button>`).join("")}</div></div><p class="muted small">${t("metro_p")}</p></aside></div>`;
  const tick = () => { const ps = view.querySelectorAll("#mP i"), b = st.beat % st.beats; ps.forEach((p, i) => p.classList.toggle("on", i === b)); AU.click(0, b === 0); st.beat++; };
  const run = () => { clearInterval(APP._metro); if (!st.on) { view.querySelectorAll("#mP i").forEach(p => p.classList.remove("on")); return; } st.beat = 0; tick(); APP._metro = setInterval(tick, 60000 / st.bpm); };
  $("#mIn").oninput = e => { st.bpm = +e.target.value; $("#mB").textContent = st.bpm; $("#mName").textContent = tempoName(st.bpm); if (st.on) run(); };
  $("#mGo").onclick = () => { st.on = !st.on; AU.ensure(); $("#mGo").textContent = st.on ? "■ " + t("stop") : "▶ " + t("start_m"); run(); };
  $("#mTap").onclick = () => { const now = performance.now(); st.taps = (st.taps || []).filter(x => now - x < 2500); st.taps.push(now);
    if (st.taps.length >= 2) { const d = (st.taps[st.taps.length - 1] - st.taps[0]) / (st.taps.length - 1); st.bpm = Math.max(30, Math.min(240, Math.round(60000 / d))); $("#mIn").value = st.bpm; $("#mB").textContent = st.bpm; $("#mName").textContent = tempoName(st.bpm); if (st.on) run(); } };
  view.querySelectorAll("#mBeats button").forEach(b => b.onclick = () => { st.beats = +b.dataset.n; labMetro(view, st); });
  run();
}
