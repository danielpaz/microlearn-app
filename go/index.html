<style>
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --surface-2:#ECE9E2; --ink:#16181F; --muted:#5E6270; --line:#DDD9D0;
  --accent:#34466E; --accent-ink:#FFFFFF; --accent-soft:#E3E8F3;
  --ok:#1D7A4C; --ok-soft:#E1F2E8; --bad:#B8362A; --bad-soft:#FBE7E4; --gold:#B7791F;
  --lv-beg:#1D7A4C; --lv-int:#34466E; --lv-adv:#9B3B2A;
  --wood:#E2BD7F; --grid:#3A2A12;
  --f-display:"STIX Two Text", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:14px; --shadow:0 1px 2px rgba(22,24,31,.06), 0 6px 24px -12px rgba(22,24,31,.2);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101218; --surface:#171A22; --surface-2:#20242E; --ink:#E7E9EF; --muted:#9AA0AF; --line:#2A2F3B;
  --accent:#9DB2E0; --accent-ink:#0F1524; --accent-soft:#1E2840;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5BCB90; --lv-int:#9DB2E0; --lv-adv:#F08A73;
  --wood:#C9A066; --grid:#2A1C08; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#101218; --surface:#171A22; --surface-2:#20242E; --ink:#E7E9EF; --muted:#9AA0AF; --line:#2A2F3B;
  --accent:#9DB2E0; --accent-ink:#0F1524; --accent-soft:#1E2840;
  --ok:#5BCB90; --ok-soft:#14301F; --bad:#FF7D6E; --bad-soft:#3A1F1B; --gold:#E2B04A;
  --lv-beg:#5BCB90; --lv-int:#9DB2E0; --lv-adv:#F08A73;
  --wood:#C9A066; --grid:#2A1C08; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.08}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;min-height:62px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand .tile{position:relative;width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;letter-spacing:-.02em}
.brand .tile small{position:absolute;top:2px;left:4px;font-family:var(--f-mono);font-size:.5rem;font-weight:600;opacity:.85}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.18rem;font-stretch:112%}
.brand b i{font-style:normal;color:var(--accent)}
nav.menu{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav.menu::-webkit-scrollbar{display:none}
nav.menu a{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.92rem;white-space:nowrap}
nav.menu a svg{width:17px;height:17px;flex:none}
nav.menu a:hover{color:var(--ink);background:var(--surface-2)}
nav.menu a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.xp{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.xp svg{width:14px;height:14px;color:var(--gold)}
.xp b{font-weight:600}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;min-width:34px;padding:0 9px;justify-content:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.icon-btn svg{width:17px;height:17px}
.icon-btn:hover{border-color:var(--ink)}
.lang{position:relative}
.lang-menu{position:absolute;right:0;top:40px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:160px;z-index:40}
.lang-menu[hidden]{display:none}
.lang-menu button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;text-align:left;font-size:.92rem}
.lang-menu button:hover{background:var(--surface-2)}
.lang-menu button[aria-checked="true"]{font-weight:700;color:var(--accent)}
.lang-menu button span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
@media (max-width:820px){ nav.menu{order:3;width:100%;padding-bottom:8px} .top-in{gap:10px} .xp .lbl{display:none} }

main{min-height:70vh}
.view{display:none;padding-block:36px 64px}
.view.on{display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:11px 18px;border-radius:12px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.lv{--c:var(--lv-beg);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.lv.intermediate{--c:var(--lv-int)} .lv.advanced{--c:var(--lv-adv)}

/* home */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
.hero > *{min-width:0}
@media (max-width:900px){.hero{grid-template-columns:1fr;gap:28px}}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;margin:12px 0 18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);max-width:52ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stats{display:flex;gap:28px;margin-top:28px;flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:.82rem;color:var(--muted)}
.showcase{padding:16px}
.showcase .cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.showcase .cap b{font-size:.95rem}
.ticker{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);margin-top:12px;min-height:2.6em;font-variant-numeric:tabular-nums}
.ticker .cur{color:var(--ink);font-weight:600;background:var(--accent-soft);border-radius:4px;padding:0 3px}
.sec{margin-top:64px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:800}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:760px){.steps3{grid-template-columns:1fr}}
.steps3 .card{padding:20px}
.steps3 .n{font-family:var(--f-mono);color:var(--accent);font-weight:600;font-size:.8rem}
.steps3 h3{font-size:1.2rem;margin:6px 0}
.steps3 p{margin:0;color:var(--muted);font-size:.94rem}

/* tracks */
.track{padding:22px;margin-bottom:18px}
.track-head{display:flex;gap:16px;align-items:center}
.track-ico{width:54px;height:54px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.track-ico svg{width:42px;height:42px}
.track-head h2,.track-head h3{font-size:1.35rem;font-weight:800;margin-top:4px}
.track-head p{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.track-head .count{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;align-self:flex-start}
.bar{height:5px;border-radius:5px;background:var(--surface-2);margin:16px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.lessons{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lessons{grid-template-columns:1fr}}
.ltile{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);text-decoration:none;min-width:0}
.ltile:hover{border-color:var(--accent)}
.ltile .num{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;flex:none}
.ltile.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
.ltile b{display:block;font-size:.93rem;line-height:1.25}
.ltile span{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.ltile > div{min-width:0}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.crumbs a{font-weight:600;text-decoration:none;color:var(--muted);font-size:.9rem}
.crumbs a:hover{color:var(--ink)}
.lesson{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,520px);grid-template-areas:"text mission" "check mission";grid-template-rows:auto 1fr;column-gap:32px;align-items:start}
.l-text{grid-area:text;min-width:0} .l-check{grid-area:check;min-width:0} .lesson .mission{grid-area:mission}
@media (max-width:960px){.lesson{grid-template-columns:minmax(0,1fr);grid-template-areas:"text" "mission" "check";grid-template-rows:auto}}
.lesson h1{font-size:clamp(2rem,4.2vw,3rem);font-weight:800;margin:10px 0 14px}
.lesson .intro{font-size:1.08rem;max-width:62ch}
.ideas{list-style:none;padding:0;margin:22px 0;display:grid;gap:10px}
.ideas li{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.ideas li i{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.quiz{padding:20px;margin-top:4px}
@media (max-width:960px){.quiz{margin-top:22px}}
.quiz h3{font-size:1.15rem;margin:8px 0 14px;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;display:flex;gap:10px;align-items:center}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .k{width:24px;height:24px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:.75rem;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{margin-top:12px;font-size:.95rem;min-height:1.4em}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.mission{position:sticky;top:calc(80px + env(safe-area-inset-top,0px));padding:16px}
@media (max-width:960px){.mission{position:static}}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.mhead .pill{background:var(--accent-soft);color:var(--accent)}
.prompt{font-weight:700;font-size:1.02rem;margin:0 0 12px}
.status{display:flex;align-items:center;gap:10px;min-height:46px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.94rem;margin-top:12px}
.status.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.status.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.status .big{font-family:var(--f-display);font-size:1.6rem;font-weight:800;font-stretch:112%}
.mcontrols{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.mcontrols .spacer{flex:1}
.counter{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.05rem}
.hintbox{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--accent);font-size:.92rem;background:var(--accent-soft)}
.done-banner{margin-top:22px;padding:16px 18px;border-radius:12px;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-weight:700}
.done-banner .btn{margin-left:auto}

/* lab */
.lab{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:900px){.lab{grid-template-columns:1fr}}
.lab .boardcard{padding:16px}
.side{padding:18px;display:flex;flex-direction:column;gap:16px}
.field label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 6px;font-size:.86rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.moves{font-family:var(--f-mono);font-size:.85rem;max-height:220px;overflow:auto;background:var(--surface-2);border-radius:10px;padding:10px;display:grid;grid-template-columns:34px 1fr 1fr;gap:2px 8px;font-variant-numeric:tabular-nums}
.moves span.n{color:var(--muted)}
.moves .last{color:var(--accent);font-weight:600}
textarea,input[type="search"],input[type="text"]{width:100%;font:inherit;font-family:var(--f-mono);font-size:.82rem;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type="search"]{font-family:var(--f-body);font-size:1rem;padding:12px 14px}
.lab-status{font-weight:700}

/* glossary & about */
.gl-index{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 24px}
.gl-index a{font-family:var(--f-mono);font-weight:600;font-size:.85rem;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line);text-decoration:none}
.gl-index a:hover{border-color:var(--accent);color:var(--accent)}
.gl-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.gl-list{grid-template-columns:1fr}}
.term{padding:16px 18px;scroll-margin-top:90px}
.term h3{font-size:1.08rem;font-family:var(--f-body);font-stretch:100%;font-weight:700;letter-spacing:0;display:flex;justify-content:space-between;gap:10px}
.term h3 span{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);font-weight:500}
.term p{margin:6px 0 0;color:var(--muted);font-size:.94rem}
.prose{max-width:72ch}
.prose h1{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:10px 0 16px}
.prose h2{font-size:1.4rem;font-weight:800;margin:32px 0 10px}
.prose p,.prose li{color:var(--ink)}
.prose ul{padding-left:20px}
.prose li{margin:4px 0}
.prose .note{color:var(--muted);font-size:.92rem}

footer{border-top:1px solid var(--line);background:var(--surface);padding-block:26px 34px;font-size:.88rem;color:var(--muted)}
footer .in{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;align-items:center}
footer a{font-weight:600;text-decoration:none;color:var(--ink)}
footer a:hover{color:var(--accent)}
footer .links{display:flex;gap:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:all .25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.page-h{font-size:clamp(2rem,4vw,2.8rem);font-weight:800;margin:8px 0 8px}
.page-p{max-width:62ch;margin:0 0 26px}
.note-box{margin:4px 0 18px;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent);background:var(--accent-soft);font-size:.94rem}
.note-box b{color:var(--accent)}
.status[hidden]{display:none}
code,.code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border-radius:5px;padding:1px 5px}

/* Go.Micro: wooden goban with fixed outside coordinates (.Micro board standard) */
.goban-wrap{position:relative;width:100%;max-width:560px;margin:0 auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.goban{display:block;width:100%;height:auto}
.goban .wood{fill:var(--wood)}
.goban .gl{stroke:var(--grid);stroke-width:2.2;stroke-linecap:square}
.goban .edge{stroke-width:3.4}
.goban .star{fill:var(--grid)}
.goban .coord{fill:var(--muted);font-family:var(--f-mono);font-size:30px;font-weight:600}
.goban .stone{transition:opacity .15s}
.goban .ghost{opacity:.38;pointer-events:none}
.goban .lastmk{fill:none;stroke-width:5}
.goban .lastmk.onB{stroke:#fff}.goban .lastmk.onW{stroke:#111}
.goban .sel{fill:none;stroke:var(--accent);stroke-width:8}
.goban .selfill{fill:var(--accent);opacity:.22}
.goban .okmk{fill:none;stroke:var(--ok);stroke-width:9}
.goban .badmk{stroke:var(--bad);stroke-width:9;stroke-linecap:round}
.goban .tgt{fill:none;stroke:var(--gold);stroke-width:6;stroke-dasharray:14 9}
.goban .terrB{fill:#111}.goban .terrW{fill:#fff;stroke:#555;stroke-width:2}
.goban .dead{opacity:.35}
.goban .deadx{stroke:var(--bad);stroke-width:7;stroke-linecap:round}
.goban-wrap.locked{cursor:default}
.goban-wrap:not(.locked) .goban{cursor:pointer}
.mboard{margin-bottom:6px}
.legendrow{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.84rem;color:var(--muted);margin-top:8px;align-items:center}
.legendrow .dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1px solid #444}
.legendrow .dot.b{background:#151515}.legendrow .dot.w{background:#f4f2ec}
.numform label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 6px}
.numform input{font:inherit;font-family:var(--f-mono);font-size:1.05rem;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:160px;max-width:100%}
.numform input:focus{border-color:var(--accent);outline:none}
.opts.choice{margin-top:12px}
.hv-cap{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.hv-cap b{font-size:.95rem}
.hv-note{font-size:.84rem;color:var(--muted);margin-top:6px;font-family:var(--f-mono)}
/* lab */
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.fieldset{display:grid;gap:6px}
.fieldset > span{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.scorebox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scorebox div{background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:.86rem}
.scorebox b{display:block;font-family:var(--f-mono);font-size:1.15rem}
.labmsg{font-weight:700;min-height:1.4em}
.movelog{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);max-height:110px;overflow:auto;word-break:break-word;line-height:1.5}
.thinking::after{content:"";display:inline-block;width:.9em;height:.9em;margin-left:8px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.thinking::after{animation:none}}
@media (max-width:960px){.lab{grid-template-columns:minmax(0,1fr)}}
[hidden]{display:none!important}

</style>

<script>const ABOUT_GO = {"en": "<h1>About Go.Micro</h1>\n<p>Go.Micro is a micro-learning platform for Go, the board game also known as weiqi (China) and baduk (Korea). Each lesson takes three to five minutes: one idea, a mission on the board, and one question to check what you learned.</p>\n<p>The 24 lessons are grouped into six tracks: first stones, the rules, capturing tricks, connecting and cutting, life and death, and playing a game. {progress}</p>\n<h2>How the missions are checked</h2>\n<ul><li>A Go engine written for Go.Micro runs in your browser and knows the rules: liberties, capture, suicide and ko.</li><li>For ladders, snapbacks, life and death and capturing races, the engine reads the position after your move and answers with the best defence. Any correct move counts, not only the one in the hint.</li><li>Every mission was checked in advance: the engine confirms that the solution works and lists every move that also works.</li></ul>\n<h2>The rules used here</h2>\n<p>Go.Micro uses area scoring (stones on the board plus surrounded empty points), as in the Chinese and AGA rules, with a komi of 7.5 points. Suicide is not allowed and the simple ko rule applies. Japanese territory scoring gives the same winner in almost every game.</p>\n<h2>The Lab</h2>\n<p>Play against the computer on 9×9, 13×13 or 19×19, or against a friend on the same screen. The computer uses Monte Carlo playouts: it is a friendly sparring partner, not a professional. When both players pass, the computer suggests which stones are dead; tap a chain to change it, then accept the result. You can copy the game as an SGF file for any Go program.</p>\n<h2>Board standard</h2>\n<p>Like every .Micro board, the coordinates are fixed outside the grid: numbers on the left, letters along the bottom. Letters skip I, as is traditional in Go.</p>\n<h2>Part of Microlearn</h2>\n<p>Go.Micro belongs to the .Micro family of free micro-learning platforms at <a href=\"microlearn.website.html\">www.microlearn.website</a>, next to <a href=\"Chess.Micro.html\">Chess.Micro</a> and <a href=\"Check.Micro.html\">Check.Micro</a>.</p>", "pt": "<h1>Sobre o Go.Micro</h1>\n<p>O Go.Micro é uma plataforma de microaprendizagem de Go, o jogo de tabuleiro também chamado de weiqi (China) e baduk (Coreia). Cada lição leva de três a cinco minutos: uma ideia, uma missão no tabuleiro e uma pergunta para conferir o que você aprendeu.</p>\n<p>As 24 lições estão agrupadas em seis trilhas: primeiras pedras, as regras, truques de captura, ligar e cortar, vida e morte, e jogar uma partida. {progress}</p>\n<h2>Como as missões são corrigidas</h2>\n<ul><li>Um motor de Go feito para o Go.Micro roda no seu navegador e conhece as regras: liberdades, captura, suicídio e ko.</li><li>Em escadas, snapbacks, vida e morte e corridas de liberdades, o motor lê a posição depois do seu lance e responde com a melhor defesa. Qualquer lance correto vale, não só o da dica.</li><li>Cada missão foi conferida antes: o motor confirma que a solução funciona e lista todos os lances que também funcionam.</li></ul>\n<h2>As regras usadas aqui</h2>\n<p>O Go.Micro usa contagem por área (pedras no tabuleiro mais pontos vazios cercados), como nas regras chinesas e da AGA, com komi de 7,5 pontos. Suicídio não é permitido e vale a regra simples do ko. A contagem japonesa por território dá o mesmo vencedor em quase todas as partidas.</p>\n<h2>O Laboratório</h2>\n<p>Jogue contra o computador no 9×9, 13×13 ou 19×19, ou contra um amigo na mesma tela. O computador usa simulações de Monte Carlo: é um parceiro de treino simpático, não um profissional. Quando os dois passam, o computador sugere quais pedras estão mortas; toque numa cadeia para mudar e depois aceite o resultado. Dá para copiar a partida em SGF para qualquer programa de Go.</p>\n<h2>Padrão de tabuleiro</h2>\n<p>Como em todo tabuleiro .Micro, as coordenadas ficam fixas fora da grade: números à esquerda, letras embaixo. As letras pulam o I, como é tradição no Go.</p>\n<h2>Parte do Microlearn</h2>\n<p>O Go.Micro faz parte da família .Micro de plataformas gratuitas de microaprendizagem em <a href=\"microlearn.website.html\">www.microlearn.website</a>, ao lado do <a href=\"Chess.Micro.html\">Chess.Micro</a> e do <a href=\"Check.Micro.html\">Check.Micro</a>.</p>", "es": "<h1>Acerca de Go.Micro</h1>\n<p>Go.Micro es una plataforma de microaprendizaje de Go, el juego de tablero también llamado weiqi (China) y baduk (Corea). Cada lección dura de tres a cinco minutos: una idea, una misión en el tablero y una pregunta para comprobar lo aprendido.</p>\n<p>Las 24 lecciones se agrupan en seis rutas: primeras piedras, las reglas, trucos de captura, conectar y cortar, vida y muerte, y jugar una partida. {progress}</p>\n<h2>Cómo se corrigen las misiones</h2>\n<ul><li>Un motor de Go hecho para Go.Micro funciona en tu navegador y conoce las reglas: libertades, captura, suicidio y ko.</li><li>En escaleras, snapbacks, vida y muerte y carreras de libertades, el motor lee la posición tras tu jugada y responde con la mejor defensa. Vale cualquier jugada correcta, no solo la de la pista.</li><li>Cada misión se comprobó de antemano: el motor confirma que la solución funciona y enumera todas las jugadas que también funcionan.</li></ul>\n<h2>Las reglas que se usan aquí</h2>\n<p>Go.Micro usa el recuento por área (piedras en el tablero más puntos vacíos rodeados), como en las reglas chinas y de la AGA, con un komi de 7,5 puntos. El suicidio no está permitido y se aplica la regla simple del ko. El recuento japonés por territorio da el mismo ganador en casi todas las partidas.</p>\n<h2>El Laboratorio</h2>\n<p>Juega contra el ordenador en 9×9, 13×13 o 19×19, o contra un amigo en la misma pantalla. El ordenador usa simulaciones de Monte Carlo: es un compañero de práctica amable, no un profesional. Cuando ambos pasan, el ordenador sugiere qué piedras están muertas; toca una cadena para cambiarla y acepta el resultado. Puedes copiar la partida como SGF para cualquier programa de Go.</p>\n<h2>Estándar de tablero</h2>\n<p>Como en todo tablero .Micro, las coordenadas están fijas fuera de la cuadrícula: números a la izquierda y letras abajo. Las letras saltan la I, como es tradición en el Go.</p>\n<h2>Parte de Microlearn</h2>\n<p>Go.Micro pertenece a la familia .Micro de plataformas gratuitas de microaprendizaje en <a href=\"microlearn.website.html\">www.microlearn.website</a>, junto a <a href=\"Chess.Micro.html\">Chess.Micro</a> y <a href=\"Check.Micro.html\">Check.Micro</a>.</p>"};</script>

ma pedra sozinha no meio tem 4 liberdades; na borda, 3; no canto, 2.","es":"Una piedra sola en el centro tiene 4 libertades; en el borde, 3; en la esquina, 2."},{"en":"Diagonal points are not liberties and diagonal stones are not connected.","pt":"Pontos na diagonal não são liberdades e pedras na diagonal não estão ligadas.","es":"Los puntos en diagonal no son libertades y las piedras en diagonal no están conectadas."},{"en":"An enemy stone next to you takes away a liberty.","pt":"Uma pedra inimiga ao lado tira uma liberdade.","es":"Una piedra enemiga al lado quita una libertad."}],"mission":{"type":"select","mode":"all","rule":"libs:D5","N":9,"board":[".........",".........",".........",".........","..XOO....",".........",".........",".........","........."],"answer":["D6","E6","F5","D4","E4"],"prompt":{"en":"The two white stones form one chain. Tap **all its liberties**, then press Check.","pt":"As duas pedras brancas formam uma cadeia. Toque em **todas as liberdades** dela e depois em Conferir.","es":"Las dos piedras blancas forman una cadena. Toca **todas sus libertades** y pulsa Comprobar."},"hint":{"en":"Look above, below and to the right of each white stone. The black stone already takes one point.","pt":"Olhe acima, abaixo e à direita de cada pedra branca. A pedra preta já ocupa um ponto.","es":"Mira arriba, abajo y a la derecha de cada piedra blanca. La piedra negra ya ocupa un punto."}},"quiz":{"q":{"en":"How many liberties does a single stone in the corner have?","pt":"Quantas liberdades tem uma pedra sozinha no canto?","es":"¿Cuántas libertades tiene una piedra sola en la esquina?"},"options":["2","3","4"],"answer":0,"explain":{"en":"Only two lines meet in the corner, so there are only two neighbouring points.","pt":"No canto só duas linhas se encontram, então há só dois pontos vizinhos.","es":"En la esquina solo se cruzan dos líneas, así que solo hay dos puntos vecinos."}}},{"id":"capture","track":"stones","mins":3,"title":{"en":"Capturing","pt":"Capturando","es":"Capturar"},"intro":{"en":"When you fill the last liberty of a chain, it is captured: the stones are removed from the board and kept as prisoners. A chain with only one liberty left is in atari.","pt":"Quando você ocupa a última liberdade de uma cadeia, ela é capturada: as pedras saem do tabuleiro e viram prisioneiras. Uma cadeia com uma só liberdade está em atari.","es":"Cuando ocupas la última libertad de una cadena, queda capturada: las piedras salen del tablero y se guardan como prisioneras. Una cadena con una sola libertad está en atari."},"ideas":[{"en":"Atari means 'one liberty left'. Say it, and the stones are in danger.","pt":"Atari quer dizer 'resta uma liberdade'. As pedras estão em perigo.","es":"Atari significa 'queda una libertad'. Las piedras están en peligro."},{"en":"Capturing removes the whole chain at once, however long it is.","pt":"A captura retira a cadeia inteira de uma vez, por maior que seja.","es":"Capturar retira toda la cadena de una vez, sea lo larga que sea."},{"en":"Each captured stone is worth a point in territory scoring.","pt":"Cada pedra capturada vale um ponto na contagem por território.","es":"Cada piedra capturada vale un punto en el recuento por territorio."}],"mission":{"type":"move","goal":{"capture":1},"N":9,"board":[".........",".........",".........","....X....","...XOX...",".........",".........",".........","........."],"prompt":{"en":"White is in atari. **Capture the white stone.**","pt":"A pedra branca está em atari. **Capture a pedra branca.**","es":"La piedra blanca está en atari. **Captura la piedra blanca.**"},"hint":{"en":"Find the last empty point next to the white stone.","pt":"Ache o último ponto vazio ao lado da pedra branca.","es":"Busca el último punto vacío junto a la piedra blanca."}},"quiz":{"q":{"en":"A white chain has one liberty. What is it in?","pt":"Uma cadeia branca tem uma liberdade. Em que situação ela está?","es":"Una cadena blanca tiene una libertad. ¿En qué situación está?"},"options":[{"en":"Atari","pt":"Atari","es":"Atari"},{"en":"Ko","pt":"Ko","es":"Ko"},{"en":"Seki","pt":"Seki","es":"Seki"}],"answer":0,"explain":{"en":"One liberty left is atari: the next move there captures it.","pt":"Uma liberdade restante é atari: o próximo lance ali captura.","es":"Una libertad restante es atari: la siguiente jugada ahí la captura."}}},{"id":"escape","track":"stones","mins":3,"title":{"en":"Escaping from atari","pt":"Fugindo do atari","es":"Escapar del atari"},"intro":{"en":"If your chain is in atari, you can often save it by extending: play on its last liberty so the chain grows and gains new liberties. Check the count after you extend.","pt":"Se sua cadeia está em atari, muitas vezes dá para salvá-la estendendo: jogue na última liberdade para a cadeia crescer e ganhar novas liberdades. Confira a contagem depois de estender.","es":"Si tu cadena está en atari, a menudo puedes salvarla extendiéndote: juega en su última libertad para que la cadena crezca y gane libertades. Revisa la cuenta después de extender."},"ideas":[{"en":"Extending from one liberty to three is a real escape.","pt":"Estender de uma para três liberdades é uma fuga de verdade.","es":"Pasar de una a tres libertades es una huida de verdad."},{"en":"Extending to only two liberties may lead into another atari.","pt":"Estender para só duas liberdades pode levar a outro atari.","es":"Extender a solo dos libertades puede llevar a otro atari."},{"en":"Sometimes the best escape is to capture an attacking stone.","pt":"Às vezes a melhor fuga é capturar uma pedra atacante.","es":"A veces la mejor huida es capturar una piedra atacante."}],"mission":{"type":"move","goal":{"libs":["D4",3]},"N":9,"board":[".........",".........",".........",".........","...O.....","..OXO....",".........",".........","........."],"prompt":{"en":"Your black stone is in atari. **Extend it** so the chain has at least 3 liberties.","pt":"Sua pedra preta está em atari. **Estenda** para a cadeia ficar com pelo menos 3 liberdades.","es":"Tu piedra negra está en atari. **Extiéndela** para que la cadena tenga al menos 3 libertades."},"hint":{"en":"There is only one empty point next to the black stone.","pt":"Só há um ponto vazio ao lado da pedra preta.","es":"Solo hay un punto vacío junto a la piedra negra."}},"quiz":{"q":{"en":"Your chain is in atari and extending gives it only two liberties. What is the risk?","pt":"Sua cadeia está em atari e estender dá só duas liberdades. Qual o risco?","es":"Tu cadena está en atari y extender le da solo dos libertades. ¿Cuál es el riesgo?"},"options":[{"en":"Another atari right away","pt":"Outro atari logo em seguida","es":"Otro atari enseguida"},{"en":"None, two is safe","pt":"Nenhum, duas é seguro","es":"Ninguno, dos es seguro"},{"en":"It becomes illegal","pt":"Fica ilegal","es":"Se vuelve ilegal"}],"answer":0,"explain":{"en":"With two liberties the opponent can atari again, and again, as in a ladder.","pt":"Com duas liberdades o adversário pode dar atari de novo, e de novo, como numa escada.","es":"Con dos libertades el rival puede dar atari otra vez, y otra, como en una escalera."}}},{"id":"suicide","track":"rules","mins":3,"title":{"en":"No suicide","pt":"Sem suicídio","es":"Sin suicidio"},"intro":{"en":"You may not play a stone that would have no liberties at all, unless that move captures something. A point completely surrounded by enemy stones is closed to you.","pt":"Não é permitido jogar uma pedra que fique sem nenhuma liberdade, a menos que o lance capture algo. Um ponto totalmente cercado por pedras inimigas está fechado para você.","es":"No puedes jugar una piedra que se quede sin ninguna libertad, salvo que esa jugada capture algo. Un punto rodeado por piedras enemigas está cerrado para ti."},"ideas":[{"en":"A move with zero liberties that captures nothing is illegal.","pt":"Um lance sem liberdades que não captura nada é ilegal.","es":"Una jugada sin libertades que no captura nada es ilegal."},{"en":"Surrounded points like this are the /* ============ Go.Micro engine: rules, Benson life, area scoring, local solvers, MCTS player ============ */
const GO = (() => {

  function chain(p, i) {

        if (st.state === "lose") { api.status(t({ capture: "lose_cap", escape: "lose_esc", live: "lose_live", kill: "lose_live", race: "lose_race" }[m.goal]), "bad"); return; }

    const cur = () => S.hist[S.hist.length - 1];
    const bd = new Goban($("#labBoard"), S.N, { ghost: () => S.phase === "play" && !APP._job ? cur().toMove : 0, onPoint: i => onPoint(i) });
    const cpuTurn = () => S.opp === "cpu" && S.phase === "play" && cur().toMove !== S.color;
    function draw() {
      const p = cur(); const mk = [];
      if (S.phase !== "play") { const dead = new Set(S.dead); const s = GO.score(p, 7.5, dead); for (let i = 0; i < p.N * p.N; i++) { if (dead.has(i)) mk.push({ i, c: "dead" }); if ((!p.b[i] || dead.has(i)) && s.own[i]) mk.push({ i, c: s.own[i] === 1 ? "terrB" : "terrW" }); }
        $("#labScore").innerHTML = `<div>${t("black")}<b>${s.black}</b></div><div>${t("white")}<b>${s.white}</b><small class="muted">${t("area")} + 7.5 ${t("komi_l")}</small></div>`; }
      else $("#labScore").innerHTML = `<div>${t("caps")} · ${t("black")}<b>${p.caps[1]}</b></div><div>${t("caps")} · ${t("white")}<b>${p.caps[2]}</b></div>`;
      bd.marks = mk; bd.set(p); bd.lock(S.phase === "over" || !!APP._job || cpuTurn());
      $("#labMsg").innerHTML = S.msg || (S.phase === "play" ? t("tomove", { c: colorName(p.toMove) }) : "");
      $("#scoreRow").hidden = S.phase !== "score";
      $("#bPass").disabled = $("#bResign").disabled = S.phase !== "play" || !!APP._job;
      $("#bUndo").disabled = S.hist.length < 2 || !!APP._job;
      $("#fsLevel").hidden = $("#fsColor").hidden = S.opp !== "cpu";
      $("#labLog").textContent = S.moves.map((m, k) => `${k + 1}.${k % 2 ? "W" : "B"} ${ptName(S.N, m)}`).join("  ");
    }
    function play(i) { const p = cur(); const nx = GO.play(p, i); if (!nx) return false; S.hist.push(nx.pos); S.moves.push(i); S.msg = i < 0 ? t("passed", { c: colorName(p.toMove) }) : "";
      if (nx.pos.passes >= 2) enterScoring(); return true; }
    function enterScoring() { S.phase = "score"; const p = cur(); const own = GO.ownership(p, 260); S.dead = [];
      for (let i = 0; i < p.N * p.N; i++) if (p.b[i] && (p.b[i] === 1 ? own[i] < -0.55 : own[i] > 0.55) && !GO.benson(p, p.b[i])[i]) S.dead.push(i);
      S.msg = t("scoring"); }
    function onPoint(i) {
      if (S.phase === "score") { const p = cur(); if (!p.b[i]) return; const ch = GO.chain(p, i).stones; const isDead = S.dead.includes(i); S.dead = isDead ? S.dead.filter(x => !ch.includes(x)) : S.dead.concat(ch); draw(); return; }
      if (S.phase !== "play" || APP._job || cpuTurn()) return;
      if (!play(i)) { S.msg = t("illegal"); draw(); return; } draw(); maybeCpu(); }
    function maybeCpu() {
      if (!cpuTurn()) return; S.msg = `<span class="thinking">${t("thinking")}</span>`; draw();
      const p = cur(); const scale = S.N === 9 ? 1 : S.N === 13 ? 0.45 : 0.22; const base = { easy: 900, casual: 5000, club: 14000 }[S.level];
      const s = GO.search(p, { playouts: Math.max(300, Math.round(base * scale)), komi: 7.5 }); const job = APP._job = { cancel: false };
      const tick = () => { if (job.cancel) return; s.step(250); if (!s.done()) { APP._ai = setTimeout(tick, 0); return; }
        APP._job = null; let mv = s.pick(); if (S.level === "easy" && mv >= 0 && Math.random() < 0.25) { const c = GO.candidates(p, p.toMove); if (c.length) mv = c[(Math.random() * c.length) | 0]; }
        if (!play(mv)) play(-1); if (mv < 0) S.msg = t("cpu_pass"); draw(); };
      APP._ai = setTimeout(tick, 30);
    }
    $("#bPass").onclick = () => { if (S.phase !== "play" || APP._job || cpuTurn()) return; play(-1); draw(); maybeCpu(); };
    $("#bUndo").onclick = () => { if (APP._job) return; S.hist.pop(); S.moves.pop(); if (S.opp === "cpu" && S.hist.length > 1 && cur().toMove !== S.color) { S.hist.pop(); S.moves.pop(); } S.phase = "play"; S.dead = []; S.msg = ""; draw(); maybeCpu(); };
    $("#bResign").onclick = () => { if (S.phase !== "play") return; const loser = S.opp === "cpu" ? S.color : cur().toMove; S.phase = "over"; S.msg = t("resigned", { c: colorName(loser), w: colorName(3 - loser) }); draw(); };
    $("#bAccept").onclick = () => { const s = GO.score(cur(), 7.5, new Set(S.dead)); const w = s.margin > 0 ? 1 : 2; S.phase = "over"; S.msg = t("result", { c: colorName(w), n: String(Math.abs(s.margin)).replace(".", lang === "en" ? "." : ",") }); draw(); };
    $("#bResume").onclick = () => { S.phase = "play"; S.dead = []; S.msg = ""; cur().passes = 0; draw(); maybeCpu(); };
    $("#bNew").onclick = () => { if (APP._job) APP._job.cancel = true; APP._job = null; clearTimeout(APP._ai); S.hist = [GO.make(S.N)]; S.moves = []; S.phase = "play"; S.dead = []; S.msg = ""; draw(); maybeCpu(); };
    $("#bSgf").onclick = () => copyText(sgf(S.N, S.moves, 7.5));
    const seg = (id, key, conv) => $(id).querySelectorAll("button").forEach(b => b.onclick = () => { S[key] = conv(b.dataset.v); if (key === "N") { if (APP._job) APP._job.cancel = true; APP._job = null; S.hist = null; } APP.renderLab(view); });
    seg("#segN", "N", Number); seg("#segL", "level", String); seg("#segC", "color", Number); seg("#segO", "opp", String);
    draw(); maybeCpu();
  }
};

      if (/^\s*(part of the microlearn network|parte da rede microlearn|parte de la red microlearn)\s*$/i.test(el.textContent)) hide(el);
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function build(l, me, dk) {
    var t = TX[l], cat = CAT_OF[me], ci = dk ? 2 : 1;
    var tiles = P.map(function (p) {
      var c = CAT_OF[p[0]], col = c[ci], same = !cat || c === cat, on = p[0] === me;
      var inner = "<s>" + p[1] + "</s><b>" + p[2] + "</b><i></i>";
      var cls = "mf-tile" + (same ? " mf-same" : "") + (on ? " mf-on" : "");
      var tip = esc(p[3] + ".Micro · " + c[3][l]);
      return on ? '<span class="' + cls + '" style="--c:' + col + '" title="' + tip + '" aria-current="page">' + inner + "</span>"
                : '<a class="' + cls + '" style="--c:' + col + '" href="' + link(p[0]) + '" title="' + tip + '" aria-label="' + tip + '">' + inner + "</a>";
    }).join("");
    var left = cat ? '<span class="mf-cat" style="--mf-cc:' + cat[ci] + '"><i class="mf-dot"></i><b>' + esc(cat[3][l]) + "</b> · " + esc(t.more) + "</span>"
                   : '<span class="mf-cat">' + esc(t.more) + "</span>";
    return '<div class="mf-in"><div class="mf-top">' + left + '<span class="mf-part"><span class="mf-t">' + esc(t.part) + '</span> <a class="mf-a" href="' + HREF + '">MicroLearn.website</a> · ' + esc(t.n) + "</span></div>" +
      '<div class="mf-row" role="navigation" aria-label="' + esc(t.nav) + '">' + tiles + "</div></div>";
  }
  var line = null, key = "", busy = false;
  function host() {
    var fs = [].filter.call(document.querySelectorAll("footer"), function (f) { return !f.closest("nav") && !f.closest("[data-micro-nano-view],.mn-in"); });
    var v = fs.filter(vis);
    if (v.length) return v[v.length - 1];
    if (fs.length) return fs[fs.length - 1];
    var own = document.querySelector("footer.mf-own");
    if (!own) { own = document.createElement("footer"); own.className = "mf-own"; }
    var ms = [].filter.call(document.querySelectorAll("main"), vis), m = ms[ms.length - 1] || document.body;

  }

    [].forEach.call(f.children, function (c) {
      if (c === line || !vis(c) || !c.textContent.trim()) return;
      var r = c.getBoundingClientRect(), cs = getComputedStyle(c);
      if (r.width < (br - bl) * 0.5) return;

    });

    else { pl = pr = (bl - fr.left) < 8 ? 16 : 0; }
    var v = pl + "px " + pr + "px";
    if (line.getAttribute("data-mf-pad") !== v) { line.setAttribute("data-mf-pad", v); line.style.setProperty("padding-left", pl + "px", "important"); line.style.setProperty("padding-right", pr + "px", "important"); }
  }
  function acc() {
    var on = document.querySelector("nav .mstd-on") || document.querySelector("nav .mstd-item");
    var c = on ? getComputedStyle(on).color : "";
    if (c) document.documentElement.style.setProperty("--mf-acc", c);
  }
  function ensure() {
    if (busy) return; busy = true;
    try {
      var f = host();
      [].forEach.call(document.querySelectorAll(".mf-line"), function (el) { if (el !== line || el.parentNode !== f) el.remove(); });
      if (!line) { line = document.createElement("div"); line.className = "mf-line"; line.setAttribute("data-micro-foot", ""); }
      if (line.parentNode !== f || f.lastElementChild !== line) f.appendChild(line);
      var l = lang(), me = self(), dk = dark(f), k = l + "|" + me + "|" + dk;
      if (k !== key) {
        key = k; line.innerHTML = build(l, me, dk); line.setAttribute("lang", l);
        var on = line.querySelector(".mf-on"), row = line.querySelector(".mf-row");
        if (on && row && row.scrollWidth > row.clientWidth) row.scrollLeft = Math.max(0, on.offsetLeft - row.clientWidth / 2);

  }
  var q = 0;
  function later() { if (q) return; q = setTimeout(function () { q = 0; ensure(); }, 60); }
  function start() {
