@layer base {
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  }

  }

<style>/* Stats.Micro · shell no padrão micro-learning (DS.Micro / AI2.Micro).
   Layout: header + (home | workspace de 2 painéis: lição · simulação); abaixo de 1000px vira abas.
   Regras do shell ficam escopadas (#app>header, #home, #lesson, .mtabs) para não vazar para as simulações. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --sunk:#e3e9f2; --stage:#f6f8fb; --ink:#111b2e; --muted:#5b6a82; --line:#d5dde9;
  --accent:#2563eb; --accent-ink:#ffffff; --accent-soft:#dbe6fe; --amber:#d97706; --amber-soft:#fdecc8;
  --ok:#15803d; --bad:#c2410c;
  --f-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#090d16; --surface:#0f1626; --sunk:#141d30; --stage:#0b111d; --ink:#e7edf7; --muted:#8fa0bb; --line:#1f2a40;
  --accent:#60a5fa; --accent-ink:#06142c; --accent-soft:#16284a; --amber:#fbbf24; --amber-soft:#3a2a0c;
  --ok:#4ade80; --bad:#fb7a45; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090d16; --surface:#0f1626; --sunk:#141d30; --stage:#0b111d; --ink:#e7edf7; --muted:#8fa0bb; --line:#1f2a40;
  --accent:#60a5fa; --accent-ink:#06142c; --accent-soft:#16284a; --amber:#fbbf24; --amber-soft:#3a2a0c;
  --ok:#4ade80; --bad:#fb7a45; color-scheme:dark}

html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg)!important;color:var(--ink)!important;font-family:var(--f-body);font-size:15px;line-height:1.5}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app>header button,#home button,#lesson button,.mtabs button{font:inherit;color:inherit}
#home h1,#home h2,#home h3,#lesson h2,#lesson h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}

/* header */
.top{display:flex;align-items:center;gap:14px;padding-block:10px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:0}
.brand svg{display:block}
.brand b{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent)}
.tnav{display:flex;gap:4px;margin-left:8px}
.tnav button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--muted)!important;font-weight:700}
.tnav button[aria-current="page"]{background:var(--sunk);color:var(--ink)!important}
.tright{margin-left:auto;display:flex;align-items:center;gap:10px}
.xp{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.xp .bar{width:90px;height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.xp .bar span{display:block;height:100%;background:var(--accent);transition:width .5s}
.lang{position:relative;display:flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.lang svg{width:16px;height:16px;flex-shrink:0;color:var(--muted)}
.lang select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;padding-right:2px}
.lang select option{background:var(--surface);color:var(--ink)}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line)!important;background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:18px;height:18px}

.view{flex:1;min-height:0}
#home{overflow-y:auto;padding-block:28px 56px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:56px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
#home .hero h1{font-size:clamp(38px,5.4vw,66px);font-weight:800;letter-spacing:-.035em;margin-top:14px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:52ch;color:var(--muted);font-size:17px;margin:18px 0 0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--line)!important;background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)!important}
.btn.pri{background:var(--accent);border-color:var(--accent)!important;color:var(--accent-ink)!important}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
.facts{display:flex;gap:28px;margin-top:30px;flex-wrap:wrap}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.facts span{font-size:13px;color:var(--muted)}
.heroart{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px}
.heroart svg{width:100%;height:auto;display:block}
.heroart .draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
html.dark .heroart svg text{fill:var(--muted)}
html.dark .heroart svg text.chiptx{fill:var(--accent-ink)}
.heroart figcaption{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:var(--f-mono)}

/* trilhas */
.sechead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
#home .sechead h2{font-size:32px;font-weight:800;letter-spacing:-.02em}
.sechead p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tracks{display:flex;flex-direction:column;gap:14px;margin-top:22px}
.track{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.track .tn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
#home .track h3{font-size:22px;font-weight:700;margin-top:4px}
.track .td{color:var(--muted);font-size:14px;margin:6px 0 10px}
.lvl{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.lvl.intermediate{background:var(--amber-soft);color:var(--amber)}
.lvl.advanced{background:color-mix(in oklab,var(--bad) 16%,var(--surface));color:var(--bad)}
.stops{display:flex;gap:0;align-items:stretch;overflow-x:auto;padding-bottom:4px}
.stop{flex:1 1 0;min-width:150px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:none;border:0;cursor:pointer;text-align:left;padding:4px 10px 4px 0;position:relative}
.stop .dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;position:relative;z-index:1;flex-shrink:0}
.stop::before{content:"";position:absolute;left:30px;right:0;top:19px;height:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop.done .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop.next .dot{border-color:var(--accent);color:var(--accent)}
.stop b{font-size:14.5px;line-height:1.25}
.stop small{display:block;color:var(--muted);font-size:12.5px}
.stop:hover b{color:var(--accent)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}
.how div{border-top:2px solid var(--ink);padding-top:12px}
.how span{font-family:var(--f-mono);font-size:12px;color:var(--amber)}
#home .how h3{font-size:19px;margin:6px 0}
.how p{margin:0;color:var(--muted);font-size:14.5px}
.foot{border-top:1px solid var(--line);padding-top:18px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot a{color:var(--accent)}
.langlinks{display:flex;gap:12px;flex-wrap:wrap;width:100%}
.langlinks a[aria-current]{color:var(--ink);font-weight:700;text-decoration:none}

/* workspace */
#work{display:flex;flex-direction:column;padding-block:12px;gap:10px;position:relative}
.mtabs{display:none;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;flex-shrink:0}
.mtabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-weight:700;color:var(--muted)!important;cursor:pointer;position:relative}
.mtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)!important}
.mtabs .pip{position:absolute;top:7px;right:12px;width:7px;height:7px;border-radius:50%;background:var(--amber)}
.wgrid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:12px}
.pane{min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:18px}
#stage{background:var(--stage);padding:16px;container-type:inline-size;container-name:stage;overscroll-behavior:contain}
#stageRoot{max-width:1280px;margin:0 auto}
/* as simulações usam breakpoints da janela; no palco elas seguem a largura do painel */
@container stage (max-width: 1040px){
  .sm-mod>.grid{grid-template-columns:minmax(0,1fr)!important}
  .sm-mod>.grid>*{grid-column:auto!important}
}

/* painel da lição */
.lmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
#lesson .lp h2{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}
.concept{font-size:15px}
.concept p{margin:0 0 10px}
.concept b{font-weight:700}
.tip{border-left:3px solid var(--amber);background:var(--amber-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;margin:6px 0 4px}
.tip b{color:var(--amber);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
#lesson .lp h3{font-size:15px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;font-weight:600}
.goals{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;align-items:start;font-size:14.5px}
.goals b{font-weight:700}
.goals .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .25s,border-color .25s}
.goals .ck svg{width:12px;height:12px;opacity:0;display:block}
.goals li.ok .ck{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.goals li.ok .ck svg{opacity:1}
.goals li.ok>span:last-child{color:var(--muted)}
.quiz p{margin:0 0 10px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;padding:9px 12px;border-radius:10px;border:1px solid var(--line)!important;background:var(--bg);cursor:pointer;font-size:14px}
.opts button:hover:not(:disabled){border-color:var(--accent)!important}
.opts button:disabled{cursor:default}

<noscript><div style="padding:16px;max-width:760px;margin:0 auto;overflow:auto;height:100%"><h1>Stats.Micro</h1><p>Free micro-lessons to learn probability and statistics with live simulations in your browser: Law of Large Numbers, Bayes, distributions, Central Limit Theorem, confidence intervals, bootstrap and regression. JavaScript is required to run the simulations.</p><h2>Basic probability</h2><p>Chance, expected value and spread: the three ideas everything else is built on.</p><h2>Compound probability</h2><p>Combining events: sets, counting and conditional probability.</p><h2>Distributions</h2><p>Families of random variables, discrete and continuous.</p><h2>Frequentist inference</h2><p>From a sample to the population: sampling distributions, intervals and the bootstrap.</p><h2>Bayesian inference</h2><p>Updating beliefs with data: priors, posteriors and Bayes factors.</p><h2>Regression</h2><p>Relationships between two variables: least squares and correlation.</p><ol><li>Law of Large Numbers</li><li>Expected value</li><li>Variance and spread</li><li>Sets and Venn diagrams</li><li>Counting: permutations and combinations</li><li>Conditional probability and Bayes</li><li>Discrete distributions</li><li>Continuous distributions</li><li>Sampling distribution and the CLT</li><li>Confidence intervals</li><li>The bootstrap</li><li>Prior and posterior: Beta-Binomial</li><li>Bayes factors</li><li>Least squares regression</li><li>Correlation</li></ol><h2>Glossary</h2><dl><dt>Base rate (prevalence)</dt><dd>How common a condition is in the population before any test; it is the prior in Bayes&#x27; theorem.</dd><dt>Bayes factor</dt><dd>The ratio of the likelihoods of the evidence under two hypotheses; it converts prior odds into posterior odds.</dd><dt>Bayes&#x27; theorem</dt><dd>The rule that reverses a conditional probability, combining the evidence with the base rate.</dd><dt>Bernoulli distribution</dt><dd>A single trial with two outcomes: success (1) with probability p, failure (0) otherwise.</dd><dt>Beta distribution</dt><dd>A distribution on [0, 1] with shape parameters α and β, often used for an unknown probability.</dd><dt>Binomial distribution</dt><dd>The number of successes in n independent trials, each with success probability p.</dd><dt>Bootstrap</dt><dd>Estimating uncertainty by resampling the observed data with replacement many times.</dd><dt>CDF (cumulative distribution function)</dt><dd>The probability that the variable is at most x: F(x) = P(X ≤ x).</dd><dt>Central Limit Theorem</dt><dd>For large n, the sample mean is approximately normal, whatever the shape of the population.</dd><dt>Combination</dt><dd>An unordered selection of r items out of n: order does not matter.</dd><dt>Complement</dt><dd>Aᶜ: the event that A does not happen.</dd><dt>Conditional probability</dt><dd>P(A | B): the probability of A given that B has happened.</dd><dt>Confidence interval</dt><dd>A range built by a method that captures the true parameter in a set share of repetitions, such as 95%.</dd><dt>Correlation (Pearson&#x27;s r)</dt><dd>A measure from −1 to +1 of the strength and direction of a linear relationship. It does not prove causation.</dd><dt>Event</dt><dd>A set of possible outcomes of a random experiment, such as “the die shows an even number”.</dd><dt>Expected value</dt><dd>The probability-weighted average of the outcomes; the long-run average of a random variable.</dd><dt>Exponential distribution</dt><dd>A model for waiting times between independent events occurring at rate λ.</dd><dt>Factorial</dt><dd>n! is the product of all integers from 1 to n: the number of ways to order n distinct items.</dd><dt>False positive</dt><dd>A positive result for someone who does not have the condition. Its rate is P(+ | healthy).</dd><dt>Geometric distribution</dt><dd>The number of trials until the first success.</dd><dt>Inclusion–exclusion</dt><dd>The rule for the probability of a union that subtracts the overlap counted twice.</dd><dt>Intersection</dt><dd>A ∩ B: the event that A and B both happen.</dd><dt>Law of Large Numbers</dt><dd>As the number of trials grows, the observed proportion or average gets closer to the true probability or expected value.</dd><dt>Least squares (OLS)</dt><dd>The method that chooses the line minimizing the sum of squared residuals.</dd><dt>Likelihood</dt><dd>How probable the observed data are under a given hypothesis or parameter value.</dd><dt>Margin of error</dt><dd>The ± part of a confidence interval: critical value times standard error.</dd><dt>Mutually exclusive events</dt><dd>Events that cannot happen together, so P(A ∩ B) = 0.</dd><dt>Normal distribution</dt><dd>The symmetric bell curve defined by its mean μ and standard deviation σ.</dd><dt>Odds</dt><dd>The ratio between the probability that something happens and the probability that it does not.</dd><dt>Outlier</dt><dd>A value far from the rest of the data. It strongly affects the mean, the variance and least squares fits.</dd><dt>PMF (probability mass function)</dt><dd>For a discrete variable, the probability of each exact value: P(X = k).</dd><dt>Permutation</dt><dd>An ordered selection of r items out of n: order matters.</dd><dt>Poisson distribution</dt><dd>The number of events in a fixed interval when they occur independently at an average rate λ.</dd><dt>Posterior</dt><dd>The updated distribution after combining the prior with the data.</dd><dt>Prior</dt><dd>The probability distribution expressing beliefs about a parameter before seeing the data.</dd><dt>Probability</dt><dd>A number between 0 and 1 that measures how likely an event is: 0 is impossible, 1 is certain.</dd><dt>Probability density (PDF)</dt><dd>For a continuous variable, the curve whose area over an interval gives the probability of that interval.</dd><dt>Random variable</dt><dd>A numerical result of a random process, such as the face of a die or the number of heads in 10 flips.</dd><dt>Residual</dt><dd>The vertical distance between an observed point and the regression line: y − ŷ.</dd><dt>R² (coefficient of determination)</dt><dd>The share of the variance of y explained by the regression line; for a simple line it equals r².</dd><dt>SSE (sum of squared errors)</dt><dd>The sum of squared residuals; least squares makes it as small as possible.</dd><dt>Sample mean</dt><dd>The average of the observed values in a sample; it estimates the population mean μ.</dd><dt>Sampling distribution</dt><dd>The distribution of a statistic, such as the mean, over many samples of the same size.</dd><dt>Sensitivity</dt><dd>The share of people with the condition who test positive: P(+ | sick).</dd><dt>Standard deviation</dt><dd>The square root of the variance, in the same units as the data.</dd><dt>Standard error</dt><dd>The standard deviation of a statistic across samples; for the mean it is σ/√n.</dd><dt>Union</dt><dd>A ∪ B: the event that A or B (or both) happens.</dd><dt>Variance</dt><dd>The average of the squared distances from the mean; it measures spread.</dd></dl></div></noscript>

of reading formulas first, you run a live simulation, watch the idea happen and only then put a name to it.</p><p>Each lesson pairs a short concept with a <b>mission</b> in the simulation and a <b>check question</b>. Missions tick themselves off as soon as the simulation reaches the goal.</p>", "about.how.h": "How to learn here", "about.how.p": "<ul><li><b>Follow the tracks in order</b> if you are starting out: each one builds on the previous.</li><li><b>Experiment beyond the mission.</b> Change parameters, push them to extremes and predict what will happen before you click.</li><li><b>Use the Simulation Lab</b> to revisit any simulation without missions, and the <b>Glossary</b> to look up a term.</li><li>Completing a lesson earns <b>20 XP</b>, plus 5 if you answer the question on the first try.</li></ul>", "about.tracks.h": "What you will learn", "about.who.h": "Who it is for", "about.who.p": "<p>Students meeting statistics for the first time, professionals who use data and want intuition behind the formulas, and teachers looking for interactive material for class. No installation, no account, and no math beyond basic algebra.</p>", "about.privacy.h": "Privacy and your data", "about.privacy.p": "<p>Everything runs in your browser. There is no server, no account, no cookies and no tracking. Your progress (completed lessons and XP), language and theme are saved only in this browser's local storage.</p>", "about.reset": "Erase my progress", "about.resetAsk": "Erase all completed lessons and XP in this browser?", "about.resetDone": "Progress erased", "about.credits.h": "Credits", "about.credits.p": "<p>An independent educational project, part of the <b>.Micro</b> family of micro-learning platforms. The simulations are computed live with <b>React</b> (MIT license) and <b>D3</b> (ISC license), with icons from <b>Lucide</b> (ISC license). Lesson texts, missions and questions are original.</p>", "about.version": "Version {v} · {d}", "about.cta": "Start learning", "about.date": "October 2026"}, "tracks": [{"title": "Basic probability", "desc": "Chance, expected value and spread: the three ideas everything else is built on."}, {"title": "Compound probability", "desc": "Combining events: sets, counting and conditional probability."}, {"title": "Distributions", "desc": "Families of random variables, discrete and continuous."}, {"title": "Frequentist inference", "desc": "From a sample to the population: sampling distributions, intervals and the bootstrap."}, {"title": "Bayesian inference", "desc": "Updating beliefs with data: priors, posteriors and Bayes factors."}, {"title": "Regression", "desc": "Relationships between two variables: least squares and correlation."}], "lessons": {"l1": {"title": "Law of Large Numbers", "concept": "<p>A coin has a fixed <b>probability</b> p of landing heads, but each flip is unpredictable. What becomes predictable is the <b>proportion</b> of heads over many flips.</p><p>The <b>Law of Large Numbers</b> says that this observed proportion p̂ gets closer and closer to p as the number of trials n grows. With 10 flips it swings wildly; with 1,000 it barely moves.</p>", "tip": "Casinos and insurers rely on this: a single bet or claim is random, but the average over thousands of them is very stable.", "goals": ["Flip at least <b>100</b> coins and watch the line.", "Reach <b>1,000</b> flips (the continuous stream helps).", "Change the coin's bias to <b>30% or less, or 70% or more</b>, and flip 100 more times."], "quiz": {"q": "What does the Law of Large Numbers guarantee?", "o": ["The observed proportion approaches the true probability as the number of trials grows", "After a long run of heads, tails becomes more likely", "With 10 flips the proportion is already equal to p"], "why": "The law is about the long run average, not about compensation: the coin has no memory, the early swings are simply diluted by many new flips."}}, "l2": {"title": "Expected value", "concept": "<p>The <b>expected value</b> E[X] is the weighted average of the outcomes, each weighted by its probability: E[X] = Σ x·P(x). For a fair die it is 3.5, a value the die can never show.</p><p>Picture the probabilities as weights on a seesaw: E[X] is the point where it <b>balances</b>. The <b>sample mean</b> of many rolls converges to it.</p>", "tip": "Expected value is how lotteries, warranties and insurance are priced: the price is the expected payout plus a margin.", "goals": ["Roll the <b>fair</b> die at least <b>50</b> times.", "Load the die so that <b>E[X] ≥ 4.5</b>.", "With the loaded die, roll at least <b>100</b> times and bring the sample mean within <b>0.25</b> of E[X]."], "quiz": {"q": "A fair die has E[X] = 3.5. What does that mean?", "o": ["It is the long-run average of many rolls", "It is the most likely result of a single roll", "Half of the rolls will be exactly 3.5"], "why": "3.5 is never rolled. It is the balance point of the distribution and the value the average converges to."}}, "l3": {"title": "Variance and spread", "concept": "<p>Two data sets can share the same mean and still look nothing alike. <b>Variance</b> measures how far the points sit from the mean: the average of the <b>squared distances</b>.</p><p>Squaring makes distant points weigh much more, which is why a single outlier inflates the variance. The <b>standard deviation</b> σ = √variance brings the measure back to the units of the data.</p>", "tip": "In finance, the standard deviation of returns is called volatility: two funds with the same average return can carry very different risk.", "goals": ["Make the points tight: <b>variance below 0.5</b>.", "Spread them out: <b>variance above 12</b>."], "quiz": {"q": "Why does one far-away point raise the variance so much?", "o": ["Because distances are squared, so large deviations count much more", "Because it changes the number of points", "Because variance only looks at the largest value"], "why": "A point 4 units away contributes 16, while one 1 unit away contributes only 1. Squaring amplifies large deviations."}}, "l4": {"title": "Sets and Venn diagrams", "concept": "<p>Events are <b>sets</b> of outcomes. A ∪ B (union) happens when A or B happens; A ∩ B (intersection) when both happen; Aᶜ (complement) when A does not.</p><p>The <b>inclusion–exclusion</b> rule avoids counting the overlap twice: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). If the sets do not overlap, the events are <b>mutually exclusive</b> and P(A ∩ B) = 0.</p>", "tip": "Search engines combine terms exactly like this: AND is an intersection, OR is a union, NOT is a complement.", "goals": ["Highlight the <b>intersection</b> A ∩ B.", "Pull the circles apart until <b>P(A ∩ B) = 0</b>.", "Highlight the <b>complement</b> Aᶜ."], "quiz": {"q": "Why do we subtract P(A ∩ B) in P(A ∪ B) = P(A) + P(B) − P(A ∩ B)?", "o": ["Because the overlap was counted twice, once in P(A) and once in P(B)", "Because the intersection never happens", "Because probabilities must always decrease"], "why": "The overlap belongs to both circles, so adding P(A) and P(B) counts it twice. Subtracting it once fixes the total."}}, "l5": {"title": "Counting: permutations and combinations", "concept": "<p>When choosing r items from n, ask one question: <b>does order matter?</b></p><p>If it does, you count <b>permutations</b>: nPr = n! / (n − r)!. If it does not, you count <b>combinations</b>: nCr = n! / (r!·(n − r)!). Each combination appears r! times among the permutations, which is exactly the factor between them.</p>", "tip": "A lottery ticket is a combination (the order of the numbers is irrelevant); a podium of 1st, 2nd and 3rd place is a permutation.", "goals": ["Switch to <b>permutations</b> (order matters).", "Get exactly <b>35 combinations</b>.", "Get exactly <b>120 permutations</b>."], "quiz": {"q": "Choosing 3 people out of 5 for a committee with no roles: permutations or combinations?", "o": ["Combinations, because the order of selection does not matter", "Permutations, because each person is different", "Neither, you just multiply 5 × 3"], "why": "Without roles, {Ana, Bia, Caio} is the same committee in any order: 5C3 = 10. With roles it would be 5P3 = 60."}}, "l6": {"title": "Conditional probability and Bayes", "concept": "<p>P(A | B) is the probability of A <b>given</b> that B happened. A medical test gives P(+ | sick), its sensitivity. The patient wants the opposite: P(sick | +).</p><p><b>Bayes' theorem</b> connects the two, and the key ingredient is the <b>base rate</b> (prevalence). When a disease is rare, most positive results come from the many healthy people who get false alarms.</p>", "tip": "This is why screening programs confirm a positive result with a second, more specific test before any diagnosis.", "goals": ["Filter the population to show only those who <b>tested positive</b>.", "Raise the prevalence until <b>P(sick | +) ≥ 60%</b>.", "With prevalence at <b>2% or less</b>, push <b>P(sick | +) above 50%</b> by lowering the false positive rate."], "quiz": {"q": "A test is 95% sensitive, but the disease affects 2% of people. Why can most positives be false?", "o": ["Because the healthy group is so large that its few false alarms outnumber the true positives", "Because the test is broken", "Because sensitivity and P(sick | +) are always equal"], "why": "With 1,000 people: about 19 true positives, but 5% of the 980 healthy (about 49) also test positive. Most positives are false alarms."}}, "l7": {"title": "Discrete distributions", "concept": "<p>A <b>discrete</b> random variable takes countable values: 0, 1, 2… Its <b>PMF</b> gives P(X = k) for each value; its <b>CDF</b> accumulates them, P(X ≤ k).</p><p>Each family models a kind of count: <b>Bernoulli</b> (one yes/no trial), <b>Binomial</b> (successes in n trials), <b>Geometric</b> (trials until the first success) and <b>Poisson</b> (events in an interval, with rate λ).</p>", "tip": "Poisson describes calls arriving at a call center per minute, typos per page or goals per match.", "goals": ["Switch to the <b>Poisson</b> distribution.", "Draw at least <b>100</b> Poisson samples and compare them with the bars.", "Look at the <b>CDF</b> view."], "quiz": {"q": "Which distribution counts the number of trials until the first success?", "o": ["Geometric", "Binomial", "Poisson"], "why": "The Binomial counts successes in a fixed number of trials; the Geometric counts how long you wait for the first one."}}, "l8": {"title": "Continuous distributions", "concept": "<p>A <b>continuous</b> variable can take any value in an interval. The probability of an exact point is zero; what matters is the <b>area under the density curve</b>: P(a ≤ X ≤ b).</p><p>The <b>Normal</b> distribution concentrates about 68% of its area within one σ of the mean and about 95% within two. The <b>Exponential</b> models waiting times; the <b>Beta</b> lives between 0 and 1.</p>", "tip": "Heights, measurement errors and test scores are roughly normal; the time until the next bus arrives is closer to exponential.", "goals": ["On the <b>Normal</b>, widen the interval [a, b] until the area reaches <b>95%</b>.", "Switch to the <b>Exponential</b> distribution.", "Draw at least <b>200</b> samples."], "quiz": {"q": "For a continuous variable, what is P(X = 1.5 exactly)?", "o": ["Zero: only intervals have positive probability", "The height of the curve at 1.5", "It depends on the sample size"], "why": "A single point has no width, so its area is zero. The curve's height is a density, not a probability."}}, "l9": {"title": "Sampling distribution and the CLT", "concept": "<p>Take a sample of size n and compute its mean. Repeat many times: the means form the <b>sampling distribution</b>.</p><p>The <b>Central Limit Theorem</b> says that, whatever the shape of the population (skewed, bimodal, flat), this distribution approaches a <b>Normal</b> centered on μ, with standard error σ/√n. Larger samples make it narrower.</p>", "tip": "The CLT is why polls, A/B tests and quality control can use the normal curve even when the raw data are far from normal.", "goals": ["Collect at least <b>250</b> sample means.", "Switch to the <b>bimodal</b> population and collect 250 means again.", "Raise the sample size to <b>n ≥ 32</b> and collect 250 means."], "quiz": {"q": "What happens to the spread of the sample means when n grows from 4 to 64?", "o": ["It shrinks, because the standard error σ/√n gets 4 times smaller", "It grows, because there are more data", "It stays the same, it only depends on the population"], "why": "√64 / √4 = 4, so the standard error falls to a quarter. Bigger samples give more precise means."}}, "l10": {"title": "Confidence intervals", "concept": "<p>A <b>confidence interval</b> is the estimate ± a margin of error: x̄ ± z*·σ/√n. The confidence level refers to the <b>method</b>, not to one interval.</p><p>If you repeat the experiment many times, about 95% of the 95% intervals will contain the true mean μ. Any single interval either contains it or not. Higher confidence means <b>wider</b> intervals; larger n means <b>narrower</b> ones.</p>", "tip": "The “margin of error” in election polls is exactly this ± part, usually at a 95% confidence level.", "goals": ["Switch the confidence level to <b>99%</b>.", "Increase the sample size to <b>n = 50</b>.", "Generate at least <b>3 new batches</b> of 100 intervals and watch the coverage."], "quiz": {"q": "What does “95% confidence” mean?", "o": ["95% of intervals built this way contain the true mean", "There is a 95% chance that μ is in this specific interval", "95% of the data fall inside the interval"], "why": "The 95% describes the long-run success rate of the procedure. A computed interval is fixed: it contains μ or it does not."}}, "l11": {"title": "The bootstrap", "concept": "<p>With only one sample, how do we know how much the mean would vary? The <b>bootstrap</b> resamples the data itself <b>with replacement</b>, many times, recomputing the mean each time.</p><p>The spread of these bootstrap means estimates the <b>standard error</b>, and the 2.5% and 97.5% percentiles give a <b>95% confidence interval</b>, all without formulas or normality assumptions.</p>", "tip": "The bootstrap is the go-to tool for statistics with no simple formula, like the median or a ratio between two metrics.", "goals": ["Create at least <b>25</b> bootstrap resamples so the interval appears.", "Reach at least <b>1,000</b> resamples."], "quiz": {"q": "Why must the bootstrap resample WITH replacement?", "o": ["Without replacement every resample would be the original sample, with the same mean", "To make the computation faster", "Because the original data are wrong"], "why": "Drawing n out of n without replacement just reshuffles the same values. Replacement creates variation that mimics new samples."}}, "l12": {"title": "Prior and posterior: Beta-Binomial", "concept": "<p>In Bayesian inference, a parameter (here, a coin's p) has a <b>prior</b> distribution expressing what we believe before the data. Observing data gives the <b>posterior</b>.</p><p>With a Beta(α, β) prior and coin flips, the update is simple: add heads to α and tails to β. A strong prior needs a lot of data to move; with enough data, <b>the data dominate</b> any reasonable prior. The simulated coin lands heads 65% of the time.</p>", "tip": "Recommendation systems use this to rate new items: a product with 2 reviews starts close to the prior and moves as reviews arrive.", "goals": ["With the <b>uniform</b> prior, flip at least <b>50</b> coins.", "Choose the <b>strong fair</b> prior Beta(20, 20) and flip at least <b>50</b> coins.", "Flip at least <b>300</b> coins until the posterior mean is within <b>0.05</b> of 0.65."], "quiz": {"q": "Why does the strong fair prior Beta(20, 20) resist the data at first?", "o": ["It already counts as 40 imaginary flips, so a few real flips barely move it", "Because the data are ignored in Bayesian inference", "Because Beta priors cannot change"], "why": "Beta(α, β) acts like α + β prior observations. With 300 real flips, the data outweigh those 40 and pull the posterior toward 0.65."}}, "l13": {"title": "Bayes factors", "concept": "<p>To compare two hypotheses, Bayes works with <b>odds</b>: posterior odds = prior odds × <b>Bayes factor</b>.</p><p>The Bayes factor BF = P(E | H₁) / P(E | H₂) measures how much more likely the evidence is under H₁. BF above 10 is <b>strong</b> evidence for H₁; below 1 the evidence favors H₂. Strong evidence can overturn even a skeptical prior.</p>", "tip": "Forensic experts report likelihood ratios in court for this reason: the jury supplies the prior, the evidence supplies the factor.", "goals": ["Make the evidence <b>strong</b> for H₁: <b>BF > 10</b>.", "Make the evidence favor H₂: <b>BF < 1</b>.", "With a skeptical prior (<b>P(H₁) ≤ 10%</b>), reach a posterior <b>P(H₁ | E) ≥ 50%</b>."], "quiz": {"q": "Prior odds are 1:4 and the Bayes factor is 8. What are the posterior odds?", "o": ["2:1", "1:32", "8:4, the same as before"], "why": "Posterior odds = prior odds × BF = (1/4) × 8 = 2, that is, 2:1 in favor of H₁."}}, "l14": {"title": "Least squares regression", "concept": "<p>A regression line ŷ = m·x + b predicts y from x. Each point's vertical distance to the line is its <b>residual</b>.</p><p><b>Ordinary least squares</b> (OLS) picks the m and b that minimize the <b>sum of squared residuals</b> (SSE). On the chart, each residual is a square: the best line has the smallest total area. Because of the squaring, a single outlier can pull the whole line.</p>", "tip": "Spreadsheet trendlines and most first models in economics and science are OLS fits.", "goals": ["Turn on <b>guess mode</b> to fit the line yourself.", "Bring your line's SSE within <b>10%</b> of the least squares SSE.", "Add a point by <b>clicking on the chart</b>."], "quiz": {"q": "What does OLS minimize?", "o": ["The sum of the squared vertical distances from the points to the line", "The number of points above the line", "The slope of the line"], "why": "OLS minimizes SSE = Σ(yᵢ − ŷᵢ)². That is why the squares in the chart get as small as possible in total."}}, "l15": {"title": "Correlation", "concept": "<p>Pearson's <b>r</b> measures the strength and direction of a <b>linear</b> relationship, from −1 (perfect negative) through 0 (none) to +1 (perfect positive). R² = r² is the share of variance explained by the line.</p><p>Watch out: r only sees straight lines. A perfect U-shaped curve can have r ≈ 0. And correlation alone does not prove causation.</p>", "tip": "Ice cream sales and drownings are correlated because both rise in summer, not because one causes the other.", "goals": ["Generate a <b>strong negative</b> correlation: sample r ≤ −0.8.", "Make the data <b>uncorrelated</b>: |r| < 0.1.", "Show the <b>U-shaped</b> curve and notice that r stays close to zero."], "quiz": {"q": "The points form a perfect U shape and r ≈ 0. What can you conclude?", "o": ["There is a strong relationship, but it is not linear", "x and y are independent", "The data contain an error"], "why": "r measures only linear association. A U-shape has a clear relationship whose positive and negative slopes cancel out."}}}, "gloss": {"probability": {"t": "Probability", "d": "A number between 0 and 1 that measures how likely an event is: 0 is impossible, 1 is certain."}, "lln": {"t": "Law of Large Numbers", "d": "As the number of trials grows, the observed proportion or average gets closer to the true probability or expected value."}, "random_variable": {"t": "Random variable", "d": "A numerical result of a random process, such as the face of a die or the number of heads in 10 flips."}, "expected_value": {"t": "Expected value", "d": "The probability-weighted average of the outcomes; the long-run average of a random variable."}, "sample_mean": {"t": "Sample mean", "d": "The average of the observed values in a sample; it estimates the population mean μ."}, "variance": {"t": "Variance", "d": "The average of the squared distances from the mean; it measures spread."}, "std_dev": {"t": "Standard deviation", "d": "The square root of the variance, in the same units as the data."}, "outlier": {"t": "Outlier", "d": "A value far from the rest of the data. It strongly affects the mean, the variance and least squares fits."}, "event": {"t": "Event", "d": "A set of possible outcomes of a random experiment, such as “the die shows an even number”."}, "union": {"t": "Union", "d": "A ∪ B: the event that A or B (or both) happens."}, "intersection": {"t": "Intersection", "d": "A ∩ B: the event that A and B both happen."}, "complement": {"t": "Complement", "d": "Aᶜ: the event that A does not happen."}, "mutually_exclusive": {"t": "Mutually exclusive events", "d": "Events that cannot happen together, so P(A ∩ B) = 0."}, "inclusion_exclusion": {"t": "Inclusion–exclusion", "d": "The rule for the probability of a union that subtracts the overlap counted twice."}, "factorial": {"t": "Factorial", "d": "n! is the product of all integers from 1 to n: the number of ways to order n distinct items."}, "permutation": {"t": "Permutation", "d": "An ordered selection of r items out of n: order matters."}, "combination": {"t": "Combination", "d": "An unordered selection of r items out of n: order does not matter."}, "conditional": {"t": "Conditional probability", "d": "P(A | B): the probability of A given that B has happened."}, "bayes_theorem": {"t": "Bayes' theorem", "d": "The rule that reverses a conditional probability, combining the evidence with the base rate."}, "base_rate": {"t": "Base rate (prevalence)", "d": "How common a condition is in the population before any test; it is the prior in Bayes' theorem."}, "sensitivity": {"t": "Sensitivity", "d": "The share of people with the condition who test positive: P(+ | sick)."}, "false_positive": {"t": "False positive", "d": "A positive result for someone who does not have the condition. Its rate is P(+ | healthy)."}, "pmf": {"t": "PMF (probability mass function)", "d": "For a discrete variable, the probability of each exact value: P(X = k)."}, "cdf": {"t": "CDF (cumulative distribution function)", "d": "The probability that the variable is at most x: F(x) = P(X ≤ x)."}, "bernoulli": {"t": "Bernoulli distribution", "d": "A single trial with two outcomes: success (1) with probability p, failure (0) otherwise."}, "binomial": {"t": "Binomial distribution", "d": "The number of successes in n independent trials, each with success probability p."}, "geometric": {"t": "Geometric distribution", "d": "The number of trials until the first success."}, "poisson": {"t": "Poisson distribution", "d": "The number of events in a fixed interval when they occur independently at an average rate λ."}, "pdf": {"t": "Probability density (PDF)", "d": "For a continuous variable, the curve whose area over an interval gives the probability of that interval."}, "normal": {"t": "Normal distribution", "d": "The symmetric bell curve defined by its mean μ and standard deviation σ."}, "exponential": {"t": "Exponential distribution", "d": "A model for waiting times between independent events occurring at rate λ."}, "beta": {"t": "Beta distribution", "d": "A distribution on [0, 1] with shape parameters α and β, often used for an unknown probability."}, "sampling_dist": {"t": "Sampling distribution", "d": "The distribution of a statistic, such as the mean, over many samples of the same size."}, "clt": {"t": "Central Limit Theorem", "d": "For large n, the sample mean is approximately normal, whatever the shape of the population."}, "standard_error": {"t": "Standard error", "d": "The standard deviation of a statistic across samples; for the mean it is σ/√n."}, "confidence_interval": {"t": "Confidence interval", "d": "A range built by a method that captures the true parameter in a set share of repetitions, such as 95%."}, "margin_error": {"t": "Margin of error", "d": "The ± part of a confidence interval: critical value times standard error."}, "bootstrap": {"t": "Bootstrap", "d": "Estimating uncertainty by resampling the observed data with replacement many times."}, "prior": {"t": "Prior", "d": "The probability distribution expressing beliefs about a parameter before seeing the data."}, "posterior": {"t": "Posterior", "d": "The updated distribution after combining the prior with the data."}, "likelihood": {"t": "Likelihood", "d": "How probable the observed data are under a given hypothesis or parameter value."}, "odds": {"t": "Odds", "d": "The ratio between the probability that something happens and the probability that it does not."}, "bayes_factor": {"t": "Bayes factor", "d": "The ratio of the likelihoods of the evidence under two hypotheses; it converts prior odds into posterior odds."}, "residual": {"t": "Residual", "d": "The vertical distance between an observed point and the regression line: y − ŷ."}, "ols": {"t": "Least squares (OLS)", "d": "The method that chooses the line minimizing the sum of squared residuals."}, "sse": {"t": "SSE (sum of squared errors)", "d": "The sum of squared residuals; least squares makes it as small as possible."}, "correlation": {"t": "Correlation (Pearson's r)", "d": "A measure from −1 to +1 of the strength and direction of a linear relationship. It does not prove causation."}, "r_squared": {"t": "R² (coefficient of determination)", "d": "The share of the variance of y explained by the regression line; for a simple line it equals r²."}}}, "pt": {"ui": {"brand.home": "Stats.Micro, início", "nav.sections": "Seções", "nav.tracks": "Trilhas", "nav.free": "Laboratório", "lang.label": "Idioma", "theme.toggle": "Alternar tema claro/escuro", "xp.lessons": "{n}/{t} lições", "hero.eyebrow": "Microaprendizagem · probabilidade e estatística interativas", "hero.title": "Estatística, <em>uma simulação</em> por vez.", "hero.lead": "Lições de 3 a 5 minutos em que você roda simulações de verdade: lança moedas, vicia dados, coleta amostras, monta intervalos de confiança e ajusta retas. Tudo é calculado ao vivo, aqui no navegador.", "hero.start": "Começar pela lição 1", "hero.continue": "Continuar: {t}", "hero.free": "Abrir o Laboratório", "hero.aria": "Proporção acumulada de caras convergindo para 0,5 em 500 lançamentos simulados", "hero.caption": "Calculado agora: {n} lançamentos simulados de uma moeda com p = 0,5.", "hero.chip": "p̂ = {v} após {n} lançamentos", "facts.lessons": "microlições", "facts.sims": "simulações ao vivo", "facts.tracks": "trilhas", "tracks.h": "Trilhas", "tracks.p": "{n} trilhas, do primeiro lançamento de moeda aos fatores de Bayes e à regressão. Cada lição tem um conceito curto, uma missão na simulação e uma pergunta de verificação.", "track.n": "Trilha {i} · {d}/{t}", "min": "{m} min", "lvl.beginner": "Iniciante", "lvl.intermediate": "Intermediário", "lvl.advanced": "Avançado", "how.h": "Como cada lição funciona", "how.1s": "1 · 1 min", "how.1t": "Leia o conceito", "how.1p": "Uma ideia por vez, com uma dica de onde ela aparece na vida real.", "how.2s": "2 · 2 a 3 min", "how.2t": "Rode a simulação", "how.2p": "Mova controles, colete amostras, arraste pontos. A missão se marca sozinha quando você atinge cada meta.", "how.3s": "3 · 30 s", "how.3t": "Verifique", "how.3p": "Uma pergunta para fixar a ideia. Missão cumprida e resposta certa concluem a lição e rendem XP.", "foot.text": "Projeto educacional independente. Todas as simulações rodam ao vivo no seu navegador, sem servidor e sem conta.", "foot.saved": "Progresso salvo neste navegador.", "tab.lesson": "Lição", "tab.sim": "Simulação", "l.track": "Trilha {i} · {t}", "l.inPractice": "Na prática", "l.mission": "Missão", "l.check": "Verificação", "l.notYet": "Ainda não. Olhe de novo a simulação e tente outra opção.", "l.doneTitle": "Lição concluída", "l.doneSub": "Continue explorando a simulação ou siga para a próxima lição.", "l.needQuiz": "Missão cumprida. Agora responda à pergunta.", "l.needMission": "Resposta certa. Agora conclua a missão na simulação.", "l.prev": "← Anterior", "l.reset": "Reiniciar simulação", "l.next": "Próxima →", "toast.step": "Missão: etapa {i} concluída", "toast.done": "Lição concluída · +{xp} XP", "toast.reset": "Simulação reiniciada", "toast.lab": "Aberta: {t}", "free.meta": "Espaço livre", "free.h": "Laboratório de Simulações", "free.p": "As {n} simulações, sem missões. Escolha uma e explore no seu ritmo.", "free.list": "Simulações", "stage.aria": "Simulação interativa", "seo.title": "Stats.Micro · Aprenda probabilidade e estatística simulando", "seo.desc": "Microlições gratuitas para aprender probabilidade e estatística com simulações ao vivo no navegador: Lei dos Grandes Números, Bayes, distribuições, Teorema do Limite Central, intervalos de confiança, bootstrap e regressão.", "nav.gloss": "Glossário", "nav.about": "Sobre", "gloss.eyebrow": "Referência", "gloss.h": "Glossário", "gloss.lead": "{n} termos usados nas lições, com uma definição curta, a fórmula principal e a lição em que cada ideia é praticada.", "gloss.search": "Buscar termos ou definições…", "gloss.none": "Nenhum termo corresponde a “{q}”.", "gloss.count": "{n} termos", "gloss.all": "Todos", "gloss.seeIn": "Pratique em:", "about.eyebrow": "Sobre o projeto", "about.h": "Sobre o Stats.Micro", "about.lead": "Uma plataforma gratuita de microaprendizagem para aprender probabilidade e estatística rodando simulações, uma pequena ideia por vez.", "about.what.h": "O que é", "about.what.p": "<p>O Stats.Micro transforma as ideias centrais de probabilidade e estatística em <b>{n} microlições</b> de 3 a 5 minutos. Em vez de ler fórmulas primeiro, você roda uma simulação ao vivo, vê a ideia acontecer e só então dá nome a ela.</p><p>Cada lição combina um conceito curto com uma <b>missão</b> na simulação e uma <b>pergunta de verificação</b>. As missões se marcam sozinhas assim que a simulação atinge a meta.</p>", "about.how.h": "Como aprender aqui", "about.how.p": "<ul><li><b>Siga as trilhas em ordem</b> se estiver começando: cada uma se apoia na anterior.</li><li><b>Experimente além da missão.</b> Mude os parâmetros, leve-os aos extremos e tente prever o resultado antes de clicar.</li><li><b>Use o Laboratório</b> para revisitar qualquer simulação sem missões, e o <b>Glossário</b> para consultar um termo.</li><li>Concluir uma lição rende <b>20 XP</b>, mais 5 se você acertar a pergunta de primeira.</li></ul>", "about.tracks.h": "O que você vai aprender", "about.who.h": "Para quem é", "about.who.p": "<p>Estudantes que estão conhecendo estatística, profissionais que usam dados e querem intuição por trás das fórmulas, e professores em busca de material interativo para a aula. Sem instalação, sem conta e sem matemática além de álgebra básica.</p>", "about.privacy.h": "Privacidade e seus dados", "about.privacy.p": "<p>Tudo roda no seu navegador. Não há servidor, conta, cookies nem rastreamento. Seu progresso (lições concluídas e XP), idioma e tema ficam salvos apenas no armazenamento local deste navegador.</p>", "about.reset": "Apagar meu progresso", "about.resetAsk": "Apagar todas as lições concluídas e o XP neste navegador?", "about.resetDone": "Progresso apagado", "about.credits.h": "Créditos", "about.credits.p": "<p>Projeto educacional independente, parte da família <b>.Micro</b> de plataformas de microaprendizagem. As simulações são calculadas ao vivo com <b>React</b> (licença MIT) e <b>D3</b> (licença ISC), com ícones do <b>Lucide</b> (licença ISC). Os textos das lições, as missões e as perguntas são originais.</p>", "about.version": "Versão {v} · {d}", "about.cta": "Começar a aprender", "about.date": "outubro de 2026"}, "tracks": [{"title": "Probabilidade básica", "desc": "Acaso, valor esperado e dispersão: as três ideias sobre as quais todo o resto se apoia."}, {"title": "Probabilidade composta", "desc": "Combinando eventos: conjuntos, contagem e probabilidade condicional."}, {"title": "Distribuições", "desc": "Famílias de variáveis aleatórias, discretas e contínuas."}, {"title": "Inferência frequentista", "desc": "Da amostra para a população: distribuições amostrais, intervalos e bootstrap."}, {"title": "Inferência bayesiana", "desc": "Atualizando crenças com dados: priori, posteriori e fatores de Bayes."}, {"title": "Regressão", "desc": "Relações entre duas variáveis: mínimos quadrados e correlação."}], "lessons": {"l1": {"title": "Lei dos Grandes Números", "concept": "<p>Uma moeda tem uma <b>probabilidade</b> fixa p de dar cara, mas cada lançamento é imprevisível. O que se torna previsível é a <b>proporção</b> de caras em muitos lançamentos.</p><p>A <b>Lei dos Grandes Números</b> diz que essa proporção observada p̂ fica cada vez mais perto de p à medida que o número de ensaios n cresce. Com 10 lançamentos ela oscila muito; com 1.000, quase não se mexe.</p>", "tip": "Cassinos e seguradoras dependem disso: uma aposta ou um sinistro isolado é aleatório, mas a média de milhares deles é muito estável.", "goals": ["Lance pelo menos <b>100</b> moedas e observe a linha.", "Chegue a <b>1.000</b> lançamentos (o fluxo contínuo ajuda).", "Mude o viés da moeda para <b>30% ou menos, ou 70% ou mais</b>, e lance mais 100 vezes."], "quiz": {"q": "O que a Lei dos Grandes Números garante?", "o": ["A proporção observada se aproxima da probabilidade real conforme o número de ensaios cresce", "Depois de uma sequência de caras, coroa fica mais provável", "Com 10 lançamentos a proporção já é igual a p"], "why": "A lei fala da média no longo prazo, não de compensação: a moeda não tem memória, as oscilações iniciais apenas se diluem em muitos lançamentos novos."}}, "l2": {"title": "Valor esperado", "concept": "<p>O <b>valor esperado</b> E[X] é a média dos resultados ponderada pelas probabilidades: E[X] = Σ x·P(x). Para um dado honesto ele vale 3,5, um valor que o dado nunca mostra.</p><p>Imagine as probabilidades como pesos numa gangorra: E[X] é o ponto onde ela <b>se equilibra</b>. A <b>média amostral</b> de muitas rolagens converge para ele.</p>", "tip": "O valor esperado é como loterias, garantias estendidas e seguros são precificados: o preço é o pagamento esperado mais uma margem.", "goals": ["Role o dado <b>honesto</b> pelo menos <b>50</b> vezes.", "Vicie o dado de modo que <b>E[X] ≥ 4,5</b>.", "Com o dado viciado, role pelo menos <b>100</b> vezes e deixe a média amostral a menos de <b>0,25</b> de E[X]."], "quiz": {"q": "Um dado honesto tem E[X] = 3,5. O que isso significa?", "o": ["É a média de longo prazo de muitas rolagens", "É o resultado mais provável de uma rolagem", "Metade das rolagens dará exatamente 3,5"], "why": "O 3,5 nunca sai no dado. Ele é o ponto de equilíbrio da distribuição e o valor para o qual a média converge."}}, "l3": {"title": "Variância e dispersão", "concept": "<p>Dois conjuntos de dados podem ter a mesma média e ser completamente diferentes. A <b>variância</b> mede o quanto os pontos se afastam da média: é a média das <b>distâncias ao quadrado</b>.</p><p>Elevar ao quadrado faz os pontos distantes pesarem muito mais, por isso um único outlier infla a variância. O <b>desvio padrão</b> σ = √variância traz a medida de volta para a unidade dos dados.</p>", "tip": "Em finanças, o desvio padrão dos retornos se chama volatilidade: dois fundos com o mesmo retorno médio podem ter riscos muito diferentes.", "goals": ["Junte os pontos: <b>variância abaixo de 0,5</b>.", "Espalhe os pontos: <b>variância acima de 12</b>."], "quiz": {"q": "Por que um único ponto distante aumenta tanto a variância?", "o": ["Porque as distâncias são elevadas ao quadrado, então desvios grandes contam muito mais", "Porque ele muda o número de pontos", "Porque a variância só olha para o maior valor"], "why": "Um ponto a 4 unidades contribui com 16, enquanto um a 1 unidade contribui com 1. O quadrado amplifica os desvios grandes."}}, "l4": {"title": "Conjuntos e diagramas de Venn", "concept": "<p>Eventos são <b>conjuntos</b> de resultados. A ∪ B (união) acontece quando A ou B acontece; A ∩ B (interseção), quando os dois acontecem; Aᶜ (complementar), quando A não acontece.</p><p>A regra de <b>inclusão-exclusão</b> evita contar a sobreposição duas vezes: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Se os conjuntos não se sobrepõem, os eventos são <b>mutuamente exclusivos</b> e P(A ∩ B) = 0.</p>", "tip": "Buscadores combinam termos exatamente assim: E é interseção, OU é união, NÃO é complementar.", "goals": ["Destaque a <b>interseção</b> A ∩ B.", "Afaste os círculos até que <b>P(A ∩ B) = 0</b>.", "Destaque o <b>complementar</b> Aᶜ."], "quiz": {"q": "Por que subtraímos P(A ∩ B) em P(A ∪ B) = P(A) + P(B) − P(A ∩ B)?", "o": ["Porque a sobreposição foi contada duas vezes, uma em P(A) e outra em P(B)", "Porque a interseção nunca acontece", "Porque probabilidades sempre precisam diminuir"], "why": "A sobreposição pertence aos dois círculos, então somar P(A) e P(B) a conta duas vezes. Subtraí-la uma vez corrige o total."}}, "l5": {"title": "Contagem: permutações e combinações", "concept": "<p>Ao escolher r itens entre n, faça uma pergunta: <b>a ordem importa?</b></p><p>Se importa, você conta <b>permutações</b>: nPr = n! / (n − r)!. Se não importa, conta <b>combinações</b>: nCr = n! / (r!·(n − r)!). Cada combinação aparece r! vezes entre as permutações, que é exatamente o fator entre as duas.</p>", "tip": "Um bilhete de loteria é uma combinação (a ordem dos números não importa); um pódio com 1º, 2º e 3º lugares é uma permutação.", "goals": ["Mude para <b>permutações</b> (a ordem importa).", "Obtenha exatamente <b>35 combinações</b>.", "Obtenha exatamente <b>120 permutações</b>."], "quiz": {"q": "Escolher 3 pessoas entre 5 para uma comissão sem cargos: permutações ou combinações?", "o": ["Combinações, porque a ordem de escolha não importa", "Permutações, porque cada pessoa é diferente", "Nenhuma das duas, basta multiplicar 5 × 3"], "why": "Sem cargos, {Ana, Bia, Caio} é a mesma comissão em qualquer ordem: 5C3 = 10. Com cargos seriam 5P3 = 60."}}, "l6": {"title": "Probabilidade condicional e Bayes", "concept": "<p>P(A | B) é a probabilidade de A <b>dado</b> que B aconteceu. Um exame informa P(+ | doente), a sensibilidade. O paciente quer o contrário: P(doente | +).</p><p>O <b>teorema de Bayes</b> liga as duas, e o ingrediente principal é a <b>taxa basal</b> (prevalência). Quando a doença é rara, a maioria dos positivos vem das muitas pessoas saudáveis que recebem alarmes falsos.</p>", "tip": "É por isso que programas de rastreamento confirmam um positivo com um segundo exame, mais específico, antes de qualquer diagnóstico.", "goals": ["Filtre a população para mostrar só quem <b>testou positivo</b>.", "Aumente a prevalência até <b>P(doente | +) ≥ 60%</b>.", "Com prevalência de <b>2% ou menos</b>, leve <b>P(doente | +) acima de 50%</b> reduzindo a taxa de falso positivo."], "quiz": {"q": "Um exame tem 95% de sensibilidade, mas a doença atinge 2% das pessoas. Por que a maioria dos positivos pode ser falsa?", "o": ["Porque o grupo saudável é tão grande que seus poucos alarmes falsos superam os verdadeiros positivos", "Porque o exame está com defeito", "Porque a sensibilidade e P(doente | +) são sempre iguais"], "why": "Em 1.000 pessoas: cerca de 19 verdadeiros positivos, mas 5% das 980 saudáveis (umas 49) também dão positivo. A maioria dos positivos é alarme falso."}}, "l7": {"title": "Distribuições discretas", "concept": "<p>Uma variável aleatória <b>discreta</b> assume valores contáveis: 0, 1, 2… A <b>PMF</b> dá P(X = k) para cada valor; a <b>CDF</b> acumula, P(X ≤ k).</p><p>Cada família modela um tipo de contagem: <b>Bernoulli</b> (um ensaio sim/não), <b>Binomial</b> (sucessos em n ensaios), <b>Geométrica</b> (ensaios até o primeiro sucesso) e <b>Poisson</b> (eventos num intervalo, com taxa λ).</p>", "tip": "A Poisson descreve ligações que chegam a uma central por minuto, erros de digitação por página ou gols por partida.", "goals": ["Mude para a distribuição de <b>Poisson</b>.", "Colete pelo menos <b>100</b> amostras de Poisson e compare com as barras.", "Veja a visão da <b>CDF</b>."], "quiz": {"q": "Qual distribuição conta o número de ensaios até o primeiro sucesso?", "o": ["Geométrica", "Binomial", "Poisson"], "why": "A Binomial conta sucessos num número fixo de ensaios; a Geométrica conta quanto tempo você espera pelo primeiro."}}, "l8": {"title": "Distribuições contínuas", "concept": "<p>Uma variável <b>contínua</b> pode assumir qualquer valor num intervalo. A probabilidade de um ponto exato é zero; o que importa é a <b>área sob a curva de densidade</b>: P(a ≤ X ≤ b).</p><p>A <b>Normal</b> concentra cerca de 68% da área a até um σ da média e cerca de 95% a até dois. A <b>Exponencial</b> modela tempos de espera; a <b>Beta</b> vive entre 0 e 1.</p>", "tip": "Alturas, erros de medição e notas de provas são aproximadamente normais; o tempo até o próximo ônibus está mais perto da exponencial.", "goals": ["Na <b>Normal</b>, abra o intervalo [a, b] até a área chegar a <b>95%</b>.", "Mude para a distribuição <b>Exponencial</b>.", "Colete pelo menos <b>200</b> amostras."], "quiz": {"q": "Para uma variável contínua, quanto vale P(X = 1,5 exatamente)?", "o": ["Zero: só intervalos têm probabilidade positiva", "A altura da curva em 1,5", "Depende do tamanho da amostra"], "why": "Um ponto não tem largura, então sua área é zero. A altura da curva é uma densidade, não uma probabilidade."}}, "l9": {"title": "Distribuição amostral e o TLC", "concept": "<p>Colete uma amostra de tamanho n e calcule a média. Repita muitas vezes: as médias formam a <b>distribuição amostral</b>.</p><p>O <b>Teorema do Limite Central</b> diz que, qualquer que seja a forma da população (assimétrica, bimodal, plana), essa distribuição se aproxima de uma <b>Normal</b> centrada em μ, com erro padrão σ/√n. Amostras maiores a deixam mais estreita.</p>", "tip": "O TLC é o motivo pelo qual pesquisas eleitorais, testes A/B e controle de qualidade podem usar a curva normal mesmo quando os dados brutos estão longe de ser normais.", "goals": ["Colete pelo menos <b>250</b> médias amostrais.", "Mude para a população <b>bimodal</b> e colete 250 médias de novo.", "Aumente o tamanho da amostra para <b>n ≥ 32</b> e colete 250 médias."], "quiz": {"q": "O que acontece com a dispersão das médias amostrais quando n passa de 4 para 64?", "o": ["Diminui, porque o erro padrão σ/√n fica 4 vezes menor", "Aumenta, porque há mais dados", "Fica igual, só depende da população"], "why": "√64 / √4 = 4, então o erro padrão cai para um quarto. Amostras maiores dão médias mais precisas."}}, "l10": {"title": "Intervalos de confiança", "concept": "<p>Um <b>intervalo de confiança</b> é a estimativa ± uma margem de erro: x̄ ± z*·σ/√n. O nível de confiança se refere ao <b>método</b>, não a um intervalo.</p><p>Se você repetir o experimento muitas vezes, cerca de 95% dos intervalos de 95% vão conter a média verdadeira μ. Cada intervalo, isoladamente, contém ou não contém. Mais confiança significa intervalos mais <b>largos</b>; n maior, intervalos mais <b>estreitos</b>.</p>", "tip": "A “margem de erro” das pesquisas eleitorais é exatamente essa parte ±, normalmente com 95% de confiança.", "goals": ["Mude o nível de confiança para <b>99%</b>.", "Aumente o tamanho da amostra para <b>n = 50</b>.", "Gere pelo menos <b>3 novos lotes</b> de 100 intervalos e observe a cobertura."], "quiz": {"q": "O que significa “95% de confiança”?", "o": ["95% dos intervalos construídos dessa forma contêm a média verdadeira", "Há 95% de chance de μ estar neste intervalo específico", "95% dos dados caem dentro do intervalo"], "why": "Os 95% descrevem a taxa de acerto do procedimento no longo prazo. Um intervalo já calculado é fixo: contém μ ou não."}}, "l11": {"title": "O bootstrap", "concept": "<p>Com uma única amostra, como saber o quanto a média variaria? O <b>bootstrap</b> reamostra os próprios dados <b>com reposição</b>, muitas vezes, recalculando a média a cada vez.</p><p>A dispersão dessas médias bootstrap estima o <b>erro padrão</b>, e os percentis de 2,5% e 97,5% dão um <b>intervalo de confiança de 95%</b>, tudo sem fórmulas nem suposição de normalidade.</p>", "tip": "O bootstrap é a ferramenta preferida para estatísticas sem fórmula simples, como a mediana ou a razão entre duas métricas.", "goals": ["Crie pelo menos <b>25</b> reamostragens bootstrap para o intervalo aparecer.", "Chegue a pelo menos <b>1.000</b> reamostragens."], "quiz": {"q": "Por que o bootstrap precisa reamostrar COM reposição?", "o": ["Sem reposição, toda reamostragem seria a amostra original, com a mesma média", "Para o cálculo ficar mais rápido", "Porque os dados originais estão errados"], "why": "Sortear n entre n sem reposição só embaralha os mesmos valores. A reposição cria variação que imita novas amostras."}}, "l12": {"title": "Priori e posteriori: Beta-Binomial", "concept": "<p>Na inferência bayesiana, um parâmetro (aqui, o p de uma moeda) tem uma distribuição <b>a priori</b> que expressa o que acreditamos antes dos dados. Observar os dados gera a <b>posteriori</b>.</p><p>Com uma priori Beta(α, β) e lançamentos de moeda, a atualização é simples: some as caras a α e as coroas a β. Uma priori forte precisa de muitos dados para se mover; com dados suficientes, <b>os dados dominam</b> qualquer priori razoável. A moeda simulada dá cara 65% das vezes.</p>", "tip": "Sistemas de recomendação usam isso para avaliar itens novos: um produto com 2 avaliações começa perto da priori e se move conforme as avaliações chegam.", "goals": ["Com a priori <b>uniforme</b>, lance pelo menos <b>50</b> moedas.", "Escolha a priori <b>forte e honesta</b> Beta(20, 20) e lance pelo menos <b>50</b> moedas.", "Lance pelo menos <b>300</b> moedas até a média a posteriori ficar a menos de <b>0,05</b> de 0,65."], "quiz": {"q": "Por que a priori forte e honesta Beta(20, 20) resiste aos dados no começo?", "o": ["Ela já vale por 40 lançamentos imaginários, então poucos lançamentos reais quase não a movem", "Porque os dados são ignorados na inferência bayesiana", "Porque prioris Beta não podem mudar"], "why": "Beta(α, β) funciona como α + β observações prévias. Com 300 lançamentos reais, os dados pesam mais que esses 40 e puxam a posteriori para 0,65."}}, "l13": {"title": "Fatores de Bayes", "concept": "<p>Para comparar duas hipóteses, Bayes trabalha com <b>chances</b> (odds): chances a posteriori = chances a priori × <b>fator de Bayes</b>.</p><p>O fator de Bayes BF = P(E | H₁) / P(E | H₂) mede quanto a evidência é mais provável sob H₁. BF acima de 10 é evidência <b>forte</b> a favor de H₁; abaixo de 1, a evidência favorece H₂. Uma evidência forte pode virar até uma priori cética.</p>", "tip": "Peritos forenses apresentam razões de verossimilhança no tribunal por isso: o júri traz a priori, a evidência traz o fator.", "goals": ["Torne a evidência <b>forte</b> a favor de H₁: <b>BF > 10</b>.", "Faça a evidência favorecer H₂: <b>BF < 1</b>.", "Com uma priori cética (<b>P(H₁) ≤ 10%</b>), chegue a uma posteriori <b>P(H₁ | E) ≥ 50%</b>."], "quiz": {"q": "As chances a priori são 1:4 e o fator de Bayes é 8. Quais são as chances a posteriori?", "o": ["2:1", "1:32", "8:4, as mesmas de antes"], "why": "Chances a posteriori = chances a priori × BF = (1/4) × 8 = 2, ou seja, 2:1 a favor de H₁."}}, "l14": {"title": "Regressão por mínimos quadrados", "concept": "<p>Uma reta de regressão ŷ = m·x + b prevê y a partir de x. A distância vertical de cada ponto até a reta é o seu <b>resíduo</b>.</p><p>Os <b>mínimos quadrados ordinários</b> (MQO/OLS) escolhem m e b que minimizam a <b>soma dos resíduos ao quadrado</b> (SSE). No gráfico, cada resíduo é um quadrado: a melhor reta tem a menor área total. Por causa do quadrado, um único outlier pode puxar a reta inteira.</p>", "tip": "As linhas de tendência das planilhas e a maioria dos primeiros modelos em economia e ciência são ajustes por mínimos quadrados.", "goals": ["Ative o <b>modo adivinhar</b> para ajustar a reta você mesmo.", "Deixe o SSE da sua reta a até <b>10%</b> do SSE de mínimos quadrados.", "Adicione um ponto <b>clicando no gráfico</b>."], "quiz": {"q": "O que os mínimos quadrados minimizam?", "o": ["A soma das distâncias verticais ao quadrado entre os pontos e a reta", "O número de pontos acima da reta", "A inclinação da reta"], "why": "O método minimiza SSE = Σ(yᵢ − ŷᵢ)². Por isso os quadrados do gráfico ficam, no total, os menores possíveis."}}, "l15": {"title": "Correlação", "concept": "<p>O <b>r</b> de Pearson mede a força e a direção de uma relação <b>linear</b>, de −1 (negativa perfeita) passando por 0 (nenhuma) até +1 (positiva perfeita). R² = r² é a parte da variância explicada pela reta.</p><p>Atenção: r só enxerga retas. Uma curva em U perfeita pode ter r ≈ 0. E correlação, sozinha, não prova causalidade.</p>", "tip": "Venda de sorvetes e afogamentos são correlacionados porque ambos sobem no verão, não porque um cause o outro.", "goals": ["Gere uma correlação <b>forte e negativa</b>: r amostral ≤ −0,8.", "Deixe os dados <b>sem correlação</b>: |r| < 0,1.", "Mostre a curva em <b>U</b> e repare que r fica perto de zero."], "quiz": {"q": "Os pontos formam um U perfeito e r ≈ 0. O que se pode concluir?", "o": ["Há uma relação forte, mas não linear", "x e y são independentes", "Os dados contêm um erro"], "why": "r mede só associação linear. Um U tem uma relação clara cujas inclinações positiva e negativa se anulam."}}}, "gloss": {"probability": {"t": "Probabilidade", "d": "Um número entre 0 e 1 que mede o quanto um evento é provável: 0 é impossível, 1 é certo."}, "lln": {"t": "Lei dos Grandes Números", "d": "Conforme o número de ensaios cresce, a proporção ou a média observada se aproxima da probabilidade ou do valor esperado verdadeiro."}, "random_variable": {"t": "Variável aleatória", "d": "Um resultado numérico de um processo aleatório, como a face de um dado ou o número de caras em 10 lançamentos."}, "expected_value": {"t": "Valor esperado", "d": "A média dos resultados ponderada pelas probabilidades; a média de longo prazo de uma variável aleatória."}, "sample_mean": {"t": "Média amostral", "d": "A média dos valores observados numa amostra; estima a média populacional μ."}, "variance": {"t": "Variância", "d": "A média das distâncias ao quadrado até a média; mede a dispersão."}, "std_dev": {"t": "Desvio padrão", "d": "A raiz quadrada da variância, na mesma unidade dos dados."}, "outlier": {"t": "Outlier (valor atípico)", "d": "Um valor distante do restante dos dados. Afeta muito a média, a variância e os ajustes por mínimos quadrados."}, "event": {"t": "Evento", "d": "Um conjunto de resultados possíveis de um experimento aleatório, como “o dado mostra um número par”."}, "union": {"t": "União", "d": "A ∪ B: o evento em que A ou B (ou ambos) acontece."}, "intersection": {"t": "Interseção", "d": "A ∩ B: o evento em que A e B acontecem juntos."}, "complement": {"t": "Complementar", "d": "Aᶜ: o evento em que A não acontece."}, "mutually_exclusive": {"t": "Eventos mutuamente exclusivos", "d": "Eventos que não podem acontecer juntos, então P(A ∩ B) = 0."}, "inclusion_exclusion": {"t": "Inclusão-exclusão", "d": "A regra para a probabilidade de uma união, que subtrai a sobreposição contada duas vezes."}, "factorial": {"t": "Fatorial", "d": "n! é o produto de todos os inteiros de 1 a n: o número de maneiras de ordenar n itens distintos."}, "permutation": {"t": "Permutação", "d": "Uma seleção ordenada de r itens entre n: a ordem importa."}, "combination": {"t": "Combinação", "d": "Uma seleção não ordenada de r itens entre n: a ordem não importa."}, "conditional": {"t": "Probabilidade condicional", "d": "P(A | B): a probabilidade de A dado que B aconteceu."}, "bayes_theorem": {"t": "Teorema de Bayes", "d": "A regra que inverte uma probabilidade condicional, combinando a evidência com a taxa basal."}, "base_rate": {"t": "Taxa basal (prevalência)", "d": "O quanto uma condição é comum na população antes de qualquer exame; é a priori no teorema de Bayes."}, "sensitivity": {"t": "Sensibilidade", "d": "A parcela das pessoas com a condição que testa positivo: P(+ | doente)."}, "false_positive": {"t": "Falso positivo", "d": "Um resultado positivo para quem não tem a condição. Sua taxa é P(+ | saudável)."}, "pmf": {"t": "PMF (função de massa de probabilidade)", "d": "Para uma variável discreta, a probabilidade de cada valor exato: P(X = k)."}, "cdf": {"t": "CDF (função de distribuição acumulada)", "d": "A probabilidade de a variável ser no máximo x: F(x) = P(X ≤ x)."}, "bernoulli": {"t": "Distribuição de Bernoulli", "d": "Um único ensaio com dois resultados: sucesso (1) com probabilidade p, fracasso (0) caso contrário."}, "binomial": {"t": "Distribuição binomial", "d": "O número de sucessos em n ensaios independentes, cada um com probabilidade de sucesso p."}, "geometric": {"t": "Distribuição geométrica", "d": "O número de ensaios até o primeiro sucesso."}, "poisson": {"t": "Distribuição de Poisson", "d": "O número de eventos num intervalo fixo quando eles ocorrem de forma independente a uma taxa média λ."}, "pdf": {"t": "Densidade de probabilidade (PDF)", "d": "Para uma variável contínua, a curva cuja área num intervalo dá a probabilidade desse intervalo."}, "normal": {"t": "Distribuição normal", "d": "A curva em sino simétrica definida pela média μ e pelo desvio padrão σ."}, "exponential": {"t": "Distribuição exponencial", "d": "Um modelo para tempos de espera entre eventos independentes que ocorrem a uma taxa λ."}, "beta": {"t": "Distribuição beta", "d": "Uma distribuição em [0, 1] com parâmetros de forma α e β, muito usada para uma probabilidade desconhecida."}, "sampling_dist": {"t": "Distribuição amostral", "d": "A distribuição de uma estatística, como a média, ao longo de muitas amostras do mesmo tamanho."}, "clt": {"t": "Teorema do Limite Central", "d": "Para n grande, a média amostral é aproximadamente normal, qualquer que seja a forma da população."}, "standard_error": {"t": "Erro padrão", "d": "O desvio padrão de uma estatística entre amostras; para a média vale σ/√n."}, "confidence_interval": {"t": "Intervalo de confiança", "d": "Uma faixa construída por um método que captura o parâmetro verdadeiro numa parcela fixa das repetições, como 95%."}, "margin_error": {"t": "Margem de erro", "d": "A parte ± de um intervalo de confiança: valor crítico vezes erro padrão."}, "bootstrap": {"t": "Bootstrap", "d": "Estimar a incerteza reamostrando os dados observados com reposição, muitas vezes."}, "prior": {"t": "A priori", "d": "A distribuição de probabilidade que expressa as crenças sobre um parâmetro antes de ver os dados."}, "posterior": {"t": "A posteriori", "d": "A distribuição atualizada depois de combinar a priori com os dados."}, "likelihood": {"t": "Verossimilhança", "d": "O quanto os dados observados são prováveis sob uma hipótese ou um valor do parâmetro."}, "odds": {"t": "Chances (odds)", "d": "A razão entre a probabilidade de algo acontecer e a de não acontecer."}, "bayes_factor": {"t": "Fator de Bayes", "d": "A razão entre as verossimilhanças da evidência sob duas hipóteses; converte chances a priori em chances a posteriori."}, "residual": {"t": "Resíduo", "d": "A distância vertical entre um ponto observado e a reta de regressão: y − ŷ."}, "ols": {"t": "Mínimos quadrados (MQO)", "d": "O método que escolhe a reta que minimiza a soma dos resíduos ao quadrado."}, "sse": {"t": "SSE (soma dos erros ao quadrado)", "d": "A soma dos resíduos ao quadrado; os mínimos quadrados a deixam a menor possível."}, "correlation": {"t": "Correlação (r de Pearson)", "d": "Uma medida de −1 a +1 da força e da direção de uma relação linear. Não prova causalidade."}, "r_squared": {"t": "R² (coeficiente de determinação)", "d": "A parcela da variância de y explicada pela reta de regressão; numa reta simples é igual a r²."}}}, "es": {"ui": {"brand.home": "Stats.Micro, inicio", "nav.sections": "Secciones", "nav.tracks": "Rutas", "nav.free": "Laboratorio", "lang.label": "Idioma", "theme.toggle": "Cambiar tema claro/oscuro", "xp.lessons": "{n}/{t} lecciones", "hero.eyebrow": "Microaprendizaje · probabilidad y estadística interactivas", "hero.title": "Estadística, <em>una simulación</em> a la vez.", "hero.lead": "Lecciones de 3 a 5 minutos en las que ejecutas simulaciones reales: lanzas monedas, cargas dados, extraes muestras, construyes intervalos de confianza y ajustas rectas. Todo se calcula en vivo, aquí en el navegador.", "hero.start": "Empezar por la lección 1", "hero.continue": "Continuar: {t}", "hero.free": "Abrir el Laboratorio", "hero.aria": "Proporción acumulada de caras convergiendo a 0,5 en 500 lanzamientos simulados", "hero.caption": "Calculado ahora: {n} lanzamientos simulados de una moneda con p = 0,5.", "hero.chip": "p̂ = {v} tras {n} lanzamientos", "facts.lessons": "microlecciones", "facts.sims": "simulaciones en vivo", "facts.tracks": "rutas", "tracks.h": "Rutas", "tracks.p": "{n} rutas, del primer lanzamiento de moneda a los factores de Bayes y la regresión. Cada lección tiene un concepto breve, una misión en la simulación y una pregunta de verificación.", "track.n": "Ruta {i} · {d}/{t}", "min": "{m} min", "lvl.beginner": "Inicial", "lvl.intermediate": "Intermedio", "lvl.advanced": "Avanzado", "how.h": "Cómo funciona cada lección", "how.1s": "1 · 1 min", "how.1t": "Lee el concepto", "how.1p": "Una idea a la vez, con un consejo sobre dónde aparece en la vida real.", "how.2s": "2 · 2 a 3 min", "how.2t": "Ejecuta la simulación", "how.2p": "Mueve controles, extrae muestras, arrastra puntos. La misión se marca sola cuando alcanzas cada meta.", "how.3s": "3 · 30 s", "how.3t": "Verifica", "how.3p": "Una pregunta para fijar la idea. Misión cumplida y respuesta correcta completan la lección y dan XP.", "foot.text": "Proyecto educativo independiente. Todas las simulaciones se ejecutan en vivo en tu navegador, sin servidor y sin cuenta.", "foot.saved": "Progreso guardado en este navegador.", "tab.lesson": "Lección", "tab.sim": "Simulación", "l.track": "Ruta {i} · {t}", "l.inPractice": "En la práctica", "l.mission": "Misión", "l.check": "Verificación", "l.notYet": "Todavía no. Mira de nuevo la simulación y prueba otra opción.", "l.doneTitle": "Lección completada", "l.doneSub": "Sigue explorando la simulación o pasa a la siguiente lección.", "l.needQuiz": "Misión cumplida. Ahora responde la pregunta.", "l.needMission": "Respuesta correcta. Ahora completa la misión en la simulación.", "l.prev": "← Anterior", "l.reset": "Reiniciar simulación", "l.next": "Siguiente →", "toast.step": "Misión: paso {i} completado", "toast.done": "Lección completada · +{xp} XP", "toast.reset": "Simulación reiniciada", "toast.lab": "Abierta: {t}", "free.meta": "Espacio libre", "free.h": "Laboratorio de Simulaciones", "free.p": "Las {n} simulaciones, sin misiones. Elige una y explora a tu ritmo.", "free.list": "Simulaciones", "stage.aria": "Simulación interactiva", "seo.title": "Stats.Micro · Aprende probabilidad y estadística simulando", "seo.desc": "Microlecciones gratuitas para aprender probabilidad y estadística con simulaciones en vivo en el navegador: Ley de los Grandes Números, Bayes, distribuciones, Teorema del Límite Central, intervalos de confianza, bootstrap y regresión.", "nav.gloss": "Glosario", "nav.about": "Acerca de", "gloss.eyebrow": "Referencia", "gloss.h": "Glosario", "gloss.lead": "{n} términos usados en las lecciones, con una definición breve, la fórmula clave y la lección donde se practica cada idea.", "gloss.search": "Buscar términos o definiciones…", "gloss.none": "Ningún término coincide con “{q}”.", "gloss.count": "{n} términos", "gloss.all": "Todos", "gloss.seeIn": "Practica en:", "about.eyebrow": "Sobre el proyecto", "about.h": "Acerca de Stats.Micro", "about.lead": "Una plataforma gratuita de microaprendizaje para aprender probabilidad y estadística ejecutando simulaciones, una pequeña idea a la vez.", "about.what.h": "Qué es", "about.what.p": "<p>Stats.Micro convierte las ideas centrales de la probabilidad y la estadística en <b>{n} microlecciones</b> de 3 a 5 minutos. En lugar de leer fórmulas primero, ejecutas una simulación en vivo, ves cómo ocurre la idea y solo entonces le pones nombre.</p><p>Cada lección combina un concepto br
