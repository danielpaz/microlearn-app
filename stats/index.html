eve con una <b>misión</b> en la simulación y una <b>pregunta de verificación</b>. Las misiones se marcan solas en cuanto la simulación alcanza la meta.</p>", "about.how.h": "Cómo aprender aquí", "about.how.p": "<ul><li><b>Sigue las rutas en orden</b> si estás empezando: cada una se apoya en la anterior.</li><li><b>Experimenta más allá de la misión.</b> Cambia los parámetros, llévalos a los extremos e intenta predecir el resultado antes de hacer clic.</li><li><b>Usa el Laboratorio</b> para volver a cualquier simulación sin misiones, y el <b>Glosario</b> para consultar un término.</li><li>Completar una lección da <b>20 XP</b>, más 5 si aciertas la pregunta a la primera.</li></ul>", "about.tracks.h": "Qué vas a aprender", "about.who.h": "Para quién es", "about.who.p": "<p>Estudiantes que se acercan por primera vez a la estadística, profesionales que usan datos y quieren intuición detrás de las fórmulas, y docentes que buscan material interactivo para clase. Sin instalación, sin cuenta y sin más matemáticas que álgebra básica.</p>", "about.privacy.h": "Privacidad y tus datos", "about.privacy.p": "<p>Todo se ejecuta en tu navegador. No hay servidor, cuenta, cookies ni rastreo. Tu progreso (lecciones completadas y XP), idioma y tema se guardan solo en el almacenamiento local de este navegador.</p>", "about.reset": "Borrar mi progreso", "about.resetAsk": "¿Borrar todas las lecciones completadas y el XP en este navegador?", "about.resetDone": "Progreso borrado", "about.credits.h": "Créditos", "about.credits.p": "<p>Proyecto educativo independiente, parte de la familia <b>.Micro</b> de plataformas de microaprendizaje. Las simulaciones se calculan en vivo con <b>React</b> (licencia MIT) y <b>D3</b> (licencia ISC), con íconos de <b>Lucide</b> (licencia ISC). Los textos de las lecciones, las misiones y las preguntas son originales.</p>", "about.version": "Versión {v} · {d}", "about.cta": "Empezar a aprender", "about.date": "octubre de 2026"}, "tracks": [{"title": "Probabilidad básica", "desc": "Azar, valor esperado y dispersión: las tres ideas sobre las que se apoya todo lo demás."}, {"title": "Probabilidad compuesta", "desc": "Combinando eventos: conjuntos, conteo y probabilidad condicional."}, {"title": "Distribuciones", "desc": "Familias de variables aleatorias, discretas y continuas."}, {"title": "Inferencia frecuentista", "desc": "De la muestra a la población: distribuciones muestrales, intervalos y bootstrap."}, {"title": "Inferencia bayesiana", "desc": "Actualizar creencias con datos: a priori, a posteriori y factores de Bayes."}, {"title": "Regresión", "desc": "Relaciones entre dos variables: mínimos cuadrados y correlación."}], "lessons": {"l1": {"title": "Ley de los Grandes Números", "concept": "<p>Una moneda tiene una <b>probabilidad</b> fija p de salir cara, pero cada lanzamiento es impredecible. Lo que sí se vuelve predecible es la <b>proporción</b> de caras en muchos lanzamientos.</p><p>La <b>Ley de los Grandes Números</b> dice que esa proporción observada p̂ se acerca cada vez más a p a medida que crece el número de ensayos n. Con 10 lanzamientos oscila mucho; con 1.000 casi no se mueve.</p>", "tip": "Casinos y aseguradoras dependen de esto: una apuesta o un siniestro aislado es aleatorio, pero el promedio de miles de ellos es muy estable.", "goals": ["Lanza al menos <b>100</b> monedas y observa la línea.", "Llega a <b>1.000</b> lanzamientos (el flujo continuo ayuda).", "Cambia el sesgo de la moneda a <b>30% o menos, o 70% o más</b>, y lanza 100 veces más."], "quiz": {"q": "¿Qué garantiza la Ley de los Grandes Números?", "o": ["La proporción observada se acerca a la probabilidad real a medida que crece el número de ensayos", "Después de una racha de caras, cruz se vuelve más probable", "Con 10 lanzamientos la proporción ya es igual a p"], "why": "La ley habla del promedio a largo plazo, no de compensación: la moneda no tiene memoria, las oscilaciones iniciales simplemente se diluyen en muchos lanzamientos nuevos."}}, "l2": {"title": "Valor esperado", "concept": "<p>El <b>valor esperado</b> E[X] es el promedio de los resultados ponderado por sus probabilidades: E[X] = Σ x·P(x). Para un dado justo vale 3,5, un valor que el dado nunca muestra.</p><p>Imagina las probabilidades como pesos en un balancín: E[X] es el punto donde <b>se equilibra</b>. La <b>media muestral</b> de muchas tiradas converge a él.</p>", "tip": "Así se ponen precio a loterías, garantías extendidas y seguros: el precio es el pago esperado más un margen.", "goals": ["Tira el dado <b>justo</b> al menos <b>50</b> veces.", "Carga el dado de modo que <b>E[X] ≥ 4,5</b>.", "Con el dado cargado, tira al menos <b>100</b> veces y deja la media muestral a menos de <b>0,25</b> de E[X]."], "quiz": {"q": "Un dado justo tiene E[X] = 3,5. ¿Qué significa?", "o": ["Es el promedio a largo plazo de muchas tiradas", "Es el resultado más probable de una tirada", "La mitad de las tiradas dará exactamente 3,5"], "why": "El 3,5 nunca sale en el dado. Es el punto de equilibrio de la distribución y el valor al que converge el promedio."}}, "l3": {"title": "Varianza y dispersión", "concept": "<p>Dos conjuntos de datos pueden tener la misma media y no parecerse en nada. La <b>varianza</b> mide cuánto se alejan los puntos de la media: es el promedio de las <b>distancias al cuadrado</b>.</p><p>Elevar al cuadrado hace que los puntos lejanos pesen mucho más, por eso un solo valor atípico infla la varianza. La <b>desviación estándar</b> σ = √varianza devuelve la medida a las unidades de los datos.</p>", "tip": "En finanzas, la desviación estándar de los rendimientos se llama volatilidad: dos fondos con el mismo rendimiento medio pueden tener riesgos muy distintos.", "goals": ["Junta los puntos: <b>varianza menor que 0,5</b>.", "Sepáralos: <b>varianza mayor que 12</b>."], "quiz": {"q": "¿Por qué un solo punto lejano aumenta tanto la varianza?", "o": ["Porque las distancias se elevan al cuadrado, así que las desviaciones grandes cuentan mucho más", "Porque cambia el número de puntos", "Porque la varianza solo mira el valor más grande"], "why": "Un punto a 4 unidades aporta 16, mientras que uno a 1 unidad aporta solo 1. El cuadrado amplifica las desviaciones grandes."}}, "l4": {"title": "Conjuntos y diagramas de Venn", "concept": "<p>Los eventos son <b>conjuntos</b> de resultados. A ∪ B (unión) ocurre cuando ocurre A o B; A ∩ B (intersección), cuando ocurren ambos; Aᶜ (complemento), cuando A no ocurre.</p><p>La regla de <b>inclusión-exclusión</b> evita contar el solapamiento dos veces: P(A ∪ B) = P(A) + P(B) − P(A ∩ B). Si los conjuntos no se solapan, los eventos son <b>mutuamente excluyentes</b> y P(A ∩ B) = 0.</p>", "tip": "Los buscadores combinan términos exactamente así: Y es intersección, O es unión, NO es complemento.", "goals": ["Resalta la <b>intersección</b> A ∩ B.", "Separa los círculos hasta que <b>P(A ∩ B) = 0</b>.", "Resalta el <b>complemento</b> Aᶜ."], "quiz": {"q": "¿Por qué restamos P(A ∩ B) en P(A ∪ B) = P(A) + P(B) − P(A ∩ B)?", "o": ["Porque el solapamiento se contó dos veces, una en P(A) y otra en P(B)", "Porque la intersección nunca ocurre", "Porque las probabilidades siempre deben disminuir"], "why": "El solapamiento pertenece a ambos círculos, así que sumar P(A) y P(B) lo cuenta dos veces. Restarlo una vez corrige el total."}}, "l5": {"title": "Conteo: permutaciones y combinaciones", "concept": "<p>Al elegir r elementos entre n, hazte una pregunta: <b>¿importa el orden?</b></p><p>Si importa, cuentas <b>permutaciones</b>: nPr = n! / (n − r)!. Si no importa, cuentas <b>combinaciones</b>: nCr = n! / (r!·(n − r)!). Cada combinación aparece r! veces entre las permutaciones, que es justo el factor entre ambas.</p>", "tip": "Un boleto de lotería es una combinación (el orden de los números no importa); un podio con 1.º, 2.º y 3.º lugar es una permutación.", "goals": ["Cambia a <b>permutaciones</b> (el orden importa).", "Obtén exactamente <b>35 combinaciones</b>.", "Obtén exactamente <b>120 permutaciones</b>."], "quiz": {"q": "Elegir 3 personas de 5 para un comité sin cargos: ¿permutaciones o combinaciones?", "o": ["Combinaciones, porque el orden de elección no importa", "Permutaciones, porque cada persona es diferente", "Ninguna, basta multiplicar 5 × 3"], "why": "Sin cargos, {Ana, Bea, Carlos} es el mismo comité en cualquier orden: 5C3 = 10. Con cargos serían 5P3 = 60."}}, "l6": {"title": "Probabilidad condicional y Bayes", "concept": "<p>P(A | B) es la probabilidad de A <b>dado</b> que ocurrió B. Una prueba médica informa P(+ | enfermo), su sensibilidad. El paciente quiere lo contrario: P(enfermo | +).</p><p>El <b>teorema de Bayes</b> conecta ambas, y el ingrediente clave es la <b>tasa base</b> (prevalencia). Cuando una enfermedad es rara, la mayoría de los positivos viene de las muchas personas sanas que reciben falsas alarmas.</p>", "tip": "Por eso los programas de cribado confirman un positivo con una segunda prueba, más específica, antes de cualquier diagnóstico.", "goals": ["Filtra la población para mostrar solo a quienes <b>dieron positivo</b>.", "Sube la prevalencia hasta <b>P(enfermo | +) ≥ 60%</b>.", "Con prevalencia de <b>2% o menos</b>, lleva <b>P(enfermo | +) por encima del 50%</b> bajando la tasa de falsos positivos."], "quiz": {"q": "Una prueba tiene 95% de sensibilidad, pero la enfermedad afecta al 2% de las personas. ¿Por qué la mayoría de los positivos puede ser falsa?", "o": ["Porque el grupo sano es tan grande que sus pocas falsas alarmas superan a los verdaderos positivos", "Porque la prueba está defectuosa", "Porque la sensibilidad y P(enfermo | +) siempre son iguales"], "why": "Con 1.000 personas: unos 19 verdaderos positivos, pero el 5% de las 980 sanas (unas 49) también da positivo. La mayoría de los positivos son falsas alarmas."}}, "l7": {"title": "Distribuciones discretas", "concept": "<p>Una variable aleatoria <b>discreta</b> toma valores contables: 0, 1, 2… Su <b>PMF</b> da P(X = k) para cada valor; su <b>CDF</b> los acumula, P(X ≤ k).</p><p>Cada familia modela un tipo de conteo: <b>Bernoulli</b> (un ensayo sí/no), <b>Binomial</b> (éxitos en n ensayos), <b>Geométrica</b> (ensayos hasta el primer éxito) y <b>Poisson</b> (eventos en un intervalo, con tasa λ).</p>", "tip": "La Poisson describe las llamadas que llegan a un centro de atención por minuto, las erratas por página o los goles por partido.", "goals": ["Cambia a la distribución de <b>Poisson</b>.", "Extrae al menos <b>100</b> muestras de Poisson y compáralas con las barras.", "Mira la vista de la <b>CDF</b>."], "quiz": {"q": "¿Qué distribución cuenta el número de ensayos hasta el primer éxito?", "o": ["Geométrica", "Binomial", "Poisson"], "why": "La Binomial cuenta éxitos en un número fijo de ensayos; la Geométrica cuenta cuánto esperas hasta el primero."}}, "l8": {"title": "Distribuciones continuas", "concept": "<p>Una variable <b>continua</b> puede tomar cualquier valor en un intervalo. La probabilidad de un punto exacto es cero; lo que importa es el <b>área bajo la curva de densidad</b>: P(a ≤ X ≤ b).</p><p>La <b>Normal</b> concentra cerca del 68% de su área a un σ de la media y cerca del 95% a dos. La <b>Exponencial</b> modela tiempos de espera; la <b>Beta</b> vive entre 0 y 1.</p>", "tip": "Estaturas, errores de medición y notas de exámenes son aproximadamente normales; el tiempo hasta el próximo autobús se parece más a la exponencial.", "goals": ["En la <b>Normal</b>, amplía el intervalo [a, b] hasta que el área llegue al <b>95%</b>.", "Cambia a la distribución <b>Exponencial</b>.", "Extrae al menos <b>200</b> muestras."], "quiz": {"q": "Para una variable continua, ¿cuánto vale P(X = 1,5 exactamente)?", "o": ["Cero: solo los intervalos tienen probabilidad positiva", "La altura de la curva en 1,5", "Depende del tamaño de la muestra"], "why": "Un punto no tiene anchura, así que su área es cero. La altura de la curva es una densidad, no una probabilidad."}}, "l9": {"title": "Distribución muestral y el TLC", "concept": "<p>Toma una muestra de tamaño n y calcula su media. Repite muchas veces: las medias forman la <b>distribución muestral</b>.</p><p>El <b>Teorema del Límite Central</b> dice que, sea cual sea la forma de la población (asimétrica, bimodal, plana), esta distribución se acerca a una <b>Normal</b> centrada en μ, con error estándar σ/√n. Las muestras más grandes la estrechan.</p>", "tip": "El TLC es la razón por la que encuestas, pruebas A/B y control de calidad pueden usar la curva normal aunque los datos brutos estén lejos de ser normales.", "goals": ["Reúne al menos <b>250</b> medias muestrales.", "Cambia a la población <b>bimodal</b> y reúne de nuevo 250 medias.", "Sube el tamaño de muestra a <b>n ≥ 32</b> y reúne 250 medias."], "quiz": {"q": "¿Qué le pasa a la dispersión de las medias muestrales cuando n pasa de 4 a 64?", "o": ["Disminuye, porque el error estándar σ/√n se vuelve 4 veces menor", "Aumenta, porque hay más datos", "Se mantiene, solo depende de la población"], "why": "√64 / √4 = 4, así que el error estándar cae a la cuarta parte. Muestras más grandes dan medias más precisas."}}, "l10": {"title": "Intervalos de confianza", "concept": "<p>Un <b>intervalo de confianza</b> es la estimación ± un margen de error: x̄ ± z*·σ/√n. El nivel de confianza se refiere al <b>método</b>, no a un intervalo.</p><p>Si repites el experimento muchas veces, cerca del 95% de los intervalos al 95% contendrán la media verdadera μ. Cada intervalo, por separado, la contiene o no. Más confianza significa intervalos más <b>anchos</b>; un n mayor, intervalos más <b>estrechos</b>.</p>", "tip": "El “margen de error” de las encuestas electorales es exactamente esta parte ±, normalmente con un 95% de confianza.", "goals": ["Cambia el nivel de confianza al <b>99%</b>.", "Aumenta el tamaño de muestra a <b>n = 50</b>.", "Genera al menos <b>3 lotes nuevos</b> de 100 intervalos y observa la cobertura."], "quiz": {"q": "¿Qué significa “95% de confianza”?", "o": ["El 95% de los intervalos construidos así contienen la media verdadera", "Hay un 95% de probabilidad de que μ esté en este intervalo concreto", "El 95% de los datos cae dentro del intervalo"], "why": "El 95% describe la tasa de acierto del procedimiento a largo plazo. Un intervalo ya calculado es fijo: contiene μ o no."}}, "l11": {"title": "El bootstrap", "concept": "<p>Con una sola muestra, ¿cómo saber cuánto variaría la media? El <b>bootstrap</b> remuestrea los propios datos <b>con reemplazo</b>, muchas veces, recalculando la media cada vez.</p><p>La dispersión de esas medias bootstrap estima el <b>error estándar</b>, y los percentiles 2,5% y 97,5% dan un <b>intervalo de confianza del 95%</b>, todo sin fórmulas ni supuestos de normalidad.</p>", "tip": "El bootstrap es la herramienta preferida para estadísticos sin fórmula sencilla, como la mediana o el cociente entre dos métricas.", "goals": ["Crea al menos <b>25</b> remuestreos bootstrap para que aparezca el intervalo.", "Llega a al menos <b>1.000</b> remuestreos."], "quiz": {"q": "¿Por qué el bootstrap debe remuestrear CON reemplazo?", "o": ["Sin reemplazo, cada remuestreo sería la muestra original, con la misma media", "Para que el cálculo sea más rápido", "Porque los datos originales están mal"], "why": "Sacar n de n sin reemplazo solo reordena los mismos valores. El reemplazo crea variación que imita nuevas muestras."}}, "l12": {"title": "A priori y a posteriori: Beta-Binomial", "concept": "<p>En la inferencia bayesiana, un parámetro (aquí, la p de una moneda) tiene una distribución <b>a priori</b> que expresa lo que creemos antes de los datos. Observar los datos produce la <b>a posteriori</b>.</p><p>Con una a priori Beta(α, β) y lanzamientos de moneda, la actualización es sencilla: suma las caras a α y las cruces a β. Una a priori fuerte necesita muchos datos para moverse; con datos suficientes, <b>los datos dominan</b> cualquier a priori razonable. La moneda simulada sale cara el 65% de las veces.</p>", "tip": "Los sistemas de recomendación lo usan para valorar artículos nuevos: un producto con 2 reseñas empieza cerca de la a priori y se mueve a medida que llegan reseñas.", "goals": ["Con la a priori <b>uniforme</b>, lanza al menos <b>50</b> monedas.", "Elige la a priori <b>fuerte y justa</b> Beta(20, 20) y lanza al menos <b>50</b> monedas.", "Lanza al menos <b>300</b> monedas hasta que la media a posteriori quede a menos de <b>0,05</b> de 0,65."], "quiz": {"q": "¿Por qué la a priori fuerte y justa Beta(20, 20) resiste a los datos al principio?", "o": ["Ya equivale a 40 lanzamientos imaginarios, así que pocos lanzamientos reales apenas la mueven", "Porque en la inferencia bayesiana se ignoran los datos", "Porque las a priori Beta no pueden cambiar"], "why": "Beta(α, β) actúa como α + β observaciones previas. Con 300 lanzamientos reales, los datos pesan más que esos 40 y llevan la a posteriori hacia 0,65."}}, "l13": {"title": "Factores de Bayes", "concept": "<p>Para comparar dos hipótesis, Bayes trabaja con <b>momios</b> (odds): momios a posteriori = momios a priori × <b>factor de Bayes</b>.</p><p>El factor de Bayes BF = P(E | H₁) / P(E | H₂) mide cuánto más probable es la evidencia bajo H₁. Un BF mayor que 10 es evidencia <b>fuerte</b> a favor de H₁; por debajo de 1 la evidencia favorece a H₂. Una evidencia fuerte puede revertir incluso una a priori escéptica.</p>", "tip": "Por eso los peritos forenses presentan razones de verosimilitud en los juicios: el jurado aporta la a priori y la evidencia aporta el factor.", "goals": ["Haz que la evidencia sea <b>fuerte</b> a favor de H₁: <b>BF > 10</b>.", "Haz que la evidencia favorezca a H₂: <b>BF < 1</b>.", "Con una a priori escéptica (<b>P(H₁) ≤ 10%</b>), alcanza una a posteriori <b>P(H₁ | E) ≥ 50%</b>."], "quiz": {"q": "Los momios a priori son 1:4 y el factor de Bayes es 8. ¿Cuáles son los momios a posteriori?", "o": ["2:1", "1:32", "8:4, los mismos que antes"], "why": "Momios a posteriori = momios a priori × BF = (1/4) × 8 = 2, es decir, 2:1 a favor de H₁."}}, "l14": {"title": "Regresión por mínimos cuadrados", "concept": "<p>Una recta de regresión ŷ = m·x + b predice y a partir de x. La distancia vertical de cada punto a la recta es su <b>residuo</b>.</p><p>Los <b>mínimos cuadrados ordinarios</b> (MCO/OLS) eligen m y b que minimizan la <b>suma de residuos al cuadrado</b> (SSE). En el gráfico, cada residuo es un cuadrado: la mejor recta tiene la menor área total. Por el cuadrado, un solo valor atípico puede arrastrar toda la recta.</p>", "tip": "Las líneas de tendencia de las hojas de cálculo y la mayoría de los primeros modelos en economía y ciencia son ajustes por mínimos cuadrados.", "goals": ["Activa el <b>modo adivinar</b> para ajustar la recta tú mismo.", "Deja el SSE de tu recta a menos de un <b>10%</b> del SSE de mínimos cuadrados.", "Añade un punto <b>haciendo clic en el gráfico</b>."], "quiz": {"q": "¿Qué minimizan los mínimos cuadrados?", "o": ["La suma de las distancias verticales al cuadrado entre los puntos y la recta", "El número de puntos por encima de la recta", "La pendiente de la recta"], "why": "El método minimiza SSE = Σ(yᵢ − ŷᵢ)². Por eso los cuadrados del gráfico quedan, en total, lo más pequeños posible."}}, "l15": {"title": "Correlación", "concept": "<p>La <b>r</b> de Pearson mide la fuerza y la dirección de una relación <b>lineal</b>, de −1 (negativa perfecta) pasando por 0 (ninguna) hasta +1 (positiva perfecta). R² = r² es la parte de la varianza explicada por la recta.</p><p>Cuidado: r solo ve rectas. Una curva en U perfecta puede tener r ≈ 0. Y la correlación, por sí sola, no prueba causalidad.</p>", "tip": "Las ventas de helados y los ahogamientos están correlacionados porque ambos suben en verano, no porque uno cause el otro.", "goals": ["Genera una correlación <b>fuerte y negativa</b>: r muestral ≤ −0,8.", "Deja los datos <b>sin correlación</b>: |r| < 0,1.", "Muestra la curva en <b>U</b> y fíjate en que r queda cerca de cero."], "quiz": {"q": "Los puntos forman una U perfecta y r ≈ 0. ¿Qué puedes concluir?", "o": ["Hay una relación fuerte, pero no lineal", "x e y son independientes", "Los datos tienen un error"], "why": "r solo mide asociación lineal. Una U tiene una relación clara cuyas pendientes positiva y negativa se anulan."}}}, "gloss": {"probability": {"t": "Probabilidad", "d": "Un número entre 0 y 1 que mide qué tan probable es un evento: 0 es imposible, 1 es seguro."}, "lln": {"t": "Ley de los Grandes Números", "d": "A medida que crece el número de ensayos, la proporción o el promedio observado se acerca a la probabilidad o al valor esperado verdadero."}, "random_variable": {"t": "Variable aleatoria", "d": "Un resultado numérico de un proceso aleatorio, como la cara de un dado o el número de caras en 10 lanzamientos."}, "expected_value": {"t": "Valor esperado", "d": "El promedio de los resultados ponderado por sus probabilidades; el promedio a largo plazo de una variable aleatoria."}, "sample_mean": {"t": "Media muestral", "d": "El promedio de los valores observados en una muestra; estima la media poblacional μ."}, "variance": {"t": "Varianza", "d": "El promedio de las distancias al cuadrado respecto de la media; mide la dispersión."}, "std_dev": {"t": "Desviación estándar", "d": "La raíz cuadrada de la varianza, en las mismas unidades que los datos."}, "outlier": {"t": "Valor atípico (outlier)", "d": "Un valor alejado del resto de los datos. Afecta mucho a la media, la varianza y los ajustes por mínimos cuadrados."}, "event": {"t": "Evento", "d": "Un conjunto de resultados posibles de un experimento aleatorio, como “el dado muestra un número par”."}, "union": {"t": "Unión", "d": "A ∪ B: el evento en que ocurre A o B (o ambos)."}, "intersection": {"t": "Intersección", "d": "A ∩ B: el evento en que A y B ocurren juntos."}, "complement": {"t": "Complemento", "d": "Aᶜ: el evento en que A no ocurre."}, "mutually_exclusive": {"t": "Eventos mutuamente excluyentes", "d": "Eventos que no pueden ocurrir juntos, así que P(A ∩ B) = 0."}, "inclusion_exclusion":  ]}
];

function heroArt(){const N=500,W=440,H=250,ml=34,mr=14,mt=16,mb=30;let h=0;const pts=[];
  for(let i=1;i<=N;i++){if(Math.random()<.5)h++;pts.push(h/i)}
  const sx=i=>ml+(W-ml-mr)*Math.log(i)/Math.log(N),sy=v=>mt+(H-mt-mb)*(1-v);
  const d=pts.map((v,i)=>(i?'L':'M')+sx(i+1).toFixed(1)+' '+sy(v).toFixed(1)).join('');
  const last=pts[N-1];const chip=T('hero.chip',{v:fmt(last,3),n:N});const cw=Math.max(150,chip.length*7.4+20);
  const grid=[0,.25,.5,.75,1].map(v=>`<line x1="${ml}" x2="${W-mr}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${ml-6}" y="${sy(v)+4}" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">${fmt(v,v%0.5?2:1)}</text>`).join('');
  const xt=[1,10,100,500].map(n=>`<text x="${sx(n)}" y="${H-10}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="var(--muted)">${n}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(T('hero.aria'))}">${grid}${xt}
    <line x1="${ml}" x2="${W-mr}" y1="${sy(.5)}" y2="${sy(.5)}" stroke="var(--amber)" stroke-width="2" stroke-dasharray="5 5"/>
    <path class="draw" d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>
    <circle cx="${sx(N)}" cy="${sy(last)}" r="4.5" fill="var(--accent)"/>
    <rect x="${W-mr-cw}" y="${mt+4}" width="${cw}" height="26" rx="9" fill="var(--accent)"/><text x="${W-mr-cw/2}" y="${mt+21.5}" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="600" fill="var(--accent-ink)" class="chiptx">${esc(chip)}</text>
  </svg><figcaption>${T('hero.caption',{n:N})}</figcaption>`}

/* ---------- PONTE COM AS SIMULAÇÕES ---------- */
let mode='lesson',L=null,freeSim='chance-events',QZ={};
const LAST={};const MEM={};
window.SM_TOPIC='chance-events';
function setSim(id,fresh){window.SM_TOPIC=id;delete LAST[id];if(window.__smSetTopic)window.__smSetTopic(id,fresh)}
let raf=0;
window.smReport=(id,st)=>{
  if(id==='confidence-intervals'&&L&&L.sim===id&&st.sig){const m=MEM[L.id]||(MEM[L.id]={});if(m.sig==null)m.sig=st.sig;else if(st.sig!==m.sig){m.sig=st.sig;m.batches=(m.batches||0)+1}}

function openLesson(id){L=LESSONS.find(l=>l.id===id);mode='lesson';MEM[L.id]={};

function openFree(){mode='free';L=null;showWork();setSim(freeSim,true);setTab(innerWidth<=1000?'lesson':'sim');renderFree();$('#stage').scrollTop=0;
  try{history.replaceState(null,'',(STANDALONE?langHref(LANG):location.pathname+location.search)+'#lab')}catch(e){}}

let goalState=[];const STICK={};
function rng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
/* a resposta certa é sempre o índice 0 nos dados; a ordem exibida é embaralhada de forma fixa por lição */
const qOrder=(id,n)=>shuffle([...Array(n).keys()],rng([...id].reduce((h,c)=>h*31+c.charCodeAt(0),7)));
const CK='<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2.5 6.2l2.3 2.3 4.7-5"/></svg>';
function renderLesson(){const tx=TL(L.id);const tt=TT(L.track);const idx=LESSONS.indexOf(L);const q=QZ[L.id]||{};const lv=TRACKS[L.track].level;
  $('#lesson').innerHTML=`<div class="pad lp"><div class="lmeta"><span>${T('l.track',{i:L.track+1,t:tt.title})}</span><span class="lvl ${lv}">${T('lvl.'+lv)}</span><span>${T('min',{m:L.min})}</span></div>
    <h2>${idx+1}. ${tx.title}</h2><div class="concept">${tx.concept}</div><div class="tip"><b>${T('l.inPractice')}</b>${tx.tip}</div>
    <h3>${T('l.mission')}</h3><ol class="goals" id="goals"></ol>
    <h3>${T('l.check')}</h3><div class="quiz"><p>${tx.quiz.q}</p><div class="opts">${qOrder(L.id,tx.quiz.o.length).map(i=>`<button data-q="${i}" class="${q.pick===i?(i===0?'right':'wrong'):''}" ${q.ok?'disabled':''}>${tx.quiz.o[i]}</button>`).join('')}</div>${q.pick!=null?`<div class="why">${q.pick===0?tx.quiz.why:T('l.notYet')}</div>`:''}</div>
    <div id="donebox"></div>
    <div class="lnav"><button class="btn sm" data-nav="-1" ${idx===0?'disabled':''}>${T('l.prev')}</button><button class="btn sm" data-reset>${T('l.reset')}</button><button class="btn sm ${store.done[L.id]?'pri':''}" data-nav="1" ${idx===LESSONS.length-1?'disabled':''}>${T('l.next')}</button></div></div>`;
  goalState=[];checkGoals()}
function checkGoals(){if(mode!=='lesson'||!L)return;const s=LAST[L.sim];const m=MEM[L.id]||(MEM[L.id]={});const sk=STICK[L.id]||(STICK[L.id]=[]);const tx=TL(L.id);
  const st=L.goals.map((g,i)=>{let v=false;if(s)try{v=!!g(s,m)}catch(e){}return sk[i]=v||!!sk[i]});
  const el=$('#goals');if(!el)return;
  el.innerHTML=tx.goals.map((g,i)=>`<li class="${st[i]?'ok':''}"><span class="ck">${CK}</span><span>${g}</span></li>`).join('');
  st.forEach((v,i)=>{if(v&&goalState.length&&!goalState[i]){toast(T('toast.step',{i:i+1}));if($('#work').dataset.tab==='sim'&&innerWidth<=1000)$('#lessonPip').hidden=false}});goalState=st;maybeComplete()}
function maybeComplete(){const all=goalState.length&&goalState.every(Boolean);const q=QZ[L.id]||{};
  if(all&&q.ok&&!store.done[L.id]){store.done[L.id]=true;const gain=20+(q.first?5:0);store.xp+=gain;save();renderXP();toast(T('toast.done',{xp:gain}));
    document.querySelector('[data-nav="1"]')?.classList.add('pri')}
  const db=$('#donebox');if(!db)return;
  db.innerHTML=store.done[L.id]?`<div class="donebox"><svg width="34" height="34" viewBox="0 0 32 32"><circle cx="16" cy="16" r="15" fill="var(--accent)"/><path d="M9.5 16.5l4.2 4.2 8.8-9.2" fill="none" stroke="var(--accent-ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>${T('l.doneTitle')}</b><br><small>${T('l.doneSub')}</small></div></div>`
    :(all&&!q.ok?`<p class="why">${T('l.needQuiz')}</p>`:(!all&&q.ok?`<p class="why">${T('l.needMission')}</p>`:''))}
$('#lesson').addEventListener('click',e=>{
  if(mode!=='lesson'){const b=e.target.closest('[data-sim]');if(b){freeSim=b.dataset.sim;setSim(freeSim,true);renderFree();$('#stage').scrollTop=0;
    const l=LESSONS.find(x=>x.sim===freeSim);toast(T('toast.lab',{t:TL(l.id).title}));if(innerWidth<=1000)setTab('sim')}return}
  const qb=e.target.closest('[data-q]');if(qb){const i=+qb.dataset.q;const q=QZ[L.id]||(QZ[L.id]={tries:0});q.tries++;q.pick=i;if(i===0){q.ok=true;q.first=q.tries===1}renderLesson();return}

let GQ='',GL='';
function glossItems(){return Object.keys(GLOSS).map(id=>({id,...GT(id),...GLOSS[id]})).sort((a,b)=>a.t.localeCompare(b.t,LOC(),{sensitivity:'base'}))}
const initial=t=>fold(t).replace(/[^a-z]/g,'').charAt(0).toUpperCase()||'#';
function renderGloss(q){if(q!=null)GQ=q;const items=glossItems();const letters=[...new Set(items.map(x=>initial(x.t)))];
  $('#gloss').innerHTML=`<div class="wrap page">
  <section class="phead"><div class="eyebrow">${T('gloss.eyebrow')}</div><h1>${T('gloss.h')}</h1><p>${T('gloss.lead',{n:items.length})}</p></section>

:`set-theory`,title:`Set Theory`,description:`Manipulate interactive Venn diagrams to visualize unions, intersections, complements, and the addition rule.`},{id:`combinatorics`,title:`Counting & Combinatorics`,description:`Compare permutations where sequence order matters versus combinations of unordered subsets.`},{id:`conditional-probability`,title:`Conditional Probability`,description:`Discover Bayes theorem through medical screening tests and understand why base rates deceive human intuition.`}]},{id:`probability-distributions`,number:`03`,title:`Probability Distributions`,subtitle:`Discrete mass functions and continuous density curves`,description:`A probability distribution assigns likelihood to the outcomes of a random variable. We examine discrete distributions through probability mass functions and continuous distributions through smooth density functions and integrated probability areas.`,topics:[{id:`discrete`,title:`Discrete Distributions`,description:`Interact with Bernoulli, Binomial, Geometric, and Poisson models, comparing PMF spikes and CDF steps.`},{id:`continuous`,title:`Continuous Distributions`,description:`Calculate live integrated probability areas under Uniform, Normal, Exponential, and Beta curves.`}]},{id:`frequentist-inference`,number:`04`,title:`Frequentist Inference`,subtitle:`Sampling distributions, confidence intervals, and the bootstrap`,description:`Frequentist inference draws conclusions about unknown population parameters through the hypothetical lens of infinite repeated sampling. Discover the miracle of the Central Limit Theorem and how confidence intervals capture truth.`,topics:[{id:`point-estimation`,title:`Point Estimation & CLT`,description:`Sample from arbitrary parent populations and watch the sampling distribution of the mean morph into a Gaussian curve.`},{id:`confidence-intervals`,title:`Confidence Intervals`,description:`Simulate 100 simultaneous confidence intervals to see how nominal coverage guarantees empirical capture.`},{id:`bootstrap`,title:`The Bootstrap`,description:`Resample with replacement from empirical observations to construct non-parametric standard errors.`}]},{id:`bayesian-inference`,number:`05`,title:`Bayesian Inference`,subtitle:`Prior beliefs, likelihood updates, and posterior certainty`,description:`Bayesian statistics treats probability as a quantified degree of belief. As empirical data is collected, prior probabilities are updated through Bayes formula into posterior distributions that reflect newly synthesized knowledge.`,topics:[{id:`beta-binomial`,title:`Beta-Binomial Conjugacy`,description:`Watch a continuous prior distribution evolve in real time as heads and tails are sequentially flipped.`},{id:`bayes-sandbox`,title:`Bayesian Decision Making`,description:`Compare prior odds and likelihood ratios (Bayes Factors) to compute posterior odds in hypothesis testing.`}]},{id:`regression-analysis`,number:`06`,title:`Regression Analysis`,subtitle:`Ordinary least squares, residual squares, and correlation`,description:`Regression analysis models the relationship between dependent and explanatory variables. Explore ordinary least squares by literally minimizing geometric residual squares and observing Pearson correlation coefficients.`,topics:[{id:`least-squares`,title:`Ordinary Least Squares`,description:`Drag points to watch the best-fit line respond, display physical squared error boxes, or challenge yourself to guess the line.`},{id:`correlation`,title:`Correlation & Scatter`,description:`Explore how Pearson r reflects linear co-dependence, generate target distributions, and analyze variance explained.`}]}],es:[{id:`basic-probability`,number:`01`,title:`Probabilidad Básica`,subtitle:`Eventos aleatorios, esperanza matemática y dispersión`,description:`Este capítulo introduce los conceptos fundamentales de la probabilidad. Explora qué significa la aleatoriedad, cómo las frecuencias relativas se estabilizan tras repetidos ensayos, cómo la esperanza matemática actúa como centro de gravedad y cómo la varianza mide la dispersión espacial.`,topics:[{id:`chance-events`,title:`Eventos Aleatorios`,description:`Simula lanzamientos de monedas y observa la Ley de los Grandes Números a medida que las frecuencias empíricas convergen hacia la probabilidad teórica.`},{id:`expectation`,title:`Esperanza Matemática`,description:`Comprende el valor esperado como el centro de masa físico que equilibra una distribución discreta.`},{id:`variance`,title:`Varianza`,description:`Explora la dispersión visualizando la varianza como cuadrados geométricos físicos alrededor de la media.`}]},{id:`compound-probability`,number:`02`,title:`Probabilidad Compuesta`,subtitle:`Operaciones de conjuntos, combinatoria y razonamiento condicional`,description:`Cuando los eventos se combinan, la teoría de la probabilidad proporciona reglas rigurosas para calcular posibilidades. Investigamos el álgebra de conjuntos con diagramas de Venn interactivos, enumeración combinatoria y probabilidad condicional.`,topics:[{id:`set-theory`,title:`Teoría de Conjuntos`,description:`Manipula diagramas de Venn interactivos para visualizar uniones, intersecciones, complementos y la regla de la suma.`},{id:`combinatorics`,title:`Conteo y Combinatoria`,description:`Compara permutaciones donde el orden importa con combinaciones de subconjuntos sin ordenar.`},{id:`conditional-probability`,title:`Probabilidad Condicional`,description:`Descubre el teorema de Bayes mediante pruebas de detección médica y comprende por qué las tasas base confunden la intuición.`}]},{id:`probability-distributions`,number:`03`,title:`Distribuciones de Probabilidad`,subtitle:`Funciones de masa discretas y curvas de densidad continuas`,description:`Una distribución de probabilidad asigna verosimilitud a los resultados de una variable aleatoria. Examinamos distribuciones discretas mediante funciones de masa y distribuciones continuas mediante funciones de densidad y áreas de probabilidad integrada.`,topics:[{id:`discrete`,title:`Distribuciones Discretas`,description:`Interactúa con modelos Bernoulli, Binomial, Geométrico y Poisson, comparando barras PMF y escalones CDF.`},{id:`continuous`,title:`Distribuciones Continuas`,description:`Calcula en vivo áreas de probabilidad integradas bajo curvas Uniforme, Normal, Exponencial y Beta.`}]},{id:`frequentist-inference`,number:`04`,title:`Inferencia Frecuentista`,subtitle:`Distribuciones muestrales, intervalos de confianza y el bootstrap`,description:`La inferencia frecuentista extrae conclusiones sobre parámetros poblacionales desconocidos a través del muestreo repetido infinito. Descubre el Teorema del Límite Central y cómo los intervalos de confianza capturan la verdad.`,topics:[{id:`point-estimation`,title:`Estimación Puntual y TLC`,description:`Muestrea desde poblaciones arbitrarias y observa cómo la distribución muestral de la media se transforma en una curva Gaussiana.`},{id:`confidence-intervals`,title:`Intervalos de Confianza`,description:`Simula 100 intervalos de confianza simultáneos para ver cómo la cobertura nominal garantiza la captura empírica.`},{id:`bootstrap`,title:`El Bootstrap`,description:`Re-muestrea con reemplazo a partir de observaciones empíricas para construir errores estándar no paramétricos.`}]},{id:`bayesian-inference`,number:`05`,title:`Inferencia Bayesiana`,subtitle:`Creencias a priori, actualización por verosimilitud y certeza posterior`,description:`La estadística bayesiana trata la probabilidad como un grado cuantificado de creencia. A medida que se recopilan datos empíricos, las probabilidades a priori se actualizan mediante la fórmula de Bayes en distribuciones a posteriori.`,topics:[{id:`beta-binomial`,title:`Conjugación Beta-Binomial`,description:`Observa una distribución previa continua evolucionar en tiempo real a medida que se lanzan caras y cruces.`},{id:`bayes-sandbox`,title:`Toma de Decisiones Bayesiana`,description:`Compara chances a priori y razones de verosimilitud (factores de Bayes) para calcular chances a posteriori.`}]},{id:`regression-analysis`,number:`06`,title:`Análisis de Regresión`,subtitle:`Mínimos cuadrados ordinarios, residuos al cuadrado y correlación`,description:`El análisis de regresión modela la relación entre variables explicativas y dependientes. Explora los mínimos cuadrados ordinarios minimizando visualmente los cuadrados de error residual y observando coeficientes de correlación.`,topics:[{id:`least-squares`,title:`Mínimos Cuadrados Ordinarios`,description:`Arrastra puntos para ver cómo responde la recta de mejor ajuste, muestra cajas de error cuadrático o adivina la línea.`},{id:`correlation`,title:`Correlación y Dispersión`,description:`Explora cómo la r de Pearson refleja la codependencia lineal, genera distribuciones objetivo y analiza la varianza explicada.`}]}],"pt-BR":[{id:`basic-probability`,number:`01`,title:`Probabilidade Básica`,subtitle:`Eventos aleatórios, esperança matemática e dispersão`,description:`Este capítulo introduz os conceitos fundamentais da probabilidade. Explora o que significa aleatoriedade, como as frequências relativas se estabilizam em ensaios repetidos, como a esperança atua como centro de massa gravitacional e como a variância mede a dispersão espacial.`,topics:[{id:`chance-events`,title:`Eventos Aleatórios`,description:`Simule lançamentos repetidos de moedas e veja a Lei dos Grandes Números enquanto as frequências empíricas convergem para a probabilidade teórica.`},{id:`expectation`,title:`Esperança Matemática`,description:`Compreenda o valor esperado como o centro de massa físico que equilibra uma distribuição discreta.`},{id:`variance`,title:`Variância`,description:`Explore a dispersão visualizando a variância como quadrados geométricos físicos em torno da média.`}]},{id:`compound-probability`,number:`02`,title:`Probabilidade Composta`,subtitle:`Operações de conjuntos, combinatória e raciocínio condicional`,description:`Quando eventos se combinam, a teoria da probabilidade fornece regras rigorosas para calcular probabilidades. Investigamos álgebra de conjuntos com diagramas de Venn interativos, enumeração combinatória e probabilidade condicional.`,topics:[{id:`set-theory`,title:`Teoria dos Conjuntos`,description:`Manipule diagramas de Venn interativos para visualizar uniões, interseções, complementos e a regra da adição.`},{id:`combinatorics`,title:`Contagem e Combinatória`,description:`Compare permutações onde a ordem importa contra combinações de subconjuntos não ordenados.`},{id:`conditional-probability`,title:`Probabilidade Condicional`,description:`Descubra o teorema de Bayes por meio de testes diagnósticos e entenda por que a taxa basal engana a intuição humana.`}]},{id:`probability-distributions`,number:`03`,title:`Distribuições de Probabilidade`,subtitle:`Funções de massa discreta e curvas de densidade contínua`,description:`Uma distribuição de probabilidade atribui probabilidade aos resultados de uma variável aleatória. Examinamos distribuições discretas por meio de funções de massa e contínuas por meio de funções de densidade e áreas integradas de probabilidade.`,topics:[{id:`discrete`,title:`Distribuições Discretas`,description:`Interaja com os modelos Bernoulli, Binomial, Geométrico e Poisson, comparando barras de PMF e degraus de CDF.`},{id:`continuous`,title:`Distribuições Contínuas`,description:`Calcule em tempo real áreas de probabilidade integradas sob curvas Uniforme, Normal, Exponencial e Beta.`}]},{id:`frequentist-inference`,number:`04`,title:`Inferência Frequentista`,subtitle:`Distribuições amostrais, intervalos de confiança e o bootstrap`,description:`A inferência frequentista tira conclusões sobre parâmetros populacionais desconhecidos por meio da amostragem hipotética repetida ao infinito. Descubra o Teorema do Limite Central e como intervalos de confiança capturam a verdade.`,topics:[{id:`point-estimation`,title:`Estimação Pontual e TLC`,description:`Colete amostras de populações arbitrárias e veja a distribuição amostral da média se transformar em uma curva Gaussiana.`},{id:`confidence-intervals`,title:`Intervalos de Confiança`,description:`Simule 100 intervalos de confiança simultâneos para entender como o nível de cobertura garante a captura empírica.`},{id:`bootstrap`,title:`O Bootstrap`,description:`Reamostre com reposição a partir de observações empíricas para construir erros-padrão não paramétricos.`}]},{id:`bayesian-inference`,number:`05`,title:`Inferência Bayesiana`,subtitle:`Crenças a priori, atualização por verossimilhança e certeza posterior`,description:`A estatística bayesiana trata a probabilidade como um grau quantificado de crença. Conforme dados empíricos são coletados, probabilidades a priori são atualizadas pela fórmula de Bayes em distribuições a posteriori que refletem novo conhecimento.`,topics:[{id:`beta-binomial`,title:`Conjugação Beta-Binomial`,description:`Veja uma distribuição a priori contínua evoluir em tempo real conforme caras e coroas são lançadas sequencialmente.`},{id:`bayes-sandbox`,title:`Tomada de Decisão Bayesiana`,description:`Compare chances a priori e razões de verossimilhança (Fatores de Bayes) para calcular chances a posteriori.`}]},{id:`regression-analysis`,number:`06`,title:`Análise de Regressão`,subtitle:`Mínimos quadrados ordinários, quadrados residuais e correlação`,description:`A análise de regressão modela a relação entre variáveis dependentes e explicativas. Explore mínimos quadrados ordinários minimizando visualmente os quadrados dos erros residuais e observando os coeficientes de correlação de Pearson.`,topics:[{id:`least-squares`,title:`Mínimos Quadrados Ordinários`,description:`Arraste pontos para ver a linha de melhor ajuste responder em tempo real, exiba os quadrados dos resíduos ou tente adivinhar a linha.`},{id:`correlation`,title:`Correlação e Dispersão`,description:`Explore como o r de Pearson reflete a codependência linear, gere distribuições alvo e analise a variância explicada.`}]}]},b={en:{navBasic:`01. Basic Probabili ovável de uma rolagem","es":"Es el resultado más probable de una tirada"},{"en":"It is the long-run average of many rolls","pt":"É a média de longo prazo de muitas rolagens","es":"Es el promedio a largo plazo de muchas tiradas"}],"a":2,"x":{"en":"3.5 is never rolled. It is the balance point of the distribution and the value the average converges to.","pt":"O 3,5 nunca sai no dado. Ele é o ponto de equilíbrio da distribuição e o valor para o qual a média converge.","es":"El 3,5 nunca sale en el dado. Es el punto de equilibrio de la distribución y el valor al que converge el promedio."}},{"l":"l3","t":{"en":"Variance and spread","pt":"Variância e dispersão","es":"Varianza y dispersión"},"q":{"en":"Why does one far-away point raise the variance so much?","pt":"Por que um único ponto distante aumenta tanto a variância?","es":"¿Por qué un solo punto lejano aumenta tanto la varianza?"},"o":[{"en":"Because distances are squared, so large deviations count much more","pt":"Porque as distâncias são elevadas ao quadrado, então desvios grandes contam muito mais","es":"Porque las distancias se elevan al cuadrado, así que las desviaciones grandes cuentan mucho más"},{"en":"Because variance only looks at the largest value","pt":"Porque a variância só olha para o maior valor","es":"Porque la varianza solo mira el valor más grande"},{"en":"Because it changes the number of points","pt":"Porque ele muda o número de pontos","es":"Porque cambia el número de puntos"}],"a":0,"x":{"en":"A point 4 units away contributes 16, while one 1 unit away contributes only 1. Squaring amplifies large deviations.","pt":"Um ponto a 4 unidades contribui com 16, enquanto um a 1 unidade contribui com 1. O quadrado amplifica os desvios grandes.","es":"Un punto a 4 unidades aporta 16, mientras que uno a 1 unidad aporta solo 1. El cuadrado amplifica las desviaciones grandes."}},{"l":"l2","t":{"en":"Expected value","pt":"Valor esperado","es":"Valor esperado"},"q":{"en":"What is the expected value of the sum of her 3 pessoas entre 5 para uma comissão sem cargos: permutações ou combinações?","es":"Elegir 3 personas de 5 para un comité sin cargos: ¿permutaciones o combinaciones?"},"o":[{"en":"Permutations, because each person is different","pt":"Permutações, porque cada pessoa é diferente","es":"Permutaciones, porque cada persona es diferente"},{"en":"Neither, you just multiply 5 × 3","pt":"Nenhuma das duas, basta multiplicar 5 × 3","es":"Ninguna, basta multiplicar 5 × 3"},{"en":"Combinations, because the order of selection does not matter","pt":"Combinações, porque a ordem de escolha não importa","es":"Combinaciones, porque el orden de elección no importa"}],"a":2,"x":{"en":"Without roles, {Ana, Bia, Caio} is the same committee in any order: 5C3 = 10. With roles it would be 5P3 = 60.","pt":"Sem cargos, {Ana, Bia, Caio} é a mesma comissão em qualquer ordem: 5C3 = 10. Com cargos seriam 5P3 = 60.","es":"Sin cargos, {Ana, Bea, Carlos} es el mismo comité en cualquier orden: 5C3 = 10. Con cargos serían 5P3 = 60."}},{"l":"l6","t":{"en":"Conditional probability and Bayes","pt":"Probabilidade condicional e Bayes","es":"Probabilidad condicional y Bayes"},"q":{"en":"A test is 95% sensitive, but the disease affects 2% of people. Why can most positives be false?","pt":"Um exame tem 95% de sensibilidade, mas a doença atinge 2% das pessoas. Por que a maioria dos positivos pode ser falsa?","es":"Una prueba tiene 95% de sensibilidad, pero la enfermedad afecta al 2% de las personas. ¿Por qué la mayoría de los positivos puede ser falsa?"},"o":[{"en":"Because the test is broken","pt":"Porque o exame está com defeito","es":"Porque la prueba está defectuosa"},{"en":"Because sensitivity and P(sick | +) are always equal","pt":"Porque a sensibilidade e P(doente | +) são sempre iguais","es":"Porque la sensibilidad y P(enfermo | +) siempre son iguales"},{"en":"Because the healthy group is so large that its few false alarms outnumber the true positives","pt":"Porque o grupo saudável é tão grande que s mial conta sucessos num número fixo de ensaios; a Geométrica conta quanto tempo você espera pelo primeiro.","es":"La Binomial cuenta éxitos en un número fijo de ensayos; la Geométrica cuenta cuánto esperas hasta el primero."}},{"l":"l8","t":{"en":"Continuous distributions","pt":"Distribuições contínuas","es":"Distribuciones continuas"},"q":{"en":"For a continuous variable, what is P(X = 1.5 exactly)?","pt":"Para uma variável contínua, quanto vale P(X = 1,5 exatamente)?","es":"Para una variable continua, ¿cuánto vale P(X = 1,5 exactamente)?"},"o":[{"en":"Zero: only intervals have positive probability","pt":"Zero: só intervalos têm probabilidade positiva","es":"Cero: solo los intervalos tienen probabilidad positiva"},{"en":"It depends on the sample size","pt":"Depende do tamanho da amostra","es":"Depende del tamaño de la muestra"},{"en":"The height of the curve at 1.5","pt":"A altura da curva em 1,5","es":"La altura de la curva en 1,5"}],"a":0,"x":{"en":"A single point has no width, so its area is zero. The curve's height is a density, not a probability.","pt":"Um ponto não tem largura, então sua área é zero. A altura da curva é uma densidade, não uma probabilidade.","es":"Un punto no tiene anchura, así que su área es cero. La altura de la curva es una densidad, no una probabilidad."}},{"l":"l8","t":{"en":"Continuous distributions","pt":"Distribuições contínuas","es":"Distribuciones continuas"},"q":{"en":"About what share of a normal distribution lies between μ − σ and μ + σ?","pt":"Que fração aproximada de uma normal fica entre μ − σ e μ + σ?","es":"¿Qué fracción aproximada de una normal queda entre μ − σ y μ + σ?"},"o":[{"en":"50%","pt":"50%","es":"50%"},{"en":"95%","pt":"95%","es":"95%"},{"en":"68%","pt":"68%","es":"68%"}],"a":2,"x":{"en":"The 68–95–99.7 rule: 68% within 1σ, 95% within 2σ, 99.7% within 3σ.","pt":"Regra 68–95–99,7: 68% em 1σ, 95% em 2σ, 99,7% em 3σ.","es":"Regla 68–95–99,7: 68 % en 1σ, 95 % en 2σ, 99,7 % en 3σ."}},{"l":"l9","t":{"en":"Sampling distribution and the CLT","pt":"Distribuição amostral e o TLC","es":"Distribución muestral y el TLC"},"q":{"en":"What happens to the spread of the sample means when n grows from 4 to 64?","pt":"O que acontece com a dispersão das médias amostrais quando n passa de 4 para 64?","es":"¿Qué le pasa a la dispersión de las medias muestrales cuando n pasa de 4 a 64?"},"o":[{"en":"It shrinks, because the standard error σ/√n gets 4 times smaller","pt":"Diminui, porque o erro padrão σ/√n fica 4 vezes menor","es":"Disminuye, porque el error estándar σ/√n se vuelve 4 veces menor"},{"en":"It grows, because there are more data","pt":"Aumenta, porque há mais dados","es":"Aumenta, porque hay más datos"},{"en":"It stays the same, it only depends on the population","pt":"Fica igual, só depende da população","es":"Se mantiene, solo depende de la población"}],"a":0,"x":{"en":"√64 / √4 = 4, so the standard error falls to a quarter. Bigger samples give more precise means.","pt":"√64 / √4 = 4, então o erro padrão cai para um quarto. Amostras maiores dão médias mais precisas.","es":"√64 / √4 = 4, así que el error estándar cae a la cuarta parte. Muestras más grandes dan medias más precisas."}},{"l":"l10","t":{"en":"Confidence intervals","pt":"Intervalos de confiança","es":"Intervalos de confianza"},"q":{"en":"What does “95% confidence” mean?","pt":"O que significa “95% de confiança”?","es":"¿Qué significa “95% de confianza”?"},"o":[{"en":"95% of the data fall inside the interval","pt":"95% dos dados caem dentro do intervalo","es":"El 95% de los datos cae dentro del intervalo"},{"en":"95% of intervals built this way contain the true mean","pt":"95% dos intervalos construídos dessa forma contêm a média verdadeira","es":"El 95% de los intervalos construidos así contienen la media verdadera"},{"en":"There is a 95% chance that μ is in this specific interval","pt":"Há 95% de chance de μ estar neste intervalo específico","es":"Hay un 95% de probabilidad de que μ esté en este intervalo concreto"}],"a":1,"x":{"en":"The 95% describes the long-run success rate of the procedure. A computed interval is fixed: it contains μ or it does not.","pt":"Os 95% descrevem a taxa de acerto do procedimento no longo prazo. Um intervalo já calculado é fixo: contém μ ou não.","es":"El 95% describe la tasa de acierto del procedimiento a largo plazo. Un intervalo ya calculado es fijo: contiene μ o no."}},{"l":"l11","t":{"en":"The bootstrap","pt":"O bootstrap","es":"El bootstrap"},"q":{"en":"Why must the bootstrap resample WITH replacement?","pt":"Por que o bootstrap precisa reamostrar COM reposição?","es":"¿Por qué el bootstrap debe remuestrear CON reemplazo?"},"o":[{"en":"To make the computation faster","pt":"Para o cálculo ficar mais rápido","es":"Para que el cálculo sea más rápido"},{"en":"Because the original data are wrong","pt":"Porque os dados originais estão errados","es":"Porque los datos originales están mal"},{"en":"Without replacement every resample would be the original sample, with the same mean","pt":"Sem reposição, toda reamostragem seria a amostra original, com a mesma média","es":"Sin reemplazo, cada remuestreo sería la muestra original, con la misma media"}],"a":2,"x":{"en":"Drawing n out of n without replacement just reshuffles the same values. Replacement creates variation that mimics new samples.","pt":"Sortear n entre n sem reposição só embaralha os mesmos valores. A reposição cria variação que imita novas amostras.","es":"Sacar n de n sin reemplazo solo reordena los mismos valores. El reemplazo crea variación que imita nuevas muestras."}},{"l":"l10","t":{"en":"Confidence intervals","pt":"Intervalos de confiança","es":"Intervalos de confianza"},"q":{"en":"If the sample size is multiplied by 4, the width of the confidence interval…","pt":"Se o tamanho da amostra é multiplicado por 4, a largura do intervalo de confiança…","es":"Si el tamaño de la muestra se multiplica por 4, el ancho del intervalo de confianza…"},"o":[{"en":"stays the same","pt":"fica igual","es":"se mantiene igual"},{"en":"is divided by 4","pt":"é dividida por 4","es":"se divide por 4"},{"en":"is cut in half","pt":"cai pela metade","es":"se reduce a la mitad"}],"a":2,"x":{"en":"The width depends on 1/√n, and √4 = 2.","pt":"A largura depende de 1/√n, e √4 = 2.","es":"El ancho depende de 1/√n, y √4 = 2."}},{"l":"l12","t":{"en":"Prior and posterior: Beta-Binomial","pt":"Priori e posteriori: Beta-Binomial","es":"A priori y a posteriori: Beta-Binomial"},"q":{"en":"Why does the strong fair prior Beta(20, 20) resist the data at first?","pt":"Por que a priori forte e honesta Beta(20, 20) resiste aos dados no começo?","es":"¿Por qué la a priori fuerte y justa Beta(20, 20) resiste a los datos al principio?"},"o":[{"en":"Because Beta priors cannot change","pt":"Porque prioris Beta não podem mudar","es":"Porque las a priori Beta no pueden cambiar"},{"en":"It already counts as 40 imaginary flips, so a few real flips barely move it","pt":"Ela já vale por 40 lançamentos imaginários, então poucos lançamentos reais quase não a movem","es":"Ya equivale a 40 lanzamientos imaginarios, así que pocos lanzamientos reales apenas la mueven"},{"en":"Because the data are ignored in Bayesian inference","pt":"Porque os dados são ignorados na inferência bayesiana","es":"Porque en la inferencia bayesiana se ignoran los datos"}],"a":1,"x":{"en":"Beta(α, β) acts like α + β prior observations. With 300 real flips, the data outweigh those 40 and pull the posterior toward 0.65.","pt":"Beta(α, β) funciona como α + β observações prévias. Com 300 lançamentos reais, os dados pesam mais que esses 40 e puxam a posteriori para 0,65.","es":"Beta(α, β) actúa como α + β observaciones previas. Con 300 lanzamientos reales, los datos pesan más que esos 40 y llevan la a posteriori hacia 0,65."}},{"l":"l13","t":{"en":"Bayes factors","pt":"Fatores de Bayes","es":"Factores de Bayes"},"q":{"en":"Prior odds are 1:4 and the Bayes factor is 8. What are the posterior odds?","pt":"As chances a priori são 1:4 e o fator de Bayes é 8. Quais são as chances a posteriori?","es":"Los momios a priori son 1:4 y el factor de Bayes es 8. ¿Cuáles son los momios a posteriori?"},"o":[{"en":"8:4, the same as before","pt":"8:4, as mesmas de antes","es":"8:4, los mismos que antes"},{"en":"1:32","pt":"1:32","es":"1:32"},{"en":"2:1","pt":"2:1","es":"2:1"}],"a":2,"x":{"en":"Posterior odds = prior odds × BF = (1/4) × 8 = 2, that is, 2:1 in favor of H₁.","pt":"Chances a posteriori = chances a priori × BF = (1/4) × 8 = 2, ou seja, 2:1 a favor de H₁.","es":"Momios a posteriori = momios a priori × BF = (1/4) × 8 = 2, es decir, 2:1 a favor de H₁."}},{"l":"l14","t":{"en":"Least squares regression","pt":"Regressão por mínimos quadrados","es":"Regresión por mínimos cuadrados"},"q":{"en":"What does OLS minimize?","pt":"O que os mínimos quadrados minimizam?","es":"¿Qué minimizan los mínimos cuadrados?"},"o":[{"en":"The number of points above the line","pt":"O número de pontos acima da reta","es":"El número de puntos por encima de la recta"},{"en":"The slope of the line","pt":"A inclinação da reta","es":"La pendiente de la recta"},{"en":"The sum of the squared vertical distances from the points to the line","pt":"A soma das distâncias verticais ao quadrado entre os pontos e a reta","es":"La suma de las distancias verticales al cuadrado entre los puntos y la recta"}],"a":2,"x":{"en":"OLS minimizes SSE = Σ(yᵢ − ŷᵢ)². That is why the squares in the chart get as small as possible in total.","pt":"O método minimiza SSE = Σ(yᵢ − ŷᵢ)². Por isso os quadrados do gráfico ficam, no total, os menores possíveis.","es":"El método minimiza SSE = Σ(yᵢ − ŷᵢ)². Por eso los cuadrados del gráfico quedan, en total, lo más pequeños posible."}},{"l":"l15","t":{"en":"Correlation","pt":"Correlação","es":"Correlación"},"q":{"en":"The points form a perfect U shape and r ≈ 0. What can you conclude?","pt":"Os pontos formam um U perfeito e r ≈ 0. O que se pode concluir?","es":"Los puntos forman una U perfecta y r ≈ 0. ¿Qué puedes concluir?"},"o":[{"en":"There is a strong relationship, but it is not linear","pt":"Há uma relação forte, mas não linear","es":"Hay una relación fuerte, pero no lineal"},{"en":"x and y are independent","pt":"x e y são independentes","es":"x e y son independientes"},{"en":"The data contain an error","pt":"Os dados contêm um erro","es":"Los datos tienen un error"}],"a":0,"x":{"en":"r measures only linear association. A U-shape has a clear relationship whose positive and negative slopes cancel out.","pt":"r mede só associação linear. Um U tem uma relação clara cujas inclinações positiva e negativa se anulam.","es":"r solo mide asociación lineal. Una U tiene una relación clara cuyas pendientes positiva y negativa se anulan."}},{"l":"l14","t":{"en":"Least squares regression","pt":"Regressão por mínimos quadrados","es":"Regresión por mínimos cuadrados"},"q":{"en":"The fitted line is y = 2 + 3x. What happens to y, on average, when x increases by 1?","pt":"A reta ajustada é y = 2 + 3x. O que acontece com y, em média, quando x aumenta 1?","es":"La recta ajustada es y = 2 + 3x. ¿Qué le pasa a y, en promedio, cuando x aumenta 1?"},"o":[{"en":"It increases by 5","pt":"Aumenta 5","es":"Aumenta 5"},{"en":"It increases by 3","pt":"Aumenta 3","es":"Aumenta 3"},{"en":"It increases by 2","pt":"Aumenta 2","es":"Aumenta 2"}],"a":1,"x":{"en":"The slope is 3: each extra unit of x adds 3 to the predicted y.","pt":"A inclinação é 3: cada unidade a mais de x soma 3 ao y previsto.","es":"La pendiente es 3: cada unidad más de x suma 3 a la y prevista."}}]};

<script data-micro-foot>
/* .Micro footer line (standard 5.3, 2026-11-04): "Part of MicroLearn.website" as the last line of the footer, linking to the portal.
   Link: "/" (site and microlearn.website.html) · "microlearn.website.html" (offline package, file://) · inside an embed, data-micro-nav sends it to the Google Sites home page.
   Hides the old "Part of the Microlearn network" badge and any other portal link in the footer, so the portal is mentioned once. */
(function () {
  if (window.MicroFoot) return;
  var TX = { en: "Part of", pt: "Parte do", es: "Parte de" };
  var HREF = location.protocol === "file:" ? "microlearn.website.html" : "/";
  var st = document.createElement("style");
  st.textContent = ".mf-line{display:block!important;width:100%;box-sizing:border-box;margin:14px 0 0!important;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))!important;text-align:center!important;font:400 .85rem/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif!important;opacity:.78;color:inherit;clear:both;order:9999}" +
    ".mf-line a{color:var(--mf-acc,inherit)!important;font-weight:600;text-decoration:none!important}.mf-line a:hover,.mf-line a:focus-visible{text-decoration:underline!important}" +
    "footer.mf-own{display:block;border:0;background:none}";
  document.head.appendChild(st);
  function lang() { var l = (document.documentElement.lang || "en").slice(0, 2).toLowerCase(); return TX[l] ? l : "en"; }
  function vis(el) { return !!(el.offsetParent || el.getClientRects().length); }
  function isPortal(a) {
    var h = (a.getAttribute("href") || "").trim();
    if (/^(\/|\.\/|\.\.\/|\.\.\/\.\.\/|\/(pt|es)\/?|microlearn\.website\.html)(#.*)?$/i.test(h)) return true;
    return /^https?:\/\/(www\.)?microlearn\.website\/?(#.*)?$/i.test(h) || /^https?:\/\/(www\.)?learnware\.online/i.test(h);
  }
  function hide(el) { if (el.getAttribute("data-mf-old") == null) { el.setAttribute("data-mf-old", ""); el.style.setProperty("display", "none", "important"); } }
  function cleanOld(f) {
    [].forEach.call(f.querySelectorAll('[class*="lw-"],[id^="lw-"],[data-lw]'), function (el) { if (!el.closest(".mf-line")) hide(el); });
    [].forEach.call(f.querySelectorAll("a[href]"), function (a) {

        }

  }

    var fs = [].filter.call(document.querySelectorAll("footer"), function (f) { return !f.closest("nav") && !f.closest("[data-micro-nano-view],.mn-in"); });
    var v = fs.filter(vis);
    if (v.length) return v[v.length - 1];
    if (fs.length) return fs[fs.length - 1];
    var own = document.querySelector("footer.mf-own");
    if (!own) { own = document.createElement("footer"); own.className = "mf-own"; }
    var ms = [].filter.call(document.querySelectorAll("main"), vis), m = ms[ms.length - 1] || document.body;
    if (own.parentNode !== m || m.lastElementChild !== own) m.appendChild(own);
    return own;
  }

    var on = document.querySelector("nav .mstd-on") || document.querySelector("nav .mstd-item");

      if (!line) line = make();

      [].forEach.call(document.querySelectorAll("footer"), cleanOld);

    } finally { setTimeout(function () { busy = false; }, 0); }
  }
  var q = 0;
  function later() { if (q) return; q = setTimeout(function () { q = 0; ensure(); }, 60); }
  function start() {
    ensure();
    new MutationObserver(later).observe(document.body, { childList: true, subtree: true });
    new MutationObserver(later).observe(document.documentElement, { attributes: true, attributeFilter: ["lang", "data-theme", "class"] });

  }

})();
